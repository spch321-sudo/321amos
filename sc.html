們住撒馬利亞山如巴珊母牛的啊。「母牛」是陰性複數，後面的動詞也是陰性複數。這是在說撒馬利亞富有的婦女，還是用陰性來比喻整個安逸的上層？這個問題，會影響我們怎樣講這一節，也會影響聽的人感覺被指責，還是被警醒。","pos":[["富有的婦女","","經文的語法全是陰性，「家主」又是她們所依靠的人；有人認為，阿摩司直接對撒馬利亞上層社會的婦女說話，她們用丈夫的權勢，推動剝削窮人的做法。"],["整個安逸的上層","","有人認為陰性複數是一個比喻，包括有權有勢的男人；巴珊的肥畜，比喻過得舒服、不顧窮人的人，並不限於哪一種性別。"],["經文沒有說死","","經文只描寫他們所做的：欺負貧寒的、壓碎窮乏的、只顧喝酒；沒有說明具體是誰，我們不能確定。"]],"con":[],"say":"本講義不替任何一群人貼標籤，也不把這節經文當成貶低女性或任何一個群體的話。我們守住經文給的事實：神叫過得安逸、卻壓碎窮人的人來聽；神先看見了被欺負的人。","care":"如果你曾被人用「像巴珊的母牛」這類話貶低，或因為性別被貼標籤，請記得：這一節不是在說一個性別壞，而是在說一種欺壓。如果你是曾經被欺負、被壓碎的人，這一節先是對你說：神看見了，祂記得，祂為你起誓；不要先急著論斷誰，先讓自己被神看見。"},{"id":"ISS04_2","t":"4:4--5：阿摩司叫人「任你們」去獻祭，是在反對敬拜嗎？","r":"4:4--5","ch":[4],"why":"阿摩司說：任你們往伯特利去犯罪，到吉甲加增罪過；每日早晨獻上你們的祭物。這句話像是在鼓勵他們獻祭，又像是在諷刺。他是在反對獻祭制度本身，還是在反對某一種敬拜？這個問題與全卷議題公義與敬拜：神厭惡的是敬拜本身嗎？有關，第五章還要再講；本章先講這一段的用法。","pos":[["反對祭祀本身","","有人認為，阿摩司全面否定伯特利與吉甲的獻祭；神根本不要這些祭物。"],["反對沒有生命的敬拜","","有人認為，阿摩司用祭司召人敬拜的口吻，諷刺人只顧著獻祭，不顧公義，也不顧與神的關係；經文最後的理由是「因為是你們所喜愛的」，焦點在動機。"],["反諷的邀請","","也有人認為，這是用反話說的邀請：你們愛去，就去吧，看看這樣能走到哪裡；重點是：你們若不回頭，這些祭物救不了你們。"]],"con":[],"say":"本章怎麼講：阿摩司不是反對敬拜，是反對與公義分開、只為自己所喜愛的敬拜；這與全卷議題公義與敬拜：神厭惡的是敬拜本身嗎？的立場一致，第五章21至24節還要再把兩面並陳。我們不用這一段，去否定任何一位認真敬拜的人，也不用它，去取代敬拜。","care":"如果你是一位很認真敬拜、很熱心奉獻的人，聽到這一段可能會很不安，覺得自己是不是做錯了。請你不要急著否定自己的敬拜，而是安靜問一句：我來到神面前，是為了祂，還是為了我所喜愛的？如果你曾在教會裡被人用「你只是做表面」這類話批評，請記得，這一段不是用來指責某一位弟兄姊妹的熱心。"},{"id":"ISS04_3","t":"4:6--11：每一次缺乏與災難，都是神為罪降下的嗎？","r":"4:6--11","ch":[4],"why":"神說：我使你們牙齒乾淨，我使雨停止，我降瘟疫。五次災，神都說「我」。這是不是說，今天我們遇見的每一場災難、疾病、歉收，都是神為了某個人的罪降下的？這個問題，對正在受苦的人，影響很大。","pos":[["災難就是懲罰","","有人把這段話，直接推到今天，認為每一次災難，都是神對罪的審判；人應該反省，找出背後的罪。"],["神對那一群人的解釋","","有人認為，這是神藉先知，對北國那一群人所作的解釋；經文本身沒有說，所有的災都是這樣的因果；阿摩司書以外，約伯記與耶穌（約9章）都反對把每一個苦難直接連到某個人的罪。"],["兩面並陳","","也有人說：有些時候，缺乏是神說話的方式；但我們不能反過來，把每一個缺乏，都當成神對某個人的懲罰。"]],"con":[],"say":"本講義採第二、三種的合併：這段經文是神對那一群人所作的解釋，目的是叫人回頭，不是為每一場災難下結論。對今天的受苦者，我們先陪伴，不替他找原因；對自己，我們可以問：神有沒有在這個缺乏裡，對我說話？","care":"如果你正在疾病、失業、歉收、失去親人的痛裡，請不要對自己說：一定是我做錯了什麼。這一章沒有說你的苦是你的罪。如果有人對你說「這是神在管教你」，而你因此更怕、更自責，請你告訴一位信得過的人，也可以尋求牧者或專業的協助。我們先陪你，不急著解釋。"},{"id":"ISS05_1","t":"5:21--24：神厭惡的，是敬拜本身，還是沒有公義的敬拜？","r":"5:21--24","ch":[5],"why":"神說：我厭惡你們的節期，我不聽你們彈琴的響聲；又說：惟願公平如大水滾滾。這幾句話，常被讀成「神不要敬拜」，也常被讀成「公義比敬拜重要」。這一段到底在說什麼？這一題與全卷議題〈公義與敬拜：神厭惡的是敬拜本身嗎？〉相連，這裡只談本章的這四節怎麼讀。","pos":[["神反對獻祭與節期本身","","有人認為先知是在否定整個祭祀制度，主張神只要倫理，不要儀式。這個讀法，要面對利未記裡神親自設立祭祀與節期，以及詩篇裡神喜悅人歌唱的事實。"],["神只反對沒有公義的敬拜","","神厭惡的，是離開了公平與公義的敬拜；「你們的」節期，是指他們現在所過的樣子。五章14至15節同時呼召人求善、秉公行義，沒有廢止敬拜。"],["公義比敬拜更重要，可以取代敬拜","","有人把二十四節單獨抽出來，當成公義優先、敬拜次要的宣言。本節在「我厭惡」「我不聽」之後，它說的是神的心願，並沒有說敬拜可以被取代。"]],"con":[],"say":"本講義取第二種：兩面並陳。一面，神喜悅敬拜，不叫人廢掉；另一面，神不要一個與城門口、貧民、義人斷了線的敬拜。公平與公義，不是敬拜的替代品，是敬拜長出來的果子。本章怎麼講：先讓人聽見神的厭惡，再讓人聽見神的心願，最後，把兩件事放回同一條河。","care":"對正在教會裡受傷的人：你可能曾在一個唱得很用力、卻沒有人看見你的聚會裡，覺得被冷落、被傷害。這一章不是叫你離開敬拜，是告訴你：神看見了。對正在擔心自己敬拜不夠好的人：這一章不是在挑剔你的歌聲，是邀請你把完整的人，帶到神面前。對事奉的人：不用急著審判別人，先問自己：我帶到神面前的，是同一個我嗎？"},{"id":"ISS05_2","t":"5:18--20：他們想望的「耶和華的日子」，錯在哪裡？","r":"5:18--20","ch":[5],"why":"百姓盼望耶和華的日子來到，阿摩司卻說：有禍了，那日黑暗沒有光明。這個「日子」，是什麼意思？是百姓所以為的得勝與光明，還是別的？這一題與全卷議題〈「耶和華的日子」（5:18--20）是推算末世的時間表嗎？〉相連，這裡只談本章這三節，不談時間表。","pos":[["神為百姓爭戰、得勝的日子","","有學者認為，百姓想望的，是耶和華為他們爭戰、擊敗仇敵的日子；阿摩司把這個盼望翻轉：那日也可以對自己的百姓是審判。"],["與聖殿節期相關的日子","","也有學者從節期與敬拜的背景來理解這個詞；因為這一段緊接著談節期，這個讀法有它的考慮，但經文並沒有明說。"],["一個推算末世的時間表","","有人把這一段當作末世日程的一部分。這一段是對當時百姓說的話，沒有給任何日期，也沒有要人推算。"]],"con":[],"say":"本講義不需要在前兩種背景之間定案：不論哪一種，重點都是阿摩司聽見的盼望：那日必然站在我們這邊；而神的話是：那日是黑暗。本章不推算日子，也不排時間；只問今天：我盼望的神，是真的神嗎？我今天的生活，經得起祂來嗎？本章怎麼講：把一個遙遠的日子，帶回今天的城門口。","care":"對常常活在懼怕裡的人：這一段是對那些一邊盼望神、一邊壓人的人說的警告，不是對正在尋求神、仍然軟弱的你說的恐嚇。本章的邀請，是「你們要尋求我，就必存活」。對熱衷研究末世的人：請把力氣放在今天的悔改與愛人上。對正在受苦的人：神沒有把你的苦，當成一道題目來考你。"},{"id":"ISS05_3","t":"5:25--27：「曠野四十年」與星神的名字，我們可以確定什麼？","r":"5:25--27","ch":[5],"why":"二十五節的問句、二十六節的神名（Sikkuth、Kiyyun），以及二十七節的「大馬士革以外」，在徒7:42--43被引用時，有不同的字句：「摩洛」「理番神的星」「巴比倫」。這些差異，會不會動搖經文？我們可以確定什麼，不能確定什麼？","pos":[["二十五節的答案是「沒有」","","曠野四十年，神與百姓的關係，從來不是靠祭物維持；神藉此提醒他們，敬拜的本質在別處。"],["二十五節的答案是「有，但帶著別的神」","","百姓在曠野曾獻祭，卻同時抬著別的神；二十六節接著說的，是他們所抬的。徒7:42--43的引用，接近這個讀法。"],["神名的讀法與動詞時態仍有爭論","","Sikkuth 與 Kiyyun 可能是星神的名字，也可能有別的讀法；「你們抬著」可以是過去，也可以是將來。不同的譯本，有不同的選擇。"]],"con":[],"say":"本講義把問題留在這裡，不替神名下定論，也不把一種讀法說成唯一。可以確定的是：他們有「為自己所造」的神；可以確定的是：人若不尋求神，就去造神；可以確定的是：神的話，用審判叫人回頭。徒7:42--43是新約作者自己的引用，我們照新約自己的說法讀，不另外延伸，不拿它論斷任何現代的國家。","care":"對擔心「聖經有差異，是不是不可靠」的人：翻譯與引用的差異，是學者誠實面對的功課，並沒有動搖這一章的重點。你可以帶著問題，繼續讀。對正在經歷失去家園、被迫離開的人：這一段說的是古代北國的歷史，我們不拿它去解釋你今天的苦難，也不說「這是神的審判」；我們先陪你，為你哀哭。"},{"id":"ISS06_1","t":"6:4--6：神責備的是享受本身嗎？","r":"6:4--6","ch":[6],"why":"象牙床、羊羔、大碗酒、上等的油、琴與歌，這一段列了一長串享受。有人讀了，覺得好日子本身就有罪；也有人覺得這一段與自己無關，因為自己沒有象牙床。這個問題，會影響我們怎樣對待自己、也怎樣對待別人的生活。","pos":[["享受本身就有罪","","有人把這一段讀成對奢華的全面禁止，主張信徒應當盡量簡樸、不要享受；他們看見的是：享受容易使人忘記神。"],["責備的是麻木與倚靠","","這一段沒有一樣被定為罪，真正的轉折在6節的「卻」：卻不為約瑟的苦難擔憂。神責備的是舒身、消閑、為自己，以及心不再被別人的痛碰到。"],["只是描寫當時的時代背景","","也有人主張這一段只是寫當時北國貴族的生活，與今日無直接關係；這樣讀，可以避免誤用，卻容易使這一段失去對我們的提問。"]],"con":[],"say":"本講義站在第二種：享受不是罪，麻木才是。經文沒有叫人睡硬板床，也沒有計算誰擁有多少；它只問：我的享受，有沒有留一個出口，讓我能為別人的痛，有一點感覺？提前6:17也說，神厚賜百物給我們享受，只是不要倚靠無定的錢財。","care":"不要用這一段，去論斷任何一個家庭的餐桌、旅行或房子；也不要讓一位已經很辛苦、很少享受的人，再多背一層罪咎。對正在匱乏、被欺壓的人，請先聽見：神哀哭的，不是你，是那個心已經麻木的人；祂站在你這一邊。對自己過得不錯、又怕自己麻木的人，不必急著自責，先對神說：求祢醫治我的心，讓我再有感覺。"},{"id":"ISS06_2","t":"6:10：「不可提耶和華的名」是什麼意思？","r":"6:10--10","ch":[6],"why":"房子裡剩下的人說：不要作聲，因為我們不可提耶和華的名。經文沒有解釋原因。是怕提起神的名，災禍又來嗎？是悲痛到說不出口嗎？還是對神已經不再相信？這是一個很難的畫面，也最容易被誤用。","pos":[["出於懼怕","","剩下的人怕一提神的名，就引來再一次的審判；這是把神的名當成會招來災禍的東西，在舊約的背景下，有些解經家這樣讀。"],["出於悲痛與失去聲音","","他們痛到連禱告也不敢、不能；這一句是一個沉默的畫面，代表審判之後，連呼求的力氣都沒有了。"],["出於不信或不再呼求","","也有解經家認為，這是對神已經失去信心，不再願意向祂求；這是一種屬靈上的絕望。"],["經文沒有說明","","原文只是記下這句話，沒有交代說話者的心；字也有難解之處（例如「燒他屍首的」只出現一次）。"]],"con":[],"say":"本講義陳列各家，不替說話的人定論。我們看見的是：這是一群失去聲音的人；先知留給我們的，是一個沉默，不是一個結論。因此我們不用這一段嚇唬會眾，也不用它解釋今日任何一場災難。","care":"若有人正在喪慟中、或剛失去親人，請不要對他說「這是審判」，也不要要求他現在就禱告。陪伴與保護受傷的人優先：安靜坐在他身邊，讓他知道，有人會替他守住神的名，等他有力氣的時候再開口。若他說不出話，不要催，也不要急著給解釋。"},{"id":"ISS06_3","t":"6:12：公平變成苦膽，是不是只在講社會公義？","r":"6:12--13","ch":[6],"why":"6章12節說：你們卻使公平變為苦膽，使公義的果子變為茵蔯。有人因此把整卷阿摩司書當成社會改革的宣言；也有人怕這樣講太「政治」，乾脆略過這一節。全卷議題阿摩司書是社會革命的宣言嗎這一題在這一章，也有一個回應。","pos":[["社會公義就是這一章的全部","","把公平與公義，讀成社會制度與資源分配的要求，主張教會應當優先參與改革；他們看見的是欺壓窮人的真實痛苦。"],["只是個人靈性，與社會無關","","把這一節讀成只談內心的屬靈狀態，認為公平公義與社會處境無關；這會使受欺壓的人，在教會裡得不到保護。"],["公義是認識神所長出的果子","","6節的麻木、8節的起誓、12節的毒草、13節的自誇，連在一起讀：公平與公義是一棵樹的果子，根是認識神；不認識神，再多的行動，也會變成另一種自誇。"]],"con":[],"say":"本講義站在第三種，並回到全卷議題阿摩司書是社會革命的宣言嗎這一題：本章怎麼講，公義的果子，出於認識神，不取代敬拜，也不是一場運動。5章21到24節的兩面並陳，在這裡仍然成立：神要的，是有生命、有公義的敬拜。我們不用這一節，去支持或反對任何現代的政黨、國家或領袖。","care":"若你正在被欺壓、被剝削，請先聽見：神說「有禍了」的對象，不是你，是坐在位上行強暴的人；你的痛，神看見，也會替你哀哭。若你自己坐在某個位子上，請安靜問一句：我怎樣使用它？不需要先在人前認罪，先對神說實話。不要在小組裡指名任何一位弟兄姊妹，說他是欺壓人的人。"},{"id":"ISS07_1","t":"7:3，6：神真的因為阿摩司的禱告而「後悔」嗎？","r":"7:1--6","ch":[7],"why":"阿摩司兩次說：求你赦免，求你止息；兩次經文都說：耶和華就後悔。這是不是說，神改變了祂的心意？如果是，禱告就能改變審判；如果不是，禱告又有什麼用？這個問題，不只是學者的問題，也是每一個為人禱告過很久、卻不知道神怎麼回應的人，心裡真實的問題。","pos":[["神真的改變了心意","","「後悔」（נִחַם）的字面意思，是改變、懊悔；按字面讀，神在與人的交往中，確實回應了阿摩司，原定的災改為不降。這個立場，看重神是有位格、會回應禱告的神，也看重阿摩司禱告的真實分量。"],["人的語言，描述神的回應","","神的旨意本身不變，「後悔」是用人的話，描述神面對禱告時所表現的憐憫；聖經也說神不是人，必不後悔。這個立場，看重神的信實與不變，但要小心，不要把禱告講成只是演戲。"],["兩面並看，不拆開","","舊約同時有兩種說法：神會後悔（出32:14；珥2:13；拿3:10），神也不是人，不會後悔（民23:19）。這個立場，不把一面收進另一面，承認人的語言說不完神，只照經文兩面如實地讀。"]],"con":[],"say":"本講義取第三種：不拆開兩面，也不替神的內心下判決。我們只讀到：兩次，一個微弱的人，開口求；兩次，神聽見，災免了。接下來第三個異象，就說到「我必不再寬恕」，神的耐心有界線，也不是禱告撐出來的。這正是全卷議題「神的『後悔』與『必不免去』：神的審判能被代求改變嗎？」在本章的講法：代求是真的，免災是真的，審判的界線也是真的；三件事同時成立，不要拿其中一件去否定另兩件。","care":"如果你為一個人禱告了很久，他仍然走向傷害，請不要聽見這一章，就覺得是自己禱告得不夠。阿摩司的禱告能不能「成功」，並不是這一章的規則；這一章要你看見的，是神聽得見微弱人的聲音，而且耶穌現今在神右邊，也替我們祈求（羅8:34）。你的眼淚，神記得；你不是一個人在扛。如果你正在陪伴一位受傷很深的人，也請你同時尋求信得過的同伴與適當的專業協助。"},{"id":"ISS07_2","t":"7:7--8：「準繩」到底是什麼？牆代表什麼？","r":"7:7--9","ch":[7],"why":"「準繩」（אֲנָךְ）這個字，在整本舊約，只出現在7:7--8，意思不太確定。有人說是量牆直不直的鉛垂線，有人說是「錫」。牆又代表什麼？這會影響我們怎樣講這個異象。","pos":[["鉛垂線（量具）","","古代譯本與多數傳統，把這個字理解為量牆的標準，有一條線垂下去，量牆有沒有歪。這一種理解，與下文「吊起準繩在我民以色列中」的動詞最相配，和合本也這樣譯。"],["錫","","אֲנָךְ 在其他古代近東語言與後來的希伯來文，有「錫」的意思。有人讀成牆是用錫造的，也有人讀成主手拿著錫，錫是一種金屬，可以象徵審判或衡量。這一種讀法，字面上也成立，只是與動詞「吊起」不那麼直接相配。"],["不能完全確定","","這個字太罕見，無法下定論；無論取哪一種，主在量以色列這件事，是清楚的：神站在牆上，神不再放過。"]],"con":[],"say":"本講義取「準繩」的譯法，並誠實告訴會眾：這個字罕見、不完全確定。因為不管取哪一種，這一段要說的都很清楚：標準在神手上，量我們的是一位站在牆上的主，祂的耐心有界線。我們不拿這個字的不確定去削弱這一段的重量，也不拿它去支持任何時間表或政治解釋。牆，我們只讀為神所建立的以色列，不替它補上經文沒有說的內容。","care":"如果你在聽「準繩」、「量」、「不再寬恕」這些話的時候，心裡很緊，覺得自己永遠不夠直，請先記得：這一章的前面有兩次免災，這位手拿準繩的主，說的是「我民」。祂量，是因為你屬祂。你不必一個人擔心自己歪了多少；你可以每天靠近那一條線，誠實地說：主啊，我哪裡歪了？求祢幫助我。"},{"id":"ISS07_3","t":"7:14：「我原不是先知」，是過去式還是現在式？這句話是在貶低先知與訓練嗎？","r":"7:14--15","ch":[7],"why":"原文只有「不是先知我」，沒有動詞「是」。和合本譯成「我原不是先知」，似乎是說：我以前不是。可是也可以讀成：我不是（靠這個為業的）先知。這兩種讀法，影響很大：阿摩司是否否認自己是先知？這句話，會不會被拿來貶低神學訓練、或貶低召命？","pos":[["過去式：我（以前）不是先知","","阿摩司說的是被召之前的狀態：我原本不是先知，也不是先知的門徒，我是牧人；是耶和華把我選召出來，從此我才說預言。和合本、不少傳統譯本，採這一種，與15節「耶和華選召我」前後相接。"],["現在式：我不是職業先知","","阿摩司回答亞瑪謝「糊口」的指控：我不是以先知為業的人，也不屬任何先知學派；我說預言，不是為了謀生。他在13節之後，仍然在對亞瑪謝說預言（16--17節），所以他並沒有否認自己正在說神的話。"],["兩種都不改變重點","","無論過去式還是現在式，這句話的重點是：他的權柄不來自行業與出身，而來自15節的「耶和華選召我」；這句話不是貶低先知，更不是貶低裝備，也不是在誇耀自己的出身。"]],"con":[],"say":"本講義取第三種：兩種時態都不改變核心，我們把它讀成對指控的回答，不讀成對先知、對訓練或對召命的任何評價。召命在神，不在背景：神可以用牧人，也可以用先知的門徒、祭司家的人。我們不拿這節去說受過神學訓練的人比較不屬靈，也不拿它去說越沒資格越被神用。同時，也不拿這節去替某一種事奉方式背書，或指責某一種事奉者領生活費。","care":"如果你正在事奉，卻覺得自己沒有學歷、沒有背景，不被看重，請你記得：是祂取了阿摩司，也是祂取了你。如果你受過許多裝備，卻常被人說「這些都是人的東西」，也請你記得：裝備是神給的恩典，不是你的本錢，也不是你的羞愧。無論哪一種，都請回到15節：重點是誰叫的，不是誰被叫。"},{"id":"ISS08_1","t":"8:11--12：聽道的饑荒，是神收回祂的話，還是人不肯聽？","r":"8:11--12","ch":[8],"why":"十一節說：饑荒不是因為沒有餅、沒有水，乃因不聽耶和華的話。原文字面是一場為著聽見耶和華的話的饑荒。這場饑荒，是神不再說話，是人不再聽，還是兩者都有？這個問題，影響我們怎樣對一個覺得神沉默的人說話。","pos":[["神收回祂的話","","饑荒是神降下的（神說：我必命饑荒降在地上），所以是神自己停止說話，這是審判的一種形式；撒母耳記上三章一節，也記著當時耶和華的言語稀少。"],["人不肯聽","","和合本譯成不聽，是前面神一再說：當聽我的話，他們不肯聽，所以後來聽不到；沉默是不肯聽的後果。"],["兩者並存","","神的話一直在說，人一直不聽，直到人想聽的時候，神選擇不再說；兩邊都是真的，不必在兩個方向之間，選一個排斥另一個。"]],"con":[],"say":"本講義取第三種：四節的呼召是真的，十一節的饑荒也是真的；兩節要放在一起讀。而且，這是對那個不聽的國度說的重話，不拿來恐嚇今日的會眾，也不用來解釋任何一個人的靈裡乾渴。今天，神已藉著祂的兒子說了話，祂的話開著。","care":"寫給覺得神很沉默、禱告好像碰到牆壁的人：這一節說的，是一群拒絕聽的人，不是說你。你的乾渴，可能是疲乏，可能是受苦，可能是憂鬱，也可能是你正在等候；請不要拿這節去定自己的罪。先被陪伴，先好好休息，必要時，也尋求輔導或醫療的協助。"},{"id":"ISS08_2","t":"8:4--6：這段在責備做生意的人嗎？","r":"8:4--6","ch":[8],"why":"四到六節，神責備那些以小升斗、大戥子、詭詐的天平，吞吃窮乏人的人。這是不是在說，做生意、有錢本身有罪？這一段，又與全卷議題《公平與福音：阿摩司書是社會革命的宣言嗎？》有什麼關係？","pos":[["反對商業與財富","","有人把這段讀成：凡賺錢、凡做生意的人都有罪，真正屬靈的人，應該放棄商業。"],["只談制度改革","","有人把它讀成社會革命的綱領：阿摩司是在主張一套新的經濟制度，信仰的重點，是改造結構。"],["針對詭詐與吞吃的行為","","經文責備的，是量器做小、砝碼做大、把人當價錢、把渣滓當麥子賣；對象是這樣做的人，不是所有做買賣的人，也不是一套方案。"]],"con":[],"say":"本章怎麼講：這一段，回應全卷議題《公平與福音：阿摩司書是社會革命的宣言嗎？》；本講義取第三種。神要的公義，出於認識這位為窮人說話的神，不取代敬拜，也不是一份社會方案。我們先看見被吞吃的人，再省察自己的天平；不點名今日任何行業、企業或個人。","care":"寫給正在被少算、被欠薪、被當成價錢的人：你不是沒有被看見；神說，他們的一切行為，我必永遠不忘。你可以說出來，也可以尋求適當的協助，包括法律與輔導的協助；你不需要先原諒，也不需要先證明自己沒有錯。寫給正在做生意的人：請不要因這段而羞愧，只要誠實地問：我的天平，神看得見嗎？"},{"id":"ISS08_3","t":"8:14：他們指著什麼起誓？「永不再起來」是最後的話嗎？","r":"8:14--14","ch":[8],"why":"十四節說，那些指著撒馬利亞牛犢、活神、別是巴的神道起誓的人，都必仆倒，永不再起來。和合本註腳說，牛犢原文是罪，神原文是活。這節的字句有幾種讀法；而且，永不再起來，是否就是整卷書的最後一句話？","pos":[["北國的偶像與朝聖路","","撒馬利亞的罪，指北國所設立的金牛犢（列王紀上十二章）；別是巴的道，指往南方聖所朝聖的路（五章五節）；起誓的對象，都是偏了的敬拜。"],["改一個字母，讀成神明","","有學者把別是巴的道，改讀成你的神明，與前一句平行，意思是：他們指著但的神、別是巴的神起誓。"],["只論這一群人的結局","","永不再起來，是對這一群指著偶像起誓的人說的，不是否定神對以色列的整個計畫；五章二節說到跌倒，九章十一節說到重新建立，要把三處放在一起讀。"]],"con":[],"say":"本講義承認字句有幾種讀法，不靠其中任何一種立論。無論取哪一種，意思相同：他們指著偏了的對象起誓。永不再起來，是這一群人的結局，不是整卷書的最後一句；九章的話，不在這裡搶著說，只留一個位置。這一章，沒有時間表，也不用來指任何今日的國家。","care":"寫給那些曾經很熱心、卻發現自己所敬拜的有偏差的人：你不是沒有機會；神的話，沒有停在這一節。也寫給擔心自己過去的敬拜被神拒絕的人：請不要用這節自責，先對神誠實地說，並找一位可信任的同伴陪你分辨；神所看的，是你今天願不願意回到祂的話語裡。"},{"id":"ISS09_1","t":"9:11--12：徒15:16--17引用「大衛倒塌的帳幕」，與希伯來文本為什麼不完全一樣？","r":"9:11--12","ch":[9],"why":"阿摩司書九章12節（和合本）說「使以色列人得以東所餘剩的和所有稱為我名下的國」；使徒行傳十五章17節（和合本）說「叫餘剩的人，就是凡稱為我名下的外邦人，都尋求主」。兩處用字不同：「以東所餘剩的」對「餘剩的人」，「得」對「尋求」。這個差異從哪裡來？新約作者是怎樣引用的？這個應許又該怎樣讀？","pos":[["新約引用的是七十士譯本","","希伯來文本讀作「以東（edom）所餘剩的」與「承受（yirshu）」；七十士譯本讀作「人（adam）所餘剩的」與「尋求（yidreshu）」，字形只差一個字母。雅各在耶路撒冷會議上，引用的是希臘文的形式，這是多數解經家的看法。"],["雅各是在詮釋與應用","","有人認為，雅各不是機械地引用，而是用大衛的家要被重新建立、外邦人也歸向主這個大意，說明眼前發生的事；用字的不同，是詮釋的結果，不是經文有錯。"],["兩種讀法並存，意思相通","","「得以東所餘剩的」（以色列得著外邦人）與「外邦人都尋求主」（外邦人歸向神），重點都在：神的家裡，將有列國屬祂的人。兩種讀法在方向上是一致的。"]],"con":[],"say":"本講義站在：先照希伯來文本（和合本）讀九章12節，目的是「所有稱為我名下的國」被包括進來；再看使徒行傳十五章16至17節，這是新約自己作出的連結，新約作者把這個應許與外邦人歸向神連在一起。字形差異是事實，我們誠實陳列，不因此懷疑聖經，也不替它建立日期或時間表。「到那日」不是推算的日子，與全卷議題中《「耶和華的日子」（5:18--20）是推算末世的時間表嗎？》一樣，我們不算日子。","care":"對一位因為看見「經文引用不同」而開始懷疑聖經的人，不要用答案壓住他的問題；可以陪他把兩處經文並排讀，說明：聖經的作者與抄寫者，也在用不同的語言、不同的文本傳統；我們有理由繼續信靠神的話。對正在受人排擠、覺得自己不屬於神家的人，可以讀十二節：「所有稱為我名下的」，神的家，比我們以為的大。"},{"id":"ISS09_2","t":"9:11--15：這段盼望的話，是阿摩司原作，還是後人加上的？","r":"9:11--15","ch":[9],"why":"九章前半，是接連不斷的審判；十一至十五節，突然轉為重建與豐收。有些學者認為，語氣轉變太大，這一段可能是後來的編輯所加；也有人認為，審判與盼望並存，本來就是先知書的常態。這與全卷議題《成書與編輯：阿摩司書是阿摩司一人所作嗎？９章末的盼望是原作嗎？》直接相關。","pos":[["後人加上的","","理由是：審判的語氣突然轉為安慰；「大衛倒塌的帳幕」可能反映大衛家在被擄之後的處境；因此有人認為，它是被擄時期或之後的編輯所加。"],["阿摩司原作","","理由是：先知書常常審判與盼望並存；八節已經有「卻不將雅各家滅絕淨盡」；帳幕、栽種與拔出等用語，也與阿摩司書的前文相呼應；「像古時一樣」也可以放在北國已經分裂的時代。"],["不必先決定","","無論作者是誰、編輯過沒有，這一段已經是正典的一部分；我們可以誠實承認學者的討論，同時讀它在整卷書中的位置：審判之後，神仍然說話。"]],"con":[],"say":"本章怎麼講：我們誠實陳列各家的看法，不替任何一方強行結案；本講義的做法，是把九章11至15節當作整卷書的最後一段來讀，並指出它與前文的呼應：八節的但書、九章5節與13節同一個動詞「消化」、十四節的「歸回」（轉回的追蹤字）、十五節的「栽」與「拔」。無論成書的過程如何，這一段回答的，是整卷書一直在問的：審判之後，神怎麼說？","care":"對一位因為聽到「這一段是後人加的」，就覺得盼望不可靠的人，不要急著用爭辯來保護他；可以陪他一起讀九章八節，再讀十四節，看見：神的但書與神的應許，始終是神自己在說。也請留意：不要因為學術討論，就輕看任何一位在教會裡認真讀經的人，也不要因為堅持單一作者，就責備提出問題的人。"},{"id":"ISS09_3","t":"9:9--10：「篩子」篩出去的是誰？我怎麼知道自己是穀還是糠？","r":"9:9--10","ch":[9],"why":"九章9節說，神把以色列家分散在列國中，好像用篩子篩穀，連一粒也不落在地上；10節說，我民中的一切罪人，他們說：災禍必追不上我們，必死在刀下。有人讀了就開始擔心：我是被保全的，還是被篩出去的？另外，原文的「粒」（tseror）可以指小石子，也有人讀作：篩子留下的是石子、漏下去的是穀；這會影響我們怎樣理解「連一粒也不落在地上」。","pos":[["穀粒不落地：神保全屬祂的人","","和合本取這一種：篩的過程是搖動，但沒有一粒真正屬神的人會失落。這與八節「不將雅各家滅絕淨盡」互相呼應。"],["石子不落地：每一個罪人都被找出","","tseror 的本意是小石子；意思是：篩子留住小石子，沒有一個罪人，可以從神的審判中漏掉。這與九章1至4節「無一人能逃避」的主題吻合。"],["兩者都強調審判的精確","","無論哪一種讀法，重點都是：神的審判不是亂打，是精確的；經文給的標準，是十節那些說「災禍必追不上我們」的人。"]],"con":[],"say":"本講義站在：兩種讀法，我們都誠實陳列，和合本取的是第一種，本講義也從第一種讀，但承認第二種的可能；而我們必須抓住的是十節的標準：不是「我是不是完美」，而是我心裡有沒有一個地方，是災禍追不上我的例外。我們不替神分類，不替任何人定罪。新約路加福音二十二章31至32節，耶穌對彼得說的話，是新約自己的呼應：被篩的過程是真的，但是有人在為我們祈求。","care":"對一位正在被生活搖動、擔心自己是不是被神放棄的人，不要用這一段嚇他，也不要告訴他「你是不是穀要看你的表現」；先陪他坐一坐，說：被搖動，不等於被丟棄。對一位因為受傷、受欺壓而心裡充滿恐懼的人，陪伴與保護優先；不要把審判的話，用來責備受害的人。若有人分享長期的自責、輕生的念頭或家庭暴力，不追問細節，會後單獨關心，必要時協助尋求專業的幫助。"}],"terrain":{"points":[[1.083,50,0,"耶和華必從錫安吼叫","mid"],[2.083,32,0,"為銀子賣了義人","mid"],[3.083,48,0,"惟獨認識你們","mid"],[4.083,16,0,"你們仍不歸向我","bot"],[5.083,70,0,"公平如大水滾滾","mid"],[6.083,28,0,"安逸無慮的有禍了","mid"],[7.083,22,0,"準繩","bot"],[8.083,8,0,"結局到了","bot"],[9.083,96,0,"倒塌的帳幕","top"]]},"tracks":[{"gk":"שׁוּב","tr":"shuv","gl":"轉回、歸回","code":"H7725","root":"√שׁוּב（轉回、回頭、歸回）","stops":[["1:3","「我必不免去她的刑罰」原文是「我必不使它轉回」：審判的決定，神不收回。","top"],["1:8","「反手攻擊以革倫」同一個字根換了用法：神把手轉回來，攻擊以革倫。",""],["2:4","「我必不免去他們的刑罰」第七次，落在猶大身上：連神的百姓也沒有例外。",""],["2:6","「我必不免去他們的刑罰」第八次，也是最後一次，落在以色列身上。","top"],["4:6","「你們仍不歸向我」第一次：糧食缺乏，百姓仍不轉回。","top"],["4:8","「你們仍不歸向我」第二次：旱災之後，人湊到一城找水。",""],["4:9","「你們仍不歸向我」第三次：旱風霉爛與剪蟲。",""],["4:10","「你們仍不歸向我」第四次：瘟疫與刀劍。",""],["4:11","「你們仍不歸向我」第五次：像從火中抽出來的一根柴，仍不轉回。","top"],["9:14","「我必使我民以色列被擄的歸回」同一個字根的最後一次：神自己使他們歸回。","top"]],"ins":"「轉回／歸回」（שׁוּב）在阿摩司書全卷 15 次，分布於 15 節。八次出現在列國與猶大與以色列的控訴裡（1:3、6、9、11、13；2:1、4、6），意思是「我必不使它轉回」——審判的決定，神不收回；一次（1:8）是神把手轉回來；接著 4:6–11 五次「你們仍不歸向我」，是人不轉回；最後 9:14 神說：「我必使我民以色列被擄的歸回」。同一個字根，由神不收回審判，變成人不肯轉回，最後變成神使人歸回。"},{"gk":"שָׁמַע","tr":"shama","gl":"聽","code":"H8085","root":"√שׁמע（聽、使人聽見）","stops":[["3:1","「當聽耶和華攻擊你們的話」第一個「當聽」：蒙揀選的人先要聽。","top"],["3:13","「當聽這話，警戒雅各家」第二次：先知要警戒。",""],["4:1","「當聽我的話」對巴珊的母牛說：連欺壓人的，神也叫他們聽。",""],["5:1","「要聽我為你們所作的哀歌」神把審判唱成哀歌。",""],["5:23","「我不聽你們彈琴的響聲」神反過來不聽：歌聲沒有公義，神不聽。","top"],["7:16","「現在你要聽耶和華的話」對亞瑪謝：連祭司也要聽。",""],["8:4","「當聽我的話」對吞吃窮乏人的說。",""],["8:11","「乃因不聽耶和華的話」聽道的饑荒：最深的飢餓，是不聽。","top"]],"ins":"「聽」（שָׁמַע）在阿摩司書全卷 10 次，分布於 10 節。前半卷是神一次又一次命令：當聽（3:1、13；4:1；5:1；8:4）；中間 5:23 神反過來說：「我不聽你們彈琴的響聲」；最後 8:11 說：飢餓不是因為沒有餅，乃是因為不聽耶和華的話。"},{"gk":"מִשְׁפָּט","tr":"mishpat","gl":"公平、公義","code":"H4941","root":"√שׁפט（公平）／√צדק（公義）","stops":[["2:6","「為銀子賣了義人」義人（צַדִּיק）被賣：公義的反面，是價格。","top"],["5:7","「你們這使公平變為茵蔯、將公義丟棄於地的」公平與公義第一次一起出現，就是被糟蹋。","top"],["5:12","「你們苦待義人，收受賄賂」義人被苦待，是公平被扭曲的樣子。",""],["5:15","「要惡惡好善，在城門口秉公行義」城門口是審案的地方：公平要在那裡立住。",""],["5:24","「惟願公平如大水滾滾，使公義如江河滔滔」全卷的高點：公平不是細流，是大水。","top"],["6:12","「你們卻使公平變為苦膽，使公義的果子變為茵蔯」同一對字，再一次被糟蹋。",""]],"ins":"「公平」（מִשְׁפָּט）4 次、「公義」（צְדָקָה）3 次，加上「義人」（צַדִּיק）2 次，共九次，集中在 2:6、5:7–24、6:12。公平與公義三次被說成「變為茵蔯、苦膽」（5:7；6:12），一次被說成「如大水滾滾」（5:24）。這個字組提醒我們：神要的不是更多的敬拜，是敬拜的人活出公平。"},{"gk":"נְאֻם","tr":"neum","gl":"耶和華說","code":"H5002","root":"√נאם（神諭、宣告）","stops":[["2:11","「這是耶和華說的」神問：以色列人哪，不是這樣嗎？",""],["3:10","「這是耶和華說的」控訴：不知道行正直的事。",""],["4:6","「這是耶和華說的」五次災之後的第一次簽名。","top"],["4:11","「這是耶和華說的」第五次，也是災難的最後一次。",""],["6:8","「主耶和華－萬軍之神指著自己起誓」神連起誓都親自出面。",""],["8:11","「主耶和華說」聽道的饑荒由神自己宣告。","top"],["9:8","「這是耶和華說的」審判中也有但書：卻不將雅各家滅絕淨盡。","top"],["9:12","「此乃行這事的耶和華說的」建立倒塌的帳幕之後，神再一次簽名。",""],["9:13","「耶和華說：日子將到」盼望也以「耶和華說」開頭。",""]],"ins":"「耶和華說」（נְאֻם）在阿摩司書全卷 21 次，分布於 21 節。這個字是先知文學的簽名：整卷書的每一個審判、每一個盼望，都不是阿摩司自己的意見，而是「這是耶和華說的」。由 2:11 的問句、4:6–11 的五次簽名，到 9:8、9:12–13 的盼望，簽名沒有換，只是簽在不同的話下面。"}],"lesson":{"1":{"no":1,"vol":"《321阿摩司書講義》第1課·阿摩司書第1章","title":"耶和華必從錫安吼叫——吼、火、四","chars":5354,"min":60,"deep":8,"dchars":1783,"tchars":1332,"blocks":[["h","一、牧人阿摩司與一聲吼叫（1:1--2）"],["p","弟兄姊妹平安。你有沒有過這樣的經驗：手機忽然響起一陣刺耳的警報聲，整個捷運車廂的人，同一秒鐘低下頭，掏出手機。接下來的幾秒鐘很有意思：大家先不是看手機上寫什麼，而是先看旁邊的人有沒有反應。有人皺眉，有人笑著說「又來了」，有人把手機塞回口袋，繼續滑別的東西。警報響過太多次，我們已經很習慣了。今天這一章，是一個很特別的警報：它不是從手機裡來的，是從錫安來的；它不是一則通知，是一聲吼叫。"],["p","阿摩司書的第一節，像一張名片。他叫阿摩司，是提哥亞人。提哥亞是猶大曠野邊上的一個小鎮，不是耶路撒冷，不是王宮。他的職業，是牧人，希伯來文的這個字，是飼養羊群的人。神沒有把話交給祭司，也沒有交給王的謀士，而是交給一個管羊的人。他的職業，沒有被藏起來，反而寫在書的第一行。"],["p","接著是他的時代：猶大王烏西雅，以色列王約阿施的兒子耶羅波安。這是一個外面看起來很興旺的時代：國土擴張，生意很好，聖所裡香火不斷。就在一個沒有人覺得需要先知的時候，神差了一位先知。還有一個記號：大地震前二年。這場地震，後來連別的先知也還記得（亞14:5）。經文沒有說震了多大，我們不推算日期，只看見一件事：在地震來以前，神的話，已經先說出來了。神總是先開口。"],["p","然後是整卷書的第一句話：「耶和華必從錫安吼叫，從耶路撒冷發聲；牧人的草場要悲哀；迦密的山頂要枯乾。」阿摩司是牧人，他很清楚，獅子吼的時候，整個山谷是什麼樣子：羊群縮成一團，連風也不敢動。他沒有說神像獅子，他直接說：耶和華必吼叫。聲音從錫安來，錫安是神與祂百姓同在的地方；而阿摩司，是猶大人，卻被差到北國以色列去說話。北國有自己的聖所；他們沒有想到，有一個聲音從耶路撒冷來，不請自來。"],["p","吼聲一落，兩個地方先有反應：牧人的草場悲哀，迦密的山頂枯乾。迦密是北國最肥美的山，雨水多，樹木密；連那裡都要乾透。請你留意次序：先有神的聲音，才有枯乾。災難，不是神沒有說話的結果，是神說話以後，人沒有聽的結果。我們也要記得，約珥書3章16節有一句幾乎一樣的話，接下去說：耶和華卻要作他百姓的避難所。同一個聲音，對仇敵是吼，對祂的百姓是避難所。"],["d",["阿摩司原來是牧羊人，這對沒有受過神學訓練的人有什麼意義？","第一個意義，是話的權柄在神，不在人的資歷。神把話交給提哥亞的牧人，是要我們看見：說話的是神，不是講員。第二，這不是在貶低學習與訓練：神也使用受過訓練的人，兩樣都是神的恩典。所以，沒有受過訓練的人，不需要自卑；受過訓練的人，也不需要驕傲。第三，每一個人都可以問自己：我現在所在的位置，有沒有一個神要我說的話、要我守的事？也許你是一位在家裡每天煮飯的媽媽，也許你是一位在工地做事的弟兄，神的話，可以從這樣的位置出來。你可以先做兩件事：每天讀一小段經文，並且把讀到的一句話，說給一位身邊的人聽。"]],["h","二、三番四次，神不收回（1:3--8）"],["p","吼聲過去，神開始說話，而且一連說了五次，格式幾乎一樣：耶和華如此說，某某三番四次地犯罪，我必不免去她的刑罰；因為她做了什麼；我卻要降火。第一個被點名的，是大馬士革，亞蘭的首都。罪名是：她以打糧食的鐵器打過基列。打糧食的鐵器，是打穀的工具，一塊木板嵌著鐵齒，在禾場上拖過穀物。拿來打人，是什麼樣子？基列在約旦河東，是以色列的土地；列王紀下13章7節說，亞蘭王把以色列人踐踏如禾場上的塵沙。這是暴力，而且是一次又一次的暴力。"],["p","這裡，我們要停一下。「三番四次」，有些人讀到這裡，就開始算：三次是什麼，四次是什麼，哪一次是最後一次。請你不要算。這是希伯來文常見的說法：先說三，再說四，意思是滿了，滿到溢出來。箴言裡有六樣、七樣的說法，也不是在給我們一個數字。三番四次，不是讓我們算罪的次數，也不是替神的忍耐訂一個上限。它讓我們看見的，是神等了很久：祂不是一看到錯就動手。"],["p","三節還有一句要緊的話：「我必不免去她的刑罰」。這句話的原文，直譯是：我必不使它轉回。「轉回」（shuv）這個字，在整卷阿摩司書裡一再出現。在這裡，是神說：我不收回；祂決定了，就不收回。到了第八節，同一個字根又出現：神說，我要反手攻擊以革倫，字面是「使我的手轉回」。一個是不收回，一個是手轉向。以後我們還要看見：神的百姓，有沒有轉回，轉到神這裡。"],["p","接著是迦薩。她的罪，不是殺人，是賣人：她擄掠眾民，交給以東。整批的人被抓走，被當成貨物轉手。被賣的人有名字，有家，有人在等他們回來。可是，經文先讓我們看見的，不是迦薩，而是那些被交出去的人：神知道。祂把這件事，記在帳上。在神的帳上，沒有一個人，是貨物。五個國家的審判，都是同樣的結局：降火，燒滅宮殿；每一次的結尾，都有一個印記：這是耶和華說的。說話的，不是阿摩司，不是以色列人的憤怒，是神自己。"],["p","這一段，不是用來指著今天任何一個城市、任何一個國家，說：神要審判他們；大馬士革、迦薩，是當時的城邦，我們不把它套進今天的新聞。這一段，是用來問自己：我有沒有，在不知不覺間，把一個人當成可以交出去的東西？"],["d",["「三番四次」是不是說，神的忍耐是有次數的？","不是。希伯來文有一種「三加一」的說法，意思是多到滿溢，並不是真的三次或四次。如果硬要數，我們馬上遇到一個問題：五個國家的罪名，每一個都不是列出三條四條，數字沒有辦法對上。所以，本講義取最穩的讀法：三番四次，就是一次又一次。這句話真正要我們看見的，不是神的忍耐有上限，而是神等了很久。對一位因為過去的失敗，覺得自己「次數用完了」的弟兄姊妹，這是一個安慰：你今天，仍然可以向神說話。對一位以為自己可以一直拖延的人，這是一個提醒：神的忍耐，是要帶你回頭，不是讓你放心繼續。"]],["h","三、原文亮光：吼、火、轉回（1:2--8）"],["p","這一章有三個原文字，剛好可以串起前面的內容。第一個是「吼」，希伯來文 שָׁאַג（sha'ag），這是獅子吼聲專用的動詞。阿摩司書3章8節再出現：「獅子吼叫，誰不懼怕呢？」同一個字，同一個畫面。獅子吼叫，不是為了好玩，是宣告：我已經在這裡了。"],["p","這個字，三十秒怎樣轉成生命？很簡單：你問自己，我生命裡有沒有一個聲音，已經響了很久，我卻一直假裝沒聽見？也許是一個提醒，也許是一次傷心，也許是一個你一直不想面對的人。神的聲音，常常先是很輕的；祂先吼，是因為祂還在等。聽見，是第一步。"],["p","第二個是「火」，希伯來文 אֵשׁ（esh）。每一個審判，神都說：「我卻要降火」。原文的動詞是 שִׁלַּחְתִּי（shillachti），字面是「我要差出去」：火，是神差出去的。燒的是什麼？是宮殿：是權力的位置，是那些以為自己牢不可破的高牆。火沒有先落在普通百姓身上；神審判的，是權力，是以為可以把人交出去而不用交帳的位置。"],["p","這個字，三十秒怎樣轉成生命？你可以問：我手上有沒有一個位置，是我以為「不用向誰交帳」的？也許是家裡說話最大聲的位置，也許是公司裡簽字的位置，也許是教會裡沒有人敢問的位置。神的火，燒的是那樣的位置。這不是要嚇人，是提醒：有權柄的人，要向神交帳。"],["p","第三個是「轉回」，希伯來文 שׁוּב（shuv）。三節「我必不免去她的刑罰」，字面是「我必不使它轉回」；八節「反手攻擊以革倫」，字面是「使我的手轉回」。這個字在整卷書裡，是一條線：神不收回，神的手轉向，神等著百姓轉回。"],["p","這個字，三十秒怎樣轉成生命？你可以問：我現在有沒有一個方向，是我該轉回的？也許是一段擱置很久的關係，也許是一個答應過卻沒有做的承諾。轉回，是一個很小的動作：今天，轉過身來，朝向神，朝向人。"],["d",["神降火燒宮殿，這和神的愛怎麼並存？","聖經沒有叫我們把這句話講成神的冷酷。降火，是神對暴力與權力濫用的回應；前面有三番四次的耐心，也有祂先開口的吼聲。神的愛，不是對罪沒有感覺的愛；一位愛人的神，必定對傷害人的事有回應。你想一想：如果有一位父親，看見自己的孩子被欺負，卻一點反應都沒有，我們會說他愛孩子嗎？神的審判，是祂對被傷害之人的愛的一面。同時，我們也看見耶穌：祂快到耶路撒冷，看見城，就為它哀哭（路19:41）；在十字架上，祂為不曉得的人求赦免。神的審判與神的愛，在耶穌身上，連在一起。我們不用這句話去解釋任何一場災難，也不說「某個人受苦，一定是神降火」。"]],["h","四、弟兄的盟約與被傷的人（1:9--15）"],["p","九節是泰爾，地中海岸最富有的港口。她的罪名，和迦薩有點像，卻多了一句：並不記念弟兄的盟約。泰爾不是侵略者，她是商人；她沒有拿刀，她只是簽了字，把人交出去，換一筆錢。這種罪不會被人注意，因為買賣是合法的；可是在神那裡，記念，是要付代價的事。你可以忘了你說過的話，可是神記得，你答應過什麼。至於是哪一個盟約，經文沒有說，我們不替它決定；各種讀法都指向同一件事：泰爾背棄了本來該信守的關係。"],["p","十一節是以東，以掃的後代；她追趕的兄弟，是雅各的後代，以色列。這一次，不是外人對外人，是同一個祖先所生的兩個兄弟。經文用了一串動詞：拿刀追趕，毫無憐憫，發怒撕裂，永懷忿怒。一層比一層深：最先是行動，然後是心，最後是一個不肯放下的恨。「憐憫」這個字，希伯來文與「子宮」同一個字根，是母親對腹中孩子的那種情感，最不用教、最原始的柔軟；以東把它毀了。而恨，如果不放下，會一直在心裡繼續撕裂。"],["p","阿摩司說出以東的名字，不是叫我們去恨以東，是為了那個被追趕的兄弟。這裡，我們要把話說得更溫柔一點：如果你心裡有一個，說了不再提、卻一直放在心裡的人，我不是說，你要馬上原諒；我是說，這件事，神看見，而且神看的，是那個被傷的人。放下，是一段需要神與同伴陪伴的路。"],["p","十三節是亞捫：她剖開基列的孕婦，擴張自己的境界。這是整個列國神諭裡，最難讀的一句。經文沒有加形容詞，沒有嘆息，只是把動作與目的並排放在一起：剖開孕婦，為了擴張疆土。在這裡，我們不要急著轉到審判，先為那些人停下來：基列的婦女，她們腹中的孩子，她們的丈夫和母親。她們沒有名字，可是神記得；在神的眼中，沒有一個人，是附帶的損失。審判的場景是戰爭的樣子：爭戰吶喊的日子，旋風狂暴的時候，點火在拉巴的城內。十五節說，他們的王和首領必一同被擄去；有人把「他們的王」讀為米勒公，是亞捫人所拜的神。不管哪一種讀法，意思一樣：沒有一個人，也沒有一個神，能保護他們。"],["d",["我心裡有放不下的怒氣，是不是就像以東，要被審判？","不是。以東的罪，是拿刀追趕兄弟，毀壞憐憫，把怒氣當成一件要永遠保守的東西。你心裡有放不下的怒氣，說明你受過傷，這不等於你在做以東做的事。可以分辨的，是這份怒氣，要把你帶到哪裡去：如果它帶你更誠實地向神說：主，我放不下，求祢幫助我，這是一條好的路；如果它帶你計算、報復、不想再見到那個人，就需要停下來。你可以做三件事：第一，把這份怒氣，具體地寫下來，說給神聽；第二，找一位你信任的同伴，說出來，請他先聽；第三，如果情況需要，也可以尋求輔導，不用一個人硬撐。放下，是一段路，不是一個決定。"]],["d",["我或家人曾經受過暴力或失去孩子，讀這一章太痛，怎麼辦？","首先，你不需要把這一章讀完。你可以停在這裡，今天只讀一句話：神看見。這一章在描寫暴力的時候，沒有加形容詞，也沒有叫受傷的人，立刻好起來；它只是把受傷的人，放進神的眼睛裡。第二，不要自己一個人讀。找一位你信任的同伴，或牧者、輔導，請他陪你，不追問細節，不要求你原諒，只是陪著。第三，如果你正在經歷失眠、重複的畫面、不想活下去的念頭，請尋求專業的幫助，這不是軟弱，是智慧。神不是要你，用這一章去承受更多；祂是要你知道，你受的傷，不是無人看見的。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把1:3「三番四次」，講成神記著罪的次數，或是把第一章用來推算日子、地震，或今天任何一個國家的前途。這是希伯來文「滿到溢出來」的說法，不是數字；地震在這裡，只是一個時間的記號。本講義不算次數，不推算日期，也不把大馬士革、迦薩、泰爾等名字，套到今天的新聞。檢驗標準是：會眾是更看見神忍耐得很久，還是更熱衷推算與政治？"],["p","第二個偏差，是把這一章講成神偏袒以色列、替以色列報仇，或讓會眾覺得，審判的是別人，不是自己。罪名都是對人犯的罪：暴力、買賣人口、背棄約定、永懷忿怒；神審判，是因為祂看見受傷的人，不是因為國籍；且第二章要把同樣的格式，轉向猶大與以色列自己。檢驗標準是：會眾聽完，是更謙卑，還是更覺得自己這邊安全？"],["p","第三個偏差，是把1:2神的吼聲，講成一位只會發怒的神，用來恐嚇會眾，或把1:3「必不免去」，講成神不憐憫。吼聲是地震之前神先開口；約珥書3章16節同一句話後面，接的是神要作祂百姓的避難所。神的後悔與不後悔，留給第七章與全卷議題。檢驗標準是：會眾聽完，是更想回到神那裡，還是更怕神？"],["p","第四個偏差，是只談神怎樣審判欺壓人的國家，卻沒有先看見被賣走、被追趕、被剖開的人。1:6、9、11、13每一次的罪名，描寫的都是受傷的人；神的眼睛先看見他們；陪伴與保護受傷的人，優先於論斷欺壓人的人。也不要用這一章，催逼受傷的人立刻原諒，或用1:13的暴行，去論斷曾經流產、墮胎的人，或當作政治與社會議題的武器。檢驗標準是：受傷的人聽完，是被陪伴，還是被淹沒？"],["p","第五個偏差，是斷定1:9「弟兄的盟約」確定就是某一份條約，或把1:1阿摩司是牧人，講成平信徒勝過受訓練的人，貶低神學訓練與召命。經文只說「弟兄們的約」，沒有指明；神把話交給牧人，是為了讓人看見話是神的，不是人的資歷。檢驗標準是：會眾是更看見神話語的權柄，還是更分高低、更急著替經文補上細節？"],["d",["有人說這一章是在預言今天某個國家，我該怎麼回應？","可以先問他三個問題：第一，經文自己有沒有說這是對今天的預言？沒有，它說的是當時的大馬士革、迦薩、泰爾、以東、亞捫。第二，新約有沒有把這一段，連到今天任何一個國家？也沒有。第三，這樣的講法，是讓會眾更愛主、更認識神，還是更熱衷於討論新聞？本講義的立場是：聖經的話，不是用來支持或反對任何現代國家、政黨或領袖的；對於沒有新約根據的預表，我們只說「這使我們想起」，不說「這是預言」。你可以溫和地對他說：我們可以一起讀這一章，看神怎樣看待暴力與背棄；至於今天的國家怎麼樣，我們不替神說話。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：我們很習慣「不當面說，背後說」，也很習慣「不提，但也不放下」。在華人的家庭與教會文化裡，為了面子與和諧，有些傷害，被收進心裡，一放就是幾十年：兄弟之間為了遺產，妯娌之間為了一句話，父母與孩子之間為了一件沒有被道歉的事，從此不再說話。這種「不提」，常常被稱讚成熟，實際上，是把怒氣保守起來。阿摩司書1章11節提醒我們，永懷的忿怒，會一直在心裡撕裂。這個星期，不妨問自己：我有沒有一個人，是我說了不再提，卻一直放在心裡的？我是不是可以，把這份怒氣，先帶到神面前？"],["p","第二個問題：我們很習慣「信任靠關係，不靠合約」，也很習慣「一句話，算數」。在華人社會，許多生意、許多家庭的承諾，是靠一句「我會在」「我答應你」，沒有白紙黑字。這有它的美，也有它的脆弱：一旦一方忘記，另一方沒有任何憑據，只能默默吞下。泰爾「不記念弟兄的盟約」，提醒我們，神記得的，不只是簽字的合約，也包括我們說過的話。這個星期，不妨想一想：我曾經對誰說過「我會在」，有沒有一句話，我答應了卻沒有做？我可以怎樣，用一個具體的行動，把它補上？"],["h","七、活出321——聽見吼聲，記得盟約"],["p","耶穌是我的榜樣。祂快到耶路撒冷，看見城，就為它哀哭；在十字架上，祂說：父啊，赦免他們。祂不是不看罪，而是帶著眼淚看罪，也親自擔當。祂教我們，要愛仇敵，為逼迫我們的人禱告（太5:44）。面對傷害，祂不以惡報惡；面對受傷的人，祂先醫治，先陪伴。"],["p","聖經是我的準則。我們讀阿摩司書第一章，不是要用它去指著別人，也不是要推算任何日子，而是讓聖經自己說話：神先吼，神等很久，神看見受傷的人，神記得盟約。聖經的準則，既讓我們敬畏神的公義，也讓我們看見神的憐憫。"],["p","聖靈是我的引導。是聖靈，使我們聽見神的聲音，不再假裝沒聽見；也是聖靈，使我們看見心裡那個不肯放下的怒氣。求祂幫助我們，聽見，記得，放下。"],["p","讓耶穌作王。無己，是放下那種站在對的一邊、就可以痛快聽別人受審的心，也放下嘴上不提、心裡卻一直保守的怒氣。讓耶穌作王，就是讓祂的聲音，比我的痛快、我的怒氣、我的藉口更大；讓祂決定，我該記得什麼，該放下什麼。"],["p","讓耶穌得著一切的榮耀。神從錫安吼叫，在地震之前先說話；祂等了很久，才降火。這一切，是神的作為，不是我們的功勞。一切榮耀，歸給耶穌。"],["p","建立屬神的體系。一個屬神的群體，是一群聽見神聲音的人，記得彼此的盟約，不把審判掛在口上去指著別人，先陪伴、保護受傷的人；我們不論斷鄰居，也不論斷教會、講員與政府；大家的焦點，都在耶穌。"],["d",["「聽見吼聲」，具體可以怎麼做？","可以從三個很小的習慣開始。第一，每天固定一個時間，也許是睡前，用三分鐘，安靜地說：主，祢若有一個聲音，是我一直假裝沒聽見的，求祢再說一次。然後安靜一分鐘，不求答案，讓神，說完。第二，把你聽見的，寫下來，不用整理，不用漂亮。一個星期以後，回頭看，你會發現，有些聲音，一再重複，那就是神一直在提醒你的。第三，找一位同伴，把這一句話說給他聽：我最近聽見的是這個，請你為我禱告。這樣做，不是要把神的聲音，變成一個話題，而是讓我們，不再一個人，假裝沒聽見。"]],["h","八、四種心，一個邀請"],["p","驕傲型的人說：我站在對的一邊，審判都是別人的事，我不需要聽。經文對他說：五個國家審判完了，聽的人也許覺得痛快，可是阿摩司的話，還沒有說完；第二章，要轉向猶大，轉向以色列。你可以先問自己：如果輪到我，我站得住嗎？"],["p","恐懼型的人說：神是獅子，祂在吼，我怕被吃掉。神的吼聲，是在地震之前先說話；吼聲後面，是耶和華要作祂百姓的避難所。你可以先把你的怕，說給祂聽，祂不是要嚇你，是在等你轉回。"],["p","羞恥型的人說：我曾經背棄了一個承諾，我曾經把人交出去，我不配再被神記念。神記得盟約，也記得你；祂不是要你，一直活在羞愧裡，而是要你，轉回，把當初說過的話，認真地補上。你可以對神說：求祢憐憫，我要怎麼補？"],["p","受傷型的人說：我是被賣走的、被追趕的、被傷害的，我不知道神在哪裡。這一章先讓你看見：神的眼睛，先看見你。經文沒有說，你要立刻好起來，也沒有說，你要立刻原諒；你可以先對神說：求祢陪我，我還沒有力氣，讓我先休息。"],["h","九、這一週，你可以做的幾件事"],["p","第一，每天睡前，花三分鐘，安靜地說：主，祢若有一個聲音，是我一直假裝沒聽見的，求祢再說一次。連續七天，把你聽見的，寫下一句。"],["p","第二，找出一個你曾經說過「我會在」的人，這個星期，用一通電話、一則訊息，或一次探訪，守住這句話。不用說很多，只要說：我記得。"],["p","第三，找出一件你說了不再提、卻一直放在心裡的事，今天安靜十分鐘，對神說：主，我放不下，求祢幫助我。不用急著原諒，先誠實地把它放在神面前。"],["p","第四，這個星期，聽到有人批評不在場的人時，不跟著補一句；可以安靜，也可以換一個話題。"],["p","第五，找出身邊一位受過傷害、被忽略的人，這個星期，只陪伴，不評論，先聽他說，並問他：我可以怎樣幫你？"],["p","我宣告：神從錫安吼叫，祂先說話，我願意聽見，不再假裝沒聽見。"],["p","我宣告：我不拿審判去指著別人，我先問自己，求神鑒察我的心。"],["p","我宣告：我記得我說過的話，我要守住我的盟約。"],["p","我宣告：耶穌是我的王，祂看見受傷的人，也要藉著我，陪伴他們。"],["d",["這一週我可以立刻做的一件事是什麼，才不會只停在聽道？","最簡單的，是今晚睡前，拿一張紙，寫下一個名字：一個你曾經說過「我會在」的人。在名字下面，寫一句你可以對他說的話，例如：我記得，我們最近見個面。明天，就把這句話，傳給他，或打一通電話。如果你寫不出名字，就問自己：這一個月，有誰曾經對我說過：你有空嗎？我可以怎樣，先回應他？一個星期後，回頭看這張紙，你會發現，有些關係，因為一句話，開始鬆動；也有些，需要更多時間，繼續禱告。如果你發現自己很難開口，也不要責備自己，每天做一個小動作：為他禱告一次。神是一位，記得盟約的神。"]],["h","十、結語"],["p","阿摩司書第一章，是一個牧人的名片、一聲從錫安來的吼叫，和神對五個國家說的話。開頭，是阿摩司得到神的話，在大地震前二年；中間，是神說：三番四次，我必不使它轉回，我卻要降火；最後，是亞捫的王和首領，一同被擄去，留給我們一個問題：神的眼睛，是不是只看鄰居？"],["p","在這一章，神要我們看見祂的心：祂是一位，在地震之前，先開口的神；祂是一位，忍耐得很久、才降火的神；祂也是一位，先看見被賣走、被追趕、被剖開之人的神。祂記得盟約，也記得每一個，曾經對人說過的話。祂的吼聲裡，有一個，要人轉回的機會。"],["p","所以，請你記得今天這一課的三個重點：聽見神的聲音，不再假裝沒聽見；不算三番四次，也不拿審判去指著別人；記得盟約，放下怒氣，站在受傷的人身邊。這一課的焦點，不在你有沒有聽懂所有的原文，不在鄰居的過錯，也不在災難的日期，而是那位看見耶路撒冷就哀哭、在十字架上為人求赦免的耶穌。"],["p","親愛的天父，謝謝祢，從錫安發聲，在地震之前，先說話；求祢使我們，聽見祢的聲音，記得我們的承諾，也放下不肯放下的怒氣；求祢安慰每一位受傷的人，讓他們知道，祢看見。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["m","帶領說明：今天這一課，我們用三個化來走一遍：先把話放進自己心裡（內化），再一起想通、說出口、走一步（消化），最後把這一課帶到人面前（轉化）。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化　內化（約20分鐘）"],["m","目的：讓每個人先把經文放進自己的心裡，看見自己的位置，不急著討論別人。"],["n","1. ★ 阿摩司書一章二節：耶和華必從錫安吼叫。你最近有沒有一個聲音，你一直假裝沒聽見？請說出是哪一類，不必細節。"],["n","2. ★ 一章一節：阿摩司是提哥亞的牧人。你現在所在的位置是什麼？請說出一個，例如家庭、職場、教會。"],["n","3. ★★ 一章九節：泰爾不記念弟兄的盟約。你有沒有一個說過「我會在」、卻還沒做的人？請說出一個名字。"],["n","4. ★★★ 請在安靜中想一件事：一件你說了不再提、卻一直放在心裡的事。現在用一句話寫下它，並寫下你願意讓誰陪你，一起面對。"],["m","帶領提醒：請先安靜念一章二節，再開始。不要點名逼人說。這一章會碰到暴力、被背棄、失去孩子與放不下的怒氣：如果有人提到性暴力、家庭暴力、流產、失去孩子、自傷的念頭或長期的創傷，不追問細節，不要求原諒，不對正在流淚的人說「你要有信心」，也不說「你要放下」，會後單獨關心，必要時協助他尋求專業的幫助。"],["s","第二化　消化（約35分鐘·主軸）"],["m","目的：看見自己、聽神說話、想通關卡、說出口、走一步，讓這一課成為自己的話。"],["t","【看】看見自己"],["n","5. ★ 看見自己：對照一章十一節，你心裡有沒有一個人，是你放不下的？請只說出一個關係，例如家人、同事、教會的人。"],["t","【聽】聽神說話"],["n","6. ★★ 聽神說話：安靜三分鐘，聽一章二節的吼聲，也聽後面的耶和華要作祂百姓的避難所。你心裡聽見的是什麼？請說出你聽到的第一個感覺。"],["t","【想】想通關卡"],["n","7. ★★★ 想通關卡：一章三節的「三番四次」不是數字，一章六節先看見被賣走的人。請用自己的話向組員說明：為什麼神的眼睛，先看見被傷的人，再有審判？"],["t","【講】說出口"],["n","8. ★★ 說出口：用一句話向一位組員說，你這個星期可以先向誰，守住你曾經說過的一句話，並當場說出他的名字。"],["t","【行】走一步"],["n","9. ★★★ 走一步：請決定這個星期的哪一天，打一通電話、傳一則訊息，或安靜十分鐘禱告；寫下時間，並說出誰會提醒你。"],["m","帶領提醒：依【看】【聽】【想】【講】【行】的順序走，每一步留足時間。【講】的時候，只要說出一句、一個名字、一個時間，不必講故事。若有人眼淚掉下來，不追問細節，也不要求他原諒誰，先安靜陪著，會後單獨關心。"],["s","第三化　轉化（約25分鐘）"],["m","目的：把這一課帶出去：進入家庭、職場、教會的真實關係，並讓福音繼續繁殖。"],["n","10. ★ 你身邊有沒有一位，曾經被傷害、被忽略、卻很少人問起的人？請說出名字，並決定這個月用一句具體的話關心他。"],["n","11. ★★ 你的小組或教會，有沒有人在背後議論別人？請說出你可以怎樣，在下次聽到時，不跟著補一句。"],["n","12. ★★ 你有沒有一位，曾經在你受傷時陪伴你、沒有急著講道理的人？請說出名字，並決定這個月向他說聲謝謝。"],["n","13. ★★★ 920 操練：找出你的那一個「2」，就是你最想陪他一起「聽見神的聲音」的那位，這個星期向他分享，並且當場說出他的名字。"],["n","14. ★★★ 【必做】請在這個星期，把這一課用三句話講給一位教會外的朋友聽，並在下次小組回報：你對誰講的、在哪裡講、他的反應是什麼。"],["m","帶領提醒：請特別提醒：不要在小組裡用這一章去指責任何人，不要用它論斷任何講員、教會、政府，也不要用經文推算任何時間，或套用到今日任何國家或領袖。若有人分享被傷害、被背棄、失去孩子、成癮或家庭暴力的經歷，不追問細節、不要求原諒，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助尋求輔導或其他專業的協助。"],["s","收尾（5分鐘）"],["p","請大家輕輕閉上眼睛，把今天寫下的那一個名字，放在神面前。一起念一章二節。"],["p","由帶領者為每一位禱告：求神使我們聽見祂的聲音，記得我們的盟約，也放下不肯放下的怒氣。散會前，彼此問一句：你這星期要先向誰，守住你說過的那一句話？"]]},"2":{"no":2,"vol":"《321阿摩司書講義》第2課·阿摩司書第2章","title":"為銀子賣了義人——審、賣、記","chars":5298,"min":60,"deep":8,"dchars":1783,"tchars":1316,"blocks":[["h","一、沒有人選他（2:1--5）"],["p","弟兄姊妹平安。有一個小學六年級的男孩，每次體育課分組，都站在最後面。老師說：大家自己找人一組。同學們很快就分好了，跑得快的找跑得快的，會投籃的找會投籃的。最後，操場邊只剩下他一個人，低著頭，看自己的鞋尖。沒有人罵他，也沒有人欺負他，只是在那一刻，他被標上了一個價：沒有用。這個男孩長大以後，什麼也沒說，卻一直記得那雙鞋。今天這一章，就是神對所有那樣站在最後面的人，所說的話。"],["p","阿摩司書二章，接著一章，繼續審判列國。一節說：耶和華如此說，摩押三番四次地犯罪，我必不免去她的刑罰；因為她將以東王的骸骨焚燒成灰。請你先留意兩個地方。第一，「三番四次」，不是在數數目，不是第三次、第四次；它是語言上的說法，意思是一次又一次、已經滿到溢出來了。第二，「我必不免去」，原文用的是「轉回」那個字：神說，這件事，我不使它轉回，也不收回。這個字，是整卷阿摩司書的追蹤字，在這一章，出現了三次。"],["p","摩押做的事，是把以東王的骸骨焚燒成灰。人已經死了，仇還在；恨，延伸到一個死去的人的骨頭上。被燒的，不是以色列人，是別國的王。可是，神為他說話。這是我們該停一下的地方：神是列國的神，連一個外邦人死後的尊嚴，祂也記得。二、三節說，神要降火在摩押，剪除摩押中的審判者；連本該主持公道的人，也不在例外。"],["p","然後，四、五節，輪到猶大。猶大是神的百姓，他們有訓誨，有律例。罪名是：他們厭棄耶和華的訓誨，不遵守他的律例；列祖所隨從虛假的偶像，使他們走迷了。「虛假的偶像」，原文直譯是「他們的謊言」。謊言，是一代一代傳下來的，不是一個人突然走偏，而是一條路，越走越偏。五節只有一句：我卻要降火在猶大，燒滅耶路撒冷的宮殿。話很短，卻很重：領受得越多，責任越重。神的話，從遠處一圈一圈地走近，最後，要停在以色列。"],["d",["「三番四次」是不是說，他們犯了三次、又犯了第四次？","不是。「三番四次」在原文，是「為三個罪過，為四個」，是希伯來詩歌常見的「三加一」寫法，用來表示一件事已經重複又重複，滿到再也不能不說。聖經學者對它有不同的讀法：有人視為修辭，有人想對應一個具體的清單，有人試圖把它和全卷的結構連起來。本講義取第一種：它是語言上的「一次又一次」，不算數字，也不推論這個民族犯了幾次罪。這樣讀，有一個好處：我們不會把神的話，變成一本帳。神的眼睛，不是在數我們犯了幾次，而是在看：這一次，我們有沒有聽見。這句話，更像一個鄭重的提醒，叫人今天就轉回，不要再等。"]],["h","二、為銀子賣了義人（2:6--8）"],["p","六節：耶和華如此說，以色列人三番四次地犯罪，我必不免去他們的刑罰；因他們為銀子賣了義人，為一雙鞋賣了窮人。罪名，只有一個動詞：賣。請你看兩個價錢：一個是銀子，一個是一雙鞋；一個也許是很大的利益，一個小到不值一提。可是，被賣的，一邊是義人，一邊是窮人，都是沒有力量為自己說話的人。公義的反面，是什麼？是價格。一個人一旦被標上價錢，他就不再是人，變成了一樣東西，可以買，可以賣，可以算。"],["p","這樣的事，常常做得很合法、很有禮貌，有手續，有簽名，沒有人大聲罵誰。可是，神的眼睛，穿過了手續。我們要先對一種人說話：如果你就是那位被少算工錢、被當作東西使用、不敢開口的人，請先聽這一句：這一節，神是站在你這一邊的。你不是一個議題，你有名字，有臉；你的眼淚，神看見了。你不需要先變堅強，祂才肯聽。"],["p","七節，罪名一個一個列出來。他們見窮人頭上所蒙的灰也都垂涎。頭上蒙灰，是哀痛的記號；這個人，已經失去很多，只剩下頭上的灰，可是，還有人看著他，想再拿走一點什麼。「垂涎」這個字，各家有的譯為「渴想」，有的譯為「踐踏」，畫面一樣：對一個已經一無所有的人，不留餘地。「阻礙謙卑人的道路」，原文是「使他們的道路彎曲」；受傷的人，常常不只是受傷，還發現，求助的路，也被掰彎了。"],["p","然後，是一句很重的話：父子同一個女子行淫，褻瀆我的聖名。原文只說「那少女」，沒有說她是誰、在什麼處境，我們也不替她補上身分。我們只守住兩件事。第一，經文裡沒有一個字，責備她；被審判的，是有權力的人。第二，神說，這是褻瀆我的聖名。神把她所受的傷害，看成自己名字所受的羞辱。這句話，我們要慢慢念：神與被傷害的人，站在一起。"],["p","八節，罪搬進了敬拜的地方：他們在各壇旁鋪人所當的衣服，臥在其上，又在他們神的廟中喝受罰之人的酒。律法說，窮人當的衣服，日落以先要還他，因為他只有這一件，是蓋身睡覺用的（出22:26--27）。他們沒有還，反而鋪在祭壇旁邊，躺在上面；酒，是被罰款的人的酒，喝酒的地方，是神的廟。他們沒有停止敬拜，可是，敬拜的地方，成了享受別人眼淚的地方。敬拜不是不重要，也不是只要做社會工作就好；神要的，是兩樣一起活出來。"],["d",["這一章是不是叫教會去做社會運動、批判有錢人？","不是，也不能這樣簡化。阿摩司書看見了窮人所受的壓迫，這是真的；可是，經文的重心，是「褻瀆我的聖名」，是神的名字被輕看，是人與神的關係壞了，所以人與人的關係也壞了。神要的公義，出於認識神，不取代敬拜。這一章，也不是在給我們一份指著別人說「你們多壞」的名單；它更像一面鏡子，先照我們自己：我有沒有在不知不覺之間，替人標價？教會當然可以關心窮人，也應該在能力範圍內，陪伴與保護受傷的人，但動機是神的愛，不是一種新的計畫。我們不點名指責任何企業或個人，也不讓這一章，變成批判別人的武器。"]],["h","三、原文亮光：義人、轉回、領上來（2:6，9--10）"],["p","這一章有三個原文字，是這一章的路。第一個是「義人」，希伯來文 צַדִּיק（tsaddiq）。這個字，在法庭上，是理直的人；在神面前，是被神算為對的人。它不是說這個人沒有難處，也不是說他沒有過犯，而是說：他站在對的地方。六節說：他們為銀子賣了義人。被標價的，不是一個「沒有用」的人，而是一個在神眼中站得住的人。"],["p","三十秒轉成生命。你有沒有一個時候，被人看輕，覺得自己「不值什麼」？請你記得：別人給你的價錢，不是你真正的價值。在神的眼中，你是被祂看見的人。你也可以反過來問自己：今天，在我面前，有沒有一個人，我習慣把他當作「不重要」？請你換一個詞來想他：他是一個，神看見的人。"],["p","第二個是「轉回」，希伯來文 שׁוּב（shuv）。六節的「我必不免去」，原文就是這個字的動詞，意思是：我不使它轉回。同一個字，在阿摩司書四章，神一次一次，說他們仍不歸向我，「歸向」，也是這個字。同一個字，兩個方向：神的不收回，與人的轉回。神對公義的事，不輕輕放過；神也一次一次，等人轉身。"],["p","三十秒轉成生命。今天，有沒有一件事，神已經提醒我很多次了？可能是一句沒有還的話，一筆欠人的錢，一個被我冷落的人。這個「轉回」，不是等到禮拜天，是今天。你不需要先把事情整理好，只要先轉身，對神說：我聽見了。"],["p","第三個是「領上來」，希伯來文 עלה（alah）的使役形，הֶעֱלֵיתִי。十節說：我也將你們從埃及地領上來。「領上來」，是出埃及的標準動詞，意思是帶著人、從低處往高處，從奴隸之家，往自由與應許地走。這個動詞的主詞，是神：不是以色列自己爬上來，是神把他們帶上來的。"],["p","三十秒轉成生命。你今天站的地方，是誰把你帶上來的？你的工作，你的家，你在教會的位置，也許有你的努力，可是，有多少，是別人的幫助、是神的恩典？記得自己是被領上來的人，會使人變得謙卑，也使人對那些仍在低處的人，多一份溫柔。三個字連起來，就是這一章的路：義人，被標了價；轉回，神不輕輕放過，也在等；領上來，我們都是被恩典領上來的人。"],["d",["「義人」是指一個完全沒有過錯的人嗎？","不是。希伯來文的「義人」，是一個關係與位置的字：在法庭上站得住的人，在盟約裡忠信的人。聖經裡的義人，也會有軟弱，也會有過犯；他們被稱為義，是因為神這樣算，也因為他們在關係裡，選擇對的方向。所以，這一節不是說，被賣的人，一定沒有任何缺點；而是說，無論這個人有沒有缺點，把人當作東西買賣，都是不對的。對我們的提醒有兩個：第一，不用先證明一個人「夠好」，才願意為他說話；第二，也不要因為一個人貧窮，就把他想成特別好或特別壞，貧窮本身不代表屬靈，也不代表有罪。他就是一個人，神看見，我們也要看見。"]],["h","四、我曾領你們上來（2:9--16）"],["p","九節，是一個大轉折。前面，是「他們做了什麼」；現在，是「我做了什麼」。我從以色列人面前除滅亞摩利人。這個「我」，在原文，是特別強調的：是我，不是你們的刀，不是你們的聰明。亞摩利人，像香柏樹一樣高，像橡樹一樣堅固，可是神說，我上滅他的果子，下絕他的根本。這是在告訴他們：你們今天站在這片地上，不是靠自己。"],["p","十節，又是一個「我」：我也將你們從埃及地領上來，在曠野引導你們四十年，使你們得亞摩利人之地為業。埃及、曠野、應許地，三個地方，每一個主詞，都是神。以色列是從哪裡開始的？不是從強大，是從奴隸之家。他們自己，曾經是被壓的人，曾經有人替他們出頭；現在，他們轉過身，賣了別人。這是這一章，最痛的地方。神不是在羞辱他們，是在叫他們想起來：你的飯，你的地，是誰給的？"],["p","十一節，神給的，不只是土地，還有人：我從你們子弟中興起先知，又從你們少年人中興起拿細耳人。先知，是神的話的口；拿細耳人，是整個人分別給神，作活的見證（民6）。「從你們子弟中」，神沒有從別處借人，祂把呼召，放在你們家門口。然後，神問了一個問題：以色列人哪，不是這樣嗎？這是耶和華說的。神沒有直接定罪，先問，留一個空間，等人回答。這個「耶和華說」，是全卷的追蹤字，在這一章，十一節一次，十六節一次，像一個括號，把這一段包起來。"],["p","可是，十二節，是回答：你們卻給拿細耳人酒喝，囑咐先知說：不要說預言。這個「卻」字，很痛。神所興起的人，他們用兩種方法，讓他沒有聲音：一個是誘惑，給拿細耳人酒喝，叫他破壞自己的分別（民6:3）；一個是命令，叫先知閉嘴。把窮人賣了的人，也把神的話，從嘴上拿掉：對人沒有憐憫，對神的話，也沒有耳朵。這兩件事，常常一起出現。"],["p","十三節：看哪，在你們所住之地，我必壓你們，如同裝滿禾捆的車壓物一樣。這個動詞，原文並不好確定，有人讀為「壓」，有人讀為「使地吱嘎作響」；無論哪一種，畫面都是沉重，沉重得承受不住。接著，十四到十六節，是一份清單：快跑的、有力的、剛勇的，拿弓的、腿快的、騎馬的，勇士中最有膽量的。這些，是一個民族最倚靠的：速度、力氣、武器、膽量。可是一個一個，都是「不能」。「赤身逃跑」，連衣服也顧不上；我們不下定論，卻不能不留意：八節，他們把窮人的衣服，鋪在壇旁，到了這裡，最有膽量的人，連自己的衣服也沒有了。"],["p","這一段，不是要我們推算哪一天，也不是要用它嚇人。「到那日」，經文沒有給日期，我們不算，也不套用到今日任何國家。神說這一句話，不是要我們害怕世界，而是要我們今天就聽見，今天就轉身；不等到審判臨到，才發現自己沒有一樣可靠。這一章，從「耶和華如此說」開始，也以「這是耶和華說的」結束。"],["d",["「到那日」是什麼時候？是不是在預告末世？","經文沒有給日期，我們不推算，也不把它對上今日任何事件。「那日」，在這裡，是神審判臨到的時刻，是對當時那個百姓說的話。阿摩司書的重點，不是幫我們畫時間表，而是叫人今天就悔改、今天就守住。注意十四到十六節，神並沒有說「你們要準備戰爭」，而是說：連你最倚靠的，也不能救你。這個提醒，在今天，同樣有力量：我所倚靠的，是銀行裡的數字、是我的能力、是我認識的人，還是神？如果有一件事，讓你讀了以後，更恐慌、更急著算日子，那不是這一章的原意；這一章的果效，是讓我們更愛主，更看見祂的領上來，更願意回到祂面前。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把二章六至八節，講成社會革命的宣言，說教會只要改變制度，就是做了神的工。神要的公義，出於認識神，不取代敬拜；這一章先審判的，是「賣人」的心，也是「褻瀆我的聖名」。檢驗標準是：會眾是更認識神、更能愛人，還是只更會批評制度？"],["p","第二個偏差，是把二章八節「在他們神的廟中」，講成神反對敬拜，或把「三番四次」，算成第三次、第四次。神不是說敬拜不好，而是敬拜的地方，成了享用別人眼淚的地方；「三番四次」，也是「一次又一次、滿到溢出來」，不是數字。檢驗標準是：會眾是更看見敬拜與生活不能分開，還是更熱衷算數字？"],["p","第三個偏差，是把二章七節「父子同一個女子行淫」，講成那位女子也有責任，或確定她是某種身分。經文沒有說她是誰，也沒有責備她；被審判的，是有權力的人，神把她所受的傷害，看為對自己聖名的褻瀆。檢驗標準是：受傷的人聽了，是被安慰，還是再次被責備？"],["p","第四個偏差，是把二章一至五節摩押、猶大的審判，或十三到十六節，套在今日某個國家、政黨或領袖身上，或講成可以推算的「那日」。這是對當時說的話，本講義不替任何現代政治立場背書，也不算日子，也不用它恐嚇會眾。檢驗標準是：會眾是更敬畏神、更願意悔改，還是更熱衷指認敵人、更恐慌？"],["p","第五個偏差，是把二章六節，用來指名某位老闆、某間企業，或把二章十二節「給拿細耳人酒喝」，講成基督徒不可碰酒的律法，或把「囑咐先知不要說預言」，講成「不同意就是塞住先知的口」。經文是對以色列的審判，不點名論斷任何當代的人；拿細耳人的願，是民數記六章的特別誓願。檢驗標準是：會眾是更向內看見自己，還是更急著向外指別人？"],["d",["我看見身邊有人被不公平地對待，我可以怎麼做，才不只是批評？","可以從四件小事開始。第一，先陪伴，不先評論：如果那個人是你認識的人，先問他：你還好嗎？我可以怎麼陪你？不急著追問細節，也不替他決定怎麼做。第二，把自己手邊能做的做好：還清該還的、不拖欠、不在背後說人。第三，如果事情涉及安全、暴力或法律問題，請協助他尋求適當的專業與保護，不要自己出面處理，以免讓他更受傷。第四，把這件事帶到禱告裡：求神給你智慧，也求神使你不變成另一個論斷人的人。公義，不是一個氣勢，是一個一個具體的陪伴與選擇。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：我們很容易，用「有沒有用」「有沒有關係」來看人。在華人社會，人際關係很重要，這有它的美；可是，也有一個代價：我們常常不知不覺，把人分成「有用的」與「沒用的」，「可以幫我的」與「不能幫我的」。一個人沒有背景、沒有人脈，就容易被忽略；有時候，我們還稱這為「精明」。二章六節提醒我們：被標價的，是人。這個星期，不妨問自己：我最近冷落了誰？是不是因為他「沒有用」？"],["p","第二個問題：我們習慣忍耐，受傷了，也不說。華人文化裡，「家醜不外揚」「吃虧就是福」，常被當作美德；很多人，被少算、被利用、被傷害，也只是默默吞下去，怕得罪人，怕破壞關係。二章，神是站在被傷害的人這一邊，祂不要求受傷的人，先堅強、先原諒，才有資格說話。如果你就是那位一直忍著的人，這個星期，找一位你信得過的人，說出一件事；若涉及安全或法律問題，也請尋求專業的協助。這不是不孝，也不是不愛，這是神所樂意的保護。"],["d",["我被不公平地對待，可是說了怕得罪人、破壞關係，怎麼辦？","首先，你的感受是真實的，神不會責備你的猶豫。其次，可以分三步走：第一步，先對神說，把你心裡真正的想法，包括生氣、害怕、委屈，不必修飾地說出來。第二步，找一位你信得過、不會到處說的人，把事情說出來，請他幫你看清楚，哪些是事實，哪些是你的擔心。第三步，如果需要向相關的人表達，用清楚、溫和、有具體事實的方式，也可以請一位中間人陪你。如果涉及安全、暴力、金錢糾紛或法律問題，請尋求專業協助。我們不要求你立刻原諒，也不要求你立刻說出來；神等你，教會也願意陪你。"]],["h","七、活出321——不替人標價"],["p","耶穌是我的榜樣。祂是真正的義人，也被標了價：有人說，你們願意給我多少錢？他們就給了祂三十塊錢（太26:15）。我們不說阿摩司書預言了這件事，只說這使我們想起二章六節。祂本來富足，卻為我們成了貧窮（林後8:9）；祂沒有替人標價，祂把自己給了出來。"],["p","聖經是我的準則。我們讀二章，不是為了指著別人說「你們多壞」，也不是為了推算日子，而是讓經文先照我們自己：神看人，不是看有沒有用；敬拜與公義，要一起活出來；神所興起的人與神的話，不可以被堵住。"],["p","聖靈是我的引導。是聖靈，使我們在日常的小事裡，看見那個被我們忽略的人，也使我們有力量，把欠人的還清，把該說的話說出來，也把受傷的人，帶到安全的地方。求祂幫助我們，認出自己心裡，那一把悄悄替人標價的算盤。"],["p","讓耶穌作王。無己，是放下「這個人對我有沒有用」的算計，也放下我是神的百姓、所以不用被審的自義；回到本位，讓神作神，讓人作人。讓耶穌作王，就是讓祂決定每一個人的價值，不是我。"],["p","讓耶穌得著一切的榮耀。神把我們從埃及領上來，在曠野引導我們，興起先知，這一切，都是神的恩典，不是我們的功勞。一切榮耀，歸給耶穌。"],["p","建立屬神的體系。一個屬神的群體，是一群不替人標價的人；我們陪伴受傷的人，保護弱小的人，先問「我可以怎樣陪你」，而不先問「你哪裡做錯了」。敬拜與公義，一起活出來。"],["d",["「不替人標價」，具體可以怎麼做？","可以從三個很小的地方開始。第一，改變我的語言：少說「這個人沒什麼用」「他幫不上忙」，多說「他是神所造的人」。第二，改變我的時間：這個星期，主動花十分鐘，陪一位平常被忽略的人，吃一頓飯，或打一通電話，不為了求什麼。第三，改變我的帳本：欠人的，還清；該給的謝謝，說出來；答應過的事，做到。如果你是領袖，也請檢查一下：在教會或團契裡，有沒有一個人，因為「沒有恩賜」「沒有用處」，而一直站在最後面？你可以做的，就是叫出他的名字，給他一個真實的位置，問他：你願意怎樣被陪伴？這些事，都很小，卻是把神的看法，帶進日子裡。"]],["h","八、四種心，一個邀請"],["p","驕傲型的人說：我是神的百姓，我很屬靈，這一章是對別人說的。經文對他說：猶大也是神的百姓，他們也被審判。領受得越多，責任越重；你可以先把這一章，讀給自己聽。"],["p","恐懼型的人說：我怕得罪人，我怕說了事情更糟，所以我什麼也不敢說，也不敢幫。神說：我看見你。經文不要求你一個人面對所有的事，你可以從一件小事開始：先對神說，再找一位同伴。"],["p","羞恥型的人說：我曾經替人標過價，我傷過人，我覺得自己沒有資格。神說：我曾將你們從埃及領上來。你的起點，不是你的過錯，是神的恩典。你可以帶著這份羞愧，對神說：求祢憐憫，我願意轉回。"],["p","受傷型的人說：我曾經被當作東西，被利用，被丟掉。神看見你。這一章沒有叫你先原諒，也沒有叫你先堅強；神說，這是褻瀆我的聖名，祂與你站在一起。你不需要現在就處理好，可以先對神說：求祢醫治我，也求祢差一位陪伴我的人。"],["h","九、這一週，你可以做的幾件事"],["p","第一，每天睡前，花三分鐘，對神說：今天，我有沒有把誰看成「沒有用」？不用急著回答，只是誠實地問，連續七天。"],["p","第二，找出一件你欠人的小事，一句謝謝，一筆小錢，或一個答應過的事，在日落以前還清。"],["p","第三，這個星期從教會出去，對第一位遇見的人，停下來，看他的眼睛，說一句真誠的話。"],["p","第四，找出一位在小組或教會裡，常常被忽略的人，這個月主動問他：我可以怎樣陪你？並且認真聽。"],["p","第五，把二章十節抄在紙上，放在常常看到的地方：「我也將你們從埃及地領上來」。每次看見，就對神說一次：是祢把我領上來的。"],["p","我宣告：我不用有沒有用，來看任何一個人，每一個人，都是神所造、所愛的。"],["p","我宣告：我記得，是神把我領上來的，我今天站的地方，是祂的恩典。"],["p","我宣告：敬拜與公義，我要一起活出來，我先陪伴受傷的人。"],["p","我宣告：耶穌是我的王，我今天，就回到祂面前。"],["d",["這一週我可以立刻做的一件事是什麼，才不會只停在聽道？","最簡單的，是今晚睡前，拿一張紙，寫下一個你最近冷落、或是因為覺得他「沒有用」而不想理的人的名字。在名字旁邊，寫一句話：他是神所造的人。然後，在紙的背面，寫下一件你這個星期可以對他做的小事：一句問候、一通電話、一杯飲料、一個小小的幫忙。把這張紙放進聖經，每天讀一次二章十節，記下你讀到的一句話。一個星期以後，回頭看這張紙：有沒有做？做的時候，心裡有什麼感覺？如果你發現你很難為他做任何事，也不要責備自己，先把這份困難，帶到神面前，求祂改變你的眼睛。神是一位，把我們一個一個領上來的神。"]],["h","十、結語"],["p","阿摩司書二章，是神的話，一圈一圈走近。從摩押，到猶大，到以色列；從別人的罪，走到自己的心。開頭，是神為一位死去的外邦王，說話；中間，是神為一位被賣的義人、一位被傷害的少女，說話；最後，是神說，我曾將你們從埃及領上來，勇士也不能自救。"],["p","在這一章，神要我們看見祂的心：祂是列國的神，連死人的骸骨祂也記得；祂站在被賣的人這一邊，把她所受的傷害，看為自己名字所受的羞辱；祂是領人上來的神，也是等人轉回的神。公義的反面，是價格；而神，從來不替任何一個人標價。"],["p","所以，請你記得今天這一課的三個重點：神看見每一個被標價的人；敬拜與公義，一起活出來；我是被領上來的人，今天就轉回。這一課的焦點，不在制度，不在日子，不在別人是否該受審判，而是那位被賣、被標了價，卻義的代替不義的耶穌（彼前3:18）。"],["p","主耶穌，謝謝祢，看見每一個沒有人看見的人，也從來不替我們標價；求祢使我們，不再替人標價，不再沉默，也不再傷人；求祢醫治每一位被傷害的人，使我們記得，是祢把我們領上來。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["m","帶領說明：今天這一課，我們用三個化來走一遍：先把話放進自己心裡（內化），再一起想通、說出口、走一步（消化），最後把這一課帶到人面前（轉化）。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化　內化（約20分鐘）"],["m","目的：讓每個人先把經文放進自己的心裡，看見自己的位置，不急著討論別人。"],["n","1. ★ 二章六節說：他們為銀子賣了義人。你有沒有一次，覺得自己被人看輕、當作沒有用？請說出大概是哪一類場合，不必細節。"],["n","2. ★ 二章十節神說：我也將你們從埃及地領上來。你覺得，在你的生命裡，有哪一件事，是神把你領上來的？請說出一件。"],["n","3. ★★ 二章八節，他們把窮人的衣服，鋪在壇旁。你有沒有一件欠人的小事，一直沒有還？請說出一個，不必細節。"],["n","4. ★★★ 請在安靜中想一個人：一位你最近冷落、或因為覺得他沒有用而不想理的人。現在用一句話寫下他的名字，與你願意為他做的一件小事。"],["m","帶領提醒：請先安靜念二章六節，再開始。不要點名逼人說。這一章會碰到被忽略、被利用、被傷害的經歷：如果有人提到性暴力、家庭暴力、被剝削、被欺壓、憂鬱或自傷的念頭，不追問細節，不要求原諒，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助他尋求專業的幫助。"],["s","第二化　消化（約35分鐘·主軸）"],["m","目的：看見自己、聽神說話、想通關卡、說出口、走一步，讓這一課成為自己的話。"],["t","【看】看見自己"],["n","5. ★ 看見自己：對照二章六節，你最近有沒有用「有沒有用」來看一個人？請說出一個場合，例如工作、家庭、教會。"],["t","【聽】聽神說話"],["n","6. ★★ 聽神說話：安靜三分鐘，聽二章七節，神把被傷害的人所受的傷害，看為自己名字所受的羞辱。你心裡聽見的是什麼？請說出你聽到的第一個感覺。"],["t","【想】想通關卡"],["n","7. ★★★ 想通關卡：二章八節，他們沒有停止敬拜，卻在神的廟中，享用別人的眼淚。請用自己的話向組員說明：為什麼敬拜與公義，要一起活出來？"],["t","【講】說出口"],["n","8. ★★ 說出口：用一句話向一位組員說，你這個星期可以先還清哪一件欠人的事，並當場說出來。"],["t","【行】走一步"],["n","9. ★★★ 走一步：請決定這個星期的哪一天，你要對那位被冷落的人做一件小事，寫下時間，並說出誰會提醒你。"],["m","帶領提醒：依【看】【聽】【想】【講】【行】的順序走，每一步留足時間。【講】的時候，只要說出一句、一個名字、一個時間，不必講故事。若有人眼淚掉下來，不追問細節，也不要求他原諒誰，先安靜陪著，會後單獨關心。"],["s","第三化　轉化（約25分鐘）"],["m","目的：把這一課帶出去：進入家庭、職場、教會的真實關係，並讓福音繼續繁殖。"],["n","10. ★ 你身邊有沒有一位常常站在最後面、很少被人選的人？請說出名字，並決定這個月用一個具體的行動陪他。"],["n","11. ★★ 你的小組或教會，有沒有一位被少算、被忽略的人？請說出具體的一位，並說你可以先從哪裡開始關心他。"],["n","12. ★★ 你有沒有一位曾經陪你、沒有替你標價的人？請說出名字，並決定這個月向他說聲謝謝。"],["n","13. ★★★ 920 操練：找出你的那一個「2」，就是你最想陪他一起「記得是神把我們領上來」的那位，這個星期向他分享，並且當場說出他的名字。"],["n","14. ★★★ 【必做】請在這個星期，把這一課用三句話講給一位教會外的朋友聽，並在下次小組回報：你對誰講的、在哪裡講、他的反應是什麼。"],["m","帶領提醒：請特別提醒：不要在小組裡用這一章去指責任何人是「賣義人的人」，也不要點名論斷任何企業、教會、政府或領袖，不要用經文推算任何時間或套用到今日任何國家。若有人分享被傷害、被剝削、性暴力、家庭暴力、憂鬱、成癮或自傷的經歷，不追問細節、不要求原諒，會後單獨關心，必要時協助尋求輔導、醫療、法律或其他專業的協助。"],["s","收尾（5分鐘）"],["p","請大家輕輕閉上眼睛，把今天寫下的那一個名字，放在神面前。一起念二章十節。"],["p","由帶領者為每一位禱告：求神使我們記得是祂把我們領上來，也使我們不再替人標價。散會前，彼此問一句：你這星期要先為誰做的那一件事是什麼？"]]},"3":{"no":3,"vol":"《321阿摩司書講義》第3課·阿摩司書第3章","title":"惟獨認識你們——認、同、說","chars":5131,"min":60,"deep":8,"dchars":1637,"tchars":1299,"blocks":[["h","一、被這樣認識的人（3:1--2）"],["p","弟兄姊妹平安。颱風前夕，天快黑了，社區的管理員，拿著一疊通知單，一戶一戶地敲門。有人開了門，說，知道了知道了；有人隔著門縫，說，每次都說要來，哪一次真的來？管理員沒有生氣，只是把單子遞過去，說：這一次，是真的，請你們把窗戶關好，把樓下的車子移走。他不是愛說話的人。他說，是因為他知道風要來了，他不能不說。今天這一章，就是一位這樣的人，和他不能不說的話。"],["p","阿摩司書三章，開頭就是一個命令：當聽。這是一節很長的句子：以色列人哪，你們全家是我從埃及地領上來的，當聽耶和華攻擊你們的話。請你留意，說話的神，先提起的，不是他們的罪，是自己的恩典：我是那位把你們領上來的神。恩典在前面，話在後面。"],["p","這一節的第一個命令，也是整卷書反覆迴響的字：聽。蒙揀選的人，第一件事，不是做更多，是先把耳朵打開。本章的第二次「當聽」，在十三節，與這一節，前後相扣，把整章包起來。"],["p","二節，是整章的鑰匙：在地上萬族中，我只認識你們；因此，我必追討你們的一切罪孽。前半句，是天大的榮耀，後半句，卻是聽眾沒有料到的。他們以為，被認識，就等於被保護；神說，被認識，就等於被追討。中間，只隔一個「因此」。"],["p","請你想一個畫面：鄰居的孩子，在客廳打翻了一碗湯，大家笑一笑，說沒關係；自己的孩子，打翻了同樣的湯，做父親的，卻把他帶到門口，蹲下來，一句一句說清楚。這不是父親苛刻，是因為這是他的孩子。神對祂的百姓，也是這樣。箴言說，耶和華所愛的，他必責備，正如父親責備所喜愛的兒子。"],["p","我們也要小心，不要把這一節，讀成一句嚇人的話。阿摩司說這句話的對象，是一群一再離開約的人。對今天的我們，這句話要問的，是一個比較安靜的問題：被神這樣認識的人，要怎樣活？這不是叫我們恐慌，是叫我們回到那位認識我們的神面前。"],["d",["被神揀選、被神認識，為什麼反而要被追討？這樣的神，我還能親近嗎？","能。因為追討，不是神不愛，是神愛得認真。想一想，你最在乎的人，你對他，是不是比對陌生人，要求更高？不是因為你苛刻，是因為你把他放在心上。這一節的「認識」，是立約的字，是父親認識孩子那樣的認識。神先把我們從埃及領上來，恩典在前；然後，才對我們說話，要求在後。這兩件事，出於同一份愛。所以，聽見「追討」，我們可以做的，不是逃離，是靠近：對神說，主，祢認識我，求祢指教我，我有什麼地方，需要回頭。一個願意靠近的人，不必怕這句話。"]],["h","二、七個「豈能」（3:3--8）"],["p","從三節到六節，阿摩司連問了七個問題。二人若不同心，豈能同行呢？獅子若非抓食，豈能在林中咆哮呢？雀鳥若沒有機檻，豈能陷在網羅裡呢？城中若吹角，百姓豈不驚恐呢？這些問題，沒有一個是難題，每一個答案，都是：不會。"],["p","阿摩司是一位牧人，也是修理桑樹的人。他不是用高深的神學，他用的，是田野裡，人人看得懂的事。他一步一步，把聽眾帶到一個結論：事情的發生，後面有原因；聲音的後面，有事情；網羅的後面，有人設了機關。有果，必有因。"],["p","三節的「同心」，要多說一句。原文這個動詞，意思是「約定、約好見面」，不是情感上一模一樣。所以，這一節問的，不是你們合不合得來，而是：你們有沒有先約好？我們說自己與神同行，可是，我們與神之間，有沒有那一份，神所定的約，和我們的順服？沒有約，就沒有同行。"],["p","六節的後半句，我們要慢慢讀：災禍若臨到一城，豈非耶和華所降的嗎？這一句，是對神的約民，在先知警告之下說的：神已經事先警告了，若災禍來臨，不要說是偶然。它不是用來解釋，今日每一場災難、每一個病痛。耶穌在路加福音十三章，特別糾正過這樣的想法。所以，我們對正在受苦的人，先陪伴，先坐下來聽，不先解釋。"],["p","七節，是這一段的中心：主耶和華若不將奧祕指示他的僕人，眾先知，就一無所行。這個「奧祕」，原文的畫面，是一群人，坐在一起，說知心的話。神對祂的僕人，像對朋友一樣，把心意打開。耶穌也說過：我稱你們為朋友，因我從我父所聽見的，已經都告訴你們了。神不是躲在暗處設網的獵人，祂是在城門口吹角的守望者；祂的話，先於祂的手。"],["p","八節，是整段最漂亮的收尾：獅子吼叫，誰不懼怕呢？主耶和華發命，誰能不說預言呢？獅子一吼，整座森林都靜下來；神一開口，聽見的人，不能不說。這個「不能不說」，不是才華，也不是性格，是被神的話抓住了。後來，彼得與約翰說，我們所看見所聽見的，不能不說；保羅說，若不傳福音，我便有禍了。這使我們想起，被神的話抓住的人，常有同一個記號。"],["d",["三節說「二人若不同心，豈能同行」，可以拿來要求婚姻或團隊「意見一致」嗎？","不可以。這一節原文的意思，是「約定」，不是「想法一樣」。經文談的，是與神同行，需要神所定的約和人的順服；它不是要人人意見一致，更不是用來壓制不同的聲音。在婚姻、團隊、教會裡，意見不同，常常是正常的，甚至是好的。真正需要問的是：我們的方向，是不是都在回應同一位神？如果有人拿這一節，要求別人「你必須跟我一樣」，那是在誤用經文。一個健康的團體，可以有不同的想法，卻有共同的約：都願意聽神的話，也彼此尊重、彼此傾聽。"]],["h","三、原文亮光：認識、聽、正直（3:2、1、10）"],["p","這一章有三個原文字，剛好串起整章。第一個是「認識」，希伯來文 יָדַע（yada），二節的「我只認識你們」。這個字，基本意思是「知道」，可是在聖經裡，用在人與人、神與人之間，常常是有關係的、有委身的認識。創世記說，亞當「認識」夏娃，就生了孩子；神說，我「認識」了亞伯拉罕，要他教導子孫守我的道。所以，神說「只認識你們」，不是說神不知道別的民族，而是說：只有這一群人，神把他們放進了約的關係裡。"],["p","這個字，三十秒就能轉成生命。你被神「認識」，不是一個資料，是一個關係。這意味著：你有一位，把你放在心上的神。這個關係，帶來安慰：你不是一個無名的人。它也帶來責任：被這樣認識的人，要活得像一個被愛的孩子，而不是一個隨便的陌生人。新約說，若有人愛神，這人乃是神所知道的。"],["p","有趣的是，十節，同一個字又出現了：他們「不知道」行正直的事。神「認識」他們，他們卻「不知道」什麼是正直。這是一個很深的對照：神那麼認識他們，他們卻對神的標準，一無所知。"],["p","第二個是「聽」，希伯來文 שָׁמַע（shamaʿ），一節的「當聽」，十三節的「當聽」。這個字，不只是耳朵接收聲音，更是「聽進去、聽從」。聖經裡，「聽」與「順服」，常常是同一個字。所以，「當聽」，不是叫我們多收集資訊，是叫我們聽了以後，轉身，跟著走。九節的「傳揚」，原文是同一個字根的使役形：使人聽見。先知的工作，是讓人聽見；百姓的責任，是聽從。"],["p","第三個是「正直」，希伯來文 נְכֹחָה（nekochah），十節的「正直的事」。這個字，原意是「在前面的、直的」，像一條筆直的路。他們「不知道行正直的事」，意思是：他們心裡，那把直尺，不見了。搶奪成了習慣，積蓄成了本事，而且沒有人覺得不對。這個字，叫我們誠實地問：我心裡，還有沒有一把直尺？我有沒有，一件事，做久了，不再覺得有問題？"],["p","把三個字連起來，就是這一章的路：認識，是神對我們的心；聽，是我們回應的第一步；正直，是聽了以後，活出來的樣子。一個被神認識的人，會先聽，然後行出正直。"],["d",["我說我認識神，可是我怎麼知道，神是不是真的「認識」我？","聖經給我們一個很安靜的確據：祂先認識了我們。約翰福音10章，耶穌說，我是好牧人，我認識我的羊，我的羊也認識我。我們不是先努力讓神認識，才被接納；我們是先被祂認識，才開始認識祂。加拉太書說，現在你們既然認識神，更可說是被神所認識的。所以，如果你心裡有一點渴慕，想親近神，這本身，就是祂的認識，在你裡面作工。你可以每天做一件小事：先安靜五分鐘，對神說，主，祢認識我，我也想更認識祢。不用整理，不用漂亮，只是誠實地開口。"]],["h","四、欺壓與拆毀（3:9--15）"],["p","九節，聲音忽然轉了方向。神要先知，對亞實突的宮殿，與埃及地的宮殿，傳揚：你們要聚集在撒馬利亞的山上，就看見城中有何等大的擾亂與欺壓的事。亞實突，是非利士人的城；埃及，是以色列人當年為奴之地。神請外邦的宮殿，來看：神的百姓，在自己的城裡，做了什麼。這是一個令人心酸的畫面：約的標準，被丟得那麼遠，遠到需要別人來作見證。"],["p","十節，說明了擾亂的內容：那些以強暴搶奪財物、積蓄在自己家中的人，不知道行正直的事。這是耶和華說的。這裡，我們要先站在被欺壓的人那一邊。經文說的「欺壓」，後面，是一個一個真實的人：被奪去財物的人，被壓榨卻不敢說話的人。神在這裡，看見了，並且在這個控訴上，親自簽了名：這是耶和華說的。如果你曾經是受過欺壓的人，這一節要先告訴你：你所受的，不是理所當然，不是你活該，神看見。至於行強暴的人，神自己會追討；我們不在這裡，替神指名任何一個人。"],["p","十一節，只有一個轉折詞：所以。控訴，與宣判，中間，只隔一個字。他們倚靠堅固的宮殿，與積蓄的財物；神說，你的勢力要衰微，你的家宅要被搶掠。經文沒有說，敵人是誰，也沒有說，哪一天。我們不算日子，也不把它套到今天任何一個國家。阿摩司的用意，是要當時的百姓，今天就回頭。"],["p","十二節，是一個很刺人的比喻：牧人從獅子口中，只搶回兩條羊腿，或半個耳朵。這不是救回一隻羊，是留下一個證據，證明羊，是被獅子吃掉的。神說，躺臥在床角、鋪繡花毯榻上的撒馬利亞人，他們得救，也不過如此。這不是安慰，是一句叫人心痛的話。這裡的「得救」，不是福音意義的得救，是指審判之後，所剩無幾。這使我們想起：我們的好牧人，不一樣。耶穌說，我是好牧人，好牧人為羊捨命。祂不是只帶回證據，祂找著了羊，就歡歡喜喜地扛在肩上，回到家裡。"],["p","十三節，是第二次的「當聽」，警戒雅各家。這是法庭的語言：作證，指控。神召了證人，在眾人面前，公開地作證。可是，這個警戒，是慈愛的：神若不再在乎，就不會警戒；祂警戒，因為祂還在乎。十四節，神說，我討以色列罪的日子，也要討伯特利祭壇的罪，壇角必被砍下。壇角，是避難所的記號；神說，連這個避難所，也不能保護一邊行欺壓、一邊抓住壇角的人。這不是說，敬拜是壞事，是說，敬拜不能代替悔改。十五節，過冬的房屋，過夏的房屋，象牙的房屋，都要歸無有。經文沒有說，有房子就是罪；被追討的，是這些房屋的來歷，不是房屋本身。最後，是一句：這是耶和華說的。"],["d",["阿摩司書是不是在批判有錢人？我自己有房子、有積蓄，是不是也有問題？","不是。經文沒有說，有房子、有積蓄，就是罪。十節說的，是「以強暴搶奪財物，積蓄在自己家中」，被追討的，是財物的來歷與取得的方式。所以，這一節，不是給我們一個批判別人財富的把柄，而是一面鏡子，給我們自己。你可以誠實地問三個問題：第一，我所擁有的，是怎麼來的？第二，它有沒有讓別人受傷，或是我看見了，卻一直沒有面對？第三，我願不願意，在神面前，把它放在祂手中？如果答案是平安的，就不必無端內疚；如果有一件事，神提醒了你，今天就是回頭的日子。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把三章二節「我只認識你們」，講成蒙揀選的人享有特權，或比別族更高等。這個「認識」，是立約的關係，帶來的是責任；經文沒有用這句話，貶低任何民族。檢驗標準是：會眾聽完，是更看見自己被託付的責任，還是更覺得自己比別人高？"],["p","第二個偏差，是把三章六節「災禍若臨到一城，豈非耶和華所降的嗎」，講成今日每一場災難、疾病，都是神針對某人、某城的審判。這是對神的約民，在先知警告之下的話；本講義不用它去解釋任何人的苦難。檢驗標準是：受苦的人，是被安慰，還是被暗示「你一定做錯了什麼」？"],["p","第三個偏差，是把三章七節主耶和華若不將奧祕指示僕人就一無所行，講成可以預測神下一步行動的公式，或把三章八節「誰能不說預言」，講成每一位信徒，都必須去批判別人。經文說的，是神的本性，以及被神的話抓住的人，說神說過的話。檢驗標準是：說話之後，是更多人看見神，還是更多人被傷害？"],["p","第四個偏差，是把三章十節的「欺壓」，只講成抽象的社會問題，忘了後面有一個一個受傷的人；或把整卷書，講成社會革命的手冊，拿來批判某個企業、政黨或國家。陪伴與保護受傷的人，優先於論斷欺壓人的人；神要的公義，出於認識神。檢驗標準是：受過欺壓的人，是被看見，還是又被要求原諒、要求忍耐？"],["p","第五個偏差，是把三章十四節「壇角必被砍下」，講成敬拜與聚會本身是壞的；或把十五節的房屋，講成擁有財富就是有罪；或把十一節的敵人，講成確定的國家，推算日子。經文針對的，是一邊行欺壓、一邊求平安的人；本講義不推算，也不套用到今日任何政權。檢驗標準是：會眾是更真實地敬拜、更誠實地檢查自己，還是更熱衷議論別人？"],["d",["我怎麼分辨，一個人說「神給我一句話」，是真是假？","三章七節給我們一個很重要的提醒：神是說話的神，祂的話，先於祂的手；真僕人的記號，是他說的，是神已經說過的話。所以，我們可以用三個問題來分辨。第一，這句話，與聖經已經說的，一致嗎？第二，這句話，帶人更認識耶穌，還是更倚靠某一個人？第三，這個人的生命，有沒有悔改的果子，願不願意被人檢驗？如果一個人說的話，與聖經不合，或叫人恐慌、逼人順服他，就要小心。我們不需要不信所有人，也不需要輕信所有人；我們可以安靜、謙卑地，把它放在聖經與團體面前，一同分辨。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：我們很習慣「為了和諧，不說真話」。在華人的家庭與教會文化裡，說真話，常常被當作破壞關係；忍一忍，就過去了。三章八節說，主耶和華發命，誰能不說預言呢？這不是叫我們去批評別人，而是提醒我們：當神把一句話放在心裡，我們有責任，用溫柔而真實的話，說出來。以弗所書說，要與鄰舍說實話，因為我們是互相為肢體。這個星期，不妨問自己：有沒有一句話，我一直沒有說？是一句道歉，是一句感謝，還是一個提醒？"],["p","第二個問題：我們很習慣「用恩典，來掩蓋問題」。教會裡，常有人說，神是愛，要饒恕，不要再提。這句話，對真悔改的人，是福音；可是，對受傷的人，若被拿來叫他沉默，就成了第二次的傷害。三章十節，神看見欺壓，並且說話。這個星期，不妨在一位安全的同伴面前，誠實說一件事：我們的團體裡，有沒有一個受傷的人，因為「不要再提」，一直沒有被聽見？"],["d",["我在教會或家庭裡受過傷，別人卻一直叫我「要饒恕」，我該怎麼辦？","首先，你所受的，神看見，這一點，三章十節說得很清楚。饒恕，是福音很重要的一部分，可是，饒恕不是叫你假裝沒事，也不是叫你立刻回到傷害你的地方。你可以先對神說實話：主，我很痛，我還沒辦法。第二，找一位安全、願意聽的人，不是急著給建議，只是陪伴。第三，如果傷害仍在發生，或牽涉到人身安全，請你先保護自己，必要時，尋求專業的協助。饒恕，是一個過程，神不會催你；祂會陪你，一步一步走。你不需要因為還沒有饒恕，就覺得自己不夠屬靈。"]],["h","七、活出321——被認識的人，先聽，再說"],["p","耶穌是我的榜樣。祂是好牧人，認識自己的羊，我的羊也認識祂；祂把從父所聽見的，都告訴我們。在客西馬尼園，祂說，不要成就我的意思，只要成就你的意思。祂是先聽的人，也是為羊捨命的牧人。"],["p","聖經是我的準則。我們讀三章，不是要拿它去責備別人，也不是要推算日子，而是看見：聖經的準則，既告訴我們，我們是被神認識的人，也提醒我們，被認識，就有託付，有同行的約，有說真話的責任。"],["p","聖靈是我的引導。是聖靈，叫我們能夠聽見神的聲音，也能夠分辨，哪些話是神的，哪些是自己的。求祂幫助我們，在說話之前，先安靜；在行動之前，先聽見。"],["p","讓耶穌作王。無己，是放下我是蒙愛的人、所以可以放心不用改變的特權感，也放下說真話會得罪人、不如不說的懼怕。讓耶穌作王，就是讓祂決定，我先聽什麼，我說什麼，我放下什麼。被揀選，不是特權，是被託付。"],["p","讓耶穌得著一切的榮耀。神從埃及領我們上來，認識我們，叫我們聽見，又給我們一個說的機會；這是祂的作為，不是我們的功勞。一切榮耀，歸給耶穌。"],["p","建立屬神的體系。一個屬神的群體，是一群先聽神、彼此同行、彼此說真話，也保護受傷之人的人；我們不在祭壇前，掩蓋彼此的罪，大家的焦點，都在耶穌，不在自己的位置，也不在自己的擁有。"],["d",["「先聽，再說」，具體可以怎麼做？","可以從一個很小的習慣開始：每天早上，在看手機之前，花五分鐘，找一個安靜的地方，讀一小段聖經，比如三章一至二節。讀完以後，不急著禱告，先安靜一分鐘，問自己：神今天，對我說了什麼？然後，把你聽見的，寫成一句話。這就是「先聽」。到了「說」的時候，可以選一位你在乎的人，用溫柔的語氣，說出一句真實的話，例如：我最近在讀一段經文，它提醒了我一件事。不需要說很多，不需要糾正別人，只是見證。如果你發現，自己很難開口，也不要責備自己；先對神說，主，我怕，求祢給我勇氣，也給我智慧。"]],["h","八、四種心，一個邀請"],["p","驕傲型的人說：我是蒙揀選的人，我不需要改變。經文對他說：因此，我必追討。正因為被神認識，才不能把恩典當作特權。承認自己需要回頭，不是失去位置，是回到本位。"],["p","恐懼型的人說：我怕說真話，會得罪人，也怕神的追討。經文對他說：神的話，是先於祂的手；祂先說，祂警戒，因為祂還在乎。你可以先把你的怕，說給祂聽，然後，求祂給你一句，溫柔而真實的話。"],["p","羞恥型的人說：我做過不正直的事，我不配被神認識。經文對他說：神認識你，不是因為你配，是因為祂先愛你。你可以帶著這份羞愧，來到好牧人面前；祂不是只帶回證據，是把你整個背回家。"],["p","受傷型的人說：我被欺壓過，我很痛，也很生氣。神看見你。三章十節說，這是耶和華說的，神在這個控訴上，親自簽了名。你不需要現在就原諒誰，可以先對神說：求祢醫治我，求祢保護我，並在適當的時候，使我再有力量。"],["h","九、這一週，你可以做的幾件事"],["p","第一，每天早上，在看手機之前，花五分鐘，先聽神的話，讀三章一至二節，問自己：神今天，對我說什麼？連續七天。"],["p","第二，找出一件，你一直沒有順服的事，今天安靜十分鐘，對神說：主，我與祢之間，有什麼地方，還沒有約好同行？不用急著得到答案，先誠實地問。"],["p","第三，找一位你在乎的人，用溫柔而真實的話，說一句神放在你心裡的話：不批評，不糾正，只是見證。"],["p","第四，找出一位正在被欺壓、或曾經受傷的人，這個星期，用一句具體的話，向他說：我看見你，神也看見你。不解釋，不指責，只是陪伴。"],["p","第五，把三章二節抄在紙上，放在常常看到的地方：「在地上萬族中，我只認識你們」。每次看見，就對神說一次：主，我是被祢認識的人，我願意聽。"],["p","我宣告：我是被神認識的人，神把我放在心上，我不怕祂的話。"],["p","我宣告：我先聽神的話，再說神的話，我用溫柔而真實的話，與人同行。"],["p","我宣告：神看見受欺壓的人，我願意站在受傷的人這一邊，用陪伴，而不是論斷。"],["p","我宣告：耶穌是我的王，我不倚靠祭壇、不倚靠房屋，我只倚靠祂。"],["d",["這一週我可以立刻做的一件事是什麼，才不會只停在聽道？","最簡單的，是今晚睡前，拿一張紙，寫下一句，神最近提醒你、卻你一直沒有說出口的話，例如一句道歉，一句感謝，或一個提醒。在紙的左邊，寫下這句話；在右邊，寫下：主，我把它交給祢，求祢給我智慧，也給我勇氣。然後，安靜五分鐘，不用求答案，只是誠實地把它放在神面前。明天，選一個適當的時間，用溫柔的語氣，把這句話，說給那位對象聽。如果你發現，自己還沒有預備好，也不要責備自己，繼續每天做一個小動作，先聽，再說。神是一位，認識你的神，祂會一步一步帶你。"]],["h","十、結語"],["p","三章，是一位牧人，在颱風前夕，敲門的聲音。開頭，是神說：你們全家，是我從埃及地領上來的；中間，是七個豈能，一步一步，把我們帶到不能不說；最後，是神看見欺壓，說：這是耶和華說的，過冬的房屋，象牙的房屋，都要歸無有。"],["p","在這一章，神要我們看見祂的心：祂是一位，把我們放在心上的神；祂是一位，先說話、後動手的神；祂也是一位，看見受欺壓的人、不讓祭壇成為罪的避難所的神。祂追討，因為祂愛得認真；祂警戒，因為祂還在乎。"],["p","所以，請你記得今天這一課的三個重點：被認識，就是被託付；聽見了，就不能不說；敬拜與房屋，都不能成為罪的避難所。這一課的焦點，不在你能做多少，不在別人是否懂你，也不在環境是否改變，而是那位好牧人耶穌：祂認識我們，把父的話都告訴我們，並且為我們捨命。"],["p","主耶穌，謝謝祢，從埃及把我們領上來，也這樣認識我們；求祢使我們先聽祢的話，再說祢的話，也看顧每一位受傷的人。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["m","帶領說明：今天這一課，我們用三個化來走一遍：先把話放進自己心裡（內化），再一起想通、說出口、走一步（消化），最後把這一課帶到人面前（轉化）。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化　內化（約20分鐘）"],["m","目的：讓每個人先把經文放進自己的心裡，看見自己的位置，不急著討論別人。"],["n","1. ★ 三章二節神說：在地上萬族中，我只認識你們。你上一次覺得自己「被神認識」，是在什麼時候？請說出大概是哪一類事，不必細節。"],["n","2. ★ 三章一節「當聽」。這個星期，你有沒有一個固定的時間，是專門用來先聽神的話的？請說出一個。"],["n","3. ★★ 三章八節「誰能不說預言呢」。你有沒有一句話，是神放在你心裡、你卻一直沒有說出口的？請說出大概是對誰，不必細節。"],["n","4. ★★★ 請在安靜中想一件事：一件你與神之間，一直沒有順服的事。現在用一句話寫下它，並寫下你願意讓誰陪你一起面對。"],["m","帶領提醒：請先安靜念三章二節，再開始。不要點名逼人說。這一章會碰到「欺壓」與「受傷」：如果有人提到被傷害、被欺負、家庭暴力、性暴力或長期的壓力，不追問細節，不要求原諒，不對正在流淚的人說「你要有信心」，也不說「你應該先饒恕」，會後單獨關心，必要時協助他尋求專業的幫助。"],["s","第二化　消化（約35分鐘·主軸）"],["m","目的：看見自己、聽神說話、想通關卡、說出口、走一步，讓這一課成為自己的話。"],["t","【看】看見自己"],["n","5. ★ 看見自己：對照三章二節，你有沒有把「被神愛」，當成「不會被神管教」？請說出一件具體的事，不必細節。"],["t","【聽】聽神說話"],["n","6. ★★ 聽神說話：安靜三分鐘，聽三章十三節「當聽」。你心裡聽見的，第一句話是什麼？請說出你聽到的第一個感覺。"],["t","【想】想通關卡"],["n","7. ★★★ 想通關卡：三章二節，神先說「我只認識你們」，再說「因此，我必追討」。請用自己的話向組員說明：為什麼神的追討，是愛，不是恐嚇？"],["t","【講】說出口"],["n","8. ★★ 說出口：用一句話向一位組員說，你這個星期可以對誰，說一句溫柔而真實的話，並當場說出這句話。"],["t","【行】走一步"],["n","9. ★★★ 走一步：請決定這個星期的哪一天，每天先安靜聽神的話五分鐘，寫下時間，並說出誰會提醒你。"],["m","帶領提醒：依【看】【聽】【想】【講】【行】的順序走，每一步留足時間。【講】的時候，只要說出一句、一個名字、一個時間，不必講故事。若有人眼淚掉下來，不追問細節，也不要求他原諒誰，先安靜陪著，會後單獨關心。"],["s","第三化　轉化（約25分鐘）"],["m","目的：把這一課帶出去：進入家庭、職場、教會的真實關係，並讓福音繼續繁殖。"],["n","10. ★ 你身邊有沒有一位，曾經受傷、卻沒有人聽他說話的人？請說出名字，並決定這個月用一句具體的話關心他。"],["n","11. ★★ 你的小組或教會，有沒有一件事，是「不要再提」、卻其實還有人受傷的？請說出具體的一件，並說你可以先從哪裡開始。"],["n","12. ★★ 你有沒有一位，曾經用溫柔而真實的話，對你說過一句重要的話？請說出名字，並決定這個月向他說聲謝謝。"],["n","13. ★★★ 920 操練：找出你的那一個「2」，就是你最想陪他一起「先聽神的話」的那位，這個星期向他分享，並且當場說出他的名字。"],["n","14. ★★★ 【必做】請在這個星期，把這一課用三句話講給一位教會外的朋友聽，並在下次小組回報：你對誰講的、在哪裡講、他的反應是什麼。"],["m","帶領提醒：請特別提醒：不要在小組裡，用這一章去指責任何人，也不要用它去批評任何教會、講員、政府、政黨或企業，不要用經文推算任何時間，或套用到今日任何國家或領袖。若有人分享被欺壓、被傷害、性暴力、家庭暴力、流產、不孕或自傷的經歷，不追問細節、不要求原諒，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助尋求輔導或其他專業的協助。"],["s","收尾（5分鐘）"],["p","請大家輕輕閉上眼睛，把今天寫下的那一件事，放在神面前。一起念三章二節。"],["p","由帶領者為每一位禱告：求神使我們先聽祂的話，再說祂的話，也看顧每一位受傷的人。散會前，彼此問一句：你這個星期，要先聽神的哪一句話？"]]},"4":{"no":4,"vol":"《321阿摩司書講義》第4課·阿摩司書第4章","title":"你們仍不歸向我——母牛、五次、迎見","chars":5114,"min":60,"deep":8,"dchars":1856,"tchars":1342,"blocks":[["h","一、山上的人，山腳下的人（4:1--3）"],["p","弟兄姊妹平安。傍晚六點，菜市場快要收攤了。一位賣菜的阿姨，把一袋賣不完的青菜，塞進一位老先生的手裡，說：拿去吧，明天就爛了。老先生推了兩下，還是收下，低聲說了一句謝謝。同一個時間，離市場不遠的山坡上，有一戶人家，餐桌上擺著剛剛送到的外送，一家人還在討論：今天要開哪一瓶酒。這兩個畫面，隔著一條馬路，卻像隔著兩個世界。阿摩司書第四章，就是從這樣的兩個世界開始的。"],["p","阿摩司站在北國的聖所伯特利，對一群住在撒馬利亞山上的人說話。撒馬利亞，是北國的京城，建在山上，視野很好。住在山上的人，生活不錯，所以阿摩司說：你們像巴珊的母牛。巴珊是約旦河東的牧地，以肥美出名，那裡的牛吃得好，長得壯。這個比喻，說的是一群過得很舒服的人。"],["p","他們是誰？經文的語法全是陰性複數，所以有人說，是撒馬利亞富有的婦女；也有人說，用陰性只是一個比喻，指整個安逸的上層，包括有權有勢的男人。經文沒有把這件事說死。本講義不替任何一群人貼標籤，也不把這節經文當成貶低哪一個性別的話；我們守住經文給的事實，就是他們做了兩件事：欺負貧寒的，壓碎窮乏的。"],["p","欺負，是一點一點地剝削；壓碎，是壓到再也站不起來。這不是偶爾失手，而是一種日常。更刺人的是下一句：他們對家主說，拿酒來，我們喝吧。前半句是別人的血汗，後半句是自己的酒杯，兩句話放在一起，什麼都不用多說。"],["p","可是請你看神怎麼開口：當聽我的話。神先叫他們聽。連欺壓人的人，神還是先說話，不是先丟出刑罰。這個「聽」字，是整卷書很重要的一個字，我們等一下再看。但是在這之前，我們要先站在另一邊：貧寒的，窮乏的。他們被欺負的時候，也許沒有人聽見，也許他們自己都不敢開口。這幾節經文，先對他們說：神聽見了，神看見了，祂記得。"],["p","二節，神指著自己的聖潔起誓。起誓，不是發脾氣。聖潔是神最根本的本性，祂拿這個作保，是在說：受欺負的人的哭聲，不是小事。接著是鉤子與魚鉤的畫面。這兩個字很難確定，有人讀作釣具，有人讀作盾牌或籃子與鍋；我們不替經文補上細節，只抓住共同點：被拖走，沒有尊嚴地被帶走。三節說，他們各人從破口直往前行。城牆本來是保護的，現在成了破口。這不是神喜歡破壞，而是一個一直壓碎別人的做法，最後也壓到自己身上。我們讀這段，不要幸災樂禍；先要看見，被欺負的人，終於被神記起來了。"],["d",["神為什麼先叫欺壓人的人來聽，而不是直接審判？","因為在這一章裡，神的第一個動作，從來不是丟出刑罰，而是開口說話。「當聽我的話」這句話，說明神還想被聽見，還想有人回頭。這不是軟弱，是神的忍耐。我們從這裡可以學到兩件事：第一，在人看來已經無可救藥的人，神仍然先給他聽的機會；第二，神的忍耐不是縱容，因為接下來的起誓與破口，說明祂不會對被欺負的人的哭聲沉默。陪伴受傷的人，永遠優先；可是我們也不要忘記，連傷害人的人，神也還在呼喚。我們自己，也常常在這個位置：我們曾是被聽見的人，所以願意去聽別人。"]],["h","二、伯特利的熱心（4:4--5）"],["p","接下來，阿摩司把話轉到敬拜。四節說：任你們往伯特利去犯罪，到吉甲加增罪過。伯特利與吉甲，是北國最熱鬧的聖所，人來這裡，是為了尋求神。可是阿摩司用的動詞是「犯罪」，而且是「加增罪過」，一次比一次多。這是一句反諷：他把祭司召人敬拜的話倒過來說，讓聽的人，聽見自己的行為被說穿了。"],["p","他們有多熱心？每日早晨獻祭；十分之一，每三日就獻上。律法的十分之一，是每三年一次，他們熱心到連三天都不肯少。五節接著說：獻有酵的感謝祭，把甘心祭宣傳報告給眾人。祭物、十分之一、感謝祭、甘心祭，樣樣都有，還大聲告訴別人。這樣的熱心，若放在今天，也許我們會稱讚。可是阿摩司說了一句話，把整個畫面翻過來：因為是你們所喜愛的。"],["p","這句話，要停下來想。他們來，不是為了遇見神，而是為了做自己喜歡的事。祭壇成了舞台，感謝成了宣傳。問題不在祭物不夠，也不在次數不夠，問題在他們心裡的方向：為了誰。"],["p","這裡要很小心。阿摩司不是說敬拜不好，也不是說獻祭應該停止。他說的是：當敬拜與公義分開，當一個人上午獻祭、下午壓碎窮人，敬拜就成了神不能接納的東西。第五章21至24節，會把這件事講得更清楚；眼前我們只留一個問題：我來到神面前，是為了祂，還是為了我所喜愛的？"],["p","你可以想一想：上一次你在聚會裡很感動，是因為遇見了神，還是因為音樂很好、氣氛很好、大家都很投入？這兩種感動，不一定互相排斥，可是只有一種，會把人帶到山腳下，帶到需要的人面前。"],["d",["我很熱心敬拜，聽到這一段會不會覺得自己被批評了？","不需要。這一段不是用來否定任何一位認真敬拜的人，也不是說獻祭、奉獻、事奉不重要。經文真正的重點，是最後那句話：因為是你們所喜愛的。你可以用三個問題，安靜地問自己：第一，我獻上的時候，心裡想的是神，還是想被人看見？第二，我的敬拜，有沒有連到我怎麼對待人，特別是比我軟弱的人？第三，如果有一個星期，沒有人看見我的獻上，我還會這樣做嗎？不需要急著回答，也不必責備自己。你可以對神說：主，求祢使我的敬拜，更靠近祢，也更靠近祢所愛的人。如果你曾在教會裡被人說「你只是做表面」，請記得，這一段不是用來指責某一位弟兄姊妹的熱心。"]],["h","三、原文亮光：聽、轉、迎（4:1、6--12）"],["p","這一章有三個原文字，剛好是這一課的路。第一個是「聽」，希伯來文 שָׁמַע（shama），出現在4:1的第一句：你們當聽我的話。這個字的基本意思，是「聽見，並且回應」。在希伯來人的心裡，聽，不只是耳朵的事，而是聽了之後要行動。「聽」在這一章，是對欺壓人的人說的命令，也就是：神仍然想被聽見。"],["p","這個字，三十秒就可以轉成生命。今天晚上，你可以做一件很小的事：在睡前，不說話三分鐘，只問神一句：祢要我聽見什麼？然後，你再問自己：我有沒有一個人，是我最近不想聽的？聽神，常常從聽人開始，特別是那些不想被聽見、卻一直在說話的人。"],["p","第二個是「轉」，希伯來文 שׁוּב（shuv），在4:6、8、9、10、11，五次出現，都是「你們仍不歸向我」的「歸向」。這個字的基本意思，是「轉身、回頭、回來」。在先知書裡，是悔改最常用的字。請你留意五次的句式：每一次都以「不」開頭，每一次都連到「這是耶和華說的」。這個字，也在翻譯時，常被誤讀成「道德進步」；其實，它更像是一個人轉過身，面向另一個方向，朝向一個人。"],["p","這個字，三十秒怎麼轉成生命？你可以問自己：有沒有一件事，神一直叫我回頭，我卻一直說「等一下」？不要列一張很長的清單，只要誠實說出一件。轉身，不是完成一個很大的改變，而是現在，面向祂。"],["p","第三個是「迎」，希伯來文 לִקְרַאת（liqrat），在4:12：「你當預備迎見你的神」。這個字，字面是「迎著、向著」，用在去迎接客人，也用在出19:17：摩西領百姓出營迎接神，在西奈山下站立。同一節的「預備」，是 הִכּוֹן（hikkon），有「站穩、預備好」的意思。這個動詞本身是中性的，可以是預備承受審判，也可以是預備去遇見神。解經者有不同的讀法：有人讀作最後的警告，有人讀作最後的邀請。本講義兩面並陳，並且指向：你今天，就可以站起來，走向祂。"],["p","三十秒，轉成生命：你今天有沒有一個迎見神的時間？一個位置？一個名字？不一定是很長的靈修，可以是在上班前，站在窗邊，對神說一句：主，我來了。把三個字連起來，就是這一章的路：聽，神一直在說話；轉，我願意回頭；迎，我今天就走向祂。"],["d",["「仍不歸向我」出現五次，是不是在告訴我們神的忍耐是有次數的？","不是。五次是這一章的描寫，不是一個計算神忍耐次數的公式。經文每一次，都沒有說「所以我不要你們了」；神每一次，都是在災難之後，再開口。我們若把「五次」讀成一個數字，推論第幾次之後神就不再給機會，就離開了經文，也會讓人更焦慮，而不是更靠近神。更好的讀法是：五次，是神一次又一次呼喚的描寫，說明祂的忍耐，比我們的拒絕更長。新約也說，神的恩慈是領人悔改的。我們看這五次，不是要算次數，而是要看見：一位神，一次又一次，向一群人伸手。"]],["h","四、五次呼喚，一個邀請（4:6--13）"],["p","現在，我們把五次災，從頭走一遍。第一次，六節，缺糧：牙齒乾淨，就是沒有東西可以吃。請你留意，神說：我使。祂沒有躲在災難後面。為什麼？因為這些災，不是要摧毀他們，而是要叫他們回頭。災難成了神的聲音，是為了讓他們停下來，問一句：我們怎麼了？"],["p","第二次，七、八節，缺水。停在收割前三個月，秧苗已經長出來，農夫的力氣已經花了，雨卻停了。更痛的是比較：這城有雨，那城沒有。人走了很遠的路，找一口水，到了，卻喝不夠。他們有行動力，有毅力，什麼路都肯走，唯獨沒有走向神。人在缺乏中，常常什麼路都肯走，只是不肯走向神。"],["p","第三次，九節，病與蟲。旱風、霉爛、剪蟲，先是天，再是地，最後是小小的蟲。這些，是每年都可能遇到的事。神把日常，變成了說話的方式。可是，我們要停下來說清楚：不是每一場蟲害、每一次歉收，都是為了某個人的罪。這是神對那一群人，藉先知所作的解釋；我們學的是：生活裡有缺乏的時候，我願不願意停下來，問神一句：祢要對我說什麼？"],["p","第四次，十節，瘟疫與刀劍。這一次，不再是田，是人。像在埃及一樣，這句話有很深的諷刺：以色列是從埃及被領出來的，埃及所受的災，本來不屬於他們；如今，他們活得越來越像埃及。蒙恩的身分，不能取代轉回的行動。這一節不容易讀，少年人被殺；我們不要讀得太快，也不要把任何一場戰爭、任何一次災難，說成是神對某個群體的懲罰。面對受苦的人，我們先陪伴。"],["p","第五次，十一節，像所多瑪、蛾摩拉。可是，請你看下一句：好像從火中抽出來的一根柴。一根燒了一半的木頭，被人從火裡搶了出來。黑了，焦了，也許還在冒煙，可是被救出來了。神做了兩件事：祂傾覆，也抽出。面對這樣的恩典，他們怎麼回應？你們仍不歸向我。"],["p","然後，十二節，聲音變了。以色列啊，連叫兩次。這不是審判官的語氣，而是一位父親站在門口，叫孩子的聲音。「如此行」是什麼？經文沒有說，這個留白，是故意的。接著是命令：你當預備迎見你的神。這個「預備」，不是一張死刑通告，而是一個邀請：在神來之前，你自己先走向祂。十三節，阿摩司唱了一首短短的頌詞：那創山、造風、將心意指示人的，他的名是耶和華，萬軍之神。我們要迎見的，是大過一切、卻靠近人心的那一位。敬畏，不是恐慌，是認識祂之後，願意向祂走去。"],["d",["「預備迎見你的神」是不是一個末日的恐嚇？","不是，也不應該被用來嚇人。這一句話裡，有三個線索：第一，「預備」與「迎見」，在西奈山下，是以色列人預備好、遇見神的場景，是帶著期待的動作；第二，十三節的頌詞，沒有一個字說「所以你要害怕」，它只說祂的名字；第三，神連叫兩次「以色列啊」，是父親叫孩子的聲音。我們不用這一節去算日子，不套用任何末世時間表，也不用它去恐嚇會眾。它的意思，是今天就轉身：不是等某個日子，而是現在，回到祂面前。如果你因為這一節，心裡更怕，請先回到十三節的名字：祂是創造者，也是認識你的神。祂叫你的名字，是要你過來。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把四章一節的「巴珊的母牛」，講成貶低女性，或把罪全推給某一個性別。這個比喻，解經者有不同看法，有人說是富有的婦女，有人說是整個安逸的上層；本講義不替任何一群人貼標籤，只守住經文給的事實：神看見被欺負的人。檢驗標準是：會眾聽完，是更看見被欺負的人，還是更輕視某一群人？"],["p","第二個偏差，是把四章四至五節，講成阿摩司反對獻祭與敬拜。他反對的是沒有公義、沒有生命、只為自己所喜愛的敬拜；敬拜本身不是問題。第五章21至24節，還要把兩面再講清楚。檢驗標準是：會眾聽完，是更不敢敬拜，還是更認真地讓敬拜與生活連在一起？"],["p","第三個偏差，是把四章六至十一節的五次災，講成每一場災難、每一次缺乏，都是神為某個人的罪所降。這是神藉先知，對那一群人所作的解釋；我們不把它套用在今天任何一位受苦的人身上，也不用「五次」去算神忍耐的次數。檢驗標準是：受苦的人，是被陪伴，還是被暗示「你一定做錯了什麼」？"],["p","第四個偏差，是把四章十二節的「預備迎見你的神」，講成末日的恐嚇，或套用成確定的末世時間表。「預備」可以讀作最後的警告，也可以讀作最後的邀請；本講義兩面並陳，並指向今天就轉身，不算日子。檢驗標準是：會眾聽完，是更愛主、更想回頭，還是更恐慌、更怕世界？"],["p","第五個偏差，是把阿摩司書第四章，講成一份社會革命的宣言，或企業批判，或用來指責任何講員、教會、政府。神要的公義，出於認識神，不取代敬拜；這一章先說神看見貧寒的人，先說神呼喚人回頭。陪伴與保護受傷的人，優先於論斷欺壓人的人。檢驗標準是：會眾聽完，是更認識神，還是更熱衷批評別人？"],["d",["我身邊有人一直不肯悔改，是不是代表神已經放棄他了？","不是。這一章最特別的，就是五次「你們仍不歸向我」之後，神還是說：以色列啊，你當預備迎見你的神。在人的眼裡，一個一直不肯回頭的人，也許早就沒有希望；可是在神的手裡，每一個人都還在被呼喚。我們也不要把自己當成神的代言人，替別人宣布「他已經被放棄了」。比較好的做法，是三件事：第一，為他禱告，不是求神趕快懲罰他，而是求神使他停下來；第二，保持關係，不用責備，只用陪伴，讓他知道你還在；第三，守住自己的界線，特別是當他的行為在傷害你，或傷害別人的時候，你可以保護自己，也可以尋求牧者與專業的協助。保護受傷的人，永遠優先。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：我們很習慣用「做得多」來代替「回頭」。在華人的教會與家庭裡，一個人若很能奉獻、很肯服事、很準時，常被稱讚為很屬靈；這有它的美，也有一個代價：當一個人很忙、很熱心，反而最不容易停下來問：神是不是一直在叫我回頭？四章四至五節提醒我們：祭物、十分之一、感謝祭、甘心祭，樣樣都有，卻是因為那是他們所喜愛的。這個星期，不妨問自己：有沒有一件事，神一直在叫我轉，我卻用忙碌，把它蓋過去了？"],["p","第二個問題：我們很習慣「看不見山腳下的人」。華人社會很重面子，貧寒的人，常常不好意思開口；我們也容易把貧窮，看成是個人不夠努力，或運氣不好，然後安慰自己：各人有各人的命。四章一節說，神聽見了那些被欺負的人。這個星期，不妨在一位安全的同伴面前，誠實說一件事：我身邊有沒有一個人，我一直假裝沒有看見？如果有，我今天可以做的一件小事是什麼？"],["d",["我自己就是比較窮、比較軟弱的人，這一章對我說什麼？","這一章，先對你說：神看見你。四章一節，神替貧寒的與窮乏的開口；二節，祂指著自己的聖潔起誓；你的處境，不是小事。如果你正被欺負、被壓低、被忽略，這一章不是要你先反省自己做錯了什麼，而是先對你說：你不是沒有人記得。你也可以做三件事：第一，把你的處境，用最誠實的話，說給神聽，不需要整理；第二，找一位信得過的牧者或同伴，讓他知道你的需要，不需要獨自承擔；第三，如果有人在傷害你，特別是在身體、金錢、家庭上，請尋求適當的協助，包括專業與法律上的保護。神的呼召，不是要你忍耐一切，也不是要你原諒就要回到傷害裡。"]],["h","七、活出321——今天就轉身"],["p","耶穌是我的榜樣。舊約裡，神五次呼喚，百姓沒有回頭；新約裡，神差來了自己的兒子。耶穌來到人中間，不是坐在山上，而是來到貧寒的、窮乏的人中間；祂不只叫我們預備迎見神，祂自己走過來，迎見我們。祂是我們回家的榜樣，也是我們回家的路。"],["p","聖經是我的準則。我們讀四章，不是要用它去指責別人，也不是要推算任何時間，而是看見：聖經的準則，既要我們敬拜，也要我們公義；既要我們認真獻上，也要我們看見山腳下的人。兩件事，同時成立。"],["p","聖靈是我的引導。是聖靈，在我們心裡，叫我們聽見神一直在說的話。求祂幫助我們，看見自己的「仍不歸向」，也有勇氣，今天就轉身。"],["p","讓耶穌作王。無己，是放下我在山上、我過得好是我應得的這種驕傲，也放下「我怕承認，所以不敢回頭」的懼怕。四章的問題，不是他們不敬拜，而是敬拜的是自己所喜愛的。讓耶穌作王，就是讓祂決定我的敬拜，也決定我怎樣對待人。"],["p","讓耶穌得著一切的榮耀。神五次呼喚，把他們從火中抽出來，這是神的作為，不是人的功勞。我們的回頭，也不是我們比別人更好，而是神的恩慈領我們回頭。一切榮耀，歸給耶穌。"],["p","建立屬神的體系。一個屬神的群體，不是一群很會敬拜的人，而是一群肯回頭的人，也是一群看見貧寒的人、與他們站在一起的人。我們的焦點，在耶穌，不在自己的熱心，也不在別人的錯誤。"],["d",["「回頭」具體可以怎麼做，才不會只停在感動？","可以從一個很小的動作開始：這個星期，找一個安靜的十分鐘，拿一張紙，寫下神一直叫我回頭、我卻一直沒有回頭的那一件事，只寫一件，不要列清單。在紙的左邊，寫下那件事；右邊，寫下一句話：主，我今天回來了。然後，大聲對神說出來。第二步，把這件事，告訴一位信得過的同伴，請他這個星期問你一次：你轉了嗎？第三步，為這件事，決定一個很小、很具體、這個星期可以做的行動，例如：打一通電話、還一筆錢、道一次歉、停掉一個習慣。回頭，不是一個大的改變，而是一個小的轉身，也是一個很誠實的開始。如果你發現，這件事涉及很深的傷害、成癮，或家庭裡的暴力，請同時尋求牧者與專業的協助，不要獨自面對。"]],["h","八、四種心，一個邀請"],["p","驕傲型的人說：我在山上，我過得好，是我努力得來的，不需要誰來提醒我。經文對他說：當聽我的話。神仍然先開口。承認自己需要聽，不是軟弱，是回頭的開始。"],["p","恐懼型的人說：我怕承認錯了，會失去一切；我怕一回頭，什麼都不一樣了。神說：你當預備迎見你的神，而這位神的名，是創造者，也是將心意指示人的神。祂不是要你怕，是要你過來。你可以先把你的怕，說給祂聽。"],["p","羞恥型的人說：我已經這麼多次沒有回頭，我哪有資格再回去。可是經文裡，神五次呼喚，每一次都沒有說：所以我不要你們了。第十二節，祂還叫你：以色列啊。你可以帶著這樣的羞愧，對神說：主，我又來了。"],["p","受傷型的人說：我是那個被欺負、被壓碎的人，沒有人看見，我很受傷。神看見你。四章一節，神替貧寒的與窮乏的開口。這一章沒有說：你該先原諒誰，或你該先反省自己；你可以先對神說：求祢看見我，求祢醫治我，並在適當的時候，使我再有力量。"],["h","九、這一週，你可以做的幾件事"],["p","第一，每天睡前，花三分鐘，問神一句：祢要我聽見什麼？不用寫很多，只要誠實地聽。連續七天。"],["p","第二，找出一件神一直在叫你回頭、你卻仍然沒有回頭的事，這個星期，找一個安靜的十分鐘，對神說：主，我回來了。"],["p","第三，檢查你上星期的敬拜或奉獻，問自己：這是為了神，還是為了我所喜愛的？不需要責備自己，誠實地問就好。"],["p","第四，找出身邊一位貧寒或軟弱的人，這個星期，用一句話或一件小事，向他說：我看見你。不要用同情的口氣，用平等的口氣。"],["p","第五，把四章十二節抄在紙上，放在常常看到的地方：你當預備迎見你的神。每次看見，就對神說一次：主，我今天，就走向祢。"],["p","我宣告：神一次又一次地向我說話，我願意停下來聽。"],["p","我宣告：我不等災難，也不等某個日子，今天就轉身。"],["p","我宣告：我的敬拜，不只是為了我所喜愛的，也連到我怎樣對待人。"],["p","我宣告：耶穌是我的王，祂走向我，我也要預備好，迎見祂。"],["d",["這一週我可以立刻做的一件事是什麼，才不會只停在聽道？","最簡單的，是今天晚上，拿一張紙，在紙的上方寫：你們仍不歸向我。然後在下面，寫下兩個欄位。左邊的欄位，寫「我一直沒有轉的那一件事」；右邊的欄位，寫這個星期我可以做的一個小動作。寫完以後，念一次十二節，安靜三分鐘，對神說：主，我來了。然後，把這張紙放進聖經，每天讀一次四章，記下你讀到的一句話。一個星期以後，回頭看這一頁紙。你會發現，有些事，說出來之後，輕了一些；有些事，需要你找一位同伴，繼續談。如果你發現自己很難開始，也不要責備自己，繼續每天做這個小動作；神是一位，一次又一次，向你說話的神。"]],["h","十、結語"],["p","阿摩司書第四章，是山上的母牛、伯特利的祭壇、五次的呼喚，和一個邀請。開頭，是神看見被欺負、被壓碎的人；中間，是五次災，五次「你們仍不歸向我」；最後，是神說：你當預備迎見你的神，那位創山造風的主，是我們要走向的神。"],["p","在這一章，神要我們看見祂的心：祂是一位看見貧寒的人的神；祂是一位五次呼喚、不肯放棄的神；祂也是一位，在最後仍然叫「以色列啊」的神。祂沒有因為他們的不回頭，就轉身離開，而是繼續說話，繼續等。"],["p","所以，請你記得今天這一課的三個重點：神看見被壓碎的人；神一次又一次呼喚我們回頭；今天，就預備好，迎見祂。這一課的焦點，不在你能做多少，不在別人是否回頭，也不在環境是否好轉，而是那位親自走向我們、迎見我們的耶穌。"],["p","主耶穌，謝謝祢，一次又一次向我們說話，也看見被壓碎的人；求祢使我們，今天就聽見，今天就轉身，今天就預備好，迎見祢。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["m","帶領說明：今天這一課，我們用三個化來走一遍：先把話放進自己心裡（內化），再一起想通、說出口、走一步（消化），最後把這一課帶到人面前（轉化）。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化　內化（約20分鐘）"],["m","目的：讓每個人先把經文放進自己的心裡，看見自己的位置，不急著討論別人。"],["n","1. ★ 四章六節神說：你們仍不歸向我。你上一次因為缺乏或疲乏而停下來，是什麼事？請說出大概是哪一類事，不必細節。"],["n","2. ★ 四章一節神先叫人來聽。你最近有沒有一個人或一件事，是你不想聽的？請說出一個，不必細節。"],["n","3. ★★ 四章五節說：因為是你們所喜愛的。你的敬拜或奉獻裡，有沒有一部分，是為了自己所喜愛的？請說出一個。"],["n","4. ★★★ 請在安靜中想一件事：神一直叫你回頭、你卻仍然沒有回頭的一件事。現在用一句話寫下它，並寫下你願意讓誰陪你，一起面對。"],["m","帶領提醒：請先安靜念四章十二節，再開始。不要點名逼人說。這一章會碰到「被欺負」「貧窮」「災難」「悔改」：如果有人提到被欺壓、經濟困難、家庭暴力、成癮、憂鬱或輕生的念頭，不追問細節，不要求原諒，不對正在流淚的人說「你要有信心」，也不說「你一定做錯了什麼」，會後單獨關心，必要時協助他尋求專業的幫助。"],["s","第二化　消化（約35分鐘·主軸）"],["m","目的：看見自己、聽神說話、想通關卡、說出口、走一步，讓這一課成為自己的話。"],["t","【看】看見自己"],["n","5. ★ 看見自己：對照四章六至十一節，你最近有沒有一次缺乏、疲乏或不順，是你一直當成「環境的問題」，沒有問神的？請說出一個，例如工作、家庭、健康。"],["t","【聽】聽神說話"],["n","6. ★★ 聽神說話：安靜三分鐘，聽四章十二節神叫你：以色列啊。你心裡聽見的是什麼？請說出你聽到的第一個感覺。"],["t","【想】想通關卡"],["n","7. ★★★ 想通關卡：四章六至十一節，神五次說「你們仍不歸向我」，卻沒有一次說「所以我不要你們了」。請用自己的話向組員說明：這告訴我們神是怎樣的神？"],["t","【講】說出口"],["n","8. ★★ 說出口：用一句話向一位組員說，你這個星期可以先回頭的是哪一件事，並當場說出來。"],["t","【行】走一步"],["n","9. ★★★ 走一步：請決定這個星期的哪一天，做哪一個很小的動作來回頭，寫下時間，並說出誰會提醒你。"],["m","帶領提醒：依【看】【聽】【想】【講】【行】的順序走，每一步留足時間。【講】的時候，只要說出一句、一個名字、一個時間，不必講故事。若有人眼淚掉下來，不追問細節，也不要求他原諒誰，先安靜陪著，會後單獨關心。"],["s","第三化　轉化（約25分鐘）"],["m","目的：把這一課帶出去：進入家庭、職場、教會的真實關係，並讓福音繼續繁殖。"],["n","10. ★ 你身邊有沒有一位貧寒或軟弱的人，是你一直假裝沒有看見的？請說出名字，並決定這個月用一句具體的話或一件小事，向他說：我看見你。"],["n","11. ★★ 你的小組或教會，有沒有一位不好意思開口、卻有需要的人？請說出具體的一位，並說你可以先從哪裡開始關心他。"],["n","12. ★★ 你有沒有一位曾經在你不肯回頭的時候，仍然陪著你的人？請說出名字，並決定這個月向他說聲謝謝。"],["n","13. ★★★ 920 操練：找出你的那一個「2」，就是你最想陪他一起「今天就轉身、迎見神」的那位，這個星期向他分享，並且當場說出他的名字。"],["n","14. ★★★ 【必做】請在這個星期，把這一課用三句話講給一位教會外的朋友聽，並在下次小組回報：你對誰講的、在哪裡講、他的反應是什麼。"],["m","帶領提醒：請特別提醒：不要在小組裡用這一章去指責任何人「仍不歸向」，也不要說「你一定做錯了什麼」，不要用經文推算任何時間，或套用到今日任何國家、政黨或領袖，也不點名批評任何講員或教會。若有人分享被欺壓、貧窮、疾病、憂鬱、輕生的念頭、成癮或家庭暴力的經歷，不追問細節、不要求原諒，會後單獨關心，必要時協助尋求輔導或其他專業的協助。"],["s","收尾（5分鐘）"],["p","請大家輕輕閉上眼睛，把今天寫下的那一件事，放在神面前。一起念四章十二節。"],["p","由帶領者為每一位禱告：求神使我們今天就聽見、今天就轉身，也使我們看見山腳下的人。散會前，彼此問一句：你這星期要先回頭的那一件事是什麼？"]]},"5":{"no":5,"vol":"《321阿摩司書講義》第5課·阿摩司書第5章","title":"要尋求我，就必存活——哀、尋、水","chars":4904,"min":60,"deep":8,"dchars":1622,"tchars":1312,"blocks":[["h","一、倒在地上的民族（5:1--3）"],["p","弟兄姊妹平安。有一位姊妹，每個星期三下午，到一間安養院，帶長輩們唱詩歌。她說，最難忘的，不是唱詩的場面，而是一位阿嬤。那位阿嬤，每個星期三，都坐在最靠門的位置，眼睛一直看著門口。歌唱完了，大家散了，她還坐在那裡。姊妹問她：你在等誰？阿嬤說：沒有，我只是習慣看著門。今天這一章，一開頭，就有一個人倒在地上，沒有人來；而唱歌的那一位，是神自己。"],["p","阿摩司書五章一節：以色列家啊，要聽我為你們所作的哀歌。哀歌，是人死了以後才唱的歌。可是這時，以色列還活著：街上有買賣，聖所有人潮，節期的歌聲，一首接一首。先知站在活人面前，唱他們的喪歌。請你留意「作」這個動詞，原文是「舉起、扛起」。先知不是輕鬆地把這首歌丟出去，是像扛著一個擔子，把它扛到百姓面前。審判的話，從神口中出來，是公義的；唱出來，是哀歌。神不是在幸災樂禍，是在心痛。"],["p","二節只有一句，卻是整章的第一個畫面：以色列民跌倒，不得再起；躺在地上，無人攙扶。和合本註腳說，原文是「處女」，一位本來有大好前程的年輕女子，還沒有活夠，就倒下了。比「跌倒」更痛的，是「無人攙扶」：倒下以後，身邊沒有人。"],["p","三節把倒下換成數字：一座城派一千人出去，只剩一百；派一百人出去，只剩十個。我們不把它當算術題，也不拿它推算任何事。它是在說，要失去的是一個個家庭裡的一張張臉。讀到這裡，請先為將要失去親人的人哀哭。陪伴受傷的人，優先於議論傷害的原因。"],["p","還有一個字，請你記住：聽。神先說：你們要聽。這一章往後，我們會再遇見它。那位阿嬤，其實在等的，就是有人來「聽」她；而這一章裡的神，是一位先開口、也一直在等人回來聽的神。"],["d",["我看見有人跌倒、卻不知道怎麼幫，這一章要我學什麼？","第一，先停下來。這一章的第一個動作，不是分析，而是哀歌：神先為倒下的人哭。我們也可以先停一下，不急著給道理，不急著找原因。第二，蹲下來，問一句最簡單的話：我可以怎麼幫你？不用問「怎麼會這樣」。第三，做一件具體的小事：打一通電話、陪他去一趟醫院、請他吃一頓飯。如果你不知道怎麼做，也沒有關係，可以先對神說：主，祢看見這個人，請讓我也看見。陪伴受傷的人，是這一章給我們的第一個功課；至於誰該負責、為什麼倒下，可以放在後面，在安靜、安全的時候再談。"]],["h","二、你們要尋求我，就必存活（5:4--6）"],["p","哀歌唱完了，神開口，說的不是「我要滅你們」，而是一個邀請：你們要尋求我，就必存活。四節是全章的鑰匙。「尋求」是一個貼近的字，是登門求問，是把你的難處，帶到一位面前。神說：來找我。不是來找我的房子，是來找我。"],["p","接著，五節，神說了一句令人意外的話：不要往伯特利尋求，不要進入吉甲，不要過到別是巴。這三個地方，都是有故事的聖地：伯特利有雅各的夢，吉甲是進入迦南後紮營的地方，別是巴有亞伯拉罕與以撒築壇的記念。它們不是壞地方。可是神說，不要往那裡尋求。一個人可以去很多次聖地，卻從來沒有真的找到神。"],["p","原文有一個雙關語：吉甲聽起來像「被擄」，伯特利，意思是「神的家」，卻要歸於「亞文」，意思是虛無。地名在神口中，成了判詞。這不是在否定聖地的歷史，也不是叫人不要去聚會，是在問一句話：我在那裡，尋求的是地方，還是神？"],["p","六節把邀請再說一次：要尋求耶和華，就必存活，免得他在約瑟家像火發出，無人撲滅。二節是「無人攙扶」，六節是「無人撲滅」。兩個「無人」，在說同一件事：肯伸手的，只有神。「就必存活」這句話，這一章說了三次：四節、六節、十四節，一次比一次急。耶穌對一群人說過：你們不肯到我這裡來得生命（約5:40）。同一個邀請：生命，不是從地方來的，是從那一位來的。"],["p","請你想像這個畫面：一位父親，站在孩子的病床前，說的不是「我要處罰你」，而是「求你，來找我」。阿摩司書五章，就是這樣的一章。神的審判與神的邀請，是從同一顆心裡出來的。祂唱哀歌，因為祂看見倒下的人；祂說「尋求我」，因為祂願意他們活。這一章的每一個警告，背後都是一句：回來，我在這裡。"],["d",["尋求神自己，和參加教會聚會，到底是什麼關係？","兩者不是對手。聚會，是神給我們的恩典：在這裡，我們一起聽道、唱詩、禱告、彼此相愛。阿摩司說的，不是不要聚會，是不要把聚會當成神的替代品。你可以用三個問題，檢查自己：第一，我來聚會，是為了見神，還是為了心安？第二，如果這個星期沒有人注意到我，我還會來嗎？第三，聚會結束以後，我有沒有更愛神、更愛人？如果答案讓你不太舒服，不是要你離開聚會，而是請你帶著這些問題，回到神面前說：主，我要尋求祢自己。尋求神自己，常常就在聚會的裡面，在禱告的安靜裡，在翻開聖經的那一個早晨。"]],["h","三、原文亮光：聽、尋、水（5:1，4，24）"],["p","這一章有三個原文字，剛好是這一課的副題。第一個是「聽」，希伯來文 שָׁמַע（shama），一節的「要聽」，二十三節的「我不聽」。這個字，不只是耳朵聽到，是聽了就回應、就順服。神說：你們要聽我的哀歌；他們沒有聽，於是，神說：我不聽你們的歌。這是一個令人心驚的反轉：先是祂請人聽，後來是祂不聽。"],["p","三十秒轉成生命：你有沒有被人說過「你有沒有在聽」？聽，是一種關係。一個孩子對你說話，你一邊滑手機一邊「嗯、嗯」，他就知道你沒有在聽。我們對神，也是一樣。今天晚上，可以做一件很小的事：關掉聲音，翻開聖經，只讀五節，問神一句：祢要我聽見什麼？然後，安靜一分鐘。"],["p","第二個是「尋」，希伯來文 דָּרַשׁ（darash），四節的「尋求」。這個字的意思，是探問、求問，常常用在到神面前求問（創二十五章22節）。「尋求我」，與五節的「往伯特利尋求」，是同一個動詞：一個尋求神自己，一個尋求地方。同一個動作，對象不同，結果就不同。"],["p","三十秒轉成生命：你每天最先尋求的，是什麼？有人一醒來，先找手機；有人先想今天的壓力；有人先想自己是不是夠好。神說：先來找我。不是做完了才來，是先來。你可以從明天早晨開始：先對神說一句話，再看手機。這一句，就是在說：我尋求祢。"],["p","第三個是「水」。二十四節：惟願公平如大水滾滾。公平（mishpat）是審斷與對待的正確；後面的「江河滔滔」，原文是 נַחַל אֵיתָן（nachal eitan），意思是「恆常不斷的溪流」。巴勒斯坦的溪河，多半是雨季才有水；常流不斷的，很少。神要的公平，不是一個節期才出現的活動，是像一年四季都有水的河。"],["p","三十秒轉成生命：你的公平，是「節期型」，還是「常流型」？有人在特別的日子捐一筆錢，卻在平日對店員不耐煩；有人在聚會裡很溫柔，在家裡很嚴厲。常流的公平，是小事：不占人便宜、說話算話、對弱的人客氣。今天，就可以選一件小事，開始流。"],["p","把三個字連起來，就是這一章的路：聽（shama），神先請人聽，人沒有聽；尋（darash），神仍然邀請人來找祂；水（mishpat），找到祂的人，生命裡會流出公平。一個聽見、尋求神的人，自然會有一條常流的河；而一條沒有源頭的河，很快就乾了。"],["d",["我讀經、禱告都很認真，為什麼還覺得沒有「聽見」神？","這是很誠實的問題。第一，不要先責備自己。聽見神，常常不是一個激動的感覺，而是一個慢慢的熟悉。第二，聽，要有空間。很多時候我們一邊禱告，一邊在心裡開一張待辦清單，沒有留下安靜給神。可以試試：禱告的最後，留三分鐘，只是安靜。第三，聽，也要有行動。神說的話，往往在你下一個小小的順服裡，變得更清楚。第四，若很長時間，感到很空、很累，請你找一位信任的同伴談，或尋求輔導的協助。這不是不信，是需要被人陪著。神沒有離開你；你的尋求，祂都看見。"]],["h","四、城門口、日子與大水（5:7--27）"],["p","七節說：你們這使公平變為茵蔯、將公義丟棄於地的。茵蔯是苦草；本來該是甜的公平，在他們手裡成了苦的。然後，先知的話忽然斷開，插進一首詩：造昴星和參星，使死蔭變為晨光的，耶和華是他的名。請你留意「變為」這個動詞：人把公平「變為」茵蔯；神把死蔭「變為」晨光。同一個字，兩雙手。阿摩司要他們看見：造星的那一位，也是城門口的神。"],["p","九節說，祂使力強的忽遭滅亡，保障遭遇毀壞。這不是對某一個人的詛咒，是在說：用權勢築起來的安全，擋不住那位創造者。人以為房子、地位、關係，可以保住自己；神說，只有祂，才是真正的保障。"],["p","十至十二節，把鏡頭拉到城門口：這是審案的地方，是一個城最後的公道。說正直話的人，在那裡被憎惡；貧民被踐踏，被勒索麥子；義人被苦待，窮乏人被屈枉。神說，你們用鑿過的石頭建造房屋，卻不得住在其內；栽種美好的葡萄園，卻不得喝所出的酒。拿別人的飯碗換來的，住不安穩。神說：我知道你們的罪過何等多。受欺壓的人，常常覺得沒有人知道；這一句話，是對他們說的：神知道，神看見。"],["p","十三節很難讀：通達人見這樣的時勢，必靜默不言。是智慧、是害怕、還是諷刺？各家的讀法不同。可以確定的是，在一個說真話會受罰的地方，人會安靜下來。若你曾經因為害怕而不敢開口，這一節沒有在責罵你。而下一節，立刻又為人開了一扇門：你們要求善，不要求惡，就必存活；要在城門口秉公行義，或者，耶和華向約瑟的餘民施恩。「或者」這個字，說明恩典是神自由的施予，不是可以討價還價的合約。"],["p","十六至十七節，哀號從街市，一直傳到葡萄園。葡萄園，本來是歡呼收割的地方，現在成了哭聲。原因是：我必從你中間經過。神離他們很近，近到不能再假裝沒有事。"],["p","十八至二十節，是這一段的轉折：想望耶和華日子來到的有禍了！他們天天盼望，以為那日是光明。阿摩司說：那日黑暗沒有光明，像人躲開獅子，又遇見熊，進了房屋，以手靠牆，就被蛇咬。連家，也不是避難所。這不是神變了，是他們站的位置錯了：一邊盼望神來，一邊在城門口壓人。我們不推算那一天，也不排任何時間，只問今天：我盼望祂來，我今天的生活，經得起祂來嗎？"],["p","二十一至二十四節，神說：我厭惡你們的節期，我不聽你們彈琴的響聲；接著說：惟願公平如大水滾滾，使公義如江河滔滔。這一段要兩面一起讀：一面，神真的喜悅敬拜；另一面，神不要一個與城門口、貧民、義人斷了線的敬拜。公平不是敬拜的替代品，是敬拜長出來的果子。最後三節，神把他們帶回曠野：你們抬著為自己所造的神。人若不尋求神，就去造神；造出來的神，總是方便的。審判的話，不是報復，是神一次又一次，用各樣的聲音，叫人回頭。"],["d",["我要怎麼在自己的「城門口」，說真話，又不傷人？","先分清楚，說真話，不是說得很大聲，也不是急著指出別人的錯。可以試三步：第一，先問自己動機：我是為了讓事情更公平，還是為了讓自己贏？第二，選對時間與地方：能私下說的，不要當眾說；能當面說的，不要在背後說。第三，用具體的事實，說自己看見的，不說別人的心思：例如：這份帳目和上個月不一樣，我想先弄清楚。如果你處在一個說真話會受罰的環境，不必勉強自己單獨承擔，可以先找一位信得過的同伴，一起禱告、一起商量，必要時尋求適當的協助。說真話的勇氣，不是一個人撐出來的。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把五章二十一至二十四節，講成神反對敬拜、聚會與詩歌。神厭惡的，是離開了公平與公義的敬拜；本章兩面並陳：神喜悅敬拜，也要敬拜與生活不斷線。檢驗標準是：會眾是更願意帶著完整的人來敬拜，還是更輕看敬拜？"],["p","第二個偏差，是把二十四節，講成社會革命的口號，用公義取代福音與敬拜。神要的公義，出於認識神，是敬拜長出來的果子，不是任何政治運動的標語；本講義也不用這一章，去支持或反對任何現代國家、政黨、領袖。檢驗標準是：會眾是更認識神，還是更熱衷某一個主張？"],["p","第三個偏差，是把十八至二十節的「耶和華的日子」，講成末世時間表，或用來恐嚇會眾。這是對一群盼望神站在自己這邊的人說的話，是叫人今天悔改；本講義不推算日子，也不排時間。檢驗標準是：聽完以後，會眾是更愛主，還是更怕世界？"],["p","第四個偏差，是把四節「尋求我，就必存活」，講成做得夠、求得夠，才配得生命，或把五節「不要往伯特利尋求」，講成不可去教會、不可參加聚會。這是神向倒下的人發出的邀請，福音是祂先來尋找（路19:10）；問題在於人把地方放在神前面。檢驗標準是：疲乏的人是更願意走向神，還是更覺得自己不夠格？"],["p","第五個偏差，是把十三節「通達人靜默不言」，講成因為害怕不敢開口的人有罪；把十一至十二節，講成有房子、有產業本身就是罪；把二十六至二十七節，講成確定指向某一個神明或某一個國家。經文描寫的是一個說真話會受罰的處境，神指責的是欺壓與賄賂，神名的讀法有爭論；本講義不責備受威脅的人，不指責有產業的人，也不論斷任何民族。檢驗標準是：受傷的人是被陪伴，還是被定罪？"],["d",["這一章會不會被拿來指責別人敬拜不夠好？","有可能，所以要小心。這一章第一個對象，是那一群敬拜很熱鬧、城門口卻壓人的人；它不是給我們拿來衡量別人的歌聲、別人的奉獻、別人的事奉。讀這一章，最好的方式，是先問自己：我今天帶到神面前的，是一個完整的我嗎？至於別人，如果真的看見有人在受苦，可以用愛心去陪伴、去詢問，而不是點名指責。我們也不用這一章，去評論當代任何講員、教會或政府。神要的，不是我們比誰更公義，而是我們都回到祂面前，一起尋求祂。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：我們很習慣把「敬拜」和「生活」分開。星期天是星期天，星期一是星期一；在教會裡是一個樣子，在公司、在家裡是另一個樣子。這不一定是虛偽，常常只是「各管各的」，覺得不要把宗教帶進生意與人情裡。五章二十一至二十四節提醒我們：神是同一位，祂不要一個被切成兩半的人。這個星期，不妨問自己：有沒有一個地方，是我只在教會裡才信的？"],["p","第二個問題：我們很習慣「和為貴」與「多一事不如少一事」。在華人的人情關係裡，說真話，常常要付出代價：面子、關係、飯局、升遷。十三節的「通達人靜默不言」，我們讀來，特別有感覺。這裡沒有責備誰，反而提醒我們：說真話不容易，所以更需要同伴。這個星期，不妨找一位信任的人，說出你心裡一件不敢說的事，請他陪你想：怎樣說，才又誠實，又有愛。"],["d",["在華人文化裡，不想得罪人，就是「靜默不言」嗎？","不完全是。不想得罪人，有時是一種愛，怕傷害關係，怕一句話讓人難堪；有時卻是一種懼怕，怕自己失去什麼。分辨的方法，是問自己：我不說，是為了保護對方，還是為了保護自己？如果是前者，也許可以換一個更溫柔的方式說；如果是後者，可以先把這個懼怕，帶到神面前。說真話，不等於傷人；可以選在適當的時間、私下、帶著關心。如果你面對的，是一個會報復的人，請不要單獨承擔，先尋求同伴與適當的協助。真話與愛，並不衝突。"]],["h","七、活出321——尋求神自己"],["p","耶穌是我的榜樣。祂來，為要尋找、拯救失喪的人；祂蹲下來，把倒在地上的人扶起來。祂在城門口一般的地方，說真話，被人憎惡，仍然走到底。祂是我們尋求的對象，也是我們尋求的榜樣。"],["p","聖經是我的準則。我們讀五章，不是要用它去責備別人的敬拜，也不是要推算任何時間，而是看見：聖經的準則，既要我們敬拜，也要我們公平；兩件事，同時成立。"],["p","聖靈是我的引導。是聖靈，讓我們聽見神的聲音，也讓我們看見自己心裡，那個悄悄把「地方」放在神前面的角落。求祂引導我們，把敬拜與生活，連成一條河。"],["p","讓耶穌作王。無己，是放下只要我去對地方、過對節期，就安全了的心，也放下「別人的苦，與我無關」的冷。讓耶穌作王，就是讓祂決定我尋求什麼、盼望什麼，也讓我的敬拜與我的城門口，同歸一位王。"],["p","讓耶穌得著一切的榮耀。神唱哀歌，向倒下的人說「你們要尋求我」，這是神的作為，不是我們尋求得夠。一切榮耀，歸給耶穌。"],["p","建立屬神的體系。一個屬神的群體，是一群尋求神自己的人，也是一群在自己的城門口，肯說真話、肯扶起倒下的人；大家的焦點，都在耶穌。"],["d",["讓耶穌作王，怎樣影響我在公司、在家裡的決定？","可以從一個很具體的問題開始：在這件事上，耶穌會怎麼做？在公司，也許是一筆帳目、一次升遷、一句說不出口的話；在家裡，也許是一次爭執、一個要放下的面子。讓耶穌作王，不是一個口號，是在小事上，一次又一次，把決定權交給祂。你可以每天早上，用一句話禱告：主，今天，請祢作王。晚上，回顧一次：今天哪一件事，我讓祂作王了？哪一件事，我還想自己決定？不用自責，只要誠實地看見，再一次交給祂。這樣的練習，會慢慢改變你的決定，也會慢慢改變你。"]],["h","八、四種心，一條河"],["p","驕傲型的人說：我沒有什麼需要尋求，我的敬拜與服事，一直做得很好。經文對他說：神說，我厭惡你們的節期。承認自己的敬拜可能離開了生活，不是軟弱，是讓神進來的開始。"],["p","恐懼型的人說：我怕說真話，會失去飯碗、失去關係。神說：你們要尋求我，就必存活。生命不是靠你保護自己得來的，你可以先把你的怕，說給祂聽。"],["p","羞恥型的人說：我覺得自己很糟，連敬拜都不夠格。這一章沒有叫你更加羞愧；神的邀請，是向倒下的人發出的：你們要尋求我。你不用先變好，才來找祂。"],["p","受傷型的人說：我曾在教會，或在別人手裡，被傷害，被冷落，沒有人扶我。神看見你。「無人攙扶」，是這一章的第一個畫面，也是神心痛的地方。你不需要現在就原諒誰，可以先對神說：主，求祢醫治我，也求祢差一個人，來扶我。"],["h","九、這一週，你可以做的幾件事"],["p","第一，這個星期，找一個時間，花十分鐘，不求任何事，只尋求神自己：翻開聖經，讀阿摩司書五章四至六節，然後對神說：我要尋求祢。"],["p","第二，寫下一個你的「聖地」：一個你很習慣、卻不一定真的遇見神的地方或習慣，並問自己：我在那裡，真正尋求的是什麼？"],["p","第三，找出一位最近倒下、沒有人扶的人：生病、失業、喪親、被冷落的人。這個星期，用一通電話或一頓飯，陪他一次，不急著給道理。"],["p","第四，找出你自己的「城門口」：辦公桌、飯桌、一個群組。在那裡做一件公平的小事：說一句真話、不占人便宜、還一筆該還的帳。"],["p","第五，下次崇拜之前，問自己一句：我今天是從哪裡來到這裡的？有沒有一個人，是我需要先去和好的？"],["p","我宣告：我要尋求神自己，神是我的生命。"],["p","我宣告：我的敬拜與我的生活，是同一條河。"],["p","我宣告：我願意在自己的城門口，說真話，也伸出手，扶起倒下的人。"],["p","我宣告：耶穌是我的王，祂來尋找我，也必帶領我，一直尋求祂。"],["d",["這一週我只有一個小時，可以先做哪一件事？","最簡單的，是今晚睡前，拿一張紙，在左邊寫下一個你最近倒下的、或看見別人倒下的場景，在右邊寫下：「主，我要尋求祢。」然後，安靜五分鐘，不求答案，只是把它放在神面前。接著，選一個你可以在三天內做的小動作：打一通電話、傳一則關心的訊息、還一筆該還的帳、說一句該說的真話。把這個動作，寫在紙上。一個星期以後，回頭看這張紙：哪些做到了，哪些還沒有。沒有做到的，不用責備自己，再一次對神說：主，我要尋求祢。神看重的，是你轉過身來尋求祂，不是你做了多少。"]],["h","十、結語"],["p","阿摩司書五章，是一首哀歌、一個邀請、一句警告，和一個心願。開頭，是一個倒在地上、無人攙扶的民族；中間，是神說：你們要尋求我，就必存活；最後，是神說：惟願公平如大水滾滾，使公義如江河滔滔。"],["p","在這一章，神要我們看見祂的心：祂是一位為倒下的人唱哀歌的神；祂是一位厭惡沒有生命的敬拜、卻喜悅真心尋求祂的神；祂也是一位，願意公平像大水一樣，流遍全地的神。我們不用這一章論斷任何人，只用它回到祂面前。"],["p","所以，請你記得今天這一課的三個重點：要尋求神自己；耶和華的日子，不是用來推算，是用來今天悔改；敬拜與公平，是同一條河。這一課的焦點，不在你求得多好，不在別人做得對不對，也不在環境如何，而是那位來尋找、拯救失喪的人的耶穌。"],["p","親愛的天父，謝謝祢向我們唱哀歌，也謝謝祢說：你們要尋求我。求祢使我們尋求祢自己，也使我們的敬拜與生活，成為同一條河。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["m","帶領說明：今天這一課，我們用三個化來走一遍：先把話放進自己心裡（內化），再一起想通、說出口、走一步（消化），最後把這一課帶到人面前（轉化）。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化　內化（約20分鐘）"],["m","目的：讓每個人先把經文放進自己的心裡，看見自己的位置，不急著討論別人。"],["n","1. ★ 五章二節：躺在地上，無人攙扶。你有沒有看見或經歷過一個「無人攙扶」的場面？請說出大概是哪一類場合，不必細節。"],["n","2. ★ 五章四節：你們要尋求我，就必存活。你最近每天最先尋求的是什麼？請說出一個。"],["n","3. ★★ 五章五節：不要往伯特利尋求。你有沒有一個「聖地」（一個習慣、一個地方、一個活動），是你很熟悉、卻不一定遇見神的？請說出一個。"],["n","4. ★★★ 請在安靜中想一件事：一件你最近很需要被「攙扶」、卻沒有對任何人說的事。現在用一句話寫下它，並寫下你願意讓誰陪你，一起面對。"],["m","帶領提醒：請先安靜念五章四節，再開始。不要點名逼人說。這一章會碰到「被冷落」「無人攙扶」「教會裡的傷害」：如果有人提到長期的孤單、憂鬱、輕生的念頭、家庭暴力、成癮或在教會受過傷，不追問細節，不要求原諒，不對正在流淚的人說「你要有信心」，也不說「你要多尋求神」，會後單獨關心，必要時協助他尋求專業的幫助。"],["s","第二化　消化（約35分鐘·主軸）"],["m","目的：看見自己、聽神說話、想通關卡、說出口、走一步，讓這一課成為自己的話。"],["t","【看】看見自己"],["n","5. ★ 看見自己：對照五章二十一至二十四節，你最近的敬拜與你的生活，哪一個地方斷了線？請說出一個，例如工作、家庭、金錢、說話。"],["t","【聽】聽神說話"],["n","6. ★★ 聽神說話：安靜三分鐘，聽五章四節神向你說：你要尋求我。你心裡聽見的是什麼？請說出你聽到的第一個感覺。"],["t","【想】想通關卡"],["n","7. ★★★ 想通關卡：五章二十一至二十四節，神厭惡節期，又願公平如大水。請用自己的話向組員說明：為什麼這不是「神不要敬拜」，也不是「公義取代敬拜」？"],["t","【講】說出口"],["n","8. ★★ 說出口：用一句話向一位組員說，你這個星期要在哪一個「城門口」做哪一件公平的小事，並當場說出來。"],["t","【行】走一步"],["n","9. ★★★ 走一步：請決定這個星期的哪一天，打一通電話給一位倒下的人，寫下時間，並說出誰會提醒你。"],["m","帶領提醒：依【看】【聽】【想】【講】【行】的順序走，每一步留足時間。【講】的時候，只要說出一句、一個名字、一個時間，不必講故事。若有人眼淚掉下來，不追問細節，也不要求他原諒誰，先安靜陪著，會後單獨關心。"],["s","第三化　轉化（約25分鐘）"],["m","目的：把這一課帶出去：進入家庭、職場、教會的真實關係，並讓福音繼續繁殖。"],["n","10. ★ 你身邊有沒有一位最近倒下、沒有人扶的人？請說出名字，並決定這個月怎樣陪他一次。"],["n","11. ★★ 你的小組或教會，有沒有一位「很久沒有被問候」的人？請說出具體的一位，並說你可以先從哪裡開始關心他。"],["n","12. ★★ 你有沒有一位曾經在你倒下時扶過你的人？請說出名字，並決定這個月向他說聲謝謝。"],["n","13. ★★★ 920 操練：找出你的那一個「2」，就是你最想陪他一起「尋求神自己」的那位，這個星期向他分享，並且當場說出他的名字。"],["n","14. ★★★ 【必做】請在這個星期，把這一課用三句話講給一位教會外的朋友聽，並在下次小組回報：你對誰講的、在哪裡講、他的反應是什麼。"],["m","帶領提醒：請特別提醒：不要在小組裡用這一章去指責任何人敬拜不夠好，也不要點名評論任何講員、教會、企業或政府，不要用經文推算任何時間或套用到今日任何國家或領袖。若有人分享被傷害、被忽視、憂鬱、輕生的念頭、成癮或家庭暴力的經歷，不追問細節、不要求原諒，會後單獨關心，必要時協助尋求輔導或其他專業的協助。"],["s","收尾（5分鐘）"],["p","請大家輕輕閉上眼睛，把今天寫下的那一句「需要被攙扶」，放在神面前。一起念五章四節。"],["p","由帶領者為每一位禱告：求神使我們尋求祂自己，也使我們的敬拜與生活，成為同一條河。散會前，彼此問一句：你這星期要先尋求神的那一件事是什麼？"]]},"6":{"no":6,"vol":"《321阿摩司書講義》第6課·阿摩司書第6章","title":"在錫安安逸的有禍了——安、逸、首","chars":5170,"min":60,"deep":8,"dchars":1529,"tchars":1302,"blocks":[["h","一、安逸無慮的，有禍了（6:1--3）"],["p","弟兄姊妹平安。有一位姊妹，剛在家裡換了一張新沙發，很軟，一坐下去，整個人就陷進去。那個星期五晚上，她泡了一杯熱茶，打開喜歡的影集，心裡覺得：這一週，終於可以放鬆了。就在這時候，手機亮了一下，是一位多年的朋友傳來的訊息：我最近撐不住了，你有空嗎？她看了一眼，想：先看完這一集，明天再回吧。第二天醒來，她把這件事，完全忘了。她不是壞人，只是，那一晚太舒服了。今天這一章，講的，就是這種舒服。"],["p","阿摩司書六章，只有十四節，卻分成四個小段。一到三節，是安逸無慮的人；四到七節，是躺臥在象牙床上、不為約瑟的苦難擔憂的人；八到十一節，是神指著自己起誓，說祂憎惡雅各的榮華；十二到十四節，是公平被變成苦膽。這一課，就跟著這四個畫面走。"],["p","一節，先知一開口，就是一聲哀號：安逸無慮的，有禍了！這個「有禍了」，原文是 הוֹי（hoy），原來是葬禮上的聲音，就是「哎呀，可憐哪」。請你留意，先知還沒有說他們做了什麼，就先替他們哭了。神對安逸的人，第一個反應，不是發怒，是哀哭。"],["p","先知指著兩座山說話：錫安和撒馬利亞山。一座在南國，一座在北國，兩座都是靠山。他們是「被人歸向」的人，就是百姓有事，就來找他們。一個被人倚靠久了的人，很容易把「被人倚靠」，當成「自己有靠山」。他們的安逸，不是因為什麼壞事，而是因為，什麼事都不會碰到他們。"],["p","請你注意，經文沒有說，安穩是罪。整卷阿摩司書，沒有一句話，叫人不要平安。問題是：這份安穩，倚靠的是什麼？倚靠的是山，是位置，是名聲，不是耶和華。這個分別，很要緊。"],["p","二節，先知叫他們走一趟：從甲尼，到大城哈馬，再下到非利士人的迦特，去看看，那些國，比你們的國還強嗎？境界，比你們的境界還寬嗎？這一節，解經家有不同的讀法：有人讀成警告，那些城都衰落了；有人讀成譏諷，你們並不比別人更有保障；也有人認為，這一節是後來編輯放進去的。本講義不替它補上日期，只取其中最清楚的意思：被揀選，是恩典，不是免死金牌。"],["p","三節，是兩個動作：你們以為降禍的日子還遠，坐在位上盡行強暴。前半句，原文的動詞，是「把它推開」，雙手把災禍推得遠遠的；後半句，是同一雙手，把強暴的座位拉過來，坐上去。和合本註腳另譯：行強暴使審判臨近。他們一面推開，一面拉近。"],["p","請你想想這個畫面。坐在位上的人，往往不是拿刀的人，而是有權說一句話的人。他們用位子的力量，叫別人不敢說不。我們不替這一節，添上任何具體的案例，也不套用到任何今天的人或機構。這一節，是給每一個有座位的人的一面鏡子：我的位子，我怎樣用它？"],["p","還要說一句，給受過欺壓的人。神說「有禍了」的，不是你，是坐在位上的人。你的痛，神看見，祂先替你哀哭。這一點，我們帶領人的時候，一定要先講。"],["d",["神為什麼先哀哭，不是先審判？","因為這是神的性情。「有禍了」這三個字，在先知書裡，原是葬禮的哀號，神是先為還沒有死去的人，開始哭。這告訴我們，祂不願有人滅亡，祂的審判，是帶著眼淚的。對我們也是一樣：當我們看見別人走偏的時候，第一個反應，應當不是在心裡定罪，而是先為他哀哭，為他禱告。若我們先審判、後哀哭，往往就把人推遠了；若我們先哀哭，神也許會用我們，成為那個把人拉回來的人。這不表示不說真話，而是用神說真話的順序：先哀哭，再說話。"]],["h","二、躺臥在象牙床上（6:4--7）"],["p","四、五節，是一幅很生動的畫：你們躺臥在象牙床上，舒身在榻上，吃群中的羊羔，棚裡的牛犢；彈琴鼓瑟唱消閑的歌曲，為自己製造樂器，如同大衛所造的。撒馬利亞出土過精緻的象牙飾片，說明那是一個真實的、講究的年代。羊羔與牛犢，是最嫩的肉；琴與瑟，是最好的樂器；他們整個人，攤開在榻上。"],["p","請你留意，這一段，沒有一樣東西，被定為罪。阿摩司沒有說，吃羊羔是罪，也沒有說，彈琴是罪。他挑出來的，是三個詞：舒身、消閑、為自己。舒身，是整個人鬆到不再警醒；消閑，是歌只是用來打發時間；為自己，是連樂器也要自己造，造得像大衛一樣好。大衛用琴，是向神唱，也是安慰別人的心；他們用琴，唱給自己聽。"],["p","六節，才是這一段的重心：以大碗喝酒，用上等的油抹身，卻不為約瑟的苦難擔憂。前面全是自己，酒、油、床、歌；「卻」字以後，才出現別人：約瑟。約瑟，就是北國的百姓。他們的「苦難」，原文是「破碎」，像一根骨頭斷了。那邊斷了，痛得要命；這邊，一點感覺也沒有。"],["p","聖經在別的地方，也有一樣的提醒：與哀哭的人要同哭；若一個肢體受苦，所有的肢體，就一同受苦。這使我們想起，一個身體裡，最危險的，不是痛，而是不覺得痛。神哀哭的，是那一顆不再被別人的痛碰到的心。"],["p","七節，有一個很安靜的對稱：所以這些人，必在被擄的人中首先被擄。一節，他們是列國之首；六節，他們用的是上等的油，原文也是「首」這個字；七節，他們首先被擄，還是「首」。他們一生追求第一，最好的酒、最好的油、最前面的位子，結果，連被擄，也排第一。這不是神在開玩笑，而是一首很安靜的哀歌：他們所抓住的第一，沒有一樣，能保住他們。"],["d",["我平常過得不錯，是不是就是這一章裡的「安逸的人」？","不一定。經文責備的，不是過得好，而是三件事連在一起：把靠山放在自己的位子與名聲上；享受只為自己；對別人的破碎，一點感覺也沒有。你可以用三個問題，安靜檢查自己：第一，我最近的平安，是倚靠耶和華，還是倚靠我所擁有的？第二，我的享受，有沒有留一個出口，給別人？第三，上一次為別人的痛難過，是什麼時候？如果答案讓你不太舒服，不是要你自責，而是先對神說：求祢醫治我的心，讓我再有感覺。感恩地享受神所賜的，與一顆醒著的心，並不衝突。"]],["h","三、原文亮光：安、逸、首（6:1，6，12）"],["p","這一章有三個原文字，剛好是副題。第一個是「安」，希伯來文 שַׁאֲנַנִּים（sha'ananim），一節的「安逸無慮的」。這個字的字根，有「平靜、自在」的意思，原本不是壞字：以賽亞書也說，主耶和華的安息，是平靜安穩。可是，在六章一節，它被放在「倚靠撒馬利亞山」旁邊。同一個平靜，倚靠的對象不同，結果就不同。三十秒轉成生命：你現在的平靜，靠的是什麼？"],["p","第二個是「逸」，希伯來文 נֶחְלוּ（nehlu），六節的「擔憂」。這個動詞的字根，本來是「生病」。「不為約瑟的苦難擔憂」，直譯接近：不為約瑟的破碎而生病。意思是，那些人看見別人破碎，自己卻一點也沒有被「傳染」到痛，連一點心裡難受的感覺都沒有。我們常把「麻木」，當成「堅強」；可是，在這一節，神把麻木，看成一種病。三十秒轉成生命：你今天，被誰的痛，碰到了？"],["p","第三個是「首」，希伯來文 רֵאשִׁית（reshit），這個字在這一章，出現了三次：一節的「列國之首」、六節的「上等的油」、七節的「首先被擄」。這是先知有意的遊戲。他們追求「最好的、最前面的」，結果，也成為被帶走的人中，排在最前面的。三十秒轉成生命：我追求的第一，能不能保住我？"],["p","把三個字連起來，就是這一章的路：安（sha'ananim），倚靠自己的山，心就平靜得不對；逸（nehlu），平靜久了，別人的痛，就碰不到我；首（reshit），一生追求第一，最後，連被帶走，也是第一。這一章的副題，不是要嚇我們，而是一面很安靜的鏡子。"],["d",["原文的「首」重複三次，對我們今天的生活有什麼提醒？","它提醒我們，人最容易把「最好的」，當成「最安全的」。我們很自然地，追求最好的學校、最好的工作、最好的位子，這本身不是錯；問題是，當「最好」變成我們的靠山，我們就忘了，真正能保守我們的，不是第一名，而是那位叫我們認識祂的神。你可以做一件很小的事：這個星期，在你最在意的一個「第一」旁邊，寫下一句話：這不是我的靠山，耶和華才是。每次看見，就重新校準一次。這樣做，不是要你放棄追求，而是讓你記得，你追求的，不是你的靠山。"]],["h","四、公平變為苦膽（6:8--14）"],["p","八節，是這一章的轉彎：主耶和華－萬軍之神指著自己起誓說：我憎惡雅各的榮華，厭棄他的宮殿；因此，我必將城和其中所有的都交付敵人。先看「起誓」。人起誓，要指著比自己更大的；神沒有更大的，所以祂指著自己。這等於說：這句話，我自己擔保。全卷書反覆出現的「耶和華說」，在這一節，以最重的方式出現：神連起誓，都親自出面。"],["p","再看「憎惡」。我們很少讀到，神說憎惡。可是，請你看，被憎惡的，是雅各的榮華、是宮殿，不是人。神憎惡的，是人把神所賜的尊榮，變成自己的驕傲；把宮殿，變成靠山。神可以愛一個人，卻憎惡他所倚靠的東西。祂不是要毀掉人，祂是要拆掉，那一座擋在人與祂之間的牆。"],["p","九到十一節，是整章最暗的一段，我們要小心讀。一座大房子，只剩十個人，也都必死；後來，有親人進去搬運屍首，輕輕問：你那裡還有人沒有？回答是：沒有。然後又說：不要作聲，因為我們不可提耶和華的名。為什麼不提？經文沒有說：也許是害怕，也許是痛到說不出口，也許是信心已經斷了。解經家有幾種讀法，我們陳列，不替說話的人定論。我們只看見：這是一群，連呼求神名字的力氣，都沒有的人。"],["p","這一段，不是用來嚇人的，也不是用來解釋今日任何災難的。對正在喪慟中的人，我們該做的，是安靜陪著，一同守住神的名。十一節，神出令，大房被攻破，小屋被打裂：大房小屋，都在祂的命令下。這是一個嚴肅、也公平的提醒。"],["p","十二節，先問兩個問題：馬豈能在崖石上奔跑？人豈能在那裡用牛耕種呢？答案都是：不能。然後，一個「卻」字：你們卻使公平變為苦膽，使公義的果子變為茵蔯。公平，公義，是整卷書最重要的一對字。五章，神說：惟願公平如大水滾滾，使公義如江河滔滔。那是神的盼望；六章，是人的回答：把它翻過來。我們很少是有心的，更多的時候，是什麼都不做，公平，就自己變苦了。"],["p","十三節，先知聽見他們的自誇：我們不是憑自己的力量取了角嗎？原文，「虛浮的事」與「角」，可能是兩個地名的雙關：羅底巴（意思像是「無」）與加寧（意思是「角」）。學者看法不一，我們列為可能的背景。不論是不是雙關，意思很清楚：最大的自誇，往往來自最小的成績。十四節，神又說：耶和華、萬軍之神說：我必興起一國攻擊你們，從哈馬口，直到亞拉巴的河。這條界線，正是他們最得意的疆界。他們所靠的，成了他們所受的。"],["p","全章，從哀號開始，也在宣告中結束。先知不是在咒詛，他是在大聲提醒：還能回頭的時候，趁早回頭。我們也要記得，神要的公義，不是一場運動，也不是一套制度；它是從認識神長出來的果子。沒有認識神，再多的行動，也會變成另一種自誇。"],["d",["「公平變為苦膽」，是不是在說教會該多參與社會議題？","這一節首先是一面鏡子，不是一份行動清單。阿摩司說的對象，是那些坐在位上、卻讓公平變苦的人，所以第一個問題是：我自己，在我所在的位子上，有沒有讓公平變苦？至於教會如何參與社會，這是另一個需要智慧與禱告的題目，各教會可以有不同的恩賜與步伐。有兩件事，是本章清楚的：第一，神要的公義，出於認識神，不取代敬拜；第二，對受欺壓的人，陪伴與保護，優先於急著論斷誰是欺壓人的人。我們不用這一章，去支持或反對任何政黨或政權。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把阿摩司書六章講成「享受就是罪、貧窮才屬靈」，或講成對有錢人、企業或執政者的批判大會。經文沒有說床、肉、酒、琴有罪，神哀哭的是麻木的心與倚靠自己的山；公義出於認識神，不取代敬拜。檢驗標準是：會眾是更能感恩地享受並醒著，還是更論斷別人的生活？"],["p","第二個偏差，是用六章一節「有禍了」去咒詛或嚇唬人，或把八節的審判，套用到今日某個國家、城市或政權。「有禍了」原是哀號；經文的對象是當時的雅各家，我們不點名任何當代的國家、政黨或領袖。檢驗標準是：會眾讀完，是更看見神的心腸，還是更怕神、更怕世界？"],["p","第三個偏差，是把六章二節的甲尼、哈馬、迦特，或十四節的「一國」，講成確定的歷史時間表或預言。這一節可讀為警告或譏諷，解經家看法不一；我們不推算日子，只讀出被揀選不是免死金牌。檢驗標準是：會眾是更謙卑，還是更熱衷推算？"],["p","第四個偏差，是用九到十節的屍首與沉默，去解釋今日某場災難，或對喪慟的人說「這是審判」；也把十節的「不可提耶和華的名」，講成確定是某一種心態。經文沒有解釋原因，這是對當時的警告，不是對今日受害者的解釋；對受傷的人，陪伴與保護優先。檢驗標準是：喪慟的人，是被陪伴，還是被論斷？"],["p","第五個偏差，是把十二節的公平與公義，講成只要努力做社會公義就是敬拜神這樣的說法，或把十三節「取了角」的地名雙關，講成唯一的讀法。五章21到24節兩面並陳：神厭惡沒有生命與公義的敬拜，也沒有叫人不敬拜；地名雙關只是可能的背景，學者看法不一。檢驗標準是：會眾是更愛神、更愛人，還是只剩下行動，或只剩下儀式？"],["d",["我該怎麼分辨自己是「安逸無慮」，還是「單純享受神所賜的」？","可以用三個問題。第一，這份平安，在我失去它的時候，我還能向神禱告嗎？如果一失去，我就崩潰，也許我倚靠的不是神。第二，我的享受，是否讓我更感恩、更願意分享？還是讓我更不想被打擾？第三，當別人的需要出現的時候，我的第一個反應，是什麼？是願意放下手上的事，還是先想：這和我無關？享受神所賜的，是美好的，提摩太前書六章說，神厚賜百物給我們享受；只是，不要倚靠無定的錢財。判斷的重點，不在擁有多少，而在心還醒不醒著。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：我們很習慣「報喜不報憂」。在華人的家庭與教會文化裡，親友相聚的時候，大家談的是好消息、好成績、好新房子；痛的事，往往藏起來，因為怕丟臉，也怕麻煩別人。結果，是讓一個人更不容易被看見，也讓旁邊的人，更容易不去想。六章六節的「不為約瑟的苦難擔憂」，不一定是人狠心，而是沒有人說。這個星期，不妨問自己：我身邊，有沒有一個人，正在痛，卻沒有說？我可以先怎麼問一句？"],["p","第二個問題：我們很習慣「用位子決定價值」。在華人社會，職稱、資歷、輩分、年紀，常常決定誰說話、誰聽話。這有它的秩序之美，可是，也有一個風險：坐在位子上的人，很容易以為，自己不需要被提醒。六章三節說，坐在位上盡行強暴，就是這種風險。這個星期，不妨在一位信得過的同伴面前，誠實說一件事：我坐的這個位子，我有沒有用它保護人？有沒有哪一個人，不敢對我說「不」？"],["d",["我是教會裡的長輩或領袖，怎樣避免自己變成「被倚靠卻不自覺」的人？","首先，要主動找一兩位敢對你說真話的人，並且告訴他們：如果我有地方走偏了，請你直接告訴我。第二，定期問自己：最近有沒有人，因為怕我而不敢開口？第三，把決定放在多人面前，不要只靠一個人。第四，讓自己有機會，到最小的、最不被注意的地方，與人同坐。位子本身不是壞的，神使用領袖；只是，被倚靠的人，更需要一顆醒著的心。你不需要先證明自己很好，只要願意被提醒。"]],["h","七、活出321——讓心醒著"],["p","耶穌是我的榜樣。祂不是躺在象牙床上的主。祂說，人子連枕頭的地方都沒有；祂快到耶路撒冷，看見城，就為它哀哭；拉撒路死了，祂也哭了；祂看見許多人，困苦流離，就憐憫他們。這位王，心是醒著的。約瑟的苦難，祂擔憂，而且祂不只擔憂，祂來了，為我們的破碎，付上自己。"],["p","聖經是我的準則。我們讀六章，不是要用它去指責別人的床、別人的餐桌，也不是要推算任何日子，而是看見：聖經的準則，既允許我們享受神所賜的，也提醒我們，不要倚靠自己的山，不要讓心麻木；兩件事，同時成立。"],["p","聖靈是我的引導。是聖靈，使我們的心，從麻木中醒過來；也是聖靈，叫我們為別人的痛，有一點感覺。求祂幫助我們，誠實看見自己倚靠的是什麼，也看見身邊，那個正在痛的人。"],["p","讓耶穌作王。無己，是放下我有位子、有山所以不會有事的安全感，也放下「別人的痛與我無關」的距離。讓耶穌作王，就是讓祂決定我的靠山在哪裡，也決定我怎樣使用我手上的位子與享受。"],["p","讓耶穌得著一切的榮耀。能夠為別人的痛流淚，能夠不再倚靠自己的山，不是我們的功勞，是祂在我們心裡做的工。一切的榮耀，歸給耶穌。"],["p","建立屬神的體系。一個屬神的群體，是一群享受恩典、也為彼此的破碎同哭的人；公平與公義，從認識神長出甜果；沒有人坐在位子上，卻不被提醒；沒有人在痛，卻沒有被看見。"],["d",["「為別人的痛有感覺」，具體可以怎麼練習？","可以從一個很小的習慣開始：每天睡前，用一分鐘，想想今天遇到的人，有沒有誰，其實有一點不對勁？也許是某位同事的臉色，也許是某位長輩的一句話。不用分析，只是為他，禱告一句。第二，每個星期，主動關心一個人：一則訊息、一通電話，只問：你最近還好嗎？然後安靜聽，不急著給建議。第三，每個月，有一次，把一部分的享受，與需要的人分享。這些，不是要你變成一個一直自責的人，只是讓心，保持有感覺。"]],["h","八、四種心，一個邀請"],["p","驕傲型的人說：我過得好，是我努力得來的，不需要誰來提醒。經文對他說：你喜愛的，是「沒有什麼的東西」；你憑自己取得的角，也不是你的靠山。承認自己，是被神託付的人，不是軟弱，而是讓神進來的開始。"],["p","恐懼型的人說：我怕失去現在的一切，所以我不敢想別人的事。經文對他說：你緊緊抓住的山，並不能保守你。你可以先把這個怕，說給神聽：主，我很怕，求祢作我的靠山。"],["p","羞恥型的人說：我很久沒有關心別人了，我一定是個很自私的人。經文沒有叫你羞愧，神先為安逸的人哀哭。你可以帶著這個羞愧，對神說：求祢憐憫我，醫治我的心，讓我再有感覺。"],["p","受傷型的人說：我正在痛，卻沒有人看見，甚至還有人在欺壓我。神看見你。這一章，神說「有禍了」的，不是你，是那個行強暴的人。你不需要現在就原諒誰，也不需要先變得堅強；你可以先對神說：求祢看見我的痛，並在適當的時候，讓我再有力量。"],["h","九、這一週，你可以做的幾件事"],["p","第一，每天睡前，花一分鐘，誠實地對神說：主，我最近，有哪裡睡著了？不用整理，直接說。連續七天。"],["p","第二，寫下三樣你最倚靠的「山」，例如位子、名聲、存款、人脈，在每一樣旁邊寫：這不是我的靠山，耶和華才是。"],["p","第三，找一位你知道正在痛的人，這個星期，打一通電話，或傳一句話：我想到你，你還好嗎？不給建議，只是聽。"],["p","第四，把這個星期的一次享受，例如一餐、一場娛樂，留下一部分，送給一位需要的人，並對他說：這是神給我們的。"],["p","第五，把六章十二節抄在紙上：「你們卻使公平變為苦膽，使公義的果子變為茵蔯。」每次看見，就對神說一次：求祢使我成為一個，讓公平結出甜果的人。"],["p","我宣告：我享受神所賜的，也不倚靠自己的山，耶和華才是我的靠山。"],["p","我宣告：我的心，不再麻木，我願意為別人的痛，有感覺。"],["p","我宣告：我所坐的位子，我要用來保護人，不用來行強暴。"],["p","我宣告：耶穌是我的王，祂的心是醒著的，祂使我的心，也醒過來。"],["d",["這一週我可以立刻做的一件事是什麼，才不會只停在聽道？","最簡單的，是今天晚上，拿出手機，翻到通訊錄，找一個你已經超過一個月沒有聯絡、而你知道他最近不太容易的人，傳一句話：我今天想到你，你還好嗎？然後，把手機放下，不要等回覆。如果他回了，聽他說，不急著講道理；如果他沒有回，也沒有關係，你已經讓一顆心，醒了一下。接著，把這個人的名字，寫在今天讀經的筆記旁邊，這個星期，每天為他禱告一句。若你發現自己，連這一件小事也很難，不要責備自己，先對神說：求祢幫助我，再有感覺。"]],["h","十、結語"],["p","阿摩司書六章，是一個很舒服的畫面，和神的一聲哀號。開頭，是安逸無慮的人，被人歸向，卻倚靠自己的山；中間，是象牙床、羊羔、琴與瑟，卻不為約瑟的苦難擔憂；然後，是神指著自己起誓，憎惡雅各的榮華；最後，是公平變成苦膽，自誇變成欺壓。"],["p","在這一章，神要我們看見祂的心：祂是一位，在我們安逸的時候，先為我們哀哭的神；祂是一位，憎惡驕傲、卻深愛人的神；祂也是一位，要使公平如大水滾滾，使公義如江河滔滔的神。祂的審判，帶著眼淚；祂的警告，是為了讓還聽得見的人，趁早醒來。"],["p","所以，請你記得今天這一課的三個重點：安逸不是罪，倚靠自己的山才是；享受不是罪，麻木才是；公義的果子，從認識神長
