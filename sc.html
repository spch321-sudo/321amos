ֲלֵיהֶם נְאֻם יְהוָה עֹשֶׂה זֹּֽאת׃<\/p><\/blockquote>","lit":"<blockquote><p>「到那日，我必建立大衛倒塌的帳幕，堵住其中的破口，把那破壞的建立起來，重新修造，像古時一樣，使以色列人得以東所餘剩的和所有稱為我名下的國。此乃行這事的耶和華說的。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>那日<\/td><td>בַּיּוֹם<\/td><td>bayyom<\/td><td>H3117<\/td><td>在日子裡<\/td><\/tr><tr><td>建立<\/td><td>אָקִים<\/td><td>aqim<\/td><td>H6965<\/td><td>使站起來、建立<\/td><\/tr><tr><td>帳幕<\/td><td>סֻכַּת<\/td><td>sukkat<\/td><td>H5521<\/td><td>帳棚、草棚（sukkah）<\/td><\/tr><tr><td>倒塌的<\/td><td>הַנֹּפֶלֶת<\/td><td>hannofelet<\/td><td>H5307<\/td><td>倒下的、正在倒下的<\/td><\/tr><tr><td>破口<\/td><td>פִּרְצֵיהֶן<\/td><td>pirtsehen<\/td><td>H6556<\/td><td>裂縫、破口<\/td><\/tr><tr><td>修造<\/td><td>וּבְנִיתִיהָ<\/td><td>uvnitiha<\/td><td>H1129<\/td><td>建造<\/td><\/tr><tr><td>得<\/td><td>יִֽירְשׁוּ<\/td><td>yirshu<\/td><td>H3423<\/td><td>承受、得為業<\/td><\/tr><tr><td>名下<\/td><td>שְׁמִי<\/td><td>shemi<\/td><td>H8034<\/td><td>我的名<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>帳幕<\/strong>：原文 sukkah，不是會幕的「帳幕」（ohel／mishkan），而是臨時搭的「草棚」「棚子」，就像住棚節搭的那種。「大衛的棚子」，這個說法很小、很舊，說的是一個已經不像樣子的王家。<\/p><p><strong>倒塌的<\/strong>：原文是分詞（hannofelet），既可以是「已經倒下的」，也可以是「正在倒下的」。一般解經家取「倒塌」；意思是：這個棚子的狀態，很危險，也很破落。<\/p><p><strong>以東所餘剩的<\/strong>：這是阿摩司書九章12節與新約徒15:17的一個著名差異。希伯來文本（MT）是「以東（edom）所餘剩的」；七十士譯本（LXX）讀作「人類（adam）所餘剩的」，因為在希伯來文中，「以東」與「人」的子音只差一個字母（אדום／אדם）；另外，「得」（yirshu）與「尋求」（yidreshu）的字形，也只差一個字母。雅各在耶路撒冷會議引用的是七十士譯本的形式：「叫餘剩的人，就是凡稱為我名下的外邦人，都尋求主。」<\/p><p><strong>稱為我名下<\/strong>：原文是「我的名被稱呼在他們身上」，是屬於神的記號，在聖經中用於神所擁有的百姓與地方。<\/p><p><strong>此乃行這事的耶和華說的<\/strong>：ne'um YHWH 'oseh zot；「行這事的」是分詞，是一直在做的耶和華。<\/p>","exp":"<p>十一、十二節，是整卷書的轉折點。從「到那日」開始，語氣整個換了：前面是「我必」打碎、殺戮、搜出；現在是「我必」建立、堵住、修造。同一個「我必」，同一位神，只是方向不同。<\/p><p><strong>到那日，我必建立大衛倒塌的帳幕。<\/strong>先看這個字：不是「宮殿」，不是「聖殿」，是 sukkah，一個棚子。大衛家曾經有過榮耀（撒下七章），但在先知的時代，它已經像一個搖搖欲墜的草棚。神說：我要把它重新立起來，堵住破口，把破壞的建立起來，像古時一樣。<strong>神所要做的，不是建一座新的、全然不同的東西，而是把倒塌的，重新立起來。<\/strong><\/p><p>「像古時一樣」，很值得停下來。不是說回到一個黃金時代去，而是說，神要使這個家，再有它當初被立的那個樣子：一個有神同在的家。這個應許，與撒母耳記下七章16節，神對大衛說的話，互相呼應：「你的家和你的國必在我面前永遠堅立。」<\/p><p>十二節說這件事的目的：<strong>使以色列人得以東所餘剩的和所有稱為我名下的國。<\/strong>這裡的「得」，原文是「承受」。目的是外向的：不只是以色列自己復原，而是列國中屬神的人，被包括進來。使徒行傳十五章16至17節，雅各在耶路撒冷會議上，引用這段話，說明外邦人歸向神，是眾先知的話所相合的：「此後，我要回來，重新修造大衛倒塌的帳幕，把那破壞的重新修造建立起來，叫餘剩的人，就是凡稱為我名下的外邦人，都尋求主。」我們只照新約自己引用的方式說：<strong>新約作者把這個應許，與神使外邦人也歸向祂的作為連在一起。<\/strong>至於這段話與日期、與地理、與任何現代的事件有什麼關係，經文沒有說，我們不推算。<\/p><p>最後一句，也值得留意：<strong>此乃行這事的耶和華說的。<\/strong>神在建立之後，再簽一次名。前面的審判，是祂說的；後面的重建，也是祂說的。這是同一位神的聲音。<\/p>"},{"a":13,"z":15,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הִנֵּה יָמִים בָּאִים נְאֻם יְהוָה וְנִגַּשׁ חוֹרֵשׁ בַּקֹּצֵר וְדֹרֵךְ עֲנָבִים בְּמֹשֵׁךְ הַזָּרַע וְהִטִּיפוּ הֶֽהָרִים עָסִיס וְכָל הַגְּבָעוֹת תִּתְמוֹגַֽגְנָה וְשַׁבְתִּי אֶת שְׁבוּת עַמִּי יִשְׂרָאֵל וּבָנוּ עָרִים נְשַׁמּוֹת וְיָשָׁבוּ וְנָטְעוּ כְרָמִים וְשָׁתוּ אֶת יֵינָם וְעָשׂוּ גַנּוֹת וְאָכְלוּ אֶת פְּרִיהֶֽם וּנְטַעְתִּים עַל אַדְמָתָם וְלֹא יִנָּתְשׁוּ עוֹד מֵעַל אַדְמָתָם אֲשֶׁר נָתַתִּי לָהֶם אָמַר יְהוָה אֱלֹהֶֽיךָ׃<\/p><\/blockquote>","lit":"<blockquote><p>「耶和華說：日子將到，耕種的必接續收割的；踹葡萄的必接續撒種的；大山要滴下甜酒；小山都必流奶。我必使我民以色列被擄的歸回；他們必重修荒廢的城邑居住，栽種葡萄園，喝其中所出的酒，修造果木園，吃其中的果子。我要將他們栽於本地，他們不再從我所賜給他們的地上拔出來。這是耶和華－你的神說的。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>接續<\/td><td>וְנִגַּשׁ<\/td><td>venigash<\/td><td>H5066<\/td><td>靠近、追上<\/td><\/tr><tr><td>耕種的<\/td><td>חוֹרֵשׁ<\/td><td>khoresh<\/td><td>H2790<\/td><td>耕地的人<\/td><\/tr><tr><td>消化（流奶）<\/td><td>תִּתְמוֹגַֽגְנָה<\/td><td>titmogagnah<\/td><td>H4127<\/td><td>融化、流淌<\/td><\/tr><tr><td>歸回<\/td><td>וְשַׁבְתִּי<\/td><td>veshavti<\/td><td>H7725<\/td><td>轉回、使歸回<\/td><\/tr><tr><td>被擄的<\/td><td>שְׁבוּת<\/td><td>shevut<\/td><td>H7622<\/td><td>被擄、福分（多數解經家認為與「轉回」同字根）<\/td><\/tr><tr><td>栽種<\/td><td>וְנָטְעוּ<\/td><td>venata'u<\/td><td>H5193<\/td><td>栽種<\/td><\/tr><tr><td>栽於本地<\/td><td>וּנְטַעְתִּים<\/td><td>unta'tim<\/td><td>H5193<\/td><td>我要栽植他們<\/td><\/tr><tr><td>拔出<\/td><td>יִנָּתְשׁוּ<\/td><td>yinnatshu<\/td><td>H5428<\/td><td>被拔出<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>歸回<\/strong>：原文 shavti shevut，是一個「同源詞組」：動詞 shuv（H7725，轉回）加它的名詞 shevut（H7622）。<strong>這是全卷追蹤字「轉回」shuv 的最後一次<\/strong>：前面五次（四章6至11節）是「你們仍不歸向我」，神是主詞，人是不回來的。這裡，神是動詞的主詞：<strong>我必使……歸回<\/strong>。shevut 一般譯為「被擄的」，也有人譯為「福分」「命運」，意思是「使他們的命運轉回」；和合本取「被擄的歸回」。<\/p><p><strong>接續<\/strong>：十三節「耕種的必接續收割的」，原文是「追上」（nagash，靠近），意思是：收割還沒完，耕種已經追到，豐收多到，一季接一季。<\/p><p><strong>流奶<\/strong>：和合本註腳說「原文是消化」，同五節的「地就消化」是同一個字根。<\/p><p><strong>栽於本地，不再拔出來<\/strong>：「栽植」（nata）與「拔出」（natash）是耶利米書一章10節的一對動詞；在阿摩司書的結尾，神說「栽」，並說「不再拔出」。<\/p><p><strong>你的神<\/strong>：十五節最後一句，從「他們」變成「你」。神在對每一位讀者說話。<\/p>","exp":"<p>十三至十五節，是整卷書的結尾，也是整卷書最溫柔的一段。經文沒有抹去前面的審判，只是在審判之後，神說了一句話：<strong>日子將到。<\/strong>注意，這句話前面，也有「耶和華說」。<strong>盼望，也以耶和華說開頭。<\/strong><\/p><p>十三節畫的是一幅豐收的圖：耕種的人，追上了收割的人；踹葡萄的人，追上了撒種的人。意思是，收成多到，來不及收，下一季的工作已經開始了。這是一個「打破季節」的畫面，在阿摩司書的背景下，有很深的意味：前面的審判，是饑荒、是乾旱、是歉收（四章6至9節）；現在，大山滴下甜酒，小山都流奶。前面說「地就消化」，現在說「小山都必流奶」，原文是同一個動詞：<strong>神的手，可以使地融化，也可以使山融化出甜酒。<\/strong>這不是巧合，是整章的一個很美的對稱。<\/p><p>十四節說：<strong>我必使我民以色列被擄的歸回。<\/strong>這一句，是整卷書的追蹤字「轉回」（shuv）最後一次出現。前面，神一次又一次地說：你們仍不歸向我（四章6至11節）；現在，神說：<strong>我必使他們歸回。<\/strong>人不回來，神使他們回來。這是整卷書的一個很深的轉折：福音的核心，不是人能回，而是神使人回。接著，是很平凡的畫面：重修荒廢的城邑居住，栽種葡萄園，喝其中所出的酒，修造果木園，吃其中的果子。<strong>不是奇蹟的場面，是平凡的日子回來了：有家，有園子，有酒，有果子，可以坐下來吃。<\/strong><\/p><p>十五節，是整卷書的最後一句話：<strong>我要將他們栽於本地，他們不再從我所賜給他們的地上拔出來。<\/strong>「栽」與「拔」，是耶利米書一章10節的一對動詞；那裡，神說我要拔出，要栽植。阿摩司書最後的一句話，是「不再拔出」。這是神的保證。最後一句：<strong>這是耶和華－你的神說的。<\/strong>「你的神」，是神對讀者說：我是你的神。一卷審判的書，最後以盟約的語言結束。<\/p><p>請你留意，我們不從這些話，推算今日任何國家與土地，不把它變成時間表，也不用它說誰應該住在哪裡。經文給我們的，是一個比土地更大的真理：<strong>神是栽植的神，祂栽下的，祂保守；祂把人放在祂的恩典裡，不再拔出。<\/strong>新約把這個應許，帶到更闊的地方：沒有任何東西，能叫我們與神的愛隔絕（羅馬書八章38至39節）。<\/p>"}]},"serm":{"1":{"min":14,"blocks":[["h","《耶和華必從錫安吼叫》"],["p","弟兄姊妹平安。"],["p","今天我們讀阿摩司書第一章。"],["p","先問一個問題。"],["p","你參加過親戚的聚會嗎？"],["p","菜上齊了，大家坐下來。"],["p","聊著聊著，話題轉到一位不在場的人身上。"],["p","隔壁的那一家。"],["p","他們的兒子怎麼了。"],["p","他們的生意怎麼垮的。"],["p","你會發現，這個時候，桌上特別熱鬧。"],["p","每個人都有一句可以補上。"],["p","每個人都覺得，自己站在比較對的那一邊。"],["p","我們很會聽別人的審判。"],["p","而且聽得很痛快。"],["p","阿摩司就是這樣開場的。"],["p","他先說鄰居。"],["p","先說大馬士革，先說迦薩，先說泰爾。"],["p","聽的人，一定頻頻點頭。"],["p","對，就是他們。"],["p","他們早就該被審判了。"],["p","可是，這一章，不是讓我們點頭的。"],["p","這一章，要讓我們聽見一個聲音。"],["p","那個聲音，叫做吼。"],["p","我們分三個部分來讀。"],["p","第一，神的吼聲。"],["p","第二，三番四次。"],["p","第三，不記念弟兄的盟約。"],["h","一、神的吼聲"],["p","先看這個人。"],["q","當猶大王烏西雅，以色列王約阿施的兒子耶羅波安在位的時候，大地震前二年，提哥亞牧人中的阿摩司得默示論以色列。（摩1:1）"],["p","他叫阿摩司。"],["p","他是提哥亞人。"],["p","提哥亞，是猶大曠野邊上的小鎮。"],["p","不是耶路撒冷。"],["p","不是王宮。"],["p","他的職業，是牧人。"],["p","在希伯來文裡，這個字是飼養羊群的人。"],["p","他不是祭司，也不是王的謀士。"],["p","神把話，交給一個管羊的人。"],["p","而且，他的職業，沒有被藏起來。"],["p","寫在書的第一行。"],["p","再看他的時代。"],["p","兩位王。"],["p","猶大有烏西雅，以色列有耶羅波安。"],["p","那是一個，外面看起來很興旺的時代。"],["p","國土在擴張。"],["p","生意很好。"],["p","聖所裡，香火不斷。"],["p","在一個沒有人覺得需要先知的時候，神差了一位先知。"],["p","還有一件事。"],["p","大地震前二年。"],["p","這場地震，成為一個記號。"],["p","許多年以後，別的先知，還記得它。"],["p","可是，在地震來以前，神的話，已經先說出來了。"],["p","神總是先開口。"],["p","然後，才是災難。"],["p","不是反過來。"],["p","接著，是整卷書的第一句話。"],["q","他說：耶和華必從錫安吼叫，從耶路撒冷發聲；牧人的草場要悲哀；迦密的山頂要枯乾。（摩1:2）"],["p","吼叫。"],["p","阿摩司是牧人。"],["p","他知道獅子吼的時候，是什麼樣子。"],["p","整個山谷，安靜下來。"],["p","羊群縮成一團。"],["p","連風，都不敢動。"],["p","獅子的吼聲，不是為了嚇人。"],["p","是宣告，我已經在這裡了。"],["p","他沒有說，神像獅子。"],["p","他直接說，耶和華必吼叫。"],["p","聲音從哪裡來？"],["p","從錫安。"],["p","錫安，是神與祂百姓同在的地方。"],["p","是聖殿所在的山。"],["p","是敬拜的中心。"],["p","阿摩司是猶大人。"],["p","可是，他被差到北國去說話。"],["p","北國有自己的聖所。"],["p","北國人以為，神的事，我們都安排好了。"],["p","沒有想到，有一個聲音，從耶路撒冷來。"],["p","不請自來。"],["p","吼聲落下去，兩個地方有反應。"],["p","牧人的草場，悲哀。"],["p","迦密的山頂，枯乾。"],["p","迦密，是北國最肥美的山。"],["p","雨水多，樹木密。"],["p","連那裡，都要乾透。"],["p","請你留意一件事。"],["p","先有神的聲音。"],["p","然後才有枯乾。"],["p","災難，不是神沒有說話的結果。"],["p","是神說話以後，人沒有聽的結果。"],["p","這裡有一個很深的安慰。"],["p","約珥書三章十六節，有一句幾乎一樣的話。"],["p","耶和華必從錫安吼叫，從耶路撒冷發聲。"],["p","可是，那一節，接下去說，耶和華卻要作他百姓的避難所。"],["p","同一個聲音。"],["p","對仇敵，是吼。"],["p","對祂的百姓，是避難所。"],["p","神的吼聲裡，有一個，要人回頭的機會。"],["p","是要人，在災難來以前，回頭。"],["p","你有沒有想過，你生命裡，有沒有一個聲音，你已經聽了很久，卻一直假裝沒聽見？"],["p","一個提醒。"],["p","一次傷心。"],["p","一個你一直不想面對的人。"],["p","神的聲音，常常先是很輕的。"],["p","祂先吼，是因為，祂還在等。"],["p","這是第一個部分。"],["p","神的吼聲。"],["h","二、三番四次"],["p","吼聲過去，神開始說話。"],["p","而且，一連說了五次，格式幾乎一樣。"],["p","耶和華如此說。"],["p","某某三番四次地犯罪。"],["p","我必不免去刑罰。"],["p","因為他做了什麼什麼。"],["p","我卻要降火。"],["p","先看第一個。"],["q","耶和華如此說：大馬士革三番四次地犯罪，我必不免去她的刑罰；因為她以打糧食的鐵器打過基列。（摩1:3）"],["p","大馬士革，是亞蘭的首都。"],["p","打糧食的鐵器，是打穀的工具。"],["p","一塊木板，嵌著鐵齒。"],["p","在禾場上，拖過穀物。"],["p","把穀粒，從殼裡打出來。"],["p","拿來打人，是什麼樣子？"],["p","基列，在約旦河東。"],["p","那是以色列的土地。"],["p","列王紀下說，亞蘭王把以色列人，踐踏如禾場上的塵沙。"],["p","這是暴力。"],["p","而且，是一次又一次的暴力。"],["p","這裡，我們要停一下。"],["p","三番四次。"],["p","有人讀到這裡，開始算。"],["p","三次是什麼？四次是什麼？"],["p","哪一次是最後一次？"],["p","請你不要算。"],["p","這是希伯來文常見的說法。"],["p","先說三，再說四。"],["p","意思是，滿了，滿到溢出來了。"],["p","箴言裡，也有六樣、七樣的說法。"],["p","不是在給我們一個數字。"],["p","是讓我們知道，神等了很久。"],["p","祂不是一看到錯，就動手。"],["p","祂等，一次，又一次。"],["p","等到，已經不能再等了。"],["p","三番四次，是神的忍耐，有多長。"],["p","不是我們推算審判，有多近。"],["q","我卻要降火在哈薛的家中，燒滅便‧哈達的宮殿。（摩1:4）"],["p","火。"],["p","燒的是宮殿。"],["p","是王家，是那些以為自己牢不可破的高牆。"],["p","你看，神審判的，是權力的位置。"],["p","不是普通的百姓。"],["p","然後，還有一句要緊的話。"],["p","耶和華說，我必不免去她的刑罰。"],["p","這句話的原文，有一個很特別的字。"],["p","轉回。"],["p","直譯是，我必不使它轉回。"],["p","這個字，在整卷阿摩司書，一再出現。"],["p","這裡，是神說，我不收回。"],["p","祂決定了，就不收回。"],["p","到了第八節，這個字再出現。"],["p","神把手，轉過來。"],["p","同一個字根。"],["p","一個是不退讓。"],["p","一個是手轉向。"],["p","以後，我們還要看見，百姓有沒有轉回，轉到神這裡。"],["p","再看第二個，迦薩。"],["q","耶和華如此說：迦薩三番四次地犯罪，我必不免去她的刑罰；因為她擄掠眾民交給以東。（摩1:6）"],["p","迦薩，是非利士人的城。"],["p","她的罪，不是殺人。"],["p","是賣人。"],["p","整批的人，被抓走，交給以東。"],["p","被賣的人，有名字。"],["p","有家。"],["p","有人在等他們回來。"],["p","可是，這樁買賣，沒有見證人。"],["p","也沒有法庭。"],["p","你想一想，被交出去的那些人。"],["p","他們在路上，在想什麼？"],["p","他們會想，有沒有人，知道我在這裡？"],["p","經文給了答案。"],["p","神知道。"],["p","祂把這件事，記在帳上。"],["p","在神的帳上，沒有一個人，是貨物。"],["p","這一節，先讓我們看見的，是被賣走的人。"],["p","然後，才是賣人的城。"],["q","我必剪除亞實突的居民和亞實基倫掌權的，也必反手攻擊以革倫。非利士人所餘剩的必都滅亡。這是主耶和華說的。（摩1:8）"],["p","請注意最後一句。"],["p","這是主耶和華說的。"],["p","整章，每一個審判的結尾，都有這個印記。"],["p","說話的，不是阿摩司。"],["p","不是以色列人的憤怒。"],["p","是神自己。"],["p","第二個部分，我們看見三件事。"],["p","第一，神的審判，是從祂的忍耐裡長出來的。"],["p","第二，神看見暴力，也看見被賣掉的人。"],["p","第三，審判，不是我們可以拿去指著別人的話。"],["p","我們不拿今天任何一座城、任何一個國家，套進這節經文。"],["p","這一節，不是用來指著別人，說，你看，神要審判他們。"],["p","是用來問自己，我有沒有，把人當成可以交出去的東西？"],["h","三、不記念弟兄的盟約"],["p","接下來，是泰爾。"],["q","耶和華如此說：泰爾三番四次地犯罪，我必不免去她的刑罰；因為她將眾民交給以東，並不記念弟兄的盟約。（摩1:9）"],["p","泰爾，是地中海岸最富有的港口。"],["p","她的罪名，和迦薩有點像。"],["p","可是，多了一句。"],["p","並不記念弟兄的盟約。"],["p","這句話，很重。"],["p","泰爾不是侵略者。"],["p","她是商人。"],["p","她沒有拿刀。"],["p","她只是，簽了字，把人交出去，換一筆錢。"],["p","這種罪，不會被人注意。"],["p","因為買賣是合法的。"],["p","條約也沒有人追問。"],["p","可是，在神那裡，記念，是一件要付代價的事。"],["p","你可以忘了你說過的話。"],["p","可是，神記得你答應過什麼。"],["p","是哪一個盟約？"],["p","經文沒有說。"],["p","有人認為，是所羅門與泰爾王希蘭立的約。"],["p","列王紀上五章十二節說，他們彼此立約。"],["p","有人認為，是兩國之間，比較一般的友好。"],["p","也有人認為，是人與人之間，那一份基本的、像弟兄一樣的情誼。"],["p","我們不替經文決定。"],["p","三種讀法，指向同一件事。"],["p","泰爾背棄了，本來該信守的關係。"],["q","我卻要降火在泰爾的城內，燒滅其中的宮殿。（摩1:10）"],["p","泰爾的審判，只有一句。"],["p","沒有說門閂。"],["p","沒有說被擄。"],["p","簡短。"],["p","可是，同樣是火。"],["p","接下來，是以東。"],["q","耶和華如此說：以東三番四次地犯罪，我必不免去她的刑罰；因為她拿刀追趕兄弟，毫無憐憫，發怒撕裂，永懷忿怒。（摩1:11）"],["p","以東，是以掃的後代。"],["p","她追趕的兄弟，是雅各的後代。"],["p","以色列。"],["p","這一次，不是外人對外人。"],["p","是同一個祖先，生下來的兩個兄弟。"],["p","你看這一串動詞。"],["p","追趕。"],["p","沒有憐憫。"],["p","撕裂。"],["p","永懷忿怒。"],["p","一層，比一層深。"],["p","最先是行動。"],["p","然後是心。"],["p","最後，是一個不肯放下的恨。"],["p","憐憫這個字，希伯來文，是從子宮來的。"],["p","那是母親對腹中孩子的情感。"],["p","最不用教的，最原始的柔軟。"],["p","以東，把它毀了。"],["p","你知道，一個人要拿刀追趕自己的兄弟，心，要先硬到什麼地步？"],["p","而且，恨，如果不放下，會繼續在心裡撕裂。"],["p","保羅說，生氣卻不要犯罪，不可含怒到日落。"],["p","約翰說，人若說我愛神，卻恨他的弟兄，就是說謊話的。"],["p","你有沒有一個人，是你說了不再提，卻一直放在心裡的？"],["p","可能是一位兄弟。"],["p","一位姊妹。"],["p","一位長輩。"],["p","一次沒有被道歉的傷害。"],["p","我不是說，你要馬上原諒。"],["p","我是說，這件事，神看見。"],["p","而且，神看的，是那個被傷的人。"],["p","阿摩司說出以東的名字，不是叫我們去恨以東。"],["p","是為了那個被追趕的兄弟。"],["p","最後，是亞捫。"],["q","耶和華如此說：亞捫人三番四次地犯罪，我必不免去他們的刑罰；因為他們剖開基列的孕婦，擴張自己的境界。（摩1:13）"],["p","這是整個列國神諭裡，最難讀的一句。"],["p","經文沒有加形容詞。"],["p","沒有嘆息。"],["p","只是把動作，與目的，並排放在一起。"],["p","剖開孕婦。"],["p","為了，擴張疆土。"],["p","在這裡，我們不要急著，轉到審判。"],["p","先為那些人，停下來。"],["p","基列的婦女。"],["p","她們腹中的孩子。"],["p","她們的丈夫，她們的母親。"],["p","她們沒有名字。"],["p","可是，神記得。"],["p","詩篇一百三十九篇十三節說，我在母腹中，你已覆庇我。"],["p","在神的眼中，沒有一個人，是附帶的損失。"],["p","如果你的家裡，或你身邊，有人經歷過這樣的傷害。"],["p","暴力，流產，失去孩子。"],["p","或者，是被人用權力，壓在底下的。"],["p","我要說，這一節經文，不是為了讓你更痛。"],["p","是要你知道，神看見。"],["p","祂不是在遠處。"],["p","祂也不要你，立刻好起來。"],["q","我卻要在爭戰吶喊的日子，旋風狂暴的時候，點火在拉巴的城內，燒滅其中的宮殿。（摩1:14）"],["q","他們的王和首領必一同被擄去。這是耶和華說的。（摩1:15）"],["p","最後一節，有一個細節。"],["p","他們的王。"],["p","在希伯來文裡，這個字，也可以讀成米勒公。"],["p","是亞捫人所拜的神。"],["p","不管是哪一種讀法，意思是一樣的。"],["p","沒有一個人，也沒有一個神，能保護他們。"],["p","好，我們把這一章放在一起。"],["p","神先吼。"],["p","然後，一個一個，說出鄰居的罪。"],["p","大馬士革，迦薩，泰爾，以東，亞捫。"],["p","聽的人，也許覺得痛快。"],["p","可是，阿摩司的話，還沒有說完。"],["p","下一章，同樣的格式，要轉向猶大。"],["p","再轉向以色列。"],["p","這一章留給我們一個，不太舒服的問題。"],["p","神的眼睛，是不是，只看鄰居？"],["p","這一章，我們要怎麼回應？"],["p","第一，聽見神的聲音。"],["p","不是等到地震才聽。"],["p","今天，就把那個你一直假裝沒聽見的聲音，說出來。"],["p","第二，不要算。"],["p","不要算三番四次，也不要算日子。"],["p","要知道，神等了很久。"],["p","你若今天聽見，就是祂還在等的證明。"],["p","第三，記得你的盟約。"],["p","你對誰說過，我會在。"],["p","你對誰答應過，我不會丟下你。"],["p","今天，回去，照著做。"],["p","第四，放下你不肯放下的怒氣。"],["p","不是裝作沒事。"],["p","是把它帶到神面前，說，主，我放不下，求祢幫助我。"],["p","第五，為那些被傷的人，站在他們身邊。"],["p","先陪伴。"],["p","先保護。"],["p","再談對錯。"],["p","這裡，我們看見耶穌。"],["p","祂快到耶路撒冷的時候，看見城，就為它哀哭。"],["p","祂知道那座城的罪。"],["p","可是，祂哭了。"],["p","在十字架上，祂說，父啊，赦免他們。"],["p","那個吼聲，從錫安來的神。"],["p","在耶穌身上，成了一個眼淚，一個禱告。"],["p","祂擔當了審判。"],["p","為了，不讓我們被審判吞掉。"],["p","祂是我們的榜樣。"],["p","面對傷害，不以惡報惡。"],["p","面對仇敵，為他禱告。"],["p","這裡，也有321的信息。"],["p","有己的生命，聽到別人的審判，會點頭，會痛快。"],["p","因為，我站在對的一邊。"],["p","這是驕傲，離開本位，抓住權力，想要代替神。"],["p","無己的生命，是回到本位。"],["p","讓神作神，讓人作人。"],["p","神是審判者，我是被祂等候的人。"],["p","我不拿審判，去指著別人。"],["p","我先問自己，我的心，有沒有一條，不肯放下的怒氣？"],["p","有沒有，一份，被我忘記的盟約？"],["p","這是讓耶穌作王。"],["p","當耶穌在我裡面作王，我能聽見神的聲音。"],["p","能放下怒氣。"],["p","也能，站在受傷的人身邊。"],["p","弟兄姊妹，我們這個團契，也在學習這件事。"],["p","一個屬神的體系，是一群聽見神聲音的人。"],["p","是一群，記得盟約的人。"],["p","我們不拿審判，指著別人。"],["p","我們先陪伴受傷的人。"],["p","大家的焦點，都在耶穌，不在別人的過錯。"],["p","最後，我們一起來禱告。"],["p","親愛的天父，謝謝祢，從錫安發聲。"],["p","謝謝祢，在地震之前，先說話。"],["p","謝謝祢，這樣有耐心地，等我們。"],["p","求祢使我們，聽見祢的聲音，不再假裝沒聽見。"],["p","求祢使我們，記得所說過的話，也放下不肯放下的怒氣。"],["p","求祢安慰每一位，被傷害、被交出去、被忘記的人。"],["p","讓他們知道，祢看見。"],["p","讓耶穌作王掌權。"],["p","讓耶穌得到一切的榮耀。"],["p","奉主耶穌基督的名禱告，阿們。"]]},"2":{"min":12,"blocks":[["h","《為銀子賣了義人》"],["p","弟兄姊妹平安。"],["p","今天我們讀阿摩司書第二章。"],["p","先說一個畫面。"],["p","有一位阿姨，在一棟辦公大樓做清潔。"],["p","她每天凌晨四點起床。"],["p","搭第一班車，去擦別人的桌子。"],["p","月底發薪水，她發現，少了兩百塊。"],["p","她看了一下單子，抬頭想問。"],["p","可是，她沒有問。"],["p","因為她知道，問了，可能連這份工作都沒有。"],["p","兩百塊，對管帳的人，是一個小數字。"],["p","對她，是一個星期的菜錢。"],["p","她把單子折好，放進口袋。"],["p","明天凌晨四點，她還是會起床。"],["p","你想一想，這個人，神看見了嗎？"],["p","我相信，祂看見了。"],["p","阿摩司書第二章，就是神看見的那一章。"],["p","這一章，很長，很重。"],["p","可是，我們要慢慢讀。"],["p","因為神說話的方式，很特別。"],["p","祂從遠處，一圈一圈，走近我們。"],["p","我們分三個地方來看。"],["p","第一，審判轉向自己人。"],["p","第二，為銀子賣了義人。"],["p","第三，我曾領你們上來。"],["h","一、審判轉向自己人"],["p","先聽摩押。"],["q","耶和華如此說：摩押三番四次地犯罪，我必不免去她的刑罰；因為她將以東王的骸骨焚燒成灰。（摩2:1）"],["p","三番四次。"],["p","這四個字，不是在算數目。"],["p","不是第三次，也不是第四次。"],["p","是一次又一次，滿到溢出來了。"],["p","神的話裡，沒有帳本。"],["p","只有一個意思，夠了，這件事，我不能不看。"],["p","再看，我必不免去。"],["p","這個字，原文是轉回。"],["p","整卷阿摩司書，一直在說這個字。"],["p","神說，這件事，我不收回。"],["p","不是發脾氣。"],["p","是祂鄭重地說，這件事，我不能當作沒有發生。"],["p","摩押做了什麼？"],["p","把以東王的骸骨，燒成灰。"],["p","人已經死了。"],["p","仇還在。"],["p","恨，延伸到一個死人的骨頭上。"],["p","要他連安息的地方，也沒有。"],["p","請你留意。"],["p","被燒的，是別國的王。"],["p","不是以色列人。"],["p","可是，神為他說話。"],["p","神是列國的神。"],["p","連一個外邦人死後的尊嚴，祂也記得。"],["p","聽到這裡，以色列人，大概點頭了。"],["p","對啊，這種人，該受審判。"],["p","你有沒有發現，我們很容易這樣？"],["p","別人的錯，我們聽得很清楚。"],["p","自己的，就比較模糊。"],["p","可是，神的話，沒有停在這裡。"],["q","耶和華如此說：猶大人三番四次地犯罪，我必不免去他們的刑罰；因為他們厭棄耶和華的訓誨，不遵守他的律例。他們列祖所隨從虛假的偶像使他們走迷了。（摩2:4）"],["p","猶大。"],["p","是神的百姓。"],["p","他們有訓誨，有律例。"],["p","他們知道。"],["p","可是，他們把它，看為無用。"],["p","厭棄。"],["p","這個字，很安靜。"],["p","不是大聲反對。"],["p","是把一件東西，慢慢推到一邊。"],["p","最後，連看都不看了。"],["p","還有一句，值得停一下。"],["p","他們列祖所隨從虛假的偶像，使他們走迷了。"],["p","原文，直譯是，他們的謊言。"],["p","謊言，是一代一代傳下來的。"],["p","不是一個人突然走偏。"],["p","是一條路，一代一代，越走越偏。"],["p","這句話，也在對我們說。"],["p","我們從上一代，接過了什麼？"],["p","有些，是祝福。"],["p","有些，是不知不覺，也跟著走的謊言。"],["q","我卻要降火在猶大，燒滅耶路撒冷的宮殿。（摩2:5）"],["p","只有一句。"],["p","沒有再列罪名。"],["p","耶路撒冷，是神的城。"],["p","神說，連那裡，也一樣。"],["p","這不是神偏心。"],["p","是領受得越多，責任越重。"],["p","神的話，從遠處，一圈一圈，來到我們面前。"],["p","最後，停在以色列。"],["h","二、為銀子賣了義人"],["q","耶和華如此說：以色列人三番四次地犯罪，我必不免去他們的刑罰；因他們為銀子賣了義人，為一雙鞋賣了窮人。（摩2:6）"],["p","這一句，是整章的心。"],["p","為銀子賣了義人。"],["p","為一雙鞋賣了窮人。"],["p","你看，兩個 利人之地為業。（摩2:10）"],["p","埃及。"],["p","曠野。"],["p","應許地。"],["p","三個地方，主詞，都是神。"],["p","以色列，是從哪裡開始的？"],["p","不是從強大開始。"],["p","是從奴隸之家開始。"],["p","他們自己，曾經是被壓的人。"],["p","曾經，有人替他們出頭。"],["p","現在呢？"],["p","他們轉過身，賣了別人。"],["p","這是整章，最痛的地方。"],["p","神不是在羞辱他們。"],["p","神是在叫他們，想起來。"],["p","你是誰領你出來的？"],["p","你吃的飯，是誰給的？"],["p","你今天站的地方，是誰給的？"],["p","接著，神給的，不只是土地。"],["q","我從你們子弟中興起先知，又從你們少年人中興起拿細耳人。以色列人哪，不是這樣嗎？這是耶和華說的。（摩2:11）"],["p","先知，是神的話。"],["p","拿細耳人，是整個人，分別給神。"],["p","從你們子弟中。"],["p","從你們少年人中。"],["p","神沒有從別處借人。"],["p","祂把呼召，放在你們家門口。"],["p","然後，祂問。"],["p","以色列人哪，不是這樣嗎？"],["p","祂沒有直接定罪。"],["p","祂先問。"],["p","留一個空間，等人回答。"],["p","這是一位，肯等人回答的神。"],["p","可是，回答，是什麼？"],["q","你們卻給拿細耳人酒喝，囑咐先知說：不要說預言。（摩2:12）"],["p","卻。"],["p","這個字，很痛。"],["p","神興起的人。"],["p","他們，卻用兩個方法，讓他沒有聲音。"],["p","一個，是誘惑。"],["p","給拿細耳人酒喝，叫他破壞自己的分別。"],["p","一個，是命令。"],["p","叫先知閉嘴。"],["p","你看，七節八節的罪，與十二節的罪，不是兩件事。"],["p","把窮人賣了的人。"],["p","也把神的話，從嘴上拿掉。"],["p","對人沒有憐憫。"],["p","對神的話，也沒有耳朵。"],["p","這兩件事，常常一起出現。"],["q","看哪，在你們所住之地，我必壓你們，如同裝滿禾捆的車壓物一樣。（摩2:13）"],["p","沉重。"],["p","在你們所住之地。"],["p","不是別處，是自己的家園。"],["p","他們所倚靠的，成了壓下來的重量。"],["p","然後，是一份清單。"],["p","快跑的，有力的，剛勇的。"],["p","拿弓的，腿快的，騎馬的。"],["p","這些，是一個民族最倚靠的。"],["p","速度，力氣，武器，膽量。"],["p","可是，一個一個，都是不能。"],["p","不能逃脫。"],["p","不能用力。"],["p","不能自救。"],["p","重點，不是戰場上，會發生什麼。"],["p","重點是，人所靠的，在神面前，沒有一樣夠。"],["q","到那日，勇士中最有膽量的，必赤身逃跑。這是耶和華說的。（摩2:16）"],["p","赤身。"],["p","連衣服也顧不上。"],["p","我們不下定論。"],["p","可是，讀到這裡，心裡，有一點發涼。"],["p","八節，他們把窮人的衣服，鋪在壇旁。"],["p","十六節，最有膽量的人，連自己的衣服，也沒有了。"],["p","我們也不推算，哪一天。"],["p","不拿它，嚇人。"],["p","神說這句話，不是要我們害怕世界。"],["p","是要我們，今天，就聽見。"],["p","今天，就轉身。"],["p","不等到審判臨到，才發現，自己沒有一樣可靠。"],["p","這一章，從耶和華如此說開始。"],["p","也以這是耶和華說的結束。"],["h","四、耶穌，被賣的那位義人"],["p","讀到這裡，我們要抬起頭，看一個人。"],["p","有一位義人，也被賣了。"],["p","新約裡，猶大對祭司長說，你們願意給我多少錢？"],["p","他們就給了他三十塊錢。"],["p","我們不說，阿摩司書，是預言這件事。"],["p","新約，沒有這樣連。"],["p","可是，這使我們想起，二章六節。"],["p","為銀子，賣了義人。"],["p","後來，使徒彼得，在耶路撒冷，對人說，你們棄絕了那聖潔公義者。"],["p","司提反，也說，你們又把那義者賣了，殺了。"],["p","耶穌，是那位真正的義人。"],["p","祂被標了價。"],["p","被賣了。"],["p","為什麼？"],["p","彼得前書說，義的代替不義的，為要引我們到神面前。"],["p","你看這個福音。"],["p","我們每一個人，都有過，替人標價的時候。"],["p","也有過，被人標價的時候。"],["p","耶穌，兩邊都懂。"],["p","祂被賣，所以，祂知道，被賣的人，是什麼感覺。"],["p","祂也為我們死，所以，那個替人標過價的我，也有一條回頭的路。"],["p","祂本來富足，卻為我們成了貧窮。"],["p","這是十字架，給我們的，最大的價錢。"],["p","祂沒有算我們值多少。"],["p","祂把自己，給了出來。"],["h","五、讓耶穌作王"],["p","這裡，我們也看見，三二一的信息。"],["p","有己的生命，會替人標價。"],["p","這個人，對我有用嗎？"],["p","這個人，能給我什麼？"],["p","沒有用了，就算了。"],["p","這是驕傲。"],["p","離開本位，抓住權力，想要坐在神的位置上，決定一個人的價值。"],["p","無己的生命，是回到本位。"],["p","讓神作神，讓人作人。"],["p","每一個人，不論窮富，不論有沒有用，都是神所造的。"],["p","都是祂所愛的。"],["p","當耶穌，在我裡面作王。"],["p","我就慢慢，不再替人標價。"],["p","我開始看見，菜市場那位老闆。"],["p","辦公室，那位清潔的阿姨。"],["p","教會裡，最安靜的人。"],["p","我也看見，他們都是人。"],["p","弟兄姊妹，我們這個團契，也在學習。"],["p","一個屬神的體系，是一群，不替人標價的人。"],["p","我們陪伴，那些受傷的人。"],["p","我們不先追問，他們哪裡做錯了。"],["p","我們先問，我可以怎麼陪你。"],["p","大家的眼睛，都在耶穌身上。"],["h","六、今天，我可以做什麼"],["p","這一章，我們要怎麼回應？"],["p","第一，不要急著指別人。"],["p","先讀自己。"],["p","我有沒有，替人標過價？"],["p","這個星期，找出一個人。"],["p","你對他的態度，是因為他有用，還是因為他是人？"],["p","第二，把欠人的，還給人。"],["p","工錢，答應的事，該說的謝謝。"],["p","律法說，日落以先，要還衣服。"],["p","你不必等明天。"],["p","第三，如果你是被標價的那一位。"],["p","你不是一個人。"],["p","找一個你信得過的人，說出來。"],["p","不必先處理好情緒。"],["p","不必先原諒誰。"],["p","需要的時候，也請尋求專業的幫助。"],["p","這不是軟弱。"],["p","第四，把敬拜，與生活，連在一起。"],["p","今天，你從教會出去，第一個遇見的人，是誰？"],["p","你怎麼對他？"],["p","第五，記得，你是被領上來的人。"],["p","你不是靠自己，站在這裡。"],["p","這是一個，讓人謙卑，也讓人有力量的記念。"],["p","最後，我們一起來禱告。"],["p","親愛的天父，謝謝祢，看見每一個，沒有人看見的人。"],["p","謝謝祢，從來不替我們標價。"],["p","求祢憐憫我們，常常用有沒有用，來看人。"],["p","求祢醫治，每一位，曾經被人當作東西的人。"],["p","求祢使我們，不再沉默，也不再傷人。"],["p","求祢使我們，記得，是祢領我們上來。"],["p","讓耶穌作王掌權。"],["p","讓耶穌得到一切的榮耀。"],["p","奉主耶穌基督的名禱告，阿們。"]]},"3":{"min":13,"blocks":[["h","《惟獨認識你們》"],["p","弟兄姊妹平安。"],["p","今天我們讀阿摩司書第三章。"],["p","先說一個畫面。"],["p","一位父親，帶著孩子去親戚家吃飯。"],["p","鄰居的孩子，在客廳跑來跑去，打翻了一碗湯。"],["p","大家笑一笑，說，沒關係，小孩子嘛。"],["p","過了一會兒，自己的孩子，也打翻了一碗。"],["p","這位父親，卻放下筷子，把孩子帶到門口。"],["p","蹲下來，一句一句，把話說清楚。"],["p","旁邊的人說，何必這麼認真。"],["p","父親心裡知道。"],["p","別人的孩子，他可以不管。"],["p","自己的孩子，他不能不管。"],["p","因為認識。"],["p","因為這是他的孩子。"],["p","今天這一章，開頭就是這個畫面。"],["p","只是，說話的，是神。"],["p","聽話的，是祂從埃及領上來的百姓。"],["p","這一章，有三個要點。"],["p","第一，蒙揀選的責任。"],["p","第二，豈能不說。"],["p","第三，欺壓與拆毀。"],["p","我們先讀第一節。"],["q","以色列人哪，你們全家是我從埃及地領上來的，當聽耶和華攻擊你們的話：（摩3:1）"],["p","請你留意，第一個字。"],["p","當聽。"],["p","這一章，開頭的第一句話，不是做，是聽。"],["p","蒙揀選的人，第一個功課，是把耳朵打開。"],["p","神說，是我從埃及地領上來的。"],["p","你們全家。"],["p","不是只有某一個人，某一個城。"],["p","是一整個，被領上來的家。"],["p","被領上來的，就是被愛過的。"],["p","他們記得那一天。"],["p","奴隸的鐵鏈，斷了。"],["p","恩典，在前面。"],["p","可是，領他們上來的神，現在，要說一些攻擊的話。"],["p","請你注意，是攻擊你們的話。"],["p","不是攻擊埃及，不是攻擊別的國。"],["p","是對自己的百姓說的。"],["p","接著，第二節。"],["q","在地上萬族中，我只認識你們；因此，我必追討你們的一切罪孽。（摩3:2）"],["p","前半句，是天大的榮耀。"],["p","地上萬族，神只認識你們。"],["p","可是，後半句，接著就是，因此。"],["p","因此，我必追討。"],["p","這個因此，很重。"],["p","我們常常以為，被愛，就等於沒事。"],["p","我們常常以為，被揀選，就等於免責。"],["p","神說，正因為我只認識你們，所以我不能不追討。"],["p","這個認識，不是知道名字。"],["p","是父親認識孩子的那種認識。"],["p","是立約的認識。"],["p","是把你放在心上，當作自己的。"],["p","陌生人的孩子，我們不追問。"],["p","自己的孩子，我們不放手。"],["p","這不是神變嚴厲了。"],["p","這是愛，認真了。"],["p","聖經別的地方，也這樣說。"],["p","箴言說，耶和華所愛的，他必責備，正如父親責備所喜愛的兒子。"],["p","新約也說，多給誰，就向誰多取。"],["p","彼得也說，審判要從神的家起首。"],["p","聽到這裡，不用害怕。"],["p","這一章，不是要我們恐慌。"],["p","是要我們，回到那位認識我們的神面前。"],["p","你被這樣認識，是一份恩典，也是一份託付。"],["p","你想一想。"],["p","有誰，是你最在乎的人？"],["p","你對他的要求，是不是比對別人更高？"],["p","不是因為你苛刻，是因為你把他放在心上。"],["p","神對你，也是這樣。"],["p","好，我們進入第二個要點。"],["p","從第三節開始，阿摩司，一連問了好幾個問題。"],["q","二人若不同心，豈能同行呢？（摩3:3）"],["p","這個同心，原文的意思，是約定。"],["p","兩個人，若沒有先約好，怎麼會走在同一條路上？"],["p","你想想，你和神，有沒有約？"],["p","你說你與神同行。"],["p","可是，你有沒有，在祂的話面前，真的順服過？"],["q","獅子若非抓食，豈能在林中咆哮呢？少壯獅子若無所得，豈能從洞中發聲呢？（摩3:4）"],["p","獅子在林中吼叫，必是有了獵物。"],["p","聲音的後面，有事情。"],["q","若沒有機檻，雀鳥豈能陷在網羅裡呢？網羅若無所得，豈能從地上翻起呢？（摩3:5）"],["p","鳥陷在網羅裡，必是有人設了機關。"],["p","事情的後面，有原因。"],["p","這些問題，沒有一個是難題。"],["p","每一個答案，都是，不會。"],["p","阿摩司是牧人，是修理桑樹的人。"],["p","他不是用高深的道理。"],["p","他是用田野裡，人人看得懂的事。"],["p","一步一步，把你帶到那個結論。"],["q","城中若吹角，百姓豈不驚恐呢？災禍若臨到一城，豈非耶和華所降的嗎？（摩3:6）"],["p","城裡響起號角，全城的人，都會發抖。"],["p","警報響起，是為了讓人行動。"],["p","可是，這一句，我們要慢慢讀。"],["p","這是對神的約民，在先知的話語之下說的。"],["p","神已經事先警告了。"],["p","若災禍來臨，不要說是偶然。"],["p","這一節，不是拿來解釋，你鄰居的病痛。"],["p","也不是拿來解釋，任何一場災難。"],["p","耶穌在路加福音十三章，就曾經糾正過這樣的想法。"],["p","對正在受苦的人，我們不先解釋。"],["p","我們先陪伴。"],["p","我們先坐下來，聽他說。"],["q","主耶和華若不將奧祕指示他的僕人－眾先知，就一無所行。（摩3:7）"],["p","這個奧祕，原文的畫面，是一群人，坐在一起，說知心的話。"],["p","神對祂的僕人，像對朋友一樣，把心意打開。"],["p","耶穌也這樣說。"],["p","我稱你們為朋友，因我從我父所聽見的，已經都告訴你們了。"],["p","神不是躲在暗處設網的獵人。"],["p","祂是在城門口，吹角的守望者。"],["p","祂的話，先於祂的手。"],["p","這是一位，願意讓我們知道祂心意的神。"],["p","我們也要小心。"],["p","這一節，不是一條預測的公式。"],["p","不是說，凡有人說神向我啟示，就一定是真的。"],["p","真僕人的記號，是他說的，是神已經說過的話。"],["q","獅子吼叫，誰不懼怕呢？主耶和華發命，誰能不說預言呢？（摩3:8）"],["p","獅子一吼，整座森林，都靜下來。"],["p","神一開口，沒有人，能假裝沒有聽見。"],["p","聽見的人，不能不說。"],["p","這個不能不說，不是才華，也不是性格。"],["p","是被神的話，抓住了。"],["p","後來，彼得和約翰也說，我們所看見所聽見的，不能不說。"],["p","保羅也說，若不傳福音，我便有禍了。"],["p","這使我們想起，被神的話抓住的人，常常有同一個記號。"],["p","請你注意，這兩句，是並排的。"],["p","誰不懼怕。"],["p","誰能不說。"],["p","懼怕神的人，才有話可說。"],["p","不懼怕神的人，說出來的，只是自己的話。"],["p","我們也來問自己。"],["p","神有沒有對你，說過一句話？"],["p","是一件該道歉的事。"],["p","是一個該說出口的見證。"],["p","是一段，該結束的關係。"],["p","你有沒有，一直沒有說？"],["p","不是人人都是先知。"],["p","可是，凡是真聽見了的人，都有一個，說出來的責任。"],["p","用溫柔的話，用真實的話。"],["p","不是批評，是見證。"],["p","好，我們進入第三個要點。"],["p","從第九節開始，聲音忽然轉了方向。"],["q","要在亞實突的宮殿中和埃及地的宮殿裡傳揚說：你們要聚集在撒馬利亞的山上，就看見城中有何等大的擾亂與欺壓的事。（摩3:9）"],["p","神請外邦人，來看。"],["p","亞實突，是非利士人的城。"],["p","埃及，是以色列人，當年為奴的地方。"],["p","神說，你們來撒馬利亞的山上看。"],["p","看神的百姓，在自己的城裡，做了什麼。"],["p","這是一個令人心酸的畫面。"],["p","神的百姓，把約的標準，丟得太遠。"],["p","遠到連外邦人，看了，都要皺眉。"],["q","那些以強暴搶奪財物、積蓄在自己家中的人不知道行正直的事。這是耶和華說的。（摩3:10）"],["p","請你注意，不知道。"],["p","不是說，他們偶爾做錯。"],["p","是說，他們心裡，那把直尺，不見了。"],["p","搶奪，成了習慣。"],["p","積蓄，成了本事。"],["p","而且，沒有人覺得不對。"],["p","在這裡，我們要先站在，被欺壓的人那一邊。"],["p","經文說的欺壓，後面，是一個一個真實的人。"],["p","是被奪去財物的人。"],["p","是被壓榨，卻不敢說話的人。"],["p","如果你，就是這樣的人。"],["p","這一節，要先告訴你。"],["p","神看見了。"],["p","你所受的，不是理所當然。"],["p","不是你軟弱，不是你活該。"],["p","耶和華說，這是耶和華說的。"],["p","神自己，在這個控訴上，簽了名。"],["p","至於那些行強暴的人，神自己會追討。"],["p","我們不在這裡，替神，指名某一個人。"],["q","所以主耶和華如此說：敵人必來圍攻這地，使你的勢力衰微，搶掠你的家宅。（摩3:11）"],["p","控訴，與宣判，中間只隔一個字。"],["p","所以。"],["p","他們靠什麼，神就在那裡，動手。"],["p","他們靠堅固的宮殿，與積蓄的財物。"],["p","神說，你的勢力，要衰微。"],["p","經文沒有說，敵人是誰。"],["p","也沒有說，哪一天。"],["p","我們不算日子。"],["p","我們不套到今天，任何一個國家。"],["p","阿摩司，是要他當時的百姓，今天就回頭。"],["q","耶和華如此說：「牧人怎樣從獅子口中搶回兩條羊腿或半個耳朵，住撒馬利亞的以色列人躺臥在床角上或鋪繡花毯的榻上，他們得救也不過如此。」（摩3:12）"],["p","這是一個很刺人的畫面。"],["p","一隻羊，被獅子叼走了。"],["p","牧人追上去，只搶回，兩條小腿骨，一片耳朵。"],["p","他帶著這點碎片，回去給主人看。"],["p","為了證明，羊，是被獅子吃掉的。"],["p","神說，他們得救，也不過如此。"],["p","這不是安慰。"],["p","這是一句，叫人心痛的話。"],["p","躺在床上的人，聽不見獅子的吼叫。"],["p","不是說，舒服的床有罪。"],["p","是說，安逸，可以讓人的耳朵，變得很重。"],["p","讀到這裡，若你覺得痛，這就對了。"],["p","因為每一片碎片的後面，是一個人家。"],["p","我們的好牧人，不一樣。"],["p","耶穌說，我是好牧人；好牧人為羊捨命。"],["p","祂不是只帶回證據。"],["p","祂找著了羊，就歡歡喜喜地，扛在肩上，回到家裡。"],["q","主耶和華－萬軍之神說：當聽這話，警戒雅各家。（摩3:13）"],["p","這是第二次，當聽。"],["p","整章，用兩個當聽，包起來。"],["p","神在這裡，召了見證人。"],["p","不是在暗處定案。"],["p","是在眾人面前，公開作證。"],["p","可是，這個警戒，是慈愛的。"],["p","神若不再在乎，就不會警戒。"],["p","祂警戒，因為祂還在乎。"],["p","只要這聲音，還在，就還有一個，回頭的機會。"],["q","我討以色列罪的日子，也要討伯特利祭壇的罪；壇角必被砍下，墜落於地。（摩3:14）"],["p","伯特利，意思是，神的殿。"],["p","人去那裡獻祭，去那裡求庇護。"],["p","抓住壇角，可以暫時得到保護。"],["p","可是，神說，壇角必被砍下。"],["p","連避難所，也不能保護人。"],["p","請你注意，這不是說，敬拜是壞事。"],["p","這是說，一邊壓榨別人，一邊抓住壇角，以為這樣就平安。"],["p","神說，這座壇，不能成為罪的避難所。"],["p","敬拜，不能代替悔改。"],["p","一個願意回頭的人，神的壇，永遠為他敞開。"],["p","一個抓著壇角，卻不肯放下的人，壇，保護不了他。"],["q","我要拆毀過冬和過夏的房屋。象牙的房屋也必毀滅；高大的房屋都歸無有。這是耶和華說的。（摩3:15）"],["p","一層一層，過冬的，過夏的，象牙的，高大的。"],["p","神說，都要歸無有。"],["p","請你小心。"],["p","阿摩司書，不是咒詛財富的書。"],["p","經文沒有說，有房子，就是罪。"],["p","它說的，是這些房子的來歷。"],["p","建在搶奪上，建在欺壓上。"],["p","這一節，不是用來批判別人的。"],["p","是一面鏡子，給我們自己。"],["p","我所擁有的，是怎麼來的？"],["p","它有沒有，叫別人受傷？"],["p","第一節說，我認識你們，我領你們上來。"],["p","最後一節說，我要拆毀，你們以為最穩的房屋。"],["p","被神認識的人，不能倚靠房屋。"],["p","要倚靠神。"],["p","好，我們把這一章，放在一起。"],["p","第一，蒙揀選的責任。"],["p","被愛的人，是被託付的人。"],["p","第二，豈能不說。"],["p","神說了話，聽見的人，不能不說。"],["p","第三，欺壓與拆毀。"],["p","神看見受傷的人，也不讓祭壇，成為罪的避難所。"],["p","這裡，我們也看見耶穌。"],["p","祂是那位，真正認識我們的人。"],["p","我是好牧人，我認識我的羊，我的羊也認識我。"],["p","祂認識我們，不是為了追討，是為了把我們，背回家。"],["p","祂也是那位，真正聽見的人。"],["p","祂說，我所聽見的，都告訴你們了。"],["p","在客西馬尼園，祂說，不要成就我的意思，只要成就你的意思。"],["p","祂也是為受欺壓的人，捨命的牧人。"],["p","這裡，我們也看見三二一的信息。"],["p","有己的生命，聽到被揀選，就想到特權。"],["p","我是蒙愛的人，我可以放心，不用改變。"],["p","這是驕傲，抓住位置，想要代替神。"],["p","無己的生命，聽到被揀選，就想到託付。"],["p","我被認識了，所以我要先聽，我要說真話，我要保護受傷的人。"],["p","這是讓耶穌作王。"],["p","讓祂決定，我該聽什麼，我該說什麼，我該不再做什麼。"],["p","弟兄姊妹，我們這個團契，也在學習。"],["p","一個屬神的體系，是一群先聽神，再彼此同行的人。"],["p","我們彼此說真話，也彼此保護。"],["p","我們不在祭壇前，掩蓋我們的罪。"],["p","大家的焦點，都在耶穌，不在自己，不在位置，不在財物。"],["p","這一章，我們可以做四件事。"],["p","第一，每天先聽。"],["p","在說話之前，在做事之前，先花五分鐘，聽神的話。"],["p","第二，檢查同行。"],["p","我與神之間，有沒有一件，我一直沒有順服的事？"],["p","第三，說一句真話。"],["p","對一位你在乎的人，用溫柔的話，把神給你的那一句，說出來。"],["p","第四，陪伴一位受傷的人。"],["p","先不要解釋，不要指責。"],["p","只要說，我看見你了，神也看見你。"],["p","最後，我們一起來禱告。"],["p","親愛的天父，謝謝祢，從埃及把我們領上來。"],["p","謝謝祢，這樣認識我們。"],["p","求祢憐憫我們，常常把蒙愛，當作特權。"],["p","求祢使我們，先聽祢的話，再說祢的話。"],["p","求祢看顧每一位，受過欺壓的人，讓他們知道，祢看見。"],["p","也求祢幫助我們，不抓著壇角，卻真實地回到祢面前。"],["p","讓耶穌作王掌權。"],["p","讓耶穌得到一切的榮耀。"],["p","奉主耶穌基督的名禱告，阿們。"]]},"4":{"min":12,"blocks":[["h","《你們仍不歸向我》"],["p","弟兄姊妹平安。"],["p","今天我們讀阿摩司書第四章。"],["p","先想一個畫面。"],["p","一個星期天的早上，你坐在聚會裡。"],["p","詩歌唱得很大聲。"],["p","奉獻袋傳過來，你放進去了。"],["p","散會的時候，你還跟好幾個人說，這個星期要好好為主做事。"],["p","回家的路上，手機響了。"],["p","是一位認識的鄰居，聲音很小。"],["p","他說，這個月菜錢不夠，能不能先借一點？"],["p","你看著螢幕，心裡第一個念頭是什麼？"],["p","是心疼他？"],["p","還是有一點煩？"],["p","我們不用急著回答。"],["p","今天這一章，就是從這個地方開始問的。"],["p","你在神面前這麼熱心，"],["p","你在人面前，是什麼樣子？"],["p","第四章有三個畫面。"],["p","第一個，山上的母牛。"],["p","第二個，五次的災。"],["p","第三個，一個邀請。"],["p","我們一個一個來看。"],["h","一、巴珊的母牛"],["q","你們住撒馬利亞山如巴珊母牛的啊，當聽我的話－你們欺負貧寒的，壓碎窮乏的，對家主說：拿酒來，我們喝吧！（摩4:1）"],["p","阿摩司站在伯特利，對撒馬利亞山上的人說話。"],["p","撒馬利亞，是北國的京城。"],["p","建在山上，看得很遠。"],["p","住在山上的人，生活不錯。"],["p","阿摩司說，你們像巴珊的母牛。"],["p","巴珊，是肥美的牧地。"],["p","那裡的牛，吃得好，長得壯。"],["p","這個比喻，說的是過得很舒服的人。"],["p","他們是誰？"],["p","有人說，是富有的婦女。"],["p","也有人說，是整個上層的人。"],["p","這一點，經文沒有說得很死。"],["p","我們不替任何一群人貼標籤。"],["p","我們只看經文給的事實。"],["p","他們做了兩件事。"],["p","第一，欺負貧寒的。"],["p","第二，壓碎窮乏的。"],["p","欺負，是一點一點地剝。"],["p","壓碎，是壓到再也站不起來。"],["p","這不是偶爾失手。"],["p","是一種日常。"],["p","更刺人的是下一句。"],["p","他們對家主說，拿酒來，我們喝吧。"],["p","前一句，是別人的血汗。"],["p","後一句，是自己的酒杯。"],["p","兩句話放在一起，什麼都不用多說。"],["p","可是，請你看一個細節。"],["p","神怎麼開口？"],["p","當聽我的話。"],["p","神先叫他們聽。"],["p","連欺壓人的人，神也還肯開口。"],["p","這是整卷書很重要的一個字。"],["p","聽。"],["p","神不是先丟出刑罰。"],["p","祂先說話。"],["p","可是我們也要先站在另一邊。"],["p","貧寒的，窮乏的。"],["p","他們被欺負的時候，也許沒有人聽見。"],["p","也許他們自己，都不敢開口。"],["p","這一節在告訴他們：神聽見了。"],["p","神看見了。"],["p","祂記得。"],["q","主耶和華指著自己的聖潔起誓說：日子快到，人必用鉤子將你們鉤去，用魚鉤將你們餘剩的鉤去。（摩4:2）"],["p","神起誓了。"],["p","起誓，不是發脾氣。"],["p","神指著自己的聖潔起誓。"],["p","聖潔，是神最根本的本性。"],["p","祂拿這個作保，是在說：受欺負的人的哭聲，不是小事。"],["p","鉤子、魚鉤，這些字很難確定。"],["p","解經家有不同的看法。"],["p","可是意思很清楚。"],["p","人像魚一樣，被拖走了。"],["p","她們把別人當成可以壓碎的東西。"],["p","最後，自己也成了被拖走的東西。"],["q","你們各人必從破口直往前行，投入哈門。這是耶和華說的。（摩4:3）"],["p","城牆本來是保護的。"],["p","現在，成了破口。"],["p","每個人，各自走出去。"],["p","沒有人能回頭。"],["p","這不是神喜歡破壞。"],["p","是一個一直壓碎別人的做法，最後也壓到自己身上。"],["p","這是耶和華說的。"],["p","神自己簽了名。"],["p","我們讀這一段，不要幸災樂禍。"],["p","要看見的是：被欺負的人，終於被神記起來了。"],["h","二、你們仍不歸向我"],["q","以色列人哪，任你們往伯特利去犯罪，到吉甲加增罪過；每日早晨獻上你們的祭物，每三日奉上你們的十分之一。（摩4:4）"],["p","接下來，阿摩司把話轉到敬拜。"],["p","伯特利，吉甲。"],["p","這是北國最熱鬧的聖所。"],["p","人來這裡，是為了尋求神。"],["p","可是阿摩司說，任你們去犯罪。"],["p","這是一句反諷。"],["p","他把祭司召人來敬拜的話，倒過來說。"],["p","你們熱心到什麼程度？"],["p","每天早晨獻祭。"],["p","十分之一，每三日就獻上。"],["p","律法的十分之一，是三年一次。"],["p","他們卻熱心得連三天都不肯少。"],["q","任你們獻有酵的感謝祭，把甘心祭宣傳報告給眾人，因為是你們所喜愛的。這是主耶和華說的。（摩4:5）"],["p","感謝祭，甘心祭。"],["p","樣樣都有。"],["p","而且，還大聲告訴別人。"],["p","問題在哪裡？"],["p","不是祭物不夠。"],["p","不是次數不夠。"],["p","問題在最後一句。"],["p","因為是你們所喜愛的。"],["p","他們來，不是為了遇見神。"],["p","是為了做自己喜歡的事。"],["p","祭壇，成了舞台。"],["p","感謝，成了宣傳。"],["p","這裡要很小心。"],["p","阿摩司不是說，敬拜不好。"],["p","他是說，敬拜若與公義分開，神就不能接納。"],["p","這件事，第五章還要再講。"],["p","今天我們只留一個問題。"],["p","我來到神面前，是為了祂，還是為了我所喜愛的？"],["p","現在，我們來看五次災。"],["q","我使你們在一切城中牙齒乾淨，在你們各處糧食缺乏，你們仍不歸向我。這是耶和華說的。（摩4:6）"],["p","第一次，缺糧。"],["p","牙齒乾淨，就是沒有東西可以吃。"],["p","神說，我使。"],["p","祂沒有躲在災難後面。"],["p","祂說出自己的名字。"],["p","為什麼？"],["p","因為這些，不是要毀滅他們。"],["p","是要叫他們回頭。"],["p","然後，這一章最重的一句話，第一次出現。"],["p","你們仍不歸向我。"],["p","這個仍字，帶著心碎。"],["p","神說了，也做了，你們仍不回頭。"],["p","這句話裡，沒有咒詛。"],["p","只有一位一直在等的神。"],["q","在收割的前三月，我使雨停止，不降在你們那裡；我降雨在這城，不降雨在那城；這塊地有雨，那塊地無雨；無雨的就枯乾了。（摩4:7）"],["p","第二次，缺水。"],["p","停在收割前三個月。"],["p","秧苗已經長了。"],["p","農夫的力氣，已經花了。"],["p","偏偏在這個時候，雨停了。"],["p","更痛的是比較。"],["p","這城有雨，那城沒有。"],["p","你看著鄰居的田綠了，自己的卻枯了。"],["p","這不只是缺。"],["p","還有一種說不出口的痛。"],["q","這樣，兩三城的人湊到一城去找水，卻喝不足；你們仍不歸向我。這是耶和華說的。（摩4:8）"],["p","人走了很遠的路。"],["p","只為了一口水。"],["p","到了，卻喝不夠。"],["p","他們有行動力。"],["p","他們有毅力。"],["p","他們肯走。"],["p","唯獨沒有走向神。"],["p","這是第二次，你們仍不歸向我。"],["p","人在缺乏裡，什麼路都肯走。"],["p","只是常常不肯，走向神。"],["q","我以旱風、霉爛攻擊你們，你們園中許多菜蔬、葡萄樹、無花果樹、橄欖樹都被剪蟲所吃；你們仍不歸向我。這是耶和華說的。（摩4:9）"],["p","第三次，病和蟲。"],["p","旱風，霉爛，剪蟲。"],["p","先是天，再是地，最後是小小的蟲。"],["p","這些，是每年都可能碰到的事。"],["p","神沒有用遠方的敵人。"],["p","祂用的，是日常。"],["p","神把日常，變成了說話的方式。"],["p","可是，結尾沒有變。"],["p","第三次，你們仍不歸向我。"],["p","這裡我們要停一下。"],["p","不是每一場蟲害，都是為了某個人的罪。"],["p","請不要這樣讀。"],["p","這是神對那一群人，藉先知所作的解釋。"],["p","我們要學的是：生活裡有缺乏的時候，我願不願意停下來，問神一句，祢要對我說什麼？"],["q","我降瘟疫在你們中間，像在埃及一樣；用刀殺戮你們的少年人，使你們的馬匹被擄掠，營中屍首的臭氣撲鼻；你們仍不歸向我。這是耶和華說的。（摩4:10）"],["p","第四次，疫病與刀劍。"],["p","這一次，不再是田，是人。"],["p","像在埃及一樣。"],["p","以色列人，是從埃及被領出來的。"],["p","埃及所受的災，本來不屬於他們。"],["p","如今，他們活得越來越像埃及。"],["p","承受的，也越來越像埃及。"],["p","蒙恩的身分，不能取代轉回的行動。"],["p","這一節，不容易讀。"],["p","少年人被殺。"],["p","我們不要讀得太快。"],["p","也不要把任何一場戰爭，任何一次災難，說成神對某個群體的懲罰。"],["p","面對受苦的人，我們先是陪伴。"],["p","不是替他們找原因。"],["p","第四次，你們仍不歸向我。"],["q","我傾覆你們中間的城邑，如同我從前傾覆所多瑪、蛾摩拉一樣，使你們好像從火中抽出來的一根柴；你們仍不歸向我。這是耶和華說的。（摩4:11）"],["p","第五次，也是最後一次。"],["p","所多瑪，蛾摩拉。"],["p","聖經裡，審判的代名詞。"],["p","可是，請你看下一句。"],["p","好像從火中抽出來的一根柴。"],["p","一根燒了一半的木頭。"],["p","黑了，焦了，也許還在冒煙。"],["p","可是，被人從火裡，搶了出來。"],["p","神說，你們已經燒了一半。"],["p","可是，我還把你們抽出來。"],["p","祂傾覆。"],["p","祂也抽出。"],["p","面對這樣的恩典，他們怎麼回應？"],["p","第五次，你們仍不歸向我。"],["p","你數一數。"],["p","五次。"],["p","每一次，神都沒有說，所以我不要你們了。"],["p","每一次，祂都是在災難之後，再開口。"],["p","這就是神的忍耐。"],["p","祂不是因為恨，才降災。"],["p","是因為還要他們，所以不肯停止呼喚。"],["p","我們不是要算次數。"],["p","我們要看見的是，一位神，五次叫一群人回頭。"],["h","三、預備迎見你的神"],["q","以色列啊，我必向你如此行；以色列啊，我既這樣行，你當預備迎見你的神。（摩4:12）"],["p","到了這裡，聲音變了。"],["p","神連叫兩次，以色列啊。"],["p","這不是審判官的語氣。"],["p","是一位父親，站在門口叫孩子的聲音。"],["p","我必向你如此行，到底是什麼？"],["p","經文沒有說。"],["p","這個留白，是故意的。"],["p","人最怕的，往往不是知道的。"],["p","是還沒有說出來的。"],["p","然後是這一章的命令。"],["p","你當預備迎見你的神。"],["p","這不是一張死刑的通告。"],["p","預備，是動手去準備。"],["p","迎見，是站起來，走向對方。"],["p","同一個詞，也用在西奈山下。"],["p","以色列人預備好，要遇見神。"],["p","這是一個邀請。"],["p","在神來之前，你自己先走向祂。"],["p","我們不用這一節去嚇人。"],["p","也不用它去算日子。"],["p","它的意思不是，末日要到了，趕快怕。"],["p","它的意思是，神說了這麼多次，現在，請你站起來，回到祂面前。"],["p","今天就可以。"],["q","那創山、造風、將心意指示人、使晨光變為幽暗、腳踏在地之高處的，他的名是耶和華－萬軍之神。（摩4:13）"],["p","阿摩司停下來，唱了一首短短的頌詞。"],["p","因為聽的人，會問一個問題。"],["p","我要迎見的，是誰？"],["p","祂是創山的那一位。"],["p","是造風的那一位。"],["p","是曉得人心思的那一位。"],["p","是腳踏在高處的那一位。"],["p","祂不是伯特利的神像。"],["p","不是拿祭物就能打點的神。"],["p","你看這個次序。"],["p","從山，到風，到人的心。"],["p","祂創造最堅固的，也創造最難捉摸的。"],["p","祂大過一切，又靠近人心。"],["p","頌詞裡，沒有一個字說，所以你要害怕。"],["p","它只說，祂的名字。"],["p","敬畏，不是恐慌。"],["p","是認識這位神之後，願意向祂走去。"],["h","四、今天，我們怎麼回應"],["p","好，我們把這一章放在一起。"],["p","第一個畫面，山上的人，壓碎別人，喝自己的酒。"],["p","第二個畫面，五次災，五次，你們仍不歸向我。"],["p","第三個畫面，神說，你當預備迎見你的神。"],["p","我們怎麼回應？"],["p","第一，先看見被壓碎的人。"],["p","這個星期，想一想，你身邊有沒有一位貧寒的人？"],["p","可能是同事。"],["p","可能是鄰居。"],["p","可能是教會裡，一直不好意思開口的人。"],["p","不用做大事。"],["p","問一句，你還好嗎？"],["p","第二，把敬拜與生活接起來。"],["p","不是少敬拜。"],["p","是讓敬拜，有生命。"],["p","你唱的詩歌，你獻的錢，你說的話，要連到你怎麼對待人。"],["p","第三，不要等災難，才停下來。"],["p","有一個缺乏，一個空，一次疲乏。"],["p","你可以現在就停下來，問神一句，祢要對我說什麼？"],["p","第四，今天就轉身。"],["p","不是明天，不是下次營會。"],["p","今天，你有沒有一件事，神一直在叫你回頭，你卻仍然沒有？"],["p","把它說出來。"],["p","對神說，我回來了。"],["p","這裡，我們也看見耶穌。"],["p","舊約裡，神五次呼喚，百姓沒有回頭。"],["p","可是，神沒有放棄。"],["p","祂差來了自己的兒子。"],["p","耶穌來到人中間，不是坐在山上。"],["p","祂來到貧寒的、窮乏的人中間。"],["p","祂看見被壓碎的蘆葦，沒有折斷。"],["p","祂也為我們，站在火裡。"],["p","祂不是只叫我們預備迎見神。"],["p","祂自己走過來，迎見我們。"],["p","祂是我們的榜樣，也是我們回家的路。"],["p","這裡，也有321的信息。"],["p","有己的生命，只看見自己的山，自己的酒杯。"],["p","我過得不錯，那是我努力得來的。"],["p","這是驕傲，離開本位，想要代替神。"],["p","也有人，是另一種有己。"],["p","因為怕，所以不敢回頭。"],["p","怕被看見，怕被責備，怕承認錯了。"],["p","無己的生命，是回到本位。"],["p","讓神作神，讓人作人。"],["p","把山上的位置放下。"],["p","看見山腳下的人。"],["p","把仍不歸向的那一件事，交回給神。"],["p","這是讓耶穌作王。"],["p","當耶穌在我裡面作王，我就能一面敬拜，一面公義。"],["p","一面愛神，一面愛人。"],["p","弟兄姊妹，我們這個團契，也在學習這件事。"],["p","一個屬神的體系，不是一群很會敬拜的人。"],["p","是一群回頭的人。"],["p","是一群看見貧寒的人，和他們站在一起。"],["p","大家的焦點，都在耶穌。"],["p","最後，我們一起來禱告。"],["p","親愛的天父，謝謝祢，一次又一次，向我們說話。"],["p","謝謝祢，不肯放棄我們。"],["p","求祢憐憫我們，常常只看見自己的山，自己的酒杯。"],["p","求祢幫助我們，看見被壓碎的人，不要轉頭。"],["p","也求祢使我們，今天就轉身，預備好，迎見祢。"],["p","讓耶穌作王掌權。"],["p","讓耶穌得到一切的榮耀。"],["p","奉主耶穌基督的名禱告，阿們。"]]},"5":{"min":14,"blocks":[["h","《要尋求我，就必存活》"],["p","弟兄姊妹平安。"],["p","你有沒有在路上，看過一個老人家跌倒？"],["p","他躺在人行道上。"],["p","手裡的菜，滾了一地。"],["p","路過的人，放慢了腳步。"],["p","有人看了一眼。"],["p","有人拿出手機，卻不知道要打給誰。"],["p","有人心裡想，應該有人去扶吧。"],["p","然後，大家都走過去了。"],["p","過了很久，才有一個人蹲下來。"],["p","無人攙扶，是世上最冷的四個字。"],["p","今天，我們讀阿摩司書五章。"],["p","這一章，一開頭，就有一個人倒在地上。"],["p","倒下的，是一個國家。"],["p","更讓人驚訝的，是唱歌的那一位。"],["p","不是敵人。"],["p","不是看熱鬧的人。"],["p","是神自己。"],["p","祂在唱一首歌，一首哀歌。"],["p","今天的信息，有三個要點。"],["p","第一，要尋求我。"],["p","第二，耶和華的日子。"],["p","第三，公平如大水。"],["p","先讀第一節。"],["q","以色列家啊，要聽我為你們所作的哀歌：（摩5:1）"],["p","哀歌，是人死了以後，才唱的歌。"],["p","可是，這個國家，還活著。"],["p","街上有買賣。"],["p","聖所有人潮。"],["p","節期的歌聲，一首接一首。"],["p","阿摩司站在活人面前，唱他們的喪歌。"],["p","請你記住第一節裡的一個字：聽。"],["p","神先說，你們要聽。"],["p","這一章往後，我們還會再遇見這個字。"],["p","這首歌，是阿摩司唱的嗎？"],["p","是，他把它扛了出來。"],["p","可是，歌的詞，是神的。"],["p","審判的話，從神口中出來，是公義的。"],["p","唱出來，是哀歌。"],["p","祂不是在幸災樂禍。"],["p","祂是在心痛。"],["p","你有沒有聽過，一位父親在孩子的病床前說話？"],["p","他不是在審判孩子。"],["p","他是在求。"],["q","以色列民跌倒，不得再起；躺在地上，無人攙扶。（摩5:2）"],["p","原文，稱她為處女。"],["p","一個本來有大好前途的年輕人。"],["p","還沒有活夠，就倒下了。"],["q","主耶和華如此說：以色列家的城發出一千兵的，只剩一百；發出一百的，只剩十個。（摩5:3）"],["p","這不是一道算術題。"],["p","一千，剩一百；一百，剩十個。"],["p","那是一個個家庭裡，少掉的臉。"],["p","在我們談任何道理以前，請先停一下。"],["p","為將要失去親人的人，哀哭。"],["p","陪伴受傷的人，在議論傷害的原因之前。"],["p","哀歌唱完了，神開口。"],["p","你以為，祂要說，我要滅你們。"],["p","不是。"],["p","祂說的，是一個邀請。"],["q","耶和華向以色列家如此說：你們要尋求我，就必存活。（摩5:4）"],["p","尋求，是一個很貼近的字。"],["p","是登門求問。"],["p","是把你的難處，帶到一個人面前。"],["p","神說，我在這裡。"],["p","來找我。"],["p","不是來找我的房子。"],["p","是來找我。"],["q","不要往伯特利尋求，不要進入吉甲，不要過到別是巴；因為吉甲必被擄掠，伯特利也必歸於無有。（摩5:5）"],["p","伯特利，雅各在那裡，夢見天梯。"],["p","吉甲，是進入迦南後，第一個紮營的地方。"],["p","別是巴，亞伯拉罕與以撒，在那裡築壇。"],["p","這些，都不是壞地方。"],["p","是有故事的聖地。"],["p","可是，神說，不要往那裡尋求。"],["p","你可以去很多次聖地，卻從來沒有找到神。"],["p","原文有一個雙關語。"],["p","吉甲，聽起來，像被擄。"],["p","伯特利，意思是神的家，神說，要歸於無有。"],["p","地名，在神口中，成了判詞。"],["p","你有沒有一個，自己的聖地？"],["p","也許是一間教會。"],["p","也許是一場崇拜，一個活動。"],["p","你去了很多年。"],["p","神只問一句：你在那裡，尋求的是我嗎？"],["q","要尋求耶和華，就必存活，免得他在約瑟家像火發出，在伯特利焚燒，無人撲滅。（摩5:6）"],["p","就必存活。"],["p","這句話，這一章，說了三次。"],["p","第四節。第六節。第十四節。"],["p","一次比一次急。"],["p","這個存活，不是活得久一點。"],["p","是真的活著。"],["p","耶穌對一群人說過一句話。"],["p","你們不肯到我這裡來得生命。（約5:40）"],["p","那是同一個邀請。"],["p","活，不是從地方來的。"],["p","是從那一位來的。"],["p","你看，二節說，無人攙扶。"],["p","六節說，無人撲滅。"],["p","兩個無人。"],["p","在說同一件事：肯伸手的，只有神。"],["p","這是第一個要點：要尋求我。"],["p","進入第二個要點。"],["p","耶和華的日子。"],["p","先看七節。"],["q","你們這使公平變為茵蔯、將公義丟棄於地的，（摩5:7）"],["p","茵蔯，是一種苦草。"],["p","公平，本來是甜的。"],["p","現在，在他們手裡，成了苦的。"],["p","公義呢？"],["p","被丟在地上。"],["p","像一件沒有人要的東西。"],["p","這節話，忽然斷了。"],["p","先知插進來一首詩。"],["q","要尋求那造昴星和參星，使死蔭變為晨光，使白日變為黑夜，命海水來澆在地上的－耶和華是他的名；（摩5:8）"],["p","請你留意那個動詞，變為。"],["p","七節，人把公平，變為茵蔯。"],["p","八節，神把死蔭，變為晨光。"],["p","同一個字，兩雙手。"],["p","人把好的，翻成苦的。"],["p","神把暗的，翻成光。"],["p","為什麼要在這裡，提醒他們，神是創造主？"],["p","因為他們只知道，神是節期裡的神。"],["p","阿摩司要他們看見，造星的那一位，也是城門口的神。"],["p","祂不只管聖所裡的香火。"],["p","也管街上的秤。"],["p","也管城門口的審判。"],["q","他使力強的忽遭滅亡，以致保障遭遇毀壞。（摩5:9）"],["p","靠權勢築起來的安全，擋不住那位創造者。"],["q","你們怨恨那在城門口責備人的，憎惡那說正直話的。（摩5:10）"],["p","城門口，是審案的地方。"],["p","是一個城，最後的公道。"],["p","說真話的人，在那裡，被人嫌棄。"],["p","有人說，這個秤，不準。"],["p","有人說，這個孩子，沒有錯。"],["p","有人說，這筆錢，不能這樣收。"],["p","然後，沒有人再請他吃飯。"],["p","這很痛。"],["p","一個地方，如果說真話的人被人恨，那個地方的公平，就已經病了。"],["q","你們踐踏貧民，向他們勒索麥子；你們用鑿過的石頭建造房屋，卻不得住在其內；栽種美好的葡萄園，卻不得喝所出的酒。（摩5:11）"],["p","貧民，在這裡，不是一個口號。"],["p","是一個個，有名字的人。"],["p","他的麥子，被人拿走了。"],["p","拿走的人，蓋了鑿過的石頭房子。"],["p","卻住不進去。"],["p","神沒有說，你們不可以有房子。"],["p","神說的是，拿別人的飯碗，換來的房子，住不安穩。"],["p","你想過嗎？"],["p","錢，和住得安不安穩，是兩件事。"],["q","我知道你們的罪過何等多，你們的罪惡何等大。你們苦待義人，收受賄賂，在城門口屈枉窮乏人。（摩5:12）"],["p","我知道。"],["p","這是神的話裡，最讓人不安的三個字。"],["p","可是，受欺壓的人，聽見這三個字，是安慰。"],["p","因為，受苦的人，常常覺得，沒有人知道。"],["p","神說，我知道。"],["p","祂看見。"],["p","祂都記著。"],["q","所以通達人見這樣的時勢必靜默不言，因為時勢真惡。（摩5:13）"],["p","這一節，很難讀。"],["p","通達人，靜默不言。"],["p","是智慧，還是害怕？"],["p","有人說，是智慧。"],["p","有人說，是諷刺。"],["p","我們不替他們下定論。"],["p","我們只看見：在一個說真話會受罰的地方，人會安靜下來。"],["p","如果你曾經，因為害怕，不敢開口。"],["p","神沒有在這裡罵你。"],["p","祂只說，這是一個真惡的時勢。"],["p","下一節，祂又開了一扇門。"],["q","你們要求善，不要求惡，就必存活。這樣，耶和華－萬軍之神必照你們所說的與你們同在。（摩5:14）"],["p","第三次，存活。"],["p","求善，不是一句道德口號。"],["p","是跟著那位善的神走。"],["p","他們天天說，神與我們同在。"],["p","神沒有否定。"],["p","祂只是把這句話，扶正。"],["p","同在，是在你們求善的時候。"],["p","不是在你們壓人的時候。"],["q","要惡惡好善，在城門口秉公行義；或者耶和華－萬軍之神向約瑟的餘民施恩。（摩5:15）"],["p","公平，要在城門口，站得住。"],["p","然後，有一個字。"],["p","或者。"],["p","神沒有說，一定。"],["p","祂說，或者。"],["p","恩典，不是一份可以討價還價的合約。"],["p","是一位自由的神，伸出來的手。"],["p","我們有時候，對神說，祢應許過。"],["p","他們也這樣說。"],["p","這裡，神把門打開，卻不被人綁住。"],["q","主耶和華－萬軍之神如此說：在一切寬闊處必有哀號的聲音；在各街市上必有人說：哀哉！哀哉！又必叫農夫來哭號，叫善唱哀歌的來舉哀。（摩5:16）"],["q","在各葡萄園必有哀號的聲音，因為我必從你中間經過。這是耶和華說的。（摩5:17）"],["p","葡萄園，本來是歡呼收割的地方。"],["p","現在，是哭聲。"],["p","最喜樂的地方，成了最悲傷的地方。"],["p","這不是在嚇人。"],["p","是在說，神的審判，不躲在遙遠的地方。"],["p","它走進人最日常的生活。"],["p","因為，我必從你中間經過。"],["p","神離他們很近。"],["p","近到不能再假裝沒有事。"],["q","想望耶和華日子來到的有禍了！你們為何想望耶和華的日子呢？那日黑暗沒有光明，（摩5:18）"],["p","他們天天在等。"],["p","他們以為，那一天，神要為他們爭戰。"],["p","他們以為，光明，就要來了。"],["p","我們很難怪他們。"],["p","誰不想要神的日子？"],["p","可是，阿摩司說，有禍了。"],["p","這個字，本來是喪禮上的呼喊。"],["p","先知對著一群，天天盼望神的人，先唱起了喪歌。"],["q","景況好像人躲避獅子又遇見熊，或是進房屋以手靠牆，就被蛇咬。（摩5:19）"],["p","躲開了獅子，又遇見熊。"],["p","好不容易，進了屋子，靠著牆喘氣。"],["p","被蛇咬了。"],["p","連家，也不是避難所。"],["q","耶和華的日子不是黑暗沒有光明嗎？不是幽暗毫無光輝嗎？（摩5:20）"],["p","神的日子，是黑暗。"],["p","不是因為神變了。"],["p","是因為，他們站的位置，錯了。"],["p","一邊盼望神來。"],["p","一邊在城門口壓人。"],["p","我們不推算那一天。"],["p","我們不排任何時間。"],["p","我們只問今天。"],["p","我盼望的那位神，是真的神嗎？"],["p","我盼望祂來，我今天的生活，經得起祂來嗎？"],["p","這是第二個要點。"],["p","進入第三個要點：公平如大水。"],["q","我厭惡你們的節期，也不喜悅你們的嚴肅會。（摩5:21）"],["p","我厭惡。"],["p","神的口，說出了一個很重的字。"],["p","而且，說完厭惡，還要說鄙棄。"],["p","他們過節，沒有少。"],["p","聚會，沒有少。"],["p","獻祭，沒有少。"],["p","可是神說，我不要。"],["q","你們雖然向我獻燔祭和素祭，我卻不悅納，也不顧你們用肥畜獻的平安祭；（摩5:22）"],["p","燔祭，素祭，平安祭。"],["p","那是整套的敬拜。"],["p","這是不是說，敬拜不要了？"],["p","不是。"],["p","這一章，要兩面一起讀。"],["p","一面，神真的喜悅敬拜。"],["p","詩篇裡，滿了神要人歌唱的話。"],["p","另一面，神不要一個，跟城門口斷了線的敬拜。"],["p","跟貧民斷了線。"],["p","跟義人斷了線。"],["q","要使你們歌唱的聲音遠離我，因為我不聽你們彈琴的響聲。（摩5:23）"],["p","歌唱，是人最美的敬拜之一。"],["p","神卻說，拿走。"],["p","神不是不愛歌聲。"],["p","是不要，離開了公平的歌聲。"],["p","還記得第一節嗎？"],["p","神說，你們要聽。"],["p","他們不聽。"],["p","到了這裡，神說，我也不聽。"],["p","這是神的不聽。"],["p","也是人的不聽的回聲。"],["p","可是，神的耳朵，沒有永遠閉上。"],["p","因為，下一句，是整卷書的高點。"],["q","惟願公平如大水滾滾，使公義如江河滔滔。（摩5:24）"],["p","不是細水。"],["p","不是春天才有的小溪。"],["p","原文的江河，是一年四季，不乾涸的河。"],["p","那是神心裡的願望。"],["p","公平與公義，像大水，從城門口，流到葡萄園，流到貧民的門口。"],["p","這句話，常被人剪下來，貼在海報上。"],["p","可是，在原來的位置，它在，我厭惡，我不聽之後。"],["p","它不是敬拜的替代品。"],["p","是敬拜長出來的果子。"],["p","認識神的人，必然看見，倒在地上的人。"],["p","這不是革命的口號。"],["p","這是神自己的心願。"],["p","最後三節，神把他們帶回曠野。"],["q","「以色列家啊，你們在曠野四十年，豈是將祭物和供物獻給我呢？（摩5:25）"],["p","曠野四十年。"],["p","那是他們與神，最親近的日子。"],["p","神問了一個問題。"],["p","這個問題，有不同的讀法。"],["p","我們不急著下結論。"],["p","我們只聽見，神在問，你們最初，是因為什麼，跟隨我？"],["q","你們抬著為自己所造之摩洛的帳幕和偶像的龕，並你們的神星。（摩5:26）"],["p","為自己所造。"],["p","這四個字，是重點。"],["p","人若不尋求神，就去造神。"],["p","造出來的神，總是方便的。"],["p","可以扛在肩上，跟著自己走。"],["p","名字的讀法，學者有爭論。"],["p","我們不替它們下定論。"],["q","所以我要把你們擄到大馬士革以外。」這是耶和華－名為萬軍之神說的。（摩5:27）"],["p","新約的司提反，引用過這段話。"],["p","在使徒行傳七章。"],["p","他按照他的時代，把地名說成了巴比倫。"],["p","我們照新約自己的引用來讀，不另外延伸。"],["p","這一章，從哀歌開始，到神的名字結束。"],["p","祂仍然在說話。"],["p","審判的話，不是報復。"],["p","是一位神，一次又一次，用各樣的聲音，叫人回頭。"],["p","好，我們把這一章，放在一起。"],["p","第一個畫面，一個國家，倒在地上，無人攙扶。"],["p","第二個畫面，神開口，你們要尋求我，就必存活。"],["p","第三個畫面，城門口，公平變成了茵蔯。"],["p","第四個畫面，耶和華的日子，是黑暗。"],["p","第五個畫面，神說，我不聽，願公平如大水滾滾。"],["p","在這裡，我們看見耶穌。"],["p","一位父親，在孩子的病床前，唱了一首哀歌。"],["p","祂說，你們要尋求我。"],["p","可是，我們沒有一個人，尋求得夠。"],["p","於是，祂自己來了。"],["p","人子來，為要尋找、拯救失喪的人。（路19:10）"],["p","祂不只說，你們要尋求我。"],["p","祂先來找我們。"],["p","我們是那個，倒在地上，無人攙扶的人。"],["p","祂蹲下來。"],["p","把我們扶起來。"],["p","祂也是那位，在城門口說真話的人。"],["p","祂說真話，被人憎惡。"],["p","祂被人釘在十字架上，連門徒也離開了。"],["p","為的，是叫我們，真的存活。"],["p","祂是我們尋求的榜樣，也是我們尋求的對象。"],["p","這裡，我們也看見321的信息。"],["p","有己的人，用自己的辦法，保住自己。"],["p","他尋求聖地，尋求節期，尋求安全。"],["p","因為，真正尋求神，要先放下自己。"],["p","無己的人，是回到本位。"],["p","讓神作神。"],["p","讓人作人。"],["p","把自己的敬拜，帶到城門口。"],["p","把自己的城門口，帶到敬拜裡。"],["p","這是讓耶穌作王。"],["p","當耶穌在我裡面作王，我敬拜的神，和我生活的神，是同一位。"],["p","弟兄姊妹，我們這個團契，也在學習這件事。"],["p","一個屬神的體系，是一群，尋求神自己的人。"],["p","也是一群，在自己的城門口，肯說真話、肯伸手的人。"],["p","大家的焦點，都在耶穌。"],["p","最後，三件很小的事。"],["p","第一，這個星期，花十分鐘，不求任何事，只尋求神自己。"],["p","第二，找出你自己的城門口。"],["p","是辦公桌，是家裡的飯桌，是一個群組。"],["p","在那裡，說一句真話，或伸出一隻手。"],["p","第三，崇拜之前，問自己一句。"],["p","我今天，是從哪裡來到這裡的？"],["p","有沒有一個人，需要我先去和好？"],["p","如果有一位，今天正躺在地上，無人攙扶。"],["p","求神，叫我們，蹲下來。"],["p","最後，我們一起來禱告。"],["p","親愛的天父，謝謝祢，向我們唱哀歌。"],["p","謝謝祢，仍然說，你們要尋求我。"],["p","求祢憐憫我們，常常只尋求地方，不尋求祢。"],["p","求祢幫助我們，讓敬拜與生活，是同一條河。"],["p","求祢使公平，如大水滾滾，從我們的城門口，流出去。"],["p","也求祢，看顧每一位，正在倒地的人。"],["p","讓耶穌作王掌權。"],["p","讓耶穌得到一切的榮耀。"],["p","奉主耶穌基督的名禱告，阿們。"]]},"6":{"min":9,"blocks":[["h","《安逸的人，先被神哀哭》"],["p","弟兄姊妹平安。"],["p","今天我們讀阿摩司書六章。"],["p","先說一個畫面。"],["p","週日中午，一家餐廳。"],["p","窗邊那一桌，剛上了菜。"],["p","大家拿起手機，先拍照。"],["p","笑聲很大，湯很熱。"],["p","窗外的人行道上，有一位老先生，"],["p","蹲在那裡，整理一疊紙箱。"],["p","沒有人看他。"],["p","不是大家狠心。"],["p","只是，那一餐太好吃了。"],["p","那一刻，我們都很自在。"],["p","自在，不是罪。"],["p","可是，自在久了，"],["p","心，就慢慢睡著了。"],["p","阿摩司書六章，要問的就是這個。"],["p","不是你有沒有享受。"],["p","而是，你的心，還醒著嗎？"],["p","第一個要點：安逸無慮。"],["q","國為列國之首，人最著名，且為以色列家所歸向，在錫安和撒馬利亞山安逸無慮的，有禍了！（摩6:1）"],["p","先聽這一個字：有禍了。"],["p","這個字，原來是葬禮上的哀號。"],["p","就是：哎呀，可憐哪。"],["p","先知還沒有說他們做了什麼，"],["p","就先替他們哭了。"],["p","弟兄姊妹，你看見了嗎？"],["p","神對安逸的人，第一個反應，"],["p","不是發怒，是哀哭。"],["p","為什麼哀哭？"],["p","因為他們被人歸向，被人倚靠，"],["p","自己卻以為，什麼事都碰不到自己。"],["p","一個站在高位的人，"],["p","若覺得災禍永遠在別人家，"],["p","那是一件很危險的事。"],["p","請注意，經文沒有說，安穩是罪。"],["p","問題是，他們的安穩，靠的是什麼？"],["p","靠的是山。"],["p","錫安的山，撒馬利亞的山。"],["p","靠的是位置，靠的是名聲。"],["p","沒有一句話，是靠耶和華。"],["q","你們要過到甲尼察看，從那裡往大城哈馬去，又下到非利士人的迦特，看那些國比你們的國還強嗎？境界比你們的境界還寬嗎？（摩6:2）"],["p","先知叫他們走一趟。"],["p","去看看別人。"],["p","別人也有大城，也有大境界，"],["p","也有過好日子。"],["p","你以為自己特別嗎？"],["p","被神揀選，是恩典。"],["p","不是免死金牌。"],["p","接著，第三節。"],["q","你們以為降禍的日子還遠，坐在位上盡行強暴。（摩6:3）"],["p","這一節，有兩個動作。"],["p","一雙手，把災禍推得遠遠的。"],["p","同一雙手，把強暴的座位，拉得近近的。"],["p","和合本的註腳說，"],["p","行強暴，使審判臨近。"],["p","你看，他們一面推開，一面拉近。"],["p","這不是很諷刺嗎？"],["p","在這裡，我們要先安慰一種人。"],["p","若你是被人壓過的人，"],["p","請你先聽見：神說有禍了的，"],["p","不是你，是那個坐在位上的人。"],["p","神站在你這一邊，祂在哀哭。"],["p","若你是坐在位子上的人，"],["p","今天，請你安靜問一句："],["p","我坐的位子，我怎樣用它？"],["p","這一個問題，不用答給別人聽。"],["p","答給神聽就好。"],["p","第二個要點：不為約瑟的苦難擔憂。"],["q","你們躺臥在象牙床上，舒身在榻上，吃群中的羊羔，棚裡的牛犢；（摩6:4）"],["p","你看這個畫面。"],["p","床是象牙的。"],["p","肉是最嫩的。"],["p","人，整個攤開在那裡。"],["q","彈琴鼓瑟唱消閑的歌曲，為自己製造樂器，如同大衛所造的；（摩6:5）"],["p","連音樂，也是為自己。"],["p","大衛用琴，是向神唱。"],["p","也是安慰別人的心。"],["p","這裡的琴，只是消閑。"],["p","你注意到嗎？"],["p","這一段，沒有一件事，是罪名。"],["p","吃羊羔，不是罪。"],["p","彈琴，不是罪。"],["p","躺在床上，也不是罪。"],["p","阿摩司沒有叫人去睡硬板床。"],["p","真正的問題，在下一節。"],["q","以大碗喝酒，用上等的油抹身，卻不為約瑟的苦難擔憂。（摩6:6）"],["p","那個「卻」字。"],["p","「卻」字以前，全是自己。"],["p","酒，油，床，歌。"],["p","「卻」字以後，才出現別人。"],["p","約瑟，就是北國的百姓。"],["p","他們的苦難，原文是「破碎」，"],["p","像一根骨頭，斷了。"],["p","那邊斷了，痛得要命。"],["p","這邊，一點感覺也沒有。"],["p","弟兄姊妹，這才是最危險的。"],["p","身體裡，最可怕的不是痛，"],["p","是不覺得痛。"],["p","保羅說，一個肢體受苦，"],["p","所有的肢體，就一同受苦。"],["p","我們也要問自己："],["p","最近一次，為別人的痛，真的難過，"],["p","是什麼時候？"],["p","若已經很久了，不用先自責。"],["p","先對神說：求祢醫治我的心。"],["p","讓我，再有感覺。"],["q","所以這些人必在被擄的人中首先被擄；舒身的人荒宴之樂必消滅了。（摩6:7）"],["p","你看，這裡有一個文字的遊戲。"],["p","一節，列國之首。"],["p","六節，上等的油，也是「首」這個字。"],["p","七節，首先被擄，還是這個字。"],["p","他們一生追求第一，"],["p","最好的酒，最好的油，最前面的位子。"],["p","結果，連被擄，也排第一。"],["p","這不是神在開玩笑。"],["p","這是一首很安靜的哀歌。"],["p","他們所抓住的第一，"],["p","沒有一樣，能保住他們。"],["p","第三個要點：公平變為苦膽。"],["q","主耶和華－萬軍之神指著自己起誓說：我憎惡雅各的榮華，厭棄他的宮殿；因此，我必將城和其中所有的都交付敵人。（摩6:8）"],["p","八節，是這一章的轉彎。"],["p","先聽這個起誓。"],["p","人起誓，要指著比自己更大的。"],["p","神沒有更大的，所以指著自己。"],["p","祂等於說：這句話，我自己擔保。"],["p","這卷書裡，「耶和華說」這個記號，"],["p","在這裡，來到最重的地方。"],["p","神連起誓，都親自出面。"],["p","再聽這個字：憎惡。"],["p","神憎惡的，是什麼？"],["p","是雅各的榮華，是宮殿。"],["p","不是人。"],["p","是人心裡，那座不肯讓神碰的城。"],["p","神可以愛一個人，"],["p","卻憎惡他所倚靠的東西。"],["p","這一點，很要緊。"],["p","神不是要毀掉你，"],["p","祂是要拆掉，那座擋在你與祂之間的牆。"],["q","那時，若在一房之內剩下十個人，也都必死。（摩6:9）"],["p","九到十節，是最暗的一段。"],["p","我不想講得太快。"],["p","一座大房子，只剩幾個人。"],["p","後來有親人進去，輕輕問一句："],["p","這裡，還有人嗎？"],["p","回答是：沒有。"],["p","然後，聲音壓得很低："],["p","不要作聲。"],["p","我們不可提耶和華的名。"],["p","為什麼不提？"],["p","經文沒有說。"],["p","也許是害怕。"],["p","也許是痛到說不出口。"],["p","也許，連禱告的力氣都沒有了。"],["p","先知沒有給答案。"],["p","他留給我們，一個沉默。"],["p","弟兄姊妹，這一段，不是用來嚇人的。"],["p","我們不用它，解釋任何災難，"],["p","也不對失去親人的人，說：這是審判。"],["p","若你現在正在喪慟中，"],["p","請你知道，我們會陪你，"],["p","一起守住神的名。"],["p","這一段，只是在提醒我們："],["p","趁著還能開口的時候，"],["p","趁著還能提耶和華名字的時候，"],["p","開口。"],["q","看哪，耶和華出令，大房就被攻破，小屋就被打裂。（摩6:11）"],["p","大房，小屋，都在祂的命令下。"],["p","沒有一個地方，是祂看不見的。"],["p","這是嚴肅的。"],["p","也是公平的。"],["q","馬豈能在崖石上奔跑？人豈能在那裡用牛耕種呢？你們卻使公平變為苦膽，使公義的果子變為茵蔯。（摩6:12）"],["p","十二節，先問兩個問題。"],["p","馬，能在崖石上跑嗎？"],["p","不能。"],["p","牛，能在石頭上耕田嗎？"],["p","不能。"],["p","這誰都知道。"],["p","然後，一個「卻」字。"],["p","你們卻把公平，變成毒草。"],["p","把公義的果子，變成苦艾。"],["p","這比在崖石上耕田，還荒謬。"],["p","公平，公義。"],["p","這是整卷書，最重要的一對字。"],["p","五章，神說，要像大水滾滾，像江河滔滔。"],["p","那是神的盼望。"],["p","六章，是人的回答。"],["p","把它，翻過來。"],["p","你看這個動詞：翻過來。"],["p","我們很少是有心的。"],["p","更多的時候，是什麼都不做，"],["p","公平，就自己變苦了。"],["p","安逸，就是這個過程的名字。"],["p","可是，我要特別說一句。"],["p","神要的公義，不是一場運動。"],["p","它是從認識神，長出來的果子。"],["p","認識祂，才有甜果。"],["p","沒有認識祂，再努力，也會變成另一種自誇。"],["q","你們喜愛虛浮的事，自誇說：我們不是憑自己的力量取了角嗎？（摩6:13）"],["p","他們的自誇，很簡單："],["p","我們有力量。"],["p","我們得到了。"],["p","可是，原文說，他們喜愛的，是「沒有什麼的東西」。"],["p","最大的自誇，常常來自最小的成績。"],["p","你最近，在誇什麼？"],["p","那是你憑自己得到的嗎？"],["q","耶和華、萬軍之神說：以色列家啊，我必興起一國攻擊你們；他們必欺壓你們，從哈馬口直到亞拉巴的河。（摩6:14）"],["p","十四節，又是「耶和華說」。"],["p","全章開始，是哀號。"],["p","全章結束，是宣告。"],["p","那條界線，從哈馬口，到亞拉巴的河，"],["p","是他們最得意的疆界。"],["p","結果，那個疆界，成了壓迫的範圍。"],["p","他們所靠的，成了他們所受的。"],["p","神沒有說，那是哪一個國。"],["p","我們也不替經文補上。"],["p","我們只看見：神自己，是主。"],["p","那麼，我們怎麼辦？"],["p","讓我們看一個人。"],["p","耶穌，不是躺在象牙床上的人。"],["p","祂說，人子連枕頭的地方都沒有。"],["p","祂是主，卻成了貧窮，"],["p","叫我們因祂的貧窮，成為富足。"],["p","祂快到耶路撒冷，看見城，"],["p","就為它哀哭。"],["p","拉撒路死了，祂也哭了。"],["p","祂看見許多人，困苦流離，"],["p","就憐憫他們。"],["p","你看，這位王，心是醒著的。"],["p","約瑟的苦難，祂擔憂。"],["p","而且祂不只擔憂，祂來了，"],["p","為我們的破碎，付上自己。"],["p","今天，若你發現，自己的心有一點麻木，"],["p","不要怕，不要藏。"],["p","把這顆心，帶到祂面前。"],["p","祂能使人，再有感覺。"],["p","所以，這個星期，請你做三件小事。"],["p","第一，今天晚上，對神說："],["p","主，我最近，有哪裡睡著了？"],["p","第二，找一個正在痛的人，"],["p","打一通電話，或傳一句話："],["p","我想到你，你還好嗎？"],["p","不給建議，只是聽。"],["p","第三，找一個你坐著的位子，"],["p","問自己：這個位子，我有沒有用它，保護人？"],["p","弟兄姊妹，神不要我們沒有快樂。"],["p","祂要我們的快樂，是醒著的快樂。"],["p","是一邊享受，一邊還能為別人流淚的快樂。"],["p","最後，我們一起禱告。"],["p","親愛的天父，謝謝祢，在我們安逸的時候，先為我們哀哭。"],["p","求祢憐憫我們，讓我們的心，不要睡著。"],["p","求祢醫治我們的麻木，讓我們再有感覺。"],["p","求祢使我們，不靠自己的山，單單靠祢。"],["p","求祢使公平如大水滾滾，使公義如江河滔滔。"],["p","讓耶穌作王掌權。"],["p","讓耶穌得到一切的榮耀。"],["p","奉主耶穌基督的名禱告，阿們。"]]},"7":{"min":15,"blocks":[["h","《求你赦免，準繩，耶和華選召我》"],["p","弟兄姊妹平安。"],["p","今天我們讀阿摩司書第七章。"],["p","先說一個畫面。"],["p","一位老師傅，在翻修一間老房子。"],["p","他站在剛砌好的牆前面。"],["p","從口袋裡，拿出一條線，下面綁著一小塊鉛。"],["p","他把線舉高，讓鉛塊自己垂下來。"],["p","鉛塊不會騙人。"],["p","它只會往一個方向走，就是地心。"],["p","師傅把線，貼近牆面。"],["p","看一看，牆和線之間，有沒有縫。"],["p","年輕的工人站在旁邊，心裡有點緊張。"],["p","因為這面牆，是他砌的。"],["p","他昨天，用眼睛看過，覺得很直。"],["p","可是，今天，師傅用的，是那條線。"],["p","那條線，不管你覺得怎樣。"],["p","這一章，神拿出來的，就是這樣一條線。"],["p","在拿出那條線之前，有兩次，阿摩司先開口。"],["p","我們從那兩次禱告說起。"],["h","一、求你赦免（7:1--6）"],["q","主耶和華指示我一件事：為王割菜之後，菜又發生；剛發生的時候，主造蝗蟲。（摩7:1）"],["p","這一章，換了一個方式說話。"],["p","前面，是神藉著先知，說出來的話。"],["p","這裡，是先知自己，看見的畫面。"],["p","而且，是主指給他看的。"],["p","第一個畫面，是蝗蟲。"],["p","時間，很準。"],["p","為王割菜之後。"],["p","一般的理解是，頭一茬，是王先收走的。"],["p","剩下來，剛剛長出來的新綠，才是百姓的。"],["p","蝗蟲，偏偏，在這個時候來。"],["p","打中的，是尋常人家，最後的一點指望。"],["p","災難，最會找軟的地方下手。"],["p","所以，我們讀這一節，心裡要先慢下來。"],["p","因為，這裡面有人，快沒有飯吃了。"],["q","蝗蟲吃盡那地的青物，我就說：「主耶和華啊，求你赦免；因為雅各微弱，他怎能站立得住呢？」（摩7:2）"],["p","蝗蟲吃盡的時候，阿摩司開口了。"],["p","請你注意，他說了什麼。"],["p","他沒有說，我們沒有錯。"],["p","他沒有說，為什麼是我們。"],["p","前面六章，他才把以色列的罪，一條一條說完。"],["p","他知道，這群人，該承受什麼。"],["p","可是，他還是站在他們這一邊。"],["p","求你赦免。"],["p","先知，是替神說話的人。"],["p","也是，替百姓，向神說話的人。"],["p","這兩個身分，在他身上，沒有衝突。"],["p","再看他的理由。"],["p","雅各微弱。"],["p","他沒有說，雅各有功勞。"],["p","他沒有說，雅各很努力。"],["p","他只說，雅各小。"],["p","小到，站不住。"],["p","你有沒有發現，這就是禱告最好的姿勢。"],["p","不是把自己，說得夠好。"],["p","而是把自己，說得很小。"],["q","耶和華就後悔說：「這災可以免了。」（摩7:3）"],["p","神聽見了。"],["p","一個牧人，說了一句短短的話。"],["p","災，就免了。"],["p","我們要小心。"],["p","這節經文，不是在立一條規則。"],["p","不是說，只要你禱告得夠大聲，災就一定停。"],["p","整卷阿摩司書，也有災臨到，百姓卻沒有回頭。"],["p","這裡，是在記下這一次。"],["p","讓我們看見，神是一位，聽得見小人禱告的神。"],["p","這個後悔，我們也不用急著解釋。"],["p","神怎樣後悔，是祂的事。"],["p","我們只讀到，祂聽見，祂回應。"],["q","主耶和華又指示我一件事：他命火來懲罰以色列，火就吞滅深淵，險些將地燒滅。（摩7:4）"],["p","第二個畫面，是火。"],["p","這一次，更大了。"],["p","火，吞滅了深淵。"],["p","連大水，都被吃掉。"],["p","接下來要吃的，是每一家，分得的那一份。"],["p","原文說，神召火來，是為了跟百姓辯理。"],["p","神沒有躲在背後。"],["p","祂把案子，擺出來。"],["p","可是，你看，神的審判，不是一下子下來的。"],["p","先是蝗蟲，再是火。"],["p","一步一步。"],["p","每一步，都留了空間。"],["q","我就說：「主耶和華啊，求你止息；因為雅各微弱，他怎能站立得住呢？」（摩7:5）"],["p","阿摩司再說一次。"],["p","理由，一個字，沒有換。"],["p","雅各微弱。"],["p","我們常常以為，事情越大，禱告就要越有力。"],["p","要有新的論點，要有更漂亮的說法。"],["p","可是，阿摩司在最大的火面前，還是那一句。"],["p","求你，我們實在，太小了。"],["q","耶和華就後悔說：「這災也可免了。」（摩7:6）"],["p","又一次，神聽見了。"],["p","這個「也」字，我很喜歡。"],["p","第一次，免了。"],["p","第二次，也免了。"],["p","你可以想一想，這位牧人。"],["p","他不是祭司，不是王。"],["p","他不在聖殿裡。"],["p","他是一個，修理桑樹的人。"],["p","可是，神回應他。"],["p","今天，你有沒有，為一個人禱告很久了？"],["p","為一個遲遲沒有回家的孩子。"],["p","為一位，還沒有信主的親人。"],["p","為一個，破碎的家。"],["p","你不需要，把禱告說得很漂亮。"],["p","你只要說，主啊，他實在太小了，我也是。"],["p","這樣的禱告，神聽。"],["p","而且，我們有一位，更大的代求者。"],["p","耶穌基督，現今在神的右邊，也替我們祈求。"],["p","這是羅馬書八章34節說的。"],["p","你的禱告，不是一個人在扛。"],["h","二、準繩（7:7--9）"],["q","他又指示我一件事：有一道牆是按準繩建築的，主手拿準繩站在其上。（摩7:7）"],["p","第三個畫面，沒有災。"],["p","沒有蝗蟲，沒有火。"],["p","只有一道牆。"],["p","和一位，站在牆上的主。"],["p","牆，是按準繩建的。"],["p","一般的理解是，牆，代表以色列。"],["p","是神所建立的百姓。"],["p","本來，是照著標準，直直立起來的。"],["p","現在，主自己，站在牆上。"],["p","手裡，拿著準繩。"],["p","這個畫面，很安靜。"],["p","可是，一點也不輕鬆。"],["p","前面兩次，是災在逼近。"],["p","這一次，是神，親自在量。"],["p","牆歪不歪，不是用我們的眼睛看的。"],["p","不是用我們的感覺，也不是用多數人的意見。"],["p","是神手上，那一條線。"],["q","耶和華對我說：「阿摩司啊，你看見甚麼？」我說：「看見準繩。」主說：「我要吊起準繩在我民以色列中，我必不再寬恕他們。（摩7:8）"],["p","神問，你看見什麼。"],["p","阿摩司答，準繩。"],["p","神就說，我必不再寬恕他們。"],["p","請你注意兩個字。"],["p","我民。"],["p","神說的，是我民。"],["p","祂不是在丟掉他們。"],["p","祂是在量，自己的百姓。"],["p","最嚴肅的審判，是從最近的關係裡出來的。"],["p","再看「不再寬恕」。"],["p","原文的意思是，我不再，繼續越過他。"],["p","前面，蝗蟲、火，神越過去了。"],["p","就是放過了。"],["p","現在，祂說，到這裡為止。"],["p","阿摩司的禱告，是真的。"],["p","神的耐心，也是真的。"],["p","可是，耐心，有它的界線。"],["p","這個界線，是神定的。"],["p","不是我們的禱告，撐出來的。"],["q","以撒的邱壇必然淒涼；以色列的聖所必然荒廢。我必興起，用刀攻擊耶羅波安的家。」（摩7:9）"],["p","這一次，說得很具體。"],["p","被點名的，是邱壇，是聖所。"],["p","是敬拜的地方。"],["p","還有，王的家。"],["p","宗教，和政治，一起被量。"],["p","你可以留意一件事。"],["p","這一段，阿摩司沒有說話。"],["p","前兩次，他說：求你。"],["p","這一次，經文只記他說：看見準繩。"],["p","我們不能因此說，禱告被禁止了。"],["p","經文沒有這樣說。"],["p","我們只能說，這一次，沒有記下代求。"],["p","那麼，這一條線，對今天的我們，是什麼？"],["p","第一，標準，在神手上，不在我們手上。"],["p","我們很習慣，用自己的尺，量自己。"],["p","我今天，比昨天好一點。"],["p","我比某某人，好得多。"],["p","可是，神的準繩，不是拿來比較的。"],["p","它只是，垂直地，掛在那裡。"],["p","第二，量我們的，是一位，愛我們的主。"],["p","祂手拿準繩，也站在牆上。"],["p","祂沒有離開。"],["p","第三，不要用這一段，去嚇人。"],["p","也不要用它，推算任何時間。"],["p","這一段，不是要我們害怕。"],["p","是要我們，今天就回到那條線旁邊。"],["p","今天，就悔改。"],["p","今天，就轉回。"],["h","三、耶和華選召我（7:10--17）"],["q","伯特利的祭司亞瑪謝打發人到以色列王耶羅波安那裡，說：「阿摩司在以色列家中圖謀背叛你；他所說的一切話，這國擔當不起；（摩7:10）"],["p","畫面，一下子，換了。"],["p","異象停了。"],["p","出現一個人。"],["p","他叫亞瑪謝。"],["p","伯特利的祭司。"],["p","他不是壞人的樣子。"],["p","他有職位，有制服，有聖所。"],["p","他看見阿摩司在說話，就馬上，打發人去通報王。"],["p","你聽他的報告。"],["p","阿摩司，圖謀背叛。"],["p","這國，擔當不起他的話。"],["p","這是一個政治罪名。"],["p","一個國家，裝不下一個人。"],["p","可是，阿摩司，有拿起武器嗎？"],["p","有結黨嗎？"],["p","沒有。"],["p","他只是，把他看見的，說了出來。"],["q","因為阿摩司如此說：『耶羅波安必被刀殺；以色列民定被擄去離開本地。』」（摩7:11）"],["p","請你留意，這一句。"],["p","阿摩司如此說。"],["p","不是，耶和華如此說。"],["p","阿摩司在第九節，說的是神的話。"],["p","我必興起，用刀攻擊耶羅波安的家。"],["p","主詞，是神。"],["p","到了亞瑪謝的報告裡，主詞，換成了阿摩司。"],["p","神的話，被收成一個人的意見。"],["p","一個，可以被處理的，政治問題。"],["p","這是一個，很安靜的改動。"],["p","可是，整個衝突，就在這裡。"],["p","聖所裡的人，最容易做的事，不是反對神。"],["p","而是，把神的話，變小。"],["q","亞瑪謝又對阿摩司說：「你這先見哪，要逃往猶大地去，在那裡糊口，在那裡說預言，（摩7:12）"],["p","接著，他轉身，對阿摩司說話。"],["p","聽起來，像好意。"],["p","回你的老家去。"],["p","在那裡，吃飯，也在那裡，說預言。"],["p","可是，仔細聽。"],["p","他是在說，你是靠這個糊口的人。"],["p","他還把阿摩司的聲音，劃了一個範圍。"],["p","南邊，隨你說。"],["p","北邊，不要。"],["q","卻不要在伯特利再說預言；因為這裡有王的聖所，有王的宮殿。」（摩7:13）"],["p","這才是，真話。"],["p","這裡，有王的聖所。"],["p","他說的，是王的聖所。"],["p","不是耶和華的聖所。"],["p","聖所的主人，已經換了。"],["p","連在這裡，說什麼話，都要王來定。"],["p","還有一個呼應。"],["p","第八節，神說，我不再，繼續越過他們。"],["p","第十三節，亞瑪謝說，你不要再，繼續說預言。"],["p","同樣一組字。"],["p","神說，不再。"],["p","是因為百姓的罪滿了。"],["p","亞瑪謝說，不再。"],["p","是因為他，不想聽。"],["p","我們不替亞瑪謝，貼標籤。"],["p","他也是一個人。"],["p","他有他的位置，要保。"],["p","我們只是，要老實地問自己。"],["p","當我們的聖所，變成為某個人、某個體系服務的時候。"],["p","神的話，會不會，也變成了威脅？"],["p","這個問題，不是問別人。"],["p","是問我。"],["q","阿摩司對亞瑪謝說：「我原不是先知，也不是先知的門徒。我是牧人，又是修理桑樹的。（摩7:14）"],["p","阿摩司，沒有發怒。"],["p","他先回答，那個指控。"],["p","你說我是靠這個糊口的。"],["p","不是。"],["p","我有自己的工作。"],["p","養牛，修剪桑樹。"],["p","我說預言，不是因為這是我的行業。"],["p","也不是，因為我出身在先知的圈子裡。"],["p","這句話，要小心讀。"],["p","它沒有說，先知的訓練，不好。"],["p","也沒有說，受過裝備的人，不屬神。"],["p","先知的門徒，也是神的百姓。"],["p","神，也使用他們。"],["p","我們也不能反過來說，沒有受過裝備，就更屬靈。"],["p","召命，在神，不在背景。"],["p","你有學位，不是你的本錢。"],["p","你沒有學位，也不是你的資格。"],["q","耶和華選召我，使我不跟從羊群，對我說：『你去向我民以色列說預言。』（摩7:15）"],["p","這才是，他的答案。"],["p","耶和華選召我。"],["p","你看這三個動作。"],["p","神取了我。"],["p","神使我離開羊群。"],["p","神對我說，去。"],["p","每一個動詞，主詞都是耶和華。"],["p","他沒有說，我決定。"],["p","他沒有說，我有恩賜。"],["p","他說的是，祂取了我，祂差我。"],["p","再看一個細節。"],["p","亞瑪謝說，去，逃往猶大。"],["p","神說，去，向我民說預言。"],["p","兩個去。"],["p","方向，完全相反。"],["p","阿摩司，站在兩個去的中間。"],["p","經文沒有記，他有多勇敢。"],["p","只記著，他是被差去的。"],["p","真正使他站得住的，不是膽量。"],["p","是差遣。"],["p","召命的重點，是誰叫的。"],["p","不是誰被叫。"],["p","這樣，我們就不會，把阿摩司抬得太高。"],["p","也不會，因為自己沒有背景，就以為沒有分。"],["q","亞瑪謝啊，現在你要聽耶和華的話。你說：『不要向以色列說預言，也不要向以撒家滴下預言。』（摩7:16）"],["p","然後，他轉身，對亞瑪謝說。"],["p","現在，你要聽。"],["p","聽。"],["p","這是整卷書，一再出現的那個字。"],["p","在這裡，是對一位祭司說的。"],["p","連祭司，也要聽。"],["p","站在守門位置上的人，要先聽。"],["p","你看他怎麼做。"],["p","他沒有罵人。"],["p","他只是，把亞瑪謝說的話，原樣，放回他面前。"],["p","你說，不要說預言。"],["p","所以，耶和華如此說。"],["q","所以耶和華如此說：『你的妻子必在城中作妓女；你的兒女必倒在刀下。你的地必有人用繩子量了分取；你自己必死在污穢之地。以色列民定被擄去離開本地。』」（摩7:17）"],["p","這一節，很重。"],["p","我們不能，輕輕帶過。"],["p","也不能，講得好像神喜歡。"],["p","我要說幾件事。"],["p","第一，這是對亞瑪謝，說的審判話。"],["p","不是對所有，受苦的妻子和兒女說的。"],["p","經文沒有說，她們有罪。"],["p","也沒有說，今天，在戰亂裡，在暴力裡，受傷的人，是因為自己的罪。"],["p","戰爭來的時候，最先受傷的，往往是最沒有權力的人。"],["p","所以，今天，如果你就是那個，受過傷的人。"],["p","請你，先聽這句話。"],["p","不是你的錯。"],["p","神，沒有把你，放在審判的那一邊。"],["p","我們先陪伴受傷的人。"],["p","不先，去論斷任何人。"],["p","第二，這一段，不是時間表。"],["p","我們不算它，是哪一年。"],["p","也不把它，套在今天，任何國家、任何人身上。"],["p","第三，看最後一句。"],["p","以色列民定被擄去離開本地。"],["p","和第十一節，亞瑪謝報告的，一個字，都沒有改。"],["p","他向王轉述的，就是神最後說的。"],["p","神的話，不會因為被收進一個人的口袋，就不算數。"],["p","好，我們把這一章，放在一起。"],["p","第一個畫面，蝗蟲。"],["p","神，聽見了一個小人的禱告。"],["p","第二個畫面，火。"],["p","神，又聽見了。"],["p","第三個畫面，準繩。"],["p","神的耐心，有界線。"],["p","第四個畫面，亞瑪謝。"],["p","神的話，不能被收進一個人的口袋。"],["p","第五個畫面，阿摩司。"],["p","一個被差遣的人，站得住。"],["p","這一章，我們要怎麼回應？"],["p","第一，繼續為人禱告。"],["p","用你原來的樣子，說，主啊，我們很小。"],["p","第二，每天，回到那一條線旁邊。"],["p","不要比較，不要找藉口。"],["p","對神說，主啊，我哪裡，歪了？"],["p","第三，聽神的話，不要把它收小。"],["p","尤其，當它不合我意的時候。"],["p","第四，如果你覺得自己，不夠格。"],["p","記得，是祂取了你。"],["p","這裡，我們也看見耶穌。"],["p","耶穌，是那一位，真正站在牆上的主。"],["p","祂手裡拿著準繩。"],["p","可是，祂也是，那位，為我們代求的主。"],["p","在客西馬尼園，祂禱告說，不要照我的意思，只要照你的意思。"],["p","祂把我們的小，擔在自己身上。"],["p","祂是我們的榜樣，也是我們的代求者。"],["p","這裡，我們也看見321的信息。"],["p","有己的生命，在準繩面前，找藉口。"],["p","說，別人比我更歪。"],["p","或者，把神的話，收進自己的口袋。"],["p","這是驕傲，離開本位，想要代替神。"],["p","無己的生命，是回到本位。"],["p","讓神作神，讓人作人。"],["p","承認自己微弱。"],["p","把標準，交回神的手上。"],["p","這是讓耶穌作王。"],["p","當耶穌在我裡面作王，我就能在準繩面前，仍然不逃，也仍然站得住。"],["p","弟兄姊妹，我們這個團契，也要學這件事。"],["p","一個屬神的體系，是一群，願意為人代求的人。"],["p","也是一群，願意聽神的話，不把它收小的人。"],["p","大家的焦點，在耶穌，不在自己，不在別人，不在環境。"],["p","最後，我們一起來禱告。"],["p","親愛的天父，謝謝祢，聽見微弱的人的禱告。"],["p","求祢憐憫我們，常常用自己的尺，量自己。"],["p","求祢幫助我們，回到祢手中的準繩旁邊。"],["p","求祢保守每一位，被差遣、站在艱難位置上的僕人。"],["p","也求祢安慰，每一位，受過傷的人，讓他們知道，祢在他們這一邊。"],["p","讓耶穌作王掌權。"],["p","讓耶穌得到一切的榮耀。"],["p","奉主耶穌基督的名禱告，阿們。"]]},"8":{"min":11,"blocks":[["h","《一筐夏天的果子》"],["p","弟兄姊妹平安。"],["p","夏天的早市，有一個水果攤。"],["p","一籃桃子，熟得發亮。"],["p","老闆一邊吆喝，一邊說：今天賣不完，明天就爛了。"],["p","你有沒有發現，熟透的東西，最甜，也最等不得。"],["p","今天，神給阿摩司看的，就是這樣一筐果子。"],["p","我們來讀阿摩司書第八章。"],["p","這一章，有三個要點。"],["p","第一，結局到了。"],["p","第二，詭詐的天平。"],["p","第三，聽道的饑荒。"],["h","一、結局到了"],["q","主耶和華又指示我一件事：我看見一筐夏天的果子。（摩8:1）"],["p","請留意，這是「又」。"],["p","阿摩司已經看過蝗災，看過火，看過準繩。"],["p","現在是第四個異象。"],["p","這一次，不是可怕的東西。"],["p","是一筐水果。"],["p","看起來，一點也不嚇人。"],["p","神的問法，也很溫柔。"],["q","他說：「阿摩司啊，你看見甚麼？」我說：「看見一筐夏天的果子。」耶和華說：「我民以色列的結局到了，我必不再寬恕他們。」（摩8:2）"],["p","神先問，阿摩司先答。"],["p","神沒有直接宣判，神先把一個僕人，帶到祂的心意旁邊。"],["p","我看見一筐果子。"],["p","神說：這是結局。"],["p","在希伯來文裡，夏天的果子，和結局，兩個字，聽起來幾乎一樣。"],["p","阿摩司看見的是熟果，聽見的是終結。"],["p","熟了，不是好消息。"],["p","熟了，是時候到了。"],["p","那時候的以色列，日子過得不錯。"],["p","國土大，生意旺，節期熱鬧。"],["p","就像那籃桃子，亮晶晶的。"],["p","可是神說：到了。"],["p","請你再看一次。"],["p","神說的是，我民。"],["p","不是那些人，是我民。"],["p","連宣告結局的時候，祂仍然稱他們，是我的百姓。"],["p","審判，是從一位還在說「我民」的神口中，說出來的。"],["p","必不再寬恕。"],["p","原文的意思，是不再繼續，從旁邊走過去。"],["p","神一直從他們旁邊走過，放過，等待。"],["p","現在，祂說，不再這樣走過去了。"],["p","我們不算這是第幾次。"],["p","也不推算什麼日子。"],["p","我們只讀出一件事。"],["p","神的耐心，是真的。"],["p","而且，是有分量的。"],["q","主耶和華說：「那日，殿中的詩歌變為哀號；必有許多屍首在各處拋棄，無人作聲。」（摩8:3）"],["p","詩歌，變成哀號。"],["p","本來唱歌的地方，只剩哭聲。"],["p","再往後，連哭聲都沒有了。"],["p","只剩一個字：噓。"],["p","這是整章最安靜的一幕。"],["p","這不是說，唱詩是壞事。"],["p","也不是說，神討厭敬拜。"],["p","是說，有一天，連歌聲，都被悲哀吞沒了。"],["p","那麼，我們要問。"],["p","是什麼，先把歌聲弄壞的？"],["p","答案，在下一段。"],["h","二、詭詐的天平"],["q","你們這些要吞吃窮乏人、使困苦人衰敗的，當聽我的話！（摩8:4）"],["p","當聽我的話。"],["p","這是這一章，第一次出現「聽」。"],["p","請你注意，這句話，是對誰說的？"],["p","不是對窮人說的。"],["p","是對那些吞吃窮乏人的人說的。"],["p","在宣告結局之後，神還是說：你們要聽。"],["p","這表示，這不是最後一道門。"],["p","這是還能回頭的一道門。"],["q","你們說：月朔幾時過去，我們好賣糧；安息日幾時過去，我們好擺開麥子；賣出用小升斗，收銀用大戥子，用詭詐的天平欺哄人，（摩8:5）"],["p","你看這些人。"],["p","他們守月朔，守安息日。"],["p","他們沒有不敬拜。"],["p","只是，一邊守，一邊看時間。"],["p","幾時過去？"],["p","身體坐在安息裡，心已經回到了糧倉。"],["p","神責備的，不是他們有敬拜。"],["p","也不是他們做生意。"],["p","是敬拜與安息，變成了生意的紅燈，而不是生命的泉源。"],["p","再看他們的手法。"],["p","賣出去的量器，做小。"],["p","收進來的砝碼，做重。"],["p","天平，再動一點手腳。"],["p","每一步，都很小。"],["p","每一步，都不容易被抓到。"],["p","這不是一個大壞人的故事。"],["p","這是一群很會做生意的人，在一次又一次的小動作裡，把人吃掉了。"],["p","想一想那個畫面。"],["p","一位老人家，拿著剛好夠買半斤米的錢。"],["p","秤子往下一壓，少了一兩。"],["p","她不知道，也沒有人告訴她。"],["p","她回到家，煮出來的飯，比昨天少了一點點。"],["p","這一點點，就是神說，我不忘的那一點點。"],["q","好用銀子買貧寒人，用一雙鞋換窮乏人，將壞了的麥子賣給人。（摩8:6）"],["p","一雙鞋。"],["p","一個人的價錢，是一雙鞋。"],["p","還要把麥子的下腳，當成麥子賣給他。"],["p","他們賣的是渣滓，買的是人。"],["p","請你看，神怎麼稱呼這些人。"],["p","窮乏人，困苦人，貧寒人。"],["p","每一個稱呼，後面都是一個有名字的人。"],["p","神在這裡，是在替被當成價錢的人，開口。"],["p","我們要把這件事放好。"],["p","有錢，不是罪。"],["p","做生意，不是罪。"],["p","神問的是，量器公不公平，價錢有沒有把人當人。"],["p","而且，我們先看見受傷的人。"],["p","然後，才叫欺壓人的人，來到神面前，聽。"],["q","耶和華指著雅各的榮耀起誓說：他們的一切行為，我必永遠不忘。（摩8:7）"],["p","神起誓。"],["p","起誓，是最重的承諾。"],["p","承諾什麼？"],["p","我不忘。"],["p","這一句，對欺壓人的人，是警告。"],["p","可是，對被欺壓的人，是安慰。"],["p","那一雙鞋。"],["p","那些下腳的麥子。"],["p","那些沒有人記得的欠條。"],["p","在神面前，沒有一筆，被漏掉。"],["p","人會忘，帳本會被改，證人會離開。"],["p","神說，我不忘。"],["p","受傷的人，你可以放心。"],["p","有一位，一直記得。"],["q","地豈不因這事震動？其上的居民不也悲哀嗎？地必全然像尼羅河漲起，如同埃及河湧上落下。（摩8:8）"],["p","這樣的事，不是小事。"],["p","累積起來，地都會震動。"],["p","神不是在遠處記帳。"],["p","祂是在這片地上，與被壓傷的人，一起悲哀。"],["q","主耶和華說：到那日，我必使日頭在午間落下，使地在白晝黑暗。（摩8:9）"],["p","正午，是一天最亮的時候。"],["p","最亮的時候，天黑了。"],["p","他們以為最安穩的時候，其實是最需要醒來的時候。"],["q","我必使你們的節期變為悲哀，歌曲變為哀歌。眾人腰束麻布，頭上光禿，使這場悲哀如喪獨生子，至終如痛苦的日子一樣。（摩8:10）"],["p","節期，變成悲哀。"],["p","歌曲，變成哀歌。"],["p","最後，神用了一個很重的比喻。"],["p","如喪獨生子。"],["p","那是人間最痛的哀傷之一。"],["p","神用這樣的話，不是要嚇人。"],["p","是要人知道，他們快要失去的，是多大的事。"],["p","而且，祂用人間最痛的哀傷，來形容這一天，因為祂自己，不輕看這份痛。"],["p","這裡，要牧養地說一句。"],["p","這個比喻，從來不是拿來對一位真正失去孩子的父母說的。"],["p","真正在哭的人，先被陪伴。"],["h","三、聽道的饑荒"],["q","主耶和華說：日子將到，我必命饑荒降在地上。人飢餓非因無餅，乾渴非因無水，乃因不聽耶和華的話。（摩8:11）"],["p","這是這一章，最有名的一節。"],["p","先看是誰說的。"],["p","主耶和華說。"],["p","是神自己宣告。"],["p","再看是什麼樣的饑荒。"],["p","餅有。"],["p","水也有。"],["p","倉裡有糧，街上有賣。"],["p","可是，人的裡面空了。"],["p","你有沒有過這樣的時候？"],["p","吃飽了，還是覺得缺。"],["p","賺了錢，還是覺得空。"],["p","房子裝潢得很好，心裡卻很荒涼。"],["p","這是另一種飢餓。"],["p","你還記得，第四節嗎？"],["p","神對那些吞吃窮乏人的人說：當聽我的話。"],["p","他們沒有聽。"],["p","現在，第十一節說：聽的饑荒來了。"],["p","前面，是不肯聽。"],["p","後面，是聽不到。"],["p","這不是一個冷冰冰的懲罰公式。"],["p","這是一個很誠實的觀察。"],["p","人若一直不聽，終有一天，會發現自己連想聽，都聽不到了。"],["q","他們必飄流，從這海到那海，從北邊到東邊，往來奔跑，尋求耶和華的話，卻尋不著。（摩8:12）"],["p","你看這個畫面。"],["p","他們東奔西跑。"],["p","找一個先知，找一句話，找一個指引。"],["p","可是，找不到。"],["p","不是沒有人在尋求。"],["p","是尋求得太晚。"],["p","第五章，神曾說，你們要尋求我，就必存活。"],["p","那時候，他們沒有。"],["p","到了現在，才去找，就找不著。"],["p","這一節，我們要小心。"],["p","不要把它，講成對今天聽道的人的恐嚇。"],["p","這是對那個不聽的國度，說的話。"],["p","我們今天站的位置，不一樣。"],["p","神已經藉著祂的兒子，對我們說話了。"],["p","祂的話，開著，就在我們面前。"],["p","所以，這一節真正要說的，不是怕。"],["p","是趁神還在說話，聽。"],["q","當那日，美貌的處女和少年的男子必因乾渴發昏。（摩8:13）"],["p","你看，被點名的，是誰？"],["p","不是老弱。"],["p","是美貌的少女，是少年的男子。"],["p","是最有力氣的人。"],["p","連他們，都因渴昏過去。"],["p","青春，擋不住。"],["p","力氣，擋不住。"],["p","裡面對神的話的渴，沒有人能靠自己的力氣逃過。"],["q","那指著撒馬利亞牛犢起誓的說：但哪，我們指著你那裡的活神起誓；又說：我們指著別是巴的神道起誓。這些人都必仆倒，永不再起來。（摩8:14）"],["p","最後一節，講他們的起誓。"],["p","但，在北邊。"],["p","別是巴，在南邊。"],["p","整片地，從頭到尾，都有人起誓。"],["p","他們很虔誠，也很愛起誓。"],["p","只是，他們所指著的，偏了。"],["p","所以，十一節的饑荒，才會是聽不到耶和華的話。"],["p","因為他們一直在聽。"],["p","只是，聽的是別的聲音。"],["p","有聖所，有誓言，有節期。"],["p","缺的，是那一句，耶和華真正說的話。"],["p","這一句，是重話。"],["p","可是，我們要記得。"],["p","這是對那些指著偶像起誓的人說的。"],["p","而且，在這一章之後，還有第九章。"],["p","神的話，並沒有停在這裡。"],["p","這一章，我們一起來整理。"],["p","第一個畫面，一筐熟了的果子。"],["p","神說，結局到了，可是，祂仍然說，我民。"],["p","第二個畫面，一個詭詐的天平，一雙鞋的價錢。"],["p","神說，我不忘。"],["p","第三個畫面，一場沒有餅的饑荒。"],["p","神說，當聽我的話。"],["p","我們這一章，要怎麼回應？"],["p","第一，檢查自己的天平。"],["p","你手裡，有沒有一個量器，一個價錢，一個習慣？"],["p","在你賺錢、買賣、議價、發薪水的地方。"],["p","有沒有一個小動作，是別人看不見，只有神看得見的？"],["p","今天，把它說給神聽。"],["p","然後，改過來。"],["p","第二，看見被壓傷的人。"],["p","你身邊，有沒有一個人，在被少算，被忽略，被當成價錢？"],["p","可能是一個員工，一位鐘點工，一位外籍看護。"],["p","可能是家裡，那個總是吃虧的人。"],["p","今天，先用一句話，看見他。"],["p","對受傷的人說：神記得，我也記得。"],["p","第三，在安息日的時候，真正安息。"],["p","不是看時間。"],["p","不是一邊敬拜，一邊盤算。"],["p","是讓敬拜，把我的心，帶回到神面前。"],["p","第四，打開聖經，聽。"],["p","不是為了完成進度。"],["p","是為了在神的話裡，得飽足。"],["p","耶穌說過，人活著，不是單靠食物。"],["p","乃是靠神口裡所出的一切話。"],["p","耶穌也說，我就是生命的糧。"],["p","這裡，我們看見耶穌。"],["p","祂是神的話，成了肉身。"],["p","在阿摩司的時代，神的話被找不到。"],["p","在耶穌裡，神的話，就站在我們中間。"],["p","祂對窮人說話，祂為被壓傷的人，傳福音。"],["p","祂是我們的榜樣，也是我們的糧。"],["p","這裡，也看見321的信息。"],["p","有己的生命，用天平算計別人，也用時間算計神。"],["p","幾時過去，我好賣糧。"],["p","那是一顆緊緊抓住自己的心。"],["p","無己的生命，是放下算計。"],["p","讓神作神，也讓人作人。"],["p","把人，當成有名字的人。"],["p","把神的話，當成真正的糧。"],["p","這是讓耶穌作王。"],["p","當耶穌在我裡面作王，我的天平是公的，我的耳朵是開的。"],["p","弟兄姊妹，我們這個團契，也在學習這件事。"],["p","一個屬神的體系，是一群肯聽神的話，也肯看見受傷的人的人。"],["p","我們的焦點，不在生意，不在安息日什麼時候過去。"],["p","是在耶穌身上。"],["p","最後，我們一起來禱告。"],["p","親愛的天父，謝謝祢，在宣告結局的時候，仍然稱我們是祢的百姓。"],["p","謝謝祢，不忘記每一個被壓傷的人。"],["p","求祢憐憫我們，常常用小動作，把人當成價錢。"],["p","求祢叫我們的耳朵打開，在祢的話語裡，得飽足。"],["p","也求祢醫治每一位，今天正在哭的人。"],["p","讓耶穌作王掌權。"],["p","讓耶穌得到一切的榮耀。"],["p","奉主耶穌基督的名禱告，阿們。"]]},"9":{"min":14,"blocks":[["h","《倒塌的帳幕》"],["p","弟兄姊妹平安。"],["p","今天我們讀阿摩司書九章。"],["p","這是整卷書的最後一章。"],["p","先問一個很生活的問題。"],["p","你家裡，哪一個地方，是你覺得最安全的？"],["p","有人說，是保險箱。"],["p","有人說，是銀行的戶頭。"],["p","有人說，是床墊底下，那個只有自己知道的角落。"],["p","有人說，是一張厚厚的保單。"],["p","也有人說，是教會。"],["p","我是教會的人，我坐在這裡，我很安全。"],["p","這些東西，本身都不壞。"],["p","保險要買，錢要存，教會要去。"],["p","問題是，半夜兩點，你醒過來。"],["p","心跳得很快，手心在冒汗。"],["p","你躺在那裡，忽然發現，這些東西，沒有一樣，能陪你。"],["p","今天這一章，就是在問這個問題。"],["p","你真正的避難所，在哪裡？"],["p","這一章，有三個要點。"],["p","第一，無處可逃。"],["p","第二，篩穀。"],["p","第三，建立倒塌的帳幕。"],["h","一、無處可逃（9:1--6）"],["p","我們先看第一節。"],["q","我看見主站在祭壇旁邊；他說：你要擊打柱頂，使門檻震動，打碎柱頂，落在眾人頭上；所剩下的人，我必用刀殺戮，無一人能逃避，無一人能逃脫。（摩9:1）"],["p","請你先看，主站在哪裡。"],["p","祭壇旁邊。"],["p","祭壇，是人靠近神的地方。"],["p","是獻祭的地方，是求平安的地方。"],["p","可是，這一次，神站在那裡，不是來接受的。"],["p","是來下令的。"],["p","柱頂被擊碎，整個屋頂落下來。"],["p","人們聚集敬拜的地方，成了他們自己的墳墓。"],["p","這是一幅很可怕的畫面。"],["p","我們要誠實面對，不要急著把它講軟。"],["p","可是，也不要急著把它講歪。"],["p","神不是在反對祭壇。"],["p","神是在反對，把祭壇當成保險。"],["p","五章說過，神厭惡的，是沒有生命、沒有公義的敬拜。"],["p","九章一節，是同一件事的最後一幕。"],["p","你可以去教會，你也可以去得很勤。"],["p","但是，如果你去，是為了讓自己覺得安全，神的手，就不被你管理。"],["p","接下來，二到四節，是一首逃亡詩。"],["q","他們雖然挖透陰間，我的手必取出他們來；雖然爬上天去，我必拿下他們來；（摩9:2）"],["p","往下挖，往上爬。"],["p","向下，是陰間。"],["p","向上，是天。"],["p","人能想到最深，也能想到最高。"],["p","神說，從那裡，我的手。"],["q","雖然藏在迦密山頂，我必搜尋，捉出他們來；雖然從我眼前藏在海底，我必命蛇咬他們；（摩9:3）"],["p","迦密山，樹林茂密，洞穴很多。"],["p","是最容易躲起來的地方。"],["p","海底，是最深、最暗、最沒有人找得到的地方。"],["p","神說，從那裡。"],["q","雖被仇敵擄去，我必命刀劍殺戮他們；我必向他們定住眼目，降禍不降福。（摩9:4）"],["p","最後，連被擄，也不能逃。"],["p","你注意到一個小字嗎？"],["p","從那裡。"],["p","這三節，一共五次。"],["p","人說，我到了那裡。"],["p","神說，從那裡，我。"],["p","這是在回答誰？"],["p","九章十節，有人說，災禍追不上我們。"],["p","他們以為，躲得夠遠，守得夠緊，就沒有事。"],["p","神說，沒有一個地方，是祂不在的。"],["p","詩篇一百三十九篇，也說過這件事。"],["p","我往哪裡去躲避你的靈？"],["p","我若升到天上，你在那裡；我若在陰間下榻，你也在那裡。"],["p","同樣是無處可逃。"],["p","在詩篇裡，是安慰。"],["p","因為下一句是，你的手必引導我。"],["p","在阿摩司書裡，是警告。"],["p","因為說這話的人，是自以為可以躲開神的人。"],["p","同樣的事實，對相信的人，是安慰。"],["p","對以為自己可以躲的人，是警告。"],["p","五、六節，先知停下來，唱了一首頌歌。"],["q","主－萬軍之耶和華摸地，地就消化，凡住在地上的都必悲哀。地必全然像尼羅河漲起，如同埃及河落下。（摩9:5）"],["p","神只要摸一下。"],["p","不用用力。"],["p","地就融化。"],["p","這位神，不是祭壇旁邊的一個偶像。"],["p","不是某一個民族的守護神。"],["q","那在天上建造樓閣、在地上安定穹蒼、命海水澆在地上的－耶和華是他的名。（摩9:6）"],["p","耶和華是他的名。"],["p","這是整卷書最後一次這樣唱。"],["p","在最嚴厲的話中間，先知停下來，要百姓先看見說話的是誰。"],["p","你要面對的，是這位。"],["p","可是，請你聽清楚。"],["p","這位不能逃的神，同時，也是不必逃的神。"],["p","因為祂不是只有手，祂也是領你出來的那一位。"],["p","這一點，馬上就要在第七節出來。"],["h","二、篩穀（9:7--10）"],["q","耶和華說：以色列人哪，我豈不看你們如古實人嗎？我豈不是領以色列人出埃及地，領非利士人出迦斐託，領亞蘭人出吉珥嗎？（摩9:7）"],["p","這一節，讓人很不舒服。"],["p","古實人，是遠方的人。"],["p","是以色列人覺得，跟自己沒有關係的人。"],["p","神說，我看你們，如古實人。"],["p","非利士人，亞蘭人，是以色列的仇敵。"],["p","神說，我也領他們。"],["p","出埃及，是以色列最大的記念。"],["p","是他們的生日。"],["p","神說，這件事，我對別人也做過。"],["p","這是什麼意思？"],["p","不是說，出埃及沒有意義。"],["p","也不是說，以色列不是祂的百姓。"],["p","是說，不要把我領你出來，當成你不會被審判的理由。"],["p","恩典的歷史，不是護身符。"],["p","你得救，是恩典。"],["p","可是，恩典不是讓你可以不認真的許可證。"],["p","我想起一位長輩，在教會，六十年。"],["p","他說，我從小就受洗，我不會有事。"],["p","這句話，有一半是真的。"],["p","他的受洗，是真的。"],["p","神的恩典，也是真的。"],["p","可是，那一半的「我不會有事」，如果成了不聽勸的理由，就是危險的。"],["p","這一節，是對所有以為自己有身分保障的人說的。"],["p","包括我，也包括你。"],["q","主耶和華的眼目察看這有罪的國，必將這國從地上滅絕，卻不將雅各家滅絕淨盡。這是耶和華說的。（摩9:8）"],["p","請注意這句話。"],["p","前面，是必將這國滅絕。"],["p","後面，是卻不將雅各家滅絕淨盡。"],["p","這不是矛盾。"],["p","是同一個審判的兩面。"],["p","國，是制度，是靠著自己站立的那一套。"],["p","家，是人。"],["p","神要除去的，是那一套自以為安全的東西。"],["p","祂不要滅絕的，是人。"],["p","你再看最後一句。"],["p","這是耶和華說的。"],["p","這四個字，是全卷書的追蹤字。"],["p","耶和華說。"],["p","在審判最重的地方，神也簽名。"],["p","在審判裡面，也有但書。"],["q","我必出令，將以色列家分散在列國中，好像用篩子篩穀，連一粒也不落在地上。（摩9:9）"],["p","篩穀，你看過嗎？"],["p","農夫，把穀子放在篩子裡，搖一搖。"],["p","碎石、糠、泥土，漏下去。"],["p","穀子，留在上面。"],["p","篩的時候，穀子，也在搖。"],["p","搖，是不舒服的。"],["p","可是，篩的目的，不是要毀掉穀子。"],["p","是要把穀子，留下來。"],["p","所以，經文說，連一粒也不落在地上。"],["p","這是很有力量的一句話。"],["p","搖動是真的。"],["p","保全，也是真的。"],["p","新約，也有一個篩。"],["p","耶穌對西門彼得說，撒但想要篩你們，像篩麥子一樣。"],["p","彼得要被搖了。"],["p","可是，耶穌接著說，我已經為你祈求，叫你不至於失了信心。"],["p","你回頭以後，要堅固你的弟兄。"],["p","你有沒有發現，這個篩，是有人祈求的篩。"],["p","你有沒有一段日子，覺得自己被搖得很厲害？"],["p","工作被搖，婚姻被搖，健康被搖。"],["p","你不知道，這是不是審判。"],["p","我想對你說，不要急著下結論。"],["p","經文給我們的標準，只有一個。"],["q","我民中的一切罪人說：災禍必追不上我們，也迎不著我們。他們必死在刀下。（摩9:10）"],["p","被篩出去的，是誰？"],["p","是說，災禍追不上我的人。"],["p","是說，我是例外的人。"],["p","他們不一定是壞人。"],["p","他們也許很會禱告，很會事奉，很會講。"],["p","只是，他們心裡，有一個地方，不給神碰。"],["p","你要問的，不是，我是穀，還是糠。"],["p","你要問的是，我心裡，有沒有一句話，是災禍追不上我？"],["p","如果有，今天，就回頭。"],["p","全卷書，一直在說回頭。"],["p","你們仍不歸向我。"],["p","這句話，在四章，說了五次。"],["p","人不回來。"],["p","可是，等一下，你會看到，最後一次。"],["h","三、建立倒塌的帳幕（9:11--15）"],["p","到這裡，風向，忽然變了。"],["q","到那日，我必建立大衛倒塌的帳幕，堵住其中的破口，把那破壞的建立起來，重新修造，像古時一樣，（摩9:11）"],["p","你聽見了嗎？"],["p","前面，我必擊打，我必殺戮，我必搜尋。"],["p","現在，我必建立，我必堵住，我必修造。"],["p","同一位神。"],["p","同樣的，我必。"],["p","只是方向，換了。"],["p","請看，祂說的是什麼。"],["p","帳幕。"],["p","不是宮殿。"],["p","不是聖殿。"],["p","是一個棚子。"],["p","就像住棚節，搭的那種小棚子。"],["p","大衛家，曾經有榮耀。"],["p","到了先知的時代，它像一個搖搖欲墜的草棚。"],["p","有破口，有裂縫，快要倒了。"],["p","神說，我要把它立起來。"],["p","堵住破口。"],["p","把破壞的，重新修造。"],["p","你有沒有一個地方，像這個棚子？"],["p","一個你不敢讓人看的地方。"],["p","一個家，一段關係，一種信仰。"],["p","破了很久，漏風，漏雨。"],["p","你不是不想修。"],["p","你是修了好幾次，又倒了。"],["p","你累了。"],["p","神說，我必建立。"],["p","不是說，你要努力。"],["p","是說，我。"],["p","神沒有說，我要拆掉，另外蓋一座新的。"],["p","祂說，我要把倒塌的，立起來。"],["p","祂願意修舊的。"],["q","使以色列人得以東所餘剩的和所有稱為我名下的國。此乃行這事的耶和華說的。（摩9:12）"],["p","這個盼望，不是關起門來的。"],["p","是向外的。"],["p","稱為我名下的國。"],["p","連外邦人，也被包括進來。"],["p","新約，使徒行傳十五章，耶路撒冷的會議。"],["p","外邦人信主，要不要先守摩西的規矩？"],["p","大家吵得很厲害。"],["p","雅各站起來。"],["p","他引用的，就是這一段。"],["p","此後，我要回來，重新修造大衛倒塌的帳幕。"],["p","叫餘剩的人，就是凡稱為我名下的外邦人，都尋求主。"],["p","我們只照新約自己的引用方式說。"],["p","新約的作者，把這個應許，和外邦人歸向神，連在一起。"],["p","至於日期，至於地點，至於與今天哪一個事件有關。"],["p","經文沒有說。"],["p","我們不算日子。"],["p","我們也不拿這一段，去支持任何一個國家，或反對任何一個人。"],["p","我們只看見一件事。"],["p","神的家，比我們以為的，大。"],["p","你注意，這一句，又有一次簽名。"],["p","此乃行這事的耶和華說的。"],["p","審判，是祂說的。"],["p","重建，也是祂說的。"],["p","同一位神的聲音。"],["q","耶和華說：日子將到，耕種的必接續收割的；踹葡萄的必接續撒種的；大山要滴下甜酒；小山都必流奶。（摩9:13）"],["p","盼望，也以耶和華說開頭。"],["p","這一幅畫面，很有意思。"],["p","耕種的人，追上收割的人。"],["p","收成多到，來不及收，下一季就到了。"],["p","前面，是饑荒，是乾旱，是歉收。"],["p","現在，山上，滴下甜酒。"],["p","請你看，那個字，「流奶」。"],["p","和合本的註腳說，原文是，消化。"],["p","你記得第五節嗎？"],["p","主摸地，地就消化。"],["p","同一個動詞。"],["p","神的手，可以使地融化，變成審判。"],["p","同一隻手，也可以使山融化，流出甜酒。"],["p","這是整章，最美的對稱。"],["q","我必使我民以色列被擄的歸回；他們必重修荒廢的城邑居住，栽種葡萄園，喝其中所出的酒，修造果木園，吃其中的果子。（摩9:14）"],["p","我必使，歸回。"],["p","這是整卷書，追蹤字，轉回，最後一次。"],["p","前面，四章，神說了五次。"],["p","你們仍不歸向我。"],["p","人不回來。"],["p","到了最後，神說，我必使。"],["p","人不回來，神使他回來。"],["p","這就是福音。"],["p","福音，不是說，你要努力回來。"],["p","是說，神自己，把你帶回來。"],["p","你再看，帶回來的，是什麼樣的日子。"],["p","不是奇蹟的場面。"],["p","是平凡的日子。"],["p","重修荒廢的城。"],["p","栽種葡萄園。"],["p","喝自己栽種的酒。"],["p","吃自己種的果子。"],["p","有一個家，有一個園子，有一張桌子。"],["p","可以坐下來，吃一頓飯。"],["p","神的恩典，不只是在天上的事。"],["p","也是在桌子上的事。"],["q","我要將他們栽於本地，他們不再從我所賜給他們的地上拔出來。這是耶和華－你的神說的。（摩9:15）"],["p","這是整卷書，最後一句話。"],["p","我要將他們栽。"],["p","不再拔出來。"],["p","整卷書，聽到的，都是拆，是擊，是篩。"],["p","最後一個動詞，是栽。"],["p","最後一句，是不再。"],["p","你看最後五個字。"],["p","你的神說的。"],["p","這不是對一個民族說的。"],["p","是對你說的。"],["p","一卷審判的書，最後，以這句話結束。"],["p","你的神。"],["p","我們也不從這一節，推算今天的任何土地，任何政權。"],["p","我們看見的，是一個比土地更大的真理。"],["p","神栽下的人，神保守。"],["p","新約說，沒有任何東西，能叫我們與神的愛隔絕。"],["p","這愛，是在我們的主基督耶穌裡的。"],["h","四、耶穌，與321"],["p","最後，我們來看耶穌。"],["p","帳幕，倒塌了，誰來立起來？"],["p","大衛的子孫，耶穌。"],["p","祂來，是要建立。"],["p","祂不是用刀，不是用篩子。"],["p","祂自己，被擊打。"],["p","本來，該落在我們頭上的柱頂，落在祂身上。"],["p","本來，該我們被篩出去的，祂被篩出去了。"],["p","在十字架上，祂說，父啊，赦免他們。"],["p","因為他們所做的，他們不曉得。"],["p","耶穌，是我們的榜樣，也是我們真正的避難所。"],["p","在祂的手裡，沒有人能把我們奪去。"],["p","這裡，我們也看見321。"],["p","有己的生命，把平安，放在別的地方。"],["p","放在身分，放在存款，放在資歷。"],["p","這就是驕傲，離開本位，要自己保護自己。"],["p","無己的生命，是回到本位。"],["p","讓神作神，讓人作人。"],["p","承認，我沒有地方可以躲。"],["p","承認，我只有祂。"],["p","這就是讓耶穌作王。"],["p","我們這個團契，也在學習。"],["p","一個屬神的體系，不是一個沒有破口的團體。"],["p","是一群，帶著破口，來到神面前，讓神修的人。"],["p","我們的焦點，都在耶穌。"],["p","不在身分，不在資歷，不在自己。"],["h","五、這一週，你可以做什麼"],["p","第一，今天晚上，找出你心裡的那個保險箱。"],["p","你覺得最安全的那個地方。"],["p","問自己一句，如果它沒有了，我還有什麼？"],["p","第二，找出你心裡，那一句災禍追不上我。"],["p","不用急著判斷自己。"],["p","只要誠實地，對神說。"],["p","第三，找出你的帳幕。"],["p","那個破了很久的地方。"],["p","把它，一件一件，說給神聽。"],["p","然後，說，主啊，求祢建立。"],["p","第四，找一位同伴，告訴他，你的破口。"],["p","你不需要一個人修。"],["p","最後，我們一起來禱告。"],["p","親愛的天父，謝謝祢，祢是我們不能逃、也不必逃的神。"],["p","求祢憐憫我們，把平安放在不該放的地方。"],["p","求祢使我們回頭，也求祢使我們歸回。"],["p","求祢建立我們倒塌的帳幕，堵住我們的破口。"],["p","把我們栽在祢的恩典裡，不再拔出來。"],["p","讓耶穌作王掌權。"],["p","讓耶穌得到一切的榮耀。"],["p","奉主耶穌基督的名禱告，阿們。"]]}},"issues":[{"id":"ISS00_1","t":"成書與編輯：阿摩司書是阿摩司一人所作嗎？九章末的盼望是原作嗎？","r":"1:1--9:15","ch":[1,9],"why":"書首說這是「提哥亞牧人中的阿摩司」的話，在烏西雅作猶大王、耶羅波安作以色列王的時候。但自從近代以來，有些學者認為最後一段（9:11--15）的盼望語氣與前面的審判不同，可能是後來的編者補上；也有人認為 1:1--2 或個別頌讚段落（4:13；5:8--9；9:5--6）出自編輯之手。","pos":[["傳統立場","","全書出自阿摩司，審判與盼望並存，並不矛盾：先知所傳的神，本來就是審判的神，也是應許的神。9:11--15 是整卷書的結尾，不是外來的尾巴。"],["編輯成書","","書卷在流傳中經過整理，後人補入盼望與頌讚，讓這卷在被擄之後的人手中仍然成為安慰；成書過程不減損其為神的話。"],["折衷理解","","核心的審判話語出自阿摩司；成書與編排可能經過後來的整理；無論哪一種，今日所讀的完整書卷，就是教會所領受的正典。"]],"con":[],"say":"本講義依和合本與書卷現有的次序，把全卷當作一篇完整的話來讀：從「耶和華必從錫安吼叫」，一路讀到「栽於本地，不再拔出」。成書的細節，不是我們讀懂這卷書的門檻；但我們不拿審判與盼望互相抵銷，也不讓盼望變成輕易逃過審判的藉口。","care":"不要讓成書問題成為「誰比較尊重聖經」的標籤。有人讀過不同的學術意見，有人守著傳統的看法，都可以一起查考同一段經文；先把經文讀完，再談意見。"},{"id":"ISS00_2","t":"公義與敬拜：神厭惡的是敬拜本身嗎？","r":"5:21--24","ch":[4,5],"why":"5:21--23 神說祂恨惡、厭棄他們的節期、燔祭與歌唱，緊接著 5:24 說「惟願公平如大水滾滾，使公義如江河滔滔」。有人因此說阿摩司反對聚會與儀式，也有人說這段只是批評虛假的敬拜。","pos":[["反對儀式本身","","先知否定當時的祭祀制度，神要的是倫理而不是宗教；教會的聚會與禮儀在神眼中沒有價值。"],["反對與公義脫節的敬拜","","神厭棄的是人一面壓榨窮人、一面照常獻祭；不是祭祀本身。同一卷書也呼召人「要尋求我，就必存活」（5:4），可見敬拜的對象仍是神。"],["不可二選一","","公義與敬拜是同一條河的兩岸：沒有公義的敬拜是空殼，沒有敬拜的公義也容易失去方向與力量。"]],"con":[],"say":"本講義取第二、三種的合併：神厭惡的不是敬拜，而是把敬拜當作可以與欺壓並存的保護色。這段話不是叫人少參加聚會，而是叫人在聚會之後，回到辦公室、店鋪、家裡，仍然誠實、公平地對待人。","care":"不要用這段話指責某個人「太屬靈、不夠公義」，也不要用它指責另一個人「只顧社會、不愛敬拜」。先問自己：我的敬拜，今天有沒有走進我的帳單、我的薪水、我對下屬的態度裡？"},{"id":"ISS00_3","t":"公平與福音：阿摩司書是社會革命的宣言嗎？","r":"2:6--8；5:24；8:4--6","ch":[2,8],"why":"阿摩司書對欺壓窮人、操縱斗秤的人極其嚴厲，因此常被引用為社會改革的口號，也常被另一些人批評為「社會福音」。兩邊都可能只讀了半卷書。","pos":[["社會公義優先","","先知的重點是制度性的不公義；教會的使命包括為被壓傷的人發聲、改變不公平的結構。"],["個人悔改優先","","先知首先對的是人心與敬拜；社會的不義是心背離神的果子，真正的改變從個人歸向神開始。"],["兩者同為神的心意","","神既是創造主、審判者，也是立約的神；祂認識以色列，所以要追討（3:2）。公義是神性情的流露，不是替代福音的另一套議程。"]],"con":[],"say":"本講義的立場是：阿摩司書先講神，再講人；神的話在前，社會的行動在後。我們不把先知的話拿來當成任何政黨、階級或運動的口號，也不把它縮小成只管個人心情的靈修。窮人與義人在神眼中有價值，這是經文自己說的。","care":"不要拿這段經文去論斷某個富有的人，也不要用它讓自己覺得「我站在對的一邊」。阿摩司書先向安逸的人說話，也先向有信仰的人說話；第一個要被這段話問的，是讀的人自己。"},{"id":"ISS00_4","t":"神的「後悔」與「必不免去」：神的審判能被代求改變嗎？","r":"1:3；7:3；7:6","ch":[1,7],"why":"1:3 至 2:6 神反覆說：「我必不免去他們的刑罰」；但 7:1--6 阿摩司求告，耶和華就後悔說「這災可以免了」。神的審判是定案，還是可以因人的代求而改變？","pos":[["神真的改變心意","","聖經用人的語言描述神；神向人的回應是真實的，代求在神的計劃中真的有分量。"],["神的旨意不變，表達方式向人而變","","「後悔」是從人的角度描述神對審判的收回；神的本性、計劃與信實並沒有改變（參民 23:19）。"],["審判有時間性","","第一、二個異象，審判被收回；第三個異象（準繩）起，神說「我必不再寬恕他們」。代求有它的時刻，也有它的限度。"]],"con":[],"say":"本講義不裁決「神是否真的改變」的神學難題；三種說法都要求同一件事：讀的人要像阿摩司，在神面前為別人說話。我們也要誠實地說：書卷後來的異象說明，代求不是萬能的鑰匙，審判的警告是真的。","care":"不要對正在受苦的人說，只要你禱告更多，災禍就會被收回；也不要說，這是神的審判，禱告也沒用。先陪伴，先聽；代求是愛的行動，不是衡量人屬靈程度的標準。"},{"id":"ISS00_5","t":"「耶和華的日子」（5:18--20）是推算末世的時間表嗎？","r":"5:18--20","ch":[5,9],"why":"以色列人盼望「耶和華的日子」是神為他們爭戰的日子；阿摩司卻說那日子是黑暗，不是光明。這段話常被引用來推算末世，或被拿來描述某一個預言事件。","pos":[["歷史的審判","","阿摩司當時所指的，是神將要對北國以色列施行的審判，後來由亞述的入侵應驗；重點是向當時的人說話。"],["末世的主題之一","","「耶和華的日子」是整本聖經反覆出現的主題；阿摩司的話預備了後來先知對末日的描述，仍然指向神最後的審判與得勝。"],["雙重意義","","眼前的審判是末日審判的預演；今日的讀者既要聽見當時的警告，也要預備迎見神。"]],"con":[],"say":"本講義不排時間表，不算日子，也不指認任何現代國家或人物。這段經文的重點是：不要以為自己屬於神的子民，就一定站在光明這邊；要求善，不要求惡，要尋求耶和華，並且「預備迎見你的神」。","care":"不要用這段話嚇唬人，也不要拿它安慰自己「災難都會落在別人身上」。果效應該是忍耐與預備，不是恐慌；更愛主，不是更怕世界。"},{"id":"ISS01_1","t":"1:3：「三番四次」是什麼意思？是不是神數算罪的次數？","r":"1:3--3","ch":[1],"why":"從1:3到2:6，同一句話出現八次：某某三番四次地犯罪。許多讀者讀到這裡，第一個反應是問：三次是什麼，四次又是什麼？是不是神的忍耐有一個數字，到了第四次，審判就來？這個問題，會直接影響我們怎樣向會眾講神的忍耐與審判。","pos":[["語言上的「滿溢」說法","","希伯來文常用「n 與 n＋1」的格式（箴6:16、30:15、伯5:19），表示數目多到滿溢，而不是真有一個確切的數字；這是最常見的讀法，也最貼近原文用法。"],["實指三條加一條","","有人認為每一個國家，確實有三條已被饒恕的罪，第四條是壓垮的那一條；但經文沒有一個國家列出三或四條，五個國家的罪名也不是三到四條，這個讀法需要補上經文沒有的內容。"],["累積到臨界點","","也有人把三四理解為罪行不斷累積、到了神不再容忍的程度，不強調數字，只強調累積；與第一種讀法接近，但容易被讀成「神有一個忍耐的上限」。"]],"con":[],"say":"本講義取第一種為主：三番四次，是「一次又一次、滿到溢出來」，不是數字。我們不算罪的次數，也不推論第幾次犯罪之後審判必來。這一節要我們看見的，是神等了很久。關於「必不免去」與神的後悔，全卷議題《神的「後悔」與「必不免去」：神的審判能被代求改變嗎？》要到第七章再細談；本章怎麼講：只說神在這裡的決定，是「不使它轉回」，這是神對這些國家，在長久忍耐之後說的話，不是對每一個悔改的人說的話。","care":"不要用這個題目去嚇唬會眾，說你已經犯了三次，再一次就完了；也不要讓那些因過去的失敗而不敢向神再開口的人，以為自己的次數用完了。對正在自責的人，先說：神的忍耐比我們想的長；你今天仍然可以向祂說話。"},{"id":"ISS01_2","t":"1:9：「弟兄的盟約」是指哪一個盟約？","r":"1:9--9","ch":[1],"why":"神對泰爾的指控，除了把眾民交給以東，還多了一句：並不記念弟兄的盟約。這個「弟兄的盟約」，原文只說「弟兄們的約」，沒有指明是哪一個。是所羅門與希蘭之間的條約，是兩國的友好關係，還是人與人之間本應有的情誼？","pos":[["所羅門與希蘭的條約","","王上5:12說希蘭與所羅門「彼此立約」，王上9:13，所羅門稱希蘭為「我兄」；泰爾曾與以色列有過這份友好的條約，後來卻把以色列人賣給以東，等於背棄這個約。"],["泰爾與以色列的一般友好關係","","不一定指向某一份文件，而是兩國之間長期的往來與信賴；泰爾把人交出去，是背棄這種關係。"],["人與人之間的弟兄之情","","不指任何一份特定條約，而是人與人之間，本來就應該有的基本情誼；原文用「弟兄」這個詞，與下一節的以東「兄弟」（1:11）呼應。"]],"con":[],"say":"本講義不裁定哪一種，三種讀法都指向同一件事：泰爾背棄了本來應該信守的關係。我們不替經文補上它沒有說的歷史細節，只看見：神記得，人曾經答應過什麼；「記念」不只是想起，而是依照所記得的去做。","care":"有些人是在被朋友、親人、合夥人背棄之後，來讀這一節。請先陪伴他們，不急著論斷那個背棄的人；也不要用這一節，催逼被背叛的人立刻重新信任對方。對背棄過別人的人，這一節也不是定罪，而是邀請：回去，把你當初說過的話，認真地補上。"},{"id":"ISS01_3","t":"1:3--15：神為什麼審判不是以色列人的外邦國家？","r":"1:3--15","ch":[1],"why":"阿摩司書一開頭，審判的對象，是以色列四周的五個國家。這些國家沒有摩西的律法，也沒有聖殿。神憑什麼審判她們？這個問題，也會問到：今天不認識神的人，他們要不要為自己的行為，向神交帳？","pos":[["人人都有一份基本的是非之心","","罪名是暴力、買賣人口、背棄約定、永懷忿怒，這些即使沒有律法，人也知道是錯的；羅馬書2:14--15說外邦人雖然沒有律法，良心也作見證。"],["神是萬民的主","","耶和華不只是以色列的神，也是列國的主；阿摩司書9:7甚至說祂領非利士人出迦斐託，領亞蘭人出吉珥，與領以色列出埃及並列；所以祂對列國說話，也有權審判。"],["為鋪陳以色列自己的審判","","有人認為，列國神諭的主要作用，是先讓以色列人點頭，然後在第二章轉向猶大與以色列；這是文學結構上的觀察，與前兩種讀法並不衝突。"]],"con":[],"say":"本講義三種都取：神是列國的主，祂看見對人犯的暴力；人心裡有基本的是非；這一章的排列，也是為了讓聽的人，在點頭之後，轉過頭來問自己。我們不把這一章用來論斷今天任何一個國家或民族，也不替任何人貼標籤。","care":"這個題目，不是為了要辯論「誰有資格被審判」，而是為了那些在暴力、買賣、戰爭裡受過傷的人：你受的傷害，不是無人看見的；神看見，祂記著。對正在經歷這樣傷痛的人，先陪伴，不追問細節，不要求原諒，也不急著講道理；等他願意的時候，再慢慢說。"},{"id":"ISS02_1","t":"2:6：「賣了義人」「賣了窮人」，到底是什麼場景？這一章是社會革命的宣言嗎？","r":"2:6--8","ch":[2],"why":"二章六節說：他們為銀子賣了義人，為一雙鞋賣了窮人。這個「賣」，到底是把還不起債的人賣作奴隸，是在法庭上收賄賂，還是別的事？而這一章講到窮人與欺壓，是不是就等於阿摩司書是一份社會革命的宣言？這個問題，影響我們怎樣聽這一章：是只要改變制度，還是要先回到神面前。","pos":[["債務奴役","","窮人欠了很小的債，一雙鞋的錢，就被債主賣去為奴；這與律法中對債務與抵押的規定相連（出22:26--27；申24:12），八節的「所當的衣服」可以支持這個讀法。"],["法庭上的賄賂","","「義人」是理直的人，有人把「賣」讀為在法庭上收錢，讓理直的人敗訴；這與五章後面「在城門口」的審判場景相連。"],["不替它補上單一的場景","","經文只用「賣」這個商業動詞，沒有交代地點與方式；它描寫的是一個普遍的現象：人被標上價錢，成了可以買賣的東西。"],["社會革命的宣言","","有人把這一章讀成對壓迫制度的控訴，並把阿摩司書當作改革社會的行動綱領；這個讀法看見了神對窮人的關心，卻容易把神的話縮成一個計畫。"]],"con":[],"say":"本講義取第三種為主：不替「賣」補上單一的場景，只守住一件事：人被標了價，而神看見。至於全卷議題《公平與福音：阿摩司書是社會革命的宣言嗎？》，本章的回答是：不是。神要的公義，出於認識神，不取代敬拜；八節的重點，是在神的廟中享用別人的眼淚，所以敬拜與公義要一起活出來。陪伴與保護受傷的人，優先於論斷欺壓人的人。","care":"如果你自己，就是那位被少算工錢、被當作東西使用、不敢開口的人，請先聽這一句：這一章，神是站在你這一邊的。你不需要先把自己的處境整理清楚，也不需要先原諒誰，才有資格被聽見。若你願意，找一位你信得過的人，說出一件事；需要的時候，也請尋求專業或法律上的協助。這不是軟弱，是神所樂意的保護。"},{"id":"ISS02_2","t":"2:7：「父子同一個女子行淫」，那位女子是誰？她有責任嗎？","r":"2:7--7","ch":[2],"why":"經文說：父子同一個女子行淫，褻瀆我的聖名。原文只說「那少女」，沒有說她是誰，也沒有說她的處境。她是家中的僕婢或債務奴嗎？是敬拜場所中的女子嗎？她自己有沒有責任？這個問題，會直接影響受傷害的人怎樣聽這一節。","pos":[["家中的僕婢或債務奴","","有人把她讀為被債務或身分綁住、沒有力量說不的人，與前一句「賣了窮人」相連；父子同用，說明這是用權力使用一個無法拒絕的人。"],["敬拜場所中的女子","","有人把它與迦南敬拜中的宗教娼妓相連，認為這是把淫亂帶進敬拜的行為；這與八節「在各壇旁」相連，但經文沒有直接說明她的身分。"],["經文沒有說明","","原文只有「那少女」，沒有交代身分與處境，各家的推論，都是從上下文補上的。"]],"con":[],"say":"本講義取第三種為主：不替她補上身分。無論她是誰，經文裡沒有一個字責備她；被審判的，是有權力的父子，而神把她所受的傷害，看為對自己聖名的褻瀆。我們不用這一節去問「她有沒有責任」，只守住：神與被傷害的人站在一起。","care":"如果你曾經在權力不對等的關係裡被傷害，這一節不是在說你有錯。你不必先證明自己是對的，也不必馬上原諒誰。帶領的人聽到這樣的分享，不追問細節，不說「你要有信心」，不要求對方放下，只先陪伴；必要時，協助對方尋求輔導、醫療或法律的專業協助，並在會後單獨關心。"},{"id":"ISS02_3","t":"2:1--5：神審判不認識祂律法的外邦人，憑的是什麼標準？","r":"2:1--5","ch":[2],"why":"二章先審判摩押與猶大，一個沒有律法，一個有訓誨與律例。神為什麼也審判摩押？摩押沒有摩西的律法，神憑的是什麼？這個問題常常使人想到：那些沒有聽過福音的人，神怎樣看待？","pos":[["憑對人的殘暴","","摩押被審判的原因，是焚燒以東王的骸骨，這是對人的尊嚴的侵犯，不需要摩西的律法，人心也知道這是不對的。"],["憑神所定的普世秩序","","有人認為，神是列國的主，祂對所有的民族，都有一個共通的是非標準，與創世記中對殺人與暴力的審判一脈相承。"],["經文只說到具體的罪行","","經文只講摩押所做的那一件事，沒有展開成一套外邦人得救的理論，也沒有討論未曾聽過福音者的終局。"]],"con":[],"say":"本講義取第三種為主：經文只說，摩押被審判，是因為焚燒別人的骸骨，神是列國的神，也看見這樣的事。我們不用這一段，替任何未信的人下判斷，也不把它推論成一套理論；只讀神說的：祂看見，也不把殘暴當作沒有發生。保羅在羅馬書二章裡，談到外邦人的良心，我們說這使我們想起，不是說阿摩司書預言了這件事。","care":"如果你正為一位不信的親人憂心，這一段經文不是要你下判斷，也不是要你更恐慌。神是列國的神，祂比我們更看重每一個人；你可以把你的擔心，說給祂聽，並繼續用愛與生活為他作見證。帶領的人遇到這樣的分享，先陪伴，不給他一個確定的終局答案，也不說「你要有信心」。"},{"id":"ISS03_1","t":"3:2：「我只認識你們」是揀選的特權，還是揀選的責任？","r":"3:1--2","ch":[3],"why":"神對從埃及領上來的百姓說：在地上萬族中，我只認識你們；因此，我必追討你們的一切罪孽。這個「因此」，把榮耀與追討連在一起。有人聽見「揀選」，就以為得到了保障；有人聽見「追討」，就以為神要找機會懲罰。這一句，究竟該怎樣讀？","pos":[["特權說","","被神揀選，就是比別人更安全、更有保障；神不會輕易審判自己所揀選的百姓。阿摩司當時的聽眾，很可能就是這樣想的，所以他們對先知的警告，不以為意。"],["責任說","","揀選的目的，是託付，不是優越；越被神認識的人，神的要求越高。「因此」說明：正因為被認識，才被追討。新約也有類似的原則：多給誰，就向誰多取。"],["立約關係說","","「認識」是立約的字，指一個有委身的關係：神對他們有恩典，也有立約的要求。恩典在前（領上來），要求在後（追討），兩者出於同一份愛。"]],"con":[],"say":"本講義取第三種為主，並吸收第二種的重心：揀選是恩典，先於一切的行為；也因為是立約的關係，神不能對自己百姓的罪視而不見。揀選不是特權，是託付；追討不是恐嚇，是愛得認真。這一章不拿「我只認識你們」，去貶低任何民族，也不拿它去嚇唬任何信徒。","care":"對那些在「被愛」與「被管教」之間，感到困惑的人：神若管教你，不代表祂不愛你；祂管教，因為祂把你放在心上。對那些在教會或家庭裡，長期被拿你是蒙揀選的人所以要忍耐這一類的話壓著的人：這一節不是用來要求受傷的人沉默，神的認識，包括看見你的受傷。"},{"id":"ISS03_2","t":"3:6：「災禍若臨到一城，豈非耶和華所降的嗎？」能用來解釋今日的災難嗎？","r":"3:6--7","ch":[3],"why":"六節說：災禍若臨到一城，豈非耶和華所降的嗎？七節接著說，神若不將奧祕指示他的僕人，就一無所行。有人由此推論：今日每一場地震、疾病、意外，都是神對某人、某城的審判。這樣讀，對嗎？受苦的人聽了，會是什麼感受？","pos":[["一切災難都是神的審判","","把六節當作一條普遍的原則：凡有災禍，必是神降下，所以每一場災難，背後都有一個該悔改的罪。"],["神主權下的警告","","六節是對神的約民，在先知警告之下的話：神在審判之前，先有話語；若災禍來臨，不要說是偶然。重點在神的主權，與事前的警告，不是為每一場災難解釋原因。"],["只談神的主權，不談審判","","有人認為，這一節只是說神掌管萬有，與審判無關。但上下文（二節的追討、十一節的宣判），顯然與審判有關。"]],"con":[],"say":"本講義取第二種：這是神對自己約民所說的話，不能搬去解釋任何一個人的苦難。耶穌在路加福音十三章，特別糾正過「遭難的人一定犯了罪」的想法。我們知道的是：神掌權，神說話在先；至於某一場災難的原因，我們不替神下結論。","care":"對正在失去家人、家園或健康的人：這一節不是在說，你受苦，是因為你做錯了什麼。請不要讓任何人，用這節經文向你解釋你的苦；你不需要先弄明白原因，才可以哭，才可以求神。陪伴的人，也請先坐下來聽，不急著講道理。"},{"id":"ISS03_3","t":"3:12：「得救也不過如此」，說的是餘民的盼望，還是審判之後所剩無幾？","r":"3:12--12","ch":[3],"why":"牧人從獅子口中，只搶回兩條羊腿或半個耳朵；撒馬利亞躺在床角、繡花毯榻上的人，「得救也不過如此」。這一節，原文的最後一句，更有一個很難翻譯的詞（大馬士革或繡花毯）。這一節是在宣告審判，還是在預告有一點餘民會被保存？","pos":[["餘民的暗示","","「得救」一詞，帶出有一小部分會被救出；牧人搶回的，雖然只是碎片，卻也是被保存的。這是一個極微小的盼望。"],["審判之後所剩無幾","","出埃及記22:13的律法，是牧人拿碎片，作羊被野獸撕碎的證據。這裡的重點，不是盼望，而是證明：羊已經被吃了。「得救」是反諷：他們得救，也不過是這樣。"],["文本難題","","最後兩個詞，是「大馬士革」或是「繡花毯」，歷來有不同讀法，也有人認為文字在傳抄中受損。這使整句的細節，不能說得太確定。"]],"con":[],"say":"本講義取第二種：這一節的語氣，是反諷與警告，不是安慰；經文沒有把它說成福音意義的得救，也沒有給出任何時間表。至於最後兩個詞，我們承認不確定，並採用和合本。這一點，也與全卷議題（成書與編輯：阿摩司書是阿摩司一人所作嗎？）有關：本章這一處難解的文字，提醒我們，我們手上的，是經過傳抄的經文；本章怎麼講：不為一個不確定的詞，建立任何教義。","care":"對那些在受傷、失落之後，覺得自己「只剩下碎片」的人：這一節說的，是神對一群自以為安穩、卻行欺壓之人的警告，不是在說你就是被撕剩下的碎片。你的價值，不在你剩下多少。耶穌是好牧人，不是只帶回證據，而是為羊捨命，把我們整個背回家。"},{"id":"ISS04_1","t":"4:1：「巴珊的母牛」指的是誰？","r":"4:1--3","ch":[4],"why":"阿摩司說：你
