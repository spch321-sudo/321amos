假的教導或假神的敬拜；和合本取偶像。無論取哪一種，意思相通：被謊言引路的人，走迷了。<\/p><p><strong>走迷<\/strong>：וַיַּתְעוּם 的動詞是「使流蕩、使迷失」，主詞是「謊言」，不是人故意走偏；「列祖所隨從」，說明這條迷路，是一代傳一代。<\/p>","exp":"<p>三、四節，輪到猶大。<strong>耶和華如此說：猶大人三番四次地犯罪，我必不免去他們的刑罰。<\/strong>前面一路，審判都落在別人身上，聽的人也許一直點頭：是啊，他們該受。可是，現在，話轉過來，落在「自己人」身上。同樣的開場，同樣的「我必不免去」（那個「轉回」的追蹤字，在這一章第二次出現），連神的百姓，也沒有例外。<\/p><p>猶大的罪名，和摩押不一樣。摩押是對人的殘暴，猶大是對神的話：<strong>他們厭棄耶和華的訓誨，不遵守他的律例。<\/strong>請你留意，這不是說他們不知道。他們有訓誨，有律例，只是把它看為無用，推到一邊。「厭棄」這個字，是把一樣東西看輕了、丟開了。接著，經文說：<strong>他們列祖所隨從虛假的偶像使他們走迷了。<\/strong>原文直譯，是「他們的謊言」。謊言一代傳一代，把人帶離了路。<\/p><p>五節只有一句：<strong>我卻要降火在猶大，燒滅耶路撒冷的宮殿。<\/strong>這一句，沒有再列罪名，也沒有像對摩押那樣，加上許多描述。話很短，卻很重。猶大是神的百姓，耶路撒冷是神的城，神說，連那裡也一樣。這不是神偏心外邦人、苛待自己人；是領受得越多，責任越重。這個提醒，今天仍然對我們說話：認識神很久的人，最需要先聽見神的話。<\/p>"},{"a":6,"z":6,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>כֹּה אָמַר יְהוָה עַל שְׁלֹשָׁה פִּשְׁעֵי יִשְׂרָאֵל וְעַל אַרְבָּעָה לֹא אֲשִׁיבֶנּוּ עַל מִכְרָם בַּכֶּסֶף צַדִּיק וְאֶבְיוֹן בַּעֲבוּר נַעֲלָֽיִם׃<\/p><\/blockquote>","lit":"<blockquote><p>「耶和華如此說：以色列人三番四次地犯罪，我必不免去他們的刑罰；因他們為銀子賣了義人，為一雙鞋賣了窮人。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>必不免去<\/td><td>אֲשִׁיבֶנּוּ<\/td><td>ashivennu<\/td><td>H7725<\/td><td>我必使它轉回（收回）<\/td><\/tr><tr><td>賣<\/td><td>מִכְרָם<\/td><td>mikhram<\/td><td>H4376<\/td><td>他們賣（買賣）<\/td><\/tr><tr><td>銀子<\/td><td>בַּכֶּסֶף<\/td><td>bakkesef<\/td><td>H3701<\/td><td>為了銀子<\/td><\/tr><tr><td>義人<\/td><td>צַדִּיק<\/td><td>tsaddiq<\/td><td>H6662<\/td><td>義人、理直的人<\/td><\/tr><tr><td>窮人<\/td><td>וְאֶבְיוֹן<\/td><td>evyon<\/td><td>H34<\/td><td>窮乏人、貧窮的人<\/td><\/tr><tr><td>為<\/td><td>בַּעֲבוּר<\/td><td>baavur<\/td><td>H5668<\/td><td>為了、因為<\/td><\/tr><tr><td>鞋<\/td><td>נַעֲלָֽיִם<\/td><td>naalayim<\/td><td>H5275<\/td><td>一雙鞋<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>賣了義人<\/strong>：「賣」是商業動詞，可以指（一）把還不起債的人賣去作奴隸，（二）在法庭上收了賄賂，讓理直的人敗訴，（三）以小利出賣人的處境。各家對場景的看法不同，經文用的是「賣」，我們就從「把人當作可以標價的東西」讀起。本講義不替它補上單一的場景，只守住一件事：人被標了價。<\/p><p><strong>一雙鞋<\/strong>：鞋在這裡是很小的價錢。有人把「為一雙鞋」讀為字面上的小額債務，也有人讀為「微不足道的好處」，也有人與律法中以鞋作為產業憑據的習俗連起來（得4:7）。意思一致：價錢很小，被賣的人是很大的。<\/p><p><strong>義人<\/strong>：צַדִּיק 是「理直的人」，在神面前被算為對的人，卻不是在世上沒有難處的人。與「窮人」並列，說明被賣的，是沒有力量保護自己的人。<\/p>","exp":"<p>六節，輪到以色列，也是這一章的核心。同樣的開場，這一次，落在阿摩司自己的聽眾身上。<strong>耶和華如此說：以色列人三番四次地犯罪，我必不免去他們的刑罰。<\/strong>「我必不免去」，那個「轉回」的字，在這一章第三次出現，也是這一章最後一次。一圈一圈縮小，終於停在以色列。<\/p><p>罪名只有一個動詞：賣。<strong>因他們為銀子賣了義人，為一雙鞋賣了窮人。<\/strong>請你注意兩個價錢：一個是「銀子」，一個是「一雙鞋」；一個也許是大利益，一個小到不值一提。可是，被賣的，一邊是「義人」，一邊是「窮人」，都是沒有力量為自己說話的人。神說：這一件事，我不能不看。<\/p><p>這一句，是追蹤字「公平與公義」的反面：<strong>公義的反面，是價格。<\/strong>一個人一旦被標上價錢，他就從「人」，變成了「東西」。在法庭、在市場、在債務裡，這種事每天都在發生，而且常常做得很合法、很有禮貌。神要我們聽見的是：祂看的，不是手續，是人。<\/p><p>先把這一節放在受傷的人身邊：被賣的人，不是一個「社會議題」，是有名字、有臉的人。他們的眼淚，神看見了。<strong>這一節，神是站在被賣的人這一邊的。<\/strong>然後，才輪到我們問自己：我有沒有，在不知不覺之間，也替人標了價？<\/p>"},{"a":7,"z":7,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הַשֹּׁאֲפִים עַל עֲפַר אֶרֶץ בְּרֹאשׁ דַּלִּים וְדֶרֶךְ עֲנָוִים יַטּוּ וְאִישׁ וְאָבִיו יֵֽלְכוּ אֶל הַֽנַּעֲרָה לְמַעַן חַלֵּל אֶת שֵׁם קָדְשִֽׁי׃<\/p><\/blockquote>","lit":"<blockquote><p>「他們見窮人頭上所蒙的灰也都垂涎，阻礙謙卑人的道路。父子同一個女子行淫，褻瀆我的聖名。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>垂涎<\/td><td>הַשֹּׁאֲפִים<\/td><td>hashshoafim<\/td><td>H7602<\/td><td>喘息渴想、踐踏<\/td><\/tr><tr><td>灰（塵土）<\/td><td>עֲפַר<\/td><td>afar<\/td><td>H6083<\/td><td>塵土、灰<\/td><\/tr><tr><td>窮人<\/td><td>דַּלִּים<\/td><td>dallim<\/td><td>H1800<\/td><td>貧弱的人<\/td><\/tr><tr><td>謙卑人<\/td><td>עֲנָוִים<\/td><td>anavim<\/td><td>H6035<\/td><td>謙卑人、困苦人<\/td><\/tr><tr><td>阻礙<\/td><td>יַטּוּ<\/td><td>yattu<\/td><td>H5186<\/td><td>使彎曲、使偏斜<\/td><\/tr><tr><td>女子<\/td><td>הַֽנַּעֲרָה<\/td><td>hannaarah<\/td><td>H5291<\/td><td>那少女<\/td><\/tr><tr><td>褻瀆<\/td><td>חַלֵּל<\/td><td>challel<\/td><td>H2490<\/td><td>使之被污、褻瀆<\/td><\/tr><tr><td>聖<\/td><td>קָדְשִֽׁי<\/td><td>qodshi<\/td><td>H6944<\/td><td>我的聖（名）<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>垂涎<\/strong>：הַשֹּׁאֲפִים 的字根 שׁאף 有「喘息、渴想」與「踐踏」兩種意思。各家：（一）和合本取「渴想」，意思是連窮人頭上的灰也要貪；（二）譯為「踐踏」，意思是把窮人的頭踩到塵土裡。兩種讀法都指向同一件事：對一個已經一無所有的人，還要再拿走。<\/p><p><strong>阻礙謙卑人的道路<\/strong>：原文直譯是「使謙卑人的道路彎曲」，把他們本來要走的路掰偏了，使他們求不到公平。<\/p><p><strong>同一個女子<\/strong>：原文是 הַנַּעֲרָה「那少女」，並沒有說她是誰、在什麼處境。各家有：（一）家中的僕婢或債務奴；（二）敬拜場所中的女子；（三）泛指受剝削的少女。本講義不替她補身分，只守住一件事：她是受傷害的人，不是被審判的人。<\/p>","exp":"<p>七節，罪名一個一個列出來。第一個：<strong>他們見窮人頭上所蒙的灰也都垂涎，阻礙謙卑人的道路。<\/strong>頭上蒙灰，是哀痛的記號。這樣一個人，已經失去了很多，只剩下頭上的灰。可是，有人看他，還是想再拿走什麼。這個「垂涎」，有的翻成「渴想」，有的翻成「踐踏」，兩種讀法，畫面都一樣：對一個已經一無所有的人，不留一點餘地。<\/p><p>接著：<strong>阻礙謙卑人的道路。<\/strong>原文是「使他們的道路彎曲」。一個人想走正路，想按著公平討一個說法，有人把那條路，掰彎了。受傷的人，常常不只是受傷，還發現，求助的路，也被堵住了。<\/p><p>第二個罪名，是一個很沉重的畫面：<strong>父子同一個女子行淫，褻瀆我的聖名。<\/strong>經文沒有說她是誰、在什麼處境，我們也不替她補身分。可以確定的是：這是一個沒有力量拒絕的人，被有力量的人，一再使用。神的話裡，沒有一個字，是責備她的。神說，這件事，是對我名字的褻瀆。換句話說：<strong>神把她所受的傷害，看成自己名字所受的羞辱。<\/strong>這句話，我們要慢慢念：神與被傷害的人，站在一起。<\/p>"},{"a":8,"z":8,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְעַל בְּגָדִים חֲבֻלִים יַטּוּ אֵצֶל כָּל מִזְבֵּחַ וְיֵין עֲנוּשִׁים יִשְׁתּוּ בֵּית אֱלֹהֵיהֶֽם׃<\/p><\/blockquote>","lit":"<blockquote><p>「他們在各壇旁鋪人所當的衣服，臥在其上，又在他們神的廟中喝受罰之人的酒。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>衣服<\/td><td>בְּגָדִים<\/td><td>begadim<\/td><td>H899<\/td><td>衣服<\/td><\/tr><tr><td>所當的<\/td><td>חֲבֻלִים<\/td><td>chavulim<\/td><td>H2254<\/td><td>被抵押的、作當頭的<\/td><\/tr><tr><td>壇<\/td><td>מִזְבֵּחַ<\/td><td>mizbeach<\/td><td>H4196<\/td><td>祭壇<\/td><\/tr><tr><td>酒<\/td><td>וְיֵין<\/td><td>veyein<\/td><td>H3196<\/td><td>酒<\/td><\/tr><tr><td>受罰之人<\/td><td>עֲנוּשִׁים<\/td><td>anushim<\/td><td>H6064<\/td><td>被罰款的人<\/td><\/tr><tr><td>廟<\/td><td>בֵּית<\/td><td>beit<\/td><td>H1004<\/td><td>家、殿、廟<\/td><\/tr><tr><td>他們的神<\/td><td>אֱלֹהֵיהֶֽם<\/td><td>elohehem<\/td><td>H430<\/td><td>他們的神<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>所當的衣服<\/strong>：חֲבֻלִים 指被拿作抵押的東西。律法規定，窮人若只有一件外衣作當頭，債主必須在日落前還給他，因為那是他蓋身的（出22:26--27）。這裡的畫面是：該還的沒有還。<\/p><p><strong>受罰之人的酒<\/strong>：עֲנוּשִׁים 是「被罰款的人」。各家：（一）用罰款換來的酒；（二）用罰款的錢買的酒；（三）被罰之人的名下所出的酒。三種讀法都指向：酒的來歷，是別人的損失。<\/p><p><strong>他們神的廟<\/strong>：是「他們」的神，不是「我」的神，語氣有距離。這節說的敬拜場所，各家有「各地的祭壇與廟」與「伯特利一帶」的不同取向；本講義不替它定一個地方，只讀它說的：這些事發生在敬拜的地方。<\/p>","exp":"<p>八節，罪名搬進了敬拜的地方。<strong>他們在各壇旁鋪人所當的衣服，臥在其上，又在他們神的廟中喝受罰之人的酒。<\/strong>「所當的衣服」，是窮人借貸時，押在債主手上的外衣。律法說，這件衣服，日落以先，要還給他，因為他只有這一件，是他蓋身睡覺用的（出22:26--27）。可是，他們沒有還，反而把它鋪在祭壇旁邊，躺在上面。<\/p><p>請你想像這個畫面：一件窮人晚上蓋身的衣服，在別人的腳下，成了享樂的墊子。那件衣服，也許在冷的夜裡，有人正在發抖。然後，是第二個畫面：<strong>在他們神的廟中喝受罰之人的酒。<\/strong>酒，是被罰款的人的酒；喝酒的地方，是神的廟。<\/p><p>這一節值得我們很誠實地看：<strong>他們沒有停止敬拜。<\/strong>祭壇還在，廟還在，他們還在那裡。問題不是他們不來，而是敬拜的地方，成了享受別人眼淚的地方。這不是在說敬拜不重要；是說，敬拜與公義，從來不是兩件事。神要的，是兩樣都有。（五章還會再說到這個題目，那裡有更完整的陳述。）<\/p>"},{"a":9,"z":10,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְאָנֹכִי הִשְׁמַדְתִּי אֶת הָֽאֱמֹרִי מִפְּנֵיהֶם אֲשֶׁר כְּגֹבַהּ אֲרָזִים גָּבְהוֹ וְחָסֹן הוּא כָּֽאַלּוֹנִים וָאַשְׁמִיד פִּרְיוֹ מִמַּעַל וְשָׁרָשָׁיו מִתָּֽחַת וְאָנֹכִי הֶעֱלֵיתִי אֶתְכֶם מֵאֶרֶץ מִצְרָיִם וָאוֹלֵךְ אֶתְכֶם בַּמִּדְבָּר אַרְבָּעִים שָׁנָה לָרֶשֶׁת אֶת אֶרֶץ הָאֱמֹרִֽי׃<\/p><\/blockquote>","lit":"<blockquote><p>「我從以色列人面前除滅亞摩利人。他雖高大如香柏樹，堅固如橡樹，我卻上滅他的果子，下絕他的根本。我也將你們從埃及地領上來，在曠野引導你們四十年，使你們得亞摩利人之地為業。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>我<\/td><td>וְאָנֹכִי<\/td><td>veanokhi<\/td><td>H595<\/td><td>我（強調的「我」）<\/td><\/tr><tr><td>除滅<\/td><td>הִשְׁמַדְתִּי<\/td><td>hishmadti<\/td><td>H8045<\/td><td>我除滅<\/td><\/tr><tr><td>亞摩利人<\/td><td>הָֽאֱמֹרִי<\/td><td>haemori<\/td><td>H567<\/td><td>亞摩利人<\/td><\/tr><tr><td>香柏樹<\/td><td>אֲרָזִים<\/td><td>arazim<\/td><td>H730<\/td><td>香柏樹<\/td><\/tr><tr><td>根本<\/td><td>וְשָׁרָשָׁיו<\/td><td>veshorashav<\/td><td>H8328<\/td><td>他的根<\/td><\/tr><tr><td>領上來<\/td><td>הֶעֱלֵיתִי<\/td><td>heelleiti<\/td><td>H5927<\/td><td>我領上來、使之上去<\/td><\/tr><tr><td>引導<\/td><td>וָאוֹלֵךְ<\/td><td>vaolekh<\/td><td>H3212<\/td><td>我使之行走、帶領<\/td><\/tr><tr><td>曠野<\/td><td>בַּמִּדְבָּר<\/td><td>bammidbar<\/td><td>H4057<\/td><td>曠野<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>我<\/strong>：九、十節各以 וְאָנֹכִי「而我」起頭。希伯來文動詞本身已含主詞，另加「我」字，是強調：是我，不是別人。<\/p><p><strong>亞摩利人<\/strong>：在聖經中，這個名稱有時專指一個民族，有時泛指迦南地的原住民（例如民21:24）；這裡取後者的意思，代表以色列進入應許地時，所面對的、看起來無法勝過的對手。<\/p><p><strong>領上來<\/strong>：הֶעֱלֵיתִי 的字根 עלה 是「上去、帶上來」，是出埃及的標準動詞，三章一節也用它。<\/p><p><strong>上滅他的果子，下絕他的根本<\/strong>：是上下通盤的說法，意思是從枝頭到根，沒有留下什麼；不必字面解成每一處都被除滅，是在強調對手的強盛與神的作為之間的差距。<\/p>","exp":"<p>九節，是一個大轉折。前面，是「他們做了什麼」；現在，換成「我做了什麼」。<strong>我從以色列人面前除滅亞摩利人。<\/strong>請你留意，這個句子，一開頭，就是一個強調的「我」。是我，不是你們的刀劍，不是你們的智慧。接著，經文用最強的樹，來描寫那個對手：<strong>他雖高大如香柏樹，堅固如橡樹，我卻上滅他的果子，下絕他的根本。<\/strong>香柏樹高，橡樹堅固；然而，神一句話，連根帶果，都不留。<\/p><p>十節，又是一個「我」：<strong>我也將你們從埃及地領上來，在曠野引導你們四十年，使你們得亞摩利人之地為業。<\/strong>你看這三個站：埃及、曠野、應許地。每一站的主詞，都是神。這是整本舊約，最核心的一句話：「我是耶和華－你的神，曾將你從埃及地為奴之家領出來。」（出20:2）以色列是從哪裡開始的？不是從強大開始，是從奴隸之家開始。他們自己，曾經是被壓的人。<\/p><p>這樣一對照，六到八節的話，就更重了：<strong>一群曾經被拯救的人，轉過身，賣了別人。<\/strong>神的提醒，不是在羞辱他們，是在叫他們想起：你站的地方，是誰領你上來的；你吃的飯，是誰給你的。摩西也曾這樣囑咐：「記念耶和華－你的神在曠野引導你這四十年」（申8:2）。<\/p>"},{"a":11,"z":12,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וָאָקִים מִבְּנֵיכֶם לִנְבִיאִים וּמִבַּחוּרֵיכֶם לִנְזִרִים הַאַף אֵֽין זֹאת בְּנֵי יִשְׂרָאֵל נְאֻם יְהוָֽה וַתַּשְׁקוּ אֶת הַנְּזִרִים יָיִן וְעַל הַנְּבִיאִים צִוִּיתֶם לֵאמֹר לֹא תִּנָּבְאֽוּ׃<\/p><\/blockquote>","lit":"<blockquote><p>「我從你們子弟中興起先知，又從你們少年人中興起拿細耳人。以色列人哪，不是這樣嗎？這是耶和華說的。你們卻給拿細耳人酒喝，囑咐先知說：不要說預言。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>興起<\/td><td>וָאָקִים<\/td><td>vaaqim<\/td><td>H6965<\/td><td>我興起、我立起<\/td><\/tr><tr><td>先知<\/td><td>לִנְבִיאִים<\/td><td>linviim<\/td><td>H5030<\/td><td>作先知<\/td><\/tr><tr><td>拿細耳人<\/td><td>לִנְזִרִים<\/td><td>linzirim<\/td><td>H5139<\/td><td>作拿細耳人（分別出來的人）<\/td><\/tr><tr><td>不是這樣嗎<\/td><td>הַאַף<\/td><td>haaf<\/td><td>H637<\/td><td>豈不是嗎（疑問詞）<\/td><\/tr><tr><td>耶和華說<\/td><td>נְאֻם<\/td><td>neum<\/td><td>H5002<\/td><td>神諭、耶和華說<\/td><\/tr><tr><td>給喝<\/td><td>וַתַּשְׁקוּ<\/td><td>vattashqu<\/td><td>H8248<\/td><td>你們使之喝<\/td><\/tr><tr><td>囑咐<\/td><td>צִוִּיתֶם<\/td><td>tsivvitem<\/td><td>H6680<\/td><td>你們命令<\/td><\/tr><tr><td>說預言<\/td><td>תִּנָּבְאֽוּ<\/td><td>tinnavu<\/td><td>H5012<\/td><td>你們不可說預言<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>拿細耳人<\/strong>：נָזִיר 的意思是「分別出來的人」，是民數記六章的特別誓願：不喝清酒濃酒，不剃頭髮，不碰死屍，把自己整個分別歸耶和華。讓他喝酒，就是誘他破壞誓願。<\/p><p><strong>不是這樣嗎<\/strong>：הַאַף 是問句的語氣詞，神在這裡問，等聽眾回答。這個問句，也是耶和華說（נְאֻם）的一部分，這個字在本章十一、十六節各出現一次，是全卷書追蹤的「耶和華說」。<\/p><p><strong>不要說預言<\/strong>：תִּנָּבְאוּ 是否定命令。使動動詞「給喝」（וַתַּשְׁקוּ）與「囑咐」（צִוִּיתֶם），一個用誘惑，一個用命令，兩者的受詞，都是神所興起的人。<\/p>","exp":"<p>十一節，神給的，不只是土地，還有人。<strong>我從你們子弟中興起先知，又從你們少年人中興起拿細耳人。<\/strong>先知，是神的話的口；拿細耳人，是神把一個人整個分別出來，作活的見證（民6）。請你留意「從你們子弟中」：神沒有從別的地方借人，祂從你們自己的孩子裡、自己的年輕人裡，興起來。這是恩典的親近：神把祂的呼召，放在你們家門口。<\/p><p>然後，神問了一個問題：<strong>以色列人哪，不是這樣嗎？這是耶和華說的。<\/strong>這個「這是耶和華說的」，是追蹤字（נְאֻם），在這一章，十一節一次，十六節一次，像一個括號，把這一段包起來。神在這裡，沒有直接定罪，神先問：事實是不是這樣？我給你們的，是不是這樣？祂留了一個空間，讓人回答。<\/p><p>可是，十二節，是回答：<strong>你們卻給拿細耳人酒喝，囑咐先知說：不要說預言。<\/strong>「卻」這個字，很痛。神興起的人，他們卻用兩種方法，讓他失去聲音：一個，是誘惑，給拿細耳人酒喝，叫他破壞自己的分別；一個，是命令，叫先知閉嘴。<strong>這是他們對神的話的態度。<\/strong>所以，七、八節的罪，與十二節的罪，不是兩件事：把窮人賣了的人，也把神的話，從嘴上拿掉。<\/p>"},{"a":13,"z":16,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הִנֵּה אָנֹכִי מֵעִיק תַּחְתֵּיכֶם כַּאֲשֶׁר תָּעִיק הָעֲגָלָה הַֽמְלֵאָה לָהּ עָמִֽיר וְאָבַד מָנוֹס מִקָּל וְחָזָק לֹא יְאַמֵּץ כֹּחוֹ וְגִבּוֹר לֹא יְמַלֵּט נַפְשֽׁוֹ וְתֹפֵשׂ הַקֶּשֶׁת לֹא יַעֲמֹד וְקַל בְּרַגְלָיו לֹא יְמַלֵּט וְרֹכֵב הַסּוּס לֹא יְמַלֵּט נַפְשֽׁוֹ וְאַמִּיץ לִבּוֹ בַּגִּבּוֹרִים עָרוֹם יָנוּס בַּיּוֹם הַהוּא נְאֻם יְהוָֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「看哪，在你們所住之地，我必壓你們，如同裝滿禾捆的車壓物一樣。快跑的不能逃脫；有力的不能用力；剛勇的也不能自救。拿弓的不能站立；腿快的不能逃脫；騎馬的也不能自救。到那日，勇士中最有膽量的，必赤身逃跑。這是耶和華說的。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>壓<\/td><td>מֵעִיק<\/td><td>meiq<\/td><td>H5781<\/td><td>壓、使之吱嘎作響<\/td><\/tr><tr><td>車<\/td><td>הָעֲגָלָה<\/td><td>haagalah<\/td><td>H5699<\/td><td>那輛車<\/td><\/tr><tr><td>禾捆<\/td><td>עָמִֽיר<\/td><td>amir<\/td><td>H5995<\/td><td>禾捆、割下的穀<\/td><\/tr><tr><td>逃脫<\/td><td>מָנוֹס<\/td><td>manos<\/td><td>H4498<\/td><td>逃跑、逃路<\/td><\/tr><tr><td>自救<\/td><td>יְמַלֵּט<\/td><td>yemallet<\/td><td>H4422<\/td><td>他救脫（性命）<\/td><\/tr><tr><td>剛勇<\/td><td>וְגִבּוֹר<\/td><td>vegibbor<\/td><td>H1368<\/td><td>勇士、剛勇的人<\/td><\/tr><tr><td>赤身<\/td><td>עָרוֹם<\/td><td>arom<\/td><td>H6174<\/td><td>赤身、裸露<\/td><\/tr><tr><td>逃跑<\/td><td>יָנוּס<\/td><td>yanus<\/td><td>H5127<\/td><td>逃跑<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>壓<\/strong>：מֵעִיק 的意思不確定。各家：（一）和合本取「壓」，如同裝滿禾捆的車壓過去；（二）有人譯為「使你們的地下沉、吱嘎作響」，如同裝滿禾捆的車發出吱嘎聲；（三）把車看作被壓的一方，意思是「我要被你們壓得吱嘎作響」。三種讀法，都共有「沉重、承受不住」的意思；和合本的讀法，是最常見的一種。<\/p><p><strong>自救<\/strong>：原文 נַפְשׁוֹ 是「他的性命」，「救自己的性命」，是成語，也就是「逃脫自己的性命」。<\/p><p><strong>到那日<\/strong>：「那日」是指神審判臨到的時刻，經文沒有給任何日期，本講義不推算，也不把它套用到今日任何事件。<\/p>","exp":"<p>十三節，審判的宣告：<strong>看哪，在你們所住之地，我必壓你們，如同裝滿禾捆的車壓物一樣。<\/strong>這個動詞，原文並不好確定，有人讀為「壓」，有人讀為「使地吱嘎作響」；無論是哪一種，畫面都是沉重，沉重得承受不住。請你留意「在你們所住之地」：不是別的地方，是他們自己的家園。他們所倚靠的土地，成了壓下來的重量。<\/p><p>十四到十六節，是一份很長的清單。快跑的、有力的、剛勇的；拿弓的、腿快的、騎馬的；勇士中最有膽量的。這一份清單，是一個民族最倚靠的力量：速度、力氣、武器、膽量。每一個「不能」，像一塊一塊，把人心裡的依靠，拆掉了：<strong>快跑的不能逃脫，有力的不能用力，剛勇的也不能自救。<\/strong>重點不是戰場上發生了什麼，而是：人所靠的，在神的審判面前，沒有一樣是夠的。<\/p><p>最後，<strong>到那日，勇士中最有膽量的，必赤身逃跑。<\/strong>「赤身」，連衣服也顧不上。我們不下定論，卻不能不注意：八節裡，他們把窮人所當的衣服，鋪在壇旁；到了這裡，最有膽量的人，連自己的衣服，也沒有了。經文沒有說這是巧合，也沒有說這是對應，我們只是讀著，心裡有一點發涼。<\/p><p>最後一句：<strong>這是耶和華說的。<\/strong>這一章，從「耶和華如此說」開始，也以「這是耶和華說的」結束。這個字，不是為了嚇人，是為了叫人今天就聽見，今天就轉身：不等到審判臨到，才發現自己沒有一樣可靠。<\/p>"}],"3":[{"a":1,"z":1,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>שִׁמְעוּ אֶת הַדָּבָר הַזֶּה אֲשֶׁר דִּבֶּר יְהוָה עֲלֵיכֶם בְּנֵי יִשְׂרָאֵל עַל כָּל הַמִּשְׁפָּחָה אֲשֶׁר הֶעֱלֵיתִי מֵאֶרֶץ מִצְרַיִם לֵאמֹֽר׃<\/p><\/blockquote>","lit":"<blockquote><p>「以色列人哪，你們全家是我從埃及地領上來的，當聽耶和華攻擊你們的話：」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>當聽<\/td><td>שִׁמְעוּ<\/td><td>shimu<\/td><td>H8085<\/td><td>你們要聽、留心聽從<\/td><\/tr><tr><td>話<\/td><td>הַדָּבָר<\/td><td>haddavar<\/td><td>H1697<\/td><td>這話、這個信息<\/td><\/tr><tr><td>攻擊你們<\/td><td>עֲלֵיכֶם<\/td><td>alekhem<\/td><td>H5921<\/td><td>對著你們、關於你們<\/td><\/tr><tr><td>全家<\/td><td>הַמִּשְׁפָּחָה<\/td><td>hamishpachah<\/td><td>H4940<\/td><td>整個家族<\/td><\/tr><tr><td>領上來<\/td><td>הֶעֱלֵיתִי<\/td><td>heelleti<\/td><td>H5927<\/td><td>我領上來、我使之上去<\/td><\/tr><tr><td>埃及<\/td><td>מִצְרַיִם<\/td><td>mitsrayim<\/td><td>H4714<\/td><td>埃及<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>當聽（shimu）<\/strong>：複數命令式，是對一整群人下的命令。這個字是全卷書的追蹤字之一，本章第一次出現在這裡，第二次在13節。<strong>蒙揀選的人，第一件事是聽。<\/strong><\/p><p><strong>攻擊你們（alekhem）<\/strong>：原文是介系詞 עַל（al），基本意思是「在……之上、對著、關於」，和合本取「攻擊」，也可以譯作「對你們說的」。本講義取和合本的重音：這是帶著審判分量、對自己百姓說的話，不是對外邦說的。<\/p><p><strong>全家（mishpachah）<\/strong>：指從埃及領上來的整個家族。這裡的範圍，學者有不同看法：有人主張只指北國以色列，有人主張包括南北兩國。本講義的判斷是：話是向北國發出的，但「全家」這個詞提醒我們，出埃及的恩典，屬於整個約民。<\/p>","exp":"<p>三章一節，像一個父親把全家叫到面前，第一句話就是：<strong>你們要聽。<\/strong>阿摩司書前兩章，先審判了周圍的列國，一路說到猶大與以色列；現在，從三章起，神單單對自己的百姓說話。<strong>請你留意，神說的是「攻擊你們的話」，不是攻擊別人的話。<\/strong><\/p><p>神提醒他們的第一件事，不是他們的罪，是自己的恩典：<strong>你們全家，是我從埃及地領上來的。<\/strong>這是以色列人最熟悉的一句話，是他們每年節期都會重述的故事。神沒有忘記，先把這個關係放在前面：我是那位領你們上來的神，你們是被我領上來的人。<\/p><p>所以，這一節的次序，非常要緊：<strong>先有恩典，然後才有話。<\/strong>神先說「我領你們上來」，才說「當聽我攻擊你們的話」。這不是一位陌生的審判官，在遠處宣判；這是一位把你從奴役裡背出來的神，走近你，對你說難聽的話。<\/p><p>「當聽」這個字，在整卷書裡，一再迴響。蒙揀選的人，第一個功課，不是做更多事，是先把耳朵打開。本章的另一次「當聽」，在13節，是對先知與聽見的人說的。<strong>被愛過的人，最容易以為自己不需要再聽。<\/strong><\/p>"},{"a":2,"z":2,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>רַק אֶתְכֶם יָדַעְתִּי מִכֹּל מִשְׁפְּחוֹת הָאֲדָמָה עַל כֵּן אֶפְקֹד עֲלֵיכֶם אֵת כָּל עֲוֺנֹֽתֵיכֶֽם׃<\/p><\/blockquote>","lit":"<blockquote><p>「在地上萬族中，我只認識你們；因此，我必追討你們的一切罪孽。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>只<\/td><td>רַק<\/td><td>raq<\/td><td>H7535<\/td><td>惟獨、只有<\/td><\/tr><tr><td>認識<\/td><td>יָדַעְתִּי<\/td><td>yadati<\/td><td>H3045<\/td><td>我認識、我深知<\/td><\/tr><tr><td>萬族<\/td><td>מִשְׁפְּחוֹת<\/td><td>mishpechot<\/td><td>H4940<\/td><td>各家族、各族<\/td><\/tr><tr><td>因此<\/td><td>כֵּן<\/td><td>ken<\/td><td>H3651<\/td><td>因此、所以<\/td><\/tr><tr><td>追討<\/td><td>אֶפְקֹד<\/td><td>efqod<\/td><td>H6485<\/td><td>我要查訪、追討<\/td><\/tr><tr><td>罪孽<\/td><td>עֲוֺנֹֽתֵיכֶֽם<\/td><td>avonoteikhem<\/td><td>H5771<\/td><td>罪孽、扭曲的行為<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>認識（yadati）<\/strong>：這個動詞在聖經裡，常常不是「知道某人的資料」，而是兩個人之間有關係的、有委身的認識；用在神與百姓之間，是立約的、揀選的認識（參創18:19用同一個字，講神認識亞伯拉罕）。<strong>神說「只認識你們」，不是說神不知道別的民族，而是說，只有這一群人，神把他們放進了約的關係裡。<\/strong><\/p><p><strong>追討（efqod）<\/strong>：這個動詞的基本意思是「查訪、察看」，可以是施恩的眷顧（創21:1），也可以是審判的追討（本節）。同一個字在14節再出現兩次。<strong>它的意思是：神親自來查，沒有略過。<\/strong><\/p><p><strong>只（raq）<\/strong>：「惟獨」。這個字放在句首，把整句話的重心，壓在「你們」身上。<\/p>","exp":"<p>二節是整章的鑰匙：<strong>在地上萬族中，我只認識你們；因此，我必追討你們的一切罪孽。<\/strong>這一句，有兩個半句，中間，是「因此」。<\/p><p>前半句，聽起來是天大的榮耀：<strong>地上萬族，神只認識你們。<\/strong>這個「認識」，是一個很親密的字，是父親認識孩子、丈夫認識妻子的那種認識。申命記7:6--8，摩西對以色列人說，神揀選他們，不是因為人數多，而是因為神愛他們。阿摩司沒有否認這件事，他把它說得更重。<\/p><p>可是，後半句，卻是聽眾沒有料到的：<strong>因此，我必追討。<\/strong>他們以為，被認識，就等於被保護；神說，被認識，就等於被追討。這個「因此」，是整卷書最讓人停下來的連接詞：<strong>正因為只有你們被我認識，我才不能對你們的罪，視而不見。<\/strong><\/p><p>請你這樣想：一個陌生人的孩子，在街上闖了禍，我們多半嘆一口氣，走開了；自己的孩子，闖了同樣的禍，我們不能走開。這不是神變得苛刻，而是愛，認真起來了。箴言3:12、希伯來書12:6，都說，主所愛的，他必管教。這使我們想起：<strong>被愛與被追討，在神那裡，不是兩件事。<\/strong><\/p><p>我們也要小心：這一節不是用來嚇唬任何人，更不是說，神在找機會懲罰你。阿摩司的聽眾，是一群一再離開約的人；二節是對他們的話。對今天的我們，它要問的，是一個比較安靜的問題：<strong>被神這樣認識的人，要怎樣活？<\/strong><\/p>"},{"a":3,"z":5,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הֲיֵלְכוּ שְׁנַיִם יַחְדָּו בִּלְתִּי אִם נוֹעָֽדוּ הֲיִשְׁאַג אַרְיֵה בַּיַּעַר וְטֶרֶף אֵין לוֹ הֲיִתֵּן כְּפִיר קוֹלוֹ מִמְּעֹנָתוֹ בִּלְתִּי אִם לָכָֽד הֲתִפֹּל צִפּוֹר עַל פַּח הָאָרֶץ וּמוֹקֵשׁ אֵין לָהּ הֲיַֽעֲלֶה פַּח מִן הָאֲדָמָה וְלָכוֹד לֹא יִלְכּֽוֹד׃<\/p><\/blockquote>","lit":"<blockquote><p>「二人若不同心，豈能同行呢？獅子若非抓食，豈能在林中咆哮呢？少壯獅子若無所得，豈能從洞中發聲呢？若沒有機檻，雀鳥豈能陷在網羅裡呢？網羅若無所得，豈能從地上翻起呢？」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>同行<\/td><td>הֲיֵלְכוּ<\/td><td>hayelkhu<\/td><td>H3212<\/td><td>豈能行走（疑問）<\/td><\/tr><tr><td>約定<\/td><td>נוֹעָֽדוּ<\/td><td>noadu<\/td><td>H3259<\/td><td>約定、約好相會<\/td><\/tr><tr><td>咆哮<\/td><td>הֲיִשְׁאַג<\/td><td>hayishag<\/td><td>H7580<\/td><td>豈能吼叫（疑問）<\/td><\/tr><tr><td>抓食<\/td><td>לָכָֽד<\/td><td>lakhad<\/td><td>H3920<\/td><td>捕捉、抓住<\/td><\/tr><tr><td>網羅<\/td><td>פַּח<\/td><td>pach<\/td><td>H6341<\/td><td>網羅、陷阱<\/td><\/tr><tr><td>機檻<\/td><td>וּמוֹקֵשׁ<\/td><td>umokesh<\/td><td>H4170<\/td><td>機檻、誘捕的機關<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>同心（noadu）<\/strong>：和合本譯「同心」，原文這個動詞（yaad 的反身形）的基本意思，是「約定、約好見面」，不是「情感上一樣」。意思是：兩個人若沒有事先約好，豈能走在一起？<strong>所以「二人若不同心，豈能同行」，更貼近原文的意思是：沒有約定，就不會走在同一條路上。<\/strong><\/p><p><strong>豈能（ha-）<\/strong>：這三節的問句，都以疑問詞 ה（ha）起頭，預期的答案都是「不能」。從三節到六節，一共有七個這樣的反問，和合本譯作「豈能」「豈不」「豈非」。<\/p><p><strong>機檻與網羅<\/strong>：5節的 פַּח（pach）是網羅，מוֹקֵשׁ（mokesh）是誘捕鳥雀的機關。兩個字都是獵人的用語，描寫的是：事情的發生，背後有布置。<\/p>","exp":"<p>三到五節，連續五個問句，每一個，都是田野與山林裡人人看得懂的事。<strong>二人若不同心，豈能同行呢？<\/strong>兩個人走在同一條路上，必是先有約定。<strong>獅子若非抓食，豈能在林中咆哮呢？<\/strong>獅子在林中吼叫，必是已經有了獵物。<strong>若沒有機檻，雀鳥豈能陷在網羅裡呢？<\/strong>鳥陷在網羅裡，必是有人先設了機關。<\/p><p>這些問題，沒有一個是難題，每一個答案，都是「不會」。阿摩司是一位牧人，是一位修理桑樹的人，他熟悉這些事。他不是用高深的神學，是用生活的常識，把一條道理，一步一步，帶到聽眾面前：<strong>事情的發生，後面有原因；有果，必有因。<\/strong><\/p><p>請你留意，他沒有一開始就說「神要審判你們」，他先問，兩個人怎麼同行？這個問題，也是在悄悄問聽眾：你們以為，你們與神，在同一條路上嗎？神與他們有約，他們也聲稱與神同行；可是，二節才剛說，神要追討他們的罪孽。<strong>若沒有彼此的約定與順服，怎麼談得上同行？<\/strong><\/p><p>我們不要把這一節，講成一句溫暖的婚姻金句，或一句團隊標語。經文的重點，不是我們彼此要相同，而是：<strong>與神同行，需要神所定的約，也需要人的順服。<\/strong>同行的前提，是有約定；有了約定，才有同行。<\/p>"},{"a":6,"z":6,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>אִם יִתָּקַע שׁוֹפָר בְּעִיר וְעָם לֹא יֶחֱרָדוּ אִם תִּהְיֶה רָעָה בְּעִיר וַיהוָה לֹא עָשָֽׂה׃<\/p><\/blockquote>","lit":"<blockquote><p>「城中若吹角，百姓豈不驚恐呢？災禍若臨到一城，豈非耶和華所降的嗎？」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>角<\/td><td>שׁוֹפָר<\/td><td>shofar<\/td><td>H7782<\/td><td>羊角號、警報的號角<\/td><\/tr><tr><td>吹<\/td><td>יִתָּקַע<\/td><td>yitaqa<\/td><td>H8628<\/td><td>被吹響<\/td><\/tr><tr><td>城<\/td><td>בְּעִיר<\/td><td>beir<\/td><td>H5892<\/td><td>在城中<\/td><\/tr><tr><td>驚恐<\/td><td>יֶחֱרָדוּ<\/td><td>yecheradu<\/td><td>H2729<\/td><td>顫抖、驚惶<\/td><\/tr><tr><td>災禍<\/td><td>רָעָה<\/td><td>raah<\/td><td>H7451<\/td><td>災禍、禍患<\/td><\/tr><tr><td>降<\/td><td>עָשָֽׂה<\/td><td>asah<\/td><td>H6213<\/td><td>做、行、成就<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>災禍（raah）<\/strong>：這個字很寬，可以指「邪惡」，也可以指「災難、禍患」。在這一節的上下文，指的是「臨到一城的災難」，不是在說神作惡。<strong>這個字在這裡是災禍，不是道德上的惡。<\/strong><\/p><p><strong>豈非耶和華所降（YHWH lo asah）<\/strong>：原文是「耶和華沒有做嗎？」，動詞是 עשׂה（asah，做）。意思是：這樣一場臨到城中的災禍，耶和華豈沒有在其中行事嗎？本講義的判斷：這一節的主題，是神在審判的事上掌權，並且事前有警告，不是在為每一場災難，下一個因果的註解。<\/p><p><strong>角（shofar）<\/strong>：羊角做的號角，在以色列，用來召集、警告，也用在戰爭來臨的時候。<\/p>","exp":"<p>六節，這一對問句，把整串問題，帶到了一個更沉重的地方：<strong>城中若吹角，百姓豈不驚恐呢？災禍若臨到一城，豈非耶和華所降的嗎？<\/strong><\/p><p>前半句，仍是生活的常識：城裡響起號角，是敵人來了，是警報，全城的人，都會顫抖。沒有人聽見角聲，還安然坐著。<strong>警報響起，是為了讓人行動。<\/strong><\/p><p>後半句，則是一個很重的宣告：災禍臨到一城，豈不是耶和華所降嗎？請你特別留意這一句的使用範圍。<strong>這是在先知的話語之下，對神的約民所說的：神已經事先警告了，若災禍來臨，不要說是偶然。<\/strong>它不是在說，今天世上每一場災難、每一場疾病、每一個意外，都是神針對某一個人、某一座城所降的審判。耶穌在路加福音十三章，特別糾正過這種想法。<\/p><p>所以，我們讀這一節，要先放慢。<strong>對正在災難裡受苦的人，我們不用這節經文，去解釋他們的苦；我們先陪伴，先關心。<\/strong>阿摩司說這句話的對象，是一群被神提醒了又提醒、卻仍不肯回頭的約民。對今日的我們，這句話的重點，是兩個：神是掌權的神；神在審判之前，先給警報。<\/p>"},{"a":7,"z":7,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>כִּי לֹא יַעֲשֶׂה אֲדֹנָי יְהוִה דָּבָר כִּי אִם גָּלָה סוֹדוֹ אֶל עֲבָדָיו הַנְּבִיאִֽים׃<\/p><\/blockquote>","lit":"<blockquote><p>「主耶和華若不將奧祕指示他的僕人－眾先知，就一無所行。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>主<\/td><td>אֲדֹנָי<\/td><td>adonai<\/td><td>H136<\/td><td>主<\/td><\/tr><tr><td>耶和華<\/td><td>יְהוִה<\/td><td>yhwh<\/td><td>H3069<\/td><td>耶和華（與「主」並用）<\/td><\/tr><tr><td>奧祕<\/td><td>סוֹדוֹ<\/td><td>sodo<\/td><td>H5475<\/td><td>祕密商議、親密的話<\/td><\/tr><tr><td>指示<\/td><td>גָּלָה<\/td><td>galah<\/td><td>H1540<\/td><td>揭開、顯露<\/td><\/tr><tr><td>僕人<\/td><td>עֲבָדָיו<\/td><td>avadav<\/td><td>H5650<\/td><td>他的僕人們<\/td><\/tr><tr><td>先知<\/td><td>הַנְּבִיאִֽים<\/td><td>hannevim<\/td><td>H5030<\/td><td>先知們<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>奧祕（sod）<\/strong>：這個字，基本意思是「一群人坐在一起的密談」，後來引申為「親密的交談」「祕密的商議」。耶利米書23:18、22用同一個字，講真先知是「站在耶和華的會中」的人。<strong>神把自己的心意，像向朋友一樣，向僕人們敞開。<\/strong><\/p><p><strong>指示（galah）<\/strong>：基本意思是「揭開、顯露」。意思是：神不是把話藏起來，是把話打開。<\/p><p><strong>一無所行（lo yaaseh davar）<\/strong>：和合本的「一無所行」，直譯是「不做一件事」。這一節是一句條件句：「若不先……，就不做一件事。」學者對它的範圍有不同看法：有人解為神的每一件事，都必先啟示；有人解為，這裡專指神的審判行動，必先藉先知警告。本講義取後者：這一節講的，是神在審判約民之前，總先藉僕人說話。<\/p>","exp":"<p>七節是三到八節這一段的中心：<strong>主耶和華若不將奧祕指示他的僕人，眾先知，就一無所行。<\/strong>前面的反問，一路是在說「有因必有果」；到了七節，阿摩司把這個道理，轉向了神自己：神也不是無緣無故地行事。<\/p><p>這一節，有一個很溫柔的字：「奧祕」。這個字的畫面，是一群人坐在一起，說著知心的話。神對先知，不是把命令丟在桌上就走，而是像向朋友一樣，把心意打開。<strong>這是一位願意讓人知道祂心意的神。<\/strong>耶穌在約翰福音15:15說：我不再稱你們為僕人，我乃稱你們為朋友；因我從我父所聽見的，已經都告訴你們了。這使我們想起，神從來不是一位隱藏心意的神。<\/p><p>在這一節的上下文裡，這句話是有分量的：神事先藉先知警告了。他們不能說，沒有人告訴我們。這是一種恩典：審判之前，先有話語。<strong>神不是在暗處設網的獵人，是在城門口吹角的守望者。<\/strong><\/p><p>我們也要小心，不要把這一節，讀成一條預測的公式，以為只要有人說「神向我啟示」，就是先知；也不要讀成，神的每一個作為，都有人先知道。經文的重點，不在人知道多少，而在神的本性：<strong>神是說話的神，祂的話，先於祂的手。<\/strong>真僕人的記號，是他在說神說過的話。<\/p>"},{"a":8,"z":8,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>אַרְיֵה שָׁאָג מִי לֹא יִירָא אֲדֹנָי יְהוִה דִּבֶּר מִי לֹא יִנָּבֵֽא׃<\/p><\/blockquote>","lit":"<blockquote><p>「獅子吼叫，誰不懼怕呢？主耶和華發命，誰能不說預言呢？」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>獅子<\/td><td>אַרְיֵה<\/td><td>aryeh<\/td><td>H738<\/td><td>獅子<\/td><\/tr><tr><td>吼叫<\/td><td>שָׁאָג<\/td><td>shaag<\/td><td>H7580<\/td><td>吼叫<\/td><\/tr><tr><td>懼怕<\/td><td>יִירָא<\/td><td>yira<\/td><td>H3372<\/td><td>懼怕、敬畏<\/td><\/tr><tr><td>發命<\/td><td>דִּבֶּר<\/td><td>dibber<\/td><td>H1696<\/td><td>說話、發言<\/td><\/tr><tr><td>說預言<\/td><td>יִנָּבֵֽא<\/td><td>yinnave<\/td><td>H5012<\/td><td>被迫說預言、說神的話<\/td><\/tr><tr><td>誰<\/td><td>מִי<\/td><td>mi<\/td><td>H4310<\/td><td>誰（反問）<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>說預言（yinnave）<\/strong>：這個動詞是 נבא（nava）的反身形，意思是「作先知、說神的話」。<strong>「誰能不說預言呢」，原文的問句，是「誰能不作先知？」，帶著不得不說的意思。<\/strong><\/p><p><strong>發命（dibber）<\/strong>：和合本譯「發命」，原文是一般的「說話」。這個字在1節出現過：「耶和華……所說（dibber）的」。這裡用的是同一個字，把神的「說」，與先知的「說」，一前一後，連在一起。<\/p><p><strong>懼怕（yira）<\/strong>：同一個字根，可以是「怕」，也可以是「敬畏」。獅子吼叫，人懼怕；神說話，人當怎樣？<\/p>","exp":"<p>八節，是這一段，最漂亮的收尾：<strong>獅子吼叫，誰不懼怕呢？主耶和華發命，誰能不說預言呢？<\/strong>這是兩個並排的句子，一個在林中，一個在先知的心裡。<\/p><p>獅子一吼，是整座森林都靜下來的聲音，沒有人會問，這吼聲是什麼意思。阿摩司說，神的說話，也是這樣：祂開口，就沒有人能夠，假裝沒有聽見。<strong>聽見的人，不能不說。<\/strong><\/p><p>這個「不能不說」，不是先知的才華，也不是他的性格。<strong>他不是因為喜歡說話，也不是為了出名；他是被神的話抓住了，不得不說。<\/strong>後來新約的使徒，也說過類似的話：使徒行傳4:20，彼得與約翰說，我們所看見所聽見的，不能不說；保羅在哥林多前書9:16說，若不傳福音，我便有禍了。這使我們想起，被神的話抓住的人，常常有同一個記號。<\/p><p>請你注意一個細節：「誰不懼怕」與「誰能不說」，是並排的。<strong>懼怕神的人，才有話可說；不懼怕神的人，說出來的，只是自己的話。<\/strong>這一段從三節走到八節，七個問句，繞了一圈，最後落在一件事上：神說了話，先知說話，百姓要聽。這就把我們帶回一節那句：<strong>當聽。<\/strong><\/p>"},{"a":9,"z":10,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הַשְׁמִיעוּ עַל אַרְמְנוֹת בְּאַשְׁדּוֹד וְעַֽל אַרְמְנוֹת בְּאֶרֶץ מִצְרָיִם וְאִמְרוּ הֵאָֽסְפוּ עַל הָרֵי שֹׁמְרוֹן וּרְאוּ מְהוּמֹת רַבּוֹת בְּתוֹכָהּ וַעֲשׁוּקִים בְּקִרְבָּֽהּ וְלֹֽא יָדְעוּ עֲשׂוֹת נְכֹחָה נְאֻם יְהוָה הָאֽוֹצְרִים חָמָס וָשֹׁד בְּאַרְמְנֽוֹתֵיהֶֽם׃<\/p><\/blockquote>","lit":"<blockquote><p>「要在亞實突的宮殿中和埃及地的宮殿裡傳揚說：你們要聚集在撒馬利亞的山上，就看見城中有何等大的擾亂與欺壓的事。那些以強暴搶奪財物、積蓄在自己家中的人不知道行正直的事。這是耶和華說的。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>傳揚<\/td><td>הַשְׁמִיעוּ<\/td><td>hashmiu<\/td><td>H8085<\/td><td>使人聽見、宣告<\/td><\/tr><tr><td>宮殿<\/td><td>אַרְמְנוֹת<\/td><td>armenot<\/td><td>H759<\/td><td>堅固的宮殿、高樓<\/td><\/tr><tr><td>擾亂<\/td><td>מְהוּמֹת<\/td><td>mehumot<\/td><td>H4103<\/td><td>混亂、騷動<\/td><\/tr><tr><td>欺壓<\/td><td>וַעֲשׁוּקִים<\/td><td>vaashuqim<\/td><td>H6217<\/td><td>被欺壓的人、受壓榨的事<\/td><\/tr><tr><td>正直<\/td><td>נְכֹחָה<\/td><td>nekochah<\/td><td>H5229<\/td><td>正直、坦蕩、直的事<\/td><\/tr><tr><td>耶和華說<\/td><td>נְאֻם<\/td><td>neum<\/td><td>H5002<\/td><td>神諭、耶和華宣告<\/td><\/tr><tr><td>強暴<\/td><td>חָמָס<\/td><td>chamas<\/td><td>H2555<\/td><td>暴力、不義的強取<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>傳揚（hashmiu）<\/strong>：這個字的字根與「聽」（shamaʿ）相同，是使役形，意思是「使人聽見」。整卷書追蹤的「聽」字，在這裡以另一種形態出現：<strong>先知要讓外邦的宮殿聽見。<\/strong><\/p><p><strong>擾亂與欺壓（mehumot、ashuqim）<\/strong>：前一個字，是混亂與恐慌；後一個字，是被壓榨的人，或壓榨的行為。原文是複數，意思是這不是一件，是一整個城市裡一再發生的事。<\/p><p><strong>不知道行正直的事（lo yadu asot nekochah）<\/strong>：用的是「知道（yada）」這個字，與二節「我只認識你們」是同一個動詞。<strong>神認識他們，他們卻不認識什麼是正直。<\/strong>這個字的選擇，把兩節連在一起。<\/p><p><strong>這是耶和華說的（neum YHWH）<\/strong>：全卷的追蹤字，在本章第一次出現在10節，表示這是神自己的宣告。<\/p>","exp":"<p>九節，聲音忽然轉向。神要先知，不是對撒馬利亞的人說，而是對<strong>亞實突的宮殿，與埃及地的宮殿<\/strong>傳揚。亞實突是非利士人的城，埃及，是以色列人當年的為奴之家。神叫這兩處的人，聚集到撒馬利亞的山上，來看：<strong>城中有何等大的擾亂與欺壓的事。<\/strong><\/p><p>這是一個令人心酸的畫面：神的百姓，在自己的京城裡，做出連外邦人看了，都要皺眉的事。這裡，不是在鼓勵外邦人羞辱以色列；它的重點，是：神的百姓，把約的標準，丟得太遠，遠到需要別人來作見證。<\/p><p>十節，說明了這個擾亂的內容：<strong>那些以強暴搶奪財物、積蓄在自己家中的人，不知道行正直的事。這是耶和華說的。<\/strong>請你留意「不知道」這三個字。它不是說，他們有時做錯；是說，他們已經失去了分辨什麼是正直的敏銳。他們心裡，不再有一把直尺。<\/p><p>在這裡，我們必須先站在被欺壓的人那一邊。<strong>經文說的「欺壓」，背後是一個一個真實的人：被奪去財物的人，被壓榨的人，沒有力量說話的人。<\/strong>神在這裡看見了，並且親自說話。如果你是受過欺壓的人，這一節要先告訴你：神看見了；你受的，不是理所當然的。至於那些行強暴的人，經文的重點，是神要追討；我們不在這裡，替神指名某一個人。<\/p><p>「這是耶和華說的」，是神自己在這個控訴上，簽了名。<\/p>"},{"a":11,"z":11,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>לָכֵן כֹּה אָמַר אֲדֹנָי יְהוִה צַר וּסְבִיב הָאָרֶץ וְהוֹרִד מִמֵּךְ עֻזֵּךְ וְנָבֹזּוּ אַרְמְנוֹתָֽיִךְ׃<\/p><\/blockquote>","lit":"<blockquote><p>「所以主耶和華如此說：敵人必來圍攻這地，使你的勢力衰微，搶掠你的家宅。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>所以<\/td><td>לָכֵן<\/td><td>lakhen<\/td><td>H3651<\/td><td>因此、所以<\/td><\/tr><tr><td>敵人<\/td><td>צַר<\/td><td>tsar<\/td><td>H6862<\/td><td>敵人、困厄<\/td><\/tr><tr><td>圍攻<\/td><td>וּסְבִיב<\/td><td>usviv<\/td><td>H5439<\/td><td>環繞、四面<\/td><\/tr><tr><td>衰微<\/td><td>וְהוֹרִד<\/td><td>vehorid<\/td><td>H3381<\/td><td>使下降、使衰微<\/td><\/tr><tr><td>勢力<\/td><td>עֻזֵּךְ<\/td><td>uzzekh<\/td><td>H5797<\/td><td>你的力量、你的堅固<\/td><\/tr><tr><td>搶掠<\/td><td>וְנָבֹזּוּ<\/td><td>venavozu<\/td><td>H962<\/td><td>被搶掠<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>所以（lakhen）<\/strong>：這是先知書裡，把「控訴」轉成「宣判」的典型連接詞。<strong>十節的控訴，與十一節的宣判，只隔一個「所以」。<\/strong><\/p><p><strong>敵人（tsar）與圍攻（saviv）<\/strong>：原文的句子，很簡短，大致是「敵人，環繞這地」，沒有指名是哪一個國家。<strong>本講義不替經文補上名字，也不替它定下時間。<\/strong><\/p><p><strong>勢力（uzzekh）<\/strong>：同一個字根，指「力量、堅固」，常用來指城堡、要塞的堅固。經文是對撒馬利亞這個「你」說的（陰性單數），意思是：你所倚靠的力量，要被降下來。<\/p>","exp":"<p>十一節，只有一個轉折詞：<strong>所以。<\/strong>前面一節，是控訴；這一節，是宣判。<strong>所以主耶和華如此說：敵人必來圍攻這地，使你的勢力衰微，搶掠你的家宅。<\/strong><\/p><p>請你看這個對應：他們用強暴，搶奪別人的財物，積蓄在自己家中；神說，敵人要來，搶掠你的家宅。他們倚靠的，是堅固的宮殿，與積蓄的財物；神說，你的勢力要衰微。<strong>他們怎樣倚靠什麼，神就在那裡，動手。<\/strong>這不是隨便的懲罰，是與罪的形狀相合的審判。<\/p><p>經文沒有說，敵人是誰，什麼時候來。我們也不替它加上名字，不拿它來算日子，更不套用到今天任何一個國家。<strong>阿摩司在這裡，是在對他當時的百姓說話，是要他們今天就悔改，不是要後人算日期。<\/strong><\/p><p>這一節，有一個值得思想的細節：神的審判，並不是在「他們還沒有被警告」的情況下來的。三節到八節，剛剛才說過：神說話在先，神行事在後。十一節，是神在說：話說了，就要成就。<strong>這是一位把自己的話，當真的神。<\/strong>也正因為這樣，祂的應許，我們也可以放心。<\/p>"},{"a":12,"z":12,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>כֹּה אָמַר יְהוָה כַּאֲשֶׁר יַצִּיל הָרֹעֶה מִפִּי הָאֲרִי שְׁתֵּי כְרָעַיִם אוֹ בְדַל אֹזֶן כֵּן יִנָּצְלוּ בְּנֵי יִשְׂרָאֵל הַיֹּֽשְׁבִים בְּשֹׁמְרוֹן בִּפְאַת מִטָּה וּבִדְמֶשֶׁק עָֽרֶשׂ׃<\/p><\/blockquote>","lit":"<blockquote><p>「耶和華如此說：「牧人怎樣從獅子口中搶回兩條羊腿或半個耳朵，住撒馬利亞的以色列人躺臥在床角上或鋪繡花毯的榻上，他們得救也不過如此。」」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>搶回<\/td><td>יַצִּיל<\/td><td>yatsil<\/td><td>H5337<\/td><td>救出、搶救<\/td><\/tr><tr><td>牧人<\/td><td>הָרֹעֶה<\/td><td>haroeh<\/td><td>H7462<\/td><td>牧人<\/td><\/tr><tr><td>羊腿<\/td><td>כְרָעַיִם<\/td><td>khraayim<\/td><td>H3767<\/td><td>兩條小腿骨<\/td><\/tr><tr><td>半個<\/td><td>בְדַל<\/td><td>bedal<\/td><td>H915<\/td><td>一小片、碎片<\/td><\/tr><tr><td>床角<\/td><td>מִטָּה<\/td><td>mittah<\/td><td>H4296<\/td><td>床、臥榻<\/td><\/tr><tr><td>繡花毯的榻<\/td><td>עָֽרֶשׂ<\/td><td>eres<\/td><td>H6210<\/td><td>榻、臥具<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>兩條羊腿或半個耳朵<\/strong>：原文的意思是「兩條小腿骨，或一片耳朵」，是殘餘的一點點。出埃及記22:13的律法說，牧人若被野獸撕碎的羊，帶來作證據，就不必賠償。<strong>牧人帶回這些碎片，是為了證明：羊是被獅子吃掉了。<\/strong><\/p><p><strong>得救（yinnatselu）<\/strong>：這個字是 נצל（natsal）的被動形，與前面的「搶回（yatsil）」是同一個字根。和合本把它譯成「得救」，卻不是福音意義上的得救，而是「被搶出來的那一點點」。<\/p><p><strong>床角或繡花毯的榻（bipat mittah uvidmeshek eres）<\/strong>：這一句的原文，有很大的爭議。「繡花毯」一詞，原文是 דמשק（dameshek），與「大馬士革」的拼法相同，所以有人翻譯成「大馬士革的臥榻」，有人認為是一種絲織品。<strong>本講義取和合本的譯法，同時承認：這個詞，是全章最不確定的一處。<\/strong><\/p>","exp":"<p>十二節，是一個很刺人的比喻：<strong>牧人怎樣從獅子口中搶回兩條羊腿或半個耳朵，住撒馬利亞的以色列人躺臥在床角上或鋪繡花毯的榻上，他們得救也不過如此。<\/strong><\/p><p>請你先看畫面。一隻羊被獅子叼走，牧人追上去，只搶回兩條小腿骨，和一片耳朵。他帶著這點碎片，回去給主人看，說：羊，是被獅子吃掉的。這不是救回一隻羊，是留下一個證據。<\/p><p>然後，神說：<strong>撒馬利亞的人，他們得救，也不過如此。<\/strong>這句話，非常重。它不是一句安慰，不是在說，還有一個餘民，會被救出來；它說的是，審判之後，剩下的，是一點一點的碎片，就像獅子吃剩的東西。經文沒有說，這些碎片是誰，也沒有給出任何時間表。<\/p><p>「躺臥在床角上」，說的是一群自以為安穩的人：他們躺著，不覺得獅子已經近了。<strong>這節不是說，舒服的床有罪；是說，有人躺在安逸中，聽不見獅子的吼叫。<\/strong>這一節也要我們，帶著憐憫去讀：那些被獅子吃掉的羊，背後是一個一個人家。<\/p><p>如果我們讀到這裡，只覺得痛，這就對了。<strong>好牧人，不是只搶回一點碎片的牧人。<\/strong>耶穌說：我是好牧人；好牧人為羊捨命（約10:11）。這使我們想起，那位為我們捨命的牧人，不是只帶回證據，是把我們整個背回家（路15:5）。<\/p>"},{"a":13,"z":13,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>שִׁמְעוּ וְהָעִידוּ בְּבֵית יַֽעֲקֹב נְאֻם אֲדֹנָי יְהוִה אֱלֹהֵי הַצְּבָאֽוֹת׃<\/p><\/blockquote>","lit":"<blockquote><p>「主耶和華－萬軍之神說：當聽這話，警戒雅各家。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>當聽<\/td><td>שִׁמְעוּ<\/td><td>shimu<\/td><td>H8085<\/td><td>你們要聽<\/td><\/tr><tr><td>警戒<\/td><td>וְהָעִידוּ<\/td><td>vehaidu<\/td><td>H5749<\/td><td>作見證、鄭重警告<\/td><\/tr><tr><td>雅各家<\/td><td>יַֽעֲקֹב<\/td><td>yaaqov<\/td><td>H3290<\/td><td>雅各、以色列人<\/td><\/tr><tr><td>主<\/td><td>אֲדֹנָי<\/td><td>adonai<\/td><td>H136<\/td><td>主<\/td><\/tr><tr><td>神<\/td><td>אֱלֹהֵי<\/td><td>elohe<\/td><td>H430<\/td><td>……的神<\/td><\/tr><tr><td>萬軍<\/td><td>הַצְּבָאֽוֹת<\/td><td>hatsevaot<\/td><td>H6635<\/td><td>萬軍、眾軍<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>當聽（shimu）<\/strong>：與一節同一個字、同一種形態（複數命令式）。<strong>全章的第一個命令與這一節，前後呼應。<\/strong>追蹤字「聽」，在本章出現在1節與13節。<\/p><p><strong>警戒（vehaidu）<\/strong>：這個動詞的基本意思，是「作見證、鄭重地警告」，常用在法庭的場景（申命記4:26，天地作見證）。<strong>和合本的「警戒」，更貼近原文：不是商量，是在法庭上，作證指控。<\/strong><\/p><p><strong>神，萬軍之神<\/strong>：原文是「主耶和華，萬軍之神」。這是阿摩司書愛用的稱號，用在最嚴肅的時刻。<\/p>","exp":"<p>十三節，在一連串控訴與宣判之後，神再說一次：<strong>當聽這話，警戒雅各家。<\/strong>這是本章第二次「當聽」，與第一節，前後相扣，把整章包了起來。<\/p><p>第一次「當聽」，是神對以色列人說；第二次「當聽」，聽的人，似乎是先知與見證人。「警戒」這個動詞，是法庭的語言：作證，指控。這裡的畫面是：神召了證人，要在雅各家面前，一件一件地，把話說明白。<strong>神不是在暗處定案，是在眾人面前，公開地作證。<\/strong><\/p><p>這一節，也把神的名字，疊得很重：主耶和華，萬軍之神。萬軍之神，是天上所有軍隊的元帥；祂說話，沒有一個人，能夠站在祂前面。這個名字，不是用來嚇人，是用來提醒：<strong>說話的，是掌管一切的那位。<\/strong>聽的人，要拿出真誠。<\/p><p>我們也要留意：神所說的「警戒」，是針對雅各家，也就是祂的約民。這是一個慈愛的警戒。<strong>神若不再在乎，就不會警戒；祂警戒，因為祂還在乎。<\/strong>「當聽」的呼聲，從一節到十三節，一直沒有停。只要這聲音還在，就還有一個回頭的機會。<\/p>"},{"a":14,"z":14,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>כִּי בְּיוֹם פָּקְדִי פִשְׁעֵֽי יִשְׂרָאֵל עָלָיו וּפָֽקַדְתִּי עַל מִזְבְּחוֹת בֵּֽית אֵל וְנִגְדְּעוּ קַרְנוֹת הַמִּזְבֵּחַ וְנָפְלוּ לָאָֽרֶץ׃<\/p><\/blockquote>","lit":"<blockquote><p>「我討以色列罪的日子，也要討伯特利祭壇的罪；壇角必被砍下，墜落於地。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>討<\/td><td>פָּקְדִי<\/td><td>pokdi<\/td><td>H6485<\/td><td>我追討、我查訪<\/td><\/tr><tr><td>罪<\/td><td>פִשְׁעֵֽי<\/td><td>pisei<\/td><td>H6588<\/td><td>悖逆、背叛<\/td><\/tr><tr><td>祭壇<\/td><td>מִזְבְּחוֹת<\/td><td>mizbechot<\/td><td>H4196<\/td><td>祭壇（複數）<\/td><\/tr><tr><td>伯特利<\/td><td>בֵּֽית<\/td><td>beit<\/td><td>H1008<\/td><td>伯特利（神的殿）<\/td><\/tr><tr><td>砍下<\/td><td>וְנִגְדְּעוּ<\/td><td>venigdeu<\/td><td>H1438<\/td><td>被砍斷<\/td><\/tr><tr><td>壇角<\/td><td>קַרְנוֹת<\/td><td>qarnot<\/td><td>H7161<\/td><td>角<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>討（pokdi）<\/strong>：與二節的「追討（efqod）」，同一個字根。<strong>二節說「我必追討你們的一切罪孽」，十四節說「我討以色列罪的日子，也要討伯特利祭壇的罪」，前後呼應。<\/strong><\/p><p><strong>罪（pesha）<\/strong>：這個字，比一般的「罪」更重，是「悖逆、背叛」，帶著對約的背棄。二節的「罪孽」是 avon（扭曲），這裡是 pesha（背叛）。<\/p><p><strong>壇角（qarnot）<\/strong>：祭壇四角上突出的角。在以色列，抓住祭壇的角，是尋求庇護的記號（參王上1:50）。<strong>壇角被砍下，等於祭壇不再能作為避難所。<\/strong><\/p>","exp":"<p>十四節，神的追討，走到了最意外的一個地方：<strong>我討以色列罪的日子，也要討伯特利祭壇的罪；壇角必被砍下，墜落於地。<\/strong><\/p><p>伯特利，意思是「神的殿」。它是北國重要的敬拜中心，人們去那裡獻祭、禱告、求庇護。壇角，是祭壇四個角上突出的部分；一個人若犯了罪，抓住壇角，就可以暫時得到保護。可是，神說：<strong>壇角必被砍下，墜落於地。<\/strong>連避難所，也不再能保護人。<\/p><p>請你留意這一節的用意，因為它很容易被誤讀。它不是說，敬拜本身是壞事，也不是說，祭壇與禮儀應當廢掉。這一節的上下文，是十節那一群「以強暴搶奪財物」的人，一邊壓榨別人，一邊走進伯特利，抓住壇角，以為這樣就平安。<strong>神說：這座祭壇，不能成為罪的避難所。<\/strong>在第五章，阿摩司會更清楚地說，神要的，是公平與公義，而不是不帶生命的敬拜。<\/p><p>這一節給我們一個溫柔卻堅定的提醒：<strong>敬拜不能代替悔改。<\/strong>我們進入教會，不是為了讓自己心安理得；我們在神面前，要的是一顆真實的心。一個願意回頭的人，神的壇，永遠為他敞開；一個抓著壇角、卻不肯放下罪的人，神的壇，保護不了他。<\/p>"},{"a":15,"z":15,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְהִכֵּיתִי בֵית הַחֹרֶף עַל בֵּית הַקָּיִץ וְאָבְדוּ בָּתֵּי הַשֵּׁן וְסָפוּ בָּתִּים רַבִּים נְאֻם יְהוָֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「我要拆毀過冬和過夏的房屋。象牙的房屋也必毀滅；高大的房屋都歸無有。這是耶和華說的。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>拆毀<\/td><td>וְהִכֵּיתִי<\/td><td>vehikkeiti<\/td><td>H5221<\/td><td>我要擊打<\/td><\/tr><tr><td>過冬的房屋<\/td><td>הַחֹרֶף<\/td><td>hacharef<\/td><td>H2779<\/td><td>冬天<\/td><\/tr><tr><td>過夏的房屋<\/td><td>הַקָּיִץ<\/td><td>haqayits<\/td><td>H7019<\/td><td>夏天<\/td><\/tr><tr><td>象牙<\/td><td>הַשֵּׁן<\/td><td>hashen<\/td><td>H8127<\/td><td>牙、象牙<\/td><\/tr><tr><td>毀滅<\/td><td>וְאָבְדוּ<\/td><td>veavdu<\/td><td>H6<\/td><td>必滅亡、必消失<\/td><\/tr><tr><td>歸無有<\/td><td>וְסָפוּ<\/td><td>vesafu<\/td><td>H5486<\/td><td>必被消滅、必終結<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>拆毀（vehikkeiti）<\/strong>：這個動詞的基本意思，是「擊打」，常用於戰爭、災禍。和合本譯作「拆毀」。<strong>神是那位親自擊打的，不是間接的結果。<\/strong><\/p><p><strong>過冬與過夏的房屋<\/strong>：原文是「冬天的房子，與夏天的房子」。這是富有者的生活方式：冬天一處，夏天一處。<strong>經文沒有說，有兩棟房子就是罪；這節的控訴，連在十節那一句「以強暴搶奪財物，積蓄在自己家中」上。<\/strong><\/p><p><strong>象牙的房屋（batte hashen）<\/strong>：房屋以象牙作鑲嵌。列王紀上22:39提到亞哈建造的象牙宮，這可以幫助我們想像當時的奢華，但經文沒有說這裡指的就是那一座。<\/p><p><strong>這是耶和華說的（neum YHWH）<\/strong>：與十節呼應，全章以神自己的宣告作結。<\/p>","exp":"<p>十五節，是這一章最後的一句，神說：<strong>我要拆毀過冬和過夏的房屋。象牙的房屋也必毀滅；高大的房屋都歸無有。這是耶和華說的。<\/strong><\/p><p>這節的畫面，有一個漸進的排列：過冬與過夏的房屋，是富貴的生活；象牙的房屋，是奢華的裝飾；高大的房屋，是眾多的產業。這一層一層，一件一件，神都說，要拆毀、要毀滅、要歸無有。三個動詞，一個比一個徹底。<\/p><p>讀這一節，我們要非常小心，不要讀歪。<strong>阿摩司書，不是一本在咒詛財富的書。<\/strong>經文沒有說，有房子的人有罪，也沒有說，一切的美好，都是壞的。它說的，是這些房屋，建立在「搶奪、強暴、欺壓」之上；<strong>是這些房屋的來歷，不是房屋本身，被神追討。<\/strong>這一節，不是給我們一個批判別人財富的把柄，而是一面鏡子，叫我們問：我所擁有的，是怎麼來的？它有沒有，叫別人受傷？<\/p><p>與這章第一節對看：開頭，神說，我認識你們，我領你們上來；結尾，神說，我要拆毀你們以為最穩的房屋。<strong>被神認識的人，不能倚靠房屋，要倚靠神。<\/strong>最後的一句「這是耶和華說的」，是神自己在這個宣告上，再簽一次名。我們不在這裡，推算任何日子，只在這裡，聽見一個邀請：還來得及，回頭，聽。<\/p>"}],"4":[{"a":1,"z":1,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>שִׁמְעוּ הַדָּבָר הַזֶּה פָּרוֹת הַבָּשָׁן אֲשֶׁר בְּהַר שֹֽׁמְרוֹן הָעֹשְׁקוֹת דַּלִּים הָרֹצְצוֹת אֶבְיוֹנִים הָאֹמְרֹת לַאֲדֹֽנֵיהֶם הָבִיאָה וְנִשְׁתֶּֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「你們住撒馬利亞山如巴珊母牛的啊，當聽我的話－你們欺負貧寒的，壓碎窮乏的，對家主說：拿酒來，我們喝吧！」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>聽<\/td><td>שִׁמְעוּ<\/td><td>shim'u<\/td><td>H8085<\/td><td>你們要聽（命令）<\/td><\/tr><tr><td>母牛<\/td><td>פָּרוֹת<\/td><td>parot<\/td><td>H6510<\/td><td>母牛（陰性複數）<\/td><\/tr><tr><td>欺負<\/td><td>הָעֹשְׁקוֹת<\/td><td>ha'osheqot<\/td><td>H6231<\/td><td>欺負、勒索<\/td><\/tr><tr><td>貧寒的<\/td><td>דַּלִּים<\/td><td>dallim<\/td><td>H1800<\/td><td>貧寒的、軟弱無力的人<\/td><\/tr><tr><td>壓碎<\/td><td>הָרֹצְצוֹת<\/td><td>haro'tsetsot<\/td><td>H7533<\/td><td>壓碎、壓垮<\/td><\/tr><tr><td>窮乏的<\/td><td>אֶבְיוֹנִים<\/td><td>evyonim<\/td><td>H34<\/td><td>窮乏的、伸手求人的人<\/td><\/tr><tr><td>喝<\/td><td>וְנִשְׁתֶּֽה<\/td><td>venishteh<\/td><td>H8354<\/td><td>我們來喝吧<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>巴珊的母牛（פָּרוֹת הַבָּשָׁן）<\/strong>：「母牛」是陰性複數，後面的「欺負」「壓碎」「對……說」也都是陰性複數的分詞。巴珊在約旦河東，是出產肥美牲畜的牧地（申32:14；結39:18）。這個比喻指誰，解經者有分歧：有人認為是撒馬利亞富有的婦女；有人認為是用陰性複數，比喻整個過著安逸日子的上層社會，包括有權勢的男人，因為接下來的「家主」是她們倚靠或支使的人；也有人認為兩者都有可能，不必硬分。本講義不替任何一群人貼標籤，只守住經文給的事實：神叫「住撒馬利亞山」、有餘力開酒席的人來聽。<\/p><p><strong>貧寒的與窮乏的（דַּלִּים、אֶבְיוֹנִים）<\/strong>：這兩個詞在阿摩司書常常並列，指在社會裡沒有力量替自己說話的人（參2:6--7；5:11；8:4、6）。<strong>被欺負、被壓碎的，是這兩種人；經文先替他們開口。<\/strong><\/p><p><strong>聽（שִׁמְעוּ）<\/strong>：這是全卷追蹤字「聽」的第一次出現在本章：命令式。神對欺壓人的人，也仍然開口叫他們聽。<\/p>","exp":"<p>阿摩司在第三章已經講過「你們當聽」（3:1）；到了第四章，他把這個命令轉向一群特別的聽眾：<strong>住在撒馬利亞山上、像巴珊母牛一樣肥壯的人。<\/strong>撒馬利亞是北國的京城，建在山上，看得見周圍的田地；住在山上的人，看下去的時候，也許看不見山腳下誰家今晚沒有飯吃。<\/p><p>經文用兩個很重的動詞描述他們：<strong>欺負貧寒的，壓碎窮乏的。<\/strong>「欺負」是一點一點地剝削、勒索；「壓碎」是把人壓垮到再也站不起來。這不是偶爾的失手，是一種日常的做法，而且做的人心安理得，因為下一句他們就對家主說：<strong>拿酒來，我們喝吧。<\/strong>前半句是別人的血汗，後半句是自己的酒杯；兩句話並排放在一起，什麼都不用多說。<\/p><p>我們讀這一節，先要站在被欺負的人那一邊：<strong>神看見了，神記得，神沒有把「貧寒的」「窮乏的」當成背景。<\/strong>然後才看見神對欺壓人的人說話的方式：先叫他們「聽」。神不是先丟出刑罰，而是先開口；祂還願意被聽見。這是整卷書裡很容易被忽略的一個細節：連對欺壓人的人，神的第一個動作，也是要他們聽。<\/p>"},{"a":2,"z":3,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>נִשְׁבַּע אֲדֹנָי יְהוִה בְּקָדְשׁוֹ כִּי הִנֵּה יָמִים בָּאִים עֲלֵיכֶם וְנִשָּׂא אֶתְכֶם בְּצִנּוֹת וְאַחֲרִיתְכֶן בְּסִירוֹת דּוּגָֽה וּפְרָצִים תֵּצֶאנָה אִשָּׁה נֶגְדָּהּ וְהִשְׁלַכְתֶּנָה הַהַרְמוֹנָה נְאֻם יְהוָֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「主耶和華指著自己的聖潔起誓說：日子快到，人必用鉤子將你們鉤去，用魚鉤將你們餘剩的鉤去。你們各人必從破口直往前行，投入哈門。這是耶和華說的。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>起誓<\/td><td>נִשְׁבַּע<\/td><td>nishba<\/td><td>H7650<\/td><td>起誓<\/td><\/tr><tr><td>聖潔<\/td><td>בְּקָדְשׁוֹ<\/td><td>beqodsho<\/td><td>H6944<\/td><td>指著自己的聖潔<\/td><\/tr><tr><td>鉤子<\/td><td>בְּצִנּוֹת<\/td><td>betsinnot<\/td><td>H6793<\/td><td>鉤子（另有解為盾牌、籃子）<\/td><\/tr><tr><td>魚鉤<\/td><td>בְּסִירוֹת<\/td><td>besirot<\/td><td>H5518<\/td><td>魚鉤（另有解為鍋）<\/td><\/tr><tr><td>魚<\/td><td>דּוּגָֽה<\/td><td>dugah<\/td><td>H1729<\/td><td>釣魚<\/td><\/tr><tr><td>破口<\/td><td>וּפְרָצִים<\/td><td>ufratsim<\/td><td>H6556<\/td><td>城牆的破口<\/td><\/tr><tr><td>耶和華說<\/td><td>נְאֻם<\/td><td>ne'um<\/td><td>H5002<\/td><td>這是（耶和華）說的<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>指著自己的聖潔起誓（נִשְׁבַּע אֲדֹנָי יְהוִה בְּקָדְשׁוֹ）<\/strong>：神起誓，通常指著自己的名或自己的生命；這裡指著自己的「聖潔」。<strong>聖潔是神最根本的本性；祂指著這個起誓，等於說：我若不處理這件事，我就不再是我。<\/strong>8:7 是另一個類似的起誓。<\/p><p><strong>鉤子與魚鉤（צִנּוֹת、סִירוֹת דּוּגָה）<\/strong>：這是全章最難的字詞。第一個字另可解為「盾牌」或「籃子」，第二個字另可解為「鍋」，「דוּגָה」是「魚」或「釣魚」。各家意見大致有三種：一、都是釣具，意思是人像魚一樣被鉤走（和合本採此意）；二、是把人用鉤環穿過身體拖走的俘虜景象；三、是把人當牲畜、裝在籃子與鍋裡。三種讀法共同的一點是：被擄、被拖走，沒有尊嚴地被帶走。本講義採和合本的讀法，同時承認字義不確定。<\/p><p><strong>哈門（הַהַרְמוֹנָה）<\/strong>：這個地名不見於其他經文，位置不明；有人解為「向著哈門山」，有人解為「向著堡壘」，也有人認為抄本可能有字形變化。經文大意清楚：從城牆被攻破的破口，一個一個被趕出去。<\/p><p><strong>耶和華說（נְאֻם יְהוָה）<\/strong>：這是全卷追蹤字，在4:3 是這一章的第一個「簽名」，神親自為這一段宣告蓋印。<\/p>","exp":"<p>神開口，第一個動作是起誓。<strong>主耶和華指著自己的聖潔起誓：日子快到。<\/strong>這個起誓，不是情緒發作；神拿祂自己最不可動搖的本性，為這件事作保。這也提醒我們：被欺負的人的呼求，不是一件小事，祂是用自己的聖潔承擔的。<\/p><p>接著是一幅很不舒服的畫面：<strong>人必用鉤子將你們鉤去，用魚鉤將你們餘剩的鉤去。<\/strong>不管鉤子究竟指什麼，圖像是同一個：昨天還坐在山上喊「拿酒來」的人，今天像被釣上岸的魚，被拖走了。她們把別人當成可以壓碎的東西，結果自己也變成被拖走的東西。「餘剩的」這三個字很重：第一批之後，還有一批；沒有人是安全的。<\/p><p>三節接著說：<strong>你們各人必從破口直往前行。<\/strong>城牆原本是保護她們的，如今成了破口；每一個人，各自從破口出去，沒有人能回頭，也沒有人能指望別人替她們頂。這不是神喜歡毀壞，而是一個一直把別人壓碎的結構，終於也壓到自己身上。<\/p><p>最後一句：<strong>這是耶和華說的。<\/strong>這不是阿摩司的預測，也不是時局的分析，而是神自己簽了名的話。我們讀這一段，不要幸災樂禍；先要看見，那些被欺負的人，終於被神記起了。<\/p>"},{"a":4,"z":5,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>בֹּאוּ בֵֽית אֵל וּפִשְׁעוּ הַגִּלְגָּל הַרְבּוּ לִפְשֹׁעַ וְהָבִיאוּ לַבֹּקֶר זִבְחֵיכֶם לִשְׁלֹשֶׁת יָמִים מַעְשְׂרֹֽתֵיכֶֽם וְקַטֵּר מֵֽחָמֵץ תּוֹדָה וְקִרְאוּ נְדָבוֹת הַשְׁמִיעוּ כִּי כֵן אֲהַבְתֶּם בְּנֵי יִשְׂרָאֵל נְאֻם אֲדֹנָי יְהוִֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「以色列人哪，任你們往伯特利去犯罪，到吉甲加增罪過；每日早晨獻上你們的祭物，每三日奉上你們的十分之一。任你們獻有酵的感謝祭，把甘心祭宣傳報告給眾人，因為是你們所喜愛的。這是主耶和華說的。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>犯罪<\/td><td>וּפִשְׁעוּ<\/td><td>ufish'u<\/td><td>H6586<\/td><td>犯罪、悖逆<\/td><\/tr><tr><td>吉甲<\/td><td>הַגִּלְגָּל<\/td><td>haggilgal<\/td><td>H1537<\/td><td>吉甲（北國的聖所之一）<\/td><\/tr><tr><td>祭物<\/td><td>זִבְחֵיכֶם<\/td><td>zivcheikhem<\/td><td>H2077<\/td><td>你們的祭物<\/td><\/tr><tr><td>十分之一<\/td><td>מַעְשְׂרֹֽתֵיכֶֽם<\/td><td>ma'asrotekhem<\/td><td>H4643<\/td><td>你們的十分之一<\/td><\/tr><tr><td>有酵的<\/td><td>מֵֽחָמֵץ<\/td><td>mehamets<\/td><td>H2557<\/td><td>從有酵的（物）<\/td><\/tr><tr><td>感謝祭<\/td><td>תּוֹדָה<\/td><td>todah<\/td><td>H8426<\/td><td>感謝祭<\/td><\/tr><tr><td>甘心祭<\/td><td>נְדָבוֹת<\/td><td>nedavot<\/td><td>H5071<\/td><td>甘心祭、自願的獻上<\/td><\/tr><tr><td>喜愛<\/td><td>אֲהַבְתֶּם<\/td><td>ahavtem<\/td><td>H157<\/td><td>你們愛<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>任你們往伯特利去犯罪（בֹּאוּ בֵית אֵל וּפִשְׁעוּ）<\/strong>：這是祭司的口吻：原文「你們來伯特利」本是祭司召人敬拜的呼召語，阿摩司把它倒過來用，下一個動詞卻是「犯罪」。和合本譯作「任你們」，抓住了反諷的語氣：<strong>這不是神許可，而是神把話倒過來說，讓他們聽見自己的行為被說穿了。<\/strong><\/p><p><strong>每三日（לִשְׁלֹשֶׁת יָמִים）<\/strong>：字面是「三日（之後）」，可以是「每三天」，也可以是「第三天」。律法要求的十分之一是「每三年」一次（申14:28），阿摩司可能是誇張的反諷：你們熱心得連每三天都獻。這是一個語法上的選擇，主旨不變：他們熱心的是獻祭本身。<\/p><p><strong>有酵的感謝祭（קַטֵּר מֵחָמֵץ תּוֹדָה）<\/strong>：「קטר」是燒；從有酵的物燒出感謝祭。利7:13 容許有酵的餅與感謝祭同獻，但利2:11 不許把酵燒在壇上。意見分歧：有人認為這是在批評他們不守禮儀的細節，有人認為這只是描寫他們獻得很盛大。本講義的讀法是：<strong>不需要判斷哪個細節對錯，因為焦點在最後一句：「因為是你們所喜愛的」，意思是這些獻上，是為了他們自己喜歡。<\/strong><\/p>","exp":"<p>前面三節是對欺壓人的人的審判；現在，阿摩司忽然開始講「敬拜」。<strong>以色列人哪，任你們往伯特利去犯罪，到吉甲加增罪過。<\/strong>伯特利與吉甲是北國最熱鬧的聖所；人來這裡，是為了尋求神。可是阿摩司用的動詞是「犯罪」，而且是「加增罪過」：一次比一次多。<\/p><p>接下來這兩節，描寫的卻是一幅非常熱心的畫面：<strong>每日早晨獻上你們的祭物，每三日奉上你們的十分之一；獻有酵的感謝祭，把甘心祭宣傳報告給眾人。<\/strong>祭物、十分之一、感謝祭、甘心祭，樣樣都有；而且他們愛張揚，把自己的甘心祭，大聲說給大家聽。<\/p><p>問題不在祭物不夠，也不在次數不夠。問題在經文最後給的理由：<strong>因為是你們所喜愛的。<\/strong>這句話把整幅畫面改變了：他們來，不是為了遇見神，是為了做自己喜歡的事。祭壇成了舞台，感謝成了宣傳。<\/p><p>這裡要特別小心：阿摩司不是說敬拜是壞事，也不是說獻祭應該停止。他說的是：<strong>當敬拜與公義分開，當一個人上午獻祭、下午壓碎窮人，敬拜就成了神不能接納的東西。<\/strong>第五章21至24節會再把這件事講得更明白，那裡我們再看。眼前，我們只要讓這句話停在心裡：我來到神面前，究竟是為了祂，還是為了我所喜愛的？<\/p>"},{"a":6,"z":6,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְגַם אֲנִי נָתַתִּי לָכֶם נִקְיוֹן שִׁנַּיִם בְּכָל עָרֵיכֶם וְחֹסֶר לֶחֶם בְּכֹל מְקוֹמֹֽתֵיכֶם וְלֹֽא שַׁבְתֶּם עָדַי נְאֻם יְהוָֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「我使你們在一切城中牙齒乾淨，在你們各處糧食缺乏，你們仍不歸向我。這是耶和華說的。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>乾淨<\/td><td>נִקְיוֹן<\/td><td>niqayon<\/td><td>H5356<\/td><td>潔淨、乾淨<\/td><\/tr><tr><td>牙齒<\/td><td>שִׁנַּיִם<\/td><td>shinnayim<\/td><td>H8127<\/td><td>牙齒<\/td><\/tr><tr><td>缺乏<\/td><td>וְחֹסֶר<\/td><td>vechoser<\/td><td>H2640<\/td><td>缺少、短缺<\/td><\/tr><tr><td>糧食<\/td><td>לֶחֶם<\/td><td>lechem<\/td><td>H3899<\/td><td>餅、糧食<\/td><\/tr><tr><td>歸向<\/td><td>שַׁבְתֶּם<\/td><td>shavtem<\/td><td>H7725<\/td><td>你們轉回<\/td><\/tr><tr><td>向我<\/td><td>עָדַי<\/td><td>adai<\/td><td>H5704<\/td><td>直到我這裡<\/td><\/tr><tr><td>耶和華說<\/td><td>נְאֻם<\/td><td>ne'um<\/td><td>H5002<\/td><td>這是（耶和華）說的<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>牙齒乾淨（נִקְיוֹן שִׁנַּיִם）<\/strong>：直譯是「牙齒的潔淨」，意思是沒有食物可咬，牙縫乾乾淨淨，這是飢荒的意象。後一句「糧食缺乏」是同一件事的直說。<\/p><p><strong>也是我（וְגַם אֲנִי）<\/strong>：原文開頭是「也是我」，強調這些災是神自己所為。<strong>這句話的重心，不是神發怒，而是神在說：我一直在你們身邊，我就是那位一次又一次叫你們回頭的。<\/strong>這不等於說每一場災都是神為某個人的罪所降；本章只說這幾件事，是神藉著先知，向這群人所作的解釋。<\/p><p><strong>歸向（שׁוּב，שַׁבְתֶּם）<\/strong>：這是整卷書的追蹤字「轉回」。<strong>שׁוּב 的基本意思是轉身、回頭；在先知書裡，是悔改的最常用詞。<\/strong>本章這個動詞連續出現五次，每一次都以否定「不（וְלֹא）」開頭：他們就是不轉。<strong>「עָדַי」字面是「直到我這裡」，也就是：你們沒有回到我這裡。<\/strong><\/p><p><strong>耶和華說（נְאֻם יְהוָה）<\/strong>：這是本章五次災之後的第一次「簽名」；以下每一次，句子都以同一個簽名收尾。<\/p>","exp":"<p>這一節是五次災的開頭，也是全章最打動人的一句話的第一次出現：<strong>你們仍不歸向我。<\/strong>神說：我使你們在一切城中牙齒乾淨，在你們各處糧食缺乏。在農業社會裡，糧食缺乏是最直接、最普遍的痛；城裡城外，沒有一個地方例外。<\/p><p>請你留意，神不是只說「災來了」，而是說：<strong>我使。<\/strong>祂不躲在災難後面，祂說出自己的名字。為什麼？因為這些災，不是要摧毀他們，而是要叫他們回頭。災難成了神的聲音，是為了讓他們停下來，問：我們怎麼了？<\/p><p>然後是這章第一個「仍不歸向我」。<strong>你們仍不歸向我。這是耶和華說的。<\/strong>「仍」這個字，帶著一種心碎的味道：神說了，也做了，可是你們仍然不回頭。這句話裡沒有咒詛，只有一位一直在等的神。<\/p><p>我們可以問：你有沒有過這樣的經驗，某一個缺乏、某一個空，把你帶到了一個不得不停下來想的地方？是不是神在說話？經文沒有說所有的缺乏都是神為了某個人的罪，但它確實告訴我們：<strong>有些時候，神在空缺裡，輕輕叫我們的名字。<\/strong><\/p>"},{"a":7,"z":8,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְגַם אָנֹכִי מָנַעְתִּי מִכֶּם אֶת הַגֶּשֶׁם בְּעוֹד שְׁלֹשָׁה חֳדָשִׁים לַקָּצִיר וְהִמְטַרְתִּי עַל עִיר אֶחָת וְעַל עִיר אַחַת לֹא אַמְטִיר חֶלְקָה אַחַת תִּמָּטֵר וְחֶלְקָה אֲשֶֽׁר לֹֽא תַמְטִיר עָלֶיהָ תִּיבָֽשׁ וְנָעוּ שְׁתַּיִם שָׁלֹשׁ עָרִים אֶל עִיר אַחַת לִשְׁתּוֹת מַיִם וְלֹא יִשְׂבָּעוּ וְלֹֽא שַׁבְתֶּם עָדַי נְאֻם יְהוָֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「在收割的前三月，我使雨停止，不降在你們那裡；我降雨在這城，不降雨在那城；這塊地有雨，那塊地無雨；無雨的就枯乾了。這樣，兩三城的人湊到一城去找水，卻喝不足；你們仍不歸向我。這是耶和華說的。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>停止<\/td><td>מָנַעְתִּי<\/td><td>manati<\/td><td>H4513<\/td><td>我扣住、我不給<\/td><\/tr><tr><td>雨<\/td><td>הַגֶּשֶׁם<\/td><td>haggeshem<\/td><td>H1653<\/td><td>大雨、雨水<\/td><\/tr><tr><td>降雨<\/td><td>וְהִמְטַרְתִּי<\/td><td>vehimtarti<\/td><td>H4305<\/td><td>我降雨<\/td><\/tr><tr><td>枯乾<\/td><td>תִּיבָֽשׁ<\/td><td>tivash<\/td><td>H3001<\/td><td>枯乾<\/td><\/tr><tr><td>湊到<\/td><td>וְנָעוּ<\/td><td>venau<\/td><td>H5128<\/td><td>搖搖晃晃地走、流浪<\/td><\/tr><tr><td>水<\/td><td>מַיִם<\/td><td>mayim<\/td><td>H4325<\/td><td>水<\/td><\/tr><tr><td>喝足<\/td><td>יִשְׂבָּעוּ<\/td><td>yisbau<\/td><td>H7646<\/td><td>飽足<\/td><\/tr><tr><td>歸向<\/td><td>שַׁבְתֶּם<\/td><td>shavtem<\/td><td>H7725<\/td><td>你們轉回<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>收割前三月（בְּעוֹד שְׁלֹשָׁה חֳדָשִׁים לַקָּצִיר）<\/strong>：這是整個旱災最痛的時間點：後期雨（約在春天）停了，穀物正在灌漿，離收割只剩三個月。早一點停，沒有種；晚一點停，收成已成；偏偏停在這個時候，農夫已經付出了所有的力氣。<\/p><p><strong>這城……那城（עִיר אַחַת וְעִיר אַחַת）<\/strong>：雨不是整片地不下，而是有選擇的：這城有雨，那城沒有。這使災難的對象看起來不像天然的氣候，更像是有人在說話。<\/p><p><strong>湊到一城去（וְנָעוּ）<\/strong>：動詞「נוע」有「搖搖擺擺、東倒西歪地走」的意思（參賽24:20 的醉酒搖晃），形容饑渴的人腳步虛浮、勉強前行的樣子。<strong>「兩三城」是一個修辭的算法，就是「好幾座城」，不是精確的數目。<\/strong><\/p><p><strong>仍不歸向我（וְלֹא שַׁבְתֶּם עָדַי）<\/strong>：這是第二次「仍不歸向我」，也是全卷「轉回」這個追蹤字在本章的第二次出現。8節末尾再次以「耶和華說」收尾。<\/p>","exp":"<p>七、八兩節是第二次災，比第一次更具體，也更殘酷。<strong>在收割的前三月，我使雨停止，不降在你們那裡。<\/strong>農夫最怕的，就是在收成之前，雨不來了：秧苗已經長出來，水卻停了。<\/p><p>然後是一個很奇怪的畫面：<strong>我降雨在這城，不降雨在那城；這塊地有雨，那塊地無雨。<\/strong>雨有降下來，卻不是平均的。有人看著鄰居的田綠了，自己的卻枯了。這是一種很難說出口的痛：不只是缺，還有比較。<\/p><p>八節的畫面更近：<strong>兩三城的人湊到一城去找水，卻喝不足。<\/strong>人走了很遠的路，只為了一口水，到了地方，卻喝不夠。這不是遠方的故事，這是一個被乾旱磨到疲乏的人，一步一步走在路上的樣子。<\/p><p>可是八節最後仍然是同一句話：<strong>你們仍不歸向我。<\/strong>人走了這麼遠，找水，卻沒有走向神。他們有行動力，有毅力，有方法；唯獨沒有回頭。這給我們一個很誠實的提醒：<strong>人在缺乏中，常常什麼路都肯走，只是不肯走向神。<\/strong>我們不替他們定罪，只問自己：我的缺乏，把我帶往哪裡？<\/p>"},{"a":9,"z":9,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הִכֵּיתִי אֶתְכֶם בַּשִּׁדָּפוֹן וּבַיֵּרָקוֹן הַרְבּוֹת גַּנּוֹתֵיכֶם וְכַרְמֵיכֶם וּתְאֵנֵיכֶם וְזֵיתֵיכֶם יֹאכַל הַגָּזָם וְלֹֽא שַׁבְתֶּם עָדַי נְאֻם יְהוָֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「我以旱風、霉爛攻擊你們，你們園中許多菜蔬、葡萄樹、無花果樹、橄欖樹都被剪蟲所吃；你們仍不歸向我。這是耶和華說的。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>攻擊<\/td><td>הִכֵּיתִי<\/td><td>hikketi<\/td><td>H5221<\/td><td>我擊打<\/td><\/tr><tr><td>旱風<\/td><td>בַּשִּׁדָּפוֹן<\/td><td>bashshiddafon<\/td><td>H7711<\/td><td>旱風、枯萎病<\/td><\/tr><tr><td>霉爛<\/td><td>וּבַיֵּרָקוֹן<\/td><td>uvayyeraqon<\/td><td>H3420<\/td><td>霉爛、發黃<\/td><\/tr><tr><td>菜蔬<\/td><td>גַּנּוֹתֵיכֶם<\/td><td>gannotekhem<\/td><td>H1593<\/td><td>你們的園子<\/td><\/tr><tr><td>葡萄樹<\/td><td>וְכַרְמֵיכֶם<\/td><td>vekharmekhem<\/td><td>H3754<\/td><td>你們的葡萄園<\/td><\/tr><tr><td>橄欖樹<\/td><td>וְזֵיתֵיכֶם<\/td><td>vezeitekhem<\/td><td>H2132<\/td><td>你們的橄欖樹<\/td><\/tr><tr><td>剪蟲<\/td><td>הַגָּזָם<\/td><td>haggazam<\/td><td>H1501<\/td><td>剪蟲、蝗蟲的一種<\/td><\/tr><tr><td>歸向<\/td><td>שַׁבְתֶּם<\/td><td>shavtem<\/td><td>H7725<\/td><td>你們轉回<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>旱風、霉爛（שִׁדָּפוֹן、יֵרָקוֹן）<\/strong>：這兩個詞一起出現，是申28:22 咒詛清單中的詞，也出現在王上8:37；它們是莊稼的病，一個是被熱風烤焦，一個是發黃、發霉。這意味著：這些災，在摩西的約裡早已寫明，他們不是不知道。<\/p><p><strong>園中許多菜蔬（הַרְבּוֹת גַּנּוֹתֵיכֶם）<\/strong>：「許多」的原文是動詞的不定詞「加多」，語法略有爭議：有人譯作「你們園子的加增」，意思是「連你們園子增加的部分」，也有人把它看作「許多」的修飾詞。譯文差別不大。<\/p><p><strong>剪蟲（גָּזָם）<\/strong>：蝗蟲的一個階段，名字就是「剪」，吃光了就像用剪刀剪過的一樣。約珥書1:4 也用同一個字。<\/p><p><strong>第三次仍不歸向我<\/strong>：這是追蹤字「轉回」在本章的第三次出現，也是第三次「這是耶和華說的」。<\/p>","exp":"<p>第三次災，是從田裡到園裡。<strong>我以旱風、霉爛攻擊你們，你們園中許多菜蔬、葡萄樹、無花果樹、橄欖樹都被剪蟲所吃。<\/strong>菜蔬、葡萄、無花果、橄欖，這是以色列人餐桌上最基本的食物。先是天（旱風），再是地（霉爛），最後是小小的蟲（剪蟲）。大自然的三個層面，一個接一個，都在說同一句話。<\/p><p>請你留意這些災的次序：缺糧、缺水、病蟲。每一個都是從人最熟悉、最日常的生活裡來的。神沒有用遠方的敵人，也沒有用什麼奇異的天象；祂用的，是每一年都會碰到的事：天氣、病、蟲。<strong>神把日常，變成了說話的方式。<\/strong><\/p><p>可是，這一節與前一節一樣，結尾沒有改變：<strong>你們仍不歸向我。這是耶和華說的。<\/strong>每一次災都是一次機會，每一次機會都被錯過。我們不替他們說「一定是這樣」，但也不能不承認：<strong>人心可以對很多提醒，都沒有感覺。<\/strong>如果一個人遇到一次又一次的缺乏，仍然只是把問題丟給環境，丟給別人，丟給運氣，他就錯過了聽見神的機會。<\/p><p>讀這一節，不要以為每一場蟲害、每一次歉收，都是神為了你的罪降下的。本章的重點，是神對這一群人，藉先知所作的解釋；我們學的是：<strong>當生活裡有缺乏的時候，我願不願意停下來，問神一句：祢要對我說什麼？<\/strong><\/p>"},{"a":10,"z":10,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>שִׁלַּחְתִּי בָכֶם דֶּבֶר בְּדֶרֶךְ מִצְרַיִם הָרַגְתִּי בַחֶרֶב בַּחוּרֵיכֶם עִם שְׁבִי סֽוּסֵיכֶם וָאַעֲלֶה בְּאֹשׁ מַחֲנֵיכֶם וּֽבְאַפְּכֶם וְלֹֽא שַׁבְתֶּם עָדַי נְאֻם יְהוָֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「我降瘟疫在你們中間，像在埃及一樣；用刀殺戮你們的少年人，使你們的馬匹被擄掠，營中屍首的臭氣撲鼻；你們仍不歸向我。這是耶和華說的。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>降<\/td><td>שִׁלַּחְתִּי<\/td><td>shillachti<\/td><td>H7971<\/td><td>我差遣、我打發<\/td><\/tr><tr><td>瘟疫<\/td><td>דֶּבֶר<\/td><td>dever<\/td><td>H1698<\/td><td>瘟疫<\/td><\/tr><tr><td>像……一樣<\/td><td>בְּדֶרֶךְ<\/td><td>bederekh<\/td><td>H1870<\/td><td>按著……的路（方式）<\/td><\/tr><tr><td>埃及<\/td><td>מִצְרַיִם<\/td><td>mitsrayim<\/td><td>H4714<\/td><td>埃及<\/td><\/tr><tr><td>少年人<\/td><td>בַּחוּרֵיכֶם<\/td><td>bachureikhem<\/td><td>H970<\/td><td>你們的青年人<\/td><\/tr><tr><td>擄掠<\/td><td>שְׁבִי<\/td><td>shevi<\/td><td>H7628<\/td><td>被擄<\/td><\/tr><tr><td>鼻<\/td><td>וּֽבְאַפְּכֶם<\/td><td>uvafekhem<\/td><td>H639<\/td><td>在你們的鼻子裡<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>像在埃及一樣（בְּדֶרֶךְ מִצְרַיִם）<\/strong>：「דרך」是「路」，字面是「按埃及的路」，有三種讀法：一、像埃及（所受的瘟疫）那樣（和合本，呼應出埃及記的災）；二、在往埃及去的路上（瘟疫沿路發作）；三、按埃及的方式（用埃及人用的辦法）。三種讀法都連到出埃及的記憶。<strong>共同點是：神把當初對付埃及的災，轉用在自己的百姓身上，意思是：如果你們活得像埃及，就要承受埃及所承受的。<\/strong><\/p><p><strong>少年人（בַּחוּרִים）<\/strong>：指適合打仗的青壯年；他們被刀殺，馬匹被擄去，指戰爭中兵力與軍備的損失。<\/p><p><strong>營中屍首的臭氣撲鼻<\/strong>：原文是使你們營中的臭氣上到你們的鼻子，用感官寫戰場的實況，不需要想像，只需要承認。<\/p>","exp":"<p>第四次災最重，也最近。<strong>我降瘟疫在你們中間，像在埃及一樣；用刀殺戮你們的少年人，使你們的馬匹被擄掠，營中屍首的臭氣撲鼻。<\/strong>瘟疫、刀劍、擄掠、屍臭，全是人的痛。這一節沒有描寫任何農作物，只有人。<\/p><p>「像在埃及一樣」這句話，有很深的諷刺。以色列人是被神從埃及救出來的；埃及所承受的災，原本不屬於他們。如今，他們活得越來越像埃及，所承受的也越來越像埃及。這是神對選民的一個很重的話：<strong>蒙恩的身分，不能取代轉回的行動。<\/strong><\/p><p>經文說「少年人」被殺，這是一個很不容易讀下去的細節。我們不要把這句話講得太快、太輕，更不要把任何一場戰爭、任何一次災難，說成是神對某一個群體的懲罰。經文是對那個時代的北國說的；我們面對今天受苦的人，先是陪伴與同在，而不是替他們找原因。<\/p><p>然後，是全章最重的一句，再次出現：<strong>你們仍不歸向我。<\/strong>人到了最痛的地方，仍然可能不回頭。這就是罪的力量，也是神的忍耐的深度：祂還在說，祂還要人轉。<\/p>"},{"a":11,"z":11,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הָפַכְתִּי בָכֶם כְּמַהְפֵּכַת אֱלֹהִים אֶת סְדֹם וְאֶת עֲמֹרָה וַתִּהְיוּ כְּאוּד מֻצָּל מִשְׂרֵפָה וְלֹֽא שַׁבְתֶּם עָדַי נְאֻם יְהוָֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「我傾覆你們中間的城邑，如同我從前傾覆所多瑪、蛾摩拉一樣，使你們好像從火中抽出來的一根柴；你們仍不歸向我。這是耶和華說的。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>傾覆<\/td><td>הָפַכְתִּי<\/td><td>hafakhti<\/td><td>H2015<\/td><td>我翻轉、我傾覆<\/td><\/tr><tr><td>傾覆（名詞）<\/td><td>כְּמַהְפֵּכַת<\/td><td>kemahpekhat<\/td><td>H4114<\/td><td>如同傾覆<\/td><\/tr><tr><td>所多瑪<\/td><td>סְדֹם<\/td><td>sedom<\/td><td>H5467<\/td><td>所多瑪<\/td><\/tr><tr><td>蛾摩拉<\/td><td>עֲמֹרָה<\/td><td>amorah<\/td><td>H6017<\/td><td>蛾摩拉<\/td><\/tr><tr><td>柴<\/td><td>כְּאוּד<\/td><td>ke'ud<\/td><td>H181<\/td><td>像一根柴（燒剩的木頭）<\/td><\/tr><tr><td>抽出來<\/td><td>מֻצָּל<\/td><td>mutsal<\/td><td>H5337<\/td><td>被搶救出來的<\/td><\/tr><tr><td>火<\/td><td>מִשְּׂרֵפָה<\/td><td>misrefah<\/td><td>H8316<\/td><td>火燒（之處）<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>傾覆（הָפַךְ）<\/strong>：這個動詞是創19:25 描寫所多瑪與蛾摩拉的用字。<strong>在「הפך」這個動詞裡，有一個很有意思的雙重意思：它也可以是「翻轉、轉變」，在別處可以指心意的轉變。<\/strong>本節的意思是傾覆，但這個字的另一面提醒我們：翻轉的目的，不只是毀滅。<\/p><p><strong>神（אֱלֹהִים）<\/strong>：「如同神傾覆所多瑪、蛾摩拉」，原文用「神」這個字，語法上可以是主詞（神傾覆了），也可能是加強語氣的最高級（如神的傾覆那樣徹底）。各家意見不同，和合本讀作「我從前傾覆」，意思不變：這是神自己做的事。<\/p><p><strong>從火中抽出來的一根柴（כְּאוּד מֻצָּל מִשְּׂרֵפָה）<\/strong>：「אוּד」是燒了一半、還在冒煙的木頭，「מֻצָּל」是被「搶救」出來。亞3:2 用同一個畫面形容被神救回的大祭司約書亞。這個畫面有兩面：一面是幾乎被燒盡，一面是被救出來；<strong>有人把它讀作只剩下殘餘，有人把它讀作「神仍然救了你們」，兩種讀法都有可能，本講義兩面並陳，不替經文多加一面。<\/strong><\/p><p><strong>第五次仍不歸向我<\/strong>：這是追蹤字「轉回」在本章的第五次，也是「耶和華說」的第二個明確簽名位置，是五次災的最後一次。<\/p>","exp":"<p>第五次災，是最後一次，也是最重的一次。<strong>我傾覆你們中間的城邑，如同我從前傾覆所多瑪、蛾摩拉一樣。<\/strong>所多瑪與蛾摩拉，是聖經裡審判的代名詞。神把以色列的處境，放在這兩座城旁邊。<\/p><p>可是，接下來的一句話，是這一節最溫柔、也最令人屏息的：<strong>使你們好像從火中抽出來的一根柴。<\/strong>一根燒了一半的木頭，被人從火裡搶出來。它黑了、焦了、也許還在冒煙；可是，它被救出來了。這個畫面，不是說他們沒事，而是說：<strong>你們已經燒了一半，可是，我還把你們抽出來。<\/strong>災難沒有把他們全部毀掉，這本身，也是神的作為。<\/p><p>神在這裡，做了兩件事：祂傾覆，也抽出。祂讓他們看見火，也讓他們看見祂的手。可是，面對這樣的恩典，他們的回應是什麼？<strong>你們仍不歸向我。<\/strong>這是第五次了。<\/p><p>請你留意，這一章五次說「仍不歸向我」，每一次都沒有說「所以我不要你們了」。神每一次，都是在災難之後，再開口。這就是神的忍耐：<strong>祂不是因為恨他們才降災，而是因為還要他們，所以不肯停止呼喚。<\/strong>也是新約所說：神的恩慈是領人悔改的（羅2:4）。我們讀這五次，不是要算次數，而是要看見：一位神，五次叫一群人回頭。<\/p>"},{"a":12,"z":12,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>לָכֵן כֹּה אֶעֱשֶׂה לְּךָ יִשְׂרָאֵל עֵקֶב כִּֽי זֹאת אֶֽעֱשֶׂה לָּךְ הִכּוֹן לִקְרַאת אֱלֹהֶיךָ יִשְׂרָאֵֽל׃<\/p><\/blockquote>","lit":"<blockquote><p>「以色列啊，我必向你如此行；以色列啊，我既這樣行，你當預備迎見你的神。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>所以<\/td><td>לָכֵן<\/td><td>lakhen<\/td><td>H3651<\/td><td>因此、所以<\/td><\/tr><tr><td>行<\/td><td>אֶעֱשֶׂה<\/td><td>e'eseh<\/td><td>H6213<\/td><td>我要做<\/td><\/tr><tr><td>預備<\/td><td>הִכּוֹן<\/td><td>hikkon<\/td><td>H3559<\/td><td>你要預備、你要站穩<\/td><\/tr><tr><td>迎見<\/td><td>לִקְרַאת<\/td><td>liqrat<\/td><td>H7125<\/td><td>迎著、去相遇<\/td><\/tr><tr><td>你的神<\/td><td>אֱלֹהֶיךָ<\/td><td>eloheikha<\/td><td>H430<\/td><td>你的神<\/td><\/tr><tr><td>以色列<\/td><td>יִשְׂרָאֵל<\/td><td>yisrael<\/td><td>H3478<\/td><td>以色列<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>如此行（כֹּה אֶעֱשֶׂה לְּךָ）<\/strong>：「如此」指什麼，原文沒有說。有人認為指前面五次災之後更重的事，有人認為是下一句「迎見神」本身，有人認為是刻意不說，讓聽的人自己想。<strong>本講義保持經文的留白：神沒有說「如此」是什麼，我們不替祂補上。<\/strong><\/p><p><strong>預備（הִכּוֹן）<\/strong>：這個動詞在別處是「站穩、預備好」；出19:11、15 以色列在西奈山下「預備」（和合本作「預備」「預備好」）。<strong>這個動詞本身是中性的：它可能是「預備承受審判」，也可能是「預備好去遇見神」。<\/strong>這是第四章最重要的語法爭議之一：有人讀作最後的警告，有人讀作最後的邀請。<\/p><p><strong>迎見（לִקְרַאת）<\/strong>：字面是「去迎著」，常用於迎接客人或對手；出19:17「領百姓出營迎接神」用的是同一個詞，是在西奈山下與神相遇的場景。<\/p><p><strong>你的神（אֱלֹהֶיךָ）<\/strong>：不是「那位神」，是「你的神」；是立約的稱呼。<strong>阿摩司把五次災之後，還是稱祂為「你的神」。<\/strong><\/p>","exp":"<p>十二節是整章的轉折，也是整章最安靜的一節。<strong>以色列啊，我必向你如此行；以色列啊，我既這樣行，你當預備迎見你的神。<\/strong>神連叫兩次「以色列啊」。這不是審判官的語氣，是一位父親站在門口叫孩子的聲音。<\/p><p>「我必向你如此行」到底是什麼？經文沒有說。這個留白，是故意的。前面五次災，每一次都已經說得很明白；而這一次，神不描述，只說：我要這樣做。人最怕的，往往不是已經知道的，而是還沒說出來的。<\/p><p>接著是整章的命令：<strong>你當預備迎見你的神。<\/strong>這句話，不是一個死刑通告。「預備」是一個去迎接的動作，「迎見」是站起來走向對方。同一個詞，也用在西奈山下，以色列人預備好，要遇見神。換一句話說：<strong>這是一個邀請，也是一個最後的機會，要在神來之前，自己先走向祂。<\/strong><\/p><p>我們不用這一節去嚇人，也不用它去算日子。它的意思，不是「末日要到了，趕快怕」，而是：<strong>神已經說了這麼多次，現在請你自己站起來，回到祂面前。<\/strong>這句話是今天就可以回應的：不是等某個日子，而是今天就轉身。<\/p>"},{"a":13,"z":13,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>כִּי הִנֵּה יוֹצֵר הָרִים וּבֹרֵא רוּחַ וּמַגִּיד לְאָדָם מַה שֵּׂחוֹ עֹשֵׂה שַׁחַר עֵיפָה וְדֹרֵךְ עַל בָּמֳתֵי אָרֶץ יְהוָה אֱלֹהֵֽי צְבָאוֹת שְׁמֽוֹ׃<\/p><\/blockquote>","lit":"<blockquote><p>「那創山、造風、將心意指示人、使晨光變為幽暗、腳踏在地之高處的，他的名是耶和華－萬軍之神。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>創（山）<\/td><td>יוֹצֵר<\/td><td>yotser<\/td><td>H3335<\/td><td>塑造者、陶匠<\/td><\/tr><tr><td>造（風）<\/td><td>וּבֹרֵא<\/td><td>uvore<\/td><td>H1254<\/td><td>創造者<\/td><\/tr><tr><td>指示<\/td><td>וּמַגִּיד<\/td><td>umaggid<\/td><td>H5046<\/td><td>使人知道、宣告<\/td><\/tr><tr><td>心意<\/td><td>שֵּׂחוֹ<\/td><td>sicho<\/td><td>H7808<\/td><td>他的心思、他的思想<\/td><\/tr><tr><td>晨光<\/td><td>שַׁחַר<\/td><td>shachar<\/td><td>H7837<\/td><td>晨光、黎明<\/td><\/tr><tr><td>幽暗<\/td><td>עֵיפָה<\/td><td>eifah<\/td><td>H5890<\/td><td>幽暗、黑暗<\/td><\/tr><tr><td>高處<\/td><td>בָּמֳתֵי<\/td><td>bamotei<\/td><td>H1116<\/td><td>高處、山的脊背<\/td><\/tr><tr><td>萬軍<\/td><td>צְבָאוֹת<\/td><td>tsevaot<\/td><td>H6635<\/td><td>萬軍（的）<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>三個分詞（יוֹצֵר、בֹּרֵא、מַגִּיד）<\/strong>：「創山」「造風」「指示」都是分詞，表示持續的、一直如此的作為。<strong>這是一首頌詞（doxology），與5:8--9；9:5--6 同屬全卷的三段頌詞，各有自己的位置。<\/strong><\/p><p><strong>心意（שֵּׂחוֹ）<\/strong>：這個字少見，字面是「他的思想、他的談話」；「他」指誰有爭議：「他」可以指神（神把自己的心思指示人），也可以指人（神把人心裡的思想說給人聽，意指神洞悉人心）。和合本讀作「將心意指示人」，意思是神向人顯明自己的心思。<strong>這是兩種讀法，同樣指向：神認識人，也向人說話。<\/strong><\/p><p><strong>使晨光變為幽暗（עֹשֵׂה שַׁחַר עֵיפָה）<\/strong>：「עֵיפָה」是「幽暗、黑暗」，字面是「使黎明成為黑暗」，可能是日蝕，也可能是一種詩歌式的反轉：神能把光變成暗，也能把暗變成光（5:8）。<\/p><p><strong>耶和華－萬軍之神（יְהוָה אֱלֹהֵי צְבָאוֹת שְׁמוֹ）<\/strong>：這是一個完整的名稱，在全卷多次出現，說祂是統管天上地下一切力量的主。<\/p>","exp":"<p>最後一節，阿摩司停下來，唱了一首短短的頌詞。前面十二節，是神的話對人說；到了十三節，換了一個聲音：<strong>那創山、造風、將心意指示人、使晨光變為幽暗、腳踏在地之高處的，他的名是耶和華－萬軍之神。<\/strong><\/p><p>為什麼在這裡放一首頌詞？因為前一句是「你當預備迎見你的神」，而聽到這句話的人，馬上會問：我要迎見的，是誰？十三節回答：<strong>祂是創造山的那一位，是造風的那一位，是曉得人心裡一切心思的那一位，是能使晨光變成幽暗的那一位，是腳踏在高處的那一位。<\/strong>祂不是伯特利或吉甲的神像，不是我們拿祭物就能打點的神。祂是創造者，也是審判者。<\/p><p>這一節有一個很重要的次序：從大到小，從山到風，到人的心。祂創造最堅固的（山），也創造最難捉摸的（風）；祂向人說話（心意），也能把早晨變為黑暗。<strong>我們要迎見的，是這樣一位神：大過一切，又靠近人心。<\/strong><\/p><p>頌詞沒有一個字說「所以你要害怕」。它說的，是祂的名字。<strong>敬畏，是認識這位神之後自然生出的；它不是恐慌，而是一種安靜的、站得住的、願意向祂走去的態度。<\/strong>第四章的結尾，把我們帶到一個名字面前：耶和華，萬軍之神。我們要迎見的，是祂。<\/p>"}],"5":[{"a":1,"z":1,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>שִׁמְעוּ אֶת הַדָּבָר הַזֶּה אֲשֶׁר אָנֹכִי נֹשֵׂא עֲלֵיכֶם קִינָה בֵּית יִשְׂרָאֵֽל׃<\/p><\/blockquote>","lit":"<blockquote><p>「以色列家啊，要聽我為你們所作的哀歌：」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>要聽<\/td><td>שִׁמְעוּ<\/td><td>shim'u<\/td><td>H8085<\/td><td>你們要聽（命令）<\/td><\/tr><tr><td>這話<\/td><td>הַדָּבָר<\/td><td>hadavar<\/td><td>H1697<\/td><td>這話、這事<\/td><\/tr><tr><td>作／舉起<\/td><td>נֹשֵׂא<\/td><td>noseh<\/td><td>H5375<\/td><td>舉起、扛起<\/td><\/tr><tr><td>哀歌<\/td><td>קִינָה<\/td><td>qinah<\/td><td>H7015<\/td><td>喪歌、輓歌<\/td><\/tr><tr><td>家<\/td><td>בֵּית<\/td><td>beit<\/td><td>H1004<\/td><td>家、家族<\/td><\/tr><tr><td>以色列<\/td><td>יִשְׂרָאֵֽל<\/td><td>yisra'el<\/td><td>H3478<\/td><td>以色列<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>哀歌（qinah）<\/strong>：喪禮上為死者所唱的輓歌（參撒下一章17節起，大衛為掃羅和約拿單所作的哀歌），常帶一種短促、拖長的節拍。阿摩司把這個體裁，用在還活著的人身上。<\/p><p><strong>作（nasa）<\/strong>：基本意思是「舉起、扛起」，常與訓詞、哀歌連用，是把一個沉重的話，扛到人面前。<\/p><p><strong>要聽（shama）<\/strong>：全卷追蹤字之一。本節是神向百姓發出的命令；到了五章23節，神會反過來說：我不聽。<\/p>","exp":"<p>五章一節，是這一卷書第一次出現「哀歌」這個字。<strong>先知說：以色列家啊，要聽我為你們所作的哀歌。<\/strong>哀歌，是人死了以後才唱的歌。可是這個國家還活著：街上有買賣，聖所有人潮，節期的歌聲一首接一首。<strong>阿摩司站在活人面前，唱他們的喪歌。<\/strong><\/p><p>請你留意「作」這個動詞，原文的意思是「舉起、扛起」。先知不是輕鬆地把這首歌丟出去，是像扛著一個擔子，把它扛到百姓面前。審判的話，從神口中出來是公義的；從先知口中唱出來，是帶著眼淚的。<strong>神把審判唱成哀歌，不是幸災樂禍，是心痛。<\/strong><\/p><p>「要聽」是全卷的追蹤字。這裡，神先請他們聽；二十三節，我們會看見一個令人心驚的反轉：祂說，我不聽你們彈琴的響聲。<strong>先是祂請人聽，後是祂不聽；中間的距離，就是這一章要講的事。<\/strong><\/p>"},{"a":2,"z":3,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>נָֽפְלָה לֹֽא תוֹסִיף קוּם בְּתוּלַת יִשְׂרָאֵל נִטְּשָׁה עַל אַדְמָתָהּ אֵין מְקִימָֽהּ כִּי כֹה אָמַר אֲדֹנָי יְהוִה הָעִיר הַיֹּצֵאת אֶלֶף תַּשְׁאִיר מֵאָה וְהַיּוֹצֵאת מֵאָה תַּשְׁאִיר עֲשָׂרָה לְבֵית יִשְׂרָאֵֽל׃<\/p><\/blockquote>","lit":"<blockquote><p>「以色列民跌倒，不得再起；躺在地上，無人攙扶。主耶和華如此說：以色列家的城發出一千兵的，只剩一百；發出一百的，只剩十個。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>跌倒<\/td><td>נָֽפְלָה<\/td><td>nafelah<\/td><td>H5307<\/td><td>跌倒、倒下<\/td><\/tr><tr><td>起來<\/td><td>קוּם<\/td><td>qum<\/td><td>H6965<\/td><td>起來、站起<\/td><\/tr><tr><td>處女<\/td><td>בְּתוּלַת<\/td><td>betulat<\/td><td>H1330<\/td><td>處女、年輕女子<\/td><\/tr><tr><td>撇下<\/td><td>נִטְּשָׁה<\/td><td>nittesha<\/td><td>H5203<\/td><td>撇下、丟棄<\/td><\/tr><tr><td>攙扶<\/td><td>מְקִימָֽהּ<\/td><td>meqimah<\/td><td>H6965<\/td><td>使她站起的人<\/td><\/tr><tr><td>一千<\/td><td>אֶלֶף<\/td><td>elef<\/td><td>H505<\/td><td>一千<\/td><\/tr><tr><td>一百<\/td><td>מֵאָה<\/td><td>me'ah<\/td><td>H3967<\/td><td>一百<\/td><\/tr><tr><td>十<\/td><td>עֲשָׂרָה<\/td><td>asarah<\/td><td>H6235<\/td><td>十<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>處女（betulah）<\/strong>：和合本註腳：原文是處女。「處女以色列」是一個詩意的稱呼，意思是一位本來有大好前程的年輕女子；這裡不是在談貞潔，是在為一個有指望的人哭。和合本譯作「以色列民」，是把意思說出來。<\/p><p><strong>不得再起<\/strong>：原文是「不再起來」，與「無人使她起來」前後呼應：跌倒（naphal）與起來（qum）是一對字。讀者可以留意，這一卷最後，神自己要把「倒塌的」立起來（九章11節），用的也是這一對字；但本章只讀本章：這個樣子的以色列，起不來。<\/p><p><strong>一千、一百、十<\/strong>：「發出」指一座城派出的兵。數字是形象，不是算術題，不用它去推算任何事。<\/p>","exp":"<p>二節只有一句，卻是整章的第一個畫面：<strong>以色列民跌倒，不得再起；躺在地上，無人攙扶。<\/strong>這不是戰場上的屍橫遍野，是一個人倒在路邊，沒有人伸手。「無人攙扶」四個字，比「跌倒」更痛：不只是倒下，是倒下以後，身邊沒有人。<\/p><p>原文稱以色列為「處女」。這個稱呼，帶著本來有大好前程的年輕女子的味道。<strong>她不是老死的，是還沒有活夠，就倒下了。<\/strong>先知用這個稱呼，是在為一個本來有指望的人哭。<\/p><p>三節把「倒下」換成數字：一座城派一千人出去，回來一百；派一百人出去，回來十個。我們不把它當成算術題，也不拿來推算任何事；<strong>它是在說，這個國家要失去的，是一個個家庭裡的一張張臉。<\/strong>讀到這裡，請先停一停，為將要失去親人的人哀哭。陪伴受傷的人，優先於議論傷害的原因。<\/p><p>還有一個細節：三節開頭說「主耶和華如此說」。這首哀歌，是神的話。<strong>唱歌的，是那位一直在看著這個民族的神。<\/strong><\/p>"},{"a":4,"z":5,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>כִּי כֹה אָמַר יְהוָה לְבֵית יִשְׂרָאֵל דִּרְשׁוּנִי וִֽחְיֽוּ וְאַֽל תִּדְרְשׁוּ בֵּֽית אֵל וְהַגִּלְגָּל לֹא תָבֹאוּ וּבְאֵר שֶׁבַע לֹא תַעֲבֹרוּ כִּי הַגִּלְגָּל גָּלֹה יִגְלֶה וּבֵֽית אֵל יִהְיֶה לְאָֽוֶן׃<\/p><\/blockquote>","lit":"<blockquote><p>「耶和華向以色列家如此說：你們要尋求我，就必存活。不要往伯特利尋求，不要進入吉甲，不要過到別是巴；因為吉甲必被擄掠，伯特利也必歸於無有。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>尋求我<\/td><td>דִּרְשׁוּנִי<\/td><td>dirshuni<\/td><td>H1875<\/td><td>你們要尋求我<\/td><\/tr><tr><td>存活<\/td><td>וִֽחְיֽוּ<\/td><td>vichyu<\/td><td>H2421<\/td><td>就必存活<\/td><\/tr><tr><td>伯特利<\/td><td>בֵּֽית<\/td><td>beit<\/td><td>H1008<\/td><td>伯（家）<\/td><\/tr><tr><td>吉甲<\/td><td>הַגִּלְגָּל<\/td><td>hagilgal<\/td><td>H1537<\/td><td>吉甲（地名）<\/td><\/tr><tr><td>別是巴<\/td><td>וּבְאֵר<\/td><td>uve'er<\/td><td>H884<\/td><td>井（別是巴）<\/td><\/tr><tr><td>被擄<\/td><td>גָּלֹה<\/td><td>galoh<\/td><td>H1540<\/td><td>必被擄走<\/td><\/tr><tr><td>無有<\/td><td>לְאָֽוֶן<\/td><td>le'aven<\/td><td>H205<\/td><td>虛無、禍患<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>尋求（darash）<\/strong>：基本意思是探問、求問，常用在到神面前求問（創二十五章22節）。「尋求我」與「往伯特利尋求」是同一個動詞：一個是尋求神自己，一個是尋求地方。<\/p><p><strong>就必存活<\/strong>：祈使句後接「就」，是命令加應許。「存活」不只是活著，是真的活。本章「尋求就存活」說了三次（4節、6節、14節）。<\/p><p><strong>雙關語<\/strong>：「吉甲必被擄掠」，原文是 Gilgal galoh yigleh，吉甲與「擄」音近，讀起來像一句判詞。「伯特利」是「神的家」，卻要歸於「亞文」（aven，虛無、禍患）；何西阿書稱伯特利為「伯亞文」（何四章15節）。<\/p><p><strong>別是巴<\/strong>：在南邊猶大地界，北國的人也要走去朝聖（參八章14節）。<\/p>","exp":"<p>哀歌唱完，神開口，說的不是「我要滅你們」，而是一個邀請：<strong>你們要尋求我，就必存活。<\/strong>四節是全章的鑰匙。「尋求」是一個貼近的動詞，是登門求問，是把你的難處，帶到一位面前。神說：來找我。<\/p><p>接著五節，神說了一句令人意外的話：不要往伯特利，不要進吉甲，不要過到別是巴。這三個地方，都是有故事的聖地：伯特利有雅各的夢，吉甲是進迦南後紮營的地方，別是巴有亞伯拉罕與以撒築壇的記念。這些不是壞地方。<strong>可是神說，不要往那裡尋求。<\/strong>一個人可以去很多次聖地，卻沒有真的找到神。<\/p><p>原文有一個雙關語：吉甲聽起來像「被擄」，伯特利（神的家）要變成「亞文」（虛無）。<strong>地名在神口中，變成了判詞。<\/strong>這不是在否定聖地的歷史，而是在問：你在那裡，尋求的是地方，還是我？<\/p><p>「尋求神」與「尋求聖地」，不是二選一的敵人；問題在於，哪一個在心裡佔了第一位。<strong>神要的，不是更多的朝聖，是一個人轉過身來，找祂。<\/strong><\/p>"},{"a":6,"z":6,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>דִּרְשׁוּ אֶת יְהוָה וִֽחְיוּ פֶּן יִצְלַח כָּאֵשׁ בֵּית יוֹסֵף וְאָכְלָה וְאֵין מְכַבֶּה לְבֵֽית אֵֽל׃<\/p><\/blockquote>","lit":"<blockquote><p>「要尋求耶和華，就必存活，免得他在約瑟家像火發出，在伯特利焚燒，無人撲滅。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>要尋求<\/td><td>דִּרְשׁוּ<\/td><td>dirshu<\/td><td>H1875<\/td><td>你們要尋求<\/td><\/tr><tr><td>耶和華<\/td><td>יְהוָה<\/td><td>YHWH<\/td><td>H3068<\/td><td>耶和華<\/td><\/tr><tr><td>存活<\/td><td>וִֽחְיוּ<\/td><td>vichyu<\/td><td>H2421<\/td><td>就必存活<\/td><\/tr><tr><td>免得<\/td><td>פֶּן<\/td><td>pen<\/td><td>H6435<\/td><td>免得、恐怕<\/td><\/tr><tr><td>火<\/td><td>כָּאֵשׁ<\/td><td>ka'esh<\/td><td>H784<\/td><td>像火<\/td><\/tr><tr><td>約瑟<\/td><td>יוֹסֵף<\/td><td>yosef<\/td><td>H3130<\/td><td>約瑟（北國的代稱）<\/td><\/tr><tr><td>撲滅<\/td><td>מְכַבֶּה<\/td><td>mekhabbeh<\/td><td>H3518<\/td><td>撲滅的人<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>約瑟家<\/strong>：以法蓮與瑪拿西是約瑟的兩個兒子，「約瑟家」常用來指北國以色列。<\/p><p><strong>免得（pen）<\/strong>：表示警告的連接詞。這一節把四節的邀請，再說一次，並說出不尋求的後果。<\/p><p><strong>像火發出<\/strong>：「發出」這個動詞，常有「猛然闖入」的意思，用在火上，是火勢竄起，無人能擋。<\/p>","exp":"<p>六節把四節的邀請，再說一次，這次多了一個「免得」。<strong>要尋求耶和華，就必存活，免得他在約瑟家像火發出，在伯特利焚燒，無人撲滅。<\/strong>前面神先用「就必存活」邀請，現在用「免得」提醒：不要等到火已經燒起來。<\/p><p>請你注意，四節說「尋求我」，六節說「尋求耶和華」。<strong>同一個邀請，從「我」，說成了「祂」的名字。<\/strong>神不是在談一個抽象的力量；祂是有名字、有位格的那一位。<\/p><p>「無人撲滅」，與二節「無人攙扶」，是一對。前者是倒下沒有人扶，後者是火燒沒有人滅。<strong>這兩個「無人」，都在說：那一位肯親自伸手的，只有神。<\/strong>人若拒絕祂，就沒有別的指望。<\/p><p>這也是一個慈愛的警告。警告不是為了嚇人，是為了讓人看見：現在回頭，還來得及。我們不用這節話去恐嚇會眾，只用它說：神還在說「尋求我」。<\/p>"},{"a":7,"z":9,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הַהֹפְכִים לְלַעֲנָה מִשְׁפָּט וּצְדָקָה לָאָרֶץ הִנִּֽיחוּ עֹשֵׂה כִימָה וּכְסִיל וְהֹפֵךְ לַבֹּקֶר צַלְמָוֶת וְיוֹם לַיְלָה הֶחְשִׁיךְ הַקּוֹרֵא לְמֵֽי הַיָּם וַֽיִּשְׁפְּכֵם עַל פְּנֵי הָאָרֶץ יְהוָה שְׁמֽוֹ הַמַּבְלִיג שֹׁד עַל עָז וְשֹׁד עַל מִבְצָר יָבֽוֹא׃<\/p><\/blockquote>","lit":"<blockquote><p>「你們這使公平變為茵蔯、將公義丟棄於地的，要尋求那造昴星和參星，使死蔭變為晨光，使白日變為黑夜，命海水來澆在地上的－耶和華是他的名；他使力強的忽遭滅亡，以致保障遭遇毀壞。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>使變為<\/td><td>הַהֹפְכִים<\/td><td>hahofekhim<\/td><td>H2015<\/td><td>翻轉、使變為<\/td><\/tr><tr><td>茵蔯<\/td><td>לְלַעֲנָה<\/td><td>le'la'anah<\/td><td>H3939<\/td><td>苦艾、苦草<\/td><\/tr><tr><td>公平<\/td><td>מִשְׁפָּט<\/td><td>mishpat<\/td><td>H4941<\/td><td>公平、正確的審斷<\/td><\/tr><tr><td>公義<\/td><td>וּצְדָקָה<\/td><td>utsedaqah<\/td><td>H6666<\/td><td>公義、合神心意的對待<\/td><\/tr><tr><td>丟棄<\/td><td>הִנִּֽיחוּ<\/td><td>hinniyhu<\/td><td>H3240<\/td><td>放下、撇在<\/td><\/tr><tr><td>昴星<\/td><td>כִימָה<\/td><td>khimah<\/td><td>H3598<\/td><td>昴星（傳統譯法）<\/td><\/tr><tr><td>參星<\/td><td>וּכְסִיל<\/td><td>ukhesil<\/td><td>H3685<\/td><td>參星（傳統譯法）<\/td><\/tr><tr><td>死蔭<\/td><td>צַלְמָוֶת<\/td><td>tsalmavet<\/td><td>H6757<\/td><td>深黑暗、死蔭<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>使變為（hafakh）<\/strong>：七節「使公平變為茵蔯」與八節「使死蔭變為晨光」，用的是同一個動詞。人用它把好的翻成苦的；神用它把暗的翻成光。<\/p><p><strong>公平、公義（mishpat、tsedaqah）<\/strong>：全卷追蹤字。公平是審斷與對待的正確；公義是合乎神心意、對人守約的生活。這一對字，在本卷第一次一起出現，就是被糟蹋的樣子。<\/p><p><strong>昴星和參星<\/strong>：Khimah 與 Khesil，傳統認為是昴星與參星（伯九章9節、三十八章31節），學者對確切的星座有不同看法，意思都是「神是天上星辰的創造者」。<\/p><p><strong>死蔭（tsalmavet）<\/strong>：傳統讀為「死的蔭影」，也有學者讀為「極深的黑暗」，兩種讀法，意思相近。<\/p><p><strong>結構<\/strong>：七節是一句沒有說完的話，八節至九節插入一段讚美詩（參四章13節、九章5至6節的詩句），把創造主放進來。九節 hamablig 一字罕見，確切的意思不能肯定，和合本譯作「忽遭滅亡」，大意是清楚的：強者的保障，擋不住神。<\/p>","exp":"<p>七節是一句沒有說完的話：<strong>你們這使公平變為茵蔯、將公義丟棄於地的。<\/strong>茵蔯是苦草；本來該是甜的公平，在他們手裡成了苦的。公義呢？被丟在地上，像一件沒有人要的東西。這是「公平」與「公義」在這一卷第一次一起出現，就是被糟蹋的樣子。<\/p><p>然後，先知的話忽然斷開，插進一首讚美詩。<strong>造昴星和參星的，使死蔭變為晨光的，使白日變為黑夜的，召海水澆在地上的：耶和華是他的名。<\/strong>請你留意那個動詞「變為」：七節人把公平「變為」茵蔯；八節神把死蔭「變為」晨光。同一個字，兩種手。人把好的翻成苦的；神把暗的翻成光，也能把白日翻成黑夜。<\/p><p>為什麼要在這裡提醒他們，神是創造主？因為他們只知道，神是節期裡的神。<strong>阿摩司要他們看見：那位造星的，也是城門口的神。<\/strong>祂不只管聖所裡的香火，也管街上的秤、城門口的審判。<\/p><p>九節說，祂使力強的忽遭滅亡，保障也遭遇毀壞。這不是對任何一個人的詛咒，是在說：用權勢築起來的安全，擋不住那位創造者。<\/p>"},{"a":10,"z":13,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>שָׂנְאוּ בַשַּׁעַר מוֹכִיחַ וְדֹבֵר תָּמִים יְתָעֵֽבוּ לָכֵן יַעַן בּוֹשַׁסְכֶם עַל דָּל וּמַשְׂאַת בַּר תִּקְחוּ מִמֶּנּוּ בָּתֵּי גָזִית בְּנִיתֶם וְלֹא תֵשְׁבוּ בָם כַּרְמֵי חֶמֶד נְטַעְתֶּם וְלֹא תִשְׁתּוּ אֶת יֵינָֽם כִּי יָדַעְתִּי רַבִּים פִּשְׁעֵיכֶם וַעֲצֻמִים חַטֹּֽאתֵיכֶם צֹרְרֵי צַדִּיק לֹקְחֵי כֹפֶר וְאֶבְיוֹנִים בַּשַּׁעַר הִטּֽוּ לָכֵן הַמַּשְׂכִּיל בָּעֵת הַהִיא יִדֹּם כִּי עֵת רָעָה הִֽיא׃<\/p><\/blockquote>","lit":"<blockquote><p>「你們怨恨那在城門口責備人的，憎惡那說正直話的。你們踐踏貧民，向他們勒索麥子；你們用鑿過的石頭建造房屋，卻不得住在其內；栽種美好的葡萄園，卻不得喝所出的酒。我知道你們的罪過何等多，你們的罪惡何等大。你們苦待義人，收受賄賂，在城門口屈枉窮乏人。所以通達人見這樣的時勢必靜默不言，因為時勢真惡。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>怨恨<\/td><td>שָׂנְאוּ<\/td><td>sane'u<\/td><td>H8130<\/td><td>恨惡<\/td><\/tr><tr><td>城門口<\/td><td>בַשַּׁעַר<\/td><td>bashsha'ar<\/td><td>H8179<\/td><td>在城門（審案之處）<\/td><\/tr><tr><td>責備人的<\/td><td>מוֹכִיחַ<\/td><td>mokhiach<\/td><td>H3198<\/td><td>責備、仲裁的人<\/td><\/tr><tr><td>貧民<\/td><td>דָּל<\/td><td>dal<\/td><td>H1800<\/td><td>貧弱的人<\/td><\/tr><tr><td>賄賂<\/td><td>כֹפֶר<\/td><td>kofer<\/td><td>H3724<\/td><td>贖價、賄賂<\/td><\/tr><tr><td>義人<\/td><td>צַדִּיק<\/td><td>tsaddiq<\/td><td>H6662<\/td><td>義人、有理的人<\/td><\/tr><tr><td>通達人<\/td><td>הַמַּשְׂכִּיל<\/td><td>hamaskil<\/td><td>H7919<\/td><td>通達人、有見識的人<\/td><\/tr><tr><td>靜默<\/td><td>יִדֹּם<\/td><td>yiddom<\/td><td>H1826<\/td><td>靜默、閉口<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>城門口（sha'ar）<\/strong>：古代城市的審案之處，長老在城門口坐著判斷訟事。「在城門口」是一個制度的地方，也是弱者最後的指望。<\/p><p><strong>怨恨（sane'u）<\/strong>：同一個字根，在十五節是神要人「惡惡」，二十一節是神說「我厭惡」。人恨惡責備的人，神恨惡他們的節期。<\/p><p><strong>踐踏（五章11節）<\/strong>：原文 boshaskhem 的字形罕見，一般理解為「踐踏」，也有人理解為「徵收」。「勒索麥子」指從貧民身上拿取糧食。「鑿過的石頭房子」「美好的葡萄園」，使我們想起申命記二十八章30節那種「建造卻不得住」的咒詛。<\/p><p><strong>賄賂（kofer）<\/strong>：本是「贖價」，這裡是收了錢，就把案子判歪。<\/p><p><strong>通達人靜默不言（五章13節）<\/strong>：有三種讀法：（一）智慧的人在惡世裡，因為危險而閉口；（二）這是諷刺，是在指責該說話的人沒有說話；（三）這是描寫審判前的肅靜。本講義的判斷：十三節首先是在<em>描寫處境<\/em>：在一個說正直話的人被憎惡的城門口，連通達人也不敢開口；它沒有稱讚沉默，十四至十五節仍然呼召人在城門口行義；但也不用這一節去定因為害怕而不敢開口的人的罪。<\/p>","exp":"<p>十節說的是一件很具體的事：城門口，有人責備，有人說正直話，結果，他們被怨恨、被憎惡。<strong>在一個地方，若說真話的人被人恨，這個地方的公平，就已經病了。<\/strong>城門口，是審案的地方，是一個城最後的公道。可是，說真話的人在那裡被嫌棄。<\/p><p>十一節把「貧民」放在眼前：踐踏他們，向他們勒索麥子。於是，有人蓋了鑿過的石頭房子，種了美好的葡萄園。神說：你們住不進去，也喝不到酒。<strong>用別人的飯碗換來的房子，住不安穩。<\/strong>這不是神對富有的嫉妒，是神對一個把人當成工具的世界的看見。<\/p><p>十二節，是這一段最讓人不安的一句：<strong>我知道你們的罪過何等多，你們的罪惡何等大。<\/strong>神說：我知道。受欺壓的人，常常覺得沒有人知道；這一節是對他們說的：神知道，神看見，神記下了。義人被苦待，窮乏人在城門口被屈枉，沒有一件，是祂沒有看見的。<\/p><p>十三節很難讀：通達人見這樣的時勢，必靜默不言。是智慧，是害怕，還是諷刺？各家的讀法不同。<strong>可以確定的是：在一個說真話會受罰的地方，人會安靜下來。<\/strong>若你曾經因為害怕而不敢開口，這一節沒有在責罵你；神只是說，這是一個真惡的時勢。我們也留意，下一節立刻又為人開了一扇門。<\/p>"},{"a":14,"z":15,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>דִּרְשׁוּ טוֹב וְאַל רָע לְמַעַן תִּֽחְיוּ וִיהִי כֵן יְהוָה אֱלֹהֵֽי צְבָאוֹת אִתְּכֶם כַּאֲשֶׁר אֲמַרְתֶּֽם שִׂנְאוּ רָע וְאֶהֱבוּ טוֹב וְהַצִּיגוּ בַשַּׁעַר מִשְׁפָּט אוּלַי יֶֽחֱנַן יְהוָה אֱלֹהֵֽי צְבָאוֹת שְׁאֵרִית יוֹסֵֽף׃<\/p><\/blockquote>","lit":"<blockquote><p>「你們要求善，不要求惡，就必存活。這樣，耶和華－萬軍之神必照你們所說的與你們同在。要惡惡好善，在城門口秉公行義；或者耶和華－萬軍之神向約瑟的餘民施恩。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>要求<\/td><td>דִּרְשׁוּ<\/td><td>dirshu<\/td><td>H1875<\/td><td>你們要尋求<\/td><\/tr><tr><td>善<\/td><td>טוֹב<\/td><td>tov<\/td><td>H2896<\/td><td>善、好<\/td><\/tr><tr><td>同在<\/td><td>אִתְּכֶם<\/td><td>ittekhem<\/td><td>H854<\/td><td>與你們同在<\/td><\/tr><tr><td>愛<\/td><td>וְאֶהֱבוּ<\/td><td>ve'ehevu<\/td><td>H157<\/td><td>愛<\/td><\/tr><tr><td>秉公行義／立住<\/td><td>וְהַצִּיגוּ<\/td><td>vehatsigu<\/td><td>H3322<\/td><td>使它站立、建立<\/td><\/tr><tr><td>公平<\/td><td>מִשְׁפָּט<\/td><td>mishpat<\/td><td>H4941<\/td><td>公平<\/td><\/tr><tr><td>或者<\/td><td>אוּלַי<\/td><td>ulay<\/td><td>H194<\/td><td>或者、也許<\/td><\/tr><tr><td>餘民<\/td><td>שְׁאֵרִית<\/td><td>she'erit<\/td><td>H7611<\/td><td>剩下的人<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>要求善（dirshu tov）<\/strong>：「求」與四節、六節的「尋求」是同一個動詞。這裡的「善」，不是抽象的好，是接下來「在城門口秉公行義」的具體形狀。<\/p><p><strong>必照你們所說的與你們同在<\/strong>：「你們所說的」，是百姓的口頭禪：耶和華與我們同在。彌迦書三章11節有類似的話。這句話沒有被否定，而是被修正：神與你們同在，要在你們求善的時候。<\/p><p><strong>使公平站立（hatsigu mishpat）<\/strong>：「立住」是使它站穩、安放在位置上。公平不是一個口號，是一個要放在城門口、站得住的東西。<\/p><p><strong>或者（ulay）<\/strong>：這個字表示「也許」。神的恩典不是一份保證契約，而是神自由的施予。對照約拿書三章9節「或者」的用法，是人在神面前沒有權利可說，只能仰望。<\/p><p><strong>約瑟的餘民<\/strong>：與三節「只剩十個」呼應；那些剩下的，神仍然要向他們施恩。<\/p>","exp":"<p>十四節，神在審判的哀歌中間，第三次說：<strong>你們要求善，不要求惡，就必存活。<\/strong>四節、六節，說「尋求我」「尋求耶和華」；十四節說「求善」。這不是兩件事：<strong>尋求神的人，必然愛神所愛的。<\/strong>求善，不是一個道德口號，是跟著那位善的神走。<\/p><p>後面一句很有意思：耶和華萬軍之神必照你們所說的，與你們同在。他們一直說：神與我們同在。這句話，神沒有否定，卻把它扶正：祂與你們同在，是在你們求善的時候，不是在你們壓人的時候。<\/p><p>十五節：要惡惡好善，在城門口秉公行義。這是一個很具體的呼召：<strong>公平，要在城門口站得住。<\/strong>在審案的地方，在有權有錢的人面前，仍然站住。這是這一章第二次提到「公平」。<\/p><p>然後是一個字：「或者」。<strong>神沒有說：一定。祂說：或者。<\/strong>恩典不是一個可以和神討價還價的合約，是神自由的手。我們有時對神說：祢應許過。這裡，神把門打開，卻不被人綁住。向約瑟的餘民，仍然有「或者」：剩下的人，仍然可以仰望。<\/p>"},{"a":16,"z":17,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>לָכֵן כֹּֽה אָמַר יְהוָה אֱלֹהֵי צְבָאוֹת אֲדֹנָי בְּכָל רְחֹבוֹת מִסְפֵּד וּבְכָל חוּצוֹת יֹאמְרוּ הוֹ הוֹ וְקָרְאוּ אִכָּר אֶל אֵבֶל וּמִסְפֵּד אֶל יוֹדְעֵי נֶֽהִי וּבְכָל כְּרָמִים מִסְפֵּד כִּֽי אֶעֱבֹר בְּקִרְבְּךָ אָמַר יְהוָֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「主耶和華－萬軍之神如此說：在一切寬闊處必有哀號的聲音；在各街市上必有人說：哀哉！哀哉！又必叫農夫來哭號，叫善唱哀歌的來舉哀。在各葡萄園必有哀號的聲音，因為我必從你中間經過。這是耶和華說的。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>哀號<\/td><td>מִסְפֵּד<\/td><td>misped<\/td><td>H4553<\/td><td>哀哭、舉哀<\/td><\/tr><tr><td>寬闊處<\/td><td>רְחֹבוֹת<\/td><td>rechovot<\/td><td>H7339<\/td><td>寬闊的廣場<\/td><\/tr><tr><td>街市<\/td><td>חוּצוֹת<\/td><td>chutsot<\/td><td>H2351<\/td><td>街道<\/td><\/tr><tr><td>哀哉<\/td><td>הוֹ<\/td><td>ho<\/td><td>H1930<\/td><td>哀哉（呼喊聲）<\/td><\/tr><tr><td>農夫<\/td><td>אִכָּר<\/td><td>ikkar<\/td><td>H406<\/td><td>農夫<\/td><\/tr><tr><td>哭號<\/td><td>אֵבֶל<\/td><td>evel<\/td><td>H60<\/td><td>哀悼、悲哀<\/td><\/tr><tr><td>葡萄園<\/td><td>כְּרָמִים<\/td><td>keramim<\/td><td>H3754<\/td><td>葡萄園（複數）<\/td><\/tr><tr><td>經過<\/td><td>אֶעֱבֹר<\/td><td>e'evor<\/td><td>H5674<\/td><td>我要經過、走過<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>經過（avar）<\/strong>：「我必從你中間經過」。這個動詞，使我們想起出埃及記十二章12節：耶和華在那夜「巡行」埃及地。那裡的神，是為了拯救自己的百姓而行；這裡，祂的經過，卻落在自己的百姓中間。本講義只說「使我們想起」，不做預表。<\/p><p><strong>哀哉（ho）<\/strong>：是哀喊的聲音，後面十八節的「有禍了」（hoy）與它近似，都是喪禮上的呼喊。<\/p><p><strong>善唱哀歌的<\/strong>：原文是「知道哀號的人」，指專職舉哀的人。連他們都被叫來，表示要哭的人多到人手不夠。<\/p>","exp":"<p>十六節開頭是「所以」。<strong>在一切寬闊處，必有哀號的聲音；在各街市上，必有人說：哀哉！哀哉！<\/strong>廣場、街道，是一個城最熱鬧的地方，現在，成了舉哀的地方。農夫也被叫來哭，連專門唱哀歌的人，都被請來舉哀。這個畫面是說：要哭的人，多到人手不夠。<\/p><p>十七節把哀號帶到葡萄園：<strong>在各葡萄園必有哀號的聲音。<\/strong>葡萄園本來是歡呼收割的地方，現在是哭聲。一個最喜樂的地方，成了最悲傷的地方。這不是在嚇人，是在說：神的審判，不躲在遙遠的地方，它走進人最日常的生活。<\/p><p>原因，是最後一句：<strong>因為我必從你中間經過。這是耶和華說的。<\/strong>「經過」這個字，使我們想起出埃及那夜，耶和華巡行埃及地；那時，祂的經過，是為了拯救自己的百姓；這次，祂的經過，是在百姓中間。神離他們很近，近到不能再假裝沒有事。<\/p><p>這一段的末句，是這一章的第一次「這是耶和華說的」。神在審判的哀歌裡，再一次，用祂的名字，為這些話作保證。<\/p>"},{"a":18,"z":20,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הוֹי הַמִּתְאַוִּים אֶת יוֹם יְהוָה לָמָּה זֶּה לָכֶם יוֹם יְהוָה הוּא חֹשֶׁךְ וְלֹא אֽוֹר כַּאֲשֶׁר יָנוּס אִישׁ מִפְּנֵי הָאֲרִי וּפְגָעוֹ הַדֹּב וּבָא הַבַּיִת וְסָמַךְ יָדוֹ עַל הַקִּיר וּנְשָׁכוֹ הַנָּחָֽשׁ הֲלֹא חֹשֶׁךְ יוֹם יְהוָה וְלֹא אוֹר וְאָפֵל וְלֹא נֹגַֽהּ לֽוֹ׃<\/p><\/blockquote>","lit":"<blockquote><p>「想望耶和華日子來到的有禍了！你們為何想望耶和華的日子呢？那日黑暗沒有光明，景況好像人躲避獅子又遇見熊，或是進房屋以手靠牆，就被蛇咬。耶和華的日子不是黑暗沒有光明嗎？不是幽暗毫無光輝嗎？」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>有禍了<\/td><td>הוֹי<\/td><td>hoy<\/td><td>H1945<\/td><td>有禍了（喪禮的呼喊）<\/td><\/tr><tr><td>想望<\/td><td>הַמִּתְאַוִּים<\/td><td>hamit'avvim<\/td><td>H183<\/td><td>渴望、一直想要的人<\/td><\/tr><tr><td>日子<\/td><td>יוֹם<\/td><td>yom<\/td><td>H3117<\/td><td>日子<\/td><\/tr><tr><td>黑暗<\/td><td>חֹשֶׁךְ<\/td><td>choshekh<\/td><td>H2822<\/td><td>黑暗<\/td><\/tr><tr><td>光明<\/td><td>אוֹר<\/td><td>or<\/td><td>H216<\/td><td>光<\/td><\/tr><tr><td>獅子<\/td><td>הָאֲרִי<\/td><td>ha'ari<\/td><td>H738<\/td><td>獅子<\/td><\/tr><tr><td>熊<\/td><td>הַדֹּב<\/td><td>hadov<\/td><td>H1677<\/td><td>熊<\/td><\/tr><tr><td>蛇<\/td><td>הַנָּחָשׁ<\/td><td>hanachash<\/td><td>H5175<\/td><td>蛇<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>有禍了（hoy）<\/strong>：原是喪禮上的哀喊（參王上十三章30節），用在這裡，等於是對還活著的人，先唱起了喪歌，與十六節的「哀哉」（ho）一脈相承。<\/p><p><strong>想望（mit'avvim）<\/strong>：分詞，指「一直在想、一直在盼望」的人。他們不是偶爾想，是天天盼。<\/p><p><strong>耶和華的日子（yom YHWH）<\/strong>：聖經中最早的出現之一。學者對這個詞的背景有不同的看法：有人認為是耶和華為百姓爭戰得勝的日子，有人認為與聖殿節期有關。本講義不需要解決這個爭論：阿摩司聽見的，是百姓的盼望：那日子必然站在我們這邊；而神的話是：那日是黑暗。<\/p><p><strong>黑暗（choshekh）、幽暗（afel）、光輝（nogah）<\/strong>：二十節用「不是……嗎」的問句，把答案說成了他們自己不得不承認的事。<\/p>","exp":"<p>十八節，一個新的呼喊，<strong>想望耶和華日子來到的有禍了！<\/strong>「有禍了」，本是喪禮上的呼喊。先知對著一群每天盼望神出手的人，先唱起了喪歌。為什麼？<strong>你們為何想望耶和華的日子呢？那日黑暗沒有光明。<\/strong><\/p><p>我們可以想像，這些人是真心的。他們盼望神來，盼望國家得勝，盼望敵人被擊敗。耶和華的日子，在他們心中是光明的日子。可是阿摩司說：那日對你們來說，是黑暗。<strong>原因不是神變了，是他們站在了錯誤的位置：他們一邊盼望神，一邊在城門口壓人。<\/strong><\/p><p>十九節，用一個畫面把這種「無處可逃」說出來：躲開了獅子，又遇見熊；好不容易進了房屋，以手靠牆，就被蛇咬。連最安全的家，也不是避難所。一個人，若以為自己站在神那一邊，卻沒有在公平上與神同行，神的日子，就不是安慰。<\/p><p>二十節用問句收束：<strong>耶和華的日子不是黑暗沒有光明嗎？不是幽暗毫無光輝嗎？<\/strong>讀這段話，我們不推算那一天，也不排時間；只問今天：我所盼望的神，是那位真的神嗎？我盼望祂來，我今天的生活，經得起祂來嗎？<\/p>"},{"a":21,"z":22,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>שָׂנֵאתִי מָאַסְתִּי חַגֵּיכֶם וְלֹא אָרִיחַ בְּעַצְּרֹֽתֵיכֶֽם כִּי אִם תַּעֲלוּ לִי עֹלוֹת וּמִנְחֹתֵיכֶם לֹא אֶרְצֶה וְשֶׁלֶם מְרִיאֵיכֶם לֹא אַבִּֽיט׃<\/p><\/blockquote>","lit":"<blockquote><p>「我厭惡你們的節期，也不喜悅你們的嚴肅會。你們雖然向我獻燔祭和素祭，我卻不悅納，也不顧你們用肥畜獻的平安祭；」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>厭惡<\/td><td>שָׂנֵאתִי<\/td><td>sane'ti<\/td><td>H8130<\/td><td>我恨惡<\/td><\/tr><tr><td>鄙棄<\/td><td>מָאַסְתִּי<\/td><td>ma'asti<\/td><td>H3988<\/td><td>我拒絕、我鄙棄<\/td><\/tr><tr><td>節期<\/td><td>חַגֵּיכֶם<\/td><td>chaggeikhem<\/td><td>H2282<\/td><td>你們的節期<\/td><\/tr><tr><td>嚴肅會<\/td><td>בְּעַצְּרֹֽתֵיכֶֽם<\/td><td>be'atsrotekhem<\/td><td>H6116<\/td><td>你們的嚴肅會<\/td><\/tr><tr><td>聞（香氣）<\/td><td>אָרִיחַ<\/td><td>arichah<\/td><td>H7306<\/td><td>聞（馨香）<\/td><\/tr><tr><td>燔祭<\/td><td>עֹלוֹת<\/td><td>olot<\/td><td>H5930<\/td><td>燔祭<\/td><\/tr><tr><td>平安祭<\/td><td>וְשֶׁלֶם<\/td><td>veshelem<\/td><td>H8002<\/td><td>平安祭<\/td><\/tr><tr><td>悅納<\/td><td>אֶרְצֶה<\/td><td>ertseh<\/td><td>H7521<\/td><td>喜悅、接納<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>我厭惡、我鄙棄（sane'ti、ma'asti）<\/strong>：兩個動詞，中間沒有連接詞，是一口氣說出的重話。「恨惡」這個字根，十節是人恨責備的人，十五節是神要人惡惡，在這裡，是神恨惡他們的節期。<\/p><p><strong>你們的節期<\/strong>：原文是你們的節期、你們的嚴肅會。這些節期，本是神所設立的（利二十三章），這裡說「你們的」，指的是他們現在所過的樣子。<\/p><p><strong>我不聞（lo ariach）<\/strong>：「聞馨香」是祭祀
