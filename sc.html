出來。這一課的焦點，不在我們擁有多少，不在誰的位子比較高，也不在環境的好壞，而是那位為城哀哭、為朋友流淚、為我們的破碎付上自己的耶穌。"],["p","主耶穌，謝謝祢，在我們安逸的時候，先為我們哀哭；求祢醫治我們的麻木，使我們不再倚靠自己的山，單單倚靠祢；也使我們的心，為別人的痛，有感覺。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["m","帶領說明：今天這一課，我們用三個化來走一遍：先把話放進自己心裡（內化），再一起想通、說出口、走一步（消化），最後把這一課帶到人面前（轉化）。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化　內化（約20分鐘）"],["m","目的：讓每個人先把經文放進自己的心裡，看見自己的位置，不急著討論別人。"],["n","1. ★ 六章六節說：卻不為約瑟的苦難擔憂。請說出，你最近一次吃得很好、過得很舒服，是在什麼時候、跟誰在一起。"],["n","2. ★ 六章一節，神先為安逸的人哀哭。你有沒有一個時刻，覺得自己的心，有點麻木？請說出一個，不必細節。"],["n","3. ★★ 六章一節「倚靠撒馬利亞山」。你現在最倚靠的一座「山」是什麼？是位子、存款、名聲，還是別的？請說出一個。"],["n","4. ★★★ 請在安靜中想一個人：一位你知道正在痛、卻很久沒有關心的人。現在用一句話寫下他的名字，並寫下你願意怎麼問候他。"],["m","帶領提醒：請先安靜念六章六節，再開始。不要點名逼人說。這一章會碰到「享受」「麻木」「欺壓」「喪慟」：如果有人提到被欺壓、被剝削、家庭暴力、剛失去親人、長期憂鬱或輕生的念頭，不追問細節，不要求原諒，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助他尋求專業的幫助。"],["s","第二化　消化（約35分鐘·主軸）"],["m","目的：看見自己、聽神說話、想通關卡、說出口、走一步，讓這一課成為自己的話。"],["t","【看】看見自己"],["n","5. ★ 看見自己：對照六章四到六節，你的生活裡，有哪一樣享受，最容易讓你忘記身邊有人在痛？請說出一個。"],["t","【聽】聽神說話"],["n","6. ★★ 聽神說話：安靜三分鐘，聽六章八節神指著自己起誓。你心裡聽見的，是憎惡，還是哀哭？請說出你聽到的第一個感覺。"],["t","【想】想通關卡"],["n","7. ★★★ 想通關卡：六章十二節，公平變為苦膽，神要的卻是公義的果子。請用自己的話向組員說明：為什麼神要的公義，是從認識祂長出來的，不是一場運動？"],["t","【講】說出口"],["n","8. ★★ 說出口：用一句話向一位組員說，你這個星期，可以先為哪一位正在痛的人，做一件小事，並當場說出名字。"],["t","【行】走一步"],["n","9. ★★★ 走一步：請決定這個星期的哪一天，向這位正在痛的人傳一句話或打一通電話，寫下時間，並說出誰會提醒你。"],["m","帶領提醒：依【看】【聽】【想】【講】【行】的順序走，每一步留足時間。【講】的時候，只要說出一句、一個名字、一個時間，不必講故事。若有人眼淚掉下來，不追問細節，也不要求他原諒誰，先安靜陪著，會後單獨關心。"],["s","第三化　轉化（約25分鐘）"],["m","目的：把這一課帶出去：進入家庭、職場、教會的真實關係，並讓福音繼續繁殖。"],["n","10. ★ 你身邊有沒有一位，因為怕麻煩人，所以不說自己正在痛的人？請說出名字，並決定這個月怎樣問候他。"],["n","11. ★★ 你的小組或教會，有沒有一位被忽略、很少被看見的人？請說出具體的一位，並說你可以先從哪裡開始關心他。"],["n","12. ★★ 你有沒有一位曾經陪你哭、沒有急著給建議的人？請說出名字，並決定這個月向他說聲謝謝。"],["n","13. ★★★ 920 操練：找出你的那一個「2」，就是你最想陪他一起「讓心醒著」的那位，這個星期向他分享，並且當場說出他的名字。"],["n","14. ★★★ 【必做】請在這個星期，把這一課用三句話講給一位教會外的朋友聽，並在下次小組回報：你對誰講的、在哪裡講、他的反應是什麼。"],["m","帶領提醒：請特別提醒：不要在小組裡用這一章去指責任何人是「安逸的人」或「欺壓人的人」，不要論斷任何人的餐桌或房子，也不要用經文推算任何時間或套用到今日任何國家或領袖。若有人分享被欺壓、被剝削、喪慟、憂鬱、輕生的念頭或家庭暴力的經歷，不追問細節、不要求原諒，不對他說「這是審判」，會後單獨關心，必要時協助尋求輔導或其他專業的協助。"],["s","收尾（5分鐘）"],["p","請大家輕輕閉上眼睛，把今天寫下的那一個名字，放在神面前。一起念六章六節。"],["p","由帶領者為每一位禱告：求神醫治我們的麻木，使我們的心醒著，為別人的痛有感覺。散會前，彼此問一句：你這星期要先關心的那一個人是誰？"]]},"7":{"no":7,"vol":"《321阿摩司書講義》第7課·阿摩司書第7章","title":"準繩——蝗、火、繩","chars":5443,"min":60,"deep":8,"dchars":1671,"tchars":1334,"blocks":[["h","一、求你赦免：蝗蟲與火（7:1--6）"],["p","弟兄姊妹平安。每天晚上十點，在台南，有一位母親，會坐在客廳靠窗的小板凳上，把手機放在一邊，閉上眼睛。她的兒子，已經兩年沒有回家吃過一頓飯。她不知道他在哪裡，不知道他吃得好不好。她禱告的話，很短，常常只有一句：主啊，他很小，我也很小，求祢憐憫。有一天，她對小組長說，我覺得自己很笨，每天都說一樣的話。今天這一章，有一位牧人，也是這樣禱告的，而且，他說了兩次，一字不差。"],["p","阿摩司書第七章，換了一個說話的方式。前面六章，大半是神藉先知說出來的審判話；從這裡起，是阿摩司自己看見的異象，而且是主耶和華指給他看的。「主耶和華指示我一件事」這個句式，在本章出現三次，帶出三個畫面：蝗蟲、火、準繩。"],["p","第一個畫面是蝗蟲。經文把時間說得很準：為王割菜之後，菜又發生，剛發生的時候。一般的理解是，頭一茬被王先收走，剛長出來的這一茬，才是百姓的指望，這是學者的推測，經文沒有解釋。如果這個理解對，蝗蟲就是專挑最軟的地方下手：打中的，是尋常人家最後的一點餘糧。經文又說，蝗蟲是主所造，我們不拿這句話去解釋今天任何一場災，也不拿它去責備受災的人；它只是告訴阿摩司，這一次逼近的，不是偶然。"],["p","蝗蟲吃盡青物的時候，阿摩司開口了。他說：「主耶和華啊，求你赦免；因為雅各微弱，他怎能站立得住呢？」這一句話裡，有兩處值得停下來。第一，他求的是赦免。前面六章，他才把以色列的罪一條一條說完，他知道這群人該承受什麼，可是他仍然站在他們這一邊。先知是替神說話的人，也是替百姓向神說話的人，兩個身分在他身上沒有衝突。第二，他的理由是雅各微弱。他沒有說雅各有功勞，沒有說雅各很努力，只說雅各小，小到站不住。這是禱告最好的姿勢：不是把自己說得夠好，而是把自己說得很小。"],["p","然後，耶和華就後悔，說：這災可以免了。我們要小心，不要從這裡推出一條規則：只要禱告得夠懇切，災就一定會止。經文是在記下這一次，不是在立保證，同一卷書的其他地方，也有災臨到而百姓沒有回頭。神怎樣「後悔」，本章的議題，會再談；這裡，只先看見：一個微弱的人開口，神聽見，也回應了。"],["p","第二個畫面，是火。這一次，是神自己召火來，原文的意思是為了跟百姓辯理。火吞滅了深淵，連大水都吃掉，接著要吃的，是每一家分得的那一份。災難升了級，神給的機會卻沒有少。於是，阿摩司說第二次：「主耶和華啊，求你止息；因為雅各微弱，他怎能站立得住呢？」這一次，理由一個字都沒有換。我們常以為，事情越大，禱告就越要有新的論點、新的說法；阿摩司讓我們看見另一種樣子：還是那一句，求你，我們實在太小了。第六節，耶和華又後悔，這災也可免了。那個「也」字，把兩次連在一起：兩次代求，兩次，神都聽。"],["p","我們有一位，比阿摩司更大的代求者：耶穌基督，現今在神的右邊，也替我們祈求（羅8:34）。你的禱告，不是你一個人在扛。"],["d",["我為一個人禱告很久了，他卻一直沒有改變，是不是我禱告得不夠？","不是。阿摩司書第七章，記下的是阿摩司兩次的禱告和神的回應，但它沒有立一條規則，說禱告夠不夠，決定結果。聖經裡也有人禱告很久，沒有看到想要的結果，例如保羅為肉中刺三次求主（林後12:8）。禱告的目的，不是操縱結果，是把一個人放在神面前。你可以做三件事：第一，繼續用最短、最誠實的話，把這個人交給神，不需要加長；第二，找一位同伴，一起為他禱告，不要一個人扛；第三，把你能做的，具體做出來，例如固定傳一句問候。如果你已經很累、很自責，也請找牧者談一談；你的愛，神看見。"]],["d",["神為阿摩司的禱告後悔，是不是說神會改變主意，禱告可以改變一切？","經文說「耶和華就後悔」，同一本聖經，也說神不是人，必不後悔（民23:19）。學者有不同的理解：有人說神真的改變了心意；有人說這是人的語言，描述神的回應；有人說兩面並看，不拆開。本講義取第三種，不替神的內心下結論。可以肯定的有三件事：第一，神真的聽見了；第二，禱告是真實的，不是演戲；第三，神的耐心有界線，下一個異象就說到「我必不再寬恕」。所以，我們不把禱告當成換取結果的技巧，也不因此就不禱告。禱告是向一位聽得見的神說話。"]],["h","二、準繩，與一條不再放過的線（7:7--9）"],["p","第三個畫面，沒有災。沒有蝗蟲，沒有火，只有一道牆，和一位站在牆上的主：有一道牆是按準繩建築的，主手拿準繩站在其上。一般的理解是，牆代表以色列，是神所建立的百姓，本來照著標準直直立起來；現在，主自己站在牆上，手拿準繩，量這道牆還直不直。這個畫面，很安靜，卻一點也不輕鬆。前兩次，是災在逼近；這一次，是神親自在量。"],["p","神問：阿摩司啊，你看見甚麼？他答：看見準繩。神就說：我要吊起準繩在我民以色列中，我必不再寬恕他們。請你留意「我民」兩個字：祂不是丟掉他們，祂是在量自己的百姓。最嚴肅的審判，往往出自最近的關係。再看「不再寬恕」，原文的意思是「我不再繼續越過他」：前面兩次，神越過去了，也就是放過了；現在，祂說，到這裡為止。阿摩司的禱告是真的，神的耐心也是真的，但耐心有界線，這個界線是神定的，不是人的禱告撐出來的。"],["p","第九節，說得更具體：以撒的邱壇必然淒涼，以色列的聖所必然荒廢，我必興起，用刀攻擊耶羅波安的家。被點名的，是敬拜的地方，和王的家。還有一個細節：這一段，阿摩司沒有說話。前兩次，他說「求你」；這一次，經文只記他說「看見準繩」。我們不能因此說，禱告被禁止了，經文沒有這樣說；我們只能說，這一次，沒有記下代求。"],["p","對今天的我們，這一條線意味著三件事。第一，標準在神手上，不在我們手上。我們習慣用自己的尺量自己：我今天比昨天好一點，我比某某人好得多；可是神的準繩，不是拿來比較的，它只是垂直地掛在那裡。第二，量我們的，是一位愛我們的主。第三，不要用這一段去嚇人，也不要用它推算任何時間；這一段，是要我們今天就回到那一條線旁邊，今天就悔改、就轉回。"],["d",["神手拿準繩量我們，是不是代表祂隨時在挑我們的錯？","不是。這一幕的重點，不在神要找錯，而在神不再放過，是在許多次越過之後。經文說的是「我民」，是神量自己的百姓，前面還有兩次免災，神的耐心是真實的。對一個有心悔改的人，準繩不是用來定罪，是用來校正，像師傅貼牆，是為了把牆砌好。如果你聽見準繩，心裡很緊，可以這樣做：每天找三分鐘，對神說：主啊，我哪裡歪了？求祢指給我看，也幫助我改。不要和別人比，也不要自己給自己判決。神是一位，肯為我們代求、也肯把我們放在祂手中的神。"]],["h","三、原文亮光：不再、聽、去（7:8，13，15--16）"],["p","這一章有三個原文，可以幫我們把經文，轉成當下的生命。第一個，是「不再」。7:8，神說「不再寬恕」，原文是 לֹא אוֹסִיף עוֹד（lo osif od），意思是「我不再繼續」，後面接的動詞，是「越過、放過」。第二次出現，在7:13：亞瑪謝對阿摩司說，你不要在伯特利再說預言，原文是 לֹא תוֹסִיף עוֹד，同一組字。神說「不再」，是因為百姓的罪滿了；亞瑪謝說「不再」，是因為他不要聽。"],["p","這個字，三十秒可以轉成生命。你可以問自己：我今天，有沒有用「你不要再」這種句子，去對一個說真話的人？同時，也可以問：神已經一次又一次越過我的軟弱，我有沒有今天就回頭，不等到神說「不再」？"],["p","第二個，是「聽」。7:16，阿摩司對亞瑪謝說：現在你要聽耶和華的話。原文是 שְׁמַע（shema），也是申命記6:4「以色列啊，你要聽」的那個動詞。這是整卷書追蹤的「聽」字。它在這裡，是對一位祭司說的：連祭司，也要聽。站在守門位置上的人，要先聽。聽，不只是耳朵接收，是肯讓那話改變我的方向。"],["p","這個字，三十秒可以轉成生命：今天，有一句神的話，我是不是一直把它放在最邊邊的地方？也許是一句關於饒恕的話，也許是一句關於金錢的話。我不必馬上做到，但我可以今天，先把它放回桌面上，先「聽」。"],["p","第三個，是「去」。12節，亞瑪謝對阿摩司說：לֵךְ，「去」，逃往猶大。15節，神對阿摩司說：לֵךְ，「去」，向我民說預言。同一個字，方向相反，授權的來源不同。阿摩司站在兩個「去」之間，選擇聽哪一個。這個字，三十秒可以轉成生命：今天，有哪一個「去」，是人給我的，哪一個是神給我的？我要先分辨，再邁步。"],["d",["「聽」不就是要順服嗎？順服牧者、順服領袖，也是聽神的話嗎？","7:16的聽，是聽「耶和華的話」，是連祭司也要聽的那一位的話。如果牧者與領袖，是照著神的話帶領我們，那麼順服他們，是順服神；彼得前書5:5也說，要彼此順服。可是聖經沒有叫我們，因為某個人是領袖，就把他說的當成神說的。亞瑪謝是祭司，他的話，卻與耶和華的話相反。分辨的方式，是回到經文：這個要求，與聖經整體的教導相合嗎？它使人更靠近神，還是更依賴某個人？如果有疑問，不必一個人硬撐，也不必私下抱怨，可以誠懇地、謙卑地，向相關的人詢問，必要時，也找一位成熟的同伴一起禱告。"]],["h","四、亞瑪謝與牧人（7:10--17）"],["p","異象忽然停止，經文換成一段故事。伯特利的祭司亞瑪謝，打發人到王那裡，報告說：阿摩司在以色列家中圖謀背叛你；他所說的一切話，這國擔當不起。阿摩司沒有拿起武器，也沒有結黨，他只是把他看見的說出來。"],["p","請把亞瑪謝的報告，放在第九節旁邊讀。第九節，神說的是：我必興起，用刀攻擊耶羅波安的家，主詞是神。到了第十一節，亞瑪謝轉述的是：因為阿摩司如此說，主詞換成了阿摩司，不是耶和華如此說。這是一個很安靜的改動：神的話，被收成一個人的意見，一個可以被處理的政治問題。這是本講義看原文的觀察，不是學界的定論；可是它讓我們看見，聖所裡的人，最容易做的事，不是反對神，而是把神的話變小。"],["p","接著，亞瑪謝對阿摩司說：你這先見哪，要逃往猶大地去，在那裡糊口，在那裡說預言，卻不要在伯特利再說預言；因為這裡有王的聖所，有王的宮殿。聽起來像好意：回老家去，愛說什麼就說什麼。仔細聽，他是在說，你是靠這個糊口的人，又把阿摩司的聲音，劃了一個範圍：南邊隨你，北邊不要。更要緊的是這一句：這裡有「王的聖所」。他說的是王的，不是耶和華的。聖所的主人，已經換了。我們不替亞瑪謝貼標籤，他也是一個人，有他要保的位置；我們只問自己：我們的聖所、我們的小組，有沒有變成為某個人、某個體系服務，以致神的話成了威脅？"],["p","阿摩司沒有發怒，他先回答那個指控：我原不是先知，也不是先知的門徒。我是牧人，又是修理桑樹的。原文沒有動詞，可以讀成過去式，也可以讀成現在式：我不是以此為業的先知。不管哪一種，重點都是：我說預言，不是為了糊口。這句話不是貶低先知，也不是貶低訓練；先知的門徒，也是神的百姓，神也使用他們。我們也不能反過來說，沒有裝備就更屬靈。召命，在神，不在背景。"],["p","然後是這一節：耶和華選召我，使我不跟從羊群，對我說：你去向我民以色列說預言。這句話裡，有三個動作：神取了我，神使我離開羊群，神對我說去。每一個動詞的主詞，都是耶和華。召命的重點，是誰叫的，不是誰被叫。真正使阿摩司站得住的，不是膽量，是差遣。"],["p","阿摩司說完自己，轉過身，對亞瑪謝說：現在你要聽耶和華的話。他沒有罵人，他只是把亞瑪謝說過的話，原樣放回他面前，再說：所以耶和華如此說。第十七節，是一段非常沉重的話：你的妻子必在城中作妓女；你的兒女必倒在刀下。你的地必有人用繩子量了分取；你自己必死在污穢之地。以色列民定被擄去離開本地。"],["p","我們必須慢慢讀，也要小心讀。這是對亞瑪謝說的審判話，不是對所有受苦的妻子和兒女說的。經文沒有說，她們有罪；也沒有說，今天在戰亂與暴力中受傷的人，是因為自己的罪。戰爭來的時候，最先受傷的，往往是最沒有權力的人。所以，如果你就是那一位受過傷的人，請先聽這句話：這不是你的錯，神沒有把你放在審判的那一邊。我們先陪伴受傷的人，不先去論斷任何人。這一段，也不是時間表；我們不算它是哪一年，也不把它套在今天任何國家、任何人身上。最後一句：以色列民定被擄去離開本地，與第十一節亞瑪謝報告的，一個字也沒有改。他向王轉述的，就是神最後說的。"],["d",["我是牧者，常常被人懷疑「你是不是靠這個吃飯的」，我該怎麼回應？","阿摩司的回答，是先老實說自己的來源：我原不是以此為業，是耶和華選召我。可是這並不表示，事奉者領生活費是不對的，聖經也教導，傳福音的人，可以靠福音養生（林前9:14）。亞瑪謝的話，是一種指控，不是聖經對事奉者的教導。你可以這樣回應：第一，不防衛、不生氣，誠實說出自己被召的經過；第二，把財務與決定公開給可信的同工與會友，讓事奉透明；第三，不拿這些懷疑去論斷提問的人，他們也許受過傷，值得被聽。如果懷疑已經變成很深的攻擊，請不要一個人承受，找成熟的同伴，與你一起面對。"]],["d",["我沒有神學學位，也沒有什麼背景，是不是就沒有資格服事？","不是。阿摩司書第七章，不是在說「沒有背景比較屬靈」，也不是在說「有訓練就不屬靈」，而是說：召命在神，不在背景。神可以用牧人，也可以用先知的門徒，也可以用祭司家的人，如耶利米、以西結。你可以做三件事：第一，不要用自己沒有的東西定義自己，回到「祂取了我」；第二，誠實地問：現在有什麼事，是神已經交給我的？從那件事忠心起；第三，若有裝備的機會，不要拒絕，裝備是恩典，不是羞愧。同時，也請提醒自己，不要用背景當資格，也不要用軟弱當資格。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把7:3，6神的「後悔」，講成只要禱告夠懇切，神就一定改變、災就一定會止，或講成神心意不定。經文是記下這兩次，不是立一條保證；神怎樣後悔，是祂的事，我們不替祂的內心下判決。檢驗標準是：會眾是更願意向神說話，還是更把禱告當成換取結果的技巧？"],["p","第二個偏差，是把7:7--8準繩，講成神拿著標準在等人犯錯、專門恐嚇會眾，或把7:8沒有記載代求，講成神禁止再為人禱告。準繩量的是「我民」，前面有兩次免災；經文只說「不再寬恕」，沒有說禁止禱告。檢驗標準是：聽完的人，是更靠近神，還是更躲著神？"],["p","第三個偏差，是把亞瑪謝，講成今日某位講員、某間教會或某個政府的標籤，或把這一章講成反對一切權威、社會革命的手冊。阿摩司沒有結黨、沒有拿起武器，亞瑪謝是一個具體的人；本講義不點名指責當代任何人，也不用這一章去對抗任何人。檢驗標準是：講完之後，會眾是更看見自己的口袋，還是更指著別人的口袋？"],["p","第四個偏差，是把7:14，講成神學訓練不重要，或講成越沒資格、越軟弱的人越被神用。這句話是回答「靠說預言糊口」的指控；先知的門徒也是神的百姓，召命在神不在背景。檢驗標準是：受過訓練的人，是被貶低，還是被提醒裝備不是本錢？沒有背景的人，是更知道自己有分，還是把軟弱當成資格？"],["p","第五個偏差，是把7:17妻子作妓女、兒女倒在刀下，講成這些人自己有罪，或講成今日受暴、受戰亂之苦的人活該，或講成確定的歷史時間表。這是對亞瑪謝說的審判話，經文沒有說她們有罪，也沒有說日期；陪伴受傷的人優先於論斷。檢驗標準是：受過傷的人聽完，是更感覺被陪伴，還是更覺得自己有罪？"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：我們很習慣「顧全面子、不要得罪人」。在華人的教會與家庭裡，一個人若說話很委婉、很少惹麻煩，常被稱讚為「很成熟」，這有它的美；可是，也有一個代價：很多要說的話，被我們收小了，收到不痛不癢。這一章，不是叫我們去傷人，而是提醒：神的話，不能被收進任何一個人的口袋。這個星期，不妨問自己：有哪一句神的話，我一直把它縮小、延後，或者換一個比較舒服的說法？我願意怎樣，先把它放回桌面上，誠懇地聽一次？"],["p","第二個問題：我們很習慣用學歷、資歷、背景，來決定誰有資格。在華人社會，履歷與頭銜很容易成為標準，也常常帶進教會：誰有學位，誰有年資，誰的家庭背景好。阿摩司是一個牧人，是修理桑樹的人；神取了他。這一章，不是要叫我們看輕裝備，也不是叫我們看輕沒有裝備的人，而是回到那句話：祂取了我，祂差我。這個星期，不妨在一位安全的同伴面前，誠實說：我是不是常常因為自己沒有什麼，就說這件事輪不到我？"],["h","七、活出321——微弱的人，站在準繩旁邊"],["p","耶穌是我的榜樣。祂是真正站在牆上的主，也是現今在神右邊替我們祈求的那一位。在客西馬尼園，祂說：「不要照我的意思，只要照你的意思。」祂把我們的小，擔在自己身上，祂是我們的榜樣，也是我們的代求者。"],["p","聖經是我的準則。我們讀第七章，不是要用它去指責任何人，也不是要推算任何時間，而是看見：神的準繩，掛在神的手上。我願意先讓祂的話量我，再說別人。"],["p","聖靈是我的引導。是聖靈，在我們不知道當怎樣禱告的時候，用說不出來的嘆息替我們代求。求祂引導我，為微弱的人禱告，也帶我分辨：哪一個「去」是神給的。"],["p","讓耶穌作王。無己，是放下兩件事：一是用自己的尺量自己，也量別人；二是把神的話收進自己的口袋，只留合意的。有己的人，在準繩面前找藉口，或把話變小；無己的人，承認自己微弱，把標準交回神的手上，也肯聽祂的話。讓耶穌作王，就是讓祂的準繩，量我。"],["p","讓耶穌得著一切的榮耀。兩次免災，是神的憐憫，不是阿摩司的功勞；阿摩司被召，是神取了他，不是他的本事。一切榮耀，歸給耶穌。"],["p","建立屬神的體系。一個屬神的群體，是一群肯為微弱的人代求的人，也是一群肯聽神話語、不把聖所變成為任何權力服務的人；大家的焦點，都在耶穌。"],["d",["「為微弱的人代求」，具體可以怎麼做，才不會只是說說而已？","可以從三個很小的動作開始。第一，固定一個時間，也許是睡前或通勤的路上，用一分鐘，為一個名字禱告，只說：主啊，他很小，我也是，求祢憐憫。不用加長，重點是固定。第二，找一位同伴，每週互相問一句：你這個星期，為誰禱告？有什麼要我一起禱告的？不用追問細節。第三，把禱告變成一個小行動：一句問候，一餐飯，一次陪伴；但也要尊重對方的界線，不強迫、不跟蹤。如果你要代求的人，正在傷害你或別人，請先確保安全，也找牧者或專業協助，代求不代替保護。"]],["h","八、四種心，一個邀請"],["p","驕傲型的人說：我不需要代求，我自己扛得住，也不用任何人知道。經文對他說：阿摩司的理由是雅各微弱。承認自己太小，不是失敗，是禱告的開始。"],["p","恐懼型的人說：我怕準繩一量，我就完了。神說的是「我民」，前面有兩次免災。這條線，是一位愛你的主手上的線，你可以先把你的怕，說給祂聽，再靠近它。"],["p","羞恥型的人說：我沒有背景，沒有學歷，輪不到我。神說：祂取了我。召命的重點，是誰叫的，不是誰被叫；你可以先對神說：主啊，我想知道，祢怎麼看我。"],["p","受傷型的人說：我曾被權力壓過，被人叫我閉嘴，或在我最沒有力量的時候，被人傷害。這一章，沒有說這是你的錯，神沒有把你放在審判的那一邊。你不需要現在就原諒誰，也不需要現在就說出細節，可以先對神說：求祢醫治我，也使我在適當的時候，再有力量。"],["h","九、這一週，你可以做的幾件事"],["p","第一，每天用一分鐘，為一個你擔心的人禱告，只說：主啊，他很小，我也是，求祢憐憫。連續七天。"],["p","第二，找出一件你最近用自己的尺量自己或量別人的事，今天安靜十分鐘，對神說：主啊，祢的準繩怎麼說？不用急著得到答案。"],["p","第三，找一位你信任的同伴，請他這個星期問你一句：你最近，有沒有把神的話收小？"],["p","第四，找出一位在不起眼位置上忠心做事的人，這個星期，用一句具體的話向他說：我看見你，謝謝你做的這件事。"],["p","第五，把七章十五節抄在紙上，放在常常看到的地方：「耶和華選召我，使我不跟從羊群，對我說」。每次看見，就對神說一次：祢取了我，祢差我。"],["p","我宣告：我是微弱的，但我有一位肯聽我、也肯替我祈求的主。"],["p","我宣告：神手中的準繩，是愛我的主手中的準繩，我願意先讓祂量我。"],["p","我宣告：我不把神的話收小，我今天就聽。"],["p","我宣告：耶穌是我的王，祂取了我，祂差我，我站得住。"],["d",["這一週我可以立刻做的一件事是什麼，才不會只停在聽道？","最簡單的，是今晚睡前，拿一張紙，寫下一個你很擔心、卻不知道怎麼幫他的人的名字。在名字旁邊，寫一句：主啊，他很小，我也是。然後，安靜兩分鐘，把這個名字放在神面前，不求答案，只是誠實地交託。接著，把這張紙放進聖經，夾在阿摩司書七章。下個星期，回頭看，你會發現，有些事情，你沒有辦法改變，但你有一件事可以做：每天固定一句話，一直說。如果你發現自己很難說出口，也不要責備自己，繼續做這個小動作；神是一位聽見微弱人聲音的神。"]],["h","十、結語"],["p","阿摩司書第七章，是一位牧人的兩次禱告，一條垂下來的準繩，和一位祭司與一位牧人的對話。開頭，是蝗蟲與火，阿摩司說：求你，雅各微弱，神兩次聽見；中間，是主手拿準繩站在牆上，說：我必不再寬恕；最後，是亞瑪謝說：不要再說預言，阿摩司說：耶和華選召我，並對祭司說：現在你要聽耶和華的話。"],["p","在這一章，神要我們看見祂的心：祂是聽見微弱人禱告的神，祂是手拿準繩、愛自己百姓的主，祂也是差遣人、也使人站得住的神。祂量我們，不是為了定罪，是為了今天就轉回。"],["p","所以，請你記得今天這一課的三個重點：為微弱的人，懇切代求；回到神手中的準繩旁邊；聽神的話，不把它收小。這一課的焦點，不在我禱告得多漂亮，不在別人怎樣看我，也不在環境有沒有改變，而是那位在客西馬尼園說「照你的意思」、現今在神右邊替我們祈求的耶穌。"],["p","主耶穌，謝謝祢，聽見微弱的人的禱告，也差遣我們；求祢使我們，肯為人代求，肯回到祢手中的準繩旁邊，肯聽祢的話，也讓我們一生的焦點，都在祢身上。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["m","帶領說明：今天這一課，我們用三個化來走一遍：先把話放進自己心裡（內化），再一起想通、說出口、走一步（消化），最後把這一課帶到人面前（轉化）。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化　內化（約20分鐘）"],["m","目的：讓每個人先把經文放進自己的心裡，看見自己的位置，不急著討論別人。"],["n","1. ★ 七章二節阿摩司說：雅各微弱。你最近有沒有一個很小、很站不住的時刻？請說出大概是哪一類，不必細節。"],["n","2. ★ 你有沒有一個為他禱告了很久的人？請說出一位的關係（例如孩子、父母、朋友），不必說細節。"],["n","3. ★★ 七章八節，主手拿準繩。聽到「準繩」兩個字，你心裡第一個感覺是什麼？請說出一個詞。"],["n","4. ★★★ 請在安靜中想一件事：你最近有沒有把一句神的話，縮小或延後？現在用一句話寫下它，並寫下你願意讓誰陪你一起面對。"],["m","帶領提醒：請先安靜念七章二節、八節，再開始。不要點名逼人說。這一章會碰到「為人代求很久」「被人叫閉嘴」「受傷」：如果有人提到長期的憂鬱、家人失聯、輕生的念頭、家庭暴力、性暴力或被權力壓迫的經歷，不追問細節，不要求原諒，不對正在流淚的人說「你要有信心」，也不說「你禱告得不夠」，會後單獨關心，必要時協助他尋求專業的幫助。"],["s","第二化　消化（約35分鐘·主軸）"],["m","目的：看見自己、聽神說話、想通關卡、說出口、走一步，讓這一課成為自己的話。"],["t","【看】看見自己"],["n","5. ★ 看見自己：對照七章二節與五節，你向神禱告的時候，習慣先說自己多好，還是先說自己多小？請說出一個例子。"],["t","【聽】聽神說話"],["n","6. ★★ 聽神說話：安靜三分鐘，聽七章十六節「現在你要聽耶和華的話」。有哪一句神的話，你心裡一直想避開？請說出你聽到的第一個感覺。"],["t","【想】想通關卡"],["n","7. ★★★ 想通關卡：七章十四至十五節，阿摩司說：我不是靠這個糊口，是耶和華選召我。請用自己的話向組員說明：為什麼召命的重點，是「誰叫的」，不是「誰被叫」？"],["t","【講】說出口"],["n","8. ★★ 說出口：用一句話向一位組員說，你這個星期，可以為哪一位微弱的人，用哪一句短短的話禱告，並當場說出來。"],["t","【行】走一步"],["n","9. ★★★ 走一步：請決定這個星期的哪一天，把那一句神的話放回桌面上，寫下時間，並說出誰會提醒你。"],["m","帶領提醒：依【看】【聽】【想】【講】【行】的順序走，每一步留足時間。【講】的時候，只要說出一句、一個名字、一個時間，不必講故事。若有人眼淚掉下來，不追問細節，也不要求他原諒誰，先安靜陪著，會後單獨關心。"],["s","第三化　轉化（約25分鐘）"],["m","目的：把這一課帶出去：進入家庭、職場、教會的真實關係，並讓福音繼續繁殖。"],["n","10. ★ 你身邊有沒有一位，在不起眼的位置上忠心做事的人？請說出名字，並決定這個月用一句具體的話謝謝他。"],["n","11. ★★ 你的小組或教會，有沒有一位正在為人代求很久、很累的人？請說出具體的一位，並說你可以先從哪裡陪伴他。"],["n","12. ★★ 你有沒有一位曾經對你說真話、你當時不太想聽的人？請說出名字，並決定這個月向他說聲謝謝。"],["n","13. ★★★ 920 操練：找出你的那一個「2」，就是你最想陪他一起「為微弱的人代求」的那位，這個星期向他分享，並且當場說出他的名字。"],["n","14. ★★★ 【必做】請在這個星期，把這一課用三句話講給一位教會外的朋友聽，並在下次小組回報：你對誰講的、在哪裡講、他的反應是什麼。"],["m","帶領提醒：請特別提醒：不要在小組裡用這一章去指責任何人是「亞瑪謝」，也不要說「你禱告得不夠」，不要用經文推算任何時間或套用到今日任何國家、政黨或領袖。若有人分享被傷害、被壓迫、被迫閉嘴、憂鬱、輕生的念頭、成癮、家庭暴力或性暴力的經歷，不追問細節、不要求原諒，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助尋求輔導或其他專業的協助。"],["s","收尾（5分鐘）"],["p","請大家輕輕閉上眼睛，把今天寫下的那一句話，放在神面前。一起念七章十五節。"],["p","由帶領者為每一位禱告：求神使我們肯為微弱的人代求，肯回到祂手中的準繩旁邊，肯聽祂的話。散會前，彼此問一句：你這星期要先為誰說那一句短短的禱告？"]]},"8":{"no":8,"vol":"《321阿摩司書講義》第8課·阿摩司書第8章","title":"一筐夏天的果子——果、貪、飢","chars":4842,"min":60,"deep":8,"dchars":1682,"tchars":1382,"blocks":[["h","一、一筐夏天的果子（8:1–3）"],["p","弟兄姊妹平安。有一位姊妹，在別人家裡做鐘點清潔，每個星期三去，說好是四個小時。可是，常常到了第四個小時，主人說：順便把陽台也擦一下好嗎？她就擦了。有時候，變成四個半小時，從來沒有多算。她沒有抱怨，也不敢多問，只是下班坐公車回家的路上，把雙腳抬起來，輕輕揉一揉。她說：其實我也不是怪他們，只是有時候，會想，這半個小時，有沒有人記得？今天這一章，正是神替這樣的人，開口說話的一章。"],["p","阿摩司書第八章，是全卷五個異象裡的第四個。一節說：主耶和華又指示我一件事：我看見一筐夏天的果子。前面是蝗災、是火、是準繩，現在，是一筐水果。看起來，一點也不可怕。神問他：你看見什麼？他說：一筐夏天的果子。然後，神說出一句重話：「我民以色列的結局到了，我必不再寬恕他們」。"],["p","請你看這個畫面。夏天的果子，是熟透、剛收下來的。熟果好看，好吃，可是不能放；放著，就壞了。在希伯來文裡，「夏天的果子」是 qayits，「結局」是 qets，兩個字聽起來幾乎一樣。阿摩司看見的是熟果，聽見的是終結。熟了，不是好消息；熟了，是時候到了。那時候的以色列，國土擴張，生意興旺，節期熱鬧，一切看起來正好。神卻在這個「正好」裡，說：到了。"],["p","可是，請你再讀一次這句話：神說的是「我民」。祂沒有說那些人，沒有甩開他們；在宣告結局的時候，仍然稱他們是我的百姓。「必不再寬恕」，原文是「不再繼續越過」，像一個人一直從旁邊走過去，放過，等待；現在，祂不再這樣走過去了。我們不算這是第幾次，也不推算什麼日子，只讀出一件事：神的耐心是真的，而這一次，祂說，不再越過。"],["p","三節，是最安靜的一幕：主耶和華說，那日，殿中的詩歌變為哀號，必有許多屍首在各處拋棄，無人作聲。原本唱歌的地方，只剩哭聲；再往後，連哭聲都沒有了，只剩下一個字：噓。這不是說唱詩是壞事，也不是說神討厭敬拜；是說，有一天，連歌聲都被悲哀吞沒了。那麼，是什麼先把歌聲弄壞的？答案，在下一段。"],["d",["神為什麼不先讓阿摩司看見可怕的東西，而是讓他看見一筐果子？","因為神要先讓他看見：最危險的時候，常常是看起來最好的時候。前三個異象，蝗災、火、準繩，都帶著明顯的威脅；而一筐熟透的果子，沒有人會害怕，反而覺得豐收、甜美。神用這個畫面，讓阿摩司和他的聽眾明白：熟了，不等於好；日子過得順，不等於一切都對。這提醒我們，不要用「我現在過得不錯」來證明自己與神的關係沒有問題，也不要把神在順境裡的提醒，當成耳邊風。另一方面，這個畫面也很溫柔：神是用一筐水果，不是用雷電，在對祂的僕人說話；祂先問，先讓他說出來，再把心意告訴他。這是一位願意被人看懂的神。"]],["h","二、詭詐的天平（8:4–6）"],["p","四節開頭，神說：「當聽我的話」。這是這一章，也是全卷追蹤字「聽」的第一次出現。請你留意，這句話是對那些吞吃窮乏人的人說的，不是對窮人說的。在宣告結局之後，神仍然說：你們要聽。這表示，這不是最後一道門，這是還能回頭的一道門。"],["p","五節，神替他們說出他們心裡的話：月朔幾時過去，我們好賣糧；安息日幾時過去，我們好擺開麥子。請你看，這些人沒有不守節期，也沒有不守安息日；他們守，只是一邊守，一邊看時間，盼望它趕快過去。身體坐在安息裡，心已經回到了糧倉。神責備的，不是他們有敬拜，也不是他們做生意；是敬拜與安息，成了生意的紅燈，而不是生命的泉源。"],["p","然後是三樣手段：賣出用小升斗，收銀用大戥子，用詭詐的天平欺哄人。賣的時候，量器做小；收的時候，砝碼做大；天平本身，再動一點手腳。每一個環節，都很小，都不容易被抓到。這不是一個大壞人的故事，是一群很會做生意的人，在一次又一次的小動作裡，把人吃掉了。"],["p","六節，把話說到最底：好用銀子買貧寒人，用一雙鞋換窮乏人，將壞了的麥子賣給人。「一雙鞋」，二章六節也出現過，是很小的價錢；他們賣的是渣滓，買的是人。請你留意神怎麼稱呼這些人：窮乏人、困苦人、貧寒人，每一個稱呼的後面，都是有名字的人。神在這裡，是為被當成價錢的人開口。"],["p","我們要把幾件事放好。第一，有錢不是罪，做生意不是罪，神問的是量器公不公平、價錢有沒有把人當人。第二，這不是社會革命的手冊，神要的公義，出於認識這位為窮人說話的神，也不取代敬拜。第三，我們先看見受傷的人，陪伴與保護他們；然後，才叫欺壓人的人，來到神面前，聽。我們也不點名任何今日的行業、公司或個人，只在神面前，省察自己的天平。"],["d",["這一段是在說，基督徒不可以做生意、不可以賺錢嗎？","不是。聖經沒有說賺錢是罪，箴言甚至說，殷勤的手使人富足。神責備的，是方法：量器做小、砝碼做大、把人當價錢、把渣滓當麥子賣。你可以用三個問題，檢查自己：第一，我的量器、價錢、薪水，若放在神面前，我敢說這是公平的嗎？第二，我有沒有因為對方沒有能力計較，就少給他一點？第三，我賺這筆錢的時候，有沒有把某一個人，當成一個數字？如果有，不是要你放棄事業，而是請你先改正；也不需要一次改完，從一個小動作開始。對那些在職場上正被壓著的人，也請記得：神為他們說話，他們不是沒有被看見。"]],["h","三、原文亮光：果、貪、飢（8:2，4，11）"],["p","這一章有三個原文字，剛好是副題。第一個是「果」，希伯來文 קָיִץ（qayits），夏天的果子。這個字，指夏末收下來的熟果，是最甜、也最不能放的果子。神讓阿摩司看見它，再讓他聽見 קֵץ（qets），結局。這個雙關，帶出一個很實在的提醒：熟了，不是結束的信號，是要醒來的信號。三十秒轉成生命：今天，有沒有一件事，已經熟了，我卻一直讓它放著？一場該說的話、一個該改的做法、一個該道歉的人。"],["p","第二個是「貪」，希伯來文 שָׁאַף（sha'af），四節的「吞吃」。這個字，字義有「喘息著追趕」「踐踏」「吞下去」幾種，二章七節也用它。不論取哪一種，畫面都是：有一個人，一直追著，要把另一個人拿到手。這個字，不是描寫一次偷竊，是描寫一種習慣的喘息：永遠覺得不夠，永遠在盤算下一筆。三十秒轉成生命：當我發現自己在議價、在計算的時候，心跳是不是快了？我是在服事人，還是在追著他？"],["p","第三個是「飢」，希伯來文 רָעָב（ra'av），十一節的「饑荒」。這一節，把飢餓，從胃，移到耳朵：人飢餓非因無餅，乾渴非因無水，乃因不聽耶和華的話。這裡，也有全卷追蹤字「聽」，希伯來文 שָׁמַע（shama）。四節，神說：當聽；十一節，是聽不到。這兩處的聽，是同一個字。前面是呼召，後面是饑荒。三十秒轉成生命：我今天，有沒有一個固定的時間，把耳朵留給神？"],["p","把三個字連起來，就是這一章的路：果（qayits），已經熟了；貪（sha'af），一直吞吃；飢（ra'av），聽不到神的話。這不是一個要人害怕的順序，而是一個誠實的鏡子：熟了而不醒，吞吃而不停，最後，連想聽的時候，都聽不到了。神在四節說的那一句「當聽」，是這個順序裡，仍然開著的門。"],["d",["這三個字，我怎樣在三十秒內，轉成今天的生活？","三十秒的做法很簡單。早上，用一句話問自己：今天，有沒有一件已經熟了的事，我要處理？（果）中午，在議價、算帳、安排人手的時候，用一個呼吸問自己：我現在，是在追著人，還是在服事人？（貪）晚上，用一分鐘，把今天讀到的一節聖經，慢慢讀一遍，問自己：神對我說了什麼？（飢）這三個問題，不需要特別的環境，也不需要特別的時間，只需要你願意，在一天裡，停三次。經文先對你說話，生命才慢慢被改變；不是你做得多，是你願意停下來聽。"]],["h","四、我必永遠不忘，與聽道的饑荒（8:7–14）"],["p","七節，神起誓：耶和華指著雅各的榮耀起誓說，他們的一切行為，我必永遠不忘。「雅各的榮耀」指什麼，學者有幾種意見，有人說是神自己，有人說是以色列人所誇耀的驕傲；不論是哪一種，誓的內容很清楚：一切行為，永遠不忘。這句話，對欺壓人的人，是警告；對被欺壓的人，是安慰。那一雙鞋、那些下腳的麥子、那些沒有人記得的欠條，在神面前，沒有一筆被漏掉。"],["p","八到十節，是一連串的畫面：地震動，居民悲哀，像尼羅河漲起；日頭在午間落下，白晝黑暗；節期變為悲哀，歌曲變為哀歌，眾人腰束麻布，頭上光禿，使這場悲哀如喪獨生子。這是神給的比喻，是為了讓人知道，他們快要失去的，是多麼大的事；不是為了嚇人。這裡，要特別牧養地說一句：這個比喻，從來不是拿來對一位真正失去孩子的父母，說「這是神的審判」的話。哀哭的人，先被陪伴。"],["p","十一節，是這一章最著名的一節。主耶和華說：「日子將到，我必命饑荒降在地上。人飢餓非因無餅，乾渴非因無水，乃因不聽耶和華的話」。這是「主耶和華說」，神自己宣告，是全卷追蹤字「耶和華說」，在本章最重的一次。餅有，水也有，倉裡有糧，街上有賣；可是，人的裡面空了。這是另一種飢餓：吃飽了，還是覺得缺；賺了錢，還是覺得空。"],["p","十二節，是這場饑荒的樣子：他們必飄流，從這海到那海，從北邊到東邊，往來奔跑，尋求耶和華的話，卻尋不著。東奔西跑，找一個先知，找一句話，找一個指引；可是，找不到。不是沒有人在尋求，是尋求得太晚。五章，神曾說：你們要尋求我，就必存活。那時候他們沒有，到了現在才去找，就找不著。十三節說，連最有力氣的美貌處女和少年男子，也因乾渴發昏；青春與力氣，都擋不住。"],["p","十四節，是最後的畫面：他們指著撒馬利亞的牛犢起誓，指著但的活神起誓，指著別是巴的神道起誓。但在北，別是巴在南，整片地，從頭到尾，都有人起誓。他們很虔誠，也很愛起誓，只是所指著的，偏了。他們一直在聽，只是聽的是別的聲音；缺的，是那一句耶和華真正說的話。「永不再起來」，是對這一群人說的重話；而這一章之後，還有第九章，神的話，並沒有停在這裡。"],["p","讀這一節，我們要小心，不要把它變成對今日聽道人的恐嚇。這是對那個不聽的國度，說的話。我們今天站的位置，不一樣：神已經在這末世，藉著祂的兒子，對我們說了話，祂的話，開著，就在我們面前。所以，這一節真正要說的，不是怕，是趁神還在說話，聽。"],["d",["「雅各的榮耀」到底指什麼，會不會影響整節的意思？","有幾種讀法：一，指神自己，就如神向來指著自己起誓；二，指以色列人所誇耀的驕傲，因為六章八節，神說祂憎惡雅各的榮華，所以這裡的起誓，帶著反諷；三，指那塊地，或神向雅各所顯的榮美。我們傾向第二種，可是不勉強任何一種。因為不論取哪一種，意思相同：神發了重誓，說，他們的一切行為，我永遠不忘。這是這一節的重心。我們可以安心地承認，有些字句，學者還在討論，而不必因為這樣，就失去這一節的力量。"]],["d",["聽道的饑荒，是神不再說話，還是人不肯聽？今天我們會不會正在其中？","兩者都有。神一直在說話，四節的呼召是真的；人一直不聽，所以後來聽不到，十一節的饑荒也是真的。這一節，是對那個不聽的國度說的重話，不是拿來嚇今日的會眾，也不是拿來解釋某一個人的靈裡乾渴。有些信徒覺得禱告像碰到牆壁，可能是疲乏、受苦、憂鬱，或正在等候，不等於被神棄絕。如果你有這樣的感覺，請先休息，找一位可信任的同伴說說話，必要時，也尋求輔導的幫助。同時，神的話今天是開著的：請你打開它，讀一小段，慢慢聽。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把8:1--2「夏天的果子」講成神已經放棄以色列，或把「必不再寬恕」講成可以算出次數、推算日子。神在宣告結局時，仍稱他們「我民」；「不再越過」不是一個數字，本講義不算次數，也不推算日子。檢驗標準是：會眾是更看見神的心腸，還是更熱衷推算？"],["p","第二個偏差，是把8:3的哀號，講成神討厭詩歌與敬拜；或把8:5講成這些人不守安息日。經文說的是歌聲被悲哀吞沒；他們守月朔、守安息日，只是心不在其中。神責備的，是沒有公義、沒有生命的敬拜，不是敬拜本身。檢驗標準是：會眾是更看重敬拜與生活合一，還是更輕看敬拜？"],["p","第三個偏差，是把8:4--6講成有錢、做生意就是罪，把阿摩司書講成社會革命的手冊，或拿它指名今日某個行業、企業或某個人。神問的是量器公不公平、人是否被當成價錢；神要的公義，出於認識神，不取代敬拜；我們先陪伴受傷的人，再省察自己。檢驗標準是：會眾是先看見受傷的人，還是先急著審判別人？"],["p","第四個偏差，是把8:10「如喪獨生子」，拿來對喪子的父母，說孩子的死是神的審判。這是一個強烈的比喻，說明那一天的哀痛有多深，從來不是用來解釋任何一位父母的喪子之痛。檢驗標準是：哀哭的人是被陪伴，還是被追問原因？"],["p","第五個偏差，是把8:11--12「聽道的饑荒」講成恐嚇會眾，或把信徒的乾渴，直接講成被審判；也把8:14「永不再起來」，講成任何人悔改都沒有機會。這是對一個不聽的國度的重話，神的話並沒有停在這一章。檢驗標準是：會眾讀完，是更想聽神的話，還是更害怕？乾渴的人是被陪伴，還是被定罪？"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：我們很習慣說「大家都這樣做」，也很習慣把小動作，包裝成「人情」「行規」。在華人社會，做生意有許多不成文的規矩：多算一點、少給一點、不開收據、不問清楚。久了，天平不知不覺，就偏了。八章四到六節提醒我們：那些不容易被抓到的小動作，神都看見，而且記得。這個星期，不妨問自己：我所在的行業，有沒有一個「大家都這樣做」的小動作，我也在做？我可以怎樣，從自己的這一份，開始改？"],["p","第二個問題：我們很習慣把「聽道」，變成「聽講道」；聚會很多，講章很多，卻很少安靜地，自己面對神的話。在華人教會，忙碌、事奉、聚會，常被當成屬靈的證明，可是，很多人心裡，其實很飢餓。八章十一節的饑荒，提醒我們：真正的飽足，不是聽了多少，是有沒有真的聽見。這個星期，不妨在一位同伴面前，誠實說：我最近一次，安靜地、自己讀神的話，是什麼時候？"],["d",["我在職場上常常遇到「大家都這樣做」的小動作，我該怎麼辦？","首先，不要急著論斷別人，先檢查自己這一份。你可以從最小的地方開始：自己的報帳、自己的時間、自己對下屬或客戶的說法，先做到公平。第二，如果你發現，有些做法，已經傷害到別人，尤其是弱勢的人，請你不要獨自扛著，找一位可信任的同伴或牧者，一起禱告、一起分辨，用適當、清楚、溫和的方式，向相關的人表達。第三，如果你自己，正是那個被壓著、被少算的人，你不是沒有被看見，也不需要自己默默承受；可以尋求適當的協助，包括正當的管道與專業的諮詢。神為受傷的人說話，你不必先證明自己沒有錯。"]],["h","七、活出321——公平的天平，開著的耳朵"],["p","耶穌是我的榜樣。祂說：人活著，不是單靠食物，乃是靠神口裡所出的一切話。祂也說：我就是生命的糧。祂是神的話成了肉身，住在我們中間；祂為貧窮的人傳福音，把受壓制的人，看成有名字的人。在阿摩司的時代，神的話被找不到；在耶穌裡，神的話，就站在我們中間。"],["p","聖經是我的準則。我們讀八章，不是要用它去審判別人，也不是要推算任何日子，而是讓神的話，量我們自己的天平，也量我們的耳朵：我的量器公平嗎？我的安息，是真的安息嗎？我的耳朵，為神的話開著嗎？"],["p","聖靈是我的引導。是聖靈，讓我們在小動作裡，被提醒；在不安的時候，被指出；在飢渴的時候，被帶到神的話面前。求祂叫我們有一對柔軟的耳朵，也有一雙公平的手。"],["p","讓耶穌作王。無己，是放下用天平算計別人的心，也放下一邊敬拜、一邊盼望它趕快過去的急躁；讓耶穌作王，就是讓祂掌管我的價錢、我的安息日，也掌管我的耳朵，使我先聽祂，再做事。"],["p","讓耶穌得著一切的榮耀。神記得每一個被少算的人，神稱我們為我民，神的話開著；這一切，都是祂的恩典，不是我們的功勞。一切榮耀，歸給耶穌。"],["p","建立屬神的體系。一個屬神的群體，是一群公平對待人、看見受傷的人，並且在神的話語裡，一起得飽足的人。我們彼此記得，因為神也記得。"],["d",["每天讀聖經都沒有什麼感覺，是不是代表我已經在聽道的饑荒裡了？","不是。八章十一節的饑荒，是對一個長期拒絕聽、後來連想聽都聽不到的國度所說的話。你今天願意打開聖經，這本身，就說明你的耳朵還開著。有時候，沒有感覺，是因為疲乏、忙碌、壓力，或因為讀的方式，只是完成進度。你可以試著：第一，每天只讀一小段，慢慢讀，讀兩遍；第二，用一句話，把讀到的重點，寫下來，並問自己：這一句，今天要我做什麼？第三，找一位同伴，一星期一次，互相說說最近讀到的。如果這樣做了很久，仍然覺得很乾，也請你找牧者或輔導談談，這不是你不夠屬靈，是需要被陪伴。"]],["h","八、四種心，一個邀請"],["p","驕傲型的人說：我做生意向來規矩，我不需要檢查。經文對他說：熟果也會壞；最危險的時候，常常是看起來最好的時候。你可以先對神說：主啊，請祢量一量我的天平。"],["p","恐懼型的人說：我怕若不多算一點、多留一點，就會被淘汰。神說：他們的行為，我必永遠不忘，被少算的人，神記得，也記得顧念你。你可以先把你的怕，說給祂聽，再一步一步，改回公平。"],["p","羞恥型的人說：我過去做過不公平的事，神不會再聽我了。這一章說：神仍然稱他們我民，並且說：當聽我的話。你可以帶著這份羞愧，來到神面前，說：求祢憐憫，教我怎樣補償。"],["p","受傷型的人說：我被少算、被欠薪、被當成價錢，沒有人看見。神看見你。這一章，沒有說你不該受傷，卻說，神永遠不忘。你不需要現在就原諒誰，可以先對神說：求祢醫治我，並在適當的時候，使我得著該得的公義，與該得的陪伴。"],["h","九、這一週，你可以做的幾件事"],["p","第一，每天用十分鐘，不為進度，只為飽足，安靜讀一段神的話，讀完對神說：主啊，我在聽。連續七天。"],["p","第二，檢查你在買賣、議價、薪水、時間分配上的一個小動作，誠實問：這個，神看得見嗎？今天把它說給神聽，並改過來。"],["p","第三，找出一位在你身邊常被少算、被忽略的人，這個星期，用一句具體的話看見他：謝謝你，你做的這件事，我記得。"],["p","第四，這個星期，有一個安息的時間，不看手機、不盤算工作，只是好好休息、好好敬拜；讓敬拜，把你的心，帶回到神面前。"],["p","第五，把八章七節抄在紙上，放在常常看到的地方：他們的一切行為，我必永遠不忘。每次看見，就對神說一次：主啊，求祢幫助我，公平地對待每一個人。"],["p","我宣告：我的天平在神面前是公平的，我的價錢，不吞吃任何一位窮乏人。"],["p","我宣告：我的安息，是真正的安息，我的敬拜，是為了神，不是為了生意。"],["p","我宣告：神記得每一位被壓傷的人，也記得我；祂稱我為祂的百姓。"],["p","我宣告：耶穌是我的王，我的耳朵為祂的話開著，我在祂的話語裡得飽足。"],["d",["這一週我可以立刻做的一件事是什麼，才不會只停在聽道？","最簡單的，是今晚睡前，拿一張紙，在左邊寫下一個你最近在買賣、議價、時間或薪水上的小動作；在右邊寫下：主，我把它交給祢，求祢教我怎樣改。然後，安靜五分鐘，不用求答案，只是誠實地放在神面前。接著，把這張紙放進聖經裡，每天讀一次八章，記下你讀到的一句話。一個星期後，回頭看那張紙：有些，你已經改了；有些，需要一位同伴，陪你繼續談。如果你發現自己很難面對，也不要責備自己，繼續每天做這個小動作；神是一位，記得每一個細節的神。"]],["h","十、結語"],["p","八章，是一筐夏天的果子、一個詭詐的天平，和一場沒有餅的饑荒。開頭，是神說：結局到了，仍然稱他們我民；中間，是神說：他們的一切行為，我必永遠不忘；最後，是神說：最深的飢餓，是聽不到神的話。"],["p","在這一章，神要我們看見祂的心：祂是一位為窮人開口的神，是一位永遠不忘的神，也是一位在審判裡，仍然說「當聽我的話」的神。祂沒有輕看受傷的人，也沒有放棄欺壓人的人，還一直開著那一道，叫人回頭的門。"],["p","所以，請你記得今天這一課的三個重點：熟了要醒來，天平要公平，耳朵要為神的話開著。這一課的焦點，不在你能做多少，不在別人怎樣對你，也不在你有沒有聽講道，而是那位成為生命的糧、神的話成了肉身的耶穌。"],["p","主耶穌，謝謝祢，記得每一個被少算的人，也呼召我們回到祢的話語裡；求祢使我們的天平公平，使我們的耳朵柔軟，使我們在祢的話裡得飽足。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["m","帶領說明：今天這一課，我們用三個化來走一遍：先把話放進自己心裡（內化），再一起想通、說出口、走一步（消化），最後把這一課帶到人面前（轉化）。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化　內化（約20分鐘）"],["m","目的：讓每個人先把經文放進自己的心裡，看見自己的位置，不急著討論別人。"],["n","1. ★ 八章一節神讓阿摩司看一筐熟了的果子。你最近有沒有一個地方，日子過得不錯，心裡卻隱約知道，有一件事該處理了？請說出一類，不必細節。"],["n","2. ★ 八章二節神說「我民」。你有沒有一次，被人嚴厲地提醒，卻感覺到那個人仍然在乎你？請說出一個，不必細節。"],["n","3. ★★ 八章五節他們一邊守安息日，一邊盼望它趕快過去。你上一次在聚會或休息的時候，心不在，是在想什麼？請說出大概。"],["n","4. ★★★ 八章四節「當聽我的話」。請在安靜中想一件事：神最近一直對你說、你卻一直沒有聽的事。現在用一句話寫下它，並寫下你願意讓誰提醒你。"],["m","帶領提醒：請先安靜念八章十一節，再開始。不要點名逼人說。這一章會碰到「被少算」「被欠薪」「喪子」「靈裡乾渴」：如果有人提到失去孩子、被欺壓、長期的憂鬱、輕生的念頭、家庭暴力或成癮，不追問細節，不要求原諒，不對正在流淚的人說「你要有信心」，也不說「這是神的審判」，會後單獨關心，必要時協助他尋求專業的幫助。"],["s","第二化　消化（約35分鐘·主軸）"],["m","目的：看見自己、聽神說話、想通關卡、說出口、走一步，讓這一課成為自己的話。"],["t","【看】看見自己"],["n","5. ★ 看見自己：對照八章五到六節，你在買賣、議價、薪水或時間分配上，哪一類事，是別人看不見、只有神看得見的小動作？請說出一類。"],["t","【聽】聽神說話"],["n","6. ★★ 聽神說話：安靜三分鐘，聽八章七節神說：他們的一切行為，我必永遠不忘。你心裡聽見的，是安慰，還是提醒？請說出你聽到的第一個感覺。"],["t","【想】想通關卡"],["n","7. ★★★ 想通關卡：八章十一節，饑荒不是因為沒有餅、沒有水，乃因不聽神的話。請用自己的話向組員說明：為什麼最深的飢餓，是聽不到神的話？"],["t","【講】說出口"],["n","8. ★★ 說出口：用一句話向一位組員說，你這個星期，要在哪個時間、哪個地方，用十分鐘安靜聽神的話，並當場說出來。"],["t","【行】走一步"],["n","9. ★★★ 走一步：請決定這個星期的哪一天，要改正一個天平上的小動作，或向一位被忽略的人說一句具體的話，寫下時間，並說出誰會提醒你。"],["m","帶領提醒：依【看】【聽】【想】【講】【行】的順序走，每一步留足時間。【講】的時候，只要說出一句、一個名字、一個時間，不必講故事。若有人眼淚掉下來，不追問細節，也不要求他原諒誰，先安靜陪著，會後單獨關心。"],["s","第三化　轉化（約25分鐘）"],["m","目的：把這一課帶出去：進入家庭、職場、教會的真實關係，並讓福音繼續繁殖。"],["n","10. ★ 你身邊有沒有一位常被少算、被忽略的人？請說出名字或職務，並決定這個月用一句具體的話看見他。"],["n","11. ★★ 你的小組或教會，有沒有一位長期默默吃虧的人？請說出具體的一位，並說你可以先從哪裡開始關心他。"],["n","12. ★★ 你有沒有一位曾經公平對待你、讓你覺得被尊重的人？請說出名字，並決定這個月向他說聲謝謝。"],["n","13. ★★★ 920 操練：找出你的那一個「2」，就是你最想陪他一起「在神的話裡得飽足」的那位，這個星期向他分享，並且當場說出他的名字。"],["n","14. ★★★ 【必做】請在這個星期，把這一課用三句話講給一位教會外的朋友聽，並在下次小組回報：你對誰講的、在哪裡講、他的反應是什麼。"],["m","帶領提醒：請特別提醒：不要在小組裡用這一章去指責任何人是「吞吃窮乏人的」，也不要說「你的乾渴是被審判」，不要用經文推算任何時間，或套用到今日任何國家、行業、企業或領袖。若有人分享被欠薪、被欺壓、喪子、憂鬱、輕生的念頭、成癮或家庭暴力的經歷，不追問細節、不要求原諒，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助尋求輔導或其他專業的協助。"],["s","收尾（5分鐘）"],["p","請大家輕輕閉上眼睛，把今天寫下的那一個小動作，放在神面前。一起念八章十一節。"],["p","由帶領者為每一位禱告：求神使我們的天平公平，耳朵柔軟，也在祂的話裡得飽足。散會前，彼此問一句：你這星期要先對神說的那一句話是什麼？"]]},"9":{"no":9,"vol":"《321阿摩司書講義》第9課·阿摩司書第9章","title":"倒塌的帳幕——擊、篩、建","chars":5352,"min":60,"deep":8,"dchars":1829,"tchars":1307,"blocks":[["h","一、站在祭壇旁邊（9:1--4）"],["p","弟兄姊妹平安。有一位弟兄，在新北市租了一間頂樓加蓋的小房子，鐵皮屋頂，每逢下雨，就漏。他在地板上放了七個臉盆，雨一來，就聽見滴答、滴答，七個不同的音。他跟房東說過三次，房東每次都說，下個月就來修。這樣過了三年。有一天夜裡，下大雨，他躺在床上，聽著那七個臉盆，忽然想：我是不是，一直在等一個，永遠不會來的修理？今天這一章，是阿摩司書的最後一章，講的就是一個漏水的屋子，和一位真正會來修的神。"],["p","九章一節說：我看見主站在祭壇旁邊。請你先留意，這是整卷書的第五個異象，也是最後一個。前面的蝗蟲、火、準繩、夏果，先知看見的，都是神預備要做的事；這一次，他看見的，是主自己，站在祭壇旁邊。祭壇，是人靠近神的地方，是獻祭、求赦免、求平安的地方。現在，神站在那裡，不是來接受獻祭，而是來下令。"],["p","祂說：你要擊打柱頂，使門檻震動，打碎柱頂，落在眾人頭上。這是一幅建築倒塌的畫面：最上面的柱頭被擊碎，屋頂與樑柱，一起落下來。人們聚集敬拜的地方，成了他們自己的墳墓。經文沒有說，這是哪一座祭壇；有人想到伯特利，有人想到耶路撒冷，也有人認為，經文故意不說，因為重點不在地點，而在站在那裡的那一位。"],["p","接著，二到四節，是一首逃亡詩，五個「雖然」，把人能想到的逃法，一個一個說完：挖進陰間、爬上天去、藏在迦密山頂、藏在海底、被仇敵擄去。每一個「雖然」之後，神都說：從那裡。這三節裡，「從那裡」，一共出現五次。人說：我到了那裡；神說：從那裡，我。這是在回答九章十節那些說「災禍必追不上我們」的人。他們以為，躲得夠遠、守得夠緊，就沒有事。神說：沒有一個地方，是祂不在的。"],["p","這裡，要特別留意，不要把這一段講歪。五章二十一至二十四節說過，神厭惡的，是沒有生命、沒有公義的敬拜；九章一節，是同一件事的最後一幕。神不是反對祭壇，神是反對，把祭壇當成保險。兩面都要說：祭壇，仍然是神所設立的；只是，站在祭壇旁邊的那一位，不受任何儀式的管理。"],["p","詩篇一百三十九篇，也說過幾乎一樣的話：我往哪裡去躲避你的靈？我若升到天上，你在那裡；我若在陰間下榻，你也在那裡。同樣是無處可逃，在詩篇裡，是安慰，因為下一句是：你的手必引導我；在阿摩司書裡，是警告，因為說這話的人，是自以為可以躲開神的人。同樣的事實，對相信的人，是安慰；對以為可以躲的人，是警告。請你誠實想一想：今天，你讀這些話，是哪一種？"],["d",["九章一節神站在祭壇旁邊下令擊打，是不是說，教會裡的聚會與敬拜，不再重要了？","不是。這一節不是在反對敬拜，而是在反對沒有生命的敬拜。要兩面並陳：第一，五章二十一至二十四節說得很清楚，神厭惡的是那種節期、聚會、祭物都有，公平與公義沒有的那種敬拜；第二，經文從來沒有說，不要去聚會，不要親近神。所以，教會的聚會仍然重要，關鍵是：我來，是來見神，還是來讓自己覺得安全？一個簡單的檢驗，是問自己：我散會之後，與家人、同事、鄰居的相處，有沒有一點不同？如果敬拜越多，人越冷，那就要停下來問神。如果敬拜之後，人更願意饒恕、更願意誠實、更願意幫助人，那是祭壇真正的果子。九章一節是警告，不是禁止；它邀請我們，把敬拜，從保險，變回相遇。"]],["h","二、耶和華是他的名（9:5--8）"],["p","五、六節，先知在審判最重的地方，停下來，唱了一首頌歌：主－萬軍之耶和華摸地，地就消化，凡住在地上的都必悲哀；那在天上建造樓閣、在地上安定穹蒼、命海水澆在地上的，耶和華是他的名。這是整卷書的第三首，也是最後一首；前面兩首，在四章十三節與五章八節。在最嚴厲的話中間，先知停下來，要人看見，說話的是誰。"],["p","你看祂怎樣做：只是摸一下。不用用力，地就融化。和合本的註腳說，這裡的「消化」，原文是融化的意思。請你記住這個字，等一下，在九章十三節，我們會再遇見它。這位神，不是某一個民族的守護神，不是祭壇旁邊的一尊偶像，而是造天、造地、管海水的神。耶和華是他的名，這句話，是先知交給百姓的一個很簡單的認識：你們要面對的，是這位。"],["p","七節，是阿摩司書最令人驚訝的一節。神說：以色列人哪，我豈不看你們如古實人嗎？我豈不是領以色列人出埃及地，領非利士人出迦斐託，領亞蘭人出吉珥嗎？古實，是尼羅河上游的遠方，是以色列人覺得與自己無關的人；非利士人與亞蘭人，是以色列的仇敵。神說：我也領他們。而出埃及，是以色列最大的記念，是他們的生日。神說：這件事，我對別人也做過。"],["p","這是什麼意思？不是說，出埃及沒有意義；也不是說，以色列不是祂的百姓。八節立刻說：卻不將雅各家滅絕淨盡。意思是：不要把我領你出來，當成你不會被審判的理由。恩典的歷史，不是護身符。你得救，是恩典；可是，恩典不是不用認真的許可證。這一節，是對所有以為自己有身分保障的人說的，包括教會裡最資深的人。"],["p","八節的結構，很值得細讀：必將這國從地上滅絕，卻不將雅各家滅絕淨盡。前一句，講的是「國」，是制度、是自以為站得住的那一套；後一句，講的是「家」，是人。神要除去的，是那一套自以為安全的東西；祂不要滅絕淨盡的，是人。原文在這裡，用了很強的語法：「不」加上「滅絕」的加強形式，意思是：完完全全地，不。最後一句，是這卷書的追蹤字：這是耶和華說的。審判之中，也有耶和華說，也有但書。"],["d",["神說「我豈不看你們如古實人」，是不是說神不再特別看重以色列？","不是。這一節要放在八節來讀：必將這國從地上滅絕，卻不將雅各家滅絕淨盡。神沒有放棄以色列，祂說的是：你們不能把「我們是被揀選的」，當成「我們不會被審判」的理由。同時，這一節也在說，神的眼目，比以色列的國界，大得多：祂也領非利士人，也領亞蘭人。這與阿摩司書開頭，向列國的審判（一至二章）互相呼應：祂向列國發怒，因為列國是祂所關心的受造者。所以，我們讀這節，不要往兩個極端走：一個是輕看以色列，一個是以為自己是例外。恩典是真的，審判也是真的；兩者都出自同一位神。"]],["h","三、原文亮光：篩、帳幕、歸回（9:9，11，14）"],["p","這一節，我們來看三個原文字，每一個，都能在三十秒內轉成生命。第一個字，是九節的「篩」。原文的動詞，是 nua，意思是搖動、使搖動。神說：我必出令，將以色列家分散在列國中，好像用篩子篩穀。你看過篩穀嗎？農夫把穀子放進篩子裡，搖一搖；碎石、糠、泥土漏下去，穀子留在上面。篩的時候，穀子也在搖，搖，是不舒服的。可是，篩的目的，不是要毀掉穀子，而是要把穀子留下來。所以，經文說：連一粒也不落在地上。"],["p","這裡有一個解經上的難處，要誠實說。「粒」這個字，原文是 tseror，本意是小石子，或一小包。所以，這句話有兩種讀法：一種是，穀粒不會落地，神保全屬祂的人，和合本取這一種；另一種是，篩子留下的是小石子，意思是，沒有一個罪人，可以從審判中漏掉。兩種讀法，都在說：神的審判是精確的，不是亂打。三十秒轉成生命：你現在被搖動嗎？搖動，不等於被丟棄。耶穌對彼得說：撒但想要篩你們，像篩麥子一樣；但我已經為你祈求，叫你不至於失了信心。你被篩的時候，有人在為你祈求。"],["p","第二個字，是十一節的「帳幕」。原文是 sukkah，不是會幕，不是宮殿，是一個棚子，就像住棚節搭的小草棚。神說：我必建立大衛倒塌的帳幕。你注意：神用的字，是一個小而舊、搖搖欲墜的棚子。大衛家曾經有過榮耀，到了先知的時代，已經像一個漏風漏雨的草棚。「倒塌的」，原文是分詞，可以是已經倒下的，也可以是正在倒下的。神說：我要把它立起來，堵住破口，把破壞的建立起來，重新修造，像古時一樣。三十秒轉成生命：你有沒有一個地方，像這個草棚？神沒有說：我要拆掉，另外蓋新的；祂說：我要把倒塌的，立起來。祂願意修舊的。"],["p","第三個字，是十四節的「歸回」。原文是 shavti shevut，是一個很特別的組合：動詞 shuv，轉回；加上它的名詞 shevut。這是全卷追蹤字「轉回」的最後一次出現。你還記得嗎？四章六至十一節，神一連說了五次：你們仍不歸向我。人不回來，一次又一次。到了最後，神說：我必使我民以色列，歸回。人不回來，神使他回來。這是整卷書最深的轉折，也是福音的核心：不是人努力回來，而是神自己，把人帶回來。三十秒轉成生命：你是不是一直在等自己「夠好」，才敢回到神面前？神說：我必使。"],["d",["「篩」是神對我們的管教嗎？我現在被搖得很厲害，怎麼知道這是不是審判？","我們不能替任何人，也不能替自己，輕易下結論，說這個搖動就是審判。經文給的標準，是九章十節：被篩出去的，是「說災禍必追不上我們」的人，不是所有被搖動的人。如果你現在被搖動，可以先做三件事。第一，不要急著替自己分類，說我是穀，或我是糠；第二，把搖動誠實地說給神聽，包括你的害怕；第三，問自己：我心裡，有沒有一個地方，是不給神碰的？如果有，今天就回頭；如果沒有，就記得，耶穌也曾為彼得祈求。被搖動，有時是管教，有時是環境，有時不是你的錯。你不需要一個人撐著。"]],["h","四、栽於本地，不再拔出來（9:11--15）"],["p","十一節開頭，兩個字，到那日，風向就變了。前面是：我必擊打、我必殺戮、我必搜尋；現在是：我必建立、我必堵住、我必修造。同一位神，同樣的「我必」，只是方向換了。有些學者認為，這一段可能是後來編輯所加，也有人認為，審判與盼望並存，本來就是先知書的常態。我們誠實承認這個討論，不急著結案；無論如何，這一段已經是正典的一部分，我們要問的是：它在最後，對我們說了什麼？"],["p","十二節說，目的是：使以色列人得以東所餘剩的和所有稱為我名下的國。這個盼望，是向外的：所有稱為我名下的國，都被包括進來。使徒行傳十五章，耶路撒冷會議，外邦人信主，要不要先守摩西的規矩？大家吵得很厲害，雅各站起來，引用的，就是這一段：此後，我要回來，重新修造大衛倒塌的帳幕，把那破壞的重新修造建立起來，叫餘剩的人，就是凡稱為我名下的外邦人，都尋求主。我們只照新約自己引用的方式說：新約作者，把這個應許，與外邦人歸向神連在一起。至於日期、地點、與今日哪一件事有關，經文沒有說，我們不算日子，也不拿它去支持或反對任何國家。"],["p","你也許注意到，十二節與使徒行傳十七節用字有一點不同：一邊是「以東所餘剩的」，一邊是「餘剩的人」。這是因為希伯來文本與七十士譯本，字形只差一個字母，雅各引用的是希臘文的形式。我們誠實說，不因此懷疑聖經；意思相通：神的家，比我們以為的，大。十二節的最後一句，是第二次簽名：此乃行這事的耶和華說的。審判是祂說的，重建也是祂說的，是同一位神的聲音。"],["p","十三節，也以「耶和華說」開頭：日子將到，耕種的必接續收割的，踹葡萄的必接續撒種的。這是收成多到，來不及收，下一季就到了。大山要滴下甜酒，小山都必流奶，和合本的註腳說，原文是「消化」，與五節的「地就消化」，是同一個動詞。神的手，可以使地融化，成為審判；同一隻手，也可以使山融化，流出甜酒。這是整章，最美的對稱。"],["p","十四、十五節，是整卷書的結尾：我必使我民以色列被擄的歸回；他們必重修荒廢的城邑居住，栽種葡萄園，喝其中所出的酒，修造果木園，吃其中的果子。你看，這不是奇蹟的場面，是平凡的日子回來了：有家，有園子，有酒，有果子，有一張桌子，可以坐下來吃一頓飯。然後是最後一句：我要將他們栽於本地，他們不再從我所賜給他們的地上拔出來。這是耶和華－你的神說的。「栽」與「拔」，是耶利米書一章十節的一對動詞；阿摩司書的最後一個動詞，是「栽」，最後一句，是「不再」。我們不從這一節，推算任何今日的土地與政權；我們看見的，是一個更大的真理：神栽下的人，神保守。"],["d",["九章十一節說「大衛倒塌的帳幕」，耶穌和這個應許，有什麼關係？","我們只照新約自己作出的連結說。使徒行傳十五章，雅各引用這個應許，說明外邦人歸向神，是眾先知的話所相合的；新約多處，也稱耶穌是大衛的後裔、大衛的子孫。所以，我們可以說：新約的作者，是在耶穌身上，看見這個應許的實現與擴大。至於每一個細節怎樣對應，經文沒有說明，我們不建立時間表，也不補上日期。對我們的生命來說，更重要的，是看見：耶穌，不是只用篩子與刀的神，祂自己，承受了該落在我們頭上的審判，並且親自修造倒塌的帳幕。你的破口，不需要自己修好以後，才能來到祂面前；你帶著破口來，祂來修。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把九章一至四節「無處可逃」，講成神要恐嚇人，叫人活在驚慌裡。這是對自以為災禍追不上的人的警告；對相信的人，同樣的事實，是安慰（詩一百三十九篇）。檢驗標準是：會眾是更倚靠神，還是更怕得睡不著？"],["p","第二個偏差，是把九章一節擊打柱頂，講成神反對祭壇、反對敬拜；或把九章七節「如古實人」，講成神不再看重以色列，或貶低古實人。神反對的，是把祭壇當保險；八節立刻說「不將雅各家滅絕淨盡」。檢驗標準是：會眾是更真實地來到神面前，還是更不敢敬拜、更輕看別的民族？"],["p","第三個偏差，是把九章九節「篩穀」，講成我們可以自己分辨誰是穀、誰是糠，或把「連一粒也不落在地上」，講成信徒永遠不受苦。篩的主人是神；搖動是真實的痛，保全的是人，不是沒有痛苦。檢驗標準是：受苦的人是被安慰，還是被暗示「你信心不夠才被搖」？"],["p","第四個偏差，是把九章十一至十二節「到那日」，講成可以計算的末世時間表，或拿九章十一至十五節，去支持或反對任何現代國家、土地、政黨或領袖。經文沒有說日期；我們只照使徒行傳十五章十六至十七節新約自己引用的方式說。檢驗標準是：會眾是更仰望神的作為，還是更熱衷推算與站隊？"],["p","第五個偏差，是把九章十四節「歸回」，講成人靠努力就能回來，或把九章十三至十五節的豐收與栽於本地，講成信主就一定發財、順利，或因為「不再拔出來」，就不需要警醒。原文是「我必使」，恩典在先；經文畫的，是平凡日子的恢復，不是繁榮神學。檢驗標準是：貧窮或受苦的人是被安慰，還是被暗示「你信心不夠」？"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：我們很習慣，把平安放在「保險」上。在華人社會，存款、房子、學歷、人脈，是安全的象徵；在教會裡，「我受洗幾年」「我服事多久」，也容易成為一種保險。九章一至四節，不是說這些都不好，而是提醒：它們都不是避難所。這個星期，不妨誠實問自己：如果這個東西沒有了，我還有什麼？我是否在心裡，悄悄地說：災禍，追不上我？"],["p","第二個問題：我們很習慣，把破口蓋起來。在華人家庭與教會的文化裡，家醜不外揚，一個人的軟弱、一個家庭的破口，常常被隱藏起來，只讓人看到好的一面。這有它的美，也有代價：很多人，破了很久，也不說，也不修。九章十一節，神說：我必堵住其中的破口。祂不是等我們把破口藏好，而是要修好。這個星期，不妨在一位安全的同伴面前，說出一個你很久沒有修好的破口。"],["d",["我家裡有一個很久沒有修好的破口，例如夫妻之間的冷淡，我該怎麼開始？","可以從三個很小的步驟開始。第一，不要急著解決，先對神說：主，這個地方，已經破了很久，我不知道怎麼辦，求祢建立。不用漂亮的話，誠實說。第二，選一個安全、適當的時間，對另一半說一句不帶指責的話，例如：我發現我們最近話很少，我想念以前的我們。不要一次說完所有的事，只說一句。第三，如果你自己說不出口，或已經試過很多次，可以找一位信任的長輩、牧者，或輔導，陪你們一起面對。修，需要時間，不會馬上改變，沒有關係。神說，我必修造，像古時一樣；祂對你的家，有耐心。如果這個破口涉及暴力、傷害或持續的恐懼，請先確保人身的安全，並尋求專業的協助，不要獨自承擔。"]],["h","七、活出321——讓神修我的帳幕"],["p","耶穌是我的榜樣。祂是大衛的子孫，是真正建立帳幕的那一位。祂不是用刀、用篩子，而是自己，承受了該落在我們頭上的審判；在十字架上，祂說：父啊，赦免他們。祂也為彼得祈求，叫他不至於失了信心。祂是我們的榜樣，也是我們真正的避難所。"],["p","聖經是我的準則。九章，是整卷書的最後一章，審判與盼望，同時在這裡。聖經的準則，既不許我們把神講成只有刀，也不許我們把恩典講成沒有警告；兩件事，同時成立。我們不算日子，不用它支持任何現代的立場，只讀經文自己說的。"],["p","聖靈是我的引導。是聖靈，指出我心裡，那個悄悄說「災禍追不上我」的地方，也是聖靈，使我們歸回。求祂帶領我，誠實面對我的保險箱，也誠實面對我的破口。"],["p","讓耶穌作王。無己，是放下「我可以自己保護自己」的心，承認我沒有地方可以躲，我只有祂；也放下「我的破口太大，神修不了」的羞愧。讓耶穌作王，就是讓祂決定，我的平安放在哪裡，也讓祂，來建立我倒塌的帳幕。"],["p","讓耶穌得著一切的榮耀。人不回來，神使他們歸回；帳幕倒塌了，是神建立；栽下去的，是神保守。這是神的作為，不是我們的功勞，一切的榮耀，歸給耶穌。"],["p","建立屬神的體系。一個屬神的群體，不是一個沒有破口的團體，而是一群帶著破口，來到神面前、彼此坦白的人；不靠身分保障，也歡迎所有稱為祂名下的人，大家的焦點，都在耶穌。"],["d",["「讓耶穌作王」和「承認我沒有地方可以躲」，這兩件事怎麼連在一起？","我們心裡，常常有一個「王」，就是我最後倚靠的那一個東西。可能是存款，是身分，是資歷，是我自己的能力。九章一至四節，把這些一個一個拆下來：你挖透陰間，也躲不了；你爬上天去，也躲不了；沒有一個地方，是你自己可以當作最後的保障的。這不是要嚇你，而是要說：既然沒有地方可躲，最好的辦法，就是不躲，轉身，回到神面前。讓耶穌作王，就是這個轉身：把最後的倚靠，從別的地方，放回祂的手中。這一步，往往從一句很小的禱告開始：主，我把平安放在別的地方了，求祢憐憫，我回來了。"]],["h","八、四種心，一個邀請"],["p","驕傲型的人說：我不會有事，我一直在教會，我受洗很多年了。經文對他說：我豈不看你們如古實人？恩典不是護身符。承認我沒有特別的保障，是讓神進來的開始。"],["p","恐懼型的人說：我怕我是被篩出去的那一個，怕神把我放棄。經文對他說：連一粒也不落在地上；耶穌為彼得祈求，也為你祈求。你可以先把你的怕，一句一句說給神聽。"],["p","羞恥型的人說：我的破口太大了，太久了，神不會願意修。經文對他說：我必建立大衛倒塌的帳幕，堵住其中的破口。神選的字，是一個草棚，不是一座宮殿。你可以帶著羞愧，來到祂面前。"],["p","受傷型的人說：我是被欺壓、被傷害的那一個，為什麼經文裡這麼多審判？這一章，不是對你說的審判；神為受欺壓的人發聲，審判是對自以為例外的人說的。你不需要現在就原諒誰，可以先對神說：求祢醫治我。"],["d",["如果我就是那個被傷害、被欺壓的人，讀到這麼多審判的話，我該怎麼辦？","你可以先停下來，不用急著讀完。這一章的審判，是對自以為災禍追不上自己的人說的，不是對受傷的人說的。神為受欺壓的人發聲，祂看見。你不需要現在就原諒誰，也不需要為了「信心」而假裝沒事。可以先做一件很小的事：找一位安全的人，說一句：我受傷了，請你陪我。神與教會，都應該先陪伴你、保護你，而不是論斷你，這是祂的心意。若你正處在危險中，請先確保安全，並尋求專業的協助。"]],["h","九、這一週，你可以做的幾件事"],["p","第一，今天晚上，花五分鐘，找出你心裡的那個「保險箱」，就是你覺得最安全的那個地方。寫下來，問自己：如果它沒有了，我還有什麼？然後把這一句，交給神。"],["p","第二，找出你心裡那一句「災禍追不上我」。不用急著判斷自己，只是安靜十分鐘，誠實地對神說：主，有沒有哪一個地方，是我不願意給祢碰的？"],["p","第三，找出你生活中，那一個「倒塌的帳幕」，也許是一段關係、一個家庭的破口、一個很久沒有修好的習慣。每天睡前，花三分鐘，把它說給神聽，然後說：主啊，求祢建立。"],["p","第四，找一位你信任的同伴，坦白說出一個你很久沒有修好的破口，請他這個星期，問你一次：後來怎麼樣了？你不需要一個人修。"],["p","第五，把九章十一節抄在紙上，放在常看到的地方：「我必建立大衛倒塌的帳幕」。每次看到，就對神說一次：主，我的帳幕，交給祢。"],["p","我宣告：我不把平安放在別的地方，神是我的避難所，我沒有地方可以躲，我只有祂。"],["p","我宣告：我願意誠實面對我心裡的破口，神必堵住，神必修造，像古時一樣。"],["p","我宣告：神使我歸回，不是因為我夠好，而是因為祂說：我必使。"],["p","我宣告：耶穌是我的王，祂栽下的，必不再拔出來，一切榮耀歸給祂。"],["d",["我已經說過很多次「我要改變」，卻一直做不到，這一週怎樣才不會又停在聽道？","不要訂很大的計畫，只做一件很小的事。今天晚上，拿一張紙，在左邊寫一個你最久沒有修好的地方，例如「我和某某人的關係」；在右邊寫一句話：「主，我把它交給祢，求祢建立。」然後安靜三分鐘，不求答案。第二，把這張紙放在聖經裡，每天讀一次九章十一節，唸一次右邊那一句話。第三，這個星期結束前，向一位同伴，說出紙上的一句話，請他為你禱告。這不是要立刻修好所有東西，而是開始學習讓神來修。如果你這個星期漏了幾天，也不要責備自己，繼續做；神說：我必使，這是祂的作為，不是你的表現。"]],["h","十、結語"],["p","九章，是整卷書最後一章。它有三個畫面：第一，是主站在祭壇旁邊，沒有一個地方，可以逃；第二，是篩子，搖動是真的，保全也是真的，被篩出去的，是說「災禍必追不上我們」的人；第三，是帳幕，神親自建立倒塌的，使祂的民歸回，栽於本地，不再拔出來。審判，是祂說的；盼望，也是祂說的；這是同一位神的聲音。我們的焦點，都在耶穌。"],["p","在這一章，神要我們看見祂的心：祂是一位，不受任何儀式管理的神；祂也是一位，願意修舊的神；祂更是一位，人不回來，祂使人回來的神。願我們帶著破口，來到祂面前；願我們不看自己的保險箱，也不看別人的錯處。讓耶穌作王掌權，讓耶穌得到一切的榮耀。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["m","帶領說明：今天這一課，我們用三個化來走一遍：先把話放進自己心裡（內化），再一起想通、說出口、走一步（消化），最後把這一課帶到人面前（轉化）。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化　內化（約20分鐘）"],["m","目的：讓每個人先把經文放進自己的心裡，看見自己的位置，不急著討論別人。"],["n","1. ★ 九章一節神站在祭壇旁邊。你家裡，哪一個地方，是你覺得最安全的？請說出一個。"],["n","2. ★ 九章二至四節「從那裡」。你有沒有一個地方，是你以為躲在那裡就沒有事的？請說出一個大概的類型，不必細節。"],["n","3. ★★ 九章十一節「倒塌的帳幕」。你生活中，有沒有一個地方，像一個破了很久的草棚？請說出一個。"],["n","4. ★★★ 請在安靜中想一件事：你最久沒有修好的一個破口。現在用一句話寫下它，並寫下你願意讓誰陪你，一起面對。"],["m","帶領提醒：請先安靜念九章十一節，再開始。不要點名逼人說。這一章會碰到「審判」「被搖動」「破口」：如果有人提到家庭暴力、婚姻破裂、成癮、憂鬱、輕生的念頭或長期的自責，不追問細節，不要求原諒，不對正在流淚的人說「你要有信心」，也不說「這是神的審判」，會後單獨關心，必要時協助他尋求專業的幫助。"],["s","第二化　消化（約35分鐘·主軸）"],["m","目的：看見自己、聽神說話、想通關卡、說出口、走一步，讓這一課成為自己的話。"],["t","【看】看見自己"],["n","5. ★ 看見自己：對照九章十節「災禍必追不上我們」，你最近有沒有一句話，是你心裡悄悄在說的「我不會有事」？請說出一個例子。"],["t","【聽】聽神說話"],["n","6. ★★ 聽神說話：安靜三分鐘，聽九章十四節神說「我必使我民歸回」。你心裡聽見的是什麼？請說出你聽到的第一個感覺。"],["t","【想】想通關卡"],["n","7. ★★★ 想通關卡：九章九節神說「好像用篩子篩穀，連一粒也不落在地上」。請用自己的話向組員說明：為什麼被搖動，不等於被丟棄？"],["t","【講】說出口"],["n","8. ★★ 說出口：用一句話向一位組員說，你這個星期可以先把哪一個「保險箱」或哪一個「破口」，誠實地說給神聽，並當場說出來。"],["t","【行】走一步"],["n","9. ★★★ 走一步：請決定這個星期的哪一天，寫下你最久沒有修好的那個破口，寫下時間，並說出誰會提醒你。"],["m","帶領提醒：依【看】【聽】【想】【講】【行】的順序走，每一步留足時間。【講】的時候，只要說出一句、一個名字、一個時間，不必講故事。若有人眼淚掉下來，不追問細節，也不要求他原諒誰，先安靜陪著，會後單獨關心。"],["s","第三化　轉化（約25分鐘）"],["m","目的：把這一課帶出去：進入家庭、職場、教會的真實關係，並讓福音繼續繁殖。"],["n","10. ★ 你身邊有沒有一位，家裡或心裡有一個很久沒有修好的破口的人？請說出名字，並決定這個月用一句話關心他。"],["n","11. ★★ 你的小組或教會，有沒有一位覺得自己「不屬於神家」的人？請說出具體的一位，並說你可以先從哪裡歡迎他。"],["n","12. ★★ 你有沒有一位曾經陪你面對破口、沒有急著論斷你的人？請說出名字，並決定這個月向他說聲謝謝。"],["n","13. ★★★ 920 操練：找出你的那一個「2」，就是你最想陪他一起「讓神修倒塌的帳幕」的那位，這個星期向他分享，並且當場說出他的名字。"],["n","14. ★★★ 【必做】請在這個星期，把這一課用三句話講給一位教會外的朋友聽，並在下次小組回報：你對誰講的、在哪裡講、他的反應是什麼。"],["m","帶領提醒：請特別提醒：不要在小組裡用這一章去論斷任何人是「被篩出去的」，也不要說「你被傷害是你該得的」，不要用經文推算任何時間，或套用到今日任何國家或領袖，也不點名指責任何講員、教會或政府。若有人分享被傷害、被欺壓、憂鬱、輕生的念頭、成癮或家庭暴力的經歷，不追問細節、不要求原諒，會後單獨關心，必要時協助尋求輔導或其他專業的協助。"],["s","收尾（5分鐘）"],["p","請大家輕輕閉上眼睛，把今天寫下的那一個「破口」，放在神面前。一起念九章十一節。"],["p","由帶領者為每一位禱告：求神使我們誠實面對自己的保險箱，也把倒塌的帳幕交給祂建立。散會前，彼此問一句：你這星期要先對神說的那一句話是什麼？"]]}}}</script>

輕鬆有梗的口吻，像一位很酷的大哥哥大姊姊在聊天，不說教、不居高臨下。多用他們熟悉的世界來比喻：手機剩1%電量、遊戲過關、追劇、社群按讚與追蹤數、考試、同儕壓力、打球。可以適度用一點流行說法和小玩笑，但絕不拿聖經、神或耶穌開玩笑，也不輕看罪與傷痛；笑完一定要回到經文的真理上。答案精簡，重點先講，段落要短，結尾給一個今天就能試的小挑戰。若他提到被欺負、受傷害或想傷害自己，要溫柔回應，並鼓勵他馬上告訴信任的大人（爸媽、老師、牧者）。", "write": "\n讀者是青少年：口氣輕鬆幽默、像朋友聊天，可以有一點梗，但不說教、不輕浮、不拿神和聖經開玩笑；不要用表情符號。", "style": "風格：題目與解析的口氣幽默風趣、輕鬆有梗（像在跟朋友鬥嘴），選項可以有趣，但正確答案必須明確、不含糊，絕不拿神與聖經開玩笑。", "res": ["哎呀，這章有點滑溜～再讀一次，下一局你就是王者！", "不賴喔！再練幾次就可以去嘲笑你的朋友了（開玩笑的）。", "滿分級的操作！聖經達人就是你！"], "q": ["這段經文跟我的日常（學校、朋友、手機）有什麼關係？", "如果這段經文是神傳給我的一則訊息，它想說什麼？", "朋友都那樣做，我不跟會不會很怪？經文怎麼看？", "用遊戲或電影來比喻這段經文，可以嗎？", "這段經文有什麼讓人意外、很少人知道的地方？", "考試壓力好大，這段經文能給我什麼力量？", "我很難原諒一個人，這段經文能幫我什麼？", "神真的看得到我嗎？我哪裡值得被愛？"], "fu": [["🏫", "學校", "用你剛才講的，幫我想想怎麼用在學校與課業上，給我一個今天就能試的小招。"], ["🤝", "朋友", "用你剛才講的，幫我想想怎麼用在朋友相處上，給我一個今天就能試的小招。"], ["🏠", "家人", "用你剛才講的，幫我想想怎麼用在跟爸媽、家人的相處上，給我一個今天就能試的小招。"], ["📱", "手機網路", "用你剛才講的，幫我想想怎麼用在手機、網路與社群上，給我一個今天就能試的小招。"], ["💭", "壓力", "用你剛才講的，幫我想想怎麼用在壓力和情緒上，給我一個今天就能試的小招。"], ["🌟", "未來", "用你剛才講的，幫我想想怎麼用在未來和夢想上，給我一個今天就能試的小招。"], ["🎯", "今天挑戰", "請給我一個跟剛才有關、今天就能完成的小挑戰，要具體、有點好玩。"]]}, "kid": {"sys": " 回答對象：兒童（約5–11歲）。請用非常淺顯易懂的話，像說故事給小朋友聽。句子要短，一句只講一件事；用具體的小事當比喻（種子、小熊、手牽手、捉迷藏、生日蛋糕）；不用艱深的神學名詞，必須用時馬上用一句話解釋。語氣親切活潑，可以說「你知道嗎？」「一起想一想」，並適度加幾個可愛的表情符號。整個回答控制在五到七句短句。不要用表格；只引用一節簡短的經文。遇到暴力或可怕的經文，用孩子能承受的方式溫柔帶過，不渲染細節。最後用一句小禱告或一個孩子答得出來的簡單問題作結。若孩子說有人傷害他、或他很難過，要親切回應，並告訴他馬上跟信任的大人（爸爸媽媽、老師、牧者）說。", "write": "\n讀者是小朋友：用非常簡單的字詞和短句，像說故事，一句只講一件事，不用艱深名詞；不要用表情符號。", "style": "風格：給5到11歲的小朋友，字詞非常簡單、句子很短，像在說故事；選項要短；解析一句話、親切，最多加一個可愛的表情符號。", "res": ["沒關係！我們再讀一次故事，再玩一次就會了！🌱", "好棒喔！你記得好多！🌟", "哇！太厲害了！神一定很高興！🎉"], "q": ["這段故事在說什麼？請講給我聽。", "神在這個故事裡做了什麼事？", "耶穌愛我嗎？我怎麼知道？", "這個故事裡誰最勇敢？為什麼？", "我可以怎樣學習故事裡的人？", "請教我一句可以背起來的短經文。", "我跟好朋友吵架了，耶穌會怎麼做？", "可以教我做一個小禱告嗎？"], "fu": [["🏠", "在家", "剛剛講的，我在家裡可以怎麼做呢？請用簡單的話告訴我。"], ["🏫", "在學校", "剛剛講的，我在學校可以怎麼做呢？請用簡單的話告訴我。"], ["🤝", "跟朋友", "剛剛講的，我在跟好朋友相處時可以怎麼做呢？請用簡單的話告訴我。"], ["🙏", "小禱告", "請教我一個很短的小禱告，我可以跟耶穌說。"], ["📖", "小故事", "可以再講一個跟這個有關的小故事給我聽嗎？"]]}, "seeker": {"sys": " 回答對象：慕道友（還沒有信主、正在了解基督信仰的朋友）。請完全站在他的立場和角度：他可能沒讀過聖經、不懂教會用語，心裡有疑問，甚至有些保留。①先從他真實的生活處境、感受或疑問切入，再帶到經文，讓他覺得「這跟我有關」。②用最平常的話說；321理念只是你心裡的方向，不要在回答裡出現「無己、作王、得勝、屬靈」這類內部用語，也不用教會與神學術語；一定要提到的詞（如恩典、罪、救恩），馬上用生活的說法解釋。③誠實、尊重、不說教、不施壓、不要求他現在就相信，也不論斷他；有疑問或質疑很正常，先認真承認那個問題的份量，再誠實回答。④清楚說出聖經在這件事上的真理（神是怎樣的神、耶穌為我們做了什麼），用故事、比喻和日常例子，讓他聽得懂、記得住。⑤一定要有實際有用的幫助：給一兩個他這個星期就能自己試試看的小步驟（一個觀察、一個提問、一個簡單的行動）。⑥合適時，可以溫和邀請他繼續探索（例如讀一小段、問一個問題），不要硬把話題轉到決志。⑦不要說「我們基督徒都知道」這類預設他已經信的話。引用經文用和合本，並用白話解釋它的意思。若寫到禱告，只當作「若你願意，可以這樣對神說」的邀請，不強迫。整個回答要簡明、段落要短。", "write": "\n讀者是還沒信主的朋友：用生活化、親切、不說教的話，不用教會術語，不預設他已經信；不要用表情符號。", "style": "風格：給還沒信主、沒讀過聖經的人。題目要把背景交代清楚（人物、事件的名字直接寫出來），不假設他懂聖經或教會用語；用字平實，解析用一句白話說明這件事對一般人有什麼意義。", "res": ["沒關係，剛接觸這些內容本來就不容易，再看一遍會更清楚。", "不錯喔！你已經抓到這一章的重點了。", "太厲害了！你對這一章的內容很清楚。"], "q": ["這段話跟我現在的生活有什麼關係？", "我還不是基督徒，這段話對我有什麼意義？", "神真的存在嗎？有什麼理由可以相信？", "聖經為什麼說每個人都需要耶穌？", "我壓力很大，聖經能給我什麼實際的幫助？", "這段話裡的「罪」是什麼意思？跟我有關嗎？", "基督徒常說的「恩典」，用白話說是什麼？", "如果我想多了解，可以從哪裡開始？"], "fu": [["🤝", "人際", "剛才說的放在人際關係裡（家人、朋友、同事），對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["💍", "婚姻家庭", "剛才說的放在婚姻與家庭裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["💼", "工作", "剛才說的放在工作與職場裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["😟", "壓力焦慮", "剛才說的放在壓力與焦慮裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["🌍", "人生意義", "剛才說的放在尋找人生的意義與方向裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["❓", "我的疑問", "我心裡還有疑問，請誠實告訴我：信耶穌對一個人的生活到底有什麼實際的幫助？也請告訴我可以怎麼自己去查證。"], ["🌱", "下一步", "如果我想進一步了解，下一步可以做什麼？請給我一兩個不會有壓力的建議。"]]}, "elder": {"sys": " 回答對象：長輩（約65歲以上）。請用尊敬、溫和、慢慢說的口吻，像晚輩敬重地陪長輩讀經；句子清楚、不拐彎，不用網路用語和英文縮寫；比喻取自一生的閱歷（田地、家人、歲月、病痛、孫子、老街坊）。重點先講，分成短段落，不要太長。肯定他們一生走過的路與在主裡的忠心，不說教、不指責、不用「你應該」。可以談健康與軟弱、孤單、放下與交託、把信仰傳給下一代、永恆的盼望與感恩。結尾給一件簡單、容易做到的小事（一句禱告、打電話問候家人、數算一件感謝）。若提到身體不適、孤單或失去親人，要先溫柔安慰，並鼓勵他和家人、教會關懷同工聯絡。", "write": "\n讀者是長輩：用語尊敬、溫和、清楚好懂，不用網路用語；不要用表情符號。", "style": "風格：給長輩，字詞平實、句子清楚，題目不要繞、不要太冷僻，選項簡短；解析用一句溫和的話。", "res": ["沒關係，慢慢來，再讀一遍會更清楚。", "很好！這一章的話您記得不少。", "太好了！神的話已經住在您心裡。"], "q": ["這段經文用最簡單的話，是在說什麼？", "這段經文對年紀大的人有什麼安慰？", "身體漸漸衰弱了，神怎麼看顧我？", "我常常覺得孤單，這段經文能給我什麼？", "我該怎麼把信仰傳給兒孫？", "有些事放不下，這段經文怎麼教我交託？", "我老了，還能為神做什麼？", "請幫我寫一段簡短的禱告，我想念給主聽。"], "fu": [["🩺", "健康", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在身體的軟弱與健康，並給我一個這個星期做得到的具體小步驟。"], ["🤍", "孤單", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在孤單與思念，並給我一個這個星期做得到的具體小步驟。"], ["👨‍👩‍👧‍👦", "兒孫", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在和兒孫、家人的關係，並給我一個這個星期做得到的具體小步驟。"], ["🕊️", "交託", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在放下心中的牽掛、交託給主，並給我一個這個星期做得到的具體小步驟。"], ["🌅", "盼望", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在永恆的盼望與感恩，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，用簡單的話寫成一段短短的禱告，讓我可以慢慢念給主聽。"]]}, "single_parent": {"sys": " 回答對象：單親爸爸或媽媽（一個人撐起一個家）。請先接住他的辛苦：他常常很累、有愧疚、有孤單，也有經濟、時間與教養的壓力。口吻溫暖、接納、不評斷，不追問過去的原因，不說「你應該再找個伴」，也不把單親說成缺憾。引用神的心意：神是孤兒的父、寡婦的伸冤者（詩篇68:5），祂與我們同在。再給盼望與實際：每一個小步驟都要在忙碌中做得到（五分鐘禱告、跟孩子的一個小儀式、開口向弟兄姊妹求助）。內容簡短、段落要短。結尾給一個這個星期做得到的小步驟。若他提到被暴力對待、疲憊到撐不下去或想傷害自己，要溫柔回應，並鼓勵他立刻聯絡信任的人、教會同工或專業協助。", "write": "\n讀者是單親爸媽：口吻溫暖、接納、不評斷，肯定他的辛苦；不要用表情符號。", "style": "風格：給單親爸媽，題目貼近日常的忙碌、教養與盼望；口氣溫暖，解析一句話帶出安慰。", "res": ["沒關係，您已經很努力了，有空再讀一遍就好。", "不錯！在這麼忙的日子裡還記得這麼多。", "太棒了！神的話正在托住您。"], "q": ["這段經文對一個人撐起一個家的我，有什麼安慰？", "我常常覺得累，也覺得對孩子有虧欠，神怎麼看？", "神怎麼看顧孤兒和寡婦？這跟我有什麼關係？", "經濟壓力很大，這段經文能給我什麼？", "孩子在頂嘴、情緒很大，我該怎麼辦？", "我不知道怎麼跟孩子說爸爸（或媽媽）不在身邊的事。", "我真的很孤單，可以怎麼向教會或弟兄姊妹開口求助？", "請幫我寫一段五分鐘內能禱告完的短禱告。"], "fu": [["😮‍💨", "疲累", "請針對你剛才的回答，說明怎麼把它用在一個人撐家的疲累與內疚，並給我一個這個星期做得到的具體小步驟。"], ["👧", "孩子", "請針對你剛才的回答，說明怎麼把它用在陪伴孩子與教養，並給我一個這個星期做得到的具體小步驟。"], ["💰", "經濟", "請針對你剛才的回答，說明怎麼把它用在經濟與時間的壓力，並給我一個這個星期做得到的具體小步驟。"], ["🤝", "求助", "請針對你剛才的回答，說明怎麼把它用在向弟兄姊妹或教會開口求助，並給我一個這個星期做得到的具體小步驟。"], ["🌤️", "盼望", "請針對你剛才的回答，說明怎麼把它用在在這個階段看見神的同在與盼望，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段我在忙碌中五分鐘內就能禱告完的短禱告。"]]}, "single": {"sys": " 回答對象：單身的人（可能未婚、離婚、喪偶，或正在等候；不要預設他想結婚或不想結婚）。請不要把單身說成缺憾、「預備期」或「還沒到的人生」，也不要用催婚的口氣。談在基督裡的身分已經完整、被愛；談孤單時怎麼與神、與朋友、與團契連結；談時間、金錢與恩賜的運用與使命；談等待中的信靠；談感情與婚姻的智慧，以及在情感與身體上的聖潔，態度要尊重、不論斷。口吻真誠、平等、輕鬆。結尾給一個這個星期可以做的小步驟。若他提到孤單到想傷害自己，要溫柔回應並鼓勵他立刻聯絡信任的人或專業協助。", "write": "\n讀者是單身朋友：口吻真誠、平等、輕鬆，不催婚、不把單身說成缺憾；不要用表情符號。", "style": "風格：給單身的朋友，題目貼近孤單、身分、等待、友誼與使命；口氣真誠平等，不催婚。", "res": ["沒關係，慢慢來，再讀一遍就會更清楚。", "不錯喔！你把這一章的重點抓到了。", "太棒了！你很認真，神的話正在你裡面扎根。"], "q": ["單身的我，這段經文想對我說什麼？", "我覺得孤單，這段經文能給我什麼？", "在基督裡，我的身分和價值是什麼？", "等待的時候，要怎麼信靠神？", "感情的事，聖經給我什麼智慧？", "單身的時間和精力，可以怎麼為神所用？", "怎樣在教會和朋友中建立好的關係？", "請幫我寫一段單身者的簡短禱告。"], "fu": [["🫶", "孤單", "請針對你剛才的回答，說明怎麼把它用在孤單時怎麼與神、與朋友連結，並給我一個這個星期做得到的具體小步驟。"], ["💝", "身分", "請針對你剛才的回答，說明怎麼把它用在我在基督裡的身分與價值，並給我一個這個星期做得到的具體小步驟。"], ["⏳", "等待", "請針對你剛才的回答，說明怎麼把它用在等待中的信靠，並給我一個這個星期做得到的具體小步驟。"], ["💞", "感情", "請針對你剛才的回答，說明怎麼把它用在感情與交友的智慧，並給我一個這個星期做得到的具體小步驟。"], ["🎯", "使命", "請針對你剛才的回答，說明怎麼把它用在把時間與恩賜用在神的使命上，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段簡短、真誠的禱告，讓我可以拿來禱告。"]]}, "parent": {"sys": " 回答對象：正在養育孩子的父母（孩子可能從嬰幼兒到成年）。請站在父母的位置：他們常常疲累、擔心孩子、也常常內疚。口吻溫暖、貼近生活、不評斷；承認每個孩子與每個家庭都不同。談陪伴與榜樣、管教與恩典的平衡、親子溝通（怎麼聽、怎麼說）、為孩子禱告、夫妻同心、面對自己的軟弱與失敗；可用日常場景當比喻（吃飯、功課、手機、睡前）。結尾給一個這個星期可以做的具體小步驟（一句話、一個擁抱、一段睡前禱告）。若提到孩子遭受傷害、家庭暴力或孩子有自傷的念頭，要溫柔回應並鼓勵立刻尋求專業協助與信任的人。", "write": "\n讀者是正在養育孩子的父母：口吻溫暖、貼近生活、不評斷；不要用表情符號。", "style": "風格：給養育孩子的父母，題目貼近親子溝通、管教、陪伴與為孩子禱告；口氣溫暖，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，有空再讀一遍就會更清楚。", "不錯！這一章的重點您已經抓到了。", "太棒了！神的話正在您的家裡扎根。"], "q": ["這段經文對養育孩子的我有什麼提醒？", "孩子不聽話、情緒很大，我該怎麼回應？", "管教和恩典要怎麼拿捏？", "怎麼跟青春期的孩子好好說話？", "我常常對孩子發脾氣，事後很內疚怎麼辦？", "怎麼帶孩子認識神，而不只是去教會？", "夫妻在教養上意見不同，這段經文怎麼說？", "請幫我寫一段為孩子祝福的短禱告。"], "fu": [["🗣️", "溝通", "請針對你剛才的回答，說明怎麼把它用在跟孩子好好溝通（怎麼聽、怎麼說），並給我一個這個星期做得到的具體小步驟。"], ["⚖️", "管教", "請針對你剛才的回答，說明怎麼把它用在管教與恩典的平衡，並給我一個這個星期做得到的具體小步驟。"], ["😔", "內疚", "請針對你剛才的回答，說明怎麼把它用在對孩子發脾氣或覺得虧欠的內疚，並給我一個這個星期做得到的具體小步驟。"], ["💑", "夫妻", "請針對你剛才的回答，說明怎麼把它用在夫妻在教養上同心，並給我一個這個星期做得到的具體小步驟。"], ["📖", "信仰", "請針對你剛才的回答，說明怎麼把它用在帶孩子認識神、一起親近神，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段我可以為孩子祝福的短禱告。"]]}, "couple": {"sys": " 回答對象：夫妻（正在經營婚姻的丈夫與妻子，可能是新婚、有孩子的中年夫妻，或相伴多年的伴侶）。請站在夫妻同行的位置：口吻溫暖、真誠、不評斷，不偏袒任何一方；承認每段婚姻都有磨合、疲累與受傷的時候。談愛是決定與付出、彼此饒恕、傾聽與表達（怎麼說、怎麼聽）、尊重與同心、金錢與家務的分工、姻親與孩子的教養、一起禱告與一起讀經、在主裡成為一體；可用日常場景當比喻（飯桌、手牽手、吵完架之後、睡前）。結尾給一個這個星期兩個人就能一起做的具體小步驟（一句感謝的話、一段兩人的禱告、一次不看手機的散步）。不要教導妻子順服或丈夫掌權的單方面要求，要強調彼此相愛、彼此順服。若提到家庭暴力、外遇、對方的威脅或有自傷念頭，要溫柔回應，把安全放在第一位，並鼓勵立刻尋求專業協助與信任的人，不要勸人一味忍耐。", "write": "\n讀者是夫妻：口吻溫暖、貼近生活、不評斷、不偏袒任何一方；不要用表情符號。", "style": "風格：給夫妻，題目貼近溝通、饒恕、同心、共同禱告與彼此相愛；口氣溫暖，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，找個晚上兩個人再一起讀一遍。", "不錯！這一章的重點你們抓到了。", "太棒了！神的話正在你們的婚姻裡扎根。"], "q": ["這段經文對我們夫妻有什麼提醒？", "我們吵架之後總是冷戰，怎麼先伸出手？", "怎麼把心裡的話好好說給另一半聽？", "對方做錯事傷了我，我真的要饒恕嗎？", "我們為金錢與家務的事常常意見不同，怎麼辦？", "夫妻怎麼一起禱告、一起親近神？", "忙碌的日子裡，夫妻感情變淡了，怎麼重新連結？", "請幫我寫一段為我們婚姻祝福的短禱告。"], "fu": [["🗣️", "溝通", "請針對你剛才的回答，說明夫妻怎麼把它用在好好說、好好聽，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["🤝", "饒恕", "請針對你剛才的回答，說明夫妻怎麼把它用在彼此認錯與饒恕，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["💞", "親密", "請針對你剛才的回答，說明夫妻怎麼把它用在重新連結感情、表達愛與感謝，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["👨‍👩‍👧", "同心", "請針對你剛才的回答，說明夫妻怎麼把它用在金錢、家務與教養上同心，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["📖", "同讀", "請針對你剛才的回答，說明夫妻怎麼一起讀經、一起親近神，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段夫妻可以一起禱告的短禱告。"]]}, "pastor": {"sys": " 回答對象：牧者與傳道同工（教會的牧師、傳道人、小組長與事奉的同工）。請站在同工的位置：他們常常肩負許多人的重擔，自己也會疲累、孤單、被誤解或灰心。口吻尊重、平等、真誠，像同工之間彼此扶持，不說教、不居高臨下。可以有適度的深度：點出經文脈絡、原文語境與關鍵字詞的意思，談牧養羊群與生命建造、預備講道與教導、帶領小組與門徒訓練、團隊同心與衝突、面對批評與孤單、屬靈爭戰、自己的靈命與家庭，以及不倦怠的安息與依靠；也可提供講章或查經的切入點、段落與應用建議，但要提醒最後仍須自己在神面前領受。結尾給一個這個星期可以做的具體小步驟（一段安靜親近神的時間、一通關心的電話、一次向同工的坦誠分享）。若提到極度疲憊、憂鬱、想放棄或有自傷念頭，要溫柔回應，並鼓勵立刻尋求信任的同工、屬靈長輩與專業協助。", "write": "\n讀者是牧者與傳道同工：口吻尊重、平等、真誠，像同工彼此扶持；不要用表情符號。", "style": "風格：給牧者與傳道同工，題目貼近牧養、講道預備、帶領團隊、面對疲累與屬靈爭戰；口氣尊重真誠，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，有空再讀一遍就會更清楚。", "不錯！這一章的重點您已經抓到了。", "太棒了！神的話先餵養了牧者，也必流向羊群。"], "q": ["這段經文對事奉中的我有什麼提醒？", "請幫我找這段經文的講道架構與切入點。", "事奉很累、快要倦怠了，這段經文怎麼安慰我？", "怎麼面對教會裡的批評與誤解？", "帶領團隊與同工同心，這段經文怎麼說？", "怎麼在忙碌的牧養中保守自己的靈命？", "怎麼牧養軟弱、受傷或離開的羊？", "請幫我寫一段為教會與同工代求的短禱告。"], "fu": [["📖", "講道", "請針對你剛才的回答，提供一個可用於講道或查經的架構（三個要點與一個應用），並提醒我自己先在神面前領受。"], ["🐑", "牧養", "請針對你剛才的回答，說明怎麼把它用在牧養羊群與關心個別的人，並給我一個這個星期做得到的具體小步驟。"], ["🤝", "團隊", "請針對你剛才的回答，說明怎麼把它用在帶領團隊、同工同心與處理衝突，並給我一個這個星期做得到的具體小步驟。"], ["🕊️", "安息", "請針對你剛才的回答，說明怎麼把它用在自己的疲累與靈命保守，並給我一個這個星期做得到的具體小步驟。"], ["⚔️", "爭戰", "請針對你剛才的回答，說明怎麼把它用在面對批評、孤單與屬靈爭戰，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "代禱", "請把你剛才說的重點，寫成一段我可以為教會與同工代求的短禱告。"]]}}};

  const songName = s => EN ? (s.ne || s.n) : (isSC() ? (s.ns || s.n) : s.n);

    if (hymnEl) return hymnEl;

    hymnEl.setAttribute('playsinline', ''); hymnEl.setAttribute('webkit-playsinline', '');

  function hymnPlay(i) {
    const s = hymns && hymns[i]; if (!s) return;
    const a = hymnAudio();
    if (hymnPrev === i) { hymnStop(); return; }
    hymnStop();
    const base = songBase[s.f] != null ? songBase[s.f] : '';
    a.src = SITE + base + encodeURIComponent(s.f);
    const p = a.play(); if (p && p.catch) p.catch(() => {
      if (base === '') { a.src = SITE + 'music/' + encodeURIComponent(s.f); const p2 = a.play(); if (p2 && p2.catch) p2.catch(() => say(T('這首歌暫時放不出來', 'This song could not play'))); }
    });
    hymnPrev = i;
    const b = q1('#gxhp' + i); if (b) b.textContent = '⏸';
  }
  async function hymnFetch(s) {
    const tries = songBase[s.f] != null ? [songBase[s.f]] : ['', 'music/'];
    let why = '';
    for (const b of tries) {
      try {
        const r = await fetch(SITE + b + encodeURIComponent(s.f), { mode: 'cors' });
        if (!r.ok) { why = 'HTTP ' + r.status; continue; }
        const blob = await r.blob();
        if (!blob.size || /text\/html/.test(blob.type || '')) { why = T('檔案不對', 'bad file'); continue; }
        songBase[s.f] = b;
        return blob;
      } catch (e) { why = T('網路', 'network'); }
    }
    throw new Error(why || 'fail');
  }

function mx_u32(b,p){return b[p]*16777216+b[p+1]*65536+b[p+2]*256+b[p+3];}
function mx_i32(b,p){const v=mx_u32(b,p);return v>=2147483648?v-4294967296:v;}
function mx_u64(b,p){return mx_u32(b,p)*4294967296+mx_u32(b,p+4);}
function mx_typ(b,p){return String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);}

function mx_boxes(b,start,end){
  const out=[];let p=start;
  while(p+8<=end){
    let size=mx_u32(b,p),hs=8;
    if(size===1){size=mx_u64(b,p+8);hs=16;}
    else if(size===0)size=end-p;
    if(size<8||p+size>end)break;
    out.push({type:mx_typ(b,p+4),start:p,size:size,hs:hs,body:p+hs,end:p+size});
    p+=size;
  }
  return out;
}
function mx_find(list,t){return list.filter(x=>x.type===t);}
function mx_one(list,t){const r=mx_find(list,t);return r.length?r[0]:null;}
function mx_children(b,mx_box){return mx_boxes(b,mx_box.body,mx_box.end);}

function mx_parseTrun(b,tr,tfhd,baseOffset){
  const flags=mx_u32(b,tr.body)&0xffffff;
  const cnt=mx_u32(b,tr.body+4);
  let p=tr.body+8;
  let dataOff=0;
  if(flags&0x1){dataOff=mx_i32(b,p);p+=4;}
  let firstFlags=null;
  if(flags&0x4){firstFlags=mx_u32(b,p);p+=4;}
  const samples=[];
  let off=baseOffset+dataOff;
  for(let i=0;i<cnt;i++){
    let dur=tfhd.defDur, size=tfhd.defSize, fl=tfhd.defFlags, cto=0;
    if(flags&0x100){dur=mx_u32(b,p);p+=4;}
    if(flags&0x200){size=mx_u32(b,p);p+=4;}
    if(flags&0x400){fl=mx_u32(b,p);p+=4;}
    if(flags&0x800){cto=mx_i32(b,p);p+=4;}
    if(i===0&&firstFlags!==null)fl=firstFlags;
    samples.push({off:off,size:size,dur:dur,cto:cto,sync:!(fl&0x10000)});
    off+=size;
  }
  return {samples:samples,dataOff:dataOff};
}

function mx_parseTfhd(b,mx_box){
  const flags=mx_u32(b,mx_box.body)&0xffffff;
  const trackId=mx_u32(b,mx_box.body+4);
  let p=mx_box.body+8;
  let base=null;
  if(flags&0x1){base=mx_u64(b,p);p+=8;}
  if(flags&0x2){p+=4;}
  let defDur=0,defSize=0,defFlags=0;
  if(flags&0x8){defDur=mx_u32(b,p);p+=4;}
  if(flags&0x10){defSize=mx_u32(b,p);p+=4;}
  if(flags&0x20){defFlags=mx_u32(b,p);p+=4;}
  return {trackId:trackId,base:base,defDur:defDur,defSize:defSize,defFlags:defFlags,
          defaultBaseIsMoof:!!(flags&0x020000),hasBase:!!(flags&0x1)};
}

/* ---- 產生 mx_box ---- */
function mx_box(type,...parts){
  let len=8;parts.forEach(p=>len+=p.length);
  const head=new Uint8Array(8);
  head[0]=(len>>>24)&255;head[1]=(len>>>16)&255;head[2]=(len>>>8)&255;head[3]=len&255;
  for(let i=0;i<4;i++)head[4+i]=type.charCodeAt(i);
  const out=new Uint8Array(len);out.set(head,0);
  let p=8;parts.forEach(x=>{out.set(x,p);p+=x.length;});
  return out;
}
function mx_b32(v){return new Uint8Array([(v>>>24)&255,(v>>>16)&255,(v>>>8)&255,v&255]);}
function mx_b64(v){const hi=Math.floor(v/4294967296),lo=v>>>0;
  return new Uint8Array([(hi>>>24)&255,(hi>>>16)&255,(hi>>>8)&255,hi&255,
                         (lo>>>24)&255,(lo>>>16)&255,(lo>>>8)&255,lo&255]);}
function mx_cat(arr){let n=0;arr.forEach(a=>n+=a.length);const o=new Uint8Array(n);let p=0;
  arr.forEach(a=>{o.set(a,p);p+=a.length;});return o;}

function mx_remux(bytes){
  const b=bytes;

  /* ---- 為每個 track 重建 stbl ---- */
  function buildStbl(id,stblOld,mediaTimescale){

  function assemble(mdatStart){
    const newTraks=[];

      const tkc=mx_children(b,tk);
      const tkhd=mx_one(tkc,"tkhd");
      const v=b[tkhd.body];

      const mdia=mx_one(tkc,"mdia");
      const mdc=mx_children(b,mdia);
      const mdhd=mx_one(mdc,"mdhd");
      const mv=b[mdhd.body];
      const mts=mx_u32(b,mdhd.body+(mv===1?20:12));

      const mdhdBuf=b.slice(mdhd.start,mdhd.end);
      if(mv===1)writeU64(mdhdBuf,mdhd.body-mdhd.start+24,dur);
      else writeU32(mdhdBuf,mdhd.body-mdhd.start+16,dur);

      const minf=mx_one(mdc,"minf");

      const stblParts=parts.map(x=>x.__co?mx_box("co64",x.data):x);

      const minfParts=mic.map(x=>x.type==="stbl"?newStbl:b.slice(x.start,x.end));

    let maxDur=0;

      let d=0;tk.samples.forEach(s=>d+=s.dur);

    if(b[mvhd.body]===1)writeU64(mvhdBuf,mvhd.body-mvhd.start+24,maxDur);
    else writeU32(mvhdBuf,mvhd.body-mvhd.start+16,maxDur);

    return mx_box("moov",mvhdBuf,...newTraks);
  }

  function writeU32(buf,p,v){buf[p]=(v>>>24)&255;buf[p+1]=(v>>>16)&255;buf[p+2]=(v>>>8)&255;buf[p+3]=v&255;}
  function writeU64(buf,p,v){const hi=Math.floor(v/4294967296),lo=v>>>0;

  const ftypBuf=ftyp?b.slice(ftyp.start,ftyp.end)

  const mdatHead=new Uint8Array(16);

  writeU32(mdatHead,8,hi);writeU32(mdatHead,12,lo);

  const out=new Uint8Array(ftypBuf.length+moovNew.length+16+mdatSize);
  let p=0;
  out.set(ftypBuf,p);p+=ftypBuf.length;
  out.set(moovNew,p);p+=moovNew.length;
  out.set(mdatHead,p);p+=16;
  order.forEach(o=>{out.set(b.subarray(o.off,o.off+o.size),p);p+=o.size;});

    try { mr = new MediaRecorder(stream, Object.assign(mime ? { mimeType: mime } : {}, { videoBitsPerSecond: 2200000 })); }
    catch (e) { cancelAnimationFrame(recAnim); say(T('這台裝置不能錄影片', 'This device cannot record video')); return; }
    chunks = []; recSec = 0;
    mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    mr.onstop = async () => {
      clearInterval(recTimer); cancelAnimationFrame(recAnim); curFade = null; recFading = false;
      try { if (bgmEl) { bgmEl.pause(); bgmEl.src = ''; } } catch (_) {}
      try { if (bgmURL) URL.revokeObjectURL(bgmURL); } catch (_) {}
      try { if (ac) ac.close(); } catch (_) {}
      const type = mr.mimeType || mime || 'video/webm';
      await finishRec(new Blob(chunks, { type }), type, 'video');
    };
    mr.start(1000);
    try { await bgmEl.play(); } catch (e) {}
    fadeIn(mcGain, ac, 1, 0.6);
    curFade = () => fadeOutStop(mcGain, ac, BGM_FADEOUT);
    const len = +st().mc;
    bgmEl.onended = () => { if (recOn()) mr.stop(); };
    bgmEl.ontimeupdate = () => {
      if (len > 0 || recFading || !isFinite(bgmEl.duration)) return;
      const left = bgmEl.duration - bgmEl.currentTime;
      if (left <= BGM_FADEOUT && recOn()) fadeOutStop(mcGain, ac, Math.max(.5, left));
    };
    const lim = len > 0 ? len : 8 * 60;
    setTimeout(() => { if (!recFading && recOn()) fadeOutStop(mcGain, ac, BGM_FADEOUT); }, Math.max(0, lim - BGM_FADEOUT) * 1000);
    setTimeout(() => { if (recOn()) mr.stop(); }, lim * 1000 + 300);
    paint();
    recTick(T('音樂卡片製作中', 'Making music card') + '　♪');
  }

const SCMAP = (() => { try { return JSON.parse(document.getElementById('SCMAP').textContent); } catch(e){ return null; } })();

function terrain(cur){
  const P = D.terrain.points, W = 320, H0 = 96, pad = 14;
  const LAST = LASTCH;
  /* 點的 x 是「章＋章內位置」（例 7.345＝第 7 章三分之一處），所以軸從 1 走到 LAST+1 */
  const XMAX = Math.max(LAST + 1, ...P.map(p => p[0]));
  const x = c => pad + (c - 1) / Math.max(1, XMAX - 1) * (W - pad * 2);
  const y = v => 10 + (100 - v) / 100 * (H0 - 26);
  let d = `M ${x(1)} ${y(40)}`;
  P.forEach(p => { d += ` L ${x(p[0]).toFixed(1)} ${y(p[1]).toFixed(1)}`; });
  d += ` L ${x(XMAX)} ${y(P.length ? P[P.length - 1][1] : 30)}`;

  if (cur) { const cx = x(cur + .5), cy = y(50);

    const txt = String(p[3] || '');
    let w = 0;
    for (const ch of txt) w += /[一-鿿　-〿＀-￯]/.test(ch) ? fs : fs * 0.55;
    const cx = Math.min(W - 1 - w / 2, Math.max(1 + w / 2, x(p[0])));

      if (off === cand[cand.length - 1]) { yy = t; boxes.push(box); }
    }
    out.push({ p, cx, yy });
  });
  const labs = out.map(o =>
    `<text class="tlab ${o.p[4] === 'top' ? 'hi' : ''}" style="font-size:${fs}px" x="${o.cx.toFixed(1)}" y="${o.yy.toFixed(1)}" text-anchor="middle">${esc(String(o.p[3] || ''))}</text>`
  ).join('');
  const dots = P.map(p => `<circle class="tdot ${p[4] === 'bot' ? 'low' : ''}" cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="${p[4] ? 3.2 : 2.2}"/>`).join('');
  const now = cur ? `<circle class="tnow" cx="${x(cur + .5).toFixed(1)}" cy="${y(50)}" r="6"/>` : '';
  // viewBox 依實際內容撐開，標籤不會被切掉
  const lb = boxes.slice(obst.length);
  const vy0 = Math.min(0, ...lb.map(b => b.y0)) - 3;
  const vy1 = Math.max(H0, ...lb.map(b => b.y1)) + 3;
  return `<div class="terrain"><svg viewBox="0 ${vy0.toFixed(1)} ${W} ${(vy1 - vy0).toFixed(1)}" role="img" aria-label="阿摩司書全書地形圖">
    <path class="tpath" d="${d}"/>${dots}${labs}${now}</svg>
    <p class="xs muted center" style="margin:2px 0 6px">召 · 控 · 約 · 王 · 慰 · 破 · 列 · 記</p></div>`;
}

function openV(ref){

  const L = (i, name, body, cls) => {
    const on = OPENL[i] && !(i === 2 && !S.set.grk) && !(i === 4 && !S.set.grk);
    return `<div class="layer"><div class="lh" onclick="tglL(${i},'${ref}')">

      <span class="caret">${on ? '▾' : '▸'}</span></div>
      ${on ? `<div class="lb ${cls || ''}">${body}</div>` : ''}</div>`;
  };
  let h = `<h4>阿摩司書 ${esc(rr)}</h4>
    <p class="xs muted" style="margin:0 0 10px">${v.star ? '★ 重點段落　' : ''}第 ${v.ch} 章</p>
    ${L(1, '和合本', blkCuv(v))}
    ${S.set.grk && v.grk ? L(2, '原文', v.grk, 'grk') : ''}
    ${v.lit ? L(3, '直譯', tagParas(v.lit, 'x|' + v.ch + ':' + v.a + '|lit'), 'lit') : ''}
    ${S.set.grk && v.key ? L(4, '關鍵字', v.key) : ''}
    ${v.gram ? L(5, '文法解析', tagParas(v.gram, 'x|' + v.ch + ':' + v.a + '|gram')) : ''}
    ${v.exp ? L(6, '經文解釋', tagParas(v.exp, 'x|' + v.ch + ':' + v.a + '|exp')) : ''}`;
  const iss = (D.issues || []).filter(x => (x.ch || []).includes(v.ch));
  if (iss.length){ h += `<div class="hr"></div>`;
    iss.forEach(x => h += `<button class="btn" style="margin:0 6px 6px 0" onclick="openIssue('${x.id}')">⚖ ${esc(x.t)} ›</button>`); }
  const prev = BLK[v.ch][v.i - 1], next = BLK[v.ch][v.i + 1];
  h += `<div class="hr"></div><div class="row">
    ${prev ? `<button class="btn" onclick="openV('${v.ch}:${prev.a}')">‹ 上一段</button>` : ''}

    <button class="btn" onclick="go('course',${v.ch})">整章講義</button></div>`;
  sheet(h);
}
function blkPlain(ref){ const v = VMAP[ref]; if (!v) return '';

/* ── 講義朗讀：跳過卷名、提詞機與目錄，直接從本文開始 ──
   節標題、想更深、三個化的段落，都用口語的方式帶進去，
   聽起來像一位老師在講，不像螢幕在念版面。 */
const DEEP_LEAD = [
  '我們在這裡想更深一點。有人會問，',
  '這裡容我多說一句。可能有人心裡正在問，',
  '我知道有人讀到這裡會停下來問，',
  '讓我們把這一段再往裡走一步。有人問，',
];
const DEEP_ANS = ['我的回答是這樣。', '我是這樣看的。', '我們可以這樣想。', '這一題我會這樣回答。'];
/* 把純文字切成句子（與畫面上的 .mks 完全同一套規則，這樣才對得起來）*/
const plainSents = s => splitHTML(esc(s)).map(x =>
  x.replace(/<[^>]+>/g, '').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&'));

/* 朗讀單位：一句一個，並且記著它在畫面上是哪一塊的第幾句
   { t:要念的字, i:區塊序號, part:'t'|'a', j:句序（-1 表示整塊） }  */
function lesSpeakUnits(n){
  const L = (D.lesson || {})[n];
  if (!L) return [];
  const out = [];
  let di = 0, qi = 0;
  const push = (t, i, part, j) => { if (String(t).trim()) out.push({ t:String(t), i, part, j }); };
  /* 一整塊：第一句套用口語的帶入詞，其餘照念，句序與畫面對得起來 */
  const block = (raw, i, part, lead, drop) => {
    const ss = plainSents(raw);
    ss.forEach((s, j) => {
      let x = s;
      if (j === 0){ if (drop) x = x.replace(drop, ''); x = (lead || '') + x; }
      push(x, i, part, j);
    });
  };
  L.blocks.forEach((b, i) => {
    const t = b[1];
    switch (b[0]){
      case 'h': {                                   // 一、xxx → 第一段，xxx。
        const p = String(t).split('、');
        push(p.length > 1 ? `第${p[0]}段，${p.slice(1).join('、')}。` : String(t) + '。', i, 't', -1);
        break;
      }
      case 'd':                                     // 想更深：一問一答
        push(DEEP_LEAD[di % DEEP_LEAD.length] + t[0], i, 'q', -1);
        block(t[1], i, 'a', DEEP_ANS[di % DEEP_ANS.length]);
        di++;
        break;
      case 's': {                                   // 三個化的段標（括號裡的分鐘數不念）
        const s = String(t).replace(/（[^）]*）/g, '').replace(/｜/g, '，').trim();
        push(/^收尾/.test(s) ? '我們來收尾。' : `接下來是${s}。`, i, 't', 0);
        break;
      }
      case 't': {                                   // 【看】【聽】【想】【講】【行】
        const m = String(t).match(/^【(.+?)】(.*)$/);
        push(m ? `這一步是「${m[1]}」，${m[2]}。` : String(t) + '。', i, 't', 0);
        break;
      }
      case 'm':                                     // 帶領說明／提醒：本身已自帶稱謂
        if (/優先順序標示/.test(t)) break;           // 星號是印在紙上的記號，念出來沒有意義
        block(t, i, 't');
        break;
      case 'n': {                                   // 1. ★★★ 題目 → 第一題。題目
        const m = String(t).match(/^(\d+)\./);
        qi = m ? +m[1] : qi + 1;
        const must = /【必做】/.test(String(t));
        block(t, i, 't', `第${cnNum(qi)}題。${must ? '這一題必做。' : ''}`, /^\d+\.\s*(★+)?\s*(【必做】)?\s*/);
        break;
      }
      default:
        block(t, i, 't');
    }
  });
  return out;
}
/* 把單位併成「一次抓一段語音」的段落：同一塊之內合併到 60 字以上再切，
   太碎會一直等網路，太大又會遲遲不開口。每一段記著它涵蓋畫面上的哪幾句。 */
function lesSegs(n){
  const us = lesSpeakUnits(n), segs = [];
  us.forEach(u => {
    const last = segs[segs.length - 1];
    if (last && last.i === u.i && last.part === u.part && last.j0 >= 0 && u.j >= 0
        && last.t.length < 60 && last.t.length + u.t.length <= 240){
      last.t += u.t; last.js.push(u.j);
    } else {
      segs.push({ t:u.t, i:u.i, part:u.part, j0:u.j, js:u.j >= 0 ? [u.j] : [] });
    }
  });
  segs.forEach(s => { s.t = sanitize(s.t); });
  return segs.filter(s => s.t);
}
const lesSpeakText = n => lesSpeakUnits(n).map(u => u.t).join('\n');
function lesTitle(n){
  const L = (D.lesson || {})[n];
  return L ? `第${cnNum(n)}課　${String(L.title).split('——')[0]}` : '講義';
}
function lesSpeak(n){
  if (SPK.on) return stopSpeak();
  const segs = lesSegs(n);
  if (!segs.length) return toast('本章尚未收錄教學講義');
  playSegs(segs, lesTitle(n), n);
}
/* 預先下載：把整課的語音抓進 IndexedDB，之後離線也能聽 */
async function lesDownload(n){
  const segs = lesSegs(n);
  if (!segs.length) return toast('本章尚未收錄教學講義');
  if (!S.set.human) return toast('目前用的是裝置語音，不需要下載');
  const b = $('#lesDl' + n);
  const chunks = segs.map(s => s.t);
  let done = 0, fail = 0;
  const paint = () => { if (b) b.textContent = `⤓ 下載中 ${done}/${chunks.length}`; };
  paint();
  const CONC = 6; let next = 0;
  await new Promise(res => {
    let running = 0;
    const pump = () => {
      if (!chunks.length) return res();
      while (running < CONC && next < chunks.length){
        running++;
        TTSQ.bulk = true;
        ttsFetch(chunks[next++]).catch(() => { fail++; }).then(() => {
          running--; done++; paint();
          if (done === chunks.length) res(); else pump();
        });
      }
    };
    pump();
  });
  if (b) b.textContent = fail ? '⤓ 預先下載' : '✓ 已下載';
  toast(fail ? `有 ${fail} 段沒下載到，請再試一次` : '整課語音已存進這台裝置，可以離線聽了');
}
/* 進到講義頁時，看看這一課是不是已經下載過了 */
function lesDlCheck(n){
  const b = $('#lesDl' + n);

  const segs = lesSegs(n); if (!segs.length) return;

  ttsCount(keys, got => {
    const el = $('#lesDl' + n); if (!el) return;
    el.textContent = got >= keys.length ? '✓ 已下載'
      : got ? `⤓ 預先下載（已有 ${got}/${keys.length}）` : '⤓ 預先下載';
  });
}

const TTS_DB = 'r321_tts';
function ttsDB(cb){
  try {
    if (!window.indexedDB) return cb(null);
    const r = indexedDB.open(TTS_DB, 1);
    r.onupgradeneeded = () => { try { if (!r.result.objectStoreNames.contains('a')) r.result.createObjectStore('a'); } catch(e){} };
    r.onsuccess = () => cb(r.result);
    r.onerror = () => cb(null);
  } catch(e){ cb(null); }
}
function ttsGet(k, cb){
  ttsDB(db => { if (!db) return cb(null);
    try { const q = db.transaction('a').objectStore('a').get(k);
      q.onsuccess = () => cb(q.result || null); q.onerror = () => cb(null);
    } catch(e){ cb(null); } });
}
function ttsPut(k, blob){
  ttsDB(db => { if (!db) return;
    try { db.transaction('a', 'readwrite').objectStore('a').put(blob, k); } catch(e){} });
}
/* 這些段落已經下載了幾段？（一次交易查完，不逐段開連線）*/
function ttsCount(keys, cb){
  if (!keys.length) return cb(0);
  ttsDB(db => { if (!db) return cb(0);
    try {
      const st = db.transaction('a').objectStore('a');
      let n = 0, done = 0;
      keys.forEach(k => {
        const q = st.getKey ? st.getKey(k) : st.count(k);
        q.onsuccess = () => { if (q.result !== undefined && q.result !== 0) n++; if (++done === keys.length) cb(n); };
        q.onerror   = () => { if (++done === keys.length) cb(n); };
      });
    } catch(e){ cb(0); } });
}
async function ttsClear(){
  return new Promise(res => ttsDB(db => { if (!db) return res();
    try { const t = db.transaction('a', 'readwrite'); t.objectStore('a').clear(); t.oncomplete = () => res(); t.onerror = () => res(); }
    catch(e){ res(); } }));
}

const voiceName = () => (TTS_VOICES[S.set.voice] || TTS_VOICES.yunfan).name;
const rateAttr  = () => (S.set.rate >= 0 ? '+' : '') + (S.set.rate * 5) + '%';

/* 原文（希伯來文／希臘文）中文語音念不出來。
   後面若跟著括號裡的拼音，就只念那個拼音；沒有拼音就整段略過——只念一遍，不重複。 */
const ORIG_CH  = '\\u0590-\\u05FF\\u0370-\\u03FF\\u1F00-\\u1FFF';
const ORIG_RUN = '[' + ORIG_CH + '][' + ORIG_CH + "\\s'\u2019\\-\u05be\u05f3\u05f4\u00b7]*";
const RE_ORIG_ROMAN = new RegExp(ORIG_RUN + "\\s*[（(]\\s*([A-Za-z][A-Za-z'\u2019\u0101\u0113\u012b\u014d\u016b\\- ]*)\\s*[）)]", 'g');
const RE_ORIG_RUN   = new RegExp(ORIG_RUN, 'g');

/* 讀音修正：只改送去語音的字，畫面上的字完全不動。
   「地」在天地、地球、地是……應讀 ㄉㄧˋ，語音引擎常誤讀成輕聲的 ㄉㄜ˙；
   換成同音的「帝」就讀得對（聽起來一模一樣）。要再加字就往這張表加。 */
const TTS_SAY = [
  [/天地/g, '天帝'],
  [/地球/g, '帝球'],
  [/地是/g, '帝是'],
];

/* 朗讀前的文字整理 */
function sanitize(t){
  t = String(t || '').replace(/<[^>]+>/g, ' ');
  t = t.replace(/&nbsp;/g, ' ').replace(/&amp;/g, '和').replace(/&lt;|&gt;/g, ' ');
  // 原文只念一遍：有拼音就只念拼音，沒有拼音就整段略過
  t = t.replace(RE_ORIG_ROMAN, ' $1 ').replace(RE_ORIG_RUN, '\u0000');
  // 略過原文之後，把「……原文是。」這種懸在半空的接續詞一起收乾淨
  t = t.replace(/[（(]\s*\u0000\s*[）)]/g, '\u0000');
  t = t.replace(/[是叫作為的]?\s*\u0000\s*(?=[，。；、！？])/g, '');
  t = t.replace(/\s*\u0000\s*/g, ' ');
  t = t.replace(/[（(]\s*[）)]/g, ' ');
  t = t.replace(/\*\*/g, '').replace(/[《》「」『』【】]/g, '');
  t = t.replace(/^[ \t]*#{1,6}[ \t]*/gm, '').replace(/^[ \t]*>[ \t]?/gm, '');
  t = t.replace(/★|⚠|✓|❌|🟢|🟡|🔴|📋|📖|⚖|▸|▾|·/g, ' ');
  // 經節寫法口語化：8:28 → 八章二十八節
  t = t.replace(/(\d{1,3}):(\d{1,3})(?:[–-](\d{1,3}))?/g, (m, a, b, c) =>
    cnNum(a) + '章' + cnNum(b) + (c ? '到' + cnNum(c) : '') + '節');
  t = t.replace(/321/g, '三二一').replace(/920/g, '九二零').replace(/235/g, '二三五');
  t = t.replace(/[：]/g, '，');
  TTS_SAY.forEach(r => { t = t.replace(r[0], r[1]); });
  t = t.replace(/\s+([，。！？；、])/g, '$1');
  return t.replace(/\s{2,}/g, ' ').trim();
}
function cnNum(n){
  n = parseInt(n, 10); const d = '零一二三四五六七八九';
  if (n < 10) return d[n];
  if (n < 20) return '十' + (n % 10 ? d[n % 10] : '');
  if (n < 100) return d[Math.floor(n / 10)] + '十' + (n % 10 ? d[n % 10] : '');
  return String(n);
}
function ttsChunks(t){
  t = sanitize(t); if (!t) return [];
  const out = []; let buf = '';
  for (const ch of t){ buf += ch; if ('。！？；\n'.includes(ch) && buf.length >= 110){ out.push(buf); buf = ''; } }
  if (buf.trim()) out.push(buf);
  const fin = [];
  out.forEach(s => { while (s.length > 300){ fin.push(s.slice(0, 300)); s = s.slice(300); } if (s) fin.push(s); });
  return fin.length ? fin : [t];
}
/* -rf1105（互動聖經 v2.60 朗讀升級）：雲端逾時、20 秒斷路器、失敗改用裝置語音、看門狗、睡前定時。
   TTSQ 由 plFetch／預先下載在呼叫前設定，ttsFetch 一開頭就讀走（PRON321 的包裝只轉第一個參數）。 */
let TTS_DOWN = 0;                       // 雲端暫停到什麼時候（失敗後 20 秒內，沒有快取的段落不再等待）
const TTSQ = { quick:false, bulk:false };
let NATIVE_STOP = null;                 // 目前這一句若正在用裝置語音，可以用它收掉
let WD2 = null;                         // 看門狗：音檔放完卻沒觸發 ended 時，依實際長度推進
const SLEEP = { mode:0, mins:[0, 15, 30, 60], t:0, iv:0 };
async function ttsFetch(piece){
  const quick = TTSQ.quick, bulk = TTSQ.bulk; TTSQ.quick = TTSQ.bulk = false;
  const key = voiceName() + '|' + rateAttr() + '|' + piece;
  const cached = await new Promise(r => ttsGet(key, r));
  if (cached) return cached;
  /* 剛失敗過的 20 秒內，沒有快取的段落不再等待，立刻讓呼叫端改用裝置語音（整課預先下載不受影響） */
  if (!bulk && Date.now() < TTS_DOWN) throw new Error('cloud paused');
  let ctrl = null, timer = null;
  try { if (window.AbortController) ctrl = new AbortController(); } catch(e){}
  if (ctrl) timer = setTimeout(() => { try { ctrl.abort(); } catch(e){} }, (quick && !bulk) ? 6000 : 15000);
  try {
    const res = await fetch(SVC.tts, { signal: ctrl ? ctrl.signal : undefined, method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ voice:voiceName(), rate:rateAttr(), sil:TTS_SIL.s, silc:TTS_SIL.c, sile:TTS_SIL.e, text:piece }) });
    if (!res.ok) throw new Error('TTS ' + res.status);
    const blob = await res.blob();
    if (timer) clearTimeout(timer);
    ttsPut(key, blob);
    return blob;
  } catch (err) {
    if (timer) clearTimeout(timer);
    if (!bulk) TTS_DOWN = Date.now() + 20000;
    throw err;
  }
}

let AUP = null, SPK = { on:false, pause:false, tok:0, list:[], i:0, title:'', prep:0, total:0 };
/* 兩個播放器輪流用：一個在播，另一個先把下一段 load 好，接起來不會卡 */
function audioPair(){
  if (!AUP){
    AUP = [0, 1].map(() => {
      const a = new Audio(); a.preload = 'auto'; a.loop = false;
      a.setAttribute('playsinline', '');
      /* 背景播放：鎖屏／切到別的 App 時，系統的播放控制列要能操作 */
      a.addEventListener('play',  () => { mediaState('playing'); });
      a.addEventListener('pause', () => { if (!SPK.on) mediaState('paused'); });
      return a;
    });
  }
  return AUP;
}
const audioEl = () => audioPair()[0];
/* 鎖屏／耳機／車機的播放控制 */
function mediaState(st){
  try { if (navigator.mediaSession) navigator.mediaSession.playbackState = st; } catch(e){}
}
function appIcon(){
  const l = document.querySelector('link[rel="apple-touch-icon"][sizes="180x180"]');
  return (l && l.getAttribute('href')) || '';
}
function mediaSetup(title){
  if (!navigator.mediaSession || !window.MediaMetadata) return;
  try {
    const ic = appIcon();
    navigator.mediaSession.metadata = new MediaMetadata({
      title: title || '朗讀中',
      artist: '阿摩司書講義',

    });
    navigator.mediaSession.setActionHandler('play',  () => { if (SPK.pause) togglePause(); });
    navigator.mediaSession.setActionHandler('pause', () => { if (!SPK.pause) togglePause(); });
    navigator.mediaSession.setActionHandler('stop',  () => stopSpeak());
    navigator.mediaSession.setActionHandler('previoustrack', () => spkStep(-1));
    navigator.mediaSession.setActionHandler('nexttrack',     () => spkStep(1));

/* ── 串流播放器 ───────────────────────────────────────────
   一段一段抓、一段一段播：抓到前兩段就開始播，其餘邊播邊抓。
   兩個 <audio> 輪流用（下一段先 load 好），所以段與段之間不會卡住。
   每一段都記著它對應到畫面上的哪幾句，播到那一段就把那幾句標起來、捲過去。  */
const PRE_START = 2;      // 抓到幾段就開播
const PRE_AHEAD = 8;      // 播放中隨時往前多抓幾段
const SILENT_MP3 = 'data:audio/mpeg;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCA';

let PL = null;
function playSegs(segs, title, lesson){
  if (!segs.length) return;
  if (!S.set.human) return sayNative(segs.map(s => s.t).join('\n'));
  stopSpeak();
  TTS_DOWN = 0;                       // 按 ▶ 開新一輪：歸零，重新試雲端
  const my = ++SPK.tok;
  SPK = { on:true, pause:false, tok:my, list:segs, i:0, title:title || '朗讀中', prep:0, total:segs.length };
  PL = { tok:my, segs, blobs:new Array(segs.length), pend:new Array(segs.length).fill(0),
         try:new Array(segs.length).fill(0),
         i:0, cur:0, lesson:lesson || 0, fail:0, running:0 };
  const els = audioPair();
  els.forEach(a => { try { a.pause(); a.removeAttribute('src'); a.load(); } catch(e){} });
  /* 使用者按下按鈕的這一刻，把兩個播放器都解鎖（iOS 只認手勢當下的 play）*/
  els.forEach(a => { try { a.src = SILENT_MP3; const p = a.play(); if (p && p.catch) p.catch(() => {}); } catch(e){} });
  setTimeout(() => els.forEach(a => { try { if (a !== els[0]) a.pause(); } catch(e){} }), 0);
  mediaSetup(SPK.title);
  drawBar();
  plPump();
  plWaitAndStart();
}
function plFetch(k){
  if (!PL || PL.tok !== SPK.tok) return;
  if (PL.blobs[k] || PL.pend[k]) return;
  PL.pend[k] = 1; PL.running++;
  TTSQ.quick = (k === (PL.need != null ? PL.need : PL.i)) || PL.fail > 0;
  ttsFetch(PL.segs[k].t).then(b => { if (PL && PL.tok === SPK.tok) PL.blobs[k] = b; },
                               () => { if (PL){ PL.fail++; PL.try[k] = (PL.try[k] || 0) + 1; } })
    .then(() => {
      if (!PL || PL.tok !== SPK.tok) return;
      PL.pend[k] = 0; PL.running--;
      SPK.prep = PL.blobs.filter(Boolean).length; drawBar(); plPump();
    });
}
/* 從正在播的那一段往前看幾段，缺的就補抓（抓壞的也會自動重試）*/
function plPump(){
  if (!PL || PL.tok !== SPK.tok) return;
  const end = Math.min(PL.segs.length, Math.max(PRE_START, PL.i + 1 + PRE_AHEAD));
  for (let k = PL.i; k < end && PL.running < 4; k++){
    if ((PL.try[k] || 0) < 3){
      if (Date.now() < TTS_DOWN && k !== (PL.need != null ? PL.need : PL.i)) continue;   /* 雲端暫停中：只替現在要唸的那一句試 */
      plFetch(k);
    }
  }
}
function plWaitAndStart(){
  const my = SPK.tok;
  const tick = () => {
    if (!PL || PL.tok !== my || !SPK.on) return;
    const ready = PL.blobs[0] && (PL.blobs[1] || PL.segs.length < 2);
    if (ready) return plPlay(0);
    if (!PL.blobs[0] && (PL.try[0] || 0) >= 3 && window.speechSynthesis) return plPlay(0);   /* 第一句雲端就連不上：逐句改用裝置語音，仍有逐句標示 */
    if (PL.fail >= 3 && !PL.blobs[0]){
      const txt = PL.segs.map(s => s.t).join('\n');
      stopSpeak(); toast('真人語音連不上，改用裝置語音'); return sayNative(txt);
    }
    setTimeout(tick, 120);
  };
  tick();
}
function plPlay(k){
  if (!PL || PL.tok !== SPK.tok) return;
  if (NATIVE_STOP){ const ns0 = NATIVE_STOP; NATIVE_STOP = null; ns0(); }
  if (k >= PL.segs.length) return stopSpeak();
  const b = PL.blobs[k];
  if (!b){
    if (Date.now() < TTS_DOWN && PL.pend[k]) PL.try[k] = 3;   /* 雲端剛判定失敗：還在等的這一句也不再等 */
    if ((PL.try[k] || 0) >= 3){              // 這一段雲端抓不到：改用裝置語音唸這一句，唸完再回雲端
      return nativeUnit(k);
    }
    PL.need = k;
    SPK.buffering = true; SPK.i = k; drawBar(); plPump();   // 還沒到，等一下再播（不跳過）
    return setTimeout(() => plPlay(k), 150);
  }
  SPK.buffering = false;
  PL.i = k; SPK.i = k;
  const els = audioPair(), a = els[PL.cur];
  PL.need = null; clearWd2();
  a.src = URL.createObjectURL(b);
  /* 看門狗：音檔放完卻沒有 ended（某些系統暫停了頁面）時，依實際長度（含語速）＋5 秒推進到下一句 */
  const armWd = () => {
    clearWd2();
    const d = a.duration;
    if (!(d > 0 && isFinite(d))) return;
    const left = Math.max(0, d - (a.currentTime || 0)) / (a.playbackRate || 1);
    WD2 = setTimeout(() => {
      WD2 = null;
      if (!PL || PL.tok !== SPK.tok || PL.i !== k || SPK.pause) return;
      if (!a.ended){ try { URL.revokeObjectURL(a.src); } catch(e){} PL.cur = 1 - PL.cur; plPlay(k + 1); }
    }, left * 1000 + 5000);
  };
  a.onplaying = armWd; a.onloadedmetadata = () => { if (!a.paused) armWd(); };
  a.onpause = clearWd2;
  a.onended = () => {
    clearWd2();
    if (!PL || PL.tok !== SPK.tok) return;
    try { URL.revokeObjectURL(a.src); } catch(e){}
    PL.cur = 1 - PL.cur;
    plPlay(k + 1);
  };
  a.onerror = () => { clearWd2(); if (PL && PL.tok === SPK.tok){ PL.cur = 1 - PL.cur; plPlay(k + 1); } };
  const p = a.play(); if (p && p.catch) p.catch(() => {});
  spkMark(PL.segs[k]);
  drawBar();
  plPump();
  /* 下一段先 load 好，接得上 */
  const nb = PL.blobs[k + 1];
  if (nb){ const nx = els[1 - PL.cur];
    try { nx.src = URL.createObjectURL(nb); nx.load(); } catch(e){} }
}
async function speak(text, title){
  const chunks = ttsChunks(text);
  if (!chunks.length) return;
  playSegs(chunks.map(t => ({ t })), title);
}
function utter(t){
  const u = new SpeechSynthesisUtterance(sanitize(t));
  u.lang = 'zh-TW'; u.rate = 0.94 + S.set.rate * 0.05;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(x => /zh[-_]TW|zh[-_]HK|cmn/i.test(x.lang)) || vs.find(x => /^zh/i.test(x.lang));
  if (v) u.voice = v;
  return u;
}
function sayNative(t){
  if (!window.speechSynthesis) return toast('這台裝置不支援朗讀');
  speechSynthesis.cancel();
  speechSynthesis.speak(utter(t));
}
function clearWd2(){ if (WD2){ try { clearTimeout(WD2); } catch(e){} WD2 = null; } }
/* 雲端這一句抓不到：只這一句改用裝置語音（仍逐句標示），唸完 plPlay(k+1) 回到雲端；提示每輪只彈一次 */
function nativeUnit(k){
  if (!PL) return;
  if (!window.speechSynthesis){ PL.i = k; SPK.i = k; return plPlay(k + 1); }
  const my = SPK.tok; let done = false, tm = null;
  PL.i = k; SPK.i = k; PL.need = null; SPK.buffering = false; SPK.native = true;
  if (!SPK.toasted){ SPK.toasted = true; toast('真人語音連不上，這一句先用裝置語音'); }
  spkMark(PL.segs[k]);
  drawBar();
  const txt = PL.segs[k].t;
  const fin = (cancelOnly) => {
    if (done) return; done = true;
    if (tm){ clearTimeout(tm); tm = null; }
    NATIVE_STOP = null; SPK.native = false;
    if (cancelOnly) return;
    if (!PL || PL.tok !== my || !SPK.on) return;
    plPlay(k + 1);
  };
  NATIVE_STOP = () => { if (done) return; fin(true); try { speechSynthesis.cancel(); } catch(e){} };
  const guard = () => {
    tm = setTimeout(() => { if (done) return; if (SPK.pause) return guard(); fin(); }, Math.max(15000, txt.length * 480 / (S.set.rate * 0.05 + 0.94)) + 10000);
  };
  try {
    const u = utter(txt);
    u.onend = () => fin(); u.onerror = () => fin();
    speechSynthesis.cancel(); speechSynthesis.speak(u);
    if (SPK.pause) speechSynthesis.pause();
    guard();
  } catch(e){ fin(); }
}
/* 睡前定時：關 → 15 → 30 → 60 分鐘 → 關。時間到淡出 5 秒再停 */
function sleepMsg(m){ return m ? ('睡前定時：' + m + ' 分鐘後停止') : '睡前定時：關'; }
function sleepClear(){
  if (SLEEP.t){ clearTimeout(SLEEP.t); SLEEP.t = 0; }
  if (SLEEP.iv){ clearInterval(SLEEP.iv); SLEEP.iv = 0; try { audioPair().forEach(a => { a.volume = 1; }); } catch(e){} }
  SLEEP.mode = 0;
}
function sleepCycle(){
  if (!SPK.on) return;
  const m = (SLEEP.mode + 1) % SLEEP.mins.length;
  if (SLEEP.t){ clearTimeout(SLEEP.t); SLEEP.t = 0; }
  SLEEP.mode = m;
  if (m) SLEEP.t = setTimeout(sleepFire, SLEEP.mins[m] * 60000);
  toast(sleepMsg(SLEEP.mins[m]));
  drawBar();
}
function sleepFire(){
  SLEEP.t = 0; SLEEP.mode = 0;
  if (!SPK.on) return;
  const els = audioPair(); let n = 0;
  SLEEP.iv = setInterval(() => {
    n++;
    try { els.forEach(a => { a.volume = Math.max(0, 1 - n * 0.2); }); } catch(e){}
    if (n >= 5){ clearInterval(SLEEP.iv); SLEEP.iv = 0; stopSpeak(); try { els.forEach(a => { a.volume = 1; }); } catch(e){} }
  }, 1000);
}
function stopSpeak(){
  if (NATIVE_STOP){ const ns1 = NATIVE_STOP; NATIVE_STOP = null; ns1(); }
  clearWd2(); sleepClear();
  SPK.tok++; SPK.on = false; SPK.pause = false; SPK.buffering = false; SPK.native = false;
  PL = null;
  try { audioPair().forEach(a => { a.pause(); a.onended = null; a.onerror = null; }); } catch(e){}
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch(e){}
  spkClear();
  drawBar();
}
function plCurEl(){ const els = audioPair(); return els[PL ? PL.cur : 0]; }
function togglePause(){
  const a = plCurEl();
  if (SPK.pause){ if (!SPK.native){ const p = a.play(); if (p && p.catch) p.catch(() => {}); } SPK.pause = false; if (SPK.native && window.speechSynthesis) speechSynthesis.resume(); }
  else { if (!SPK.native) a.pause(); SPK.pause = true; if (SPK.native && window.speechSynthesis) speechSynthesis.pause(); }

}
/* 往前／往後跳一句 */
function spkStep(d){
  if (!PL) return;
  if (NATIVE_STOP){ const ns2 = NATIVE_STOP; NATIVE_STOP = null; ns2(); }
  const k = Math.max(0, Math.min(PL.segs.length - 1, PL.i + d));
  try { plCurEl().pause(); plCurEl().onended = null; } catch(e){}
  PL.i = k; SPK.pause = false;
  plPump(); plPlay(k);

function drawBar(){
  let el = $('#spkbar');

  if (!el){
    el = document.createElement('div'); el.id = 'spkbar'; el.className = 'spkbar';
    document.body.appendChild(el);
  }
  const st = SPK.buffering ? `<span class="pv">緩衝中…</span>`
    : SPK.total ? `<span class="pv">${(SPK.i || 0) + 1}/${SPK.total}</span>` : '';
  const follow = PL && PL.lesson
    ? `<button class="${S.set.follow === 0 ? '' : 'on'}" title="自動捲動"
         onclick="toggleFollow()">${S.set.follow === 0 ? '⇕' : '⇳'}</button>` : '';
  el.innerHTML = `<span class="dot"></span><b>${esc(SPK.title)}</b>${st}
    <button onclick="spkStep(-1)" title="上一句">⏮</button>
    <button onclick="togglePause()">${SPK.pause ? '▶' : '⏸'}</button>
    <button onclick="spkStep(1)" title="下一句">⏭</button>${follow}
    <button onclick="sleepCycle()" title="${esc(sleepMsg(SLEEP.mins[SLEEP.mode] || 0))}" class="${SLEEP.mode ? 'on' : ''}">⏲${SLEEP.mode ? '<small>' + SLEEP.mins[SLEEP.mode] + '</small>' : ''}</button>
    <button onclick="stopSpeak()">✕</button>`;
}
function toggleFollow(){
  S.set.follow = S.set.follow === 0 ? 1 : 0; save(); drawBar();

  toast(S.set.follow ? '朗讀時自動捲動' : '不自動捲動，畫面由你控制');
}

/* ── 標示正在讀的那一句，並且捲到它 ── */
let SPK_LAST = [];
function spkClear(){
  document.querySelectorAll('.spk-now').forEach(e => e.classList.remove('spk-now'));
  SPK_LAST = [];
}
function spkMark(seg){
  if (!seg || !PL || !PL.lesson) return;
  if (R.tab !== 'course' || R.ch !== PL.lesson || R.sub !== 'lesson') return;  // 不在這一頁就不動畫面
  spkClear();
  const n = PL.lesson;
  const els = [];
  if (seg.js && seg.js.length){
    seg.js.forEach(j => {
      const e = document.querySelector(`.les .mks[data-k="l|${n}|${seg.i}|${seg.part}|${j}"]`);
      if (e) els.push(e);
    });
  }
  if (!els.length){
    const blk = document.getElementById(`lb${n}_${seg.i}`);
    if (blk) els.push(blk);
  }
  if (!els.length) return;
  /* 想更深是收起來的，讀到它就打開 */
  const dt = els[0].closest('details.deeper');
  if (dt && !dt.open) dt.open = true;
  els.forEach(e => e.classList.add('spk-now'));
  SPK_LAST = els;
  if (S.set.follow === 0) return;
  if (Date.now() < (SPK.holdScroll || 0)) return;      // 使用者剛剛自己捲過，先別搶
  SPK.autoScrolling = true;
  clearTimeout(SPK.asT);
  SPK.asT = setTimeout(() => { SPK.autoScrolling = false; }, 900);

}
/* 使用者自己動手捲動時，先讓畫面歸他，六秒後再接手 */
(function(){
  const hold = () => { if (SPK.on) SPK.holdScroll = Date.now() + 6000; };
  ['wheel', 'touchstart', 'touchmove', 'pointerdown'].forEach(ev =>
    window.addEventListener(ev, hold, { passive:true }));
  window.addEventListener('keydown', e => {
    if (/^(Arrow|Page)|^(Home|End|Space)$/.test(e.key || '')) hold();
  });
})();

/* ═══════ ② 畫線與領受 ═══════ */

function mkText(k){
  const p = k.split('|');
  if (p[0] === 'v'){
