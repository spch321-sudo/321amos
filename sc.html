<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#1F4D3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="阿摩司書講義">
<meta name="application-name" content="阿摩司書講義">
<meta name="description" content="阿摩司書講義：全書九章逐節原文解經、講章逐字稿、教學講章與321生命應用。">
<title>阿摩司書講義</title>
<link rel="manifest" id="MF" href="./manifest.webmanifest">
<style>
:root{
  --ink:#12181B; --paper:#EEF0EB; --card:#FFFFFF; --line:#D6DAD2;
  --pine:#1F4D3D; --pine2:#2E6B55; --brass:#9C6B18; --clay:#8C3A2E; --dusk:#54636B;
  --fs:17px; --r:14px;
  --hl-gold:rgba(156,107,24,.32);
  --hl-green:#CFE6CC; --hl-blue:#CFDFF4; --hl-pink:#F7D3DC; --hl-purple:#E3D5F1;
  --hl-maroon:#EBD0D0; --hl-brown:#E9D9BF; --hl-charcoal:#DBDAD4;
  --hb-green:#5E9E63; --hb-blue:#5583C7; --hb-pink:#DB7A90; --hb-purple:#9377C0;
  --hb-maroon:#8C4A4E; --hb-brown:#8A6740; --hb-charcoal:#54534E;
  --hl-now:#FFE9A8;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC",serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html[data-dark="1"]{
  --ink:#E8EDE9; --paper:#0E1412; --card:#161E1A; --line:#28332D;
  --pine:#7FBFA4; --pine2:#9BD3BA; --brass:#D6A250; --clay:#D98A78; --dusk:#93A29A;
  --hl-gold:rgba(214,162,80,.34);
  --hl-green:#22402A; --hl-blue:#1F3350; --hl-pink:#45222E; --hl-purple:#332A48;
  --hl-maroon:#3D2525; --hl-brown:#3B3020; --hl-charcoal:#34342F;
  --hb-green:#7BC28C; --hb-blue:#7FA0DE; --hb-pink:#E58FA0; --hb-purple:#A48AC9;
  --hb-maroon:#C08084; --hb-brown:#B99168; --hb-charcoal:#8E8D86;
  --hl-now:#4A3C16;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:var(--fs); line-height:1.85;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* ── 頁首 ── */
header.top{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
header .bar{display:flex;align-items:center;gap:8px;height:52px;max-width:720px;margin:0 auto;padding:0 12px}
header h1{font-family:var(--serif);font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{
  width:40px;height:40px;border:0;background:transparent;color:var(--ink);
  font-size:17px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.ico:active{background:var(--line)}
.ico.hide{display:none}
.ico.lang{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:0}
.ico.lang.on{color:var(--pine)}

/* ── 分頁 ── */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;border:0;background:transparent;color:var(--dusk);
  font-family:var(--sans);font-size:11px;padding:8px 0 7px;cursor:pointer;line-height:1.3;
}
nav.tabs button b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:1px}
nav.tabs button.on{color:var(--pine)}

/* ── 通用 ── */
.eyebrow{
  font-size:11px;letter-spacing:.22em;color:var(--dusk);
  margin:0 0 6px;text-transform:none;font-weight:600;
}
h2.big{font-family:var(--serif);font-size:25px;line-height:1.5;margin:0 0 14px;font-weight:700}
h3.sec{font-family:var(--serif);font-size:19px;margin:26px 0 10px;font-weight:700;color:var(--pine)}
.sect{padding:20px 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:12px 0;
}
.muted{color:var(--dusk)}
.sm{font-size:calc(var(--fs) * .82)}
.xs{font-size:calc(var(--fs) * .74)}
.btn{
  display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;
}
.btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .btn.pri{color:#0E1412}
.btn:active{transform:translateY(1px)}
.bigbtn{
  display:block;width:100%;text-align:left;background:var(--pine);color:#fff;
  border:0;border-radius:var(--r);padding:16px 18px;cursor:pointer;font:inherit;
}
html[data-dark="1"] .bigbtn{color:#0E1412}
.bigbtn small{display:block;font-size:12px;opacity:.82;letter-spacing:.1em}
.bigbtn b{display:block;font-family:var(--serif);font-size:19px;margin:5px 0 0;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  border:1px solid var(--line);background:var(--card);color:var(--dusk);
  border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;font:inherit;
}
.pill.on{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .pill.on{color:#0E1412}

/* ── 地形圖（招牌元素）── */
.terrain{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 6px;margin:6px 0 0}
.terrain svg{display:block;width:100%;height:auto}
.tlab{font-family:var(--mono);font-size:8.5px;fill:var(--dusk)}
.tlab.hi{fill:var(--brass);font-weight:700}
.tpath{fill:none;stroke:var(--pine);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tdot{fill:var(--brass)}
.tdot.low{fill:var(--clay)}
.tnow{fill:none;stroke:var(--ink);stroke-width:1.5}

/* ── 章清單 ── */
.chrow{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin:8px 0;cursor:pointer;font:inherit;color:inherit;
}
.chn{
  font-family:var(--mono);font-size:12px;color:var(--dusk);
  min-width:26px;padding-top:3px;letter-spacing:-.04em
}
.chrow b{font-family:var(--serif);font-size:17px;display:block;line-height:1.45}
.chrow .s{font-size:13px;color:var(--dusk);display:block;margin-top:2px;line-height:1.6}
.chrow .done{color:var(--pine);font-size:12px}

/* ── 經文 ── */
.vs{
  display:flex;gap:9px;padding:7px 0 7px 10px;border-left:2px solid transparent;
  cursor:pointer;align-items:flex-start;
}
.vs:active{background:var(--card)}
.vs.has{border-left-color:var(--pine)}
.vs.star{border-left-color:var(--brass);border-left-width:3px}
.vs.warn{border-left-color:var(--clay);border-left-width:3px}
.vn{font-family:var(--mono);font-size:11.5px;color:var(--dusk);min-width:20px;padding-top:5px;text-align:right}
.vt{flex:1;line-height:1.95}
.vs .flag{font-size:11px;color:var(--clay);margin-left:4px}

/* ── 六層 ── */
.layer{border-top:1px solid var(--line);padding:12px 0}
.layer:first-child{border-top:0}
.lh{
  display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;
  letter-spacing:.14em;color:var(--dusk);font-weight:600;user-select:none
}
.lh .n{font-family:var(--mono);color:var(--pine)}
.lh .caret{margin-left:auto;font-size:11px;opacity:.6}
.lb{margin-top:8px}
.lb.grk{font-family:var(--serif);font-size:16px;line-height:2.05;color:var(--pine)}
.lb.lit{font-family:var(--serif)}
.kw{
  display:inline-block;border:1px solid var(--line);border-radius:8px;
  padding:3px 9px;margin:3px 5px 3px 0;font-size:13px;cursor:pointer;background:var(--card)
}
.kw i{font-style:normal;font-family:var(--serif);color:var(--pine)}

/* ── 表 ── */
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--dusk);font-weight:600;font-size:12.5px}

/* ── 軌跡 ── */
.track{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.track .gk{font-family:var(--serif);font-size:22px;color:var(--pine)}
.stops{margin:12px 0 4px;padding-left:0;list-style:none}
.stop{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.stop .r{font-family:var(--mono);font-size:12px;min-width:44px;color:var(--dusk)}
.stop .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dusk);margin-top:6px}
.stop.dark .d{background:var(--clay)} .stop.light .d{background:var(--brass)}
.insight{border-left:3px solid var(--brass);padding:8px 0 8px 12px;margin:10px 0 0;font-family:var(--serif);font-size:16px}

/* ── 爭議 ── */
.iss{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.pos{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;font-size:14px}
.pos b{color:var(--pine)}
.consensus{background:rgba(156,107,24,.09);border-radius:10px;padding:11px;margin:10px 0;font-size:14px}
.say{border-left:3px solid var(--pine);padding-left:12px;margin:10px 0;font-family:var(--serif)}

/* ── 分級 ── */
.lv{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700;margin-right:6px}
.lv.g{background:rgba(31,77,61,.13);color:var(--pine)}
.lv.y{background:rgba(156,107,24,.16);color:var(--brass)}
.lv.r{background:rgba(140,58,46,.14);color:var(--clay)}

/* ── 打卡 ── */
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.box{
  width:21px;height:21px;border:1.5px solid var(--line);border-radius:6px;flex:0 0 auto;margin-top:3px;
  display:grid;place-items:center;font-size:13px;color:#fff
}
.chk.on .box{background:var(--pine);border-color:var(--pine)}
.chk.on .t{color:var(--dusk);text-decoration:line-through}
.chk .t{flex:1;font-size:15px;line-height:1.7}

/* ── 底部抽屜 ── */
.sheet{
  position:fixed;inset:0;z-index:90;background:rgba(10,16,14,.42);
  display:none;align-items:flex-end;
}
.sheet.on{display:flex}
.sheet .inner{
  background:var(--paper);width:100%;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:8px 18px calc(28px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h4{font-family:var(--serif);font-size:20px;margin:4px 0 2px}

/* ── 其他 ── */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;
  font-size:13.5px;z-index:120;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap
}
.toast.on{opacity:1}
.note{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:inherit;font:inherit;font-size:15px;padding:11px;min-height:88px;resize:vertical
}
.q{font-family:var(--serif);font-size:var(--fs);line-height:1.75;margin:0 0 4px}
.tip{font-size:calc(var(--fs) * .8);color:var(--dusk);background:rgba(31,77,61,.07);border-radius:9px;padding:9px 11px;margin-top:8px}
.blank i{font-style:normal;color:var(--clay);letter-spacing:.05em}

/* ── 教學講義逐字稿（長文閱讀）── */
.les p{font-family:var(--serif);font-size:var(--fs);line-height:1.95;margin:0 0 15px;text-align:justify}
.les h4{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.18);font-weight:700;color:var(--pine);
  margin:30px 0 12px;padding-top:14px;border-top:1px solid var(--line);scroll-margin-top:64px
}
.les h4:first-child{margin-top:6px;padding-top:0;border-top:0}
.les p.dec{color:var(--pine);font-weight:600;margin-bottom:9px}
/* 想更深：收起來的一問一答 */
.les details.deeper{
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:10px 13px;margin:0 0 16px
}
.les details.deeper summary{
  font-family:var(--serif);font-size:calc(var(--fs) * .92);line-height:1.65;color:var(--pine);
  font-weight:600;cursor:pointer;list-style:none
}
.les details.deeper summary::-webkit-details-marker{display:none}
.les details.deeper summary::before{content:"＋　";opacity:.6}
.les details.deeper[open] summary::before{content:"−　"}
.les details.deeper[open] summary{margin-bottom:8px}
.les .deeper-a p{font-size:calc(var(--fs) * .95);line-height:1.9;margin:0;color:var(--dusk)}
/* 三個化 */
.les p.t3s{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.06);font-weight:700;color:var(--pine);
  margin:26px 0 10px
}
.les p.t3t{font-family:var(--serif);font-size:calc(var(--fs) * .95);font-weight:700;color:var(--brass);margin:16px 0 6px}
.les p.t3m{
  font-size:calc(var(--fs) * .85);line-height:1.8;color:var(--dusk);background:rgba(31,77,61,.07);
  border-radius:11px;padding:10px 13px;margin:0 0 13px;text-align:left
}
.les p.t3n{margin:0 0 12px}
.toc button{
  display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;
  font-family:var(--serif);font-size:16px;line-height:1.6;padding:7px 0;cursor:pointer;
  border-bottom:1px solid var(--line)
}
.toc button:last-child{border-bottom:0}
.toc button:active{color:var(--pine)}
.hr{height:1px;background:var(--line);margin:22px 0}
.center{text-align:center}
a{color:var(--pine)}
.foot{padding:26px 0 8px;font-size:12px;color:var(--dusk);line-height:1.9}

/* ── 全螢幕模式（講台／小組）── */
.full{position:fixed;inset:0;z-index:200;background:var(--paper);display:none;flex-direction:column}
.full.on{display:flex}
html[data-tele="1"]{--paper:#0C1210;--ink:#EDF2EE;--card:#141C18;--line:#26332C;--dusk:#8FA098;--pine:#7FBFA4;--brass:#D9A94F;--clay:#D98A78}
.fbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.fbar .clock{font-family:var(--mono);font-size:15px;color:var(--dusk);letter-spacing:-.02em}
.fbar .clock.over{color:var(--clay)}
.fbar b{font-family:var(--serif);font-size:15px;flex:1;text-align:center}
.fbody{flex:1;overflow:auto;padding:22px 20px 30px;-webkit-overflow-scrolling:touch}
.ffoot{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.rail{height:3px;background:var(--line)}
.rail i{display:block;height:3px;background:var(--brass);width:0;transition:width .3s}
/* 提詞機 */
.tele p{font-size:calc(var(--fs) * 1.45);line-height:2.05;margin:0 0 20px;font-weight:600}
.tele .qq{font-family:var(--serif);color:var(--brass);border-left:3px solid var(--brass);padding-left:14px}
.tele h5{font-family:var(--serif);color:var(--pine);font-size:calc(var(--fs) * 1.1);margin:34px 0 18px;letter-spacing:.04em}
.tele .pause{color:var(--dusk);font-family:var(--mono);font-size:13px;letter-spacing:.2em;margin:26px 0;text-align:center}
.tele .pause b{color:var(--brass)}
/* 小組 */
.live h5{font-family:var(--serif);font-size:15px;color:var(--pine);letter-spacing:.1em;margin:0 0 18px}
.live .qq{font-family:var(--serif);font-size:calc(var(--fs) * 1.5);line-height:1.85;margin:0 0 20px}
.live .tipbox{background:rgba(156,107,24,.12);border-radius:12px;padding:14px;font-size:15px;line-height:1.8}
/* 搜尋 */
.sbox{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;font:inherit;font-size:16px;padding:12px 14px}
mark{background:rgba(156,107,24,.3);color:inherit;padding:0 2px;border-radius:3px}

/* ── 品牌與啟動畫面 ── */
.brand{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:block}
.brand.hide{display:none}
#splash{
  position:fixed;inset:0;z-index:300;background:#12305E;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:opacity .45s ease;
}
#splash.gone{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.4);margin-bottom:20px}
#splash h2{font-family:var(--serif);font-size:25px;margin:0;letter-spacing:.06em;font-weight:700}
#splash p{margin:4px 0 0;font-size:15px;opacity:.85;letter-spacing:.3em}
#splash small{margin-top:26px;font-size:11.5px;opacity:.55;letter-spacing:.16em}

/* ── 畫線與領受 ── */
.vs.hl .vt{background:linear-gradient(transparent 58%, rgba(156,107,24,.32) 58%)}
.mkw{margin:0 0 14px}
.mks{
  cursor:pointer;border-radius:5px;transition:background .12s;
  -webkit-tap-highlight-color:transparent;box-decoration-break:clone;-webkit-box-decoration-break:clone
}
.mks:active{background:var(--line)}
.mks.hl{background:linear-gradient(transparent 60%, var(--hl-gold) 60%)}
.mks.hl[data-c="green"]{background:linear-gradient(transparent 60%, var(--hl-green) 60%)}
.mks.hl[data-c="blue"]{background:linear-gradient(transparent 60%, var(--hl-blue) 60%)}
.mks.hl[data-c="pink"]{background:linear-gradient(transparent 60%, var(--hl-pink) 60%)}
.mks.hl[data-c="purple"]{background:linear-gradient(transparent 60%, var(--hl-purple) 60%)}
.mks.hl[data-c="maroon"]{background:linear-gradient(transparent 60%, var(--hl-maroon) 60%)}
.mks.hl[data-c="brown"]{background:linear-gradient(transparent 60%, var(--hl-brown) 60%)}
.mks.hl[data-c="charcoal"]{background:linear-gradient(transparent 60%, var(--hl-charcoal) 60%)}
/* 正在朗讀的那一句 */
.spk-now{
  background:var(--hl-now)!important;border-radius:4px;
  box-shadow:0 0 0 3px var(--hl-now);transition:background .2s
}
.les h4 .spk-now,.les details.deeper.spk-now{box-shadow:none}
.les details.deeper.spk-now{background:var(--hl-now)!important}
.mkp{cursor:pointer;border-radius:5px;transition:background .12s}
.mkp.hl{background:linear-gradient(transparent 62%, var(--hl-gold) 62%)}
.mkp.hl[data-c="green"]{background:linear-gradient(transparent 62%, var(--hl-green) 62%)}
.mkp.hl[data-c="blue"]{background:linear-gradient(transparent 62%, var(--hl-blue) 62%)}
.mkp.hl[data-c="pink"]{background:linear-gradient(transparent 62%, var(--hl-pink) 62%)}
.mkp.hl[data-c="purple"]{background:linear-gradient(transparent 62%, var(--hl-purple) 62%)}
.mkp.hl[data-c="maroon"]{background:linear-gradient(transparent 62%, var(--hl-maroon) 62%)}
.mkp.hl[data-c="brown"]{background:linear-gradient(transparent 62%, var(--hl-brown) 62%)}
.mkp.hl[data-c="charcoal"]{background:linear-gradient(transparent 62%, var(--hl-charcoal) 62%)}
.mknote{display:block}
.mknote{
  border-left:3px solid var(--brass);background:rgba(156,107,24,.08);
  border-radius:0 10px 10px 0;padding:10px 12px;margin:8px 0 12px;font-size:calc(var(--fs) * .85);line-height:1.8
}
.mknote[data-c="green"]{border-left-color:var(--hb-green)}

function bootReset(){
  try {
    if (window.caches) caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).then(go);

  } catch(e){ go(); }

    else location.reload(true);
  }
}

<script id="DATA" type="application/json">{"ch":[{"n":1,"t":"耶和華必從錫安吼叫","sub":"吼、火、四","lv":"A","arc":"審判列國","sec":[["1:1--2","牧人中的阿摩司：耶和華必從錫安吼叫"],["1:3--5","大馬士革：三番四次地犯罪"],["1:6--8","迦薩與非利士"],["1:9--10","泰爾：不記念弟兄的盟約"],["1:11--12","以東：永懷忿怒"],["1:13--15","亞捫：剖開孕婦"]],"serm":{"pts":[["神的吼聲","1:1--2","耶和華必從錫安吼叫"],["三番四次","1:3--8","三番四次地犯罪"],["不記念弟兄的盟約","1:9--15","並不記念弟兄的盟約"]]},"q":"你有沒有發現，我們最愛聽的，常常是別人的審判？親戚聚會裡，話題一轉到不在場的人，桌上特別熱鬧。阿摩司書第一章，先說了大馬士革、迦薩、泰爾、以東、亞捫，也就是以色列四周的鄰居。聽的人想必頻頻點頭。這一章要問：當神從錫安吼叫的時候，我聽見的是別人的罪，還是自己的心？","truth":"神從錫安吼叫，在地震之前先說話；祂數算鄰國對人的暴力與背棄，不免去她們的刑罰，而祂的眼睛先看見被賣、被追趕、被剖開的受傷之人；聽見祂聲音的人，要先回到自己，記得盟約，放下怒氣。","mv":{"t":"耶和華必從錫安吼叫，從耶路撒冷發聲","r":"摩1:2"},"card":["提哥亞牧人中的阿摩司，在猶大王烏西雅與以色列王耶羅波安的時代，大地震前二年，得到神的話。他說：神必從錫安吼叫，牧人的草場要悲哀，迦密的山頂要枯乾。接著，神用同一個格式說了五次：大馬士革以打糧食的鐵器打過基列，迦薩把眾民交給以東，泰爾不記念弟兄的盟約，以東拿刀追趕兄弟、永懷忿怒，亞捫剖開基列的孕婦、擴張自己的境界。神說：我必不免去她們的刑罰，我要降火。每一次，結尾都是同一句：這是耶和華說的。","「耶和華必從錫安吼叫，從耶路撒冷發聲」：神的吼聲，先於災難；神總是先開口。「三番四次」是希伯來文「滿到溢出來」的說法，不是讓我們去算次數；它讓我們看見神的忍耐有多長。經文先讓我們看見被賣走、被追趕、被剖開的人，然後才是審判。","耶穌快到耶路撒冷，看見城，就為它哀哭（路19:41）；在十字架上，祂說：父啊！赦免他們（路23:34）。那位從錫安發聲的神，在耶穌身上，成了眼淚與禱告；祂擔當了審判，好叫我們不被審判吞沒。祂也教我們：愛仇敵，為逼迫我們的人禱告（太5:44）。","無己是放下那種站在對的一邊、就可以痛快聽別人受審的心，也放下那份嘴上不提、心裡卻永遠保守的怒氣；回到本位，讓神作審判者，讓我作那位被祂等候、也被祂提醒要記得盟約的人。","「耶和華必從錫安吼叫，從耶路撒冷發聲」","這個星期，找出一個你一直假裝沒聽見的神的聲音，寫下來，對神說出口；再找出一個你說過「我會在」的人，用一個具體的行動，向他守住你的話。","最終整合：\n神從錫安吼叫，在地震之前先說話。\n祂說出五個鄰居的罪，一個一個，沒有漏掉。\n三番四次，是祂忍耐得很久。\n被賣的人，被追趕的人，被剖開的人，祂都看見。\n不記念弟兄的盟約，永懷忿怒的心，祂都記著。\n聽見祂聲音的人，先問自己，不先指著別人。\n讓耶穌作王，在我裡面，聽見，記得，放下。"],"self":"聽見神吼聲的定義：我不拿審判去指著別人，先問自己：我有沒有一個假裝沒聽見的聲音、一份被我忘記的盟約、一條不肯放下的怒氣；並且願意站在受傷的人身邊。","t321":{"k":"耶穌看見耶路撒冷就為它哀哭，在十字架上為不曉得的人求赦免；祂不是不看罪，而是帶著眼淚看罪，也親自擔當（摩1:2；路19:41；路23:34）。","g":"讓耶穌作王，就是讓祂的聲音比我的怒氣、我的痛快、我的藉口更大；我不再把審判握在自己手裡，也不再把弟兄之間的約拋在腦後（摩1:3、9、11）。","p":"屬神的體系，是一群聽見神聲音的人，記得彼此的盟約，不把審判掛在口上去指著別人，先陪伴、保護受傷的人（摩1:6、9、13）。"},"grp":["【一、破冰】你有沒有參加過一次聚會，話題轉到某位不在場的人身上，大家說得特別起勁？當時你的心裡，有什麼感覺？","【二、扎心】1:2神從錫安吼叫，牧人的草場悲哀。你生命裡，有沒有一個聲音，你已經聽了很久，卻一直假裝沒聽見？是什麼？","【三、經文】1:6、9、13看見被賣走的人、被交出去的人、被剖開的孕婦。神的眼睛先看見他們，這節經文怎樣安慰受過傷害的人？","【四、福音】耶穌看見耶路撒冷就為它哀哭，在十字架上說：父啊！赦免他們。這怎樣改變你面對「別人的罪」與「自己放不下的怒氣」的方式？","【五、行動】1:9泰爾「不記念弟兄的盟約」。這個星期，你要向哪一個人，守住你曾經說過的一句話？是什麼、你要怎麼做、告訴誰？"],"prac":{"main":"聽見神的聲音，記得盟約，放下怒氣","items":["對神：每天花三分鐘，安靜地說：主，祢若有一個聲音，是我一直假裝沒聽見的，求祢再說一次。","對自己：寫下一件你「不再提、卻一直放在心裡」的事，問：我是在放下它，還是在保守它？","對人：想一想，你曾經對誰說過「我會在」，這個星期，用一通電話、一則訊息或一次探訪，守住這句話。","對生活：這個星期，聽到有人批評不在場的人時，不跟著補一句；可以安靜，也可以換一個話題。","對使命：找出身邊一位受過傷害、被忽略的人，只陪伴，不評論，先聽他說，並問他：我可以怎樣幫你？"]},"safe":["① 錯誤講法：把1:3「三番四次」，講成神記著罪的次數，第三次還容忍，第四次就審判","正確理解：這是希伯來文「三加一」的說法，用來表示罪已經滿到溢出來；經文不是要我們去數是哪三條、哪四條，更不是給神的忍耐訂一個次數。","檢驗標準：會眾是更看見神忍耐得很久，還是更熱衷於算罪的次數？","② 錯誤講法：把1:3--15五個國家被審判，講成神偏袒以色列、替以色列報仇","正確理解：經文的罪名是暴力、買賣人口、背棄盟約、永懷忿怒，都是對人犯的罪；神的審判是因為祂看見受傷的人，不是因為國籍；且第二章要把同樣的格式，轉向猶大與以色列自己。","檢驗標準：會眾是更看見神公義地看每一個國家，還是更覺得「我們這邊」安全？","③ 錯誤講法：把大馬士革、迦薩、泰爾、亞捫等名字，套到今天某個城市、某個國家或某場戰事，說這是對現代的預言","正確理解：這裡是對當時那些城邦的審判；本講義不用阿摩司書去支持或反對任何現代國家、政黨或領袖，也不替任何人貼標籤。","檢驗標準：會眾是更貼近經文，還是更熱衷於用新聞去對照經文？","④ 錯誤講法：把1:2神的吼聲，講成一位只會發怒的神，用來恐嚇會眾","正確理解：吼聲在地震之前先說出來，是神先開口、先提醒；約珥書3:16同一句話後面，接的是「耶和華卻要作他百姓的避難所」。","檢驗標準：會眾聽完是更想回到神那裡，還是更怕神？","⑤ 錯誤講法：把1:3「必不免去她的刑罰」，講成神不給人悔改的機會，或神不憐憫","正確理解：這個「不使它轉回」是神對這些國家，在長久的忍耐之後說的話；經文沒有說悔改被拒絕，也不替神的憐憫設下界線；神的後悔與不後悔的題目，留給第七章與全卷議題。","檢驗標準：會眾是更敬畏神的公義，還是更誤會神的心？","⑥ 錯誤講法：只談神怎樣審判欺壓人的國家，卻不先看見被賣走、被追趕、被剖開的人","正確理解：1:6、9、11、13每一次的罪名，描寫的都是受傷的人；神的眼睛先看見他們；陪伴與保護受傷的人，優先於論斷欺壓人的人。","檢驗標準：受過傷害的人聽完，是被陪伴，還是被一堆審判的話淹沒？","⑦ 錯誤講法：斷定1:9「弟兄的盟約」確定就是某一份特定的條約","正確理解：原文只說「弟兄們的約」；有人讀為所羅門與希蘭的約，有人讀為一般友好關係，也有人讀為人與人之間本應有的情誼；經文沒有指明，我們不替它補上。","檢驗標準：會眾是更看見背棄承諾的嚴重，還是更急著替經文決定是哪一份條約？","⑧ 錯誤講法：用1:11「永懷忿怒」，催逼受傷的人立刻原諒，或說「放不下的人將被審判」","正確理解：這節話對的是拿刀追趕兄弟、毀壞憐憫的人；對受傷的人，先是「神看見」，而不是「你要馬上原諒」；放下，是一段需要神與同伴陪伴的路。","檢驗標準：正在流淚的人聽完，是被安慰，還是被催逼？","⑨ 錯誤講法：用1:13剖開孕婦的暴行，當作政治或社會議題的武器，或對曾經流產、墮胎的人製造罪咎","正確理解：這一節描寫的是戰爭中，用暴力擴張疆界的人所犯的罪；我們不把它套到任何現代議題上，也不用它去論斷正在傷痛的人；對失去孩子的人，先陪伴，不追問細節。","檢驗標準：經歷過喪失的人聽完，是被擁抱，還是被指責？","⑩ 錯誤講法：把1:1阿摩司是「牧人」，講成平信徒勝過受訓練的人，或貶低神學訓練與召命","正確理解：經文只說神把話交給提哥亞的牧人，是為了讓人看見：話是神的，不是人的資歷；神也使用受過訓練的人；這一節不分高低。","檢驗標準：會眾是更看見神話語的權柄，還是更分出職分的高低？","⑪ 錯誤講法：把1:1「大地震前二年」，講成可以推算的日期，或當作預言今日地震的根據","正確理解：地震在這裡只是一個時間的記號，後來的先知也還記得（亞14:5）；經文沒有說震了多大，本講義不推算任何日期。","檢驗標準：會眾是更看見神先說話，還是更熱衷於推算日子？","⑫ 錯誤講法：把1:4、7、10、12、14「降火」，講成神喜歡破壞，或把今日的災難直接解釋為「神的審判」","正確理解：火燒宮殿，燒的是暴力與權力的位置；經文是神對這些列國的話，不是我們用來解釋某場災難、某個人受苦的公式。","檢驗標準：受苦的人聽完，是被安慰，還是被暗示「你一定做錯了什麼」？"]},{"n":2,"t":"為銀子賣了義人","sub":"審、賣、記","lv":"A","arc":"審判列國與審判自己人","sec":[["2:1--3","摩押：將以東王的骸骨焚燒成灰"],["2:4--5","猶大：厭棄耶和華的訓誨"],["2:6--8","以色列：為銀子賣了義人"],["2:9--12","神的恩典：從埃及領上來，你們卻給拿細耳人酒喝"],["2:13--16","壓你們如同裝滿禾捆的車"]],"serm":{"pts":[["審判轉向自己人","2:1--5","三番四次地犯罪"],["為銀子賣了義人","2:6--8","為銀子賣了義人"],["我曾領你們上來","2:9--16","將你們從埃及地領上來"]]},"q":"如果有人在你面前，被標上一個價錢，你會看見嗎？更難的是：有沒有可能，我自己，也在不知不覺中，替人標過價？阿摩司書第二章，從摩押、猶大，一圈一圈，走到以色列。神說了一句很重的話：他們為銀子賣了義人，為一雙鞋賣了窮人。這一章問我們：我是不是記得，是誰把我領上來的？","truth":"神審判列國，也審判祂自己的百姓；以色列為銀子賣了義人、為一雙鞋賣了窮人，把敬拜的地方變成享用別人眼淚的地方，又不許神所興起的人說話；而神提醒他們，是祂除滅對手、將他們從埃及領上來，並興起先知與拿細耳人，所以勇士也無法自救。","mv":{"t":"為銀子賣了義人","r":"摩2:6"},"card":["耶和華說：摩押三番四次地犯罪，我必不免去她的刑罰，因為她把以東王的骸骨焚燒成灰；我要降火在摩押，燒滅加略的宮殿。猶大人也三番四次地犯罪，因為他們厭棄耶和華的訓誨，不遵守他的律例，被列祖所隨從虛假的偶像使他們走迷了；神要降火在猶大，燒滅耶路撒冷的宮殿。以色列人也三番四次地犯罪，因他們為銀子賣了義人，為一雙鞋賣了窮人；他們阻礙謙卑人的道路，父子同一個女子行淫，褻瀆神的聖名；又在各壇旁鋪人所當的衣服，在神的廟中喝受罰之人的酒。神說：我從以色列人面前除滅亞摩利人，將你們從埃及地領上來，在曠野引導你們四十年，又從你們子弟中興起先知與拿細耳人。你們卻給拿細耳人酒喝，囑咐先知不要說預言。神說：我必壓你們，如同裝滿禾捆的車壓物一樣；快跑的、有力的、剛勇的，都不能逃脫，勇士中最有膽量的，必赤身逃跑。這是耶和華說的。","「為銀子賣了義人，為一雙鞋賣了窮人」：公義的反面，是價格；一個人一旦被標上價錢，就從「人」變成了「東西」。神站在被賣的人這一邊，也把被傷害的人所受的羞辱，看為對自己聖名的褻瀆。","耶穌也是被標了價的義人：有人說，你們願意給我多少錢？他們就給了祂三十塊錢（太26:15）。我們不說阿摩司書預言了這件事，只說這使我們想起；而祂「義的代替不義的」（彼前3:18），祂本來富足，卻為我們成了貧窮（林後8:9），所以被標價的人，與替人標價的人，都有一條回到神面前的路。","無己是放下「這個人對我有沒有用」的算計，也放下我是神的百姓，所以不用被審的自義；回到本位，讓神作神、讓人作人，看每一個人都是神所造、所愛的人。","「我也將你們從埃及地領上來」","這個星期，找出一個你最近對他很冷淡、因為他「沒有用」的人，對他做一件具體的事；再把欠人的一件事（一句謝謝、一筆小錢、一個答應），在日落以前還清。","最終整合：\n神是列國的神，連死人的骸骨也記得。\n祂也審判自己的百姓，因為領受得多，責任也重。\n公義的反面，是價格。\n祂站在被賣的人這一邊。\n敬拜與公義，要一起活出來。\n祂曾將我們從埃及領上來。\n勇士無法自救，我們只能回到祂面前。\n耶穌是那位被標價的義人，也是我們的王。"],"self":"不替人標價的定義：我記得是神把我領上來的，所以我不用有沒有用來看一個人，也先陪伴被傷害的人，再問自己哪裡需要回轉。","t321":{"k":"耶穌是被標了價的義人，祂義的代替不義的，本來富足卻為我們成了貧窮；祂站在被賣的人這一邊，也為替人標價的人，開了一條回頭的路（摩2:6；彼前3:18；林後8:9）。","g":"讓耶穌作王，就是讓祂決定每一個人的價值，而不是我的算計；我不再用「有沒有用」看人，也記得我是被祂領上來的人（摩2:6，10）。","p":"屬神的體系是一群不替人標價的人：敬拜與公義一起活出來，先陪伴受傷的人，不點名論斷人，也彼此提醒：我們都是被神領上來的（摩2:7--8，10）。"},"grp":["【一、破冰】你有沒有一次，覺得自己被人當作「東西」來看，或因為沒有用而被忽略？請說出大概是哪一類場合，不必細節。","【二、扎心】2:6「為銀子賣了義人，為一雙鞋賣了窮人」。你有沒有在心裡，用「有沒有用」替某個人標過價？大概是誰？","【三、經文】2:8他們沒有停止敬拜，卻在神的廟中喝受罰之人的酒。這節怎樣提醒你：敬拜與生活，不能分開？","【四、福音】耶穌是被標了價的義人，也為我們成了貧窮。這怎樣改變你看那個「沒有用」的人？","【五、行動】2:10神說「我也將你們從埃及地領上來」。這個星期，你願意為誰做一件具體的事，把他當作人來對待？什麼時候做？"],"prac":{"main":"記得是神領我上來，不替人標價","items":["對神：每天一次，對神說：祢將我從奴隸之家領上來，我今天不替任何人標價。","對自己：寫下一個你最近覺得「沒有用」而冷淡的人，問：我這樣看他，是因為他是人，還是因為他對我有沒有用？","對人：把一件欠人的小事，在這個星期還清：一句謝謝、一筆小錢，或一個答應過的事。","對生活：這個星期從教會出去，對第一個遇見的人，停下來，看他的眼睛，說一句真誠的話。","對使命：在小組中，找出一位被忽略、被少算的人，這個月主動問他：我可以怎樣陪你？"]},"safe":["① 錯誤講法：把2:6--8講成社會革命的宣言，說教會只要走上街頭、改變制度，就是做了神的工","正確理解：阿摩司書的公義，出於認識神，不取代敬拜；神的審判先落在「賣人」的心上，也落在一個沒有同伴的人身上；本講義不把它當成社會革命手冊（對應全卷議題：阿摩司書是社會革命的宣言嗎？）。","檢驗標準：會眾是更認識神、更能愛人，還是只更會批評制度？","② 錯誤講法：把2:8「在他們神的廟中」講成神反對敬拜，教會不用聚會","正確理解：神不是說敬拜不好，而是敬拜的地方，成了享用別人眼淚的地方；敬拜與公義要一起活出來。","檢驗標準：會眾是更看見敬拜與生活不能分開，還是更輕看聚會？","③ 錯誤講法：把2:1的「三番四次」，算成第三次與第四次，或推論這個民族犯了幾次罪","正確理解：「三番四次」是語言上的「一次又一次、滿到溢出來」，不是數字，也不是帳本。","檢驗標準：會眾是更看見神的鄭重，還是更熱衷數字與計算？","④ 錯誤講法：把2:1--3摩押、2:4--5猶大的審判，套在今日某個國家、政黨或領袖身上","正確理解：這是對當時摩押與猶大說的話；本講義不替任何現代國家或政治立場背書，也不替任何人貼標籤。","檢驗標準：會眾是更敬畏神，還是更熱衷指認敵人？","⑤ 錯誤講法：把2:7「父子同一個女子行淫」，講成那位女子也有罪，或確定她是某一種身分","正確理解：經文沒有說她是誰，也沒有責備她；受傷害的人是被陪伴的對象，不是被審判的人；神把她所受的傷害，看為對自己聖名的褻瀆。","檢驗標準：受傷的人聽了，是被安慰，還是再次被責備？","⑥ 錯誤講法：用2:6去指名某位老闆、某間企業或某個行業，說他們就是「賣義人」的人","正確理解：經文是對以色列的審判；本講義不點名指責任何當代的人、企業或機構，只邀請我們先問自己：我有沒有替人標價？","檢驗標準：會眾是更向內看見自己，還是更急著向外指別人？","⑦ 錯誤講法：把2:13--16「到那日」，講成可推算的日期，或用來恐嚇會眾","正確理解：經文沒有給日期；神說這句話，是叫人今天就聽見、今天就轉身，不是叫人害怕世界。","檢驗標準：會眾是更愛主、更願意悔改，還是更恐慌？","⑧ 錯誤講法：把2:12「給拿細耳人酒喝」，講成基督徒不可碰酒的律法","正確理解：拿細耳人的願，是民數記六章的特別誓願，不喝酒是那個誓願的內容；經文的重點，是用誘惑讓神所興起的人破壞自己的分別。","檢驗標準：會眾是更看見神對祂所分別之人的看重，還是更多了一條新律法？","⑨ 錯誤講法：把2:4猶大「厭棄訓誨」，講成教會裡的人比世人更壞，或別的教會比我們更該受審判","正確理解：認識神越多，責任越重；這不是說神的百姓更壞，而是邀請我們先聽見神對我們說的話。","檢驗標準：會眾是更謙卑，還是更自義？","⑩ 錯誤講法：把2:9--10神除滅亞摩利人，講成神支持今日任何戰爭、佔領或驅逐","正確理解：這是以色列歷史中，神對那一個時代的作為，用來提醒他們：站在這片地上，是神的恩典；本講義不用它替任何現代的爭戰辯護。","檢驗標準：會眾是更記得神的恩典，還是更為某種武力找理由？","⑪ 錯誤講法：把2:12「囑咐先知說，不要說預言」，講成不同意牧者就是塞住先知的口，用來壓制不同意見","正確理解：經文說的是百姓對神所興起的人、神的話的態度；它不是讓人用「先知」的名義，拒絕被糾正，也不是叫人不許提問。","檢驗標準：會眾是更願意聽神的話，還是更不敢提問、更不被聽見？","⑫ 錯誤講法：把2:6的「窮人」「義人」，講成窮人都是義人，或貧窮本身就等於屬靈","正確理解：經文是說被賣的人，是沒有力量保護自己的人；它不是替貧窮貼上「更屬靈」的標籤，也沒有說所有貧窮的人沒有過錯，只說賣人是不對的。","檢驗標準：會眾是更看見每一個人的價值，還是只多了一種新的分類？"]},{"n":3,"t":"惟獨認識你們","sub":"認、同、說","lv":"A","arc":"先知的話","sec":[["3:1--2","我只認識你們；因此我必追討"],["3:3--8","七個「豈能」：因果與先知的不得不說"],["3:9--11","在外邦的宮殿中傳揚撒馬利亞的欺壓"],["3:12--15","牧人搶回兩條羊腿；拆毀象牙的房屋"]],"serm":{"pts":[["蒙揀選的責任","3:1--2","在地上萬族中，我只認識你們"],["豈能不說","3:3--8","主耶和華發命，誰能不說預言呢"],["欺壓與拆毀","3:9--15","不知道行正直的事"]]},"q":"如果有人告訴你：你是被神特別認識、特別揀選的人，你心裡會升起什麼？是安心，是驕傲，還是一點點不敢當？阿摩司書第三章，一開頭就說：「在地上萬族中，我只認識你們」，可是接著說，因此，我必追討。這一章問我們：被神這樣認識的人，要怎樣活？聽見了神的話，我們能不能不說？神的壇，能不能成為罪的避難所？","truth":"神從埃及領上來的百姓，是神惟獨認識的人，因此神不能對他們的罪視而不見；神說話，先知不能不說；那些以強暴搶奪、行欺壓的人，連祭壇與房屋，也保護不了他們。","mv":{"t":"在地上萬族中，我只認識你們","r":"摩3:2"},"card":["阿摩司書第三章，神對祂從埃及領上來的全家說：當聽耶和華攻擊你們的話，在地上萬族中，我只認識你們，因此，我必追討你們的一切罪孽。接著，阿摩司連問了好幾個田野裡的問題：二人若不同心，豈能同行？獅子若非抓食，豈能咆哮？城中若吹角，百姓豈不驚恐？主耶和華若不將奧祕指示他的僕人，就一無所行；獅子吼叫，誰不懼怕？主耶和華發命，誰能不說預言？然後，神請外邦的宮殿來看撒馬利亞的擾亂與欺壓，說，那些以強暴搶奪財物的人，不知道行正直的事。牧人從獅子口中搶回的，只有兩條羊腿，或半個耳朵。伯特利的壇角，必被砍下；過冬和過夏的房屋，象牙的房屋，都要歸無有。這是耶和華說的。","「在地上萬族中，我只認識你們」：被神認識，是恩典，也是託付；神追討，是因為愛得認真。「主耶和華發命，誰能不說預言呢」：真聽見了，就不能不說；神的話，總是先於神的手。","耶穌是好牧人，祂說：我認識我的羊，我的羊也認識我；祂為羊捨命，不是只帶回幾片碎片，而是把我們整個背回家。祂把從父所聽見的，都告訴我們，並且說：不要成就我的意思，只要成就你的意思。","無己是放下我是被揀選的、所以可以放心的特權感，也放下說真話會得罪人、不如不說的懼怕；先聽，再說，並且站在受傷的人這一邊。","「在地上萬族中，我只認識你們」","這個星期，每天花五分鐘，先聽神的話，再開口說話；並找一位你在乎的人，用溫柔的話，說一句真話，或對一位受傷的人說：我看見你，神也看見你。","最終整合：\n神把我們從埃及領上來，這是恩典。\n神說：我只認識你們，這是愛。\n因此，神必追討，這是愛得認真。\n神說了話，先知不能不說。\n神看見受欺壓的人，也不讓祭壇成為罪的避難所。\n房屋要歸無有，只有神是我們的倚靠。\n被神認識的人，要先聽，再說，也要保護受傷的人。"],"self":"被神認識的定義：我知道自己是被愛、被託付的人，所以我先聽神的話，說真實的話，也不拿敬拜與房屋，當作罪的避難所。","t321":{"k":"耶穌是好牧人，祂認識自己的羊，把從父所聽見的都告訴我們，並為羊捨命（摩3:2、7、12；約10:11、14；約15:15）。","g":"讓耶穌作王，就是讓祂決定我先聽什麼、說什麼、放下什麼；被揀選不是特權，是被託付（摩3:1--2、8）。","p":"屬神的體系，是一群先聽神、彼此同行、說真話，也保護受傷之人的人；我們不在祭壇前，掩蓋彼此的罪（摩3:3、9--10、13--14）。"},"grp":["【一、破冰】你有沒有一次，因為別人「更在乎你」，所以對你要求特別嚴？那時你的感覺是什麼？","【二、扎心】3:2神說：我只認識你們；因此，我必追討。你有沒有把「被神愛」，當成「不會被神管教」？是在哪一件事上？","【三、經文】3:8「主耶和華發命，誰能不說預言呢？」神有沒有對你說過一句話，是你一直沒有說出口的？","【四、福音】耶穌是好牧人，為羊捨命。祂不是只帶回碎片，而是把我們整個背回家。這怎樣安慰你？","【五、行動】這個星期，你願意先聽神的話五分鐘，並對一位誰，說一句溫柔而真實的話？"],"prac":{"main":"先聽神的話，說真實的話，陪伴受傷的人","items":["對神：這個星期每天花五分鐘，先安靜聽神的話，再開口禱告，並說一句：主，我願意聽。","對自己：寫下一件你一直沒有順服的事，問：我與神之間，有什麼地方，還沒有約好同行？","對人：找一位你在乎的人，用溫柔而真實的話，說一句神放在你心裡的話，不批評，只是見證。","對生活：檢查自己手上的一樣擁有（工作、收入、房子），問：它是怎麼來的？有沒有讓別人受傷？","對使命：找出一位正在被欺壓或受傷的人，先不解釋、不指責，對他說：我看見你，神也看見你。"]},"safe":["① 錯誤講法：把3:2「我只認識你們」，講成以色列人比別族更高等，或今日某一群信徒享有特權","正確理解：這個「認識」是立約的關係，帶來的是責任，不是優越；因此神才要追討。經文沒有把這句話，用來貶低任何民族。","檢驗標準：會眾聽完，是更看見自己被託付的責任，還是更覺得自己比別人高？","② 錯誤講法：把3:2「我必追討你們的一切罪孽」，講成神隨時準備懲罰、信徒應當活在恐慌裡","正確理解：這是對一群一再離開約的百姓說的話；神追討，是父親式的認真，不是暴君的恐嚇。這一章要帶人回到神面前，不是帶人逃離神。","檢驗標準：聽完的人，是更敢親近神，還是更怕神？","③ 錯誤講法：把3:3「二人若不同心，豈能同行」，講成婚姻、團隊或教會必須「意見一致」的口號","正確理解：原文的意思是「約定、約好」；經文談的是與神同行，需要神所定的約與人的順服，不是要求人人意見一致，更不是壓制不同的聲音。","檢驗標準：這句話是更幫助人順服神的約，還是被拿來要求別人服從？","④ 錯誤講法：把3:6「災禍若臨到一城，豈非耶和華所降的嗎」，講成今日每一場災難、疾病，都是神針對某人、某城的審判","正確理解：這是對神的約民，在先知警告之下的話；本講義不用它去解釋任何人的苦難。對受苦的人，先陪伴，不先解釋。","檢驗標準：受苦的人，是被安慰，還是被暗示「你一定做錯了什麼」？","⑤ 錯誤講法：把3:7主耶和華若不將奧祕指示他的僕人，就一無所行，講成可以預測神下一步行動的公式","正確理解：這一節說的，是神的本性：祂是說話的神，祂的話先於祂的手；它不是給人預測、算日子的根據，也不是在保證任何自稱先知的人都是真的。","檢驗標準：會眾是更認識一位說話的神，還是更熱衷預測與追逐「新啟示」？","⑥ 錯誤講法：把3:8「誰能不說預言」，講成每一位信徒都必須批判別人、揭露別人的罪","正確理解：經文說的是被神的話抓住的人不能不說；說的是神說過的話，用見證與真實，不是替神審判別人，也不是挑別人的錯。","檢驗標準：說話之後，是更多人看見神，還是更多人被傷害？","⑦ 錯誤講法：把3:9請外邦宮殿來看，講成可以拿來羞辱某個民族或國家，或拿來比較信徒與外邦人","正確理解：這一節的重點，是神的百姓把約的標準丟得太遠；經文不是在鼓勵外邦人，審判以色列人，也不是替任何國家或政權貼標籤。","檢驗標準：會眾是更看見自己需要悔改，還是更熱衷議論別人？","⑧ 錯誤講法：把3:10的「欺壓」，講成只是抽象的社會問題，卻忘了後面有一個一個受傷的人","正確理解：陪伴與保護受傷的人，優先於論斷欺壓人的人；神在這裡看見了，並且自己簽了名：這是耶和華說的。","檢驗標準：受過欺壓的人，聽完是被看見，還是又被要求原諒、要求忍耐？","⑨ 錯誤講法：把3:10--11講成「阿摩司書是社會革命手冊」，或拿它批判某個企業、某種制度","正確理解：神要的公義，出於認識神；本講義不用這章去支持或反對任何現代的政黨、政府或領袖，也不點名指責任何人。","檢驗標準：講完之後，是更認識神，還是更熱衷某一個立場？","⑩ 錯誤講法：把3:11的「敵人」，講成某一個確定的國家，或今日某一個政權","正確理解：經文沒有指名，也沒有說日子；本講義不推算，不套用到今日任何國家，只聽見神對當時百姓的呼召：今天就回頭。","檢驗標準：會眾是更願意悔改，還是更熱衷推算與政治？","⑪ 錯誤講法：把3:12「他們得救也不過如此」，講成「得救」是福音意義上的得救，或是對餘民的應許","正確理解：這裡的「得救」，是牧人搶回碎片作證據的意思，說的是審判之後所剩無幾；它不是在談靈魂得救。","檢驗標準：會眾是更認真看待神的警告，還是把一句審判的話，誤讀成安慰？","⑫ 錯誤講法：把3:12「躺臥在床角上」，講成舒服的生活、休息、擁有好東西，就是罪","正確理解：問題不在床，而在安逸使人聽不見獅子的吼叫；經文並沒有叫信徒拒絕休息與享受神所賜的。","檢驗標準：會眾是更警醒，還是更不敢休息、更內疚？","⑬ 錯誤講法：把3:14「壇角必被砍下」，講成敬拜與聚會本身是壞的，或教會的禮儀應當廢掉","正確理解：這一節針對的，是一邊行欺壓、一邊抓住壇角求平安的人；敬拜不能代替悔改，與5:21--24一起讀，兩面並陳。","檢驗標準：會眾是更真實地敬拜，還是更輕看敬拜？","⑭ 錯誤講法：把3:15拆毀「過冬和過夏的房屋、象牙的房屋」，講成擁有房子、財富就是有罪","正確理解：經文連在3:10「以強暴搶奪財物」之上；被追討的，是這些房屋的來歷，不是房屋本身。","檢驗標準：會眾是更誠實檢查自己所有的來歷，還是更羨慕或譴責別人的財富？","⑮ 錯誤講法：把3:1「當聽」，講成只要多聽就好，不必有任何行動","正確理解：聽，是整卷書的追蹤字；「聽」之後，是同行、是說、是悔改。這一章的聽，要帶出順服與生命。","檢驗標準：聽完之後，生活有沒有一件具體的改變？"]},{"n":4,"t":"你們仍不歸向我","sub":"母牛、五次、迎見","lv":"B","arc":"先知的話","sec":[["4:1--3","巴珊的母牛：欺負貧寒的，壓碎窮乏的"],["4:4--5","伯特利與吉甲：任你們去犯罪"],["4:6--11","五次災：你們仍不歸向我"],["4:12--13","你當預備迎見你的神"]],"serm":{"pts":[["巴珊的母牛","4:1--3","你們欺負貧寒的，壓碎窮乏的"],["仍不歸向我","4:4--11","你們仍不歸向我"],["預備迎見你的神","4:12--13","你當預備迎見你的神"]]},"q":"如果神一次又一次對你說話，用缺乏、用疲乏、用你不願意面對的事，你會停下來聽嗎？阿摩司書第四章，從撒馬利亞山上的人開始，一路走到伯特利的祭壇，再走到五次災之後的那一句話：你們仍不歸向我。這一章問我們：我在神面前這麼熱心，在人面前是什麼樣子？神一次又一次呼喚我，我有沒有回頭？","truth":"神看見被欺負、被壓碎的人，也一次又一次呼喚熱心敬拜卻不回頭的人；五次災之後，祂仍然說：你當預備迎見你的神，那位創山造風、也曉得人心思的耶和華，是我們要走向的主。","mv":{"t":"你當預備迎見你的神","r":"摩4:12"},"card":["撒馬利亞山上，有一群像巴珊母牛一樣過得安逸的人。他們欺負貧寒的，壓碎窮乏的，還對家主說：拿酒來，我們喝吧。神指著自己的聖潔起誓，他們必被拖走。接著，阿摩司說到伯特利與吉甲：祭物、十分之一、感謝祭、甘心祭，樣樣都有，卻是因為那是他們所喜愛的。然後，神一次又一次數著祂說過的話：缺糧、缺水、病蟲、瘟疫與刀劍、傾覆如所多瑪；每一次，結尾都是同一句：你們仍不歸向我。最後，神說：以色列啊，你當預備迎見你的神。那創山、造風、將心意指示人的，他的名是耶和華，萬軍之神。","「你們仍不歸向我」：這句話在這一章出現五次，每一次都沒有說「所以我不要你們了」。神每一次，都是在災難之後，再開口；這是一位不肯停止呼喚的神。","耶穌是那位預備好、走向我們的主。舊約裡，神五次呼喚，百姓沒有回頭；新約裡，神差來了自己的兒子，祂來到貧寒的、窮乏的人中間，也走到我們面前，邀請我們同祂坐席。我們要預備迎見的，不是一位遙遠的審判官，而是已經走過來的耶穌。","無己，是放下我在山上、我過得好是我應得的這種驕傲，也放下我怕承認、所以不敢回頭的懼怕。把自己的位置，交回給神；看見山腳下的人，也願意轉身。","「你當預備迎見你的神」","這個星期，找出一件神一直在叫你回頭、你卻仍然沒有回頭的事，誠實地說給神聽，也告訴一位同伴；再為身邊一位貧寒、軟弱的人，做一件具體的小事。","最終整合：\n山上的人，壓碎別人，喝自己的酒。\n神起誓，要為被欺負的人說話。\n祭物很多，卻是為了自己所喜愛的。\n五次災，五次呼喚。\n每一次，都是：你們仍不歸向我。\n最後，神說：你當預備迎見你的神。\n那位創山造風的主，是我們要走向的神。"],"self":"回頭的定義：我不等災難，也不等某個日子；今天就停下來，把神一直叫我轉的那一件事，說給祂聽，也願意看見身邊被壓碎的人。","t321":{"k":"耶穌來到貧寒、窮乏的人中間，也親自走向我們，迎見我們；祂不只叫人預備，祂自己走過來（摩4:1，12）。","g":"讓耶穌作王，就是讓祂決定我的敬拜，與我怎樣對待人，不再只做自己所喜愛的事（摩4:4--5）。","p":"屬神的體系，是一群肯回頭的人，也是一群看見貧寒的人、與他們站在一起的人；他們的敬拜，與生活連在一起（摩4:1，6--12）。"},"grp":["【一、破冰】你有沒有一次，是在缺乏、疲乏，或一件不順的事裡，才第一次停下來問：神要對我說什麼？請說一件。","【二、扎心】4:6--11神五次說：你們仍不歸向我。你覺得現在的你，有沒有一件事，神一直在叫你回頭，你卻仍然沒有？不必細節。","【三、經文】4:5說「因為是你們所喜愛的」。你的敬拜與奉獻，有哪一部分，其實是為了自己所喜愛的？","【四、福音】耶穌來到貧寒的人中間，也走到我們面前。這怎樣改變你對「預備迎見你的神」的感覺？","【五、行動】這個星期，你願意做哪一件具體的事：一是回頭，二是靠近一位貧寒軟弱的人？請說出時間與對象。"],"prac":{"main":"今天就回頭，也看見山腳下的人","items":["對神：找一個安靜的十分鐘，把神一直叫你回頭的那一件事，誠實地對祂說出來，說：主，我回來了。","對自己：寫下你上星期的敬拜或奉獻，問自己：這是為了神，還是為了我所喜愛的？","對人：找出身邊一位貧寒或軟弱的人，這個星期用一句話或一件小事，說：我看見你。","對生活：檢查你的錢、你的時間、你的話，有沒有一個地方，是靠著壓低別人才得到的？若有，這個星期處理一件。","對使命：在小組裡，邀請一位同伴，每週一次問你一句：你最近有沒有回頭？你有沒有看見需要的人？"]},"safe":["① 錯誤講法：把4:1「巴珊的母牛」講成貶低女性，或把罪全推給某一個性別","正確理解：這是一個比喻；解經者對指誰有不同看法，有人說是富有的婦女，有人說是整個安逸的上層。本講義不替任何一群人貼標籤，只守住經文給的事實。","檢驗標準：會眾聽完，是更看見被欺負的人，還是更輕視某一群人？","② 錯誤講法：把4:6--11五次災，講成每一場災難、每一次缺乏，都是神為某個人的罪所降","正確理解：這是神藉先知對那一群人所作的解釋；本講義不把它套用在今天任何一個受苦的人身上，面對受苦的人，先陪伴，不替他找原因。","檢驗標準：受苦的人，是被陪伴，還是被暗示「你一定做錯了什麼」？","③ 錯誤講法：把4:4--5講成阿摩司反對獻祭與敬拜","正確理解：阿摩司反對的，是沒有公義、沒有生命、只為自己所喜愛的敬拜；敬拜本身不是問題。第五章21至24節還要再把兩面講清楚。","檢驗標準：會眾聽完，是更不敢敬拜，還是更認真地讓敬拜與生活連在一起？","④ 錯誤講法：把阿摩司書第四章講成一份社會革命的宣言或企業批判","正確理解：神要的公義，出於認識神，不取代敬拜；這一章先說神看見貧寒的人，也先說神呼喚人回頭。","檢驗標準：會眾聽完，是更認識神，還是更熱衷批評別人？","⑤ 錯誤講法：把4:2「鉤子、魚鉤」的字義，講成確定的刑罰細節","正確理解：這些詞的字義不確定，有鉤子、盾牌、籃子、鍋等不同讀法；本講義只取共同點：被拖走、沒有尊嚴地被帶走，不補上細節。","檢驗標準：會眾是更貼近經文，還是更熱衷想像細節？","⑥ 錯誤講法：把「五次」講成一個計算神忍耐次數的公式，或推論「第幾次」之後神就不再給機會","正確理解：五次是神一次又一次呼喚的描寫；經文每一次都沒有說「所以我不要你們了」，不用來算日子，也不用來推論今天誰已被放棄。","檢驗標準：會眾是更看見神的忍耐，還是更焦慮地算次數？","⑦ 錯誤講法：把4:10「像在埃及一樣」或「少年人被殺」，講成神對某個國家、民族或戰爭的懲罰","正確理解：這是對那個時代北國說的話；本講義不用它去替今天任何一場戰爭、災難或政權作判斷。","檢驗標準：會眾是更悲憫受苦的人，還是更急著為災難下結論？","⑧ 錯誤講法：把4:12「預備迎見你的神」，講成末日的恐嚇，或套用為確定的末世時間表","正確理解：「預備」可以讀作最後的警告，也可以讀作最後的邀請；本講義兩面並陳，並指向今天就轉身，不算日子。","檢驗標準：會眾聽完，是更愛主、更想回頭，還是更恐慌、更怕世界？","⑨ 錯誤講法：把4:11「從火中抽出來的一根柴」，講成人什麼都不用做，神就一定救","正確理解：這是神救了、也仍然呼喚的畫面；被抽出來的恩典，並沒有取代「歸向我」的回應。","檢驗標準：會眾是更感恩、更願意回頭，還是更把恩典當成理所當然？","⑩ 錯誤講法：把4:13的頌詞，只講成神的大能嚇人，而不講祂認識人心、向人說話","正確理解：這位創山造風的神，也將心意指示人；祂大過一切，又靠近人心。敬畏不是恐慌，是認識祂之後願意向祂走去。","檢驗標準：會眾聽完，是更靠近神，還是更躲避神？"]},{"n":5,"t":"要尋求我，就必存活","sub":"哀、尋、水","lv":"A","arc":"先知的話","sec":[["5:1--3","哀歌：以色列民跌倒，不得再起"],["5:4--6","要尋求我，就必存活"],["5:7--13","把公平變為茵蔯的人"],["5:14--17","要求善，不要求惡"],["5:18--20","耶和華的日子是黑暗"],["5:21--24","我厭惡你們的節期；公平如大水滾滾"],["5:25--27","曠野四十年與被擄"]],"serm":{"pts":[["要尋求我","5:1--6","你們要尋求我，就必存活"],["耶和華的日子","5:7--20","想望耶和華日子來到的有禍了"],["公平如大水","5:21--27","惟願公平如大水滾滾"]]},"q":"如果有一天，你在路上看見一個人跌倒，身邊沒有人扶他，你會怎麼做？阿摩司書五章，是從一個倒在地上的人開始的：以色列民跌倒，不得再起，無人攙扶。更讓人意外的是，唱這首哀歌的，是神自己。這一章問我們三件事：我尋求的，是神自己，還是一個地方、一個節期？我盼望神來的時候，我今天的生活，經得起祂來嗎？我帶到神面前的敬拜，和我城門口的生活，是同一條河嗎？","truth":"神把審判唱成哀歌，又向倒下的人說：你們要尋求我，就必存活；祂厭惡沒有公平與公義的節期與歌聲，願公平如大水滾滾，使公義如江河滔滔。","mv":{"t":"你們要尋求我，就必存活","r":"摩5:4"},"card":["阿摩司說：以色列家啊，要聽我為你們所作的哀歌。以色列民跌倒，不得再起，躺在地上，無人攙扶。城發出一千兵的，只剩一百；發出一百的，只剩十個。然後，神向以色列家說：你們要尋求我，就必存活。不要往伯特利、吉甲、別是巴尋求；要尋求耶和華，就必存活。有人把公平變為茵蔯，把公義丟棄於地，怨恨在城門口說正直話的人，踐踏貧民，收受賄賂。神說：你們要求善，不要求惡，就必存活；要惡惡好善，在城門口秉公行義，或者，祂向約瑟的餘民施恩。想望耶和華日子的人有禍了，那日是黑暗，不是光明。神說：我厭惡你們的節期，我不聽你們彈琴的響聲；惟願公平如大水滾滾，使公義如江河滔滔。","「你們要尋求我，就必存活」：神的邀請，說了三次（4節、6節、14節）。生命不從地方來，不從節期來，是從尋求神自己來。這一章也讓我們看見：敬拜與公平，不是二選一；沒有公平的歌聲，神不聽；從敬拜長出來的公平，才是大水滾滾。","耶穌來，是為要尋找、拯救失喪的人（路19:10）。祂不只說：你們要尋求我；祂先來找我們。我們是那個倒在地上、無人攙扶的人，祂蹲下來，把我們扶起來。祂說：你們不肯到我這裡來得生命（約5:40）；祂自己，就是生命。","無己，是放下只要我去對地方、過對節期，就安全了的心，也放下「別人的苦，與我無關」的冷。無己的人，回到本位：讓神作神，把敬拜帶到城門口，把城門口帶進敬拜。","「惟願公平如大水滾滾，使公義如江河滔滔」","這個星期，先用十分鐘，不求任何事，只尋求神自己。再找出你自己的「城門口」（辦公桌、飯桌、一個群組），在那裡說一句真話，或伸出一隻手，扶起一個倒在地上的人。","最終整合：\n神把審判，唱成哀歌。\n祂向倒下的人說：你們要尋求我，就必存活。\n生命不在聖地，不在節期，在祂自己。\n盼望祂來的人，要先問：我今天的生活，經得起祂來嗎？\n沒有公平的歌聲，祂不聽。\n祂的心願，是公平如大水，公義如江河。\n讓敬拜與生活，成為同一條河。"],"self":"尋求神的定義：我不只尋求一個地方、一個節期，我尋求神自己；也讓我的敬拜，和我在城門口的生活，是同一條河。","t321":{"k":"耶穌來尋找、拯救失喪的人，也蹲下來扶起倒在地上的人；祂在城門口說真話，被人憎惡，仍然走到底（摩5:2，10；路19:10）。","g":"讓耶穌作王，就是讓祂決定我尋求什麼、盼望什麼：不是聖地與節期給我的安全感，而是祂自己；也讓我的敬拜與我的生活，同歸一位王（摩5:4，18--24）。","p":"屬神的體系，是一群尋求神自己的人，也是一群在自己的城門口，肯說真話、肯扶起倒下的人；歌聲與公平，同時在這裡流動（摩5:14--15，24）。"},"grp":["【一、破冰】你有沒有看過有人跌倒、卻沒有人扶的場面？當時你在哪裡，做了什麼，或沒有做什麼？","【二、扎心】5:5神說不要往聖地尋求。你有沒有一個「聖地」（一間教會、一個活動、一個習慣），是你很熟悉，卻沒有真的尋求到神的地方？","【三、經文】5:21--24神厭惡節期，又願公平如大水。這兩句話，怎樣一起讀，才不會變成「不要敬拜」，也不會變成「只要公義」？","【四、福音】耶穌是那位來尋找失喪的人、把倒下的人扶起來的神。你想到自己哪一個倒下的時刻，是祂扶起你的？","【五、行動】這個星期，你自己的「城門口」在哪裡？你可以在那裡說一句什麼真話，或伸出什麼手？請說出對象與時間。"],"prac":{"main":"尋求神自己，在城門口行公平","items":["對神：這個星期，用十分鐘，不求任何事，只對神說：我要尋求祢自己，祢是我的生命。","對自己：寫下你最近一次「去了聖地、卻沒有找到神」的經驗，並問：我在那裡，真正尋求的是什麼？","對人：找出一位最近倒下、沒有人扶的人（生病、失業、喪親、被冷落），這個星期用一通電話或一頓飯，陪他一次，不急著給道理。","對生活：選一個你每天都會經過的「城門口」（辦公桌、家人群組、鄰里），在那裡做一件「公平」的小事：說一句真話、不占人便宜、還一筆該還的錢。","對使命：崇拜前，問自己：我今天是從哪裡來到這裡的？有沒有一個人，是我需要先去和好的？再把這個問題，帶到小組分享。"]},"safe":["① 錯誤講法：把5:21--24講成神反對敬拜、聚會與詩歌，教會的節期不重要","正確理解：神厭惡的，是離開了公平與公義的敬拜；本章並陳兩面：神喜悅敬拜，也要敬拜與生活不斷線。","檢驗標準：會眾是更願意帶著完整的人來敬拜，還是更輕看敬拜？","② 錯誤講法：把5:24講成社會革命的口號，用公義取代福音與敬拜","正確理解：神要的公義，出於認識神，是敬拜長出來的果子；它不取代敬拜，也不是任何政治運動的標語。","檢驗標準：講完這段，會眾是更認識神，還是更熱衷某一個主張？","③ 錯誤講法：把5:18--20「耶和華的日子」講成末世時間表，用來推算日子","正確理解：阿摩司是對一群盼望神站在自己這邊的人說話，是叫人今天悔改；本講義不推算日子，也不排時間。","檢驗標準：會眾是更願意今天回頭，還是更熱衷推算與猜測？","④ 錯誤講法：把5:18「那日黑暗」講成神要恐嚇信徒，叫會眾活在懼怕裡","正確理解：這是對那些一邊盼望神、一邊壓人的人說的警告；本章的邀請，是「你們要尋求我，就必存活」。","檢驗標準：聽完以後，會眾是更愛主，還是更怕世界？","⑤ 錯誤講法：把5:4「尋求我，就必存活」講成：做得夠、求得夠，才配得生命","正確理解：這是神自己向倒下的人發出的邀請；福音是祂先來尋找（路19:10），不是我們靠尋求賺得生命。","檢驗標準：疲乏的人是更願意走向神，還是更覺得自己不夠格？","⑥ 錯誤講法：把5:5「不要往伯特利、吉甲尋求」講成：不可去教會、不可去聖地、不可參加聚會","正確理解：這些地方本來是有故事的聖地，問題在於人把「地方」放在了神的前面；本節問的是心裡尋求的對象。","檢驗標準：會眾是更尋求神自己，還是更看輕聚會？","⑦ 錯誤講法：把5:13「通達人靜默不言」講成：因為害怕而不敢開口的人是有罪的，或是稱讚沉默","正確理解：本節是描寫一個說真話會受罰的處境；各家的讀法不同，但本講義不責備受威脅而不敢開口的人，也不稱讚沉默。","檢驗標準：處境困難的人，是被陪伴，還是被定罪？","⑧ 錯誤講法：把5:15「或者」講成：神的恩典不確定，信徒沒有確據","正確理解：「或者」是在說恩典是神自由的施予，不是人可以討價還價的合約；福音的確據，建立在基督已經成就的事上。","檢驗標準：會眾是更依靠神自己的恩典，還是更不安？","⑨ 錯誤講法：把5:11--12講成：擁有房子、經商、有錢，本身就是罪","正確理解：神指責的，是用欺壓貧民、收受賄賂、屈枉人換來的所得；不是有房子、有產業本身。","檢驗標準：會眾是更看見受欺壓的人，還是更攻擊有產業的人？","⑩ 錯誤講法：把5:2「處女以色列」講成談性、貞潔，或對女性的評論","正確理解：這是一個詩意的稱呼，指一個本來有大好前程、卻倒下的民族；重點是「無人攙扶」的痛。","檢驗標準：講完這節，會眾是更心疼倒下的人，還是更議論別人？","⑪ 錯誤講法：把5:3「一千剩一百」講成確定的人口計算，或預測今日的任何事件","正確理解：數字是形象，是在說失去之重；本講義不拿它推算任何事。","檢驗標準：會眾是更為受苦的人哀哭，還是更熱衷算數字？","⑫ 錯誤講法：把5:26、5:27講成確定指向某一個神明、某一個國家，或拿來論斷今日任何國家與民族","正確理解：經文的神名讀法有爭論，司提反在徒7:42--43有自己的引用；本講義照新約自己的引用來說，不另外延伸。","檢驗標準：會眾是更看見「人造出自己的神」的危險，還是更定別人的罪？","⑬ 錯誤講法：用本章點名指責當代的講員、教會、企業或政府；或先論斷欺壓人的人，卻沒有陪伴受傷的人","正確理解：本章先為倒下的人哀哭；陪伴與保護受傷的人，優先於論斷欺壓人的人；本講義不點名任何人。","檢驗標準：受傷的人，是先被安慰，還是先被拿來當作論點？"]},{"n":6,"t":"在錫安安逸的有禍了","sub":"安、逸、首","lv":"B","arc":"先知的話","sec":[["6:1--3","在錫安和撒馬利亞山安逸無慮的"],["6:4--7","躺臥在象牙床上：不為約瑟的苦難擔憂"],["6:8--11","我憎惡雅各的榮華"],["6:12--14","把公平變為苦膽"]],"serm":{"pts":[["安逸無慮","6:1--3","安逸無慮的，有禍了"],["不為約瑟的苦難擔憂","6:4--7","卻不為約瑟的苦難擔憂"],["公平變為苦膽","6:8--14","使公平變為苦膽"]]},"q":"你上一次為別人的痛，真的難過，是什麼時候？阿摩司書六章，是先知對一群過得很舒服的人說的話。他們有床、有肉、有酒、有歌，沒有一件是罪名；神卻先為他們哀哭。這一章問我們：我的安逸，是讓我更愛神，還是讓我的心睡著了？我還能不能被別人的痛碰到？","truth":"神先為安逸的人哀哭：他們倚靠自己的山，不為約瑟的苦難擔憂，把公平變為苦膽；神指著自己起誓，必拆掉他們所倚靠的，好叫還聽得見的人，趁早醒來。","mv":{"t":"卻不為約瑟的苦難擔憂","r":"摩6:6"},"card":["先知對錫安與撒馬利亞山上、被人歸向的人說：安逸無慮的，有禍了。他們以為災禍還遠，坐在位上行強暴；躺在象牙床上，吃羊羔、喝酒、抹油、彈琴，卻不為約瑟的苦難擔憂。神指著自己起誓：我憎惡雅各的榮華，必將城交付敵人。剩下的人，連耶和華的名，也不敢提。他們把公平變成苦膽，喜愛虛浮的事，自誇憑自己的力量取了角。神說：我必興起一國攻擊你們，從哈馬口直到亞拉巴的河。","「卻不為約瑟的苦難擔憂」：這一章沒有一個享受是罪名，神哀哭的，是一顆不再被別人的痛碰到的心。先知先說「有禍了」，是在替他們哭，不是在咒詛。","耶穌不是躺在象牙床上的主。祂為耶路撒冷哀哭（路19:41），為拉撒路哭了（約11:35），看見困苦流離的人就憐憫（太9:36）。祂本來富足，卻為我們成了貧窮（林後8:9）；祂的心，一直是醒著的。","無己，是放下我有位子、有山所以不會有事的安全感，也放下「別人的痛與我無關」的距離；讓自己的享受，變成一個能為別人流淚、為別人開門的出口。","「使公平變為苦膽」","這個星期，找一個正在痛的人，打一通電話或傳一句話，不給建議，只是聽；再問自己一次：我坐的位子，我有沒有用它保護人？","最終整合：\n神先為安逸的人哀哭。\n他們靠的是山，不是耶和華。\n他們享受的，沒有一樣是罪名。\n但他們的心，不再被別人的痛碰到。\n神指著自己起誓：我憎惡雅各的榮華。\n公平變成苦膽，是人的回答。\n耶穌的心是醒著的，祂為我們的破碎，付上自己。"],"self":"醒著的安逸的定義：我享受神所賜的，也讓我的心，還能被別人的痛碰到，並且不倚靠自己的山。","t321":{"k":"耶穌在安穩與痛苦之間，從不麻木：祂為城哀哭、為朋友流淚、憐憫困苦流離的人（路19:41；約11:35；太9:36）。","g":"讓耶穌作王，就是讓祂決定我的安全感放在哪裡：不在我的山、我的位子、我的成績，單單在祂（摩6:1，8，13）。","p":"屬神的體系，是一群享受恩典、也為彼此的破碎同哭的人；公平與公義，從認識神長出甜果，不被安逸翻成苦膽（摩6:6，12）。"},"grp":["【一、破冰】最近一次，你吃到很好吃的一餐、或過了很舒服的一天，是什麼時候？那時你有沒有想到別人？","【二、扎心】6:6「卻不為約瑟的苦難擔憂」。你最近有沒有一件別人正在痛、而你已經很久沒有被觸動的事？請說出一個，不必細節。","【三、經文】6:8神指著自己起誓，說祂憎惡雅各的榮華。你覺得神憎惡的，是人，還是人所倚靠的東西？為什麼？","【四、福音】耶穌為城哀哭，為朋友流淚，卻不躺在象牙床上。這怎樣改變你面對自己安逸與麻木的方式？","【五、行動】這個星期，你可以向哪一位正在痛的人，說一句「我想到你」？你願意怎樣開始、告訴誰？"],"prac":{"main":"讓心醒著，與正在痛的人同哭","items":["對神：每天睡前一分鐘，對神說：主，我最近有哪裡睡著了？求祢醫治我的麻木。","對自己：寫下三樣你最倚靠的「山」（位子、名聲、存款、人脈），問自己：若沒有這些，我還剩下什麼？","對人：找一位正在痛的人，打一通電話或傳一句話，不給建議，只是聽；說：我想到你，你還好嗎？","對生活：這個星期，把一次享受（一餐、一場娛樂）的一部分，留給一個需要的人。","對使命：在小組中，找出一件被忽略的人的需要，與一位同伴商量，這個月先做一件小事。"]},"safe":["① 錯誤講法：把阿摩司書六章講成「享受就是罪、貧窮才屬靈」","正確理解：經文沒有說床、肉、酒、琴本身有罪；神哀哭的是麻木的心與倚靠自己的山，不是享受。","檢驗標準：會眾是更能感恩地享受、並醒著，還是更不敢享受、或更論斷別人的生活？","② 錯誤講法：把這一章講成對有錢人、企業或執政者的批判大會","正確理解：公義出於認識神，不取代敬拜，也不是一套制度或一場運動；本章是每一個坐在位子上的人，都要安靜問自己。","檢驗標準：會眾是更看自己的位子，還是更急著指責別人的位子？","③ 錯誤講法：用6:1「有禍了」去咒詛或嚇唬人","正確理解：「有禍了」原是哀號，先知是在為他們哭；神先哀哭，才宣告審判。","檢驗標準：會眾讀完是更看見神的心腸，還是更怕神、更怕世界？","④ 錯誤講法：把6:2的甲尼、哈馬、迦特，講成一份確定的歷史時間表或預言","正確理解：這一節可讀為警告或譏諷，解經家看法不一；本講義不推算日子，只讀出「被揀選不是免死金牌」。","檢驗標準：會眾是更謙卑，還是更熱衷推算？","⑤ 錯誤講法：把6:8的審判，套用到今日某個國家、城市、政權或事件","正確理解：經文對象是當時的雅各家；我們不點名任何當代的國家、政黨或領袖。","檢驗標準：會眾是更敬畏神，還是更熱衷政治定罪？","⑥ 錯誤講法：用6:9--10的屍首與沉默，去解釋今日某場災難，或對喪慟的人說「這是審判」","正確理解：這是對當時的警告，不是對今日任何受害者的解釋；對受傷的人，陪伴與保護優先。","檢驗標準：喪慟的人是被陪伴，還是被論斷？","⑦ 錯誤講法：把6:10「不可提耶和華的名」，講成確定是某一種心態（迷信、不信、害怕）","正確理解：經文沒有解釋原因，解經家有三種以上的讀法；本講義陳列各家，不替說話的人定論。","檢驗標準：會眾是更貼近經文，還是更急著填補沒有說的話？","⑧ 錯誤講法：把6:12的公平與公義，講成只要努力做社會公義就是敬拜神","正確理解：五章21至24節兩面並陳：神厭惡沒有生命與公義的敬拜，也沒有叫人不敬拜；公義是從認識神長出的果子。","檢驗標準：會眾是更愛神、更愛人，還是只剩下行動，或只剩下儀式？","⑨ 錯誤講法：把6:13「取了角」，講成確定是地名雙關的唯一讀法","正確理解：「羅底巴」與「加寧」的雙關是可能的背景，學者看法不一；即使不當地名，意思仍是「靠自己得勢的自誇」。","檢驗標準：會眾是更看見自誇的危險，還是只在爭論地名？","⑩ 錯誤講法：把這一章的審判，講成神喜歡毀滅、不在乎百姓","正確理解：神先哀哭、先警告，憎惡的是人所倚靠的榮華與驕傲，不是人；全卷的盼望，在九章仍有歸回。","檢驗標準：會眾是更信靠神的公義與憐憫，還是更誤解祂的性情？"]},{"n":7,"t":"準繩","sub":"蝗、火、繩","lv":"A","arc":"五個異象與衝突","sec":[["7:1--3","蝗蟲：求你赦免；耶和華就後悔"],["7:4--6","火：求你止息；耶和華就後悔"],["7:7--9","準繩：我必不再寬恕他們"],["7:10--13","亞瑪謝：不要在伯特利再說預言"],["7:14--17","我原不是先知；耶和華選召我"]],"serm":{"pts":[["求你赦免","7:1--6","主耶和華啊，求你赦免"],["準繩","7:7--9","看見準繩"],["耶和華選召我","7:10--17","耶和華選召我"]]},"q":"如果有一天，你看見你所愛的人，正走向一個很大的災禍，你會對神說什麼？如果有一天，有人要你不要再說你相信是神交給你的話，你會怎麼回答？阿摩司書第七章，就是這兩個問題的現場。前半章，阿摩司看見蝗蟲與火，兩次對神說：求你。後半章，他被一位祭司趕出伯特利，只回了一句：耶和華選召我。中間，是一條垂下來的準繩。這一章問我們：我是不是一個肯為人代求、肯站在準繩旁邊、肯聽神話語的人？","truth":"阿摩司兩次為微弱的雅各代求，神兩次免了災；第三個異象，主手拿準繩量以色列，不再寬恕；伯特利祭司亞瑪謝要他閉口，他回答：我不是靠這個糊口，是耶和華選召我，祭司也要聽耶和華的話。","mv":{"t":"耶和華選召我，使我不跟從羊群，對我說","r":"摩7:15"},"card":["主耶和華指示阿摩司三件事。第一，蝗蟲吃盡青物，他說：主耶和華啊，求你赦免，雅各微弱，他怎能站立得住呢？耶和華就後悔，這災可以免了。第二，火吞滅深淵，他說：求你止息，雅各微弱，神又後悔，這災也可免了。第三，主手拿準繩站在牆上，說：我要吊起準繩在我民以色列中，我必不再寬恕他們；邱壇聖所要荒廢，我必興起攻擊耶羅波安的家。伯特利祭司亞瑪謝向王告阿摩司圖謀背叛，又對阿摩司說：你這先見哪，逃往猶大去吧，不要在伯特利再說預言。阿摩司回答：我原不是先知，也不是先知的門徒，我是牧人，又是修理桑樹的；耶和華選召我，叫我去向祂的民說預言。亞瑪謝啊，現在你要聽耶和華的話。","「雅各微弱，他怎能站立得住呢」：阿摩司兩次禱告的理由，一個字都沒有換。他不誇雅各的好處，只說雅各小。「準繩」也是神手上的，不是我們手上的。「不要向以撒家滴下預言」是亞瑪謝說的；他向王轉述時，把「耶和華說」改成了「阿摩司說」。","耶穌是真正站在牆上的主，也是現今在神右邊替我們祈求的那位（羅8:34）。祂在客西馬尼園說：不要照我的意思，只要照你的意思（太26:39）。祂是我們的榜樣，也是我們的代求者。我們站在準繩面前，不靠自己站得住，靠祂。","無己，是放下兩件事：一是用自己的尺量自己、也量別人；二是把神的話收進自己的口袋，只留合意的。有己的人，要嘛在準繩面前找藉口，要嘛把話變小；無己的人，承認自己微弱，把標準交回神的手上，也肯聽祂的話。","「耶和華選召我，使我不跟從羊群，對我說」","這個星期，為一個你很擔心的人，用最短的話禱告：主啊，他很小，我也是，求祢憐憫。再選一個你很想改寫、很想縮小的神的話，今天不改，只是安靜地聽它。","最終整合：\n主耶和華指示：蝗蟲，火，準繩。\n阿摩司說：求你，雅各微弱。\n神說：這災可以免了。\n主手拿準繩：我必不再寬恕。\n祭司說：不要再說預言。\n牧人說：耶和華選召我。\n祭司啊，現在你要聽耶和華的話。"],"self":"站在準繩旁邊的定義：我肯為微弱的人代求，肯讓神手中的標準量我，也肯聽祂的話，不把它收小。","t321":{"k":"耶穌是站在牆上的主，也是在神右邊替我們祈求的代求者；祂在客西馬尼園說，照你的意思，不照我的意思（摩7:1--9；羅8:34；太26:39）。","g":"讓耶穌作王，就是讓祂的準繩，而不是我的尺、也不是別人的眼光，來量我；也讓祂的話，不被我收進口袋（摩7:7--8，16）。","p":"屬神的體系，是一群肯為微弱的人代求的人，也是一群肯聽神話語、不把聖所變成為任何權力服務的人；召命在神，不在背景（摩7:2，13--15）。"},"grp":["【一、破冰】你有沒有為一個人禱告很久了？不必說細節，只說那是哪一類關係，例如孩子、父母、朋友。","【二、扎心】7:2，阿摩司的理由是雅各微弱。你向神禱告的時候，習慣先說自己多好，還是先說自己多小？為什麼？","【三、經文】7:8，主說：我要吊起準繩在我民以色列中。這個畫面，讓你覺得害怕、安心，還是兩者都有？","【四、福音】耶穌是站在牆上的主，也是在神右邊替我們祈求的那位。這怎樣改變你站在準繩面前的心情？","【五、行動】7:16，亞瑪謝也要聽。這個星期，有哪一句神的話，你一直想把它縮小、改寫，或者避開？你願意怎樣把它放回桌面上？"],"prac":{"main":"為微弱的人代求，站在準繩旁邊，聽神的話","items":["對神：每天用一分鐘，為一個你擔心的人禱告，只說：主啊，他很小，我也是，求祢憐憫。連續七天。","對自己：寫下一件你最近用自己的尺量自己或量別人的事，對神說：主啊，祢的準繩怎麼說？","對人：找一位你信任的同伴，說：請你這個星期問我一句：你最近有沒有把神的話收小？","對生活：找出一件你一直拖著不肯面對的事，今天花十分鐘，把它放在神面前，只問：祢要我怎麼做。","對使命：向一位從事看似不起眼工作的人，說一句具體的謝謝，並告訴他：神看見你。"]},"safe":["① 錯誤講法：把7:3，6神「後悔」，講成只要禱告得夠懇切，神就一定會改變、災就一定會止","正確理解：經文記下的是這兩次，不是立一條保證；同一卷書裡，也有災臨到而百姓沒有回頭的時候。禱告不是操縱神的工具，是向有位格的神說話。","檢驗標準：會眾是更願意向神說話，還是更把禱告當成換取結果的技巧？","② 錯誤講法：把7:3，6的「後悔」，講成神心意不定、不可靠，或講成神其實不知道後果","正確理解：「後悔」是舊約描寫神回應人的語言；聖經也說神不是人。本講義不拆開兩面，也不替神的內心下結論，只讀神聽見、神回應。","檢驗標準：會眾是更信靠這位聽禱告的神，還是更懷疑祂的信實？","③ 錯誤講法：把7:7--8的準繩，講成神拿著標準在等人犯錯、專門恐嚇會眾","正確理解：準繩是量「我民」的；前面有兩次免災，神的耐心是真的；這個畫面要使人今天就悔改、轉回，不是使人恐慌。","檢驗標準：聽完的人是更靠近神，還是更躲著神？","④ 錯誤講法：把7:8沒有記載阿摩司代求，講成神禁止再為人禱告","正確理解：經文只說「我必不再寬恕」，並沒有說禁止禱告；這一次異象裡只是沒有記下代求。","檢驗標準：會眾是更不敢禱告，還是更清楚神的耐心有界線、也更願意悔改？","⑤ 錯誤講法：把7:7的牆與準繩，講成對應某個年代、某個國家或今日某件時事","正確理解：本講義不推算日子，也不把它套在今日任何政權、政黨或領袖上；牆指向神所建立的以色列，我們只讀經文所說。","檢驗標準：會眾是更看見神的準繩在自己身上，還是更熱衷找別人的歪？","⑥ 錯誤講法：把亞瑪謝，講成今日某位講員、某間教會或某個政府的標籤","正確理解：亞瑪謝是一個具體的人，在一個具體的體系裡，本講義不替他貼標籤，也不點名指責當代任何人；我們只用他來問自己：我有沒有把神的話變小。","檢驗標準：講完之後，會眾是更看見自己的口袋，還是更指著別人的口袋？","⑦ 錯誤講法：把阿摩司書第七章，講成反對一切權威、反對任何體制，或社會革命手冊","正確理解：阿摩司沒有結黨、沒有拿起武器，他只是照神給他看的說出來；神要的公義，出於認識神，不取代敬拜，也不是推翻誰。","檢驗標準：聽完的人是更敬畏神、更願意聽神的話，還是更想用經文去對抗某個人？","⑧ 錯誤講法：把7:14「我原不是先知，也不是先知的門徒」，講成神學訓練與裝備不重要","正確理解：這句話是回答「靠說預言糊口」的指控；先知的門徒也是神的百姓，神也用他們。召命在神，不在背景，也不貶低裝備。","檢驗標準：受過訓練的人是被貶低，還是被提醒：裝備不是自己的本錢？","⑨ 錯誤講法：把7:14，講成越沒資格、越軟弱的人越被神用，或把軟弱浪漫化","正確理解：神選召牧人，不是因為牧人不起眼，而是因為神要選召；召命的重心是「誰叫的」，不是「誰被叫」。","檢驗標準：沒有背景的人是更知道自己有分，還是更把自己的軟弱當成資格？","⑩ 錯誤講法：把7:17妻子作妓女、兒女倒在刀下，講成這些人自己有罪，或講成今日受暴、受戰亂之苦的人活該","正確理解：這是對亞瑪謝說的審判話，不是對受苦的妻兒說的；經文沒有說她們有罪。戰亂與暴力裡最先受傷的，常是最沒有權力的人，陪伴受傷的人優先於論斷。","檢驗標準：受過傷的人聽完，是更感覺被陪伴，還是更覺得自己有罪、被責備？","⑪ 錯誤講法：把7:16--17的審判話，講成確定的歷史時間表，或用來推算神何時審判","正確理解：經文沒有說日期；本講義不算日子，只是叫人今天就聽、就悔改。","檢驗標準：會眾是更願意今天回應神的話，還是更熱衷推算與討論？","⑫ 錯誤講法：把7:16的「聽耶和華的話」，講成要聽從講員、領袖或某個教會的權柄","正確理解：這個「聽」，是聽「耶和華的話」，是連祭司也要聽的那一位的話；不是叫人順服某個講的人。","檢驗標準：會眾是更低頭聽神，還是更依賴某個人？","⑬ 錯誤講法：把7:12亞瑪謝所說的「糊口」，講成傳道人領生活費、全職事奉是不屬靈的","正確理解：這是亞瑪謝的指控，不是聖經對事奉者生活費的教導；阿摩司在這裡只是回答「我的呼召不是出於謀生」。","檢驗標準：事奉者與會眾是更看見召命的來源，還是更互相懷疑動機？"]},{"n":8,"t":"一筐夏天的果子","sub":"果、貪、飢","lv":"B","arc":"五個異象與衝突","sec":[["8:1--3","一筐夏天的果子：結局到了"],["8:4--6","吞吃窮乏人：用一雙鞋換窮乏人"],["8:7--10","我必永遠不忘；節期變為悲哀"],["8:11--14","饑荒：不聽耶和華的話"]],"serm":{"pts":[["結局到了","8:1--3","我民以色列的結局到了"],["詭詐的天平","8:4--10","用詭詐的天平欺哄人"],["聽道的饑荒","8:11--14","乃因不聽耶和華的話"]]},"q":"如果有一天，你發現自己的日子，正過得很好，神卻讓你看見一筐熟透的果子，你會怎麼想？阿摩司書第八章，神給阿摩司看的，不是可怕的東西，是一筐夏天的果子。熟了，最甜，也最等不得。神從這筐果子裡，說出結局；又從結局裡，說出一個仍然稱他們為我民的心。這一章問我們：在我手裡的天平、我的買賣、我的安息，與我耳朵聽見神的話之間，我有沒有一個地方，是熟了，卻不自知的？","truth":"神在一筐夏天的果子裡宣告以色列的結局，責備那些以詭詐的天平吞吃窮乏人的人，並起誓永不忘記他們的行為；又宣告一場不是缺餅缺水、而是聽不到耶和華的話的饑荒。","mv":{"t":"乃因不聽耶和華的話","r":"摩8:11"},"card":["主耶和華又讓阿摩司看見一筐夏天的果子，神問他看見什麼，他回答：一筐果子。神說：我民以色列的結局到了，我不再放過他們。到那日，殿中的詩歌要變成哀號。神又對那些吞吃窮乏人的人說：你們要聽。他們盼望月朔和安息日趕快過去，好賣糧；把量器做小，把砝碼做大，用一雙鞋的價錢買窮人，把壞麥子賣給人。神起誓，他們的一切行為，我永遠不忘。地要震動，節期要變悲哀，如同喪了獨生子。最後，神宣告一場饑荒：不是缺餅，不是缺水，是聽不到耶和華的話；連最年輕有力的人，都要因乾渴發昏。","「乃因不聽耶和華的話」：最深的飢餓，不是胃空，是耳朵裡沒有神的話。這一章，神兩次說到聽：第四節，是呼召，當聽我的話；第十一節，是饑荒，聽不到。呼召被拒絕之後，才有這場饑荒。這是一位仍然稱他們為我民的神，說出來的重話。","耶穌說：人活著，不是單靠食物，乃是靠神口裡所出的一切話（太4:4）。祂也說：我就是生命的糧，到我這裡來的，必定不餓（約6:35）。阿摩司的時代，找不著神的話；在耶穌裡，神的話成了肉身，住在我們中間（約1:14）。祂為貧窮的人傳福音（路4:18），也成為我們一切飢渴的飽足。","無己是放下用天平、用升斗、用價錢，去算計別人的心，也放下一邊敬拜、一邊盼望它趕快過去的急躁；把人當成有名字的人，把神的話當成真正的糧。","「乃因不聽耶和華的話」","這個星期，檢查一次自己的天平：在買賣、議價、薪水、時間分配上，有沒有一個別人看不見、只有神看得見的小動作？把它說給神聽，並改過來；然後，每天用十分鐘，不為進度，只為飽足，安靜讀一段神的話。","最終整合：\n神給阿摩司看一筐熟了的果子。\n熟了，是時候到了。\n神仍然說：我民。\n祂說：你們當聽我的話。\n他們的天平詭詐，他們買窮人，像買一雙鞋。\n神起誓：他們的行為，我永遠不忘。\n最深的饑荒，是聽不到神的話。\n趁神還在說話，聽。"],"self":"聽的定義：我放下用天平算計別人的手，也放下一邊敬拜、一邊盤算的心；我把受傷的人當成有名字的人，也把耳朵留給神的話，讓它真正餵養我。","t321":{"k":"耶穌是生命的糧，也是神的話成了肉身；祂為貧窮的人傳福音，也說人活著，是靠神口裡所出的一切話（太4:4；路4:18；摩8:11）。","g":"讓耶穌作王，就是讓祂掌管我的天平、我的價錢、我的安息日，也掌管我的耳朵，使我先聽祂，再做事（摩8:4--6，11）。","p":"屬神的體系，是一群公平對待人、看見受傷的人，並且在神的話語裡一起得飽足的人；他們彼此記得，神也記得（摩8:6--7，11）。"},"grp":["【一、破冰】你有沒有一次，在市場或店裡，覺得自己被少算、被多收？當時你心裡怎麼想？","【二、扎心】8:5他們一邊守安息日，一邊看時間。你上一次一邊敬拜，一邊盤算別的事，是什麼時候？","【三、經文】8:7神說：他們的一切行為，我必永遠不忘。這句話，對欺壓人的人和被欺壓的人，各有什麼不同的意思？","【四、福音】耶穌是生命的糧，也是神的話成了肉身。這怎樣改變你對「聽神的話」的看法？","【五、行動】這個星期，你要檢查自己哪一個天平、價錢或習慣？你要用哪一句話，看見一位被壓傷的人？告訴誰？"],"prac":{"main":"公平地對待人，專心地聽神的話","items":["對神：每天用十分鐘，不為進度，只為飽足，安靜讀一段神的話，並對祂說：主啊，我在聽。","對自己：寫下你在買賣、議價、薪水或時間上，一個別人看不見的小動作，誠實問：這個，神看得見嗎？","對人：找出一位在你身邊常被少算、被忽略的人，用一句具體的話看見他，例如：謝謝你，你做的這件事，我記得。","對生活：這個星期，有一個安息的時間，不看手機、不盤算工作，只是好好休息、好好敬拜。","對使命：在小組中，找出一個大家都在忽略的人（鐘點工、看護、清潔、新來的人），這個月具體地幫他一件事。"]},"safe":["① 錯誤講法：把8:1--2「夏天的果子」「結局到了」講成神已經放棄以色列，不再是祂的百姓","正確理解：神在宣告結局時，仍稱他們「我民」；審判是從一位仍稱他們為我民的神口中說出的。","檢驗標準：會眾是更看見神的心腸，還是更把神看成冷酷？","② 錯誤講法：把8:2「必不再寬恕」講成可以算出神忍耐的次數，或推算審判的日子","正確理解：「不再越過」是神說出的結局，不是一個數字；本講義不算次數、不推算日子。","檢驗標準：會眾是更願意今天悔改，還是更熱衷推算時間？","③ 錯誤講法：把8:3「殿中的詩歌變為哀號」講成神討厭詩歌與敬拜本身","正確理解：這一節說的是歌聲被悲哀吞沒；神責備的是沒有公義、沒有生命的敬拜，不是敬拜本身。","檢驗標準：會眾是更看重敬拜與生活合一，還是更輕看敬拜？","④ 錯誤講法：把8:4--6講成有錢、做生意就是罪，或把阿摩司書講成社會革命的手冊","正確理解：神問的是量器是否公平、人是否被當成價錢；神要的公義，出於認識神，不取代敬拜，也不是一份社會方案。","檢驗標準：會眾是更認識這位為窮人說話的神，還是更沉迷一種口號？","⑤ 錯誤講法：把8:4--6拿來指名今日某個行業、某家企業或某個人是「吞吃窮乏人的」","正確理解：經文對象是阿摩司時代的以色列人；本講義不貼標籤、不點名任何今日的人或團體，先陪伴受傷的人，再省察自己。","檢驗標準：會眾是先看見受傷的人，還是先急著審判別人？","⑥ 錯誤講法：把8:5講成這些人不守安息日、不敬拜","正確理解：他們守月朔、守安息日，只是一邊守、一邊盼望它趕快過去；問題在心不在敬拜裡。","檢驗標準：會眾是更省察自己的心，還是更說「我有聚會就沒問題」？","⑦ 錯誤講法：把8:10「如喪獨生子」拿來對喪子的父母，說孩子的死是神的審判","正確理解：這是一個強烈的比喻，說明那一天的哀痛有多深；它從來不是用來解釋任何一位父母的喪子之痛。","檢驗標準：哀哭的人是被陪伴，還是被追問原因？","⑧ 錯誤講法：把8:11--12「聽道的饑荒」講成恐嚇會眾，說不來聚會神就不再對你說話","正確理解：這是對那個不聽的國度說的重話；今天神已藉著祂的兒子說了話，祂的話開著，呼召是趁現在聽。","檢驗標準：會眾讀完是更想聽神的話，還是更害怕？","⑨ 錯誤講法：把一個信徒覺得心靈乾渴、感覺不到神，直接講成他正被這節的饑荒審判","正確理解：8:11是對一群拒絕聽的人的審判；信徒有時覺得乾渴，是軟弱、疲乏或受苦，不等於被神棄絕，要被陪伴。","檢驗標準：乾渴的人是被安慰、被陪伴，還是被定罪？","⑩ 錯誤講法：把8:14「永不再起來」講成任何人悔改也沒有機會，或把它與9章的盼望對立","正確理解：這一句說的是指著偶像起誓的那一群人；神的話並沒有停在這一章，本講義不替它做時間表，也不跳過九章。","檢驗標準：會眾是更看見審判的嚴肅，還是仍然看見神沒有放棄的心？"]},{"n":9,"t":"倒塌的帳幕","sub":"擊、篩、建","lv":"A","arc":"審判之後的盼望","sec":[["9:1--4","站在祭壇旁邊：無一人能逃避"],["9:5--6","耶和華是他的名"],["9:7--10","我豈不看你們如古實人：用篩子篩穀"],["9:11--12","建立大衛倒塌的帳幕"],["9:13--15","栽於本地，不再拔出來"]],"serm":{"pts":[["無處可逃","9:1--6","無一人能逃避"],["篩穀","9:7--10","好像用篩子篩穀"],["建立倒塌的帳幕","9:11--15","我必建立大衛倒塌的帳幕"]]},"q":"如果有人問你：你心裡最安全的地方在哪裡，你會說什麼？是存款、是身分、是一份資歷，還是「我一直在教會」？阿摩司書九章是整卷書的最後一章，先是主站在祭壇旁邊，說沒有一個地方能逃；然後是篩子，把自以為災禍追不上的人篩出來；最後，是神說：我必建立大衛倒塌的帳幕，我必使我民歸回，我要將他們栽於本地。這一章問我們：我真正的避難所是哪裡？當我的帳幕倒塌了，我敢不敢讓神來修？","truth":"神站在祭壇旁邊，沒有一個地方能逃，連敬拜也不能當作保險；祂用篩子除去自以為災禍追不上的人，卻連一粒也不落在地上；最後，祂親自建立大衛倒塌的帳幕，使祂的民歸回，栽於本地，不再拔出來。","mv":{"t":"我必建立大衛倒塌的帳幕","r":"摩9:11"},"card":["我看見主站在祭壇旁邊；他說：要擊打柱頂，使門檻震動，所剩下的人，無一人能逃避，無一人能逃脫。雖然挖透陰間，我的手必取出他們來；雖然爬上天去，我必拿下他們來；雖然藏在迦密山頂、藏在海底，從那裡，我必搜尋。主－萬軍之耶和華摸地，地就消化；耶和華是他的名。我豈不看你們如古實人嗎？我必出令，將以色列家分散在列國中，好像用篩子篩穀，連一粒也不落在地上。到那日，我必建立大衛倒塌的帳幕，堵住破口，重新修造，像古時一樣。我必使我民歸回，把他們栽於本地，不再拔出來。這是耶和華你的神說的。","「好像用篩子篩穀，連一粒也不落在地上」：搖動是真的，保全也是真的。神的審判，不是亂打，是精確的；神的篩，是為了留下穀子。被篩出去的，是說「災禍必追不上我們」的人。","耶穌是大衛的子孫，是真正建立帳幕的那一位。本來該落在我們頭上的柱頂，落在祂身上；祂對彼得說：我已經為你祈求，叫你不至於失了信心（路22:32）；祂在十字架上說：父啊，赦免他們（路23:34）。在祂的手裡，沒有人能把我們奪去（約10:28）。","無己是放下「我可以自己保護自己」的心，不再把平安放在身分、存款、資歷或教會的紀錄上；承認我沒有地方可以躲，我只有祂。無己，也是放下「我的破口太大，神修不了」的羞愧，讓神來建立。","「我必建立大衛倒塌的帳幕」","這個星期，找出你心裡的那個「保險箱」，誠實地問：如果它沒有了，我還有什麼？再找出你生活中那個破了很久的「帳幕」，一件一件說給神聽，並告訴一位同伴。","最終整合：\n主站在祭壇旁邊，沒有一個地方能逃。\n連敬拜，也不能當作保險。\n神的篩，搖動是真的，保全也是真的。\n被篩出去的，是說「災禍追不上我」的人。\n但神說：我必建立倒塌的帳幕。\n人不回來，神使他們歸回。\n祂栽下的，不再拔出來。"],"self":"真正避難所的定義：我不把平安放在身分、存款、資歷或敬拜的形式上，而是承認我沒有地方可以躲，只能回到神面前，讓祂建立我倒塌的帳幕。","t321":{"k":"耶穌是大衛的子孫，親自承受該落在我們頭上的審判，也為我們祈求，叫我們不至於失了信心（摩9:11；路22:31--32）。","g":"讓耶穌作王，就是不再把平安放在別的地方，承認我沒有地方可以躲，並把我的破口交給祂來修（摩9:1--4，11）。","p":"建立屬神的體系，是一群帶著破口來到神面前的人，彼此坦白，不靠身分保障，也歡迎所有稱為祂名下的人（摩9:7，11--12）。"},"grp":["【一、破冰】你家裡，哪一個地方，是你覺得最安全的？為什麼是那裡？","【二、扎心】9:10「災禍必追不上我們」。你有沒有一個地方，是你不願意給神碰的？請說出一個大概的類型，不必細節。","【三、經文】9:7神說「我豈不看你們如古實人」。這一句，怎樣挑戰你對「恩典是我的保障」的想法？","【四、福音】耶穌為彼得祈求，叫他不至於失了信心，也在十字架上承受審判。這怎樣改變你面對「被搖動」的方式？","【五、行動】這個星期，你生活中哪一個「倒塌的帳幕」，你願意交給神來修？你願意告訴誰？"],"prac":{"main":"把避難所放回神手中，把破口交給神修","items":["對神：每天花三分鐘，對神說：主，我把平安放在別的地方了，求祢憐憫，也求祢建立我倒塌的帳幕。","對自己：寫下你心裡的那個「保險箱」，問：如果它沒有了，我還有什麼？","對人：找一位同伴，坦白說出一個你很久沒有修好的破口，請他這個星期問你一次。","對生活：這個星期，有意識地，在一頓飯上，為「平凡的日子」感謝神：一張桌子、一個家、一份果子。","對使命：找出一位不是你同類的人（不同年齡、背景或教會），向他表示歡迎，並說：神的家，比我們以為的大。"]},"safe":["① 錯誤講法：把9:1--4「無處可逃」，講成神要恐嚇人，叫人活在驚慌裡","正確理解：這是對自以為災禍追不上的人的警告；對相信的人，同樣的事實（詩139篇）是安慰。我們要讓人更愛主，不是更怕世界。","檢驗標準：會眾是更倚靠神，還是更怕得睡不著？","② 錯誤講法：把9:1擊打柱頂，講成神反對祭壇、反對敬拜","正確理解：神反對的是沒有生命、沒有公義的敬拜，把祭壇當成保險；敬拜本身，仍然是神所設立的（參五章21--24節）。","檢驗標準：會眾是更真實地來到神面前，還是更不敢敬拜？","③ 錯誤講法：把9:7「如古實人」，講成神不再看重以色列，或貶低古實人","正確理解：這是對以為「出埃及的恩典」可以免審判的人說的；八節立刻說「卻不將雅各家滅絕淨盡」，也沒有貶低古實人，神同樣領別的民族。","檢驗標準：會眾是更看見恩典不是護身符，還是更輕看別的民族？","④ 錯誤講法：把9:9「篩穀」，講成我們可以自己分辨誰是穀、誰是糠","正確理解：經文給的標準，只是「說災禍追不上我們的人」；篩的主人是神，我們不替神分類，也不替任何人定罪。","檢驗標準：會眾是更謙卑自省，還是更急著給別人貼標籤？","⑤ 錯誤講法：把9:9「連一粒也不落在地上」，講成信徒永遠不會被搖動、不會受苦","正確理解：篩的過程是搖動，是真實的痛；保全的是人，不是沒有痛苦。耶穌為彼得祈求，也是在被篩之中。","檢驗標準：受苦的人是被安慰，還是被暗示「你信心不夠才被搖」？","⑥ 錯誤講法：把9:11--12「到那日」，講成可以計算的末世時間表","正確理解：經文沒有說日期；本講義不算日子，只照使徒行傳十五章16--17節新約自己引用的方式說，把這個應許與外邦人歸向神連在一起。","檢驗標準：會眾是更盼望神的作為，還是更熱衷推算日子？","⑦ 錯誤講法：把9:11--15，講成支持或反對任何現代國家、土地、政黨或領袖","正確理解：經文的重點是神親自建立與保守，我們不拿它去支持或反對任何現代的政治立場，也不替任何人貼標籤。","檢驗標準：會眾是更仰望神，還是更站隊、更看不起別人？","⑧ 錯誤講法：把9:12「以東所餘剩的」與徒15:17「餘剩的人」的差異，講成經文有錯或隨意改寫","正確理解：希伯來文本與七十士譯本的讀法有差異，新約作者引用的是後者；我們陳列事實，不隨意判斷，也不因此懷疑聖經。","檢驗標準：會眾是更誠實面對經文的複雜，還是更對聖經失去信心？","⑨ 錯誤講法：把9:14「歸回」，講成人靠努力就能回到神面前","正確理解：原文是神說「我必使」；整卷書人不回來，最後是神使他們歸回。恩典在先，不是人的表現在先。","檢驗標準：會眾是更領受恩典，還是更靠努力換取接納？","⑩ 錯誤講法：把9:13--15的豐收與栽於本地，講成「信主就一定發財、一定順利」","正確理解：經文畫的是平凡日子的恢復（有家、有園子、有桌子），不是繁榮神學；它是神對祂百姓的保守，不是對我們的交易條件。","檢驗標準：貧窮或受苦的人是被安慰，還是被暗示「你信心不夠」？","⑪ 錯誤講法：因為「神栽下就不再拔出」，就說信徒不需要警醒、不需要悔改","正確理解：九章前半的警告與後半的應許並存；盼望是叫人更貼近神，不是叫人更輕忽罪。","檢驗標準：會眾是更願意悔改、更倚靠恩典，還是更放縱自己？","⑫ 錯誤講法：把九章的審判或盼望，用來責備某位受害者或受欺壓的人，或講成「你被傷害是你該得的」","正確理解：陪伴與保護受傷的人，優先於論斷；整卷書神為受欺壓者發聲，審判是對自以為例外的人說的，不是對受傷的人說的。","檢驗標準：受傷的人是被陪伴，還是被論斷、被再一次傷害？"]}],"txt":{"1":["當猶大王烏西雅，以色列王約阿施的兒子耶羅波安在位的時候，大地震前二年，提哥亞牧人中的阿摩司得默示論以色列。","他說：耶和華必從錫安吼叫，從耶路撒冷發聲；牧人的草場要悲哀；迦密的山頂要枯乾。","耶和華如此說：大馬士革三番四次地犯罪，我必不免去她的刑罰；因為她以打糧食的鐵器打過基列。","我卻要降火在哈薛的家中，燒滅便‧哈達的宮殿。","我必折斷大馬士革的門閂，剪除亞文平原的居民和伯‧伊甸掌權的。亞蘭人必被擄到吉珥。這是耶和華說的。","耶和華如此說：迦薩三番四次地犯罪，我必不免去她的刑罰；因為她擄掠眾民交給以東。","我卻要降火在迦薩的城內，燒滅其中的宮殿。","我必剪除亞實突的居民和亞實基倫掌權的，也必反手攻擊以革倫。非利士人所餘剩的必都滅亡。這是主耶和華說的。","耶和華如此說：泰爾三番四次地犯罪，我必不免去她的刑罰；因為她將眾民交給以東，並不記念弟兄的盟約。","我卻要降火在泰爾的城內，燒滅其中的宮殿。","耶和華如此說：以東三番四次地犯罪，我必不免去她的刑罰；因為她拿刀追趕兄弟，毫無憐憫，發怒撕裂，永懷忿怒。","我卻要降火在提幔，燒滅波斯拉的宮殿。","耶和華如此說：亞捫人三番四次地犯罪，我必不免去他們的刑罰；因為他們剖開基列的孕婦，擴張自己的境界。","我卻要在爭戰吶喊的日子，旋風狂暴的時候，點火在拉巴的城內，燒滅其中的宮殿。","他們的王和首領必一同被擄去。這是耶和華說的。"],"2":["耶和華如此說：摩押三番四次地犯罪，我必不免去她的刑罰；因為她將以東王的骸骨焚燒成灰。","我卻要降火在摩押，燒滅加略的宮殿。摩押必在鬨嚷吶喊吹角之中死亡。","我必剪除摩押中的審判者，將其中的一切首領和他一同殺戮。這是耶和華說的。","耶和華如此說：猶大人三番四次地犯罪，我必不免去他們的刑罰；因為他們厭棄耶和華的訓誨，不遵守他的律例。他們列祖所隨從虛假的偶像使他們走迷了。","我卻要降火在猶大，燒滅耶路撒冷的宮殿。","耶和華如此說：以色列人三番四次地犯罪，我必不免去他們的刑罰；因他們為銀子賣了義人，為一雙鞋賣了窮人。","他們見窮人頭上所蒙的灰也都垂涎，阻礙謙卑人的道路。父子同一個女子行淫，褻瀆我的聖名。","他們在各壇旁鋪人所當的衣服，臥在其上，又在他們神的廟中喝受罰之人的酒。","我從以色列人面前除滅亞摩利人。他雖高大如香柏樹，堅固如橡樹，我卻上滅他的果子，下絕他的根本。","我也將你們從埃及地領上來，在曠野引導你們四十年，使你們得亞摩利人之地為業。","我從你們子弟中興起先知，又從你們少年人中興起拿細耳人。以色列人哪，不是這樣嗎？這是耶和華說的。","你們卻給拿細耳人酒喝，囑咐先知說：不要說預言。","看哪，在你們所住之地，我必壓你們，如同裝滿禾捆的車壓物一樣。","快跑的不能逃脫；有力的不能用力；剛勇的也不能自救。","拿弓的不能站立；腿快的不能逃脫；騎馬的也不能自救。","到那日，勇士中最有膽量的，必赤身逃跑。這是耶和華說的。"],"3":["以色列人哪，你們全家是我從埃及地領上來的，當聽耶和華攻擊你們的話：","在地上萬族中，我只認識你們；因此，我必追討你們的一切罪孽。","二人若不同心，豈能同行呢？","獅子若非抓食，豈能在林中咆哮呢？少壯獅子若無所得，豈能從洞中發聲呢？","若沒有機檻，雀鳥豈能陷在網羅裡呢？網羅若無所得，豈能從地上翻起呢？","城中若吹角，百姓豈不驚恐呢？災禍若臨到一城，豈非耶和華所降的嗎？","主耶和華若不將奧祕指示他的僕人－眾先知，就一無所行。","獅子吼叫，誰不懼怕呢？主耶和華發命，誰能不說預言呢？","要在亞實突的宮殿中和埃及地的宮殿裡傳揚說：你們要聚集在撒馬利亞的山上，就看見城中有何等大的擾亂與欺壓的事。","那些以強暴搶奪財物、積蓄在自己家中的人不知道行正直的事。這是耶和華說的。","所以主耶和華如此說：敵人必來圍攻這地，使你的勢力衰微，搶掠你的家宅。","耶和華如此說：「牧人怎樣從獅子口中搶回兩條羊腿或半個耳朵，住撒馬利亞的以色列人躺臥在床角上或鋪繡花毯的榻上，他們得救也不過如此。」","主耶和華－萬軍之神說：當聽這話，警戒雅各家。","我討以色列罪的日子，也要討伯特利祭壇的罪；壇角必被砍下，墜落於地。","我要拆毀過冬和過夏的房屋。象牙的房屋也必毀滅；高大的房屋都歸無有。這是耶和華說的。"],"4":["你們住撒馬利亞山如巴珊母牛的啊，當聽我的話－你們欺負貧寒的，壓碎窮乏的，對家主說：拿酒來，我們喝吧！","主耶和華指著自己的聖潔起誓說：日子快到，人必用鉤子將你們鉤去，用魚鉤將你們餘剩的鉤去。","你們各人必從破口直往前行，投入哈門。這是耶和華說的。","以色列人哪，任你們往伯特利去犯罪，到吉甲加增罪過；每日早晨獻上你們的祭物，每三日奉上你們的十分之一。","任你們獻有酵的感謝祭，把甘心祭宣傳報告給眾人，因為是你們所喜愛的。這是主耶和華說的。","我使你們在一切城中牙齒乾淨，在你們各處糧食缺乏，你們仍不歸向我。這是耶和華說的。","在收割的前三月，我使雨停止，不降在你們那裡；我降雨在這城，不降雨在那城；這塊地有雨，那塊地無雨；無雨的就枯乾了。","這樣，兩三城的人湊到一城去找水，卻喝不足；你們仍不歸向我。這是耶和華說的。","我以旱風、霉爛攻擊你們，你們園中許多菜蔬、葡萄樹、無花果樹、橄欖樹都被剪蟲所吃；你們仍不歸向我。這是耶和華說的。","我降瘟疫在你們中間，像在埃及一樣；用刀殺戮你們的少年人，使你們的馬匹被擄掠，營中屍首的臭氣撲鼻；你們仍不歸向我。這是耶和華說的。","我傾覆你們中間的城邑，如同我從前傾覆所多瑪、蛾摩拉一樣，使你們好像從火中抽出來的一根柴；你們仍不歸向我。這是耶和華說的。","以色列啊，我必向你如此行；以色列啊，我既這樣行，你當預備迎見你的神。","那創山、造風、將心意指示人、使晨光變為幽暗、腳踏在地之高處的，他的名是耶和華－萬軍之神。"],"5":["以色列家啊，要聽我為你們所作的哀歌：","以色列民跌倒，不得再起；躺在地上，無人攙扶。","主耶和華如此說：以色列家的城發出一千兵的，只剩一百；發出一百的，只剩十個。","耶和華向以色列家如此說：你們要尋求我，就必存活。","不要往伯特利尋求，不要進入吉甲，不要過到別是巴；因為吉甲必被擄掠，伯特利也必歸於無有。","要尋求耶和華，就必存活，免得他在約瑟家像火發出，在伯特利焚燒，無人撲滅。","你們這使公平變為茵蔯、將公義丟棄於地的，","要尋求那造昴星和參星，使死蔭變為晨光，使白日變為黑夜，命海水來澆在地上的－耶和華是他的名；","他使力強的忽遭滅亡，以致保障遭遇毀壞。","你們怨恨那在城門口責備人的，憎惡那說正直話的。","你們踐踏貧民，向他們勒索麥子；你們用鑿過的石頭建造房屋，卻不得住在其內；栽種美好的葡萄園，卻不得喝所出的酒。","我知道你們的罪過何等多，你們的罪惡何等大。你們苦待義人，收受賄賂，在城門口屈枉窮乏人。","所以通達人見這樣的時勢必靜默不言，因為時勢真惡。","你們要求善，不要求惡，就必存活。這樣，耶和華－萬軍之神必照你們所說的與你們同在。","要惡惡好善，在城門口秉公行義；或者耶和華－萬軍之神向約瑟的餘民施恩。","主耶和華－萬軍之神如此說：在一切寬闊處必有哀號的聲音；在各街市上必有人說：哀哉！哀哉！又必叫農夫來哭號，叫善唱哀歌的來舉哀。","在各葡萄園必有哀號的聲音，因為我必從你中間經過。這是耶和華說的。","想望耶和華日子來到的有禍了！你們為何想望耶和華的日子呢？那日黑暗沒有光明，","景況好像人躲避獅子又遇見熊，或是進房屋以手靠牆，就被蛇咬。","耶和華的日子不是黑暗沒有光明嗎？不是幽暗毫無光輝嗎？","我厭惡你們的節期，也不喜悅你們的嚴肅會。","你們雖然向我獻燔祭和素祭，我卻不悅納，也不顧你們用肥畜獻的平安祭；","要使你們歌唱的聲音遠離我，因為我不聽你們彈琴的響聲。","惟願公平如大水滾滾，使公義如江河滔滔。","「以色列家啊，你們在曠野四十年，豈是將祭物和供物獻給我呢？","你們抬著為自己所造之摩洛的帳幕和偶像的龕，並你們的神星。","所以我要把你們擄到大馬士革以外。」這是耶和華－名為萬軍之神說的。"],"6":["國為列國之首，人最著名，且為以色列家所歸向，在錫安和撒馬利亞山安逸無慮的，有禍了！","你們要過到甲尼察看，從那裡往大城哈馬去，又下到非利士人的迦特，看那些國比你們的國還強嗎？境界比你們的境界還寬嗎？","你們以為降禍的日子還遠，坐在位上盡行強暴。","你們躺臥在象牙床上，舒身在榻上，吃群中的羊羔，棚裡的牛犢；","彈琴鼓瑟唱消閑的歌曲，為自己製造樂器，如同大衛所造的；","以大碗喝酒，用上等的油抹身，卻不為約瑟的苦難擔憂。","所以這些人必在被擄的人中首先被擄；舒身的人荒宴之樂必消滅了。","主耶和華－萬軍之神指著自己起誓說：我憎惡雅各的榮華，厭棄他的宮殿；因此，我必將城和其中所有的都交付敵人。","那時，若在一房之內剩下十個人，也都必死。","死人的伯叔，就是燒他屍首的，要將這屍首搬到房外，問房屋內間的人說：「你那裡還有人沒有？」他必說：「沒有」；又說：「不要作聲，因為我們不可提耶和華的名。」","看哪，耶和華出令，大房就被攻破，小屋就被打裂。","馬豈能在崖石上奔跑？人豈能在那裡用牛耕種呢？你們卻使公平變為苦膽，使公義的果子變為茵蔯。","你們喜愛虛浮的事，自誇說：我們不是憑自己的力量取了角嗎？","耶和華、萬軍之神說：以色列家啊，我必興起一國攻擊你們；他們必欺壓你們，從哈馬口直到亞拉巴的河。"],"7":["主耶和華指示我一件事：為王割菜之後，菜又發生；剛發生的時候，主造蝗蟲。","蝗蟲吃盡那地的青物，我就說：「主耶和華啊，求你赦免；因為雅各微弱，他怎能站立得住呢？」","耶和華就後悔說：「這災可以免了。」","主耶和華又指示我一件事：他命火來懲罰以色列，火就吞滅深淵，險些將地燒滅。","我就說：「主耶和華啊，求你止息；因為雅各微弱，他怎能站立得住呢？」","耶和華就後悔說：「這災也可免了。」","他又指示我一件事：有一道牆是按準繩建築的，主手拿準繩站在其上。","耶和華對我說：「阿摩司啊，你看見甚麼？」我說：「看見準繩。」主說：「我要吊起準繩在我民以色列中，我必不再寬恕他們。","以撒的邱壇必然淒涼；以色列的聖所必然荒廢。我必興起，用刀攻擊耶羅波安的家。」","伯特利的祭司亞瑪謝打發人到以色列王耶羅波安那裡，說：「阿摩司在以色列家中圖謀背叛你；他所說的一切話，這國擔當不起；","因為阿摩司如此說：『耶羅波安必被刀殺；以色列民定被擄去離開本地。』」","亞瑪謝又對阿摩司說：「你這先見哪，要逃往猶大地去，在那裡糊口，在那裡說預言，","卻不要在伯特利再說預言；因為這裡有王的聖所，有王的宮殿。」","阿摩司對亞瑪謝說：「我原不是先知，也不是先知的門徒。我是牧人，又是修理桑樹的。","耶和華選召我，使我不跟從羊群，對我說：『你去向我民以色列說預言。』","亞瑪謝啊，現在你要聽耶和華的話。你說：『不要向以色列說預言，也不要向以撒家滴下預言。』","所以耶和華如此說：『你的妻子必在城中作妓女；你的兒女必倒在刀下。你的地必有人用繩子量了分取；你自己必死在污穢之地。以色列民定被擄去離開本地。』」"],"8":["主耶和華又指示我一件事：我看見一筐夏天的果子。","他說：「阿摩司啊，你看見甚麼？」我說：「看見一筐夏天的果子。」耶和華說：「我民以色列的結局到了，我必不再寬恕他們。」","主耶和華說：「那日，殿中的詩歌變為哀號；必有許多屍首在各處拋棄，無人作聲。」","你們這些要吞吃窮乏人、使困苦人衰敗的，當聽我的話！","你們說：月朔幾時過去，我們好賣糧；安息日幾時過去，我們好擺開麥子；賣出用小升斗，收銀用大戥子，用詭詐的天平欺哄人，","好用銀子買貧寒人，用一雙鞋換窮乏人，將壞了的麥子賣給人。","耶和華指著雅各的榮耀起誓說：他們的一切行為，我必永遠不忘。","地豈不因這事震動？其上的居民不也悲哀嗎？地必全然像尼羅河漲起，如同埃及河湧上落下。","主耶和華說：到那日，我必使日頭在午間落下，使地在白晝黑暗。","我必使你們的節期變為悲哀，歌曲變為哀歌。眾人腰束麻布，頭上光禿，使這場悲哀如喪獨生子，至終如痛苦的日子一樣。","主耶和華說：日子將到，我必命饑荒降在地上。人飢餓非因無餅，乾渴非因無水，乃因不聽耶和華的話。","他們必飄流，從這海到那海，從北邊到東邊，往來奔跑，尋求耶和華的話，卻尋不著。","當那日，美貌的處女和少年的男子必因乾渴發昏。","那指著撒馬利亞牛犢起誓的說：但哪，我們指著你那裡的活神起誓；又說：我們指著別是巴的神道起誓。這些人都必仆倒，永不再起來。"],"9":["我看見主站在祭壇旁邊；他說：你要擊打柱頂，使門檻震動，打碎柱頂，落在眾人頭上；所剩下的人，我必用刀殺戮，無一人能逃避，無一人能逃脫。","他們雖然挖透陰間，我的手必取出他們來；雖然爬上天去，我必拿下他們來；","雖然藏在迦密山頂，我必搜尋，捉出他們來；雖然從我眼前藏在海底，我必命蛇咬他們；","雖被仇敵擄去，我必命刀劍殺戮他們；我必向他們定住眼目，降禍不降福。","主－萬軍之耶和華摸地，地就消化，凡住在地上的都必悲哀。地必全然像尼羅河漲起，如同埃及河落下。","那在天上建造樓閣、在地上安定穹蒼、命海水澆在地上的－耶和華是他的名。","耶和華說：以色列人哪，我豈不看你們如古實人嗎？我豈不是領以色列人出埃及地，領非利士人出迦斐託，領亞蘭人出吉珥嗎？","主耶和華的眼目察看這有罪的國，必將這國從地上滅絕，卻不將雅各家滅絕淨盡。這是耶和華說的。","我必出令，將以色列家分散在列國中，好像用篩子篩穀，連一粒也不落在地上。","我民中的一切罪人說：災禍必追不上我們，也迎不著我們。他們必死在刀下。","到那日，我必建立大衛倒塌的帳幕，堵住其中的破口，把那破壞的建立起來，重新修造，像古時一樣，","使以色列人得以東所餘剩的和所有稱為我名下的國。此乃行這事的耶和華說的。","耶和華說：日子將到，耕種的必接續收割的；踹葡萄的必接續撒種的；大山要滴下甜酒；小山都必流奶。","我必使我民以色列被擄的歸回；他們必重修荒廢的城邑居住，栽種葡萄園，喝其中所出的酒，修造果木園，吃其中的果子。","我要將他們栽於本地，他們不再從我所賜給他們的地上拔出來。這是耶和華－你的神說的。"]},"blk":{"1":[{"a":1,"z":1,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>דִּבְרֵי עָמוֹס אֲשֶׁר הָיָה בַנֹּקְדִים מִתְּקוֹעַ אֲשֶׁר חָזָה עַל יִשְׂרָאֵל בִּימֵי עֻזִיָּה מֶֽלֶךְ יְהוּדָה וּבִימֵי יָרָבְעָם בֶּן יוֹאָשׁ מֶלֶךְ יִשְׂרָאֵל שְׁנָתַיִם לִפְנֵי הָרָֽעַשׁ׃<\/p><\/blockquote>","lit":"<blockquote><p>「當猶大王烏西雅，以色列王約阿施的兒子耶羅波安在位的時候，大地震前二年，提哥亞牧人中的阿摩司得默示論以色列。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>牧人<\/td><td>בַנֹּקְדִים<\/td><td>vanoqedim<\/td><td>H5349<\/td><td>牧羊人、飼養羊群的人<\/td><\/tr><tr><td>提哥亞<\/td><td>מִתְּקוֹעַ<\/td><td>mitteqoa<\/td><td>H8620<\/td><td>提哥亞（猶大曠野邊上的小鎮）<\/td><\/tr><tr><td>得默示<\/td><td>חָזָה<\/td><td>khazah<\/td><td>H2372<\/td><td>看見、得見異象<\/td><\/tr><tr><td>烏西雅<\/td><td>עֻזִיָּה<\/td><td>uzziyyah<\/td><td>H5818<\/td><td>烏西雅（猶大王）<\/td><\/tr><tr><td>耶羅波安<\/td><td>יָרָבְעָם<\/td><td>yarov'am<\/td><td>H3379<\/td><td>耶羅波安（以色列王）<\/td><\/tr><tr><td>大地震<\/td><td>הָרָֽעַשׁ<\/td><td>hara'ash<\/td><td>H7494<\/td><td>地震、震動<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>牧人<\/strong>：原文 noqed，是「飼養羊群的人」，不是單純在山坡上跟著羊走的牧童。這個字在舊約只再出現一次，指摩押王米沙（王下3:4），所以有人推想阿摩司管理的是一個有規模的羊群。第七章14節他自己用的另一個詞是「牧人」（boqer），兩個詞並不完全相同；本講義只取最穩的說法：他是靠牧養羊群為生的人。<\/p><p><strong>得默示<\/strong>：原文是 khazah，字面是「看見」。第一節整句開頭是「阿摩司的話」（divre amos），先說是「話」，再說是「看見」，話與異象放在一起。<\/p><p><strong>大地震前二年<\/strong>：原文是「地震之前二年」。撒迦利亞書14章5節提到「猶大王烏西雅年間」的大地震，可見這場地震在當時留下了很深的記憶。經文只把它當作時間的記號，我們不用它推算任何日期。<\/p>","exp":"<p>一節像一張名片，先介紹這個人，再介紹他活在什麼時代。<strong>他是提哥亞的阿摩司，提哥亞是猶大曠野邊上的小鎮，不是耶路撒冷，不是王宮，也不是任何一間聖所。<\/strong>神選了一個管羊的人，把話交給他。他的職業沒有被藏起來，反而寫在書的第一行。<\/p><p>接下來是兩位王：猶大王烏西雅，以色列王約阿施的兒子耶羅波安。<strong>這是一個外面看起來很興旺的時代<\/strong>：王下14章記著耶羅波安收回了邊界之地，國土擴張，商業與宗教都很熱鬧。阿摩司偏偏被差到這個最不覺得需要先知的時候。注意他的地理：他是猶大人，卻被差往北國以色列，經文說他「得默示論以色列」。<\/p><p>最後是一個很特別的時間記號：大地震前二年。<strong>這場地震，後來連別的先知也還記得（亞14:5）。<\/strong>經文沒有說震了多大、死了多少人，只說它成為一個可以用來記年份的事件。對當時的人來說，那一震把許多事一下子震醒了；而阿摩司的話，早在那之前兩年就已經說出來了。<\/p>"},{"a":2,"z":2,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וַיֹּאמַר יְהוָה מִצִיּוֹן יִשְׁאָג וּמִירוּשָׁלִַם יִתֵּן קוֹלוֹ וְאָֽבְלוּ נְאוֹת הָרֹעִים וְיָבֵשׁ רֹאשׁ הַכַּרְמֶֽל׃<\/p><\/blockquote>","lit":"<blockquote><p>「他說：耶和華必從錫安吼叫，從耶路撒冷發聲；牧人的草場要悲哀；迦密的山頂要枯乾。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>吼叫<\/td><td>יִשְׁאָג<\/td><td>yish'ag<\/td><td>H7580<\/td><td>吼叫（獅子的吼聲）<\/td><\/tr><tr><td>錫安<\/td><td>מִצִיּוֹן<\/td><td>mitsiyyon<\/td><td>H6726<\/td><td>錫安（神的居所所在）<\/td><\/tr><tr><td>聲音<\/td><td>קוֹלוֹ<\/td><td>qolo<\/td><td>H6963<\/td><td>他的聲音<\/td><\/tr><tr><td>悲哀<\/td><td>וְאָֽבְלוּ<\/td><td>ve'avelu<\/td><td>H56<\/td><td>哀傷、枯萎<\/td><\/tr><tr><td>草場<\/td><td>נְאוֹת<\/td><td>ne'ot<\/td><td>H4999<\/td><td>牧場、居所<\/td><\/tr><tr><td>牧人<\/td><td>הָרֹעִים<\/td><td>haro'im<\/td><td>H7462<\/td><td>牧養的人<\/td><\/tr><tr><td>枯乾<\/td><td>וְיָבֵשׁ<\/td><td>veyavesh<\/td><td>H3001<\/td><td>乾枯<\/td><\/tr><tr><td>迦密<\/td><td>הַכַּרְמֶֽל<\/td><td>hakarmel<\/td><td>H3760<\/td><td>迦密山（北國肥美的山）<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>吼叫<\/strong>：yish'ag 是獅子的吼聲專用的動詞。第三章8節再出現：「獅子吼叫，誰不懼怕呢？」同樣的字，同樣的畫面；何西阿書11章10節、約珥書3章16節也有近似的句子。<\/p><p><strong>草場<\/strong>：ne'ot 是牧場、居所，這個字與詩篇23篇2節「青草地」的概念相近：是羊群安歇、被餵養的地方。阿摩司是牧人，他用的是自己最熟悉的字。<\/p><p><strong>悲哀／枯乾<\/strong>：「悲哀」（avel）是哀傷，也可以指大地的枯萎，有人把這句譯成「草場要枯萎」；「枯乾」（yavesh）則是乾透。本講義兩種讀法並陳，意思相通：聲音一到，連最肥美的地方也失了生氣。<\/p>","exp":"<p>二節是整卷書的開場白，也是一個很安靜的震動。<strong>「耶和華必從錫安吼叫，從耶路撒冷發聲」：吼叫的是神，聲音的出處是錫安。<\/strong>阿摩司是牧人，他很清楚獅子吼的時候，整個山谷會是什麼樣子：羊群縮成一團，連風都不敢動。他沒有說神像獅子，他直接說：祂必吼叫。獅子的吼聲本來是狩獵前的宣告，不是為了嚇唬，是已經抓住了。<\/p><p><strong>這個吼聲是從錫安發出的。<\/strong>錫安是神與祂百姓同在的地方，是約櫃、聖殿、敬拜所在的山。阿摩司是猶大人，他站在這個吼聲的來處，卻被差往北國去宣講。以色列人有自己的伯特利、自己的聖所，他們沒有想到：在他們自己的敬拜之外，有一個聲音從耶路撒冷來，不請自來。<\/p><p>吼聲落下，結果出現在兩個地方：<strong>牧人的草場悲哀，迦密的山頂枯乾。<\/strong>迦密山是北國最肥美的山，林木多、雨水足；頂上枯乾，意思是連最不可能枯乾的地方，也要乾透。草場是牧人的生計，山頂是國家的驕傲，兩處一齊失色。但我們要留意：這是先聽見神的聲音，才出現的枯乾。<strong>不是先有災難，才有神的吼聲；是神先開口。<\/strong>這與他後來說的「耶和華如此說」（1:3）是同一個次序：神先說話，人再回應。<\/p>"},{"a":3,"z":5,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>כֹּה אָמַר יְהוָה עַל שְׁלֹשָׁה פִּשְׁעֵי דַמֶּשֶׂק וְעַל אַרְבָּעָה לֹא אֲשִׁיבֶנּוּ עַל דּוּשָׁם בַּחֲרֻצוֹת הַבַּרְזֶל אֶת הַגִּלְעָֽד וְשִׁלַּחְתִּי אֵשׁ בְּבֵית חֲזָאֵל וְאָכְלָה אַרְמְנוֹת בֶּן הֲדָֽד וְשָֽׁבַרְתִּי בְּרִיחַ דַּמֶּשֶׂק וְהִכְרַתִּי יוֹשֵׁב מִבִּקְעַת אָוֶן וְתוֹמֵךְ שֵׁבֶט מִבֵּית עֶדֶן וְגָלוּ עַם אֲרָם קִירָה אָמַר יְהוָֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「耶和華如此說：大馬士革三番四次地犯罪，我必不免去她的刑罰；因為她以打糧食的鐵器打過基列。我卻要降火在哈薛的家中，燒滅便‧哈達的宮殿。我必折斷大馬士革的門閂，剪除亞文平原的居民和伯‧伊甸掌權的。亞蘭人必被擄到吉珥。這是耶和華說的。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>三<\/td><td>שְׁלֹשָׁה<\/td><td>shelosha<\/td><td>H7969<\/td><td>三<\/td><\/tr><tr><td>四<\/td><td>אַרְבָּעָה<\/td><td>arba'a<\/td><td>H702<\/td><td>四<\/td><\/tr><tr><td>罪<\/td><td>פִּשְׁעֵי<\/td><td>pish'e<\/td><td>H6588<\/td><td>悖逆、背叛（的行為）<\/td><\/tr><tr><td>免去（轉回）<\/td><td>אֲשִׁיבֶנּוּ<\/td><td>ashivenu<\/td><td>H7725<\/td><td>使它轉回、收回<\/td><\/tr><tr><td>打糧食的鐵器<\/td><td>בַּחֲרֻצוֹת<\/td><td>bacharutsot<\/td><td>H2742<\/td><td>打穀的器具（有尖齒的板）<\/td><\/tr><tr><td>差遣（降）<\/td><td>וְשִׁלַּחְתִּי<\/td><td>veshillachti<\/td><td>H7971<\/td><td>我要差出、我要放出<\/td><\/tr><tr><td>火<\/td><td>אֵשׁ<\/td><td>esh<\/td><td>H784<\/td><td>火<\/td><\/tr><tr><td>宮殿<\/td><td>אַרְמְנוֹת<\/td><td>armenot<\/td><td>H759<\/td><td>宮殿、堅固的高樓<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>三番四次<\/strong>：原文是「為了三個悖逆，為了四個」（al shelosha pish'e... ve'al arba'a）。這是希伯來文常見的「n 與 n＋1」數字格式（箴6:16、30:15、約伯記5:19 也有），多半用來表示「數目已經多到滿溢」，不是要我們去數是哪三條、哪四條。本講義取這一種讀法，不把它當作犯罪次數的計算。<\/p><p><strong>免去<\/strong>：原文 lo ashivenu，字面是「我不使它轉回」。動詞是 shuv（轉回），這是全卷追蹤字。「它」是什麼，原文沒有明說：可能是刑罰、可能是祂已經說出口的話、也可能是祂的怒氣。各家有三種讀法：一，不使「刑罰」轉回（和合本取此意）；二，不使「這句話」收回；三，不使「怒氣」轉回。三種讀法的方向一致：神已決定，不收回。<\/p><p><strong>罪<\/strong>：pesha，是「悖逆」，指的是故意越過界線的背叛，不是無心的過失。<\/p><p><strong>打糧食的鐵器<\/strong>：打穀橇是一塊裝有鐵齒或石刃的木板，在禾場上拖過穀物。用來比喻對基列的殘酷（參王下13:7「踐踏他們如禾場上的塵沙」）。<\/p>","exp":"<p>三節開始的格式，一直用到二章：<strong>耶和華如此說，某國三番四次地犯罪，我必不免去她的刑罰；因為她……；我卻要降火……<\/strong>。這是神的審判書的樣式，這一章的五個國家，連同第二章的另外三個，都用同樣的架構，只換掉名字與罪名。<\/p><p><strong>第一個被點名的是大馬士革，亞蘭的首都。<\/strong>罪名是「以打糧食的鐵器打過基列」。基列在約旦河東，是以色列的土地。王下10章32至33節與13章3、7節記著：哈薛與他兒子便‧哈達的時代，亞蘭一再攻擊以色列，把百姓踐踏如禾場上的塵沙。阿摩司沒有說這是在替以色列報仇，他是說：這是神所看見的暴力，神記在帳上。<\/p><p>然後是審判：<strong>降火在哈薛的家中，燒滅便‧哈達的宮殿；折斷大馬士革的門閂，剪除亞文平原的居民和伯‧伊甸掌權的；亞蘭人必被擄到吉珥。<\/strong>火燒宮殿，是打倒那些以為自己牢不可破的高牆；折斷門閂，是拆掉城門的保障；被擄到吉珥，是回到他們原來被領出來的地方（參摩9:7）。審判的次序很整齊：王家、城門、百姓。<\/p><p>這裡有一句要特別看：<strong>「我必不免去她的刑罰」，原文是「我必不使它轉回」。<\/strong>轉回（shuv）是整卷書的追蹤字：神在這裡說，祂不轉回；到了第八節，這個字用在祂把手轉過來攻擊以革倫；以後我們還要看見百姓有沒有「轉回」到神那裡。審判不是情緒，是一個已經決定的、不收回的話，這個話也出自一位慢慢地等了很久的神，所以才說「三番四次」。<\/p><p>最後一句是印記：<strong>「這是耶和華說的」<\/strong>，原文是 amar YHWH。說話的是神，不是阿摩司，也不是任何以色列人的憤怒。<\/p>"},{"a":6,"z":8,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>כֹּה אָמַר יְהוָה עַל שְׁלֹשָׁה פִּשְׁעֵי עַזָּה וְעַל אַרְבָּעָה לֹא אֲשִׁיבֶנּוּ עַל הַגְלוֹתָם גָּלוּת שְׁלֵמָה לְהַסְגִּיר לֶאֱדֽוֹם וְשִׁלַּחְתִּי אֵשׁ בְּחוֹמַת עַזָּה וְאָכְלָה אַרְמְנֹתֶֽיהָ וְהִכְרַתִּי יוֹשֵׁב מֵֽאַשְׁדּוֹד וְתוֹמֵךְ שֵׁבֶט מֵֽאַשְׁקְלוֹן וַהֲשִׁיבוֹתִי יָדִי עַל עֶקְרוֹן וְאָֽבְדוּ שְׁאֵרִית פְּלִשְׁתִּים אָמַר אֲדֹנָי יְהוִֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「耶和華如此說：迦薩三番四次地犯罪，我必不免去她的刑罰；因為她擄掠眾民交給以東。我卻要降火在迦薩的城內，燒滅其中的宮殿。我必剪除亞實突的居民和亞實基倫掌權的，也必反手攻擊以革倫。非利士人所餘剩的必都滅亡。這是主耶和華說的。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>全部被擄的人<\/td><td>גָּלוּת<\/td><td>galut<\/td><td>H1546<\/td><td>被擄的人群、擄去的百姓<\/td><\/tr><tr><td>完整的／眾民<\/td><td>שְׁלֵמָה<\/td><td>shelemah<\/td><td>H8003<\/td><td>完整的、全部的<\/td><\/tr><tr><td>交給<\/td><td>לְהַסְגִּיר<\/td><td>lehasgir<\/td><td>H5462<\/td><td>關起來、交出去<\/td><\/tr><tr><td>以東<\/td><td>לֶאֱדֽוֹם<\/td><td>le'edom<\/td><td>H123<\/td><td>以東（以掃的後代）<\/td><\/tr><tr><td>轉過來<\/td><td>וַהֲשִׁיבוֹתִי<\/td><td>vahashivoti<\/td><td>H7725<\/td><td>我要使（手）轉回<\/td><\/tr><tr><td>手<\/td><td>יָדִי<\/td><td>yadi<\/td><td>H3027<\/td><td>我的手<\/td><\/tr><tr><td>以革倫<\/td><td>עֶקְרוֹן<\/td><td>'eqron<\/td><td>H6138<\/td><td>以革倫（非利士城）<\/td><\/tr><tr><td>餘剩的<\/td><td>שְׁאֵרִית<\/td><td>she'erit<\/td><td>H7611<\/td><td>剩下的人、餘民<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>擄掠眾民<\/strong>：原文是 galut shelemah，直譯「完整的被擄者」。有人讀為「整批的人口」（整個村落的人被抓走），有人讀為「完整、沒有缺漏」（強調沒有留下一個）。兩種讀法都指向大規模的人口販運。<\/p><p><strong>交給以東<\/strong>：le'asgir 的意思是「關起來、交出去」，這裡是把人當貨物轉手。約珥書3章6節也提到把猶大人賣給外邦人。<\/p><p><strong>反手攻擊<\/strong>：原文「使我的手轉回」，仍是 shuv（轉回），這是追蹤字的另一種用法：神的手轉過來。第三節「不使它轉回」與第八節「使手轉回」，一個是不收回，一個是轉過來，同一個字根，一面是神不退讓，一面是神的手轉向。<\/p><p><strong>迦特沒有被提到<\/strong>：非利士五城通常是迦薩、亞實突、亞實基倫、迦特、以革倫，這裡只列了四個。為什麼沒有迦特，經文沒有解釋，學者的推測很多；本講義不做推論。<\/p><p><strong>主耶和華<\/strong>：第八節的結語是 adonai YHWH，全章只有這一次用「主耶和華」，而不是只說「耶和華」。<\/p>","exp":"<p>六節的第二個審判對象是迦薩，非利士人沿海五城之一。<strong>她的罪不是動手殺人，是把人當貨品：「擄掠眾民，交給以東」。<\/strong>迦薩把整批人抓起來，賣給以東。被賣的人有名字、有家，而這樁買賣沒有見證人，也不會有法庭；但神看見了。<\/p><p>這是這一章第一次出現「人被當成商品」的畫面。我們要在這裡停一下：<strong>經文讓我們看見的，首先是被賣走的人，其次才是賣人的城。<\/strong>神的第一個動作是記得那些被交出去的人，然後才是審判。<\/p><p>審判的內容與大馬士革一樣：降火，燒滅宮殿。接著是一個擴大的範圍：<strong>剪除亞實突的居民和亞實基倫掌權的，也必反手攻擊以革倫。<\/strong>四個城裡，三個被點名，一個被「反手」攻擊。「反手」這個詞很有畫面：神的手原本伸出去，現在轉過來。這句與第三節的「必不免去」（不使它轉回）呼應：祂不收回審判；祂把手轉向。<\/p><p>最後是結局：<strong>「非利士人所餘剩的必都滅亡」<\/strong>，並且是「主耶和華說的」。當阿摩司用這個稱呼的時候，是在提醒聽的人：說話的是主，是掌管一切城邦的耶和華。<\/p>"},{"a":9,"z":10,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>כֹּה אָמַר יְהוָה עַל שְׁלֹשָׁה פִּשְׁעֵי צֹר וְעַל אַרְבָּעָה לֹא אֲשִׁיבֶנּוּ עַֽל הַסְגִּירָם גָּלוּת שְׁלֵמָה לֶאֱדוֹם וְלֹא זָכְרוּ בְּרִית אַחִֽים וְשִׁלַּחְתִּי אֵשׁ בְּחוֹמַת צֹר וְאָכְלָה אַרְמְנֹתֶֽיהָ׃<\/p><\/blockquote>","lit":"<blockquote><p>「耶和華如此說：泰爾三番四次地犯罪，我必不免去她的刑罰；因為她將眾民交給以東，並不記念弟兄的盟約。我卻要降火在泰爾的城內，燒滅其中的宮殿。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>泰爾<\/td><td>צֹר<\/td><td>tsor<\/td><td>H6865<\/td><td>泰爾（腓尼基的港口大城）<\/td><\/tr><tr><td>交給<\/td><td>הַסְגִּירָם<\/td><td>hasgiram<\/td><td>H5462<\/td><td>把他們交出去<\/td><\/tr><tr><td>記念<\/td><td>זָכְרוּ<\/td><td>zakhru<\/td><td>H2142<\/td><td>記得、記念<\/td><\/tr><tr><td>盟約<\/td><td>בְּרִית<\/td><td>berit<\/td><td>H1285<\/td><td>盟約、約<\/td><\/tr><tr><td>弟兄<\/td><td>אַחִים<\/td><td>akhim<\/td><td>H251<\/td><td>弟兄們<\/td><\/tr><tr><td>城牆<\/td><td>בְּחוֹמַת<\/td><td>bechomat<\/td><td>H2346<\/td><td>在城牆（內）<\/td><\/tr><tr><td>被擄的人<\/td><td>גָּלוּת<\/td><td>galut<\/td><td>H1546<\/td><td>被擄的人群<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>弟兄的盟約<\/strong>：原文 berit akhim，直譯「弟兄們的約」。是哪一個盟約，經文沒有明說。常見的讀法有三：一，所羅門與泰爾王希蘭之間的條約（王上5:12說他們「彼此立約」，王上9:13，所羅門稱希蘭為「我兄」）；二，泰爾與以色列之間比較一般的友好盟約；三，指人與人之間「弟兄」般的、人性的基本情誼，不指任何一份特定條約。本講義不裁定，三種讀法的共同點是：泰爾背棄了本應信守的關係。<\/p><p><strong>記念<\/strong>：zakhar（記念）不只是腦中想起，而是記得，並且依照所記得的去行動。「並不記念」是沒有照著所記得的去行。<\/p><p><strong>十節的簡短<\/strong>：泰爾的審判只有「降火、燒宮殿」一句，沒有提被擄，也沒有提「這是耶和華說的」。經文就是這樣簡短，我們不替它補上。<\/p>","exp":"<p>九節的對象是泰爾，地中海岸最富有的港口。<strong>罪名與迦薩相近：把眾民交給以東；但後面多了一句：並不記念弟兄的盟約。<\/strong>這句話讓罪不只是一次買賣，而是一次背叛：你與別人有過承諾，你記得，卻不照著去做。<\/p><p>泰爾的罪有一個特別的樣子：她不是侵略者，她是商人。她沒有動刀，她只是把人交出去、換取利益。這種罪，不會被人注意。因為買賣是合法的，條約也沒有人追問；但在神的帳上，<strong>「記念」是一件要付代價的事：你可以不記得，但神記得你曾經答應了什麼。<\/strong><\/p><p>十節是這一章最簡短的審判：<strong>降火在泰爾的城內，燒滅其中的宮殿。<\/strong>它沒有說王、沒有說門閂、沒有說被擄。這樣的簡短，不是輕，而是一個很清楚的收束：同樣的火，同樣的結局。<\/p><p>我們要把這一節放在整章的中間：<strong>「弟兄」這個詞，在泰爾之後，立刻要在以東身上再出現一次（1:11），然後轉到亞捫，轉到猶大，轉到以色列。<\/strong>神記得的，不是誰屬於哪一個國家，而是誰曾經對誰說過「我們是一家」。<\/p>"},{"a":11,"z":12,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>כֹּה אָמַר יְהוָה עַל שְׁלֹשָׁה פִּשְׁעֵי אֱדוֹם וְעַל אַרְבָּעָה לֹא אֲשִׁיבֶנּוּ עַל רָדְפוֹ בַחֶרֶב אָחִיו וְשִׁחֵת רַחֲמָיו וַיִּטְרֹף לָעַד אַפּוֹ וְעֶבְרָתוֹ שְׁמָרָה נֶֽצַח וְשִׁלַּחְתִּי אֵשׁ בְּתֵימָן וְאָכְלָה אַרְמְנוֹת בָּצְרָֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「耶和華如此說：以東三番四次地犯罪，我必不免去她的刑罰；因為她拿刀追趕兄弟，毫無憐憫，發怒撕裂，永懷忿怒。我卻要降火在提幔，燒滅波斯拉的宮殿。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>以東<\/td><td>אֱדוֹם<\/td><td>edom<\/td><td>H123<\/td><td>以東（以掃的別名）<\/td><\/tr><tr><td>追趕<\/td><td>רָדְפוֹ<\/td><td>radefo<\/td><td>H7291<\/td><td>他追趕<\/td><\/tr><tr><td>刀<\/td><td>בַחֶרֶב<\/td><td>vacherev<\/td><td>H2719<\/td><td>用刀<\/td><\/tr><tr><td>兄弟<\/td><td>אָחִיו<\/td><td>akhiv<\/td><td>H251<\/td><td>他的兄弟<\/td><\/tr><tr><td>毀壞<\/td><td>וְשִׁחֵת<\/td><td>veshikhet<\/td><td>H7843<\/td><td>毀滅、敗壞<\/td><\/tr><tr><td>憐憫<\/td><td>רַחֲמָיו<\/td><td>rakhamav<\/td><td>H7356<\/td><td>他的憐憫（原指腹中的情感）<\/td><\/tr><tr><td>撕裂<\/td><td>וַיִּטְרֹף<\/td><td>vayitrof<\/td><td>H2963<\/td><td>撕裂、撕碎<\/td><\/tr><tr><td>忿怒<\/td><td>וְעֶבְרָתוֹ<\/td><td>ve'evrato<\/td><td>H5678<\/td><td>他的盛怒<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>憐憫<\/strong>：rakhamim 與「子宮」（rekhem）同一個字根，原指母親對腹中孩子的那種情感。「毀壞憐憫」（shikhet rakhamav）的意思是：他親手把這種本能的情感毀掉。<\/p><p><strong>兄弟<\/strong>：akh 在這裡是單數，指以東的「兄弟」，一般認為指以色列（創25:30以掃又名以東；申23:7「不可憎惡以東人，因為他是你的弟兄」）。<\/p><p><strong>發怒撕裂，永懷忿怒<\/strong>：這兩句的原文很難，古譯本與各現代譯本的讀法略有差異。主要的差別是：「怒氣撕裂」的主詞是誰、「永遠」與哪一個動詞相連，以及「永懷」的動詞原文是「保守」（shamar，守住不放）。和合本的讀法是：他的怒氣一直撕裂，他的忿怒一直保守。無論哪一種讀法，核心都是「不肯放下的恨」。<\/p>","exp":"<p>十一節的以東，與以色列是同一個祖先所生：以掃與雅各。<strong>神的審判在這裡與一份血緣有關：她「拿刀追趕兄弟」。<\/strong>前面的國家對以色列的人犯罪，大致是外人對外人；以東不是，她是兄弟。<\/p><p>罪名有三層，一層比一層深：第一，<strong>拿刀追趕<\/strong>，是行動；第二，<strong>毫無憐憫<\/strong>，是把心裡本能的柔軟毀掉；第三，<strong>永懷忿怒<\/strong>，是把怒氣收在心裡，不放下。原文的「憐憫」是從子宮來的字，是人最原始、最不用教的情感。以東把它毀了。經文沒有說他追趕的是哪一次戰爭，我們也不替它補上；經文要我們看見的是：<strong>一個人可以先把心硬了，手才會下得去；而恨，如果不放下，會一直在心裡繼續撕裂。<\/strong><\/p><p>這節讓我們把話說得更溫柔一點：阿摩司不是在教我們去恨以東。<strong>他把這個對象的名字說出來，是為了那個被追趕、被撕裂的兄弟。<\/strong>神的眼睛是看著受傷的人。<\/p><p>十二節還是同樣的火：降火在提幔，燒滅波斯拉的宮殿。提幔在以東南部，波斯拉在以東北部，兩個地方一南一北，是以東的兩頭。「從南到北」，沒有一個角落被留下。<\/p>"},{"a":13,"z":15,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>כֹּה אָמַר יְהוָה עַל שְׁלֹשָׁה פִּשְׁעֵי בְנֵֽי עַמּוֹן וְעַל אַרְבָּעָה לֹא אֲשִׁיבֶנּוּ עַל בִּקְעָם הָרוֹת הַגִּלְעָד לְמַעַן הַרְחִיב אֶת גְּבוּלָֽם וְהִצַּתִּי אֵשׁ בְּחוֹמַת רַבָּה וְאָכְלָה אַרְמְנוֹתֶיהָ בִּתְרוּעָה בְּיוֹם מִלְחָמָה בְּסַעַר בְּיוֹם סוּפָֽה וְהָלַךְ מַלְכָּם בַּגּוֹלָה הוּא וְשָׂרָיו יַחְדָּו אָמַר יְהוָֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「耶和華如此說：亞捫人三番四次地犯罪，我必不免去他們的刑罰；因為他們剖開基列的孕婦，擴張自己的境界。我卻要在爭戰吶喊的日子，旋風狂暴的時候，點火在拉巴的城內，燒滅其中的宮殿。他們的王和首領必一同被擄去。這是耶和華說的。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>剖開<\/td><td>בִּקְעָם<\/td><td>biq'am<\/td><td>H1234<\/td><td>他們剖開、劈開<\/td><\/tr><tr><td>孕婦<\/td><td>הָרוֹת<\/td><td>harot<\/td><td>H2030<\/td><td>懷孕的婦女<\/td><\/tr><tr><td>擴張<\/td><td>הַרְחִיב<\/td><td>harkhiv<\/td><td>H7337<\/td><td>使（疆界）擴大<\/td><\/tr><tr><td>境界<\/td><td>גְּבוּלָֽם<\/td><td>gevulam<\/td><td>H1366<\/td><td>他們的疆界<\/td><\/tr><tr><td>吶喊<\/td><td>בִּתְרוּעָה<\/td><td>bitru'ah<\/td><td>H8643<\/td><td>戰場的呼喊聲<\/td><\/tr><tr><td>旋風<\/td><td>בְּסַעַר<\/td><td>besa'ar<\/td><td>H5591<\/td><td>暴風、風暴<\/td><\/tr><tr><td>他們的王<\/td><td>מַלְכָּם<\/td><td>malkam<\/td><td>H4428<\/td><td>他們的王（或「米勒公」，亞捫人的神）<\/td><\/tr><tr><td>被擄<\/td><td>בַּגּוֹלָה<\/td><td>bagolah<\/td><td>H1473<\/td><td>到被擄之地<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>剖開孕婦<\/strong>：biqa'（剖開）加上 harot（孕婦），是戰爭暴行最極端的畫面之一。王下8章12節與15章16節也出現類似的句子。這些經文彼此對照，說明這種暴行不只出現在一個國家。<\/p><p><strong>擴張自己的境界<\/strong>：lema'an harkhiv gevulam，「為要使自己的疆界擴大」。罪的動機被寫得很清楚：不是仇恨，是版圖。<\/p><p><strong>他們的王<\/strong>：malkam 有兩種讀法。一，「他們的王」（和合本取此意）；二，Milkom（米勒公，亞捫人的神，王上11:5、7）。用子音 mlkm 這兩種讀法都通。如果是後者，意思是：連他們所拜的神，也要一起被擄去。本講義並陳兩者：第一種是和合本，第二種在古譯本裡也有，兩者都指向：沒有一個人，也沒有一個神，可以保護他們。<\/p><p><strong>旋風／吶喊<\/strong>：「戰爭吶喊的日子」與「旋風的日子」是並行的句子：戰場的喊聲，與天上的暴風，同一天。<\/p>","exp":"<p>十三節是這一章五個國家裡的最後一個，亞捫，也是罪名最慘烈的一個。<strong>「他們剖開基列的孕婦，擴張自己的境界。」<\/strong>這是整個列國神諭裡最難讀的一句。經文沒有加形容詞，沒有加感嘆，只是把動作與目的並排放在一起：剖開孕婦，為了擴張疆土。<\/p><p>在這裡，我們不要急著轉到審判。<strong>這一節首先要我們為那些人停下來：基列的婦女、她們腹中的孩子、她們的家人。<\/strong>經文提到的是她們的處境，而不是用她們來說別的事。在神的帳上，沒有一個人是「附帶的損失」。詩篇139篇13節說：「我的肺腑是你所造的；我在母腹中，你已覆庇我。」<\/p><p>審判的場景是戰爭的樣子：<strong>「在爭戰吶喊的日子，旋風狂暴的時候，點火在拉巴的城內」<\/strong>。拉巴是亞捫的京城。亞捫人曾經用刀來擴張疆界，如今，戰爭的吶喊與天上的旋風，一起臨到他們。十五節的結局是：<strong>他們的王和首領必一同被擄去<\/strong>；也有人讀為「米勒公與他的首領」，無論哪一種，經文說的是：沒有誰是例外。<\/p><p>然後，這個節奏要停下來。我們剛讀完五個國家的審判：大馬士革、迦薩、泰爾、以東、亞捫，都是以色列四周的鄰居。<strong>聽的人也許覺得痛快；但阿摩司的話還沒有說完。<\/strong>第二章，他要把同樣的格式，轉向猶大，再轉向以色列。這一章留給我們一個不舒服的問題：神的眼睛，是否只看鄰居？<\/p>"}],"2":[{"a":1,"z":3,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>כֹּה אָמַר יְהוָה עַל שְׁלֹשָׁה פִּשְׁעֵי מוֹאָב וְעַל אַרְבָּעָה לֹא אֲשִׁיבֶנּוּ עַל שָׂרְפוֹ עַצְמוֹת מֶֽלֶךְ אֱדוֹם לַשִּֽׂיד וְשִׁלַּחְתִּי אֵשׁ בְּמוֹאָב וְאָכְלָה אַרְמְנוֹת הַקְּרִיּוֹת וּמֵת בְּשָׁאוֹן מוֹאָב בִּתְרוּעָה בְּקוֹל שׁוֹפָֽר וְהִכְרַתִּי שׁוֹפֵט מִקִּרְבָּהּ וְכָל שָׂרֶיהָ אֶהֱרוֹג עִמּוֹ אָמַר יְהוָֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「耶和華如此說：摩押三番四次地犯罪，我必不免去她的刑罰；因為她將以東王的骸骨焚燒成灰。我卻要降火在摩押，燒滅加略的宮殿。摩押必在鬨嚷吶喊吹角之中死亡。我必剪除摩押中的審判者，將其中的一切首領和他一同殺戮。這是耶和華說的。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>如此<\/td><td>כֹּה<\/td><td>koh<\/td><td>H3541<\/td><td>如此、這樣<\/td><\/tr><tr><td>罪過<\/td><td>פִּשְׁעֵי<\/td><td>pishei<\/td><td>H6588<\/td><td>罪過、悖逆<\/td><\/tr><tr><td>必不免去<\/td><td>אֲשִׁיבֶנּוּ<\/td><td>ashivennu<\/td><td>H7725<\/td><td>我必使它轉回（收回）<\/td><\/tr><tr><td>骸骨<\/td><td>עַצְמוֹת<\/td><td>atsmot<\/td><td>H6106<\/td><td>骸骨、骨頭<\/td><\/tr><tr><td>成灰<\/td><td>לַשִּֽׂיד<\/td><td>lasid<\/td><td>H7875<\/td><td>成灰、成石灰<\/td><\/tr><tr><td>火<\/td><td>אֵשׁ<\/td><td>esh<\/td><td>H784<\/td><td>火<\/td><\/tr><tr><td>審判者<\/td><td>שׁוֹפֵט<\/td><td>shofet<\/td><td>H8199<\/td><td>審判者、裁判官<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>三番四次<\/strong>：原文直譯是「為三個罪過，為四個」，是希伯來詩歌常見的「三加一」遞進寫法。各家有三種看法：一是修辭，表示一次又一次、已經滿到溢出來；二是字面上數目，推算罪的件數；三是把它對上整卷書的結構。本講義取第一種：它是語言上的「滿溢」，不算數字，也不推論到底犯了第幾次。<\/p><p><strong>必不免去<\/strong>：原文 אֲשִׁיבֶנּוּ，動詞是 שׁוּב（轉回），意思是「我不使它轉回、不收回」。「它」指什麼？各家有「刑罰」（和合本）、「我的話」、「我的怒氣」等補法；整體意思一致：這件事神不當作沒發生。這個字是全卷書的追蹤字，本章三次出現。<\/p><p><strong>成灰<\/strong>：לַשִּׂיד 可譯「成灰」或「成石灰」。以東王的骸骨被怎樣焚燒、發生在什麼時候，經文沒有交代，各家有人聯想到列王紀下三章，有人認為是別處未記的事；我們不補細節，只讀神說的。<\/p>","exp":"<p>二章一節，接著前面幾則審判，講到摩押。<strong>耶和華如此說：摩押三番四次地犯罪，我必不免去她的刑罰。<\/strong>這句話，我們已經聽過幾次，可是每聽一次，它的聲音就近一點。「我必不免去」，原文用的是「轉回」那個字：神說，這件事，我不使它轉回，也不收回。這不是神在發脾氣，是神對一件事，鄭重地說：我不能當作沒有發生。<\/p><p>罪名是什麼？<strong>因為她將以東王的骸骨焚燒成灰。<\/strong>人已經死了，仇還在；對活人的恨，延伸到一個死去的人的骨頭上，要他連安息的地方也沒有。這裡值得停一下：被燒的，是以東王，是和以色列也有舊怨的鄰邦的王。可是，神為他說話。神不只在以色列被欺負的時候動怒，神是列國的神，連一個外邦人死後的尊嚴，祂也記得。<\/p><p>二、三節是宣告：<strong>我卻要降火在摩押，燒滅加略的宮殿。<\/strong>用火對待別人的，自己也要在火裡，聽見自己的吶喊。三節更說：<strong>我必剪除摩押中的審判者。<\/strong>連本該主持公道的人，也不在例外。最後一句「這是耶和華說的」，是神親口為這件事蓋的印。這一段，還沒有說到以色列，可是，聽的人已經被帶進神的公義裡了。<\/p>"},{"a":4,"z":5,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>כֹּה אָמַר יְהוָה עַל שְׁלֹשָׁה פִּשְׁעֵי יְהוּדָה וְעַל אַרְבָּעָה לֹא אֲשִׁיבֶנּוּ עַֽל מָאֳסָם אֶת תּוֹרַת יְהוָה וְחֻקָּיו לֹא שָׁמָרוּ וַיַּתְעוּם כִּזְבֵיהֶם אֲשֶׁר הָלְכוּ אֲבוֹתָם אַחֲרֵיהֶֽם וְשִׁלַּחְתִּי אֵשׁ בִּֽיהוּדָה וְאָכְלָה אַרְמְנוֹת יְרוּשָׁלִָֽם׃<\/p><\/blockquote>","lit":"<blockquote><p>「耶和華如此說：猶大人三番四次地犯罪，我必不免去他們的刑罰；因為他們厭棄耶和華的訓誨，不遵守他的律例。他們列祖所隨從虛假的偶像使他們走迷了。我卻要降火在猶大，燒滅耶路撒冷的宮殿。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>厭棄<\/td><td>מָאֳסָם<\/td><td>maasam<\/td><td>H3988<\/td><td>他們厭棄、看為無用<\/td><\/tr><tr><td>訓誨<\/td><td>תּוֹרַת<\/td><td>torat<\/td><td>H8451<\/td><td>訓誨、律法、教導<\/td><\/tr><tr><td>律例<\/td><td>וְחֻקָּיו<\/td><td>vechukkav<\/td><td>H2706<\/td><td>他的律例、規定<\/td><\/tr><tr><td>遵守<\/td><td>שָׁמָרוּ<\/td><td>shamaru<\/td><td>H8104<\/td><td>守住、遵守<\/td><\/tr><tr><td>虛假<\/td><td>כִּזְבֵיהֶם<\/td><td>kizveihem<\/td><td>H3577<\/td><td>他們的謊言、虛假<\/td><\/tr><tr><td>走迷<\/td><td>וַיַּתְעוּם<\/td><td>vayyatum<\/td><td>H8582<\/td><td>使他們走迷了、流蕩<\/td><\/tr><tr><td>耶路撒冷<\/td><td>יְרוּשָׁלִָֽם<\/td><td>yerushalaim<\/td><td>H3389<\/td><td>耶路撒冷<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>訓誨<\/strong>：תּוֹרָה 可譯「律法」，也可譯「教導」。這裡與「律例」並列，指神所傳給百姓的整個教導，不只是儀式條文。<\/p><p><strong>虛假的偶像<\/strong>：原文直譯是「他們的謊言」。有人認為這是偶像的諷刺說法（偶像本身就是謊言），有人認為指虛
