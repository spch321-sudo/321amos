的用語，神悅納祭物，是「聞」到馨香；利未記二十六章31節，神也說過「我不聞你們馨香的香氣」。<\/p><p><strong>燔祭、素祭、平安祭<\/strong>：三樣都是利未記一至三章所規定的祭，是整個獻祭系統的重點。這節話不是在挑剔某一種祭，是在說，連整套祭，神也不悅納。<\/p>","exp":"<p>二十一節，神開口，說了一個很重的字：<strong>我厭惡你們的節期，也不喜悅你們的嚴肅會。<\/strong>「厭惡」之後，還有「鄙棄」，兩個動詞一起壓下來。他們過節、聚會、獻祭，都沒有少，可是神說，我不要。<\/p><p>二十二節把三種祭一起說出來：燔祭、素祭、平安祭，是利未記裡規定的全套敬拜。<strong>神不是在說，敬拜是壞事；神是在說，當敬拜與生活斷了線，祂不能接受。<\/strong>這一點很重要：這一章兩面並陳。一面，神真的喜悅敬拜，詩篇滿了神要人歌唱的話；另一面，神不要一個跟城門口、跟貧民、跟義人，完全沒有關係的敬拜。<\/p><p>這句話，使我們想起詩篇五十一篇17節：神所要的祭就是憂傷的靈。也使我們想起耶穌說的：若想起弟兄向你懷怨，就把禮物留在壇前，先去和好。<strong>神要的，從來不是在敬拜和生活之間，選一個。<\/strong><\/p><p>所以，這一段的功課，不是去批評任何一間教會，也不是不去敬拜了。是問：我今天帶到神面前的，是一個完整的人嗎？我從哪裡來到這裡，我要往哪裡回去？<\/p>"},{"a":23,"z":24,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הָסֵר מֵעָלַי הֲמוֹן שִׁרֶיךָ וְזִמְרַת נְבָלֶיךָ לֹא אֶשְׁמָֽע וְיִגַּל כַּמַּיִם מִשְׁפָּט וּצְדָקָה כְּנַחַל אֵיתָֽן׃<\/p><\/blockquote>","lit":"<blockquote><p>「要使你們歌唱的聲音遠離我，因為我不聽你們彈琴的響聲。惟願公平如大水滾滾，使公義如江河滔滔。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>遠離<\/td><td>הָסֵר<\/td><td>haser<\/td><td>H5493<\/td><td>拿走（命令）<\/td><\/tr><tr><td>響聲<\/td><td>הֲמוֹן<\/td><td>hamon<\/td><td>H1995<\/td><td>喧嚷聲、一大群<\/td><\/tr><tr><td>聽<\/td><td>אֶשְׁמָֽע<\/td><td>eshma<\/td><td>H8085<\/td><td>我聽<\/td><\/tr><tr><td>滾滾<\/td><td>וְיִגַּל<\/td><td>veyiggal<\/td><td>H1556<\/td><td>讓它滾動<\/td><\/tr><tr><td>公平<\/td><td>מִשְׁפָּט<\/td><td>mishpat<\/td><td>H4941<\/td><td>公平<\/td><\/tr><tr><td>公義<\/td><td>וּצְדָקָה<\/td><td>utsedaqah<\/td><td>H6666<\/td><td>公義<\/td><\/tr><tr><td>江河<\/td><td>כְּנַחַל<\/td><td>kenachal<\/td><td>H5158<\/td><td>像溪流<\/td><\/tr><tr><td>滔滔<\/td><td>אֵיתָן<\/td><td>eitan<\/td><td>H386<\/td><td>常流不斷的<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>遠離（haser）<\/strong>：原文是命令語氣：「拿走！」，像一個人受不了耳邊的聲音。<\/p><p><strong>響聲（hamon）<\/strong>：這個字也指「一大群、喧嘩」。他們的歌聲，在神耳中，不是歌，是一片噪音。<\/p><p><strong>我不聽（lo eshma）<\/strong>：「聽」是全卷追蹤字。一節神說：你們要聽；這裡，神說：我不聽。<\/p><p><strong>滾滾（yiggal）<\/strong>：與「被擄」（galoh）不是同一個字根，但聲音相近。這個形式可以讀為願望（「願它滾動」），也可以讀為宣告（「它將滾動」）。和合本取「惟願」，本講義跟從。<\/p><p><strong>江河滔滔（nachal eitan）<\/strong>：eitan 的意思是「恆常不斷的」。巴勒斯坦的溪河，多是雨季才有水（參伯六章15至17節）；「常流不斷」是說：公義不能只在節期裡出現，要像一年四季都有水的江河。<\/p><p><strong>公平與公義<\/strong>：追蹤字。二十四節是全卷的高點，並與八節「召海水澆在地上」遙遙呼應：那位把海水澆在地上的神，願意公平如水，澆在這片土地上。<\/p>","exp":"<p>二十三節，神的話更重：<strong>要使你們歌唱的聲音遠離我，因為我不聽你們彈琴的響聲。<\/strong>這是一個很難聽見的句子。歌唱，是人最美的敬拜之一；可是神說，拿走。神不是不愛歌聲，是不要一種離開了公平的歌聲。<\/p><p>請你回想一節：神說，你們要聽我的哀歌。他們不聽。於是到了這裡，神說，我也不聽你們的歌。<strong>這是神的「不聽」，也是人的「不聽」的回聲。<\/strong>兩邊的耳朵，都閉上了；可是，神的耳朵沒有永遠閉上，因為下一節，是整卷書的高點。<\/p><p>二十四節：<strong>惟願公平如大水滾滾，使公義如江河滔滔。<\/strong>這不是細水，也不是春天才有的小溪；原文的「江河」，是一年四季不乾涸的河。這是神心裡的願望：公平與公義，像大水，從城門口，一直流到葡萄園、流到貧民的門口。<\/p><p>這句話，常被剪下來貼在海報上；可是，在它原來的位置，它在「我厭惡」「我不聽」之後。<strong>它不是敬拜的替代品，是敬拜長出來的果子。<\/strong>認識神的人，必然看見倒在地上的人。這一節不是革命的口號，是神自己的心願：祂要的，是這個。<\/p>"},{"a":25,"z":27,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הַזְּבָחִים וּמִנְחָה הִֽגַּשְׁתֶּם לִי בַמִּדְבָּר אַרְבָּעִים שָׁנָה בֵּית יִשְׂרָאֵֽל וּנְשָׂאתֶם אֵת סִכּוּת מַלְכְּכֶם וְאֵת כִּיּוּן צַלְמֵיכֶם כּוֹכַב אֱלֹהֵיכֶם אֲשֶׁר עֲשִׂיתֶם לָכֶֽם וְהִגְלֵיתִי אֶתְכֶם מֵהָלְאָה לְדַמָּשֶׂק אָמַר יְהוָה אֱלֹהֵֽי צְבָאוֹת שְׁמֽוֹ׃<\/p><\/blockquote>","lit":"<blockquote><p>「「以色列家啊，你們在曠野四十年，豈是將祭物和供物獻給我呢？你們抬著為自己所造之摩洛的帳幕和偶像的龕，並你們的神星。所以我要把你們擄到大馬士革以外。」這是耶和華－名為萬軍之神說的。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>祭物<\/td><td>הַזְּבָחִים<\/td><td>hazzevachim<\/td><td>H2077<\/td><td>祭物、祭牲<\/td><\/tr><tr><td>曠野<\/td><td>בַמִּדְבָּר<\/td><td>bammidbar<\/td><td>H4057<\/td><td>曠野<\/td><\/tr><tr><td>四十<\/td><td>אַרְבָּעִים<\/td><td>arba'im<\/td><td>H705<\/td><td>四十<\/td><\/tr><tr><td>帳幕／塞庫<\/td><td>סִכּוּת<\/td><td>sikkut<\/td><td>H5522<\/td><td>帳幕，或神名 Sikkuth<\/td><\/tr><tr><td>你們的王<\/td><td>מַלְכְּכֶם<\/td><td>malkekhem<\/td><td>H4432<\/td><td>你們的王<\/td><\/tr><tr><td>神星<\/td><td>כִּיּוּן<\/td><td>kiyyun<\/td><td>H3594<\/td><td>Kiyyun（星神名，意義有爭議）<\/td><\/tr><tr><td>星<\/td><td>כּוֹכַב<\/td><td>kokhav<\/td><td>H3556<\/td><td>星<\/td><\/tr><tr><td>擄<\/td><td>וְהִגְלֵיתִי<\/td><td>vehiglleti<\/td><td>H1540<\/td><td>我要使你們被擄<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>豈是……嗎？（五章25節）<\/strong>：原文是一個以「嗎」帶出的問句，答案可以有三種讀法：（一）答案是「沒有」：曠野四十年，敬拜的本質，從來不是祭物（參耶七章22節）；（二）答案是「有，可是同時帶著別的神」（徒七章42至43節的用法接近這個讀法）；（三）答案是「有，但那不是重點」。本講義把問題留在這裡：它問的是敬拜的心，不是在廢除祭祀。<\/p><p><strong>你們抬著（五章26節）<\/strong>：原文的動詞，可以譯為過去（你們曾抬著），也可以譯為將來（你們將要抬著）。和合本取過去。<\/p><p><strong>Sikkuth 與 Kiyyun<\/strong>：這兩個詞，有人認為是兩個星神的名字（與美索不達米亞的神名有關），有人認為 Sikkuth 是「帳幕」（sukkat）。和合本沿用七十士譯本的讀法，譯作「摩洛的帳幕」，並把 Kiyyun 譯為「偶像的龕」與「神星」。徒七章43節，司提反引用時，作「摩洛的帳幕和理番神的星」。我們不替這些神名下定論，只讀神的重點：他們為自己所造的。<\/p><p><strong>大馬士革以外（五章27節）<\/strong>：阿摩司說的是「大馬士革」，徒七章43節作「巴比倫」；這是新約作者在引用時，按他所處的歷史說的。<\/p>","exp":"<p>二十五節，神問了一個問題：<strong>以色列家啊，你們在曠野四十年，豈是將祭物和供物獻給我呢？<\/strong>這個問句，答案不止一個。有人讀為「沒有」：曠野四十年，神與百姓的關係，一開始就不是靠祭物維持的；有人讀為有，可是你們同時帶著別的神；有人讀為「有，但那不是重點」。我們把這些讀法並排放著，不急著下結論。<strong>可以確定的是：神把他們帶回曠野，問他們：你們最初，是因為什麼，跟隨我？<\/strong><\/p><p>二十六節，神說出他們抬著的東西：為自己所造的神像、星神。名字的讀法有爭論，我們不替它們下定論。<strong>重點是那四個字：為自己所造。<\/strong>人若不尋求神，就去造神；造出來的神，總是方便的、可以扛在肩上、跟著自己走的神。<\/p><p>二十七節，結局是：我要把你們擄到大馬士革以外。這是神對北國的審判。新約司提反在使徒行傳七章42至43節，引用這段話時，把它說成：因此，我要把你們遷到巴比倫外去。這是新約自己的引用，我們照著它說，不另外延伸。<\/p><p>本章最後一句，是：<strong>這是耶和華，名為萬軍之神說的。<\/strong>與八節「耶和華是他的名」前後呼應：那位造星辰的，也是說話算數的。<\/p><p>最後的提醒：審判的話，不是報復，是一位神在一次又一次，用各樣的聲音，叫人回頭。哀歌的開頭，是「要聽」；結尾，是神的名字。他仍然在說話。<\/p>"}],"6":[{"a":1,"z":1,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הוֹי הַשַּׁאֲנַנִּים בְּצִיּוֹן וְהַבֹּטְחִים בְּהַר שֹׁמְרוֹן נְקֻבֵי רֵאשִׁית הַגּוֹיִם וּבָאוּ לָהֶם בֵּית יִשְׂרָאֵֽל׃<\/p><\/blockquote>","lit":"<blockquote><p>「國為列國之首，人最著名，且為以色列家所歸向，在錫安和撒馬利亞山安逸無慮的，有禍了！」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>有禍了<\/td><td>הוֹי<\/td><td>hoy<\/td><td>H1945<\/td><td>禍哉（先知的哀號與警告）<\/td><\/tr><tr><td>安逸無慮的<\/td><td>הַשַּׁאֲנַנִּים<\/td><td>hasha'ananim<\/td><td>H7600<\/td><td>安逸、自在、無憂無慮的人<\/td><\/tr><tr><td>倚靠<\/td><td>וְהַבֹּטְחִים<\/td><td>vehabotekhim<\/td><td>H982<\/td><td>覺得穩妥、倚靠、有恃無恐<\/td><\/tr><tr><td>錫安<\/td><td>בְּצִיּוֹן<\/td><td>betsiyyon<\/td><td>H6726<\/td><td>錫安（耶路撒冷，南國）<\/td><\/tr><tr><td>撒馬利亞<\/td><td>שֹׁמְרוֹן<\/td><td>shomron<\/td><td>H8111<\/td><td>撒馬利亞（北國的首都）<\/td><\/tr><tr><td>著名的<\/td><td>נְקֻבֵי<\/td><td>neqube<\/td><td>H5344<\/td><td>被點名的、有名望的人<\/td><\/tr><tr><td>首<\/td><td>רֵאשִׁית<\/td><td>reshit<\/td><td>H7225<\/td><td>頭一個、首位、最初<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>有禍了（hoy）<\/strong>：這個字原是葬禮上的哀號，「哎呀」「可憐哪」的聲音。先知用它開口，等於是在活人還吃喝宴樂的時候，先替他們哀哭。五章18節也用過同一個字，我們要留意，這是哀歌的口氣，不是幸災樂禍。<\/p><p><strong>安逸無慮的、倚靠<\/strong>：兩個詞排在一起，一個說「安逸」，一個說「覺得穩妥」。這兩個字本身未必是壞字，詩篇也有人倚靠耶和華而得安穩；問題在於，這裡的穩妥，倚靠的不是耶和華，而是錫安與撒馬利亞山這些看得見的靠山。<\/p><p><strong>「國為列國之首，人最著名」<\/strong>：這一句的文法有兩種讀法。和合本把它讀成「國」是列國之首；不少學者讀成「列國之首中被點名的人」，也就是有名望的領袖。本講義取後者為主，因為下一句「以色列家所歸向」，講的是百姓向這些人求助、歸向他們；不過兩種讀法都指向同一件事：站在高位的人，承擔更重的責任。<\/p><p><strong>錫安和撒馬利亞山<\/strong>：阿摩司是南國猶大的提哥亞人，卻向北國說話；他在這裡把南北兩座城並列，說的是整個以色列家的領袖。<\/p>","exp":"<p>六章一節，一開口就是一聲哀號：<strong>安逸無慮的，有禍了！<\/strong>這是先知的口氣，卻像一個人站在人家門外，聽見裡面笑聲很大，心裡先哭了。<\/p><p>阿摩司指著兩座山說話，一個是錫安，一個是撒馬利亞山。一座是南國的聖城，一座是北國的首都。<strong>兩邊的領袖，都覺得自己穩如泰山。<\/strong>他們有理由：撒馬利亞所在的時代，國界擴張、貿易興旺，百姓去歸向的，就是這些站在高位上、被人點名的人。一個人被這樣看重久了，很容易把「被人倚靠」，當成「自己有靠山」。<\/p><p>請你留意這一節的位置。五章把敬拜與公義講完，六章一開頭，不是再罵一次拜偶像，而是點出另一種病：<strong>不是做了很多壞事，而是什麼都不覺得需要擔心。<\/strong>阿摩司整卷書，從來沒有說安穩本身是罪；他說的是，當一個人的安穩，只靠自己的位置、自己的山，而不靠耶和華，這份安穩就是一個哀號的理由。<\/p><p>我們也要把這一節的重心守住：這不是對所有享有平安的人的定罪，也不是叫人不敢過好日子。經文講的是一群人，在百姓所歸向的位置上，卻以為災禍離自己很遠。神先為他們哀哭，這一點，很要緊。<\/p>"},{"a":2,"z":2,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>עִבְרוּ כַֽלְנֵה וּרְאוּ וּלְכוּ מִשָּׁם חֲמַת רַבָּה וּרְדוּ גַת פְּלִשְׁתּים הֲטוֹבִים מִן הַמַּמְלָכוֹת הָאֵלֶּה אִם רַב גְּבוּלָם מִגְּבֻלְכֶֽם׃<\/p><\/blockquote>","lit":"<blockquote><p>「你們要過到甲尼察看，從那裡往大城哈馬去，又下到非利士人的迦特，看那些國比你們的國還強嗎？境界比你們的境界還寬嗎？」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>過到<\/td><td>עִבְרוּ<\/td><td>ivru<\/td><td>H5674<\/td><td>經過、走過去<\/td><\/tr><tr><td>甲尼<\/td><td>כַֽלְנֵה<\/td><td>kalneh<\/td><td>H3641<\/td><td>甲尼（北敘利亞一帶的城）<\/td><\/tr><tr><td>察看<\/td><td>וּרְאוּ<\/td><td>ure'u<\/td><td>H7200<\/td><td>看、察看<\/td><\/tr><tr><td>哈馬<\/td><td>חֲמַת<\/td><td>hamat<\/td><td>H2579<\/td><td>哈馬（敘利亞中部的大城）<\/td><\/tr><tr><td>迦特<\/td><td>גַת<\/td><td>gat<\/td><td>H1661<\/td><td>迦特（非利士的城）<\/td><\/tr><tr><td>比……強嗎<\/td><td>הֲטוֹבִים<\/td><td>hatovim<\/td><td>H2896<\/td><td>他們比較好嗎、比較強嗎<\/td><\/tr><tr><td>境界<\/td><td>גְּבוּלָם<\/td><td>gevulam<\/td><td>H1366<\/td><td>疆界、地界<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>甲尼、哈馬、迦特<\/strong>：三座城，一座在北，一座在東北，一座在西南，大致是以色列四周的名城。<strong>「大城哈馬」<\/strong>，原文是 hamat rabbah，是「大哈馬」。<\/p><p><strong>這一節是警告，還是譏諷？<\/strong>解經家分成幾種看法：第一，這是從已經被攻破的城得教訓：那些城都衰落了，你們以為自己比他們好嗎？第二，這是譏諷：你們靠地大、國強而安逸，其實你們並不比這些鄰國更有保障。第三，有學者認為這一節是後來編輯加上去的。本講義採第二種為主：不管歷史上這些城何時衰落，這一節的力量，在於把一個以為自己特別的人，拉回到與眾人同等的位置。<\/p><p><strong>「比……還強嗎？」<\/strong>原文是一個問句，用的字是 tov（好），意思是「比較好」，不只是「比較強」。這是一個讓人說不出話的問題。<\/p>","exp":"<p>二節換了一個方式說話。先知不再直接指責，而是叫人去走一趟：<strong>你們要過到甲尼察看，從那裡往大城哈馬去，又下到非利士人的迦特。<\/strong>三個地名，走過去，看一看，再回來回答一個問題：這些國，比你們的國還強嗎？境界，比你們的境界還寬嗎？<\/p><p>這一句的意思，不難懂。<strong>安逸的人最常用的理由，是「我們與眾不同」。<\/strong>我們的國家有神的殿，我們有大衛的後代，我們是被揀選的。阿摩司不否認被揀選，三章2節已經講過，神只認識這一個家，因此追討也特別重。可是在六章，他把被揀選變成一面鏡子：<strong>你們看看別人，別人也有大城，也有大境界，也有過風光的日子。<\/strong>被揀選，不是免死金牌。<\/p><p>這裡沒有一個確切的時間表，我們也不替它補上。先知只問一個問題，問的人是你：<strong>你以為的特別，是什麼？<\/strong>如果答案是人口、土地、軍力、位置、人脈、年資，那這些，鄰國也有。<\/p><p>對今天的教會也是一樣。一間有歷史、有人數、有好環境的教會，最容易在心裡悄悄問：「我們和別人不一樣吧？」神的回答，通常不是責備，而是一次安靜的邀請：<strong>走出去看看，你以為的靠山，別人也有過。<\/strong>然後，回來，問一問，我們的靠山，到底是什麼。<\/p>"},{"a":3,"z":3,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הַֽמְנַדִּים לְיוֹם רָע וַתַּגִּישׁוּן שֶׁבֶת חָמָֽס׃<\/p><\/blockquote>","lit":"<blockquote><p>「你們以為降禍的日子還遠，坐在位上盡行強暴。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>以為……還遠<\/td><td>הַֽמְנַדִּים<\/td><td>hamnaddim<\/td><td>H5077<\/td><td>把……推開、擺到很遠的地方<\/td><\/tr><tr><td>日子<\/td><td>לְיוֹם<\/td><td>leyom<\/td><td>H3117<\/td><td>日子<\/td><\/tr><tr><td>禍<\/td><td>רָע<\/td><td>ra<\/td><td>H7451<\/td><td>惡、災禍<\/td><\/tr><tr><td>坐上<\/td><td>וַתַּגִּישׁוּן<\/td><td>vattagishun<\/td><td>H5066<\/td><td>使……靠近、帶近<\/td><\/tr><tr><td>位<\/td><td>שֶׁבֶת<\/td><td>shevet<\/td><td>H7675<\/td><td>坐位、坐著、居住<\/td><\/tr><tr><td>強暴<\/td><td>חָמָֽס<\/td><td>hamas<\/td><td>H2555<\/td><td>暴力、不義的欺壓<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>以為……還遠（hamnaddim）<\/strong>：原文的動詞是「把它推開」，不是「以為」。這是一個很有畫面的字：人用雙手把災禍推到天邊去。和合本譯作「以為降禍的日子還遠」，抓到了意思。<\/p><p><strong>坐在位上盡行強暴<\/strong>：原文是 vattagishun shevet hamas，直譯接近「你們使強暴的坐位靠近」。和合本註腳的另一個譯法是「行強暴使審判臨近」。兩種讀法同時成立：一方面，他們坐在位子上行強暴；另一方面，他們一面把災禍推得很遠，一面用自己的行為，把它拉得很近。<\/p><p><strong>hamas<\/strong>：不只是肢體上的暴力，也指不公平的剝削與欺壓。與五章、八章所說的欺壓窮人，是同一個脈絡。<\/p>","exp":"<p>三節只有一句話，卻很重：<strong>你們以為降禍的日子還遠，坐在位上盡行強暴。<\/strong>這一句，把前兩節的安逸，連上了後面的欺壓。<\/p><p>原文的動作很有力。前半句，雙手把災禍推走，推得遠遠的，推到「與我無關」的地方；後半句，卻是同一雙手，把強暴的座位拉過來，坐上去。<strong>他們一面把災禍推遠，一面用自己的行為，把它拉近。<\/strong>和合本註腳把這兩個動作合併，譯成「行強暴使審判臨近」，點出一個很殘酷的諷刺。<\/p><p>請留意，這裡的「強暴」，在一個安逸的人身上，往往不是一件拿刀的事，而是一個座位。<strong>他們坐在位上，用位子的權力，做一些別人不敢說不的事。<\/strong>我們不必替這一節添加任何具體的案例，也不把它套到任何一個今天的人或機構身上。這一節，是給每一個有座位的人，一面安靜的鏡子：我坐的位子，我是怎樣使用它？<\/p><p>還要說一句關心的話。<strong>受過這種欺壓的人，讀到這一節，可以先鬆一口氣：神看見了。<\/strong>神說「有禍了」的對象，不是受欺壓的人，是坐在位上的人。祂先站在被壓的那一邊，祂的哀號，是為了不再有人被壓。<\/p>"},{"a":4,"z":5,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הַשֹּֽׁכְבִים עַל מִטּוֹת שֵׁן וּסְרֻחִים עַל עַרְשׂוֹתָם וְאֹכְלִים כָּרִים מִצֹּאן וַעֲגָלִים מִתּוֹךְ מַרְבֵּֽק הַפֹּרְטִים עַל פִּי הַנָּבֶל כְּדָוִיד חָשְׁבוּ לָהֶם כְּלֵי שִֽׁיר׃<\/p><\/blockquote>","lit":"<blockquote><p>「你們躺臥在象牙床上，舒身在榻上，吃群中的羊羔，棚裡的牛犢；彈琴鼓瑟唱消閑的歌曲，為自己製造樂器，如同大衛所造的；」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>躺臥<\/td><td>הַשֹּֽׁכְבִים<\/td><td>hashokhevim<\/td><td>H7901<\/td><td>躺臥、躺著的人<\/td><\/tr><tr><td>象牙<\/td><td>שֵׁן<\/td><td>shen<\/td><td>H8127<\/td><td>牙、象牙<\/td><\/tr><tr><td>舒身<\/td><td>וּסְרֻחִים<\/td><td>usruhim<\/td><td>H5628<\/td><td>伸展、舒展身體、懶洋洋地攤開<\/td><\/tr><tr><td>羊羔<\/td><td>כָּרִים<\/td><td>karim<\/td><td>H3733<\/td><td>羊羔、嫩羊<\/td><\/tr><tr><td>彈琴<\/td><td>הַפֹּרְטִים<\/td><td>haportim<\/td><td>H6527<\/td><td>隨興彈奏（此字只出現一次）<\/td><\/tr><tr><td>瑟<\/td><td>הַנָּבֶל<\/td><td>hanavel<\/td><td>H5035<\/td><td>瑟、弦樂器<\/td><\/tr><tr><td>大衛<\/td><td>כְּדָוִיד<\/td><td>kedavid<\/td><td>H1732<\/td><td>大衛<\/td><\/tr><tr><td>樂器<\/td><td>כְּלֵי<\/td><td>kele<\/td><td>H3627<\/td><td>器具、器皿、樂器<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>躺臥、舒身<\/strong>：兩個動詞都是形容身體的鬆弛。<strong>舒身（sarakh）<\/strong>本義是「伸出、垂下」，像布料垂下來、葡萄藤蔓延，用在人身上，是毫不緊繃、整個人攤開在榻上。<\/p><p><strong>彈琴（portim）<\/strong>：這個動詞整本聖經只出現這一次，意思不太確定。常見的猜測是「隨意彈奏、即興哼唱」。和合本譯作「彈琴鼓瑟唱消閑的歌曲」，是依這個方向。<\/p><p><strong>如同大衛所造的<\/strong>：原文可以讀成「像大衛那樣」，也可以讀成「他們自以為像大衛」。重點不是他們不能有音樂，而是他們用大衛的名義，造出自己享受的音樂。聖經記載的大衛，把琴用在敬拜與撫慰人心（撒上16:23；代上23:5），不是消遣自己。<\/p><p><strong>羊羔、牛犢<\/strong>：是最嫩、最貴的肉。他們吃的不是日常的飯，是留給節期獻祭的好東西。<\/p>","exp":"<p>四、五節，是一幅很生動的畫：<strong>你們躺臥在象牙床上，舒身在榻上，吃群中的羊羔，棚裡的牛犢；彈琴鼓瑟唱消閑的歌曲，為自己製造樂器，如同大衛所造的。<\/strong><\/p><p>我們先把畫面看清楚。象牙床，是考古在撒馬利亞所發現的一類精緻裝飾，代表貴重的家具。他們躺著，身體整個攤開；吃的是羊群裡最嫩的羊羔、棚子裡專門餵肥的牛犢；耳朵聽的，是自己即興哼出來的小曲。<strong>這一幅畫，沒有一處是罪名，每一處都是享受。<\/strong>阿摩司沒有說吃羊羔是罪，也沒有說彈琴是罪，更沒有叫人睡硬板床。<\/p><p>他挑出來的是三樣東西：<strong>舒身、消閑、為自己。<\/strong>舒身，是整個人放鬆到不再警醒；消閑，是歌曲只是用來打發時間，沒有一點敬拜的重量；為自己，是連樂器也要自己造，造得像大衛一樣好。<strong>大衛用琴，是向神唱，也是為別人唱；他們用琴，唱的是自己。<\/strong><\/p><p>請留意，這裡有一個很深的對比。大衛在悲傷的時候，也彈琴；他的歌，有哀歌，也有認罪。<strong>而這些人的歌，只有消閑，沒有哀哭。<\/strong>他們的歌曲裡，已經沒有留給別人的眼淚的空間。<\/p><p>我們讀這幾節，不是來清點今天的人有沒有床、有沒有琴。<strong>真正要問的，是我的享受，有沒有一個出口，讓我能對別人的痛，有一點感覺？<\/strong>享受不是罪，麻木才是。<\/p>"},{"a":6,"z":7,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הַשֹּׁתִים בְּמִזְרְקֵי יַיִן וְרֵאשִׁית שְׁמָנִים יִמְשָׁחוּ וְלֹא נֶחְלוּ עַל שֵׁבֶר יוֹסֵֽף לָכֵן עַתָּה יִגְלוּ בְּרֹאשׁ גֹּלִים וְסָר מִרְזַח סְרוּחִֽים׃<\/p><\/blockquote>","lit":"<blockquote><p>「以大碗喝酒，用上等的油抹身，卻不為約瑟的苦難擔憂。所以這些人必在被擄的人中首先被擄；舒身的人荒宴之樂必消滅了。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>大碗<\/td><td>בְּמִזְרְקֵי<\/td><td>bemizreqe<\/td><td>H4219<\/td><td>碗、獻祭用的大碗<\/td><\/tr><tr><td>酒<\/td><td>יַיִן<\/td><td>yayin<\/td><td>H3196<\/td><td>酒<\/td><\/tr><tr><td>上等的<\/td><td>וְרֵאשִׁית<\/td><td>vereshit<\/td><td>H7225<\/td><td>最初的、最好的<\/td><\/tr><tr><td>擔憂<\/td><td>נֶחְלוּ<\/td><td>nehlu<\/td><td>H2470<\/td><td>生病、憂傷、難過<\/td><\/tr><tr><td>苦難<\/td><td>שֵׁבֶר<\/td><td>sheber<\/td><td>H7667<\/td><td>破裂、破碎、崩塌<\/td><\/tr><tr><td>約瑟<\/td><td>יוֹסֵֽף<\/td><td>yosef<\/td><td>H3130<\/td><td>約瑟（指北國以色列）<\/td><\/tr><tr><td>首先<\/td><td>בְּרֹאשׁ<\/td><td>berosh<\/td><td>H7218<\/td><td>頭、為首<\/td><\/tr><tr><td>被擄<\/td><td>יִגְלוּ<\/td><td>yiglu<\/td><td>H1540<\/td><td>被擄去、流亡<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>大碗（mizraq）<\/strong>：這是聖殿裡用來盛血、盛酒獻祭的碗。他們用的是獻祭用的大碗在喝酒，不是一小杯，而是一碗一碗地喝。<\/p><p><strong>上等的油（reshit shemanim）<\/strong>：reshit 這個字，是「首」，也是「最好的」。六章一節的「列國之首」，這裡的「上等的油」，七節的「首先被擄」，三處是同一個字根的呼應：他們要最好的、最先的，結果也成為第一批被帶走的人。這是阿摩司刻意的遊戲，我們在這一章的副題「安、逸、首」，就是讀到這裡。<\/p><p><strong>擔憂（nehlu）<\/strong>：這個動詞的字根，本是「生病」。「不為約瑟的苦難擔憂」，直譯接近「不為約瑟的破碎而生病」，也就是：看見別人破碎，自己卻一點也不難受，連一點被觸動的感覺都沒有。<\/p><p><strong>約瑟的苦難（sheber yosef）<\/strong>：sheber 是破裂、崩塌，用在傷口上，是骨折。「約瑟」是北國的代稱，因為以法蓮、瑪拿西是約瑟的兩個兒子。<\/p><p><strong>荒宴（marzeah）<\/strong>：七節的「荒宴之樂」，原文是 marzeah，是古代近東一種放縱飲宴的聚會，在鄰近的文獻中也出現過，常常伴隨酗酒。耶利米書十六章5節，用同一個字，指喪家的筵席。<\/p>","exp":"<p>六節是整段的重心：<strong>以大碗喝酒，用上等的油抹身，卻不為約瑟的苦難擔憂。<\/strong>前兩個動作，是享受；最後一個「卻」字，是這一段最重的轉折。<\/p><p>「卻」字之前，所有的畫面，都是一個人與自己的關係：酒、油、床、歌。<strong>「卻」字之後，才出現第一個別人：約瑟。<\/strong>約瑟，就是北國的百姓，是那些在他們腳下、在他們桌邊、在他們田裡的人。經文說，他們有一個「苦難」，原文是「破碎」，好像一根骨頭斷了。那些人在痛，這些人卻不覺得。<\/p><p>阿摩司在這裡沒有指出具體的罪案，這一句，點出的只有一個缺：<strong>沒有難過。<\/strong>這是神在這一章最在意的一件事。祂不是要他們放棄酒、放棄油，祂在問：<strong>你的心，還能被別人的痛碰到嗎？<\/strong>聖經在別的地方，也這樣說：與哀哭的人要同哭（羅12:15）；若一個肢體受苦，所有的肢體就一同受苦（林前12:26）。這使我們想起：一個身體裡，最危險的不是痛，而是不覺得痛。<\/p><p>七節，神說了判決，卻不是任意的懲罰，是一個對稱：<strong>所以這些人必在被擄的人中首先被擄。<\/strong>他們一生追求「首」：最好的酒、最好的油、最前面的位子；結果，也在被擄的名單上，排在「首」。這不是神的玩笑，而是一個很安靜的哀歌：他們所抓住的第一，沒有一樣能保住他們。<\/p><p>本講義還要補一句：我們不用這一節，指責任何一個今天享受生活的人，也不計算誰有多少，或者誰該有多少。我們只把這一個問題，放在每個人面前：<strong>我最近一次，為別人的痛，真的難過，是什麼時候？<\/strong>若已經很久了，不用先自責，先對神說：求祢醫治我的心，讓我再有感覺。<\/p>"},{"a":8,"z":8,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>נִשְׁבַּע אֲדֹנָי יְהוִה בְּנַפְשׁוֹ נְאֻם יְהוָה אֱלֹהֵי צְבָאוֹת מְתָאֵב אָֽנֹכִי אֶת גְּאוֹן יַֽעֲקֹב וְאַרְמְנֹתָיו שָׂנֵאתִי וְהִסְגַּרְתִּי עִיר וּמְלֹאָֽהּ׃<\/p><\/blockquote>","lit":"<blockquote><p>「主耶和華－萬軍之神指著自己起誓說：我憎惡雅各的榮華，厭棄他的宮殿；因此，我必將城和其中所有的都交付敵人。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>起誓<\/td><td>נִשְׁבַּע<\/td><td>nishba<\/td><td>H7650<\/td><td>起誓、發誓<\/td><\/tr><tr><td>主<\/td><td>אֲדֹנָי<\/td><td>adonay<\/td><td>H136<\/td><td>主<\/td><\/tr><tr><td>自己<\/td><td>בְּנַפְשׁוֹ<\/td><td>benafsho<\/td><td>H5315<\/td><td>憑著祂自己（nefesh，生命、本身）<\/td><\/tr><tr><td>說<\/td><td>נְאֻם<\/td><td>ne'um<\/td><td>H5002<\/td><td>宣告、耶和華說<\/td><\/tr><tr><td>榮華<\/td><td>גְּאוֹן<\/td><td>geon<\/td><td>H1347<\/td><td>高傲、尊榮、驕傲<\/td><\/tr><tr><td>憎惡<\/td><td>מְתָאֵב<\/td><td>mete'ev<\/td><td>H8374<\/td><td>厭惡、深惡痛絕<\/td><\/tr><tr><td>宮殿<\/td><td>וְאַרְמְנֹתָיו<\/td><td>ve'armenotav<\/td><td>H759<\/td><td>堡壘、宮殿<\/td><\/tr><tr><td>交付<\/td><td>וְהִסְגַּרְתִּי<\/td><td>vehisgarti<\/td><td>H5462<\/td><td>關起來、交出去<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>指著自己起誓（nishba benafsho）<\/strong>：人起誓，要指著比自己更大的；神沒有更大的可以指，所以指著自己。希伯來書六章13節也有同樣的說法，說神因為沒有比自己更大的，就指著自己起誓。阿摩司書裡，神三次起誓：四章2節指著自己的聖潔，六章8節指著自己，八章7節指著雅各的榮耀。三處用的名稱不同，表示的都是同一個鄭重。<\/p><p><strong>榮華（geon）<\/strong>：這個字，有時是正面的「尊榮」，有時是負面的「驕傲」。八章7節，同一個詞組「雅各的榮耀」，是神起誓的對象；六章8節，卻是神憎惡的東西。同一個字，竟有兩種用法，所以有人讀成：神憎惡的，是他們把神所賜的尊榮，變成了自己的驕傲。<\/p><p><strong>憎惡（mete'ev）<\/strong>：這是整卷書裡，神最重的情感詞之一。與前面「我必」的審判語氣不同，這是神的內心說話。<\/p><p><strong>耶和華說（ne'um）<\/strong>：這是全卷書反覆出現的宣告格式。這一節，它的前面，是「指著自己起誓」，也就是神把自己押在這句話上。<\/p>","exp":"<p>八節，是這一章的轉彎。<strong>主耶和華－萬軍之神指著自己起誓說：我憎惡雅各的榮華，厭棄他的宮殿；因此，我必將城和其中所有的都交付敵人。<\/strong><\/p><p>先看「起誓」。人起誓，要指著比自己更大的；神沒有更大的，所以祂指著自己。一個人要說很重要的話的時候，會說「我拿我的生命保證」。神在這裡，等於說：<strong>這句話，我拿我自己擔保。<\/strong>祂不是隨口說的審判，也不是在盛怒中失控；祂以自己的名譽與性命，鄭重宣告。「耶和華說」這個全卷的記號，在這一節以最重的方式出現：神連起誓，都親自出面。<\/p><p>再看「憎惡」。我們很少讀到，神會對一樣東西說「憎惡」。在這一章，被憎惡的，是「雅各的榮華」和「宮殿」。我們要小心：神憎惡的，不是雅各這個人，也不是以色列這群人，而是他們把神所賜的尊榮，變成了自己的驕傲、把宮殿變成靠山。<strong>神可以愛一個人，卻憎惡他所倚靠的東西。<\/strong>這個分別，很要緊：祂不是要毀掉人，祂是要拆掉人與神之間，那一座擋著的城。<\/p><p>最後看「交付」。這個動詞，是「關起來、交出去」。神說：我必將城，和其中所有的，交付敵人。這不是一個冷冷的判決，而是從一位憎惡驕傲、卻深愛百姓的神口中說出來的。<strong>祂不是願意交出去，祂是先告訴你，好讓你回頭。<\/strong>這一點，我們在全卷的另一端（九章）看見：被擄的，最後仍有歸回。<\/p><p>我們讀到這裡，不需要被嚇到，也不用把它套在任何一個今天的城、國或政權上。我們只需要停下來，問一個簡單的問題：<strong>我心裡有沒有一座宮殿，是我最捨不得被神碰的地方？<\/strong><\/p>"},{"a":9,"z":11,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְהָיָה אִם יִוָּתְרוּ עֲשָׂרָה אֲנָשִׁים בְּבַיִת אֶחָד וָמֵֽתוּ וּנְשָׂאוֹ דּוֹדוֹ וּמְסָרְפוֹ לְהוֹצִיא עֲצָמִים מִן הַבַּיִת וְאָמַר לַאֲשֶׁר בְּיַרְכְּתֵי הַבַּיִת הַעוֹד עִמָּךְ וְאָמַר אָפֶס וְאָמַר הָס כִּי לֹא לְהַזְכִּיר בְּשֵׁם יְהוָֽה כִּֽי הִנֵּה יְהוָה מְצַוֶּה וְהִכָּה הַבַּיִת הַגָּדוֹל רְסִיסִים וְהַבַּיִת הַקָּטֹן בְּקִעִֽים׃<\/p><\/blockquote>","lit":"<blockquote><p>「那時，若在一房之內剩下十個人，也都必死。死人的伯叔，就是燒他屍首的，要將這屍首搬到房外，問房屋內間的人說：「你那裡還有人沒有？」他必說：「沒有」；又說：「不要作聲，因為我們不可提耶和華的名。」看哪，耶和華出令，大房就被攻破，小屋就被打裂。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>十個<\/td><td>עֲשָׂרָה<\/td><td>asarah<\/td><td>H6235<\/td><td>十<\/td><\/tr><tr><td>剩下<\/td><td>יִוָּתְרוּ<\/td><td>yivvaturu<\/td><td>H3498<\/td><td>留下、剩下<\/td><\/tr><tr><td>伯叔<\/td><td>דּוֹדוֹ<\/td><td>dodo<\/td><td>H1730<\/td><td>叔伯、親屬<\/td><\/tr><tr><td>燒他屍首的<\/td><td>וּמְסָרְפוֹ<\/td><td>umesarefo<\/td><td>H5635<\/td><td>焚化屍體的人（此字只出現一次）<\/td><\/tr><tr><td>不要作聲<\/td><td>הָס<\/td><td>has<\/td><td>H2013<\/td><td>噓、安靜<\/td><\/tr><tr><td>提<\/td><td>לְהַזְכִּיר<\/td><td>lehazkir<\/td><td>H2142<\/td><td>提起、記念、稱呼<\/td><\/tr><tr><td>名<\/td><td>בְּשֵׁם<\/td><td>beshem<\/td><td>H8034<\/td><td>名字<\/td><\/tr><tr><td>出令<\/td><td>מְצַוֶּה<\/td><td>metsavveh<\/td><td>H6680<\/td><td>吩咐、下令<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>十個人（asarah anashim）<\/strong>：十，是一個不大不小的整數，意思是就算一個大戶人家，只剩下這麼多人。我們不要把它與亞伯拉罕代求的十個義人（創18:32）直接連起來；經文沒有這個連結。<\/p><p><strong>燒他屍首的（mesarefo）<\/strong>：這個字整本聖經只出現一次，意義不很確定。有學者主張是「焚化屍體的人」，有學者主張是「負責處理後事的人」，也有學者根據字根，讀成「燒香的人」。和合本採第一種。這是一個難解的字，不用強解。<\/p><p><strong>不要作聲，因為我們不可提耶和華的名<\/strong>：這句話的意思，有三種讀法。第一，是害怕：剩下的人怕一提神的名，神又再降災。第二，是悲痛得不敢禱告：連神的名，都喊不出來。第三，是對神的不再相信：他們已經不願意向神求，所以叫對方別說。本講義不替說話的人定論，只看見：這是一群連呼求神名字的力氣，都沒有的人。<\/p><p><strong>耶和華出令（metsavveh）<\/strong>：重點是「出令」，是神親自下令，不是命運，也不是世事。<\/p>","exp":"<p>九到十一節，是整章最暗的一段，也最需要小心讀。<strong>那時，若在一房之內剩下十個人，也都必死。死人的伯叔，就是燒他屍首的，要將這屍首搬到房外，問房屋內間的人說：你那裡還有人沒有？他必說：沒有；又說：不要作聲，因為我們不可提耶和華的名。<\/strong><\/p><p>先看這個畫面。一座大房子，本來住了很多人；災難過後，只剩下十個人，連這十個，也都死了。後來有親人進去搬運屍體，走到房子的最裡面，輕輕問一句：「這裡還有人嗎？」回答是：「沒有。」然後，又加了一句，聲音壓得很低：「不要作聲。」<strong>這是整本阿摩司書，最安靜、最令人心痛的一個畫面。<\/strong><\/p><p>為什麼說「不可提耶和華的名」？經文沒有解釋。我們看見的是：這家人，已經不敢禱告了。這句話有可能是怕再次引來災禍，有可能是悲痛到說不出口，也有可能，是信心已經斷了。<strong>不論是哪一種，這都是一群失去了聲音的人。<\/strong>先知留給我們的，不是一個結論，是一個沉默。<\/p><p>我們讀這幾節，請特別留意兩件事。第一，這不是用來嚇唬人的經文。阿摩司的用意，不是要我們害怕，而是要我們看見：<strong>安逸一旦成為審判，連最基本的禱告，也會被奪走。<\/strong>所以，趁著還能開口的時候，趁著還能提耶和華的名的時候，要開口。第二，我們不用這幾節，去解釋今天任何一場災難，也不對正在失去親人的人，說「這是神的審判」。對受傷、正在喪慟的人，我們該做的，是安靜陪著，並一同守住神的名。<\/p><p>十一節，用一句話，把整段收起來：<strong>看哪，耶和華出令，大房就被攻破，小屋就被打裂。<\/strong>大房小屋，都在祂的命令下。這個命令，不是亂的，也不是偏心的；它提醒我們，不管是宮殿，還是小屋，沒有一個地方，能夠逃出神的眼睛。這是一個很嚴肅的提醒，也是一個很公平的提醒。<\/p>"},{"a":12,"z":12,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הַיְרֻצוּן בַּסֶּלַע סוּסִים אִֽם יַחֲרוֹשׁ בַּבְּקָרִים כִּֽי הֲפַכְתֶּם לְרֹאשׁ מִשְׁפָּט וּפְרִי צְדָקָה לְלַעֲנָֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「馬豈能在崖石上奔跑？人豈能在那裡用牛耕種呢？你們卻使公平變為苦膽，使公義的果子變為茵蔯。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>崖石<\/td><td>בַּסֶּלַע<\/td><td>bassela<\/td><td>H5553<\/td><td>岩石、崖石<\/td><\/tr><tr><td>奔跑<\/td><td>הַיְרֻצוּן<\/td><td>hayerutsun<\/td><td>H7323<\/td><td>奔跑<\/td><\/tr><tr><td>耕種<\/td><td>יַחֲרוֹשׁ<\/td><td>yaharosh<\/td><td>H2790<\/td><td>耕田、犁田<\/td><\/tr><tr><td>變<\/td><td>הֲפַכְתֶּם<\/td><td>hafakhtem<\/td><td>H2015<\/td><td>翻轉、倒過來<\/td><\/tr><tr><td>公平<\/td><td>מִשְׁפָּט<\/td><td>mishpat<\/td><td>H4941<\/td><td>公平、公道、判斷<\/td><\/tr><tr><td>苦膽<\/td><td>לְרֹאשׁ<\/td><td>lerosh<\/td><td>H7219<\/td><td>毒草、苦味的毒物<\/td><\/tr><tr><td>公義<\/td><td>צְדָקָה<\/td><td>tsedaqah<\/td><td>H6666<\/td><td>公義、正直<\/td><\/tr><tr><td>茵蔯<\/td><td>לְלַעֲנָֽה<\/td><td>lela'anah<\/td><td>H3939<\/td><td>苦艾、苦味的草<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>用牛耕種呢（bavbaqarim）<\/strong>：這一句的原文有兩種讀法。依傳統的希伯來文本，是「人豈能在那裡用牛耕種呢」，也就是和合本的讀法。有些學者把「用牛」(baqarim) 的字母重新分割，讀成「用牛在海裡耕種」（baqar yam），這樣兩個問題就都是不可能的事：馬在崖石上跑，牛在海裡耕。本講義依和合本的讀法，意思不變：這是兩個荒謬、不可能的事。<\/p><p><strong>公平、公義（mishpat、tsedaqah）<\/strong>：這是全卷最重要的一對字，五章7節、24節已經出現過；六章12節是第三次。<strong>mishpat<\/strong> 是公道的判斷，讓每個人得到應得的；<strong>tsedaqah<\/strong> 是正直的關係，一個人對神、對人，都站在對的位置上。<\/p><p><strong>苦膽（rosh）<\/strong>：和合本譯作「苦膽」，原文是一種有毒的苦草或其汁液，在申命記29章18節和何西阿書10章4節也出現。跟五章7節的「茵蔯」放在一起，是一對：先是毒，再是苦。<\/p><p><strong>使……變為（hafakh）<\/strong>：這是一個很強的動詞，「翻轉」，也用在所多瑪與蛾摩拉被傾覆的故事。他們不是不小心做錯，而是把公平整個翻過來。<\/p>","exp":"<p>十二節，先問兩個問題：<strong>馬豈能在崖石上奔跑？人豈能在那裡用牛耕種呢？<\/strong>這兩個問題，答案都是：不能。馬蹄在石頭上會折斷，牛犁在石頭上會壞掉。這是人人都知道的事，不需要先知教。<\/p><p>然後，一個「卻」字，把問題轉到他們身上：<strong>你們卻使公平變為苦膽，使公義的果子變為茵蔯。<\/strong>意思是：你們明明知道，馬不能在崖石上跑，卻把公平這塊本來可以長出好果子的地，變成毒草與苦艾。<strong>這是比崖石上耕種，更荒謬的事。<\/strong><\/p><p>我們留意兩個重點。第一，這一節把「公平」和「公義」，並排放在一起。這兩個字，在整卷阿摩司書，是最重要的一對。五章24節，神說：<strong>惟願公平如大水滾滾，使公義如江河滔滔。<\/strong>那是神的期望；六章12節，是人的回答：把它變成毒。我們也記得，五章21到24節，並不是叫人不再敬拜，是叫敬拜與公平公義，不要分開。六章，是同一個意思的另一面：安逸的人，一面享受，一面讓公平變苦；他們敬拜，卻沒有一個果子，能給別人嚐。<\/p><p>第二，「變為」這個動詞，是翻轉。神要的公義，是一棵會結甜果子的樹，要讓飢餓的人嚐到，也要讓受傷的人吃得飽。他們把樹翻過來，結出毒。<strong>我們很少是有意識地，把公平變成毒；更多的時候，是我們什麼都不做，公平就自己變苦了。<\/strong>安逸，就是這個過程的名字。<\/p><p>要提醒自己：神所要的公義，不是一套社會制度，也不是一場運動；它是從認識神而來的。<strong>認識神，才有公義的果子；沒有認識神，再努力，也會變成另一種自誇。<\/strong>下一節，先知就講到這個自誇。<\/p>"},{"a":13,"z":14,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הַשְּׂמֵחִים לְלֹא דָבָר הָאֹמְרִים הֲלוֹא בְחָזְקֵנוּ לָקַחְנוּ לָנוּ קַרְנָֽיִם כִּי הִנְנִי מֵקִים עֲלֵיכֶם בֵּית יִשְׂרָאֵל נְאֻם יְהוָה אֱלֹהֵי הַצְּבָאוֹת גּוֹי וְלָחֲצוּ אֶתְכֶם מִלְּבוֹא חֲמָת עַד נַחַל הָעֲרָבָֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「你們喜愛虛浮的事，自誇說：我們不是憑自己的力量取了角嗎？耶和華、萬軍之神說：以色列家啊，我必興起一國攻擊你們；他們必欺壓你們，從哈馬口直到亞拉巴的河。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>喜愛<\/td><td>הַשְּׂמֵחִים<\/td><td>hasseme'him<\/td><td>H8055<\/td><td>歡喜、喜樂的人<\/td><\/tr><tr><td>虛浮的事<\/td><td>דָבָר<\/td><td>davar<\/td><td>H1697<\/td><td>事、話（與「無」連用：虛無的事）<\/td><\/tr><tr><td>力量<\/td><td>בְחָזְקֵנוּ<\/td><td>bekhozqenu<\/td><td>H2392<\/td><td>憑著我們的力量<\/td><\/tr><tr><td>角<\/td><td>קַרְנָֽיִם<\/td><td>qarnayim<\/td><td>H7161<\/td><td>角（也是一個地名）<\/td><\/tr><tr><td>興起<\/td><td>מֵקִים<\/td><td>meqim<\/td><td>H6965<\/td><td>興起、立起<\/td><\/tr><tr><td>國<\/td><td>גּוֹי<\/td><td>goy<\/td><td>H1471<\/td><td>國、外邦<\/td><\/tr><tr><td>欺壓<\/td><td>וְלָחֲצוּ<\/td><td>velahatsu<\/td><td>H3905<\/td><td>壓迫、擠壓<\/td><\/tr><tr><td>說<\/td><td>נְאֻם<\/td><td>ne'um<\/td><td>H5002<\/td><td>宣告、耶和華說<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>虛浮的事（lo davar）<\/strong>：原文是「無」加上「事」，字面意思是「沒有什麼的東西」。這個詞組，也可能是一個地名：羅底巴（Lo-debar），在約旦河東（參撒下9:4）。<strong>角（qarnayim）<\/strong>，字面是「兩角」，也可能是一個地名：加寧（Karnaim）。如果兩個都是地名，這一句是一個雙關：你們喜愛羅底巴，自誇說我們憑自己的力量取了加寧。意思是：歡喜在他們攻取的小城上，以為那是力量的證據。學者對這個讀法有不同意見，本講義把它列為一個可能的背景，不當成定論。<\/p><p><strong>角<\/strong>：在聖經裡，角是力量的象徵（詩75:10、89:17）；即使不當地名，「取了角」也是「得了勢」的意思。<\/p><p><strong>從哈馬口直到亞拉巴的河<\/strong>：「哈馬口」是以色列北界，亞拉巴的河是南界。這正是耶羅波安二世收回的疆界（王下14:25）。先知把他們最自豪的疆界，原封不動，變成壓迫他們的範圍。<\/p><p><strong>耶和華說（ne'um）<\/strong>：這是本章第二次使用這個宣告格式。第一次在八節，是神起誓；這一次，在全章最後，是神再一次親口承擔這句話。<\/p>","exp":"<p>十三節，先知聽見他們說的話。<strong>你們喜愛虛浮的事，自誇說：我們不是憑自己的力量取了角嗎？<\/strong>他們的自誇很簡單：我們有力量，我們得到了。這個「角」，是勢力，是勝利，是一個看得見的成績。<\/p><p>請你留意這一句的諷刺。<strong>他們喜愛的，在原文是「沒有什麼的東西」。<\/strong>他們得意於一件，其實不值一提的成就；卻用它，當作自己穩固的證明。有學者認為，這是在影射兩個小地方的名字，一個叫「羅底巴」（意思像是「無」），一個叫「加寧」（意思是「角」）。如果是這樣，先知說的就是：你們誇的，是一個叫「無」的地方，你們得的，只是一座叫「角」的小城，而且，你們以為是靠自己得的。不論是不是雙關，意思很清楚：<strong>最大的自誇，往往來自最小的成績。<\/strong><\/p><p>十四節，神的回答，沒有拖延：<strong>耶和華、萬軍之神說：以色列家啊，我必興起一國攻擊你們；他們必欺壓你們，從哈馬口直到亞拉巴的河。<\/strong>這裡的「興起」，是神的作為，不是歷史偶然。祂沒有說這個國是誰，我們也不替經文添補，只看見：<strong>神自己，是這件事的主。<\/strong><\/p><p>請看那條界線：從哈馬口，到亞拉巴的河。這正是耶羅波安二世收回的疆界，是他們最得意的版圖。結果，神說：你們最引以為傲的邊界，就是敵人欺壓你們的範圍。<strong>他們所靠的，變成他們所受的。<\/strong>這樣說，不是要幸災樂禍，是要指出：一個人若把靠山放在別處，終必有一天，那個靠山，也會成為壓力的出口。<\/p><p>阿摩司書讀到這裡，我們再回頭看開頭那一聲「有禍了」。<strong>全章從哀號開始，也在宣告中結束。<\/strong>先知不是在咒詛，他是在大聲提醒：還能回頭的時候，趁早回頭。神的宣告，是向還聽得見的人說的。耶和華說，這就是祂的真誠。<\/p><p>還有一件事，要補在這裡：我們不替這一節，劃出任何一個今天的疆界，也不拿它指責任何一個國家、一個政黨。我們只問：<strong>我最近在誇的是什麼？它是我憑自己取得的嗎？它是不是我最捨不得放下的那一個角？<\/strong><\/p>"}],"7":[{"a":1,"z":1,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>כֹּה הִרְאַנִי אֲדֹנָי יְהוִה וְהִנֵּה יוֹצֵר גֹּבַי בִּתְחִלַּת עֲלוֹת הַלָּקֶשׁ וְהִנֵּה לֶקֶשׁ אַחַר גִּזֵּי הַמֶּֽלֶךְ׃<\/p><\/blockquote>","lit":"<blockquote><p>「主耶和華指示我一件事：為王割菜之後，菜又發生；剛發生的時候，主造蝗蟲。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>指示<\/td><td>הִרְאַנִי<\/td><td>hir'ani<\/td><td>H7200<\/td><td>使我看見（異象）<\/td><\/tr><tr><td>主<\/td><td>אֲדֹנָי<\/td><td>adonay<\/td><td>H136<\/td><td>主<\/td><\/tr><tr><td>造<\/td><td>יוֹצֵר<\/td><td>yotser<\/td><td>H3335<\/td><td>塑造、造作<\/td><\/tr><tr><td>蝗蟲<\/td><td>גֹּבַי<\/td><td>govay<\/td><td>H1462<\/td><td>蝗蟲（成群的）<\/td><\/tr><tr><td>菜<\/td><td>לֶקֶשׁ<\/td><td>leqesh<\/td><td>H3954<\/td><td>後發的莊稼、青草<\/td><\/tr><tr><td>割菜<\/td><td>גִּזֵּי<\/td><td>gizzey<\/td><td>H1488<\/td><td>剪割、割下的草<\/td><\/tr><tr><td>王<\/td><td>הַמֶּֽלֶךְ<\/td><td>hamelekh<\/td><td>H4428<\/td><td>王<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>指示<\/strong>：הִרְאַנִי 是「使我看見」，主詞是主耶和華。<strong>異象是神指給他看的，不是先知自己想出來的。<\/strong>這個句式「主耶和華指示我一件事」，在本章出現三次，帶出三個異象。<\/p><p><strong>造<\/strong>：יוֹצֵר 是分詞，意思是「塑造者」，常用在陶匠塑造器皿。<strong>蝗蟲不是偶然冒出來的，是主在塑造。<\/strong><\/p><p><strong>菜<\/strong>：和合本註腳說「或譯：草」。לֶקֶשׁ 一般認為是春雨之後長出的後發莊稼。<strong>「為王割菜」<\/strong>（גִּזֵּי הַמֶּלֶךְ）字面是「王的割草」，不少學者理解為王先取的那一份，剩下的第二茬才是百姓的收成。這是推測，經文本身沒有解釋，講解時要說明這是推測。<\/p>","exp":"<p>第七章一開頭，換了體裁。前面六章，大半是神藉阿摩司說出的審判話；<strong>從這裡起，是阿摩司自己「看見」的異象，而且是主耶和華指示他的。<\/strong>先知不是在發表意見，他是站在神給他看的畫面前面。<\/p><p>第一個畫面是蝗蟲。時間很精確：<strong>為王割菜之後，菜又發生；剛發生的時候。<\/strong>也就是頭一茬被割走以後，地上剛長出來的新綠。照一般的理解，頭一茬歸王，這一茬才是百姓一年的指望。蝗蟲選在這個時候來，打中的是尋常人家最後的一點餘糧。<strong>災禍專找最軟的地方下手，這是我們讀這節時不能放過的。<\/strong><\/p><p>還有一句：<strong>主造蝗蟲。<\/strong>經文說蝗蟲是祂塑造的，這不是叫我們把每一場蝗災、每一次歉收，都說成某個人某件事的報應。這一句要放在先知的位置上讀：神藉著異象，向阿摩司指明，這一次逼近的災，不是自然的偶然，是神的手。<strong>我們不用這句話解釋今天任何一場災難，也不用它去責備受災的人。<\/strong><\/p>"},{"a":2,"z":3,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְהָיָה אִם כִּלָּה לֶֽאֱכוֹל אֶת עֵשֶׂב הָאָרֶץ וָאֹמַר אֲדֹנָי יְהוִה סְֽלַֽח נָא מִי יָקוּם יַֽעֲקֹב כִּי קָטֹן הֽוּא נִחַם יְהוָה עַל זֹאת לֹא תִהְיֶה אָמַר יְהוָֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「蝗蟲吃盡那地的青物，我就說：「主耶和華啊，求你赦免；因為雅各微弱，他怎能站立得住呢？」耶和華就後悔說：「這災可以免了。」」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>吃盡<\/td><td>כִּלָּה<\/td><td>killah<\/td><td>H3615<\/td><td>完畢、吃盡<\/td><\/tr><tr><td>赦免<\/td><td>סְֽלַֽח<\/td><td>selakh<\/td><td>H5545<\/td><td>赦免、寬恕<\/td><\/tr><tr><td>站立<\/td><td>יָקוּם<\/td><td>yaqum<\/td><td>H6965<\/td><td>起來、站立得住<\/td><\/tr><tr><td>雅各<\/td><td>יַֽעֲקֹב<\/td><td>ya'aqov<\/td><td>H3290<\/td><td>雅各（指以色列民）<\/td><\/tr><tr><td>微弱<\/td><td>קָטֹן<\/td><td>qaton<\/td><td>H6996<\/td><td>小、微弱<\/td><\/tr><tr><td>後悔<\/td><td>נִחַם<\/td><td>nikham<\/td><td>H5162<\/td><td>後悔、改變心意、懊悔<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>赦免<\/strong>：סְלַח 在舊約只用在神身上，赦免的主詞永遠是神。<strong>阿摩司求的是赦免，不是只求「止住蝗蟲」；他先承認，這是需要赦免的百姓。<\/strong><\/p><p><strong>站立得住<\/strong>：מִי יָקוּם יַעֲקֹב，直譯是「雅各能起來嗎？誰能？」יָקוּם 是「起來、站起」，在這裡的意思是撐得住、翻得過身來。<strong>阿摩司的理由不是雅各有功德，而是雅各小。<\/strong>קָטֹן 是「小、微弱」，雅各小到禁不起。<\/p><p><strong>後悔<\/strong>：נִחַם 是舊約常見的動詞，用在神身上，意思是神改變了祂所定意要作的事（出32:14；珥2:13--14；拿3:10）。對這個字的理解，有三種：一，神真的改變了心意；二，這只是人的語言，描述神與禱告的人之間的交往，神的旨意並沒有變；三，神的「後悔」與民數記23:19「神不是人」那一類的話，要兩面並看。<strong>本講義的立場是：不拆開兩面，也不替神的內心下判決；我們只讀到，神聽見了一個小人的禱告，就止住了災。<\/strong>詳見本章議題。<\/p><p><strong>這災<\/strong>：זֹאת 是「這個」，指的就是異象裡那場蝗災，不是泛指一切災禍。<\/p>","exp":"<p>蝗蟲吃盡那地的青物。<strong>就在災難快要完成的時候，阿摩司開口了。<\/strong>經文沒有說他先想了什麼辦法，也沒有說他去召集人。他直接對主說：主耶和華啊，求你赦免。<\/p><p>這一句話裡有兩個地方，值得停下來。<strong>第一，他求的是赦免。<\/strong>他沒有說「我們沒有錯，為什麼是我們」。前面六章，阿摩司才剛把以色列的罪一條一條說完。他知道這群人該承受什麼，可是他仍然站在他們這一邊，求主赦免。先知是替人說神的話的人，也是替神的百姓向神說話的人。這兩個身分，在他身上沒有衝突。<\/p><p><strong>第二，他的理由是：雅各微弱，他怎能站立得住呢？<\/strong>他沒有誇耀雅各的好處，他指的是雅各的小。一個站不起來的人，求神看著他的軟弱。這是整章最重要的禱告方向：不是把自己說得夠好，而是把自己說得很小。<\/p><p>然後是第三節：<strong>耶和華就後悔說：這災可以免了。<\/strong>災被免了。經文沒有交代蝗蟲後來去了哪裡，也沒有說阿摩司的禱告有什麼特別的技巧。我們只知道，神聽見了，並且回應了。<strong>這是一個小人，向大神說了一句短短的禱告，神就回轉。<\/strong><\/p><p>我們要小心，不要從這裡推出一條規則：只要禱告得夠懇切，災就一定會止。<strong>經文是在記下這一次，不是在立一條保證。<\/strong>在整卷書的其他地方（例如四章6--11節），災也曾臨到，百姓卻沒有回頭。禱告不是操縱神的工具，是向一位有位格的神說話。<\/p>"},{"a":4,"z":4,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>כֹּה הִרְאַנִי אֲדֹנָי יְהוִה וְהִנֵּה קֹרֵא לָרִב בָּאֵשׁ אֲדֹנָי יְהוִה וַתֹּאכַל אֶת תְּהוֹם רַבָּה וְאָכְלָה אֶת הַחֵֽלֶק׃<\/p><\/blockquote>","lit":"<blockquote><p>「主耶和華又指示我一件事：他命火來懲罰以色列，火就吞滅深淵，險些將地燒滅。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>命<\/td><td>קֹרֵא<\/td><td>qore<\/td><td>H7121<\/td><td>呼叫、召來<\/td><\/tr><tr><td>懲罰<\/td><td>לָרִב<\/td><td>larib<\/td><td>H7378<\/td><td>為了爭訟、為了審理<\/td><\/tr><tr><td>火<\/td><td>בָּאֵשׁ<\/td><td>ba'esh<\/td><td>H784<\/td><td>用火<\/td><\/tr><tr><td>深淵<\/td><td>תְּהוֹם<\/td><td>tehom<\/td><td>H8415<\/td><td>深淵、深水<\/td><\/tr><tr><td>大的<\/td><td>רַבָּה<\/td><td>rabbah<\/td><td>H7227<\/td><td>大的、多的<\/td><\/tr><tr><td>地<\/td><td>הַחֵֽלֶק<\/td><td>hekheleq<\/td><td>H2506<\/td><td>份、產業<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>懲罰<\/strong>：לָרִב 的字根是「爭訟、辯論」，這個字常用在法庭上。<strong>和合本的「懲罰」把畫面譯成結果，原文的畫面是神「召來」火，為了跟百姓「辯理」。<\/strong>這裡的火，帶著訴訟的味道。<\/p><p><strong>深淵<\/strong>：תְּהוֹם רַבָּה 是「大深淵」，創世記1:2的「淵」就是同一個字，指的是地底與海洋的大水。<strong>火連大水也吞了。<\/strong><\/p><p><strong>地<\/strong>：הַחֵלֶק 的基本意思是「份」，指分給人的那一份產業，和合本譯成「地」，意思相近。<strong>火燒到的，是每一家分得的那一份。<\/strong>經文裡沒有說火是什麼，學者有人說是旱災，有人說是比喻；本講義不替它定義，只照原文讀。<\/p>","exp":"<p>第二個畫面：火。這一次不是從地上長出來的災，是神自己召來的。<strong>他命火來懲罰以色列，<\/strong>原文的意思是：召火來，為了跟百姓辯理。神沒有躲在背後，祂把案子拿出來。<\/p><p>火的大小，是整章最嚇人的地方：<strong>火就吞滅深淵，險些將地燒滅。<\/strong>火燒到連深淵的大水都吞了，接著要吃的，是每一家分得的那一份。這不是偶然的小火，是要把人最後的依靠都燒光的火。<\/p><p>請留意兩個異象的差別。<strong>第一個，災打在地上的青物；第二個，災打在深淵與產業。<\/strong>災難在升級，神給的機會卻沒有少。第二個異象之後，仍然有一次代求的空間。我們可以從這裡看到，神的審判不是一下子下來，是一步一步，每一步都給人時間。<\/p><p>也請留意，經文沒有告訴我們，這火在歷史上對應哪一件事。我們不替它找日期，也不替它找名字。<strong>要緊的是：先知看見了，並且開口了。<\/strong><\/p>"},{"a":5,"z":6,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וָאֹמַר אֲדֹנָי יְהוִה חֲדַל נָא מִי יָקוּם יַעֲקֹב כִּי קָטֹן הֽוּא נִחַם יְהוָה עַל זֹאת גַּם הִיא לֹא תִֽהְיֶה אָמַר אֲדֹנָי יְהוִֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「我就說：「主耶和華啊，求你止息；因為雅各微弱，他怎能站立得住呢？」耶和華就後悔說：「這災也可免了。」」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>止息<\/td><td>חֲדַל<\/td><td>khadal<\/td><td>H2308<\/td><td>停止、罷手<\/td><\/tr><tr><td>站立<\/td><td>יָקוּם<\/td><td>yaqum<\/td><td>H6965<\/td><td>起來、站立得住<\/td><\/tr><tr><td>雅各<\/td><td>יַעֲקֹב<\/td><td>ya'aqov<\/td><td>H3290<\/td><td>雅各（指以色列民）<\/td><\/tr><tr><td>微弱<\/td><td>קָטֹן<\/td><td>qaton<\/td><td>H6996<\/td><td>小、微弱<\/td><\/tr><tr><td>後悔<\/td><td>נִחַם<\/td><td>nikham<\/td><td>H5162<\/td><td>後悔、改變心意<\/td><\/tr><tr><td>也<\/td><td>גַּם<\/td><td>gam<\/td><td>H1571<\/td><td>也、同樣<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>止息<\/strong>：חֲדַל 是命令式，意思是「停止、住手」。第一次的禱告用的是「赦免」（סְלַח），第二次改成「止息」。<strong>有人認為，第二次的字眼比第一次更直接地求神住手；也有人認為，這只是同一個禱告的另一種說法。經文沒有解釋為什麼換字，我們只照實指出。<\/strong><\/p><p><strong>也可免了<\/strong>：גַּם הִיא 是「這個也是」，把第二次和第一次連在一起。<\/p><p>兩次的禱告理由，原文完全一樣：<strong>מִי יָקוּם יַעֲקֹב כִּי קָטֹן הוּא<\/strong>。一字不差。<\/p>","exp":"<p>阿摩司第二次開口，句型和第一次幾乎一樣：<strong>主耶和華啊，求你止息；因為雅各微弱，他怎能站立得住呢？<\/strong>原文的理由，一個字也沒有換。<\/p><p>這裡有一點可以學：<strong>在最大的火面前，他沒有換一個更漂亮的理由。<\/strong>他仍然說，雅各小。我們常以為，事情越大，禱告就越要有新的論點、新的說服。阿摩司讓我們看到另一個樣子：還是那一句，求你，我們實在太小了。<\/p><p>第六節，神又後悔：<strong>這災也可免了。<\/strong>「也」字，把這一次與上一次連在一起。兩次代求，兩次，神都聽。<\/p><p>讀到這裡，一個小人的形象已經很清楚。阿摩司是一個牧人，一個修理桑樹的人（7:14），他在大火面前，只拿得出一個理由：這群人太弱了。<strong>可是神看重這個理由。<\/strong>這不是說，軟弱本身有功勞，而是說，神是憐憫軟弱人的神。<\/p><p>另外，我們在這裡也要如實地看：這兩次的免災，不等於罪已經被處理。後面第三個異象馬上就要說，神的耐心有它的界線。<\/p>"},{"a":7,"z":7,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>כֹּה הִרְאַנִי וְהִנֵּה אֲדֹנָי נִצָּב עַל חוֹמַת אֲנָךְ וּבְיָדוֹ אֲנָֽךְ׃<\/p><\/blockquote>","lit":"<blockquote><p>「他又指示我一件事：有一道牆是按準繩建築的，主手拿準繩站在其上。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>站<\/td><td>נִצָּב<\/td><td>nitsav<\/td><td>H5324<\/td><td>站立、立著<\/td><\/tr><tr><td>牆<\/td><td>חוֹמַת<\/td><td>khomat<\/td><td>H2346<\/td><td>牆、城牆<\/td><\/tr><tr><td>準繩<\/td><td>אֲנָךְ<\/td><td>anakh<\/td><td>H594<\/td><td>鉛垂線（或作「錫」，見議題）<\/td><\/tr><tr><td>手<\/td><td>וּבְיָדוֹ<\/td><td>uvyado<\/td><td>H3027<\/td><td>在祂的手中<\/td><\/tr><tr><td>主<\/td><td>אֲדֹנָי<\/td><td>adonay<\/td><td>H136<\/td><td>主<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>準繩<\/strong>：אֲנָךְ 這個字在整本舊約只出現在7:7--8，意思不太確定。<strong>主要有兩種理解：一，鉛垂線，用來量牆直不直；二，錫，指牆是用錫造的，或指錫作成的測量器。<\/strong>古代譯本多數取「鉛垂線／量具」的意思，和合本也如此。本講義取「準繩」，同時指出這是不完全確定的字。詳見本章議題。<\/p><p><strong>站在其上<\/strong>：נִצָּב עַל 是「站在……上面」。這一次，主自己站在牆上，不是在遠處。<\/p>","exp":"<p>第三個畫面變了。蝗蟲、火，都是災；這一次，沒有災，只有一道牆，與一位站在牆上的主。<strong>有一道牆是按準繩建築的，主手拿準繩站在其上。<\/strong><\/p><p>經文沒有說牆是什麼。一般的理解是：牆代表以色列，是神所建立的百姓，牆本來是照著準繩、直直立起來的。現在，主手拿準繩，站在牆上，量這道牆還直不直。<\/p><p>請留意這個畫面和前兩個的差別：<strong>前兩次，阿摩司看見的是災，然後他開口；這一次，看見的是神自己站在那裡，拿著標準。<\/strong>災還沒有來，神先量。這是一個很安靜、很不舒服的畫面：沒有火、沒有蝗蟲，只有一條垂下去的線，貼著牆。<\/p><p>牆歪不歪，不是用人的眼睛判斷的，不是用誰的感覺判斷的，是用神手裡的那一條準繩。<strong>這提醒我們，判斷我們的標準，在神手上，不在我們自己手上。<\/strong><\/p>"},{"a":8,"z":9,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וַיֹּאמֶר יְהוָה אֵלַי מָֽה אַתָּה רֹאֶה עָמוֹס וָאֹמַר אֲנָךְ וַיֹּאמֶר אֲדֹנָי הִנְנִי שָׂם אֲנָךְ בְּקֶרֶב עַמִּי יִשְׂרָאֵל לֹֽא אוֹסִיף עוֹד עֲבוֹר לֽוֹ וְנָשַׁמּוּ בָּמוֹת יִשְׂחָק וּמִקְדְּשֵׁי יִשְׂרָאֵל יֶחֱרָבוּ וְקַמְתִּי עַל בֵּית יָרָבְעָם בֶּחָֽרֶב׃<\/p><\/blockquote>","lit":"<blockquote><p>「耶和華對我說：「阿摩司啊，你看見甚麼？」我說：「看見準繩。」主說：「我要吊起準繩在我民以色列中，我必不再寬恕他們。以撒的邱壇必然淒涼；以色列的聖所必然荒廢。我必興起，用刀攻擊耶羅波安的家。」」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>看見<\/td><td>רֹאֶה<\/td><td>ro'eh<\/td><td>H7200<\/td><td>看見<\/td><\/tr><tr><td>準繩<\/td><td>אֲנָךְ<\/td><td>anakh<\/td><td>H594<\/td><td>鉛垂線<\/td><\/tr><tr><td>吊起<\/td><td>שָׂם<\/td><td>sam<\/td><td>H7760<\/td><td>放置、設立<\/td><\/tr><tr><td>寬恕<\/td><td>עֲבוֹר<\/td><td>avor<\/td><td>H5674<\/td><td>越過、經過（放過）<\/td><\/tr><tr><td>邱壇<\/td><td>בָּמוֹת<\/td><td>bamot<\/td><td>H1116<\/td><td>高處、邱壇<\/td><\/tr><tr><td>以撒<\/td><td>יִשְׂחָק<\/td><td>yitskhaq<\/td><td>H3446<\/td><td>以撒（這裡是以色列的別稱）<\/td><\/tr><tr><td>荒廢<\/td><td>יֶחֱרָבוּ<\/td><td>yekherabu<\/td><td>H2717<\/td><td>荒廢、被毀<\/td><\/tr><tr><td>刀<\/td><td>בֶּחָֽרֶב<\/td><td>bekharev<\/td><td>H2719<\/td><td>用刀<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>不再寬恕<\/strong>：原文 לֹא אוֹסִיף עוֹד עֲבוֹר לוֹ，直譯是「我不再繼續越過他」。עָבַר 的本意是「經過」，這裡的「越過」是指神過去一次又一次把罪放過、不追究。<strong>神過去一次又一次沒有追究，這一次，祂宣告到此為止。<\/strong><\/p><p><strong>我必興起<\/strong>：וְקַמְתִּי 與7:2、5的「站立得住」（יָקוּם）是同一個字根。<strong>雅各站不起來，所以主要「起來」。<\/strong>這是原文的呼應，不能算作神學的定論，但值得留意。<\/p><p><strong>以撒<\/strong>：יִשְׂחָק 是「以撒」的另一種拼法，在先知書只用在這裡和7:16，是詩歌式的稱呼，指以色列。<\/p>","exp":"<p>這是整章的轉折。主問：<strong>阿摩司啊，你看見甚麼？<\/strong>阿摩司答：<strong>看見準繩。<\/strong>這一問一答，和耶利米書一章的杏樹枝、沸騰的鍋（耶1:11--13）有同樣的結構：神問，先知答，然後神解釋。<\/p><p>神的解釋有兩層。第一層是原則：<strong>我要吊起準繩在我民以色列中，我必不再寬恕他們。<\/strong>注意「我民」二字。神說「我民」，不是在丟棄他們，是在量一個自己的百姓。<strong>最嚴厲的審判，是從最近的關係裡出來的。<\/strong><\/p><p>「不再寬恕」的原文，是「不再繼續越過」。前兩次蝗蟲和火，神「越過」了，就是放過。現在祂說，這樣的放過，到此為止。<strong>阿摩司的兩次禱告是真實的，神的耐心也是真實的；可是耐心有它的界線，這個界線是神定的，不是人的禱告撐出來的。<\/strong><\/p><p>第二層是具體的後果，這一次說得很清楚：<strong>以撒的邱壇必然淒涼；以色列的聖所必然荒廢。<\/strong>被點名的，是宗教的地方。接著是政治的：<strong>我必興起，用刀攻擊耶羅波安的家。<\/strong>宗教中心與王室，是這個審判的兩個對象。<\/p><p>我們留意一件事：這一段裡，<strong>阿摩司沒有說話。<\/strong>前兩次他說了「求你」；這一次，經文只記他答了「看見準繩」，沒有記他求什麼。我們不能因此說，禱告已經被神禁止了——經文沒有這樣說。我們只能說，這一次，經文沒有記下代求。<\/p>"},{"a":10,"z":11,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וַיִּשְׁלַח אֲמַצְיָה כֹּהֵן בֵּֽית אֵל אֶל יָרָבְעָם מֶֽלֶךְ יִשְׂרָאֵל לֵאמֹר קָשַׁר עָלֶיךָ עָמוֹס בְּקֶרֶב בֵּית יִשְׂרָאֵל לֹא תוּכַל הָאָרֶץ לְהָכִיל אֶת כָּל דְּבָרָֽיו כִּי כֹה אָמַר עָמוֹס בַּחֶרֶב יָמוּת יָרָבְעָם וְיִשְׂרָאֵל גָּלֹה יִגְלֶה מֵעַל אַדְמָתֽוֹ׃<\/p><\/blockquote>","lit":"<blockquote><p>「伯特利的祭司亞瑪謝打發人到以色列王耶羅波安那裡，說：「阿摩司在以色列家中圖謀背叛你；他所說的一切話，這國擔當不起；因為阿摩司如此說：『耶羅波安必被刀殺；以色列民定被擄去離開本地。』」」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>亞瑪謝<\/td><td>אֲמַצְיָה<\/td><td>amatsyah<\/td><td>H558<\/td><td>亞瑪謝（耶和華是強壯）<\/td><\/tr><tr><td>祭司<\/td><td>כֹּהֵן<\/td><td>kohen<\/td><td>H3548<\/td><td>祭司<\/td><\/tr><tr><td>圖謀背叛<\/td><td>קָשַׁר<\/td><td>qashar<\/td><td>H7194<\/td><td>結黨、密謀<\/td><\/tr><tr><td>擔當不起<\/td><td>תוּכַל<\/td><td>tukhal<\/td><td>H3201<\/td><td>能夠、承受得住<\/td><\/tr><tr><td>容納<\/td><td>לְהָכִיל<\/td><td>lehakhil<\/td><td>H3557<\/td><td>容納、裝得下<\/td><\/tr><tr><td>刀<\/td><td>בַּחֶרֶב<\/td><td>bakherev<\/td><td>H2719<\/td><td>用刀<\/td><\/tr><tr><td>被擄<\/td><td>גָּלֹה<\/td><td>galoh<\/td><td>H1540<\/td><td>被擄、離開<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>圖謀背叛<\/strong>：קָשַׁר 的意思是「結黨、同謀」，用在謀反的事上（王下15:10）。<strong>亞瑪謝用的是政治案件的字眼。<\/strong><\/p><p><strong>擔當不起<\/strong>：לֹא תוּכַל הָאָרֶץ לְהָכִיל，直譯是「這地容不下」。<strong>亞瑪謝說的，是這片地容不下阿摩司的一切話，把一個人的話說成一個國家的重擔。<\/strong><\/p><p><strong>11節的引述<\/strong>：亞瑪謝報告：כֹּה אָמַר עָמוֹס，「阿摩司如此說」。<strong>注意：他說的是「阿摩司如此說」，不是「耶和華如此說」。<\/strong>阿摩司在7:9說的是神的話：「我必興起，用刀攻擊耶羅波安的家」，亞瑪謝的報告，把神的話收成了先知個人的話，並把「耶羅波安的家」改成「耶羅波安」本人。這一點是本講義的觀察，是看原文的結果，不是學界的定論。<\/p>","exp":"<p>異象忽然停止，經文換成一段故事。<strong>伯特利的祭司亞瑪謝打發人到以色列王耶羅波安那裡。<\/strong>伯特利，正是1:5、3:14、4:4、5:5 一再被點名的拜偶像中心；這位祭司，是這個地方的守門人。<\/p><p>他上報的話，值得細讀。第一句：<strong>阿摩司在以色列家中圖謀背叛你。<\/strong>這是政治罪名。第二句：<strong>他所說的一切話，這國擔當不起。<\/strong>這是在說，這個人太重了，一個國家裝不下。第三句，他引述阿摩司：<strong>耶羅波安必被刀殺；以色列民定被擄去離開本地。<\/strong><\/p><p>我們把亞瑪謝的報告，放在7:9旁邊讀。阿摩司原話的主詞是神：「我必興起」。亞瑪謝報告的主詞是阿摩司：「阿摩司如此說」。<strong>他沒有轉述「耶和華說」，他只轉述「阿摩司說」。<\/strong>這是一個很安靜的刪改，卻是整個衝突的核心：神的話，在一個守著聖所的人手裡，被收成一個人的意見，一個可以被處理的政治問題。<\/p><p>在這裡，我們要為被指控的人站穩：阿摩司沒有結黨，沒有拿起武器，他只是照他看見的說話。<strong>把神的話當成謀反的證據，是宗教權力最常見的辦法。<\/strong>我們也不從這裡推出任何現代的政治立場：經文講的是神的話，與守聖所的人之間的碰撞，不是替任何政權或政黨說話。<\/p>"},{"a":12,"z":13,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וַיֹּאמֶר אֲמַצְיָה אֶל עָמוֹס חֹזֶה לֵךְ בְּרַח לְךָ אֶל אֶרֶץ יְהוּדָה וֶאֱכָל שָׁם לֶחֶם וְשָׁם תִּנָּבֵֽא וּבֵֽית אֵל לֹֽא תוֹסִיף עוֹד לְהִנָּבֵא כִּי מִקְדַּשׁ מֶלֶךְ הוּא וּבֵית מַמְלָכָה הֽוּא׃<\/p><\/blockquote>","lit":"<blockquote><p>「亞瑪謝又對阿摩司說：「你這先見哪，要逃往猶大地去，在那裡糊口，在那裡說預言，卻不要在伯特利再說預言；因為這裡有王的聖所，有王的宮殿。」」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>先見<\/td><td>חֹזֶה<\/td><td>khozeh<\/td><td>H2374<\/td><td>先見、看異象的人<\/td><\/tr><tr><td>逃<\/td><td>בְּרַח<\/td><td>berakh<\/td><td>H1272<\/td><td>逃走、離開<\/td><\/tr><tr><td>糊口<\/td><td>לֶחֶם<\/td><td>lekhem<\/td><td>H3899<\/td><td>餅、糧食（吃飯）<\/td><\/tr><tr><td>說預言<\/td><td>תִּנָּבֵא<\/td><td>tinnave<\/td><td>H5012<\/td><td>作先知說話<\/td><\/tr><tr><td>再<\/td><td>תוֹסִיף<\/td><td>tosif<\/td><td>H3254<\/td><td>繼續、再一次<\/td><\/tr><tr><td>聖所<\/td><td>מִקְדַּשׁ<\/td><td>miqdash<\/td><td>H4720<\/td><td>聖所<\/td><\/tr><tr><td>宮殿<\/td><td>מַמְלָכָה<\/td><td>mamlakhah<\/td><td>H4467<\/td><td>王國、王朝<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>先見<\/strong>：חֹזֶה 是「看異象的人」，和 נָבִיא（先知）常常並用，沒有高低的分別（撒下24:11；代下9:29）。<strong>亞瑪謝叫他「先見」，不一定是貶低；也可能是想把他限制在一個職位的稱呼裡。經文沒有說他的語氣。<\/strong><\/p><p><strong>糊口<\/strong>：וֶאֱכָל שָׁם לֶחֶם 是「在那裡吃餅」，是個俗語，指靠這個謀生。<strong>亞瑪謝暗示，阿摩司說預言是為了生計。<\/strong>阿摩司在14節會直接回答這一點。<\/p><p><strong>不要再說預言<\/strong>：לֹא תוֹסִיף עוֹד לְהִנָּבֵא，直譯是「你不要再繼續說預言」。<strong>這與8節神的話「我不再繼續越過」用的是同一組字：לֹא אוֹסִיף עוֹד / לֹא תוֹסִיף עוֹד。<\/strong>神說「不再」，亞瑪謝也說「不再」，兩個「不再」，針對的是兩個對象。<\/p><p><strong>王的聖所<\/strong>：מִקְדַּשׁ מֶלֶךְ 是「王的聖所」。<strong>聖所被稱作王的，不是神的。<\/strong>這是整個衝突的關鍵：聖所的主人，被說成了王。<\/p>","exp":"<p>亞瑪謝向王報告完，轉身對阿摩司說話。第一句是：<strong>你這先見哪，要逃往猶大地去，在那裡糊口，在那裡說預言。<\/strong>這句話看起來是好意：回你的老家去，在那裡謀生，愛說什麼就說什麼。可是仔細聽，它是把阿摩司看成一個靠說預言吃飯的人，並把他的聲音限制在地理上：北國不要，南國隨便。<\/p><p>第二句才是真話：<strong>卻不要在伯特利再說預言；因為這裡有王的聖所，有王的宮殿。<\/strong>請注意：他說的是「王的聖所」，不是「耶和華的聖所」。<strong>聖所的主人，已經變成了王。<\/strong>一個本來是敬拜耶和華的地方，現在，連說什麼話都由王來定。<\/p><p>這一段，還有一組原文的呼應。8節，神說：我不再繼續越過他們。13節，亞瑪謝說：你不要再繼續說預言。<strong>神說「不再」，是因為百姓的罪滿了；亞瑪謝說「不再」，是因為他不要聽。<\/strong>這是同一個字眼，兩種完全不同的分量。<\/p><p>我們要記得，亞瑪謝也是一個人：他在這個體系裡，要保位置、要保王的恩寵。我們不替他貼標籤，只指出：<strong>當聖所的功用是替王服務時，神的話就會被當成威脅。<\/strong>這件事在任何時代，都可以發生在任何一個地方，包括教會。我們不用這節去指責今天任何一位講員或一間教會，只是用它來提醒自己，不要把神的話放在我們方便的範圍裡。<\/p>"},{"a":14,"z":14,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וַיַּעַן עָמוֹס וַיֹּאמֶר אֶל אֲמַצְיָה לֹא נָבִיא אָנֹכִי וְלֹא בֶן נָבִיא אָנֹכִי כִּֽי בוֹקֵר אָנֹכִי וּבוֹלֵס שִׁקְמִֽים׃<\/p><\/blockquote>","lit":"<blockquote><p>「阿摩司對亞瑪謝說：「我原不是先知，也不是先知的門徒。我是牧人，又是修理桑樹的。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>先知<\/td><td>נָבִיא<\/td><td>navi<\/td><td>H5030<\/td><td>先知<\/td><\/tr><tr><td>我<\/td><td>אָנֹכִי<\/td><td>anokhi<\/td><td>H595<\/td><td>我（強調）<\/td><\/tr><tr><td>門徒（兒子）<\/td><td>בֶן<\/td><td>ben<\/td><td>H1121<\/td><td>兒子、屬於……的人<\/td><\/tr><tr><td>牧人<\/td><td>בוֹקֵר<\/td><td>boqer<\/td><td>H951<\/td><td>牧牛的人<\/td><\/tr><tr><td>修理<\/td><td>וּבוֹלֵס<\/td><td>boles<\/td><td>H1103<\/td><td>修剪、培養（果子）<\/td><\/tr><tr><td>桑樹<\/td><td>שִׁקְמִֽים<\/td><td>shiqmim<\/td><td>H8256<\/td><td>桑樹（無花果桑）<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>我原不是先知<\/strong>：原文是 לֹא נָבִיא אָנֹכִי，沒有動詞「是」。<strong>沒有動詞，就要由讀者補：補現在式是「我不是先知」；補過去式是「我原不是（以前不是）先知」。<\/strong>和合本用過去式「原不是」，並且14節下半「我是牧人」用現在式。<\/p><p>對這句話，有三種理解：一，過去式：我在被召以前，不是先知，也不是先知的徒弟，我是牧人；（和合本、多數傳統）二，現在式：我不是職業先知，不是靠這個吃飯的，我的身分是牧人，這是亞瑪謝說「糊口」之後最直接的回答；三，現在式再加上一層：我不屬於任何先知學派。<strong>本講義的判斷：兩種時態都不改變核心意思：阿摩司說這話，是為了回答亞瑪謝「靠說預言糊口」的指控；他的權柄，不來自行業、不來自家學，而來自15節的「耶和華選召我」。<\/strong>也請留意，這句話不是貶低先知，更不是貶低裝備；詳見本章議題。<\/p><p><strong>先知的門徒<\/strong>：和合本註腳說：「原文是兒子」。בֶן־נָבִיא 在舊約是「先知的弟子」（王下2:3--7，4:1），指跟隨先知學習的人。<\/p><p><strong>牧人<\/strong>：בוֹקֵר 在阿摩司1:1的「牧人」是另一個字（נֹקֵד），這裡的字是「牧牛的人」。這是一個很細的差別。<strong>這個細節只提示：阿摩司的職業有兩個，牧養與修理桑樹，不是一個字面上的「牧羊人」那麼簡單。<\/strong><\/p>","exp":"<p>阿摩司回答了。這是整卷書唯一一段，他自己說自己的話。他說：<strong>我原不是先知，也不是先知的門徒。我是牧人，又是修理桑樹的。<\/strong><\/p><p>我們先把這句話放回現場讀。亞瑪謝剛剛說：去猶大糊口吧。阿摩司的回答，等於說：<strong>我不是靠這個吃飯的。<\/strong>我有自己的工作：養牛，修剪桑樹。我說預言，不是因為這是我的行業，也不是因為我出身在先知的圈子裡。<\/p><p>請不要把這句話讀成貶低。<strong>這一節沒有說「先知的行業不好」，也沒有說「受過訓練的人不屬神」。<\/strong>先知的門徒，在聖經裡也是神的百姓；先知的訓練，也是神所用的。阿摩司只是在這個場合，用最誠實的方式，回答一個指控：我說話，不是出於職位，也不是出於利益。同樣地，我們也不能反過來，把這節話說成「沒有受過裝備，反而更屬靈」。<strong>神可以用牧人，也可以用先知的門徒，也可以用祭司（耶利米、以西結都是祭司家的人）。召命在神，不在背景。<\/strong><\/p><p>還有一個細節：他列出的兩個工作，都是在地上做的、要流汗的、很少人看見的。修剪桑樹的人，要爬上樹，一個一個果子去劃開，使它成熟。這是一個不起眼的人。<strong>神選召的，常常是這樣的人。可是，神選召人，不是因為人不起眼，而是因為神要選召。<\/strong>這個差別很重要，因為我們很容易把軟弱浪漫化，也很容易把背景當成資格。<\/p>"},{"a":15,"z":15,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וַיִּקָּחֵנִי יְהוָה מֵאַחֲרֵי הַצֹּאן וַיֹּאמֶר אֵלַי יְהוָה לֵךְ הִנָּבֵא אֶל עַמִּי יִשְׂרָאֵֽל׃<\/p><\/blockquote>","lit":"<blockquote><p>「耶和華選召我，使我不跟從羊群，對我說：『你去向我民以色列說預言。』」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>選召（取）<\/td><td>וַיִּקָּחֵנִי<\/td><td>vayyiqqakheni<\/td><td>H3947<\/td><td>取了我、把我帶走<\/td><\/tr><tr><td>後面<\/td><td>מֵאַחֲרֵי<\/td><td>me'akharey<\/td><td>H310<\/td><td>從……後面<\/td><\/tr><tr><td>羊群<\/td><td>הַצֹּאן<\/td><td>hatson<\/td><td>H6629<\/td><td>羊群、牲畜群<\/td><\/tr><tr><td>去<\/td><td>לֵךְ<\/td><td>lekh<\/td><td>H3212<\/td><td>去<\/td><\/tr><tr><td>說預言<\/td><td>הִנָּבֵא<\/td><td>hinnave<\/td><td>H5012<\/td><td>作先知說話<\/td><\/tr><tr><td>我民<\/td><td>עַמִּי<\/td><td>ammi<\/td><td>H5971<\/td><td>我的百姓<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>選召<\/strong>：和合本的「選召」，原文是 וַיִּקָּחֵנִי，直譯是「祂把我取了、帶走了」，動詞 לָקַח 是「拿、取」。<strong>這個字比「選召」更具體：像牧人把一隻羊從群中領走，神把阿摩司從羊群後面領出來。<\/strong>「選召」是和合本的意譯，沒有錯，只是原文的畫面更直接。<\/p><p><strong>從羊群後面<\/strong>：מֵאַחֲרֵי הַצֹּאן 是「從羊群的後面」。大衛也是「從羊圈、從跟隨母羊」被召（撒下7:8；詩78:70--71）。<strong>牧人要走在羊的後面或旁邊，神把他從那個位置拿起來。<\/strong><\/p><p><strong>去<\/strong>：לֵךְ 和12節亞瑪謝的「去」（לֵךְ בְּרַח）是同一個字。亞瑪謝說：「去，逃往猶大」；神說：「去，向我民說預言」。<strong>兩個「去」，方向相反，授權的來源不同。<\/strong>這是原文的呼應，值得留意。<\/p>","exp":"<p>阿摩司接著說出他說預言的原因：<strong>耶和華選召我，使我不跟從羊群，對我說：你去向我民以色列說預言。<\/strong><\/p><p>這一句裡有三個動作：神取了我，神使我離開羊群，神對我說：去。<strong>每一個動詞的主詞，都是耶和華。<\/strong>阿摩司沒有說「我決定」，沒有說「我受了感動」，沒有說「我有恩賜」。他說的是：祂取了我，祂差我。<\/p><p>請看亞瑪謝與神，各說了一個「去」。<strong>亞瑪謝說：去，逃往猶大。神說：去，向我民說預言。<\/strong>阿摩司站在兩個「去」之間。這一刻，他要選擇聽哪一個。<strong>經文沒有記他有多大的勇氣，只記著，他是被神差去的。<\/strong>真正使他站得住的，不是膽量，是差遣。<\/p><p>這一節也是「召命」兩個字最真實的意思。召命不是在說：我很特別；召命是在說：祂叫我去，我就去。<strong>召命的重心是「誰叫的」，不是「誰被叫」。<\/strong>這樣，我們就不會把阿摩司看成一個被抬高的人，而是被差遣的人；也不會因為自己沒有背景、沒有裝備，就以為沒有分。反過來，也不會因為自己有背景、有裝備，就以為這是自己的本錢。<\/p><p>最後，這個「我民以色列」，與8節「我民以色列」完全一樣。<strong>神差他去的，是「我民」；神說「不再寬恕」的，也是「我民」。<\/strong>這是同一群人。神的愛，與神的審判，指向的是同一個對象。<\/p>"},{"a":16,"z":17,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְעַתָּה שְׁמַע דְּבַר יְהוָה אַתָּה אֹמֵר לֹא תִנָּבֵא עַל יִשְׂרָאֵל וְלֹא תַטִּיף עַל בֵּית יִשְׂחָֽק לָכֵן כֹּה אָמַר יְהוָה אִשְׁתְּךָ בָּעִיר תִּזְנֶה וּבָנֶיךָ וּבְנֹתֶיךָ בַּחֶרֶב יִפֹּלוּ וְאַדְמָתְךָ בַּחֶבֶל תְּחֻלָּק וְאַתָּה עַל אֲדָמָה טְמֵאָה תָּמוּת וְיִשְׂרָאֵל גָּלֹה יִגְלֶה מֵעַל אַדְמָתֽוֹ׃<\/p><\/blockquote>","lit":"<blockquote><p>「亞瑪謝啊，現在你要聽耶和華的話。你說：『不要向以色列說預言，也不要向以撒家滴下預言。』所以耶和華如此說：『你的妻子必在城中作妓女；你的兒女必倒在刀下。你的地必有人用繩子量了分取；你自己必死在污穢之地。以色列民定被擄去離開本地。』」」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>聽<\/td><td>שְׁמַע<\/td><td>shema<\/td><td>H8085<\/td><td>聽、聽從<\/td><\/tr><tr><td>話<\/td><td>דְּבַר<\/td><td>devar<\/td><td>H1697<\/td><td>話、言語<\/td><\/tr><tr><td>滴下（預言）<\/td><td>תַטִּיף<\/td><td>tattif<\/td><td>H5197<\/td><td>滴下、傾倒（說預言）<\/td><\/tr><tr><td>作妓女<\/td><td>תִּזְנֶה<\/td><td>tizneh<\/td><td>H2181<\/td><td>作妓女、行淫<\/td><\/tr><tr><td>繩子<\/td><td>בַּחֶבֶל<\/td><td>bakhevel<\/td><td>H2256<\/td><td>繩子、量地的繩<\/td><\/tr><tr><td>分取<\/td><td>תְּחֻלָּק<\/td><td>tekhullaq<\/td><td>H2505<\/td><td>被分割<\/td><\/tr><tr><td>污穢<\/td><td>טְמֵאָה<\/td><td>temeah<\/td><td>H2931<\/td><td>不潔淨的<\/td><\/tr><tr><td>被擄<\/td><td>גָּלֹה<\/td><td>galoh<\/td><td>H1540<\/td><td>被擄、離開<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>聽<\/strong>：שְׁמַע 是命令式，「你要聽」。<strong>本卷追蹤的「聽」字，在這裡出現。是對一位祭司說的：連祭司也要聽。<\/strong>全句 שְׁמַע דְּבַר יְהוָה，與申命記6:4 的「以色列啊，你要聽」是同一個動詞。<\/p><p><strong>滴下<\/strong>：תַטִּיף 是「滴下」，這個字也用在雅歌、箴言中形容蜜的滴下，在先知書也用在「說預言」（彌2:6、11，結21:2）。<strong>亞瑪謝說的「不要向以撒家滴下預言」，是他自己的措詞，他把預言說成像水一滴一滴地滴。<\/strong><\/p><p><strong>作妓女<\/strong>：תִּזְנֶה 在這裡的意思，歷來有兩種理解：一，字面，指城破之後，妻子淪落到被迫為娼的地步；二，在戰亂中被擄、受辱。無論哪一種，經文是在預告一個戰敗後的處境。<strong>主詞是妻子，她不是被審判的對象，她是丈夫的罪帶來的後果的承受者。<\/strong>這一點在牧養上很重要，詳見講章與議題。<\/p><p><strong>量了分取<\/strong>：חֶבֶל 是量地的繩，也就是土地被外人量了分掉。<strong>「準繩」（אֲנָךְ）與「繩子」（חֶבֶל）是兩個不同的字，不要混在一起。<\/strong><\/p>","exp":"<p>阿摩司沒有停在自己的身分上。他轉過身，對亞瑪謝說：<strong>亞瑪謝啊，現在你要聽耶和華的話。<\/strong>這是本卷「聽」字在本章的出處：<strong>連祭司，也要聽。<\/strong>那位站在守門位置上的人，要先聽。<\/p><p>然後，他把亞瑪謝剛才說的話，原樣還給他：<strong>你說：不要向以色列說預言，也不要向以撒家滴下預言。<\/strong>這是一個很安靜的動作：沒有罵人，沒有發怒，他只是複述對方說過的話，再說：<strong>所以，耶和華如此說。<\/strong>「所以」兩個字，把亞瑪謝說的話，與耶和華說的話，連起來：<strong>你怎樣阻擋神的話，神的話就怎樣臨到你。<\/strong><\/p><p>接著是五句話。我們要慢慢讀，也要小心讀。<strong>你的妻子必在城中作妓女；你的兒女必倒在刀下。你的地必有人用繩子量了分取；你自己必死在污穢之地。以色列民定被擄去離開本地。<\/strong>這是一段非常沉重的話。我們不要輕輕帶過，也不能把它講得好像是神喜歡的。<\/p><p>我們必須守住幾件事。第一，這是對亞瑪謝說的審判話，不是對所有受苦的妻子和兒女說的。<strong>經文沒有說，妻子和兒女有罪，也沒有說，今天在戰亂或暴力中受傷的人，是因為自己的罪。<\/strong>在戰爭裡，往往最先被傷害的，是最沒有權力的人。<strong>我們先陪伴受傷的人，不先去論斷任何人。<\/strong>第二，這一段不是一個預測時間的表，我們不去算它在歷史上哪一年發生。第三，結尾又回到那一句：<strong>以色列民定被擄去離開本地。<\/strong>與11節亞瑪謝的報告，一個字都沒有改。亞瑪謝向王轉述的這一句，與神最後說的，完全一樣。<\/p><p>最後，把這一章放在一起看：<strong>蝗蟲、火，神聽了小人的禱告；準繩，神的耐心有界線；亞瑪謝，神的話不能被收進一個人的口袋；阿摩司，被差遣的人站得住。<\/strong><\/p>"}],"8":[{"a":1,"z":2,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>כֹּה הִרְאַנִי אֲדֹנָי יְהוִה וְהִנֵּה כְּלוּב קָֽיִץ וַיֹּאמֶר מָֽה אַתָּה רֹאֶה עָמוֹס וָאֹמַר כְּלוּב קָיִץ וַיֹּאמֶר יְהוָה אֵלַי בָּא הַקֵּץ אֶל עַמִּי יִשְׂרָאֵל לֹא אוֹסִיף עוֹד עֲבוֹר לֽוֹ׃<\/p><\/blockquote>","lit":"<blockquote><p>「主耶和華又指示我一件事：我看見一筐夏天的果子。他說：「阿摩司啊，你看見甚麼？」我說：「看見一筐夏天的果子。」耶和華說：「我民以色列的結局到了，我必不再寬恕他們。」」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>看見（指示）<\/td><td>הִרְאַנִי<\/td><td>hir'ani<\/td><td>H7200<\/td><td>使我看見、指示我<\/td><\/tr><tr><td>一筐<\/td><td>כְּלוּב<\/td><td>kelub<\/td><td>H3619<\/td><td>籠、筐<\/td><\/tr><tr><td>夏天的果子<\/td><td>קָיִץ<\/td><td>qayits<\/td><td>H7019<\/td><td>夏末收下的熟果<\/td><\/tr><tr><td>結局<\/td><td>הַקֵּץ<\/td><td>haqqets<\/td><td>H7093<\/td><td>終結、盡頭<\/td><\/tr><tr><td>我民<\/td><td>עַמִּי<\/td><td>ammi<\/td><td>H5971<\/td><td>我的百姓<\/td><\/tr><tr><td>不再<\/td><td>אוֹסִיף<\/td><td>osif<\/td><td>H3254<\/td><td>我不再繼續（加添）<\/td><\/tr><tr><td>寬恕<\/td><td>עֲבוֹר<\/td><td>avor<\/td><td>H5674<\/td><td>越過、放過<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>夏天的果子（qayits）與結局（qets）<\/strong>：這兩個字，寫出來只差一個母音，唸出來幾乎同音，意思卻是一個「熟果」、一個「終結」。這是一個文字遊戲，和合本只能翻成「結局」，中文讀者聽不出來，所以講義補在這裡。阿摩司在異象裡看見的是熟果，神從熟果裡，讓他聽見終結。<\/p><p><strong>כְּלוּב（筐）<\/strong>：這個字，原文指編成的容器，耶利米書五章二十七節也用它，指裝滿鳥的籠子。這裡是一個盛著收下來的果子的筐，不是在樹上、還在長的果子。<\/p><p><strong>לֹא אוֹסִיף עוֹד עֲבוֹר לוֹ<\/strong>：字面是「我不再繼續越過他」。「越過」是從旁走過去、放過去的意思。和合本翻成「必不再寬恕」，方向是對的；這一句，與七章八節完全相同，是神在第三、第四個異象裡，同一種說法。<\/p>","exp":"<p>第一節，主耶和華「又」指示阿摩司一件事。<strong>這是第四個異象。<\/strong>前面有蝗災、有火、有準繩，現在是一筐夏天的果子。前兩個異象，阿摩司開口代求；到了準繩與這一筐果子，神問他看見什麼，他只回答他所看見的。這個對話的姿態很安靜：神不是對一個旁觀者宣判，是把一位僕人帶到祂的心意旁邊，讓他親眼看見，再親口說出來。<\/p><p><strong>一筐夏天的果子，是熟透、剛收下來的果子。<\/strong>熟果好看、好吃，可是不能放；放著，它就壞了。這一個畫面，對當時的以色列人，其實是甜的：那是耶羅波安二世年間，國土擴張，商業興盛，大家覺得日子正好。神卻在這個「正好」裡，讓阿摩司聽見另一個字：結局。<strong>熟，不是好消息；熟，是時候到了。<\/strong>這一點，我們不要讀得太快：神沒有說果子不好，神說的是，這一筐，已經到了不能再等的時候。<\/p><p>二節，神問：阿摩司啊，你看見什麼？這句話，與七章八節一樣，都是神用問話把先知帶進去。然後神說：<strong>「我民以色列的結局到了，我必不再寬恕他們。」<\/strong>請你留意，神說的是「我民」。祂沒有甩開他們，也沒有說「那些人」；一直到宣告結局的時候，祂仍稱他們是我的百姓。審判，是從一位仍然稱他們為我民的神口中說出來的。<\/p><p>「必不再寬恕」，原文是「不再繼續越過」。這是一個很像耐心用完的畫面：神一直從他們旁邊走過，放過、等待；現在，祂不再這樣走過去了。我們不算這是第幾次，也不推算什麼日子，只讀出一件事：<strong>神的耐心是真的，而這一次，祂說，不再越過。<\/strong>這是阿摩司書的重話，也是一位仍然說「我民」的神的重話。<\/p>"},{"a":3,"z":3,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְהֵילִילוּ שִׁירוֹת הֵיכָל בַּיּוֹם הַהוּא נְאֻם אֲדֹנָי יְהוִה רַב הַפֶּגֶר בְּכָל מָקוֹם הִשְׁלִיךְ הָֽס׃<\/p><\/blockquote>","lit":"<blockquote><p>「主耶和華說：「那日，殿中的詩歌變為哀號；必有許多屍首在各處拋棄，無人作聲。」」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>哀號<\/td><td>וְהֵילִילוּ<\/td><td>vehelilu<\/td><td>H3213<\/td><td>嚎啕、哀號<\/td><\/tr><tr><td>詩歌<\/td><td>שִׁירוֹת<\/td><td>shirot<\/td><td>H7892<\/td><td>詩歌、歌曲<\/td><\/tr><tr><td>殿<\/td><td>הֵיכָל<\/td><td>heykhal<\/td><td>H1964<\/td><td>殿、宮<\/td><\/tr><tr><td>在那日<\/td><td>בַּיּוֹם<\/td><td>bayyom<\/td><td>H3117<\/td><td>在那日<\/td><\/tr><tr><td>耶和華說<\/td><td>נְאֻם<\/td><td>ne'um<\/td><td>H5002<\/td><td>（主）宣告說<\/td><\/tr><tr><td>屍首<\/td><td>הַפֶּגֶר<\/td><td>happeger<\/td><td>H6297<\/td><td>屍體<\/td><\/tr><tr><td>拋棄<\/td><td>הִשְׁלִיךְ<\/td><td>hishlikh<\/td><td>H7993<\/td><td>拋出、扔下<\/td><\/tr><tr><td>作聲<\/td><td>הָֽס<\/td><td>has<\/td><td>H2013<\/td><td>安靜！噤聲<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>שִׁירוֹת הֵיכָל（殿中的詩歌）<\/strong>：這個詞，有兩種讀法。一，「殿（聖所）的詩歌」，和合本採這個；二，改一個母音，讀成「宮殿的歌女」（王宮裡唱歌的女子），意思是「王宮裡的歌女要哀號」。兩種讀法，都是「歌唱變成哀號」，只是地點是聖所還是王宮。本講義採和合本，同時承認這個爭議，不靠任何一種讀法立論。<\/p><p><strong>הָס（作聲）<\/strong>：這是一個短短的、像噓聲的感嘆詞，意思是「安靜！」。在這裡，沒有人敢出聲、沒有人有力氣出聲，只剩下沉默。<\/p><p><strong>נְאֻם（耶和華說）<\/strong>：這是全卷常見的「宣告」的字，是神自己說話的記號。八章三節、九節、十一節，都由主耶和華親自這樣宣告。<\/p>","exp":"<p>三節只有兩行，卻是整章最安靜的一幕。<strong>主耶和華說：那日，殿中的詩歌變為哀號。<\/strong>原本是唱詩的地方，現在是哭聲。這不是說唱詩是壞事，也不是說敬拜本身被神拒絕；整卷書另一處，神說的是沒有公義、沒有生命的敬拜，聲音再大，也到不了祂那裡。這裡，是連歌聲都被悲哀吞沒的一天。<\/p><p>接著是更沉重的畫面：<strong>必有許多屍首在各處拋棄，無人作聲。<\/strong>原文是「屍首很多，到處拋出」，然後只有一個字：噓。在這個場景裡，沒有人有力氣哭，也沒有人敢哭；那種安靜，比哭聲更可怕。我們讀這一節的時候，要記得，這是神給阿摩司的異象，是一位憂傷的神所說的話，不是一個興高采烈的預告。<\/p><p>請你留意，這句話是「主耶和華說」。<strong>神自己宣告審判，也自己承擔說出口的重量。<\/strong>祂在三節說，在九節說，在十一節又說；每一次，都是祂親自開口，沒有借別人的口。阿摩司的工作，是把神所說的原樣傳出來，不加油、不添醋。<\/p><p>這一節，也是這一章的第一個問題：<strong>當一個地方，連詩歌都變成了哀號，我們會問：是什麼，先把歌聲弄壞的？<\/strong>下面的四到六節，就給了答案：不是歌聲出了問題，是在歌聲之外，那個每天用天平、用升斗、用價錢，把人當成貨物的生活，出了問題。<\/p>"},{"a":4,"z":6,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>שִׁמְעוּ זֹאת הַשֹּׁאֲפִים אֶבְיוֹן וְלַשְׁבִּית עֲנִיֵּי אָֽרֶץ לֵאמֹר מָתַי יַעֲבֹר הַחֹדֶשׁ וְנַשְׁבִּירָה שֶּׁבֶר וְהַשַּׁבָּת וְנִפְתְּחָה בָּר לְהַקְטִין אֵיפָה וּלְהַגְדִּיל שֶׁקֶל וּלְעַוֵּת מֹאזְנֵי מִרְמָֽה לִקְנוֹת בַּכֶּסֶף דַּלִּים וְאֶבְיוֹן בַּעֲבוּר נַעֲלָיִם וּמַפַּל בַּר נַשְׁבִּֽיר׃<\/p><\/blockquote>","lit":"<blockquote><p>「你們這些要吞吃窮乏人、使困苦人衰敗的，當聽我的話！你們說：月朔幾時過去，我們好賣糧；安息日幾時過去，我們好擺開麥子；賣出用小升斗，收銀用大戥子，用詭詐的天平欺哄人，好用銀子買貧寒人，用一雙鞋換窮乏人，將壞了的麥子賣給人。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>當聽<\/td><td>שִׁמְעוּ<\/td><td>shim'u<\/td><td>H8085<\/td><td>你們要聽<\/td><\/tr><tr><td>吞吃<\/td><td>הַשֹּׁאֲפִים<\/td><td>hasho'afim<\/td><td>H7602<\/td><td>喘息著追逐、踐踏、吞吃<\/td><\/tr><tr><td>窮乏人<\/td><td>אֶבְיוֹן<\/td><td>evyon<\/td><td>H34<\/td><td>窮乏人（有所缺乏的人）<\/td><\/tr><tr><td>小升斗<\/td><td>אֵיפָה<\/td><td>efah<\/td><td>H374<\/td><td>量乾貨的升斗（伊法）<\/td><\/tr><tr><td>天平<\/td><td>מֹאזְנֵי<\/td><td>mozney<\/td><td>H3976<\/td><td>天平、秤<\/td><\/tr><tr><td>詭詐<\/td><td>מִרְמָֽה<\/td><td>mirmah<\/td><td>H4820<\/td><td>詭詐、欺騙<\/td><\/tr><tr><td>一雙鞋<\/td><td>נַעֲלָיִם<\/td><td>na'alayim<\/td><td>H5275<\/td><td>一雙鞋<\/td><\/tr><tr><td>壞了的麥子<\/td><td>וּמַפַּל<\/td><td>umappal<\/td><td>H4651<\/td><td>下腳、糠秕（落下的渣滓）<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>שׁאף（吞吃）<\/strong>：這個動詞，字義有「喘息追趕」「踐踏」「吞下去」幾種。二章七節同一個字，和合本翻成「踐踏」；這裡翻成「吞吃」。不論取哪個意思，畫面都是：窮人是被追著、被踩著、被吞下去的對象。<\/p><p><strong>וְלַשְׁבִּית（使衰敗）<\/strong>：這個字，與「安息日（שַׁבָּת）」是同一個字根的「停止」。和合本翻成「使困苦人衰敗」；有的譯本翻成「使地上的困苦人歸於無有」。這裡有一個很有意思的文字遊戲：他們盼望安息日趕快「過去」（停止），卻也正在使窮人「停止」存在。我們不能確定作者有意，只是記下這個聲音。<\/p><p><strong>איפה 與 שקל<\/strong>：伊法是量乾貨（糧食）的容量單位，舍客勒是秤銀子的重量單位。「使伊法縮小、使舍客勒加大」，就是賣出的量器做小、收銀的砝碼做重，一進一出，兩頭取利。<strong>מַפַּל בַּר<\/strong>是「麥子的下腳」，掉在地上、掃起來的渣滓，不是整粒麥子。<\/p>","exp":"<p>四節開頭是：<strong>當聽我的話！<\/strong>這是本章，也是全卷追蹤字「聽」的第一次出現。注意，這句話是對那些吞吃窮乏人的人說的，不是對窮人說的。神向他們說「當聽」，表示這一句不是審判的終局，而是一個還能回應的呼召。<strong>在宣告結局之後，神仍然說：你們要聽。<\/strong>這是十一節那一場「聽道的饑荒」，在這裡先埋下的伏筆。<\/p><p>五節，神替他們說出他們心裡的話：<strong>月朔幾時過去，我們好賣糧；安息日幾時過去，我們好擺開麥子。<\/strong>請你看這個畫面：這些人沒有不守節期，也沒有不守安息日；他們守，只是一邊守，一邊看錶，盼望它趕快過去。身體在安息裡，心已經回到了糧倉與店面。神所責備的，不是他們有敬拜，也不是做生意；是敬拜與安息，成了生意的紅燈，而不是生命的泉源。<\/p><p>接著是三樣手段：<strong>賣出用小升斗，收銀用大戥子，用詭詐的天平欺哄人。<\/strong>賣的時候，量器做小；收的時候，砝碼做大；天平本身，再動一個手腳。每一個環節，都是細小的、不容易被抓到的。箴言說過：詭詐的天平為耶和華所憎惡。<strong>這不是一個大惡人的故事，是一群很會做生意的人，在一次又一次的小動作裡，把人吃掉了。<\/strong><\/p><p>六節，把它說到最底：<strong>好用銀子買貧寒人，用一雙鞋換窮乏人，將壞了的麥子賣給人。<\/strong>「一雙鞋」，在二章六節出現過；這是一個很小的價錢，窮人的欠債小到一雙鞋，就可以換走一個人。再加上，把麥子的下腳，當成麥子賣給人。<strong>他們賣的是渣滓，買的是人。<\/strong>這樣的話，不是在罵生意人，是在替那些被當成價錢的人，說話。<\/p><p>我們要把三件事一起放好：第一，這裡的重點，是「人」；神一口氣用了好幾個稱呼：窮乏人、困苦人、貧寒人，每一個，都是有名字的人。第二，這不是在說有錢就有罪、做生意就有罪；神問的是，量器是不是公平、價錢是不是把人當人。第三，這不是一份社會改革的方案，是一位神，在為被吞吃的人，開口。<strong>受傷的人，先被看見；然後，欺壓的人，才被叫到跟前，要他們聽。<\/strong><\/p>"},{"a":7,"z":8,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>נִשְׁבַּע יְהוָה בִּגְאוֹן יַעֲקֹב אִם אֶשְׁכַּח לָנֶצַח כָּל מַעֲשֵׂיהֶֽם הַעַל זֹאת לֹֽא תִרְגַּז הָאָרֶץ וְאָבַל כָּל יוֹשֵׁב בָּהּ וְעָלְתָה כָאֹר כֻּלָּהּ וְנִגְרְשָׁה וְנִשְׁקְעָה כִּיאוֹר מִצְרָֽיִם׃<\/p><\/blockquote>","lit":"<blockquote><p>「耶和華指著雅各的榮耀起誓說：他們的一切行為，我必永遠不忘。地豈不因這事震動？其上的居民不也悲哀嗎？地必全然像尼羅河漲起，如同埃及河湧上落下。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>起誓<\/td><td>נִשְׁבַּע<\/td><td>nishba<\/td><td>H7650<\/td><td>起誓<\/td><\/tr><tr><td>榮耀<\/td><td>בִּגְאוֹן<\/td><td>bige'on<\/td><td>H1347<\/td><td>尊榮、驕傲<\/td><\/tr><tr><td>忘<\/td><td>אֶשְׁכַּח<\/td><td>eshkakh<\/td><td>H7911<\/td><td>我忘記<\/td><\/tr><tr><td>永遠<\/td><td>לָנֶצַח<\/td><td>lanetsakh<\/td><td>H5331<\/td><td>永遠、到底<\/td><\/tr><tr><td>行為<\/td><td>מַעֲשֵׂיהֶֽם<\/td><td>ma'aseyhem<\/td><td>H4639<\/td><td>他們的作為<\/td><\/tr><tr><td>震動<\/td><td>תִרְגַּז<\/td><td>tirgaz<\/td><td>H7264<\/td><td>顫抖、震動<\/td><\/tr><tr><td>悲哀<\/td><td>וְאָבַל<\/td><td>ve'aval<\/td><td>H56<\/td><td>哀傷、悲哀<\/td><\/tr><tr><td>尼羅河<\/td><td>כָאֹר<\/td><td>kha'or<\/td><td>H2975<\/td><td>像（尼羅）河<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>גְּאוֹן יַעֲקֹב（雅各的榮耀）<\/strong>：這個詞，在六章八節，神說「我憎惡雅各的榮華」，是一個神所厭惡的驕傲。這裡，有三種讀法：一，雅各的榮耀，指神自己（就如神「指著自己起誓」）；二，指以色列人所誇耀、所倚靠的榮華，神就指著他們的驕傲起誓，帶著反諷；三，指那塊地，或耶和華向雅各所顯的榮美。本講義承認這三種讀法，傾向二（因為六章八節同詞），但不把任何教訓建在這個選擇上。<\/p><p><strong>אִם אֶשְׁכַּח（我若忘記……）<\/strong>：這是起誓的句型，意思是「我若忘記……（願我受咒詛）」，也就是強烈的「我必不忘記」。和合本譯成「我必永遠不忘」。<\/p><p><strong>כָּאֹר（像尼羅河）<\/strong>：「אֹר」在這裡是借用埃及語的「尼羅河」，與九章五節同一個意象：整片地像尼羅河，漲起，又落下。<\/p>","exp":"<p>七節，神起誓。<strong>耶和華指著雅各的榮耀起誓說：他們的一切行為，我必永遠不忘。<\/strong>神起誓，是最重的承諾。雅各的榮耀到底指什麼，學者有幾種意見；不論是哪一種，這個誓的內容很清楚：<strong>一切行為，永遠不忘。<\/strong><\/p><p>這個「不忘」，是這一章裡，最需要停下來讀的句子。對那些吞吃窮乏人的人，這是警告；可是，對那些被吞吃的人，這是安慰。<strong>那些一雙鞋的價錢、那些下腳的麥子、那些沒有人記得的欠債，在神面前，沒有一筆被漏掉。<\/strong>人會忘記，帳本會被改，證人會離開；神說：我不忘。受傷的人不必擔心沒有人記得，神記得。<\/p><p>八節，是一連串的問句：<strong>地豈不因這事震動？其上的居民不也悲哀嗎？<\/strong>這一個「這事」，指的是四到六節那些事。這裡的意思是：這些看起來平常的小動作，不是小事；它們累積起來，地都會震動。然後是尼羅河的畫面：<strong>地必全然像尼羅河漲起，如同埃及河湧上落下。<\/strong>水漲起、又退下，一切都在動，沒有一個地方是穩的。<\/p><p>請你把這兩節連起來看：一邊是神說「我不忘」，一邊是地「震動」「悲哀」。<strong>神不是在遠處記帳，祂是在這片地上，和被壓傷的人一起悲哀。<\/strong>這是阿摩司書裡很少被注意到的一個溫度：審判的背後，是一位真的在意的神。<\/p>"},{"a":9,"z":10,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְהָיָה בַּיּוֹם הַהוּא נְאֻם אֲדֹנָי יְהוִה וְהֵבֵאתִי הַשֶּׁמֶשׁ בַּֽצָּהֳרָיִם וְהַחֲשַׁכְתִּי לָאָרֶץ בְּיוֹם אֽוֹר וְהָפַכְתִּי חַגֵּיכֶם לְאֵבֶל וְכָל שִֽׁירֵיכֶם לְקִינָה וְהַעֲלֵיתִי עַל כָּל מָתְנַיִם שָׂק וְעַל כָּל רֹאשׁ קָרְחָה וְשַׂמְתִּיהָ כְּאֵבֶל יָחִיד וְאַחֲרִיתָהּ כְּיוֹם מָֽר׃<\/p><\/blockquote>","lit":"<blockquote><p>「主耶和華說：到那日，我必使日頭在午間落下，使地在白晝黑暗。我必使你們的節期變為悲哀，歌曲變為哀歌。眾人腰束麻布，頭上光禿，使這場悲哀如喪獨生子，至終如痛苦的日子一樣。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>日頭<\/td><td>הַשֶּׁמֶשׁ<\/td><td>hashemesh<\/td><td>H8121<\/td><td>太陽<\/td><\/tr><tr><td>午間<\/td><td>בַּֽצָּהֳרָיִם<\/td><td>batsohorayim<\/td><td>H6672<\/td><td>在正午<\/td><\/tr><tr><td>黑暗<\/td><td>וְהַחֲשַׁכְתִּי<\/td><td>vehakhshakhti<\/td><td>H2821<\/td><td>我使（地）黑暗<\/td><\/tr><tr><td>節期<\/td><td>חַגֵּיכֶם<\/td><td>khaggekhem<\/td><td>H2282<\/td><td>你們的節期、朝聖的節慶<\/td><\/tr><tr><td>悲哀<\/td><td>לְאֵבֶל<\/td><td>le'evel<\/td><td>H60<\/td><td>成為哀傷<\/td><\/tr><tr><td>哀歌<\/td><td>לְקִינָה<\/td><td>leqinah<\/td><td>H7015<\/td><td>成為喪歌（輓歌）<\/td><\/tr><tr><td>麻布<\/td><td>שָׂק<\/td><td>saq<\/td><td>H8242<\/td><td>麻布（喪服）<\/td><\/tr><tr><td>獨生子<\/td><td>יָחִיד<\/td><td>yakhid<\/td><td>H3173<\/td><td>獨一的（獨生的）<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>הַשֶּׁמֶשׁ בַּצָּהֳרָיִם（日頭在午間落下）<\/strong>：「落下」與「使黑暗」，可以讀成真實的日蝕，也可以讀成「耶和華的日子」常有的黑暗意象（五章十八至二十節）。講義不判定，也不把這節拿來推算某一個日子。<\/p><p><strong>חַגֵּיכֶם（你們的節期）<\/strong>：這個字，是朝聖的、大型的節慶。五章二十一節，神說「我厭惡你們的節期」，那是同一個字。節期不是被廢掉，是節期的「歡慶」變成「哀傷」。<\/p><p><strong>יָחִיד（獨生的）與 אַחֲרִיתָהּ（至終）<\/strong>：「獨生子」是失去之中最痛的一種，因為是家的盼望與延續。「至終」原文是「它的後來、它的末了」，和合本譯成「至終如痛苦的日子一樣」，意思是：那個哀傷，連它的收尾，也是苦的，沒有一個回轉的地方。<\/p>","exp":"<p>九節，又是「主耶和華說」。<strong>到那日，我必使日頭在午間落下，使地在白晝黑暗。<\/strong>正午，是一天最亮的時候；在最亮的時候變暗，是一個完全顛倒的畫面。以色列人所盼望的「耶和華的日子」，是光；在這裡，卻是黑暗。我們不判斷這是一次真正的日蝕，還是一個圖畫；我們只讀見，神要讓人看見：他們以為最安穩、最光亮的時候，其實是最需要醒來的時候。<\/p><p>十節，是節期的結局：<strong>我必使你們的節期變為悲哀，歌曲變為哀歌。<\/strong>這與三節呼應：三節是「詩歌變為哀號」，十節是「歌曲變為哀歌」。歌，從頭到尾，都被悲哀接管。接著是喪禮的樣子：<strong>眾人腰束麻布，頭上光禿。<\/strong>那是人在最深的哀痛裡才有的外貌。<\/p><p>然後，神說了一句非常重的話：<strong>使這場悲哀如喪獨生子，至終如痛苦的日子一樣。<\/strong>失去獨生子，是最深的哀痛之一，那個家的盼望都斷了。神選了這個比喻，不是為了嚇人，是為了讓人知道，他們即將失去的，是那麼大的事。<strong>祂用人間最痛的哀傷，來形容這一天，因為祂自己，並不輕看這份痛。<\/strong><\/p><p>這裡，請你留心一個牧養的提醒：這是一個強烈的比喻，從來不是拿來對一位真正失去孩子的父母，說「這是神的審判」的話。我們讀這一節，是為了看見神的嚴肅，不是為了替任何一個人的喪子之痛，找出原因。<strong>真正在哀哭的人，先被陪伴；然後，才談其他。<\/strong><\/p>"},{"a":11,"z":12,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הִנֵּה יָמִים בָּאִים נְאֻם אֲדֹנָי יְהוִה וְהִשְׁלַחְתִּי רָעָב בָּאָרֶץ לֹֽא רָעָב לַלֶּחֶם וְלֹֽא צָמָא לַמַּיִם כִּי אִם לִשְׁמֹעַ אֵת דִּבְרֵי יְהוָֽה וְנָעוּ מִיָּם עַד יָם וּמִצָּפוֹן וְעַד מִזְרָח יְשֽׁוֹטְטוּ לְבַקֵּשׁ אֶת דְּבַר יְהוָה וְלֹא יִמְצָֽאוּ׃<\/p><\/blockquote>","lit":"<blockquote><p>「主耶和華說：日子將到，我必命饑荒降在地上。人飢餓非因無餅，乾渴非因無水，乃因不聽耶和華的話。他們必飄流，從這海到那海，從北邊到東邊，往來奔跑，尋求耶和華的話，卻尋不著。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>饑荒<\/td><td>רָעָב<\/td><td>ra'av<\/td><td>H7458<\/td><td>饑荒、飢餓<\/td><\/tr><tr><td>餅<\/td><td>לַלֶּחֶם<\/td><td>lallekhem<\/td><td>H3899<\/td><td>（為）餅、食物<\/td><\/tr><tr><td>乾渴<\/td><td>צָמָא<\/td><td>tsama<\/td><td>H6772<\/td><td>口渴<\/td><\/tr><tr><td>聽<\/td><td>לִשְׁמֹעַ<\/td><td>lishmoa<\/td><td>H8085<\/td><td>（為）聽<\/td><\/tr><tr><td>話<\/td><td>דִּבְרֵי<\/td><td>divrey<\/td><td>H1697<\/td><td>話語（的）<\/td><\/tr><tr><td>飄流<\/td><td>וְנָעוּ<\/td><td>venau<\/td><td>H5128<\/td><td>搖晃、飄蕩<\/td><\/tr><tr><td>尋求<\/td><td>לְבַקֵּשׁ<\/td><td>levaqesh<\/td><td>H1245<\/td><td>要尋找<\/td><\/tr><tr><td>尋不著<\/td><td>יִמְצָֽאוּ<\/td><td>yimtsa'u<\/td><td>H4672<\/td><td>他們找到（前有「不」）<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>כִּי אִם לִשְׁמֹעַ אֵת דִּבְרֵי יְהוָה（乃因不聽耶和華的話）<\/strong>：原文字面是「而是（為了）聽耶和華的話」，就是一場為著聽見耶和華的話的饑荒。和合本把它譯成「不聽」，帶出的是「聽不到」「不聽」這一層。這個字有兩個方向：一，神收回祂的說話（沉默是審判）；二，人拒絕聽（先前不肯聽，所以後來聽不到）。這兩個方向，本講義並陳，不排斥任何一個。<\/p><p><strong>נְאֻם（耶和華說）<\/strong>：十一節以「主耶和華說」開頭，是神親自宣告。這是全卷追蹤字「耶和華說」在本章最重的一次。<\/p><p><strong>רָעָב 與 צָמָא<\/strong>：飢與渴，是身體最基本的兩個需要。「非因無餅……非因無水」，是先否定身體的需要，再說出另一種更深的需要。<\/p>","exp":"<p>十一節，是這一章最著名的一節。<strong>主耶和華說：日子將到，我必命饑荒降在地上。人飢餓非因無餅，乾渴非因無水，乃因不聽耶和華的話。<\/strong>先請你留意，這句話，是「主耶和華說」。神自己宣告：不是阿摩司的猜想，不是某個人的恐嚇。<\/p><p>阿摩司書裡，饑荒不是新鮮的事（四章六節，神提過缺糧）。可是，這一次的饑荒，是另一種。<strong>餅有，水也有，倉裡有糧，街上有賣；可是，人的裡面空了，因為他們得不著神的話。<\/strong>這是一種誰都看不見、卻誰都感覺得到的飢餓：人吃飽了，仍然覺得缺；人賺了錢，仍然覺得空。<\/p><p>這和四節有關。四節，神對那些吞吃窮乏人的人說：<strong>當聽我的話！<\/strong>他們沒有聽。現在，十一節說：<strong>聽的饑荒要來了。<\/strong>前面，神一次又一次地說話，差先知，發警告，他們不要；後面，這個「不要」，變成了「沒有」。這不是一個冷冰冰的懲罰公式，而是一個很誠實的觀察：<strong>人若一直不聽，終有一天，會發現自己連想聽，都聽不到了。<\/strong><\/p><p>十二節，是這場饑荒的樣子：<strong>他們必飄流，從這海到那海，從北邊到東邊，往來奔跑，尋求耶和華的話，卻尋不著。<\/strong>他們東奔西跑，四處找，找一個先知、一句話、一個指引；可是，找不到。這是一幅極心酸的畫面：不是沒有人在尋求，是尋求得太晚。五章，神曾經說：你們要尋求我，就必存活；那時候他們沒有，現在才去，就找不著。<\/p><p>我們要小心，不要把這一節，變成對今天聽道的人的恐嚇。<strong>這是對那個不聽的國度的宣告，不是一個拿來嚇今日會眾的威脅。<\/strong>我們今天所處的位置，是神已經藉著祂的兒子說了話的位置（來一章一至二節）；神的話，開著，在我們面前。這一節，真正要說的是：<strong>現在，趁神還在說話，聽。<\/strong><\/p>"},{"a":13,"z":14,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>בַּיּוֹם הַהוּא תִּתְעַלַּפְנָה הַבְּתוּלֹת הַיָּפוֹת וְהַבַּחוּרִים בַּצָּמָֽא הַנִּשְׁבָּעִים בְּאַשְׁמַת שֹֽׁמְרוֹן וְאָמְרוּ חֵי אֱלֹהֶיךָ דָּן וְחֵי דֶּרֶךְ בְּאֵֽר שָׁבַע וְנָפְלוּ וְלֹא יָקוּמוּ עֽוֹד׃<\/p><\/blockquote>","lit":"<blockquote><p>「當那日，美貌的處女和少年的男子必因乾渴發昏。那指著撒馬利亞牛犢起誓的說：但哪，我們指著你那裡的活神起誓；又說：我們指著別是巴的神道起誓。這些人都必仆倒，永不再起來。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>處女<\/td><td>הַבְּתוּלֹת<\/td><td>habbetulot<\/td><td>H1330<\/td><td>年輕女子（未婚的）<\/td><\/tr><tr><td>發昏<\/td><td>תִּתְעַלַּפְנָה<\/td><td>tit'allafna<\/td><td>H5968<\/td><td>昏厥、軟弱暈倒<\/td><\/tr><tr><td>乾渴<\/td><td>בַּצָּמָֽא<\/td><td>batsama<\/td><td>H6772<\/td><td>因口渴<\/td><\/tr><tr><td>起誓<\/td><td>הַנִּשְׁבָּעִים<\/td><td>hannishba'im<\/td><td>H7650<\/td><td>那些指著……起誓的人<\/td><\/tr><tr><td>罪<\/td><td>בְּאַשְׁמַת<\/td><td>be'ashmat<\/td><td>H819<\/td><td>罪咎、有罪<\/td><\/tr><tr><td>活<\/td><td>חֵי<\/td><td>khey<\/td><td>H2416<\/td><td>活著的（起誓的句式）<\/td><\/tr><tr><td>道<\/td><td>דֶּרֶךְ<\/td><td>derekh<\/td><td>H1870<\/td><td>路、道<\/td><\/tr><tr><td>仆倒<\/td><td>וְנָפְלוּ<\/td><td>venaflu<\/td><td>H5307<\/td><td>跌倒<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>בְּאַשְׁמַת שֹׁמְרוֹן（指著撒馬利亞的罪）<\/strong>：和合本正文是「撒馬利亞牛犢」，註腳說「原文是罪」。「罪」這個字，有時可以指「因罪而來的偶像」，所以和合本取「牛犢」，指的大概是北國的金牛犢（列王紀上十二章）。本講義讀為撒馬利亞的罪（那個罪的記號、偶像），並承認和合本的讀法。<\/p><p><strong>חֵי אֱלֹהֶיךָ דָּן（但哪，你的神是活的）<\/strong>：註腳說，「神」原文是「活」。這是起誓的標準句型「某某活著」，和合本把它譯成「活神」。<\/p><p><strong>דֶּרֶךְ בְּאֵר שָׁבַע（別是巴的神道）<\/strong>：原文字面是「別是巴的道（路）」。有三種讀法：一，朝聖之路，也就是往別是巴去敬拜的道路（五章五節）；二，修改一個字母，讀為「你的神明」（與前一句平行）；三，指當地所設立的一種「敬拜的道」。和合本取「神道」，是順著第一種的延伸。這個句子，不論取哪種，意思相同：以色列人拿這些地方的神來起誓。<\/p>","exp":"<p>十三節，是十一、十二節的延續：<strong>當那日，美貌的處女和少年的男子必因乾渴發昏。<\/strong>請你留意，被點名的，不是老弱，是最有力氣的：美貌的少女、年輕的男子。連他們，都因渴昏過去。這句話，說的是這一場饑荒，沒有人能靠自己的力氣逃過去。力氣、青春、美貌，都擋不住裡面那種對神的話的渴。<\/p><p>十四節，是全章最後的畫面，也是最後的原因：<strong>那指著撒馬利亞牛犢起誓的說……這些人都必仆倒，永不再起來。<\/strong>他們起誓：「但哪，我們指著你那裡的活神起誓」；「我們指著別是巴的神道起誓」。但在北，別是巴在南，這是整個地從頭到尾的敬拜。<strong>他們很虔誠，也很愛起誓，只是他們所指著的，是錯的。<\/strong><\/p><p>這裡，有一個很重要的提醒：他們不是不敬拜，他們是敬拜得非常熱心。可是，敬拜的物件、敬拜的路，都已經偏了。這也是為什麼，十一節的饑荒，會是「聽不到耶和華的話」：<strong>因為他們一直在聽，只是聽的是別的聲音。<\/strong>他們有聖所，有誓言，有節期；他們缺的，是那一句耶和華真正說的話。<\/p><p>「永不再起來」，是一個重話，與五章二節的「跌倒，不得再起」呼應。我們讀這一句，要記得兩件事：一，這是對那些指著偶像起誓的人說的；二，在這一章之後，還有第九章，神的話並沒有停在這裡。<strong>審判是真的，可是阿摩司書的最後一句話，不是審判。<\/strong>本講義在這裡，不多說，只留一個位置給九章的盼望。<\/p>"}],"9":[{"a":1,"z":1,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>רָאִיתִי אֶת אֲדֹנָי נִצָּב עַֽל הַמִּזְבֵּחַ וַיֹּאמֶר הַךְ הַכַּפְתּוֹר וְיִרְעֲשׁוּ הַסִּפִּים וּבְצַעַם בְּרֹאשׁ כֻּלָּם וְאַחֲרִיתָם בַּחֶרֶב אֶהֱרֹג לֹֽא יָנוּס לָהֶם נָס וְלֹֽא יִמָּלֵט לָהֶם פָּלִֽיט׃<\/p><\/blockquote>","lit":"<blockquote><p>「我看見主站在祭壇旁邊；他說：你要擊打柱頂，使門檻震動，打碎柱頂，落在眾人頭上；所剩下的人，我必用刀殺戮，無一人能逃避，無一人能逃脫。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>主<\/td><td>אֲדֹנָי<\/td><td>adonay<\/td><td>H136<\/td><td>主<\/td><\/tr><tr><td>站<\/td><td>נִצָּב<\/td><td>nitsav<\/td><td>H5324<\/td><td>站立、站定<\/td><\/tr><tr><td>祭壇<\/td><td>הַמִּזְבֵּחַ<\/td><td>hamizbeakh<\/td><td>H4196<\/td><td>祭壇<\/td><\/tr><tr><td>擊打<\/td><td>הַךְ<\/td><td>hakh<\/td><td>H5221<\/td><td>擊打（單數命令）<\/td><\/tr><tr><td>柱頂<\/td><td>הַכַּפְתּוֹר<\/td><td>hakaftor<\/td><td>H3730<\/td><td>柱頂、柱頭的圓飾<\/td><\/tr><tr><td>逃避<\/td><td>יָנוּס<\/td><td>yanus<\/td><td>H5127<\/td><td>逃跑<\/td><\/tr><tr><td>逃脫<\/td><td>יִמָּלֵט<\/td><td>yimmalet<\/td><td>H4422<\/td><td>逃脫、被救出<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>站<\/strong>：原文是分詞「站著的」，不是「走過來」，是神已經站在那裡。先知說「我看見」，後面的話不是推論，是他親眼所見的異象。<\/p><p><strong>擊打<\/strong>：「擊打柱頂」的命令是單數，沒有說是誰接受命令；經文沒有交代，是天使、是神自己，還是別的使者，我們不替它補上。<\/p><p><strong>祭壇<\/strong>：經文沒有說是哪一座祭壇。有人想到伯特利（參七章13節），有人想到耶路撒冷，也有人認為，是故意不說，因為重點不在地點，而在站在祭壇旁邊的那一位。<\/p><p><strong>柱頂<\/strong>：原文 kaftor 是「柱頭的圓飾」；與九章7節的「迦斐託」（Kaftor，今日一般認為是克里特一帶）拼法相同，但那是另一個字（H3731）。兩處不要混在一起。<\/p>","exp":"<p>九章一節，是整卷書的最後一個異象。前面的蝗蟲、火、準繩、夏果，都是先知看見神預備要做的事；這一次，先知看見的，是<strong>主自己站在祭壇旁邊<\/strong>。祭壇，是人靠近神的地方，是獻祭、求赦免、求平安的地方。現在，神站在那裡，不是接受獻祭，而是下令。<\/p><p>祂說：<strong>你要擊打柱頂，使門檻震動，打碎柱頂，落在眾人頭上。<\/strong>這是一幅建築倒塌的畫面：最上面的柱頭被擊碎，整個屋頂與樑柱，都落下來，壓在裡面的人頭上。他們聚在一起敬拜的地方，成了他們自己的墳墓。經文沒有說這個地方具體是哪一間，我們不必也不應該替它補上；我們只看見：<strong>連敬拜的地方，也不能成為避難所。<\/strong><\/p><p>接著，有一句很重的話：<strong>所剩下的人，我必用刀殺戮，無一人能逃避，無一人能逃脫。<\/strong>原文用了兩個很接近的字：逃跑（nus）與逃脫（malat）。一個是人自己拔腿就跑，一個是被人救出；意思是：自己跑，跑不掉；別人救，也救不了。這是神對那些把平安放在聖殿、放在國防、放在宗教生活上的人，說的一個非常誠實的話。<\/p><p>請你先留意：這一節不是神的情緒，而是整卷書所說的公義。五章21至24節說，神厭惡的，是沒有生命、沒有公義的敬拜；九章一節，是同一件事的最後一幕。<strong>神不是反對祭壇，神是反對把祭壇當成保險。<\/strong>這一點，要兩面並陳：祭壇仍然是神設立的；只是，站在祭壇旁邊的那一位，不受任何儀式的管理。<\/p>"},{"a":2,"z":4,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>אִם יַחְתְּרוּ בִשְׁאוֹל מִשָּׁם יָדִי תִקָּחֵם וְאִֽם יַעֲלוּ הַשָּׁמַיִם מִשָּׁם אוֹרִידֵֽם וְאִם יֵחָֽבְאוּ בְּרֹאשׁ הַכַּרְמֶל מִשָּׁם אֲחַפֵּשׂ וּלְקַחְתִּים וְאִם יִסָּתְרוּ מִנֶּגֶד עֵינַי בְּקַרְקַע הַיָּם מִשָּׁם אֲצַוֶּה אֶת הַנָּחָשׁ וּנְשָׁכָֽם וְאִם יֵלְכוּ בַשְּׁבִי לִפְנֵי אֹֽיבֵיהֶם מִשָּׁם אֲצַוֶּה אֶת הַחֶרֶב וַהֲרָגָתַם וְשַׂמְתִּי עֵינִי עֲלֵיהֶם לְרָעָה וְלֹא לְטוֹבָֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「他們雖然挖透陰間，我的手必取出他們來；雖然爬上天去，我必拿下他們來；雖然藏在迦密山頂，我必搜尋，捉出他們來；雖然從我眼前藏在海底，我必命蛇咬他們；雖被仇敵擄去，我必命刀劍殺戮他們；我必向他們定住眼目，降禍不降福。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>陰間<\/td><td>בִשְׁאוֹל<\/td><td>vishol<\/td><td>H7585<\/td><td>陰間、死人所在之處<\/td><\/tr><tr><td>手<\/td><td>יָדִי<\/td><td>yadi<\/td><td>H3027<\/td><td>我的手<\/td><\/tr><tr><td>天<\/td><td>הַשָּׁמַיִם<\/td><td>hashamayim<\/td><td>H8064<\/td><td>天<\/td><\/tr><tr><td>迦密山頂<\/td><td>הַכַּרְמֶל<\/td><td>hakarmel<\/td><td>H3760<\/td><td>迦密山<\/td><\/tr><tr><td>海底<\/td><td>בְּקַרְקַע<\/td><td>bekarka<\/td><td>H7172<\/td><td>底、地面<\/td><\/tr><tr><td>蛇<\/td><td>הַנָּחָשׁ<\/td><td>hanakhash<\/td><td>H5175<\/td><td>蛇<\/td><\/tr><tr><td>從那裡<\/td><td>מִשָּׁם<\/td><td>misham<\/td><td>H8033<\/td><td>從那裡（五次重複）<\/td><\/tr><tr><td>擄去<\/td><td>בַשְּׁבִי<\/td><td>vashevi<\/td><td>H7628<\/td><td>被擄、俘虜<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>從那裡<\/strong>：「從那裡」（misham）在二至四節出現五次，每一次都接在「雖然」之後。這是一種很有力的重複：人說「我到了那裡」，神說「從那裡，我……」。<\/p><p><strong>雖然<\/strong>：原文是 im（「若」），連用五次，由最深（陰間）到最高（天），由山頂到海底，最後是被擄。<strong>方向是：上、下、山、海、人手<\/strong>。<\/p><p><strong>定住眼目<\/strong>：「向他們定住眼目」，原文是「把我的眼睛放在他們身上」。在聖經其他地方，這是看顧的用語（例如申命記十一章12節說「耶和華你神所眷顧之地」，眼目常在其上），這裡卻加上「降禍不降福」，是看顧的反面。<\/p><p><strong>迦密山<\/strong>：迦密山多洞穴、森林茂密，是人最容易藏身的地方；一章2節說「迦密山頂也枯乾」，這裡再一次，帶到迦密。<\/p>","exp":"<p>二至四節，是一首很短的逃亡詩。<strong>五個「雖然」，把人能想到的逃法，一個一個說完：<\/strong>往下，挖進陰間；往上，爬到天上；往高處，藏在迦密山頂；往深處，藏在海底；往遠處，被仇敵擄去。每一個「雖然」之後，神都說：<strong>從那裡<\/strong>，我的手、我的眼、我的蛇、我的刀，都在那裡等著。<\/p><p>請你留意，這些不是神在炫耀自己的力量，而是對那些以為「災禍追不上我們」的人（九章10節），一個很具體的回答。他們以為，只要躲得夠遠、守得夠緊，就能安全；神說：<strong>沒有一個地方，是祂不在的。<\/strong>詩篇一百三十九篇7至10節，用的是很接近的語言：「我若升到天上，你在那裡；我若在陰間下榻，你也在那裡。」但是，同一個「無處可逃」，在詩篇裡，是安慰：你的手必引導我；在阿摩司書裡，是審判：我的手必取出他們來。<strong>同樣的事實，對相信的人，是安慰；對自以為可以躲開神的人，是警告。<\/strong><\/p><p>四節最後一句，最沉重：<strong>我必向他們定住眼目，降禍不降福。<\/strong>神的眼睛，本來是看顧人的眼睛；現在，這一雙眼睛，仍然定睛在他們身上，只是定睛的結果，不是福，是禍。這不是神的眼睛變了，是人離開了神所定的路，眼目所看見的，成了審判。<\/p><p>我們讀這幾節，不要急著替自己找一個「可以逃的地方」，也不要急著說：這是講別人。<strong>先停下來，問自己：我心裡，有沒有一個「我只要躲在那裡，就沒有事」的地方？<\/strong>也許是一筆存款，一個身分，一份資歷，一個「我一直都在教會」的紀錄。神沒有說這些東西不好；神說的是：它們不是避難所。<\/p>"},{"a":5,"z":6,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וַאדֹנָי יְהוִה הַצְּבָאוֹת הַנּוֹגֵעַ בָּאָרֶץ וַתָּמוֹג וְאָבְלוּ כָּל יוֹשְׁבֵי בָהּ וְעָלְתָה כַיְאֹר כֻּלָּהּ וְשָׁקְעָה כִּיאֹר מִצְרָֽיִם הַבּוֹנֶה בַשָּׁמַיִם מַעֲלוֹתָיו וַאֲגֻדָּתוֹ עַל אֶרֶץ יְסָדָהּ הַקֹּרֵא לְמֵֽי הַיָּם וַֽיִּשְׁפְּכֵם עַל פְּנֵי הָאָרֶץ יְהוָה שְׁמֽוֹ׃<\/p><\/blockquote>","lit":"<blockquote><p>「主－萬軍之耶和華摸地，地就消化，凡住在地上的都必悲哀。地必全然像尼羅河漲起，如同埃及河落下。那在天上建造樓閣、在地上安定穹蒼、命海水澆在地上的－耶和華是他的名。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>摸<\/td><td>הַנּוֹגֵעַ<\/td><td>hanoge'a<\/td><td>H5060<\/td><td>觸摸、一碰<\/td><\/tr><tr><td>消化<\/td><td>וַתָּמוֹג<\/td><td>vattamog<\/td><td>H4127<\/td><td>融化、消化<\/td><\/tr><tr><td>悲哀<\/td><td>וְאָבְלוּ<\/td><td>ve'avelu<\/td><td>H56<\/td><td>哀悼<\/td><\/tr><tr><td>尼羅河<\/td><td>כַיְאֹר<\/td><td>khayor<\/td><td>H2975<\/td><td>河（特指尼羅河）<\/td><\/tr><tr><td>建造<\/td><td>הַבּוֹנֶה<\/td><td>habboneh<\/td><td>H1129<\/td><td>建造<\/td><\/tr><tr><td>樓閣<\/td><td>מַעֲלוֹתָיו<\/td><td>ma'alotav<\/td><td>H4609<\/td><td>登高處、階梯、樓閣<\/td><\/tr><tr><td>耶和華<\/td><td>יְהוָה<\/td><td>YHWH<\/td><td>H3068<\/td><td>耶和華<\/td><\/tr><tr><td>名<\/td><td>שְׁמֽוֹ<\/td><td>shemo<\/td><td>H8034<\/td><td>他的名<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>消化<\/strong>：和合本註腳說「原文是消化」。這個字（mug，H4127）意思是融化、軟化；<strong>九章13節「小山都必流奶」，原文用的是同一個字根<\/strong>（tit-moggaggnah）。地因神的觸摸「融化」，山因神的賜福「融化」，是同一個動詞的兩個方向。<\/p><p><strong>樓閣<\/strong>：原文 ma'alot 的意思，有「階梯」「登高處」「上層」多種可能。和合本取「樓閣」，描寫神在天上有居所；也有人讀作「天上的階梯」。無論哪一種，重點是：神是建造者。<\/p><p><strong>主－萬軍之耶和華<\/strong>：原文是「主耶和華，萬軍的」。三個稱呼疊在一起：主權、盟約之名、天上的軍隊。<\/p><p><strong>耶和華是他的名<\/strong>：這句話，在阿摩司書出現三次（四章13節、五章8節、九章6節），都是在審判之中的一首短頌歌的結尾，是整卷書最後一次的頌歌。<\/p>","exp":"<p>五、六節，是整卷書最後一首「頌歌」。前面有兩首：四章13節，說神造山、造風、把心意指示人；五章8節，說神造昴星與參星，叫晝變為夜。這是第三首，也是最後一首。三首都在審判最重的地方出現。這是一個很有意思的位置：<strong>在最嚴厲的話中間，先知停下來，要人看見說話的是誰。<\/strong><\/p><p>五節說：<strong>主－萬軍之耶和華摸地，地就消化。<\/strong>神只要「摸」一下，不需要用力，地就融化，凡住在地上的都悲哀。「像尼羅河漲起，如同埃及河落下」，是指尼羅河每年漲落的規律：地的起伏，在神的手中，像河水一樣，可大可小，來去自如。<\/p><p>六節是頌歌的收尾：祂在天上建造祂的樓閣，在地上安定祂的穹蒼，叫海水澆在地上。<strong>這位神，是造天、造地、管海水的神，不是任何一個民族的守護神，也不是祭壇旁邊的一個偶像。<\/strong>最後一句：<strong>耶和華是他的名。<\/strong>這是在審判的文章中，先知交給百姓的一個很簡單的認識：你們要面對的，是這位。<\/p><p>這三節，要與九章7節接起來讀：那位掌管海水、摸地的神，同時也是領以色列出埃及、領非利士人出迦斐託、領亞蘭人出吉珥的神。<strong>祂的大，不是用來嚇人，而是用來叫人知道：不能逃，也不用逃，因為祂也是帶領的那一位。<\/strong><\/p>"},{"a":7,"z":7,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הֲלוֹא כִבְנֵי כֻשִׁיִּים אַתֶּם לִי בְּנֵי יִשְׂרָאֵל נְאֻם יְהוָה הֲלוֹא אֶת יִשְׂרָאֵל הֶעֱלֵיתִי מֵאֶרֶץ מִצְרַיִם וּפְלִשְׁתִּיִּים מִכַּפְתּוֹר וַאֲרָם מִקִּֽיר׃<\/p><\/blockquote>","lit":"<blockquote><p>「耶和華說：以色列人哪，我豈不看你們如古實人嗎？我豈不是領以色列人出埃及地，領非利士人出迦斐託，領亞蘭人出吉珥嗎？」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>古實人<\/td><td>כֻשִׁיִּים<\/td><td>kushiyyim<\/td><td>H3569<\/td><td>古實人（尼羅河上游，今日一般指蘇丹一帶）<\/td><\/tr><tr><td>以色列<\/td><td>יִשְׂרָאֵל<\/td><td>yisra'el<\/td><td>H3478<\/td><td>以色列<\/td><\/tr><tr><td>耶和華說<\/td><td>נְאֻם<\/td><td>ne'um<\/td><td>H5002<\/td><td>耶和華的宣告<\/td><\/tr><tr><td>領上來<\/td><td>הֶעֱלֵיתִי<\/td><td>he'eleti<\/td><td>H5927<\/td><td>使上來、領出<\/td><\/tr><tr><td>埃及<\/td><td>מִצְרַיִם<\/td><td>mitsrayim<\/td><td>H4714<\/td><td>埃及<\/td><\/tr><tr><td>非利士人<\/td><td>וּפְלִשְׁתִּיִּים<\/td><td>ufelishtiyyim<\/td><td>H6430<\/td><td>非利士人<\/td><\/tr><tr><td>迦斐託<\/td><td>מִכַּפְתּוֹר<\/td><td>mikaftor<\/td><td>H3731<\/td><td>迦斐託（克里特一帶）<\/td><\/tr><tr><td>吉珥<\/td><td>מִקִּֽיר<\/td><td>mikkir<\/td><td>H7024<\/td><td>吉珥<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>古實人<\/strong>：古實是尼羅河上游的地方，在以色列人的眼中，是遠方、膚色不同、與自己無關的民族。九章7節說「如古實人」，並沒有貶低古實人，而是說：在神的眼中，你們並不比別的民族有更多的保障。<\/p><p><strong>豈不<\/strong>：原文是修辭問句（halo），預期答案是「是的」：是，祢領我們出了埃及；是，祢也領別人。<\/p><p><strong>耶和華說<\/strong>：原文 ne'um YHWH，是全卷書的追蹤字，在九章出現三次（8、12、13節）。這裡是第一次，放在一個很不舒服的問句中間，帶著不容人把這句話當作專利的意味。<\/p><p><strong>領上來<\/strong>：「領以色列人出埃及」，原文與出埃及的經典用語（如出三章8節）是同一個動詞「使上來」；非利士人、亞蘭人的「領出」，也用了同一個字。神用同一個動詞，說自己對三個民族所做的事。<\/p>","exp":"<p>七節，是阿摩司書最令人驚訝的一節之一。<strong>以色列人哪，我豈不看你們如古實人嗎？<\/strong>以色列人最可以誇口的，是出埃及：那是他們的創立之日，是神揀選的證據。神現在說：這件事，我對別人也做過。我領以色列出埃及，也領非利士人出迦斐託，領亞蘭人出吉珥。<\/p><p>這是一個很重要的轉折，要小心讀。<strong>神不是在說，出埃及沒有意義，也不是說，以色列不是祂的百姓。<\/strong>祂的意思是：你們不能把「我們是被領出來的」，當作「所以我們不會受審判」的理由。恩典的歷史，不是護身符。<\/p><p>請你留意另一件事：非利士人與亞蘭人，是以色列的仇敵。神在這裡說，祂也領他們，也眷顧他們的歷史。<strong>這是一個很大的啟示：神的眼目，比以色列的國界，大得多。<\/strong>這一點，與阿摩司書開頭向列國的審判（一至二章）一起讀：神向列國發怒，因為列國是祂所關心的受造者；神也領列國的歷史，因為祂是所有人的神。<\/p><p>今天我們讀，要避免兩個極端：一個是說「所以神不再看重以色列」，這不是經文的意思，因為八節立刻說「不將雅各家滅絕淨盡」；另一個是說「所以我們是教會，就不一樣」，這也不是。<strong>這一節是對所有以為自己有「身分保障」的人說的：你的身分，是神給你的恩典，不是你可以抵擋審判的理由。<\/strong><\/p>"},{"a":8,"z":10,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הִנֵּה עֵינֵי אֲדֹנָי יְהוִה בַּמַּמְלָכָה הַֽחַטָּאָה וְהִשְׁמַדְתִּי אֹתָהּ מֵעַל פְּנֵי הָאֲדָמָה אֶפֶס כִּי לֹא הַשְׁמֵיד אַשְׁמִיד אֶת בֵּית יַעֲקֹב נְאֻם יְהוָֽה כִּֽי הִנֵּה אָֽנֹכִי מְצַוֶּה וַהֲנִעוֹתִי בְכָֽל הַגּוֹיִם אֶת בֵּית יִשְׂרָאֵל כַּאֲשֶׁר יִנּוֹעַ בַּכְּבָרָה וְלֹֽא יִפּוֹל צְרוֹר אָֽרֶץ בַּחֶרֶב יָמוּתוּ כֹּל חַטָּאֵי עַמִּי הָאֹמְרִים לֹֽא תַגִּישׁ וְתַקְדִּים בַּעֲדֵינוּ הָרָעָֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「主耶和華的眼目察看這有罪的國，必將這國從地上滅絕，卻不將雅各家滅絕淨盡。這是耶和華說的。我必出令，將以色列家分散在列國中，好像用篩子篩穀，連一粒也不落在地上。我民中的一切罪人說：災禍必追不上我們，也迎不著我們。他們必死在刀下。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>眼目<\/td><td>עֵינֵי<\/td><td>eney<\/td><td>H5869<\/td><td>眼睛（複數）<\/td><\/tr><tr><td>有罪的<\/td><td>הַֽחַטָּאָה<\/td><td>hakhatta'ah<\/td><td>H2400<\/td><td>有罪的、犯罪的<\/td><\/tr><tr><td>滅絕<\/td><td>הַשְׁמֵיד<\/td><td>hashmed<\/td><td>H8045<\/td><td>滅絕（不定詞加強）<\/td><\/tr><tr><td>篩<\/td><td>וַהֲנִעוֹתִי<\/td><td>vahanoti<\/td><td>H5128<\/td><td>搖動、使搖動<\/td><\/tr><tr><td>篩子<\/td><td>בַּכְּבָרָה<\/td><td>bakkevarah<\/td><td>H3531<\/td><td>篩子<\/td><\/tr><tr><td>粒<\/td><td>צְרוֹר<\/td><td>tseror<\/td><td>H6872<\/td><td>小石、小粒、小包<\/td><\/tr><tr><td>罪人<\/td><td>חַטָּאֵי<\/td><td>khatta'ey<\/td><td>H2400<\/td><td>罪人（複數）<\/td><\/tr><tr><td>災禍<\/td><td>הָרָעָה<\/td><td>hara'ah<\/td><td>H7451<\/td><td>災禍、惡<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>滅絕<\/strong>：八節同一個字根出現三次（「滅絕」「滅絕」「滅絕淨盡」），後面一個是「不定詞加強形」（hashmed ashmid），表示「完完全全地滅絕」，前面再加一個「不」。<strong>神的但書，是對整個國家的審判之中，一個很強的否定：不完全滅絕。<\/strong><\/p><p><strong>國／家<\/strong>：八節說「這有罪的國」（mamlakhah）與「雅各家」（beit ya'aqov），用兩個不同的詞。國家（制度、政權）被滅絕，家（人）不被滅絕淨盡。<\/p><p><strong>篩子與粒<\/strong>：九節的「篩子」（kevarah）與「粒」（tseror）有一個解經上的難處。tseror 的基本意思，是「小石子」或「一小包」。所以「連一粒也不落在地上」有兩種讀法：（一）穀粒不落到地上：沒有一個神所揀選的人會真的失落；（二）小石子不落到地上：篩子留下的是石子（廢物），而不是穀物，意思是：每一個罪人都會被找出來。和合本取第一種。兩種讀法，都主張神的審判是精確的，不是亂打。<\/p><p><strong>災禍必追不上我們<\/strong>：九節的「我民中的一切罪人」，是說這些話的人，是神的百姓，不是外邦人。<\/p>","exp":"<p>八至十節，是整章的樞紐，也是整卷書最難讀的一段，因為它同時說了兩件事，一個是「必將這國從地上滅絕」，一個是「卻不將雅各家滅絕淨盡」。<strong>這兩句話，並不衝突，是同一個審判的兩面。<\/strong><\/p><p>八節說：主耶和華的眼目，察看這有罪的國。請你想起九章四節：「我必向他們定住眼目，降禍不降福」；同樣是「眼目」，那裡是人要逃的眼睛，這裡是察看的眼睛。神的眼目察看的結果，是這國要被除去。但緊接著，<strong>「卻不將雅各家滅絕淨盡」，這是這一章的第一個但書，在審判的話裡轉了一個彎。<\/strong>後面還加一句：這是耶和華說的。<strong>審判之中，也有耶和華說。<\/strong><\/p><p>九節給了一幅圖畫：神把以色列家分散在列國中，「好像用篩子篩穀」。篩穀的人，不是要毀掉穀子，而是要把不該留的篩出去，把該留的留下來。這裡有一個很有張力的畫面：被篩的過程，是搖動、是翻騰、是不安；但是，篩的目的，是要「連一粒也不落在地上」。<strong>搖動是真的，保全也是真的。<\/strong>篩子的搖動是痛的，卻不是亂搖。<\/p><p>十節說，真正被篩出去的，是誰？<strong>「我民中的一切罪人」，他們說：災禍必追不上我們，也迎不著我們。<\/strong>請你留意，這不是一般的罪人，是說「我們不會有事」的人。他們不是否認神，也不是不敬拜；他們只是，以為自己是例外。九章一節到四節已經說完了：沒有人是例外。<\/p><p>讀這一段，不要急著問「我是穀還是糠」，彷彿可以在審判之前，給自己一個答案。經文給的標準很簡單：<strong>你是不是那個說「災禍必追不上我」的人？<\/strong>如果是，就回頭；如果不是，不要被這一段嚇住，要記得八節的但書與九節的「連一粒也不落在地上」。路加福音二十二章31至32節，耶穌對西門彼得說：撒但想要篩你們像篩麥子一樣，但我已經為你祈求，叫你不至於失了信心。這是新約自己作出的呼應：篩，是真的；但有人在為你祈求。<\/p>"},{"a":11,"z":12,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>בַּיּוֹם הַהוּא אָקִים אֶת סֻכַּת דָּוִיד הַנֹּפֶלֶת וְגָדַרְתִּי אֶת פִּרְצֵיהֶן וַהֲרִֽסֹתָיו אָקִים וּבְנִיתִיהָ כִּימֵי עוֹלָֽם לְמַעַן יִֽירְשׁוּ אֶת שְׁאֵרִית אֱדוֹם וְכָל הַגּוֹיִם אֲשֶׁר נִקְרָא שְׁמִי ע
